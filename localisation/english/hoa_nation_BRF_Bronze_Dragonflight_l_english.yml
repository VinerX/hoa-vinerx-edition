bronzedragonflight.1.t:0 "Warning from Ysera"
bronzedragonflight.1.d:0 "Ysera has sent grave news. The Hakkari Tribe was never fully wiped out, and that they are thriving in the Swamp of Sorrows. She has already sent sentries to watch them and will personally be ready to destroy their civilization should any attempt to summon Atal’Hakkar be made."
bronzedragonflight.1.option.1:0 "Ysera will be able to defeat them alone."

infinite_dragon.4.t:0 "A Mind Made Whole"
infinite_dragon.4.d:0 "The ever changing future has been made clear to me, this is not some future crafted by choice, but by chance.\nA Dice was cast as the beginning, and a number determined our fate, the future i wished would never come has arrived far before i could have expected, if only there was someone to blame."
infinite_dragon.4.option.1:0 "Oh wait, there is."

infinite_dragon.5.t:0 "Too Late, but too Early"
infinite_dragon.5.d:0 "We could have worked as one, to fix a fate that would have torn the world apart, but i could not see the gears in motion, he saw the hour of twilight as the method of salvation, blinded by the old gods like Deathwing, but i will fix the now, and bend the future to my will."
infinite_dragon.5.option.1:0 "There can only be one Outcome!"

