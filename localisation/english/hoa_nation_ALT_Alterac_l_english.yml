ALT_border_conflicts:0 "Border Conflict"
ALT_border_conflicts_desc:0 "The Kingdom of Alterac and the Kingdom of Stromgarde have long had issues with ambigious borders along their mountain line, this has led to many skirmishes over the years."

ALT_king_informants:0 "The King's Informants"
ALT_king_informants_desc:0 "Compared to its neighbors, Alterac stands hopelessly outmatched in military might. This is a fact its king is all too painfully aware of. Faced with this reality, the kingdom seeks to instead leverage its strengths in the often overlooked field of military intelligence, which many would say suits the paranoid ruler all too perfectly."
ALT_king_informants_non_lar:0 "The King's Informants"
ALT_king_informants_non_lar_desc:0 "Compared to its neighbors, Alterac stands hopelessly outmatched in military might. This is a fact its king is all too painfully aware of. Faced with this reality, the kingdom seeks to instead leverage its strengths in the often overlooked field of military intelligence, which many would say suits the paranoid ruler all too perfectly."

