#events
###############################

 alterac.2.t:0 "Meeting of the Seven Kingdoms."
 alterac.2.d:0 "The Kingdom of Lordearon has called a Meeting of the Seven Kingdoms, something that has not been done for a millennia, it would seem as though they are taking the threat from the Orcs to the south seriously."
 alterac.2.option.1:0 "We shall attend"
 alterac.2.option.2:0 "We have our own matters to attend to."

 alterac.4.t:0 "An offer from the Orcs"
 alterac.4.d:0 "Today, an orc envoy arrived in Alterac City, bearing a crucial message from [BRC.GetLeader], the mighty Warchief of the orcish Horde. Acknowledging the internal strife within our kingdom, the envoy disclosed knowledge of the diverse factions within our realm advocating for Alterac's withdrawal from the war. How the orcs got that information still remains a mystery.\n\n    Intriguingly, the envoy announced that his Warchief proposes a clandestine alliance. They offer a non-aggression pact, promising to kill none of our soldiers and spare our villages from their raids. In exchange, the orcs seek free passage through our territory and our pledge to assist them in the future. They promise to safeguard Alterac once the war concludes, the Warchief himself assuring that he will do anything in his power to protect the kingdom.\n\n   This momentous encounter confronts us with a weighty decision. Should we seize this opportunity for cooperation, risking the wrath of our former allies? Or do we reject the orcs' overtures, maintaining our current path?."
 alterac.4.option.1:0 "This war must end, we accept."
 alterac.4.option.2:0 "Nonsense! Kill this orc!"

 ### BORDER WAR WIN
 alterac.5.t:0 "A Final Blow"
 alterac.5.d:0 "We have finally pushed the Stromic Army from the contested territories, Lord Trollbane has agreed that continued incursions at this time are meaningless for both sides, and we will cease hostilities for now."
 alterac.5.option.1:0 "They will be back in time."

 ### BORDER WAR LOSS
 alterac.6.t:0 "A Harrowing Defeat"
 alterac.6.d:0 "The Stromic Army has pushed out of the contested territories, Lord Trollbane has agreed to halt any futher advances at this time as he does not thing the citizens of Ravenholt manner should suffer a siege., and we will cease hostilities for now."
 alterac.6.option.1:0 "We will return in time."

 alterac.7.t:0 "Meeting of the Seven Kingdoms."
 alterac.7.d:0 "The Kingdom of Lordearon has called a Meeting of the Seven Kingdoms, something that has not been done for a millennia, though it would seem they are more worried about internal threats then that of the Orcs to the south."
 alterac.7.option.1:0 "We shall attend"
 alterac.7.option.2:0 "We have our own matters to attend to."

