ALT_aiden_perenolde:0 "Aiden Perenolde"
POLITICS_AIDEN_PERENOLDE_DESC:0 "Despite the small size of his empire, Aiden Perenolde rules righteously and wisely over his kingdom. As king, Perenolde vowed to assist his country and his subjects in grim times and do everything in his power to ensure their safety. Aiden grew accustomed, yet cultivated, in a rich household. As a patriot through and through, like most people in Alterac, he loves his homeland. Blinded by his envy, he despises Lordaeron and its capital in secret. He would do anything for his homeland, even if it meant sacrificing his honor."
POLITICS_AIDEN_PERENOLDE_JOINED_HORDE_DESC:0 "Despite the small size of his empire, Aiden Perenolde rules righteously and wisely over his kingdom. As king, Perenolde vowed to assist his country and his subjects in grim times and do everything in his power to ensure their safety. Aiden grew accustomed, yet cultivated, in a rich household. As a patriot through and through, like most people in Alterac, he loves his homeland. Blinded by his envy, he despises Lordaeron and its capital in secret.\nNevertheless, he joined the Alliance of Lordaeron to combat the danger of the green-skinned conquerors. But Perenolde plays a double game. Realizing that the alliance had no chance against the Horde, Aiden Perenolde joined forces with the Orcish Horde and acts as Doomhammer's personal informant. Now Perenolde's time has come to acquire his title as the true king of men."

ALT_alterac_nobles:0 "Alteraci Nobility"
POLITICS_ALTERAC_NOBLES_DESC:0 "After King Perenolde was deposed the Nation was placed under martial Law, The Nobility controled a level of administrative power while the fate of the Kingdom was determined."

ALT_aliden_perenolde:0 "Aliden Perenolde"
ALT_general_hath:0 "General Hath"

