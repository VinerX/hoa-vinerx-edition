LSC_mogor:0 "Mogor"
POLITICS_MOGOR_DESC:0 "Ogre Magi and leader of the Laughing Skull Clan. Mogor does not fight alongside the Horde. He fights, only, for the Laughing Skull Clan - and even seeks to defeat his rivals; the Thunderlord and Bonechewer Clans."
POLITICS_MOGOR_DESC_INVASION_OF_DRAENOR:0 "Ogre Magi and leader of the Laughing Skull Clan. Mogor does not fight alongside the Horde. He fights, only, for the Laughing Skull Clan - and even seeks to work alongside the Alliance Expedition to defeat his rivals; the Thunderlord and Bonechewer Clans."

LSC_kaz_the_shrieker:0 "Kaz the Shrieker"
POLITICS_KAZ_THE_SHRIEKER_DESC:0 "A ferice shaman and chieftess of the Laughing Skull clan. She seeks to keep the traditions of bloodlust, violence, and the freedom to slaughter whomever they please alive."

