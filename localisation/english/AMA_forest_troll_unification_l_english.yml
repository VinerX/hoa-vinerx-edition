l_english:

###############################
# AMA Forest Troll Unification Events
# Namespace: ama_forest_unity
###############################

# Stage 1 — Messengers
ama_forest_unity.1.t:0 "Messengers to the Forest Tribes"
ama_forest_unity.1.d:0 "Zul'jin dispatches emissaries to every forest troll tribe of the eastern kingdoms — the Witherbark, the Vilebranch, the Firetree, the Smolderthorn. Each messenger carries the same offer: join the Amani restoration, or be remembered as the tribe that chose cowardice when history was being written. The messengers bear tokens blessed by the Loa, proof that Zul'jin's power is real and the old spirits walk with him."
ama_forest_unity.1.a:0 "Let them hear Zul'jin's call."

ama_forest_unity.2.t:0 "Zul'jin Calls for Unity"
ama_forest_unity.2.d:0 "A messenger from Zul'Aman has arrived in our camp, bearing gifts blessed by the Loa themselves. Zul'jin speaks of a restored Amani Empire, of elven lands ripe for the taking, of the Horde's inevitable victory. He offers our tribe a place in the new order — a seat at the council, a share of the spoils, a future where forest trolls stand together instead of falling separately. The offer is generous. But Zul'jin's word has not always been kind to those who trusted it. The elders debate. The warriors sharpen their axes. We must decide."
ama_forest_unity.2.a:0 "We will fight under Zul'jin's banner!"
ama_forest_unity.2.b:0 "The Amani have done nothing for us. We stand alone."

# Stage 2 — Confederation
ama_forest_unity.5.t:0 "Restoring the Forest Confederation"
ama_forest_unity.5.d:0 "The tribes have answered the call. Now Zul'jin summons the chieftains to Zul'Aman itself. Around the great fire in the heart of the temple-city, he lays out the next step: the tribes that have joined the confederation must bind themselves into a single nation. Chiefs will retain their authority over local affairs and customs, but Zul'Aman will speak for all forest trolls. The Witherbark, Vilebranch, Firetree, and Smolderthorn — those who answered — must now decide whether to fully integrate, to become Amani in more than name."
ama_forest_unity.5.a:0 "The confederation becomes a nation."

ama_forest_unity.6.t:0 "The Confederation Demands Unity"
ama_forest_unity.6.d:0 "Zul'jin's ultimatum has arrived: the confederation is to become an empire. Tribes that pledged loyalty must now surrender their sovereignty and become provinces of a restored Amani state. Our chiefs will retain their lands and customs, but foreign policy, the army, and the treasury will answer to Zul'Aman alone. This is far more than we agreed to — and yet, standing alone against the Amani war machine is suicide. The council meets in grim silence."
ama_forest_unity.6.a:0 "We are Amani. Let the tribes unite."
ama_forest_unity.6.b:0 "This is conquest, not unity! We will fight for our freedom."

# Stage 3 — One Banner
ama_forest_unity.10.t:0 "One Banner Above the Forests"
ama_forest_unity.10.d:0 "The core of the Amani nation is forged. The tribes that accepted integration now form the backbone of a restored empire. But some forest trolls remain beyond the fold — tribes that refused the messengers, bands that still skulk in distant forests pretending the new order does not apply to them. Zul'jin gives them one final choice: kneel or be knelt. And the old puppets of the Amani — the Mossflayer and the Shadowpine — are told their service as vassals has earned them only one reward: full absorption into the nation they have faithfully served."
ama_forest_unity.10.a:0 "Every forest troll under one banner. No exceptions."

ama_forest_unity.11.t:0 "The Amani Demand Submission"
ama_forest_unity.11.d:0 "The Amani war machine is at full strength, and Zul'jin's patience has run out. The tribes that refused his earlier calls for unity now face a stark ultimatum: accept Amani overlordship as a vassal state, or face war with an empire that has already proven it can destroy those who resist. The independence we cherished is a memory that Zul'jin is determined to erase. The question is not whether we can defeat the Amani — the question is whether we prefer to survive as a subject or die as a warning."
ama_forest_unity.11.a:0 "We bow to Zul'Aman."
ama_forest_unity.11.b:0 "We will never bow. Let them come."

ama_forest_unity.12.t:0 "The Amani Summon Their Vassals"
ama_forest_unity.12.d:0 "For years our tribe has served the Amani faithfully as a vassal, contributing warriors to their wars and resources to their treasury. Now Zul'jin declares that service is to be rewarded with full integration into the Amani Empire. We will no longer be a separate tribe answering to Zul'Aman — we will become Amani in body and soul. Our chiefs will sit at the council. Our lands will be Amani lands. Our warriors will be Amani warriors. The choice is between acceptance and annihilation."
ama_forest_unity.12.a:0 "We accept. We were always Amani."
ama_forest_unity.12.b:0 "We are our own people. We will not be absorbed."

# Stage 4 — Call Scattered Tribes
ama_forest_unity.20.t:0 "Call to the Scattered Tribes"
ama_forest_unity.20.d:0 "Victory over Quel'Thalas sends shockwaves through the troll world. Tribes that hesitated, that watched from the shadows, that made their peace with human kingdoms — they now reconsider everything. Zul'jin sends messengers far beyond the eastern forests, reaching troll bands that have not answered an Amani summons in centuries. The Farraki in their desert exile. The Gurubashi in their jungle strongholds. The Bloodscalp, Skullsplitter, and Darkspear scattered across the southern continents. The message is different now: it is no longer a plea for aid, but an invitation to join a victorious nation."
ama_forest_unity.20.a:0 "Send the call. Every troll in the world must hear Zul'jin's voice."

ama_forest_unity.21.t:0 "The Amani Empire Calls"
ama_forest_unity.21.d:0 "Messengers from the distant north have arrived with a proclamation from Zul'jin himself: the Amani Empire is restored, Quel'Thalas has fallen, and the forest trolls stand united for the first time in three thousand years. Zul'jin now calls upon all trolls — not just forest trolls, but every scattered tribe, every remnant of the ancient empires — to stand with him. He offers alliance, vassalage, or at minimum recognition of Amani supremacy. The offer is wrapped in the language of brotherhood, but the steel behind it is unmistakable."
ama_forest_unity.21.a:0 "Zul'jin is the voice of all trolls. We will join his cause."
ama_forest_unity.21.b:0 "We accept Amani protection — but keep our independence."
ama_forest_unity.21.c:0 "The Amani are no kin of ours. We stand apart."
