VMR_Baleflames_Fury:0 "Baleflame's Fury"
VMR_Baleflames_Fury_desc:0 "General Baleflame, leader of the Red Dragonflight forces in the Verimillion Redoubt is a courageous and death-defying leader. He would fight any Dragon, even if the odds were against him, this gave his fellow Dragonspawn a boost in morale in a time of need."

VMR_under_duress:0 "Under Duress"
VMR_under_duress_desc:0 "The Dragon Queen does not serve the Horde willingly, the threat of the destruction of her eggs along with the torment caused by the Demon Soul she can only resist so much."
