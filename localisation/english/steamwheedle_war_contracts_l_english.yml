 #############################################
 # Steamwheedle War Contracts — Decisions
 #############################################
 STC_war_contracts:0 "War Contracts"

 STC_naval_contract:0 "Goblin Naval Contract"
 STC_naval_contract_desc:0 "Commission the Steamwheedle Cartel's shipyards to churn out warships for the Horde. Our dockworkers and engineers will work round the clock, though the administrative burden will slow our political maneuvering."

 STC_airship_contract:0 "Goblin Airship Contract"
 STC_airship_contract_desc:0 "Put our tinkers and zeppelin workshops to work producing airships for the Horde's aerial fleet. Goblin engineering is... volatile, but undeniably effective."

 STC_sappers_contract:0 "Goblin Sappers & Engineers"
 STC_sappers_contract_desc:0 "Deploy our finest sappers, dig teams, and goblin engineers to accelerate construction across Horde territory. When things need blowing up or building up, goblins get it done."

 STC_renew_contracts:0 "Renew War Contracts"
 STC_renew_contracts_desc:0 "Our previous contracts with the Horde have expired. Renew our lucrative production deals and keep the gold flowing."

 #############################################
 # Steamwheedle Contract Ideas
 #############################################
 STC_naval_boom:0 "Goblin Naval Boom"
 STC_naval_boom_desc:0 "The Steamwheedle Cartel's dockyards are operating at maximum capacity, churning out ships for the Horde war effort. The administrative overhead is cutting into our political capital, but the profits are immense."

 STC_airship_boom:0 "Goblin Airship Boom"
 STC_airship_boom_desc:0 "Zeppelin workshops and tinkers across Kezan are working triple shifts to supply the Horde with airships and flying machines. Efficiency is up, politics are on hold."

 STC_sappers_contract:0 "Sappers on Contract"
 STC_sappers_contract_desc:0 "Goblin engineering battalions are deployed across Horde territory, accelerating construction, fortification, and infrastructure projects."

 horde_goblin_ships:0 "Goblin-Supplied Warships"
 horde_goblin_ships_desc:0 "The Steamwheedle Cartel's dockyards are delivering warships to Horde ports, bolstering our naval production capacity."

 horde_goblin_aircraft:0 "Goblin-Supplied Airships"
 horde_goblin_aircraft_desc:0 "Goblin-built zeppelins and flying machines are arriving from Kezan, giving our war machine a much-needed aerial boost."

 horde_goblin_construction:0 "Goblin Engineering Corps"
 horde_goblin_construction_desc:0 "Squads of goblin sappers and engineers are assisting with construction and fortification projects across Horde territory."
