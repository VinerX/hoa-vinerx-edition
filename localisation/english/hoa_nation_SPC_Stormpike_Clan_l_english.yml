 SPC_bronzebeard_legacy:0 "Bronzebeard Legacy"
 SPC_bronzebeard_legacy_desc:0 "By the time of the trade with the various human city-states to the north, the dwarves, led by High King Modimus Anvilmar, had three powerful factions brooding within the city of Ironforge. The Bronzebeard clan was the largest of the three factions, having controlled the military and mercantile classes."

 SPC_Battle_Rams:0 "Battle Ram Training"
 SPC_Battle_Rams_desc:0 "The Stormpike Clan are renowed for their Battle Rams, training them from birth and taking care of them like one of their own."
