stormpike.1.d:0 "The people of Stormwind have been forced from their homes, unles the Dark Iron, they did not deserve it and have made sure to bring as many of their people as they could with them, including Bronze Beard dwarves, this may bring tidings that they wont abandon us in our times of need either, giving a couple of those dwarves a place to forge their metals also could not hurt."
