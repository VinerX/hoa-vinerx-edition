dalaran.1.t:0 "Send an Apprentice"
dalaran.1.d:0 "Medivh has been causing quite a stir in Karazhan. The Coucil of Six must know what is going on with the Guardian. Let us send the young mage Khadgar to apprentice under Medivh and see what he is up to."
dalaran.1.a:0 "Summon Khadgar!"

dalaran.3.t:0 "Meeting of the Seven Kingdoms."
dalaran.3.d:0 "The Kingdom of Lordearon has called a Meeting of the Seven Kingdoms, something that has not been done for a millennia, it would seem as though they are taking the threat from the Orcs to the south seriously."
dalaran.3.option.1:0 "We shall attend"
dalaran.3.option.2:0 "Our studies take precedence."

dalaran.4.t:0 "Meeting of the Seven Kingdoms."
dalaran.4.d:0 "The Kingdom of Lordearon has called a Meeting of the Seven Kingdoms, something that has not been done for a millennia, though it would seem they are more worried about internal threats then that of the Orcs to the south."
dalaran.4.option.1:0 "We shall attend"
dalaran.4.option.2:0 "Our studies take precedence."

