DAL_kirin_tor_magocracy:0 "Kirin Tor Magocracy"
DAL_kirin_tor_magocracy_desc:0 "Dalaran is renowned as the birthplace of arcana and its study as Azeroth knows it today. Ruled by the brilliant Magus Senate, the city enjoys relative peace and stability, but its archmages stand ready to use their mastery in its defense should that change."

DAL_ordinary_politics:0 "'Ordinary Politics'"
DAL_ordinary_politics_desc:0 "After the end of the 2nd War the Kirin Tor kept the kingdoms politics at arm's length, focusing instead on furthering humanities understanding of the arcane arts."

DAL_anti_undead_measures:0 "Anti-Undead Measures"
DAL_anti_undead_measures_desc:0 "Barriers and Wards have been placed in and around Dalaran to protect itself from any undead foolish enough to tread into our domain."

