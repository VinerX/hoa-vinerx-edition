HAM_Forsaken_Defilers:0 "The Defilers"
HAM_Forsaken_Defilers_desc:0 "The Forsaken Defilers are a warband of Forsaken held up in the Defiler's Den, within Hammerfell. Their goals aren't inline with Hammerfell, their own desires are to destroy the League of Arathor once and for all."
HAM_Fort_Hammerfall:0 "Fort Hammerfall"
HAM_Fort_Hammerfall_desc:0 "Hammerfall was once an Alliance Interment Camp for orcs captured in the second war. But Ogrim and Thrall liberated it, however Ogrim died in the battle that followed. To honor his legacy, Hammerfall was repurposed in the Third War as a Horde Foward Base."
