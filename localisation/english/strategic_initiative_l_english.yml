l_english:

 # ------------------------------------------------------------
 # DECORATIVE — Overall strategic situation
 # ------------------------------------------------------------
 si_overall_horde_decisive:0 "Overall Situation: Decisive Horde Initiative"
 si_overall_horde_decisive_desc:0 "The Horde's momentum is overwhelming. The Alliance struggles to mount any coordinated response as Horde armies advance on multiple fronts simultaneously. Unless something changes quickly, defeat looms."
 si_overall_horde_initiative:0 "Overall Situation: Horde Initiative"
 si_overall_horde_initiative_desc:0 "The Horde holds the initiative across most fronts. The Alliance is forced to react rather than dictate the war's direction, struggling to find an opening to turn the tide."
 si_overall_horde_advantage:0 "Overall Situation: Horde Advantage"
 si_overall_horde_advantage_desc:0 "The Horde has gained the upper hand. While the Alliance still contests several fronts, the overall strategic picture favors the invaders."
 si_overall_contested:0 "Overall Situation: Contested War"
 si_overall_contested_desc:0 "Neither side has established decisive strategic superiority. The war remains fluid, with battles raging across all fronts and the outcome still uncertain."
 si_overall_alliance_advantage:0 "Overall Situation: Alliance Advantage"
 si_overall_alliance_advantage_desc:0 "The Alliance has begun to turn the tide. After absorbing the Horde's initial onslaught, the kingdoms are now mounting effective resistance and reclaiming lost ground."
 si_overall_alliance_initiative:0 "Overall Situation: Alliance Initiative"
 si_overall_alliance_initiative_desc:0 "The Alliance now dictates the tempo of the war. Horde offensives have stalled, and the combined strength of the kingdoms is pushing the invaders back."
 si_overall_alliance_decisive:0 "Overall Situation: Decisive Alliance Initiative"
 si_overall_alliance_decisive_desc:0 "Victory is within reach. The Alliance controls the battlefield, the Horde is on the defensive, and the grand counteroffensive that will end the threat is underway."

 # ------------------------------------------------------------
 # DECORATIVE — Sea of Blood
 # ------------------------------------------------------------
 si_theater_soa_horde_command:0 "Sea of Blood: Horde Command"
 si_theater_soa_horde_command_desc:0 "The Horde dominates the seas, having seized most of the strategic islands. Alliance naval operations are severely constrained, and Horde troop movements across the channel face little opposition."
 si_theater_soa_horde_advantage:0 "Sea of Blood: Horde Advantage"
 si_theater_soa_horde_advantage_desc:0 "The Horde holds the upper hand in the island war, controlling more key positions than the Alliance. Their fleets can operate with growing freedom in the channel."
 si_theater_soa_contested:0 "Sea of Blood: Contested"
 si_theater_soa_contested_desc:0 "Neither faction has secured clear naval dominance. The fight for the islands remains fierce and fluid, with both sides contesting control."
 si_theater_soa_alliance_advantage:0 "Sea of Blood: Alliance Advantage"
 si_theater_soa_alliance_advantage_desc:0 "The Alliance has seized the initiative at sea, controlling the majority of strategic islands. Horde naval operations are increasingly challenged."
 si_theater_soa_alliance_command:0 "Sea of Blood: Alliance Command"
 si_theater_soa_alliance_command_desc:0 "The Alliance commands the waves. With near-total control of the strategic islands, the Horde's maritime operations are crippled."

 # ------------------------------------------------------------
 # DECORATIVE — Khaz Modan
 # ------------------------------------------------------------
 si_theater_khaz_horde_severe:0 "Khaz Modan: Severe Horde Advantage"
 si_theater_khaz_horde_severe_desc:0 "The dwarf kingdoms are under desperate siege. Both Ironforge and Gnomeregan are cut off from the surface world, their defenders slowly starving as the Horde tightens its grip on the mountains."
 si_theater_khaz_horde_advantage:0 "Khaz Modan: Horde Advantage"
 si_theater_khaz_horde_advantage_desc:0 "The Horde has pushed deep into the dwarven realms. Mountain passes are contested, and the Bleeding Hollow clan extracts resources from conquered territory."
 si_theater_khaz_contested:0 "Khaz Modan: Contested"
 si_theater_khaz_contested_desc:0 "The mountain war hangs in the balance. Neither the Horde's siege nor the dwarves' defenses have proven decisive yet."
 si_theater_khaz_alliance_advantage:0 "Khaz Modan: Alliance Advantage"
 si_theater_khaz_alliance_advantage_desc:0 "The siege is weakening. Alliance relief forces have begun to break through, and the dwarven defenders are rallying."
 si_theater_khaz_alliance_relief:0 "Khaz Modan: Siege Broken"
 si_theater_khaz_alliance_relief_desc:0 "The siege of Khaz Modan has been lifted. Dwarven armies are once again taking the field alongside their Alliance allies."

 # ------------------------------------------------------------
 # DECORATIVE — Northern War
 # ------------------------------------------------------------
 si_theater_nw_horde_breakthrough:0 "Northern War: Horde Breakthrough"
 si_theater_nw_horde_breakthrough_desc:0 "The Amani have breached Quel'Thalas's outer defenses and now threaten Silvermoon itself. The elven kingdom faces its darkest hour since the Troll Wars."
 si_theater_nw_horde_advantage:0 "Northern War: Horde Advantage"
 si_theater_nw_horde_advantage_desc:0 "The Amani offensive continues to push deeper into elven territory. Quel'Thalas fights desperately to hold the line, but the forest trolls' knowledge of the woods gives them a deadly edge."
 si_theater_nw_stable:0 "Northern War: Stable"
 si_theater_nw_stable_desc:0 "The northern front remains locked in stalemate. The Amani advances have been checked, but Quel'Thalas has yet to fully recover lost ground."
 si_theater_nw_alliance_advantage:0 "Northern War: Alliance Advantage"
 si_theater_nw_alliance_advantage_desc:0 "Quel'Thalas has regained the initiative. The Amani offensive has lost momentum, and the elven defenders are pushing back."
 si_theater_nw_alliance_secure:0 "Northern War: Quel'Thalas Secure"
 si_theater_nw_alliance_secure_desc:0 "The elven homeland is safe. The Amani have been expelled from Quel'Thalas's heartlands, and the northern front is firmly under Alliance control."

 # ------------------------------------------------------------
 # DECORATIVE — Central Front
 # ------------------------------------------------------------
 si_theater_cf_horde_severe:0 "Central Front: Horde Dominant"
 si_theater_cf_horde_severe_desc:0 "The Horde has shattered the central kingdoms. Stormwind and Stromgarde have fallen, and the road to Lordaeron lies open. The Alliance's heartland is now the front line."
 si_theater_cf_horde_advantage:0 "Central Front: Horde Advantage"
 si_theater_cf_horde_advantage_desc:0 "The Horde holds the momentum on land. Key territories south of Lordaeron are under Horde control, and the central kingdoms are losing ground."
 si_theater_cf_contested:0 "Central Front: Contested"
 si_theater_cf_contested_desc:0 "The land war remains fluid, with no decisive breakthrough on either side. Both armies maneuver for advantage across the central kingdoms."
 si_theater_cf_alliance_advantage:0 "Central Front: Alliance Advantage"
 si_theater_cf_alliance_advantage_desc:0 "The Alliance is regaining control of the central theater. Horde offensives have stalled, and Alliance forces are consolidating their positions."
 si_theater_cf_alliance_returned:0 "Central Front: Alliance Resurgent"
 si_theater_cf_alliance_returned_desc:0 "The Alliance has driven the Horde from the central kingdoms. Stormwind banners fly once more over reclaimed territory as the Alliance counteroffensive rolls south."

 # ------------------------------------------------------------
 # DECORATIVE — Unity / Authority
 # ------------------------------------------------------------
 si_unity_panel:0 "Alliance Unity"
 si_unity_panel_desc:0 "The cohesion of the Alliance of Lordaeron. High unity enables coordinated operations and the Grand Counteroffensive."
 si_authority_panel:0 "Warchief Authority"
 si_authority_panel_desc:0 "Orgrim Doomhammer's control over the Orcish Horde. High authority allows the Warchief to coordinate clan operations and demand total commitment."

 # ------------------------------------------------------------
 # DECORATIVE — Window of Opportunity
 # ------------------------------------------------------------
 si_window_active_panel:0 "Strategic Window Active"
 si_window_active_panel_desc:0 "The enemy has lost momentum. For a limited time, your faction can seize the initiative with reduced-cost operations. Act before the window closes."

 # ------------------------------------------------------------
 # HORDE OPERATIONS
 # ------------------------------------------------------------

 # Exploit the Breakthrough
 si_horde_operation_exploit_breakthrough:0 "Exploit the Breakthrough"
 si_horde_operation_exploit_breakthrough_desc:0 "Direct the clans to press their advantage before the Alliance can regroup. A focused offensive now could shatter their defensive lines permanently.\n\nCost: 50 Political Power, 8 Warchief Authority\nDuration: 90 days\nEffect: +15% Planning Speed, +5% Movement Speed"
 si_horde_exploit_breakthrough_tt:0 "The Warchief demands the clans press their advantage. For the next 90 days: +15% Planning Speed and +5% Movement Speed."

 # Concentrate the Clans
 si_horde_operation_concentrate_clans:0 "Concentrate the Clans"
 si_horde_operation_concentrate_clans_desc:0 "Overrule clan rivalries and redirect all forces to the critical fronts. A unified Horde is an unstoppable Horde.\n\nCost: 75 Political Power, 15 Warchief Authority\nDuration: 120 days\nEffect: -10% Supply Consumption, +10% Reinforcement Rate"
 si_horde_concentrate_clans_tt:0 "The Warchief concentrates the Horde's might. For the next 120 days: -10% Supply Consumption and +10% Reinforcement Rate."

 # Open Another Front
 si_horde_operation_open_front:0 "Open Another Front"
 si_horde_operation_open_front_desc:0 "The Alliance cannot defend everywhere. Launch a new amphibious offensive to stretch their lines to the breaking point.\n\nCost: 50 Political Power, 8 Warchief Authority\nDuration: 120 days\nEffect: +25% Naval Invasion Prep Speed, +10 Invasion Capacity"
 si_horde_open_front_tt:0 "A new invasion is prepared. For the next 120 days: +25% Naval Invasion Preparation Speed and +10 Invasion Capacity."

 # Crush the Alliance
 si_horde_operation_crush_alliance:0 "Crush the Alliance Before It Recovers"
 si_horde_operation_crush_alliance_desc:0 "This is the decisive moment. Commit every clan, every warrior, every resource to a final overwhelming offensive. The Alliance will never get a second chance — and neither will we.\n\nCost: 100 Political Power, 25 Warchief Authority\nDuration: 120 days\nEffect: +10% Attack, +10% Breakthrough (all Horde clans)"
 si_horde_crush_alliance_tt:0 "The Horde commits to total war. For the next 120 days: +10% Attack and +10% Breakthrough for all Horde clans."

 # ------------------------------------------------------------
 # ALLIANCE OPERATIONS
 # ------------------------------------------------------------

 # Stabilize the Front
 si_alliance_operation_stabilize:0 "Stabilize the Front"
 si_alliance_operation_stabilize_desc:0 "Dig in and hold. Every inch of ground the Horde takes must cost them dearly. We need time to prepare our response.\n\nCost: 50 Political Power, 5 Alliance Unity\nDuration: 180 days\nEffect: +15% Entrenchment Speed, +10% Defence"
 si_alliance_stabilize_front_tt:0 "The Alliance digs in. For the next 180 days: +15% Entrenchment Speed and +10% Defence."

 # Coordinate Reinforcements
 si_alliance_operation_coordinate:0 "Coordinate Allied Reinforcements"
 si_alliance_operation_coordinate_desc:0 "Streamline the flow of troops and supplies between member kingdoms. A coordinated reinforcement network will keep our armies in the fight.\n\nCost: 75 Political Power, 10 Alliance Unity\nDuration: 120 days\nEffect: +10% Reinforcement Rate, -10% Training Time"
 si_alliance_coordinate_tt:0 "Allied logistics are unified. For the next 120 days: +10% Reinforcement Rate and -10% Training Time."

 # Prepare a Counterstroke
 si_alliance_operation_counterstroke:0 "Prepare a Counterstroke"
 si_alliance_operation_counterstroke_desc:0 "Mass the armies for a coordinated counterattack. The Horde has overextended — now is the time to make them pay for every mistake.\n\nCost: 50 Political Power, 5 Alliance Unity\nDuration: 120 days\nEffect: +10% Planning Speed, +5% Breakthrough"
 si_alliance_counterstroke_tt:0 "The Alliance prepares its counterblow. For the next 120 days: +10% Planning Speed and +5% Breakthrough."

 # Grand Counteroffensive
 si_alliance_operation_grand_counteroffensive:0 "Grand Alliance Counteroffensive"
 si_alliance_operation_grand_counteroffensive_desc:0 "This is the moment the Alliance was forged for. Every kingdom, every army, every banner — united in a single overwhelming offensive to end the Horde threat forever.\n\nCost: 100 Political Power, 15 Alliance Unity\nDuration: 120 days\nEffect: +10% Attack, +10% Max Planning (all Alliance members)"
 si_alliance_grand_counteroffensive_tt:0 "The Grand Counteroffensive begins. For the next 120 days: +10% Attack and +10% Max Planning for all Alliance members."

 # ------------------------------------------------------------
 # WINDOW OF OPPORTUNITY OPERATIONS
 # ------------------------------------------------------------

 # Horde: Ruthless Advance
 si_horde_window_ruthless_advance:0 "Ruthless Advance"
 si_horde_window_ruthless_advance_desc:0 "The Alliance is reeling. Throw everything into the breach — speed is our greatest weapon now.\n\nCost: 25 Political Power, 8 Warchief Authority\nDuration: 90 days\nEffect: +15% Movement Speed\n\nThis operation is only available during a strategic window of opportunity."
 si_horde_ruthless_advance_tt:0 "The Horde surges forward. For the next 90 days: +15% Movement Speed."

 # Alliance: Seize the Moment
 si_alliance_window_seize_moment:0 "Seize the Moment"
 si_alliance_window_seize_moment_desc:0 "The Horde has stumbled. For the first time, they are reacting to us. Strike now — before they recover their footing.\n\nCost: 25 Political Power, 5 Alliance Unity\nDuration: 90 days\nEffect: +15% Planning Speed, +10% Breakthrough\n\nThis operation is only available during a strategic window of opportunity."
 si_alliance_seize_moment_tt:0 "The Alliance seizes the initiative. For the next 90 days: +15% Planning Speed and +10% Breakthrough."

 # ------------------------------------------------------------
 # EVENTS
 # ------------------------------------------------------------
 strategic_initiative.1.t:0 "Window of Opportunity Opens"
 strategic_initiative.1.d:0 "The strategic situation has shifted. Our forces have gained momentum, and the enemy is off-balance.\n\nA limited-time window of opportunity is now active. Special operations are available at reduced cost — but we must act quickly before the enemy recovers."
 strategic_initiative.1.a:0 "We shall not let this chance slip away."

 strategic_initiative.2.t:0 "Window of Opportunity Closes"
 strategic_initiative.2.d:0 "The opportunity has passed. The enemy has recovered their footing, and the strategic situation has stabilized.\n\nSpecial window operations are no longer available. We must now rely on standard strategic operations to regain the advantage."
 strategic_initiative.2.a:0 "We will find another opening."

 # ------------------------------------------------------------
 # NATIONAL SPIRIT LABELS — Strategic Initiative tiers
 # ------------------------------------------------------------
 si_spirit_horde_decisive:0 "Strategic Initiative: Decisive Horde"
 si_spirit_horde_decisive_desc:0 "The Horde's momentum is overwhelming. The Warchief commands the war on every front."
 si_spirit_horde_initiative:0 "Strategic Initiative: Horde Initiative"
 si_spirit_horde_initiative_desc:0 "The Horde controls the pace of the war, dictating when and where battles are fought."
 si_spirit_horde_advantage:0 "Strategic Initiative: Horde Advantage"
 si_spirit_horde_advantage_desc:0 "The Horde holds a slight edge, but the war remains fluid."
 si_spirit_contested:0 "Strategic Initiative: Contested War"
 si_spirit_contested_desc:0 "Neither side has established a clear advantage. The outcome remains undecided."
 si_spirit_ally_advantage:0 "Strategic Initiative: Alliance Advantage"
 si_spirit_ally_advantage_desc:0 "The Alliance has begun to tip the scales, pushing back on multiple fronts."
 si_spirit_ally_initiative:0 "Strategic Initiative: Alliance Initiative"
 si_spirit_ally_initiative_desc:0 "The Alliance now commands the flow of the war, setting the terms of engagement."
 si_spirit_ally_decisive:0 "Strategic Initiative: Decisive Alliance"
 si_spirit_ally_decisive_desc:0 "The Alliance is ascendant. Victory is within reach as the Horde reels on all fronts."

 # ------------------------------------------------------------
 # NATIONAL SPIRIT LABELS — Operation timed ideas
 # ------------------------------------------------------------
 si_op_exploit_breakthrough:0 "Exploiting Breakthrough"
 si_op_exploit_breakthrough_desc:0 "Our forces are pressing the advantage before the enemy can regroup."
 si_op_concentrate_clans:0 "Concentrated Clans"
 si_op_concentrate_clans_desc:0 "Clan rivalries set aside — the full might of the Horde is focused on the critical fronts."
 si_op_open_front:0 "Opening a New Front"
 si_op_open_front_desc:0 "The Alliance cannot defend everywhere. Our invasion forces stand ready."
 si_op_crush_alliance:0 "Total Offensive Underway"
 si_op_crush_alliance_desc:0 "Every clan commits everything to the final decisive blow."
 si_op_ruthless_advance:0 "Ruthless Advance"
 si_op_ruthless_advance_desc:0 "Speed is our greatest weapon. The Horde surges forward unchecked."
 si_op_stabilize_front:0 "Front Stabilized"
 si_op_stabilize_front_desc:0 "Alliance forces have dug in. The Horde will pay dearly for every inch."
 si_op_coordinate:0 "Coordinated Reinforcements"
 si_op_coordinate_desc:0 "Troops and supplies flow freely between Alliance kingdoms."
 si_op_counterstroke:0 "Counterstroke Underway"
 si_op_counterstroke_desc:0 "The Alliance masses its armies for a coordinated counter-blow."
 si_op_grand_counteroffensive:0 "Grand Counteroffensive Underway"
 si_op_grand_counteroffensive_desc:0 "Every kingdom stands united. The final phase of the war has begun."
 si_op_seize_moment:0 "Seizing the Momentum"
 si_op_seize_moment_desc:0 "The enemy is off-balance, and we strike before they recover."
