THB_cairne_bloodhoof:0 "Cairne Bloodhoof"
POLITICS_CAIRNE_BLOODHOOF_FIRST_WAR_DESC:0 "The mightiest of the tribes, it could be said that the Bloodhoof exemplify all that it is to be Tauren... Their grim situation included. Heavy do the burdens of wise chieftain Cairne Bloodhoof weigh upon him. The Quillboar pressure Tauren territory at every turn, Harpies assail hunting parties, and worse than both, the Centaur maraud in force. They overhunt the land to barren scarcity, leaving naught for the Tauren to eat, and... \n Attack the Tauren with no other intent than to drive the noble Bloodhoof to complete and utter extinction. A lesser chieftain may have raged at such injustice, but Cairne has kept his wits about him and managed what braves and resources he has well. Despite the losing battle his people fight, Cairne is assured that in time, the Earthmother will present a solution to their plight. \n Perhaps that salvation will come from the shores of Durotar, near where his people now make camp. If not... \n Cairne may need to seek a savior elsewhere, for the Bloodhoof will be hard-pressed to survive on their own."

