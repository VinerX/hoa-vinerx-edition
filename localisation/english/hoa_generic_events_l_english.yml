l_english:

####################################################################
# Localisation for generic events (see events/generic_events.txt)
# Makes extensive use of dynamic localisation
####################################################################

 generic_event.1.t:0 "[FROM.GetName] Accepts our Offer"
 generic_event.1.d:0 "Great news! Following our request, [FROM.GetNameDef] have decided to accept our offer!"
 generic_event.1.option.1:0 "Very well."

 generic_event.2.t:0 "[FROM.GetName] Refuses our Offer"
 generic_event.2.d:0 "Following our request, [FROM.GetNameDef] have decided to refuse our offer."
 generic_event.2.option.1:0 "So be it."

 generic_event.4.t:0 "[FROM.GetName] Propose a Mutual Guarantee"
 generic_event.4.d:0 "An envoy from [FROM.GetNameDef] have arrived today before us, they ask if we would be interested in securing a mutual guarantee."
 generic_event.4.option.1:0 "For sure."
 generic_event.4.option.2:0 "No."

 generic_event.5.t:0 "Shard of a Naaru"
 generic_event.5.d:0 "While searching through our lands we came across a shard of a Naaru, it is unknown how they perished, but the knowledge we have gained from it has been enlightening."
 generic_event.5.option.1:0 "Radiant Strike"
 generic_event.5.option.2:0 "Aura of Hope"
 generic_event.5.option.3:0 "Sanctified Shield"

 generic_event.6.t:0 "The Provisional State of [From.From.GetNameDef]"
 generic_event.6.d:0 "After a long and concerted effort to improve compliance between our occupation forces and local authorities, we are now ready to put control of [From.From.GetNameDef] back into the hands of a local citizens. This new government is made up of sympathetic civilians and is ready to closely coordinate with us."
 generic_event.6.option.1:0 "They have our blessing."
 generic_event.6.option.2:0 "They are not ready yet."