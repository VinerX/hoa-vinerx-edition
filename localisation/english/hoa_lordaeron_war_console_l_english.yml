l_english:
 LOR_the_alliance_of_lordaeron:0 "The Alliance of Lordaeron"
 LOR_the_alliance_of_lordaeron_desc:0 "Under Terenas Menethil, Lordaeron has become the political heart of the human coalition. Its court coordinates the kingdoms, marshals command staff, and lends the whole Alliance its legitimacy."
 LOR_allied_war_logistics:0 "Allied War Logistics"
 LOR_allied_war_logistics_desc:0 "Lordaeron's granaries, roads and workshops keep the coalition's armies fed and armed. Supply flows to every front and the war economy hums."
 LOR_the_northern_reserve:0 "The Northern Reserve"
 LOR_the_northern_reserve_desc:0 "Rather than overextend, Lordaeron holds a disciplined defensive line. Entrenched and rested, its soldiers weather the Horde's assaults and give ground grudgingly."
 LOR_grand_coalition:0 "The Grand Coalition"
 LOR_grand_coalition_desc:0 "Lordaeron directs the war of many kingdoms as one. Alliance offensives are planned in concert and pressed with a shared resolve."
 LOR_the_crown_endures:0 "The Crown Endures"
 LOR_the_crown_endures_desc:0 "For all the strain of war, the crown of Lordaeron holds the realm together. Its authority steadies the people and sustains the war effort."
 alliance_coordinated_offensive:0 "Coordinated Offensive"
 alliance_coordinated_offensive_desc:0 "Lordaeron's high command has synchronized the coalition's advance. For a time, Alliance armies attack in concert, striking harder and faster than the Horde can answer."
