FRG_lord_melenas:0 "Lord Melenas"
POLITICS_LORD_MELENAS_DESC:0 "Lord Melenas, a saytr druid who has amassed an army of grell to protect himself from the adventurers of the kaldorei. Once he destroy them he hopes to take on the kaldorei for complete control over teldrassil and build it as the basis of his new kingdom."
FRG_threggil:0 "Threggil"
POLITICS_THREGGIL_DESC:0 "Once Melena's second in command, Threggil now leads the grell of fel rock and seeks to kill any other who would dare to controll or destroy the grell."
