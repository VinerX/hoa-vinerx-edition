bluedragonflight.1.t:0 "Warning from Ysera"
bluedragonflight.1.d:0 "Ysera has sent grave news. The Hakkari Tribe was never fully wiped out, and that they are thriving in the Swamp of Sorrows. She has already sent sentries to watch them and will personally be ready to destroy their civilization should any attempt to summon Atal’Hakkar be made."
bluedragonflight.1.option.1:0 "We can spare nothing to help her."

bluedragonflight.3.t:0 "The Spellweavers Warning"
bluedragonflight.3.d:0 "Malygos has told us of his plans to 'save' the world from mortal hands, their misuse of arcane magic always seems to draw unwanted attention from the Burning Legion and keeps putting Azeroth in jeopardy."
bluedragonflight.3.option.1:0 "We do not condone this, but we understand."
bluedragonflight.3.option.2:0 "What would Norgannon think of you!"

