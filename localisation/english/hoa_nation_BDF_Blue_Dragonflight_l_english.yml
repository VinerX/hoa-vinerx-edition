BDF_malygos:0 "Malygos"
POLITICS_MALYGOS_DESC:0 "The eldest of the Dragon Aspects, Malygos helms the remainder of the Blue Dragonflight after their betrayal by Deathwing. After his flight was nearly obliterated at Zin-Azshari, Malygos has fallen into a thousands-year-long depression. Now the ancient dragon resides in his icy lair in Northrend as an echo of his former self."

