BDF_Kalecgos_Betrayal:0 "Betrayal of Kalecgos"
BDF_Kalecgos_Betrayal_desc:0 "Kalecgos has turned his back on Malygos after he has begun his spiral into terror. With the Nexus War nearing closer and closer, Kalecgos has aligned himself and his dragons to the Wyrmcrest Accord, abandoning his former Aspect."
BDF_Kalecgos_desertion:0 "Kalecgos Assistance"
BDF_Kalecgos_desertion_desc:0 "A group of Blue Dragons have sided with us in the fight against Malygos."

BDF_The_Nexus_War:0 "The Nexus War"
BDF_The_Nexus_War_desc:0 "The Nexus War is a sub-conflict of the War on the Lich King. This conflict is between the many Dragonflights all combating the Blue Dragonflight due to Malygos' madness for power taking control of him."

BDF_spellweavers_awakening_idea:0 "Spellweavers Awakening"
BDF_spellweavers_awakening_idea_desc:0 "With the Spellweavers awakening the Coldarra has become a blue of joy, concern and eager anticipation, long have the members of the Blue Dragonflight wished to fly through the skys of Northrend with their aspect as the other flights do."
BDF_spellweavers_awakening_idea_2:0 "Spellweavers Awakening"
BDF_spellweavers_awakening_idea_2_desc:0 "With the Spellweavers awakening the Coldarra has become a blue of joy, concern and eager anticipation, long have the members of the Blue Dragonflight wished to fly through the skys of Northrend with their aspect as the other flights do."
BDF_spellweavers_awakening_idea_3:0 "Spellweavers Awakening"
BDF_spellweavers_awakening_idea_3_desc:0 "With the Spellweavers awakening the Coldarra has become a blue of joy, concern and eager anticipation, long have the members of the Blue Dragonflight wished to fly through the skys of Northrend with their aspect as the other flights do."

BDF_leyline_network:0 "Updated Leyline Network"
BDF_leyline_network_desc:0 "The Blue Dragonflight have been ever vigilant with updating of the Arcanomicon, the Spellweaver seemed quite pleased with this effort and spent weeks studying its sigils and runes."
BDF_leyline_network_2:0 "Redirected Leylines"
BDF_leyline_network_2_desc:0 "Malygos has voiced his concerns regarding the Leylines located underneath the tower of Karazhan."
BDF_leyline_network_3:0 "Redirected Leylines"
BDF_leyline_network_3_desc:0 "Malygos has voiced his concerns regarding the Leylines located underneath the tower of Karazhan."

BDF_arcane_disruptions:0 "Arcane Disruptions"
BDF_arcane_disruptions_desc:0 "Lately it has become difficult to tap into the Arcane leylines within our lands."

