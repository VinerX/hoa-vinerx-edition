hillsbrad.1.t:0 "The Situation in Hillsbrad"
hillsbrad.1.d:0 " Nested between the Alterac Mountains to the north and the Baradin Bay to the south, the Hillsbrad Foothills are a set of grassy hills and plains enjoying a temperate climate.\n\n Historically a province of the Kingdom of Lordaeron, Hillsbrad had always enjoyed a relative autonomy to the capital, sitting on the other side of Lordamere Lake, separated from the mainland by the Kingdom of Alterac and the mage city of Dalaran. \n\n This isolation would allow Hillsbrad to remains one of the most preserved regions north of the Thandol Span following the Fall of Lordaeron, leaving it mostly untouched by the undead Scourge.\n\n Nowadays, Hillsbrad falls under no proper jurisdiction. As such, the hills and shores of Hillsbrad are home to many different threats, wild creatures, yetis, gnolls and murlocs inhabit the area. To the north-west, the mages of Dalaran have retreated in isolation, protecting their city behind a magical wall, only sending a few scouting parties.\n\n In the Alterac Mountains, bandits of the Syndicate try to survive and reclaim the fallen kingdom of Alterac, now occupied by ogres. Their operations extend down in Hillsbrad, threatening travellers and humble peasants in the region.\n\n Lastly, the abandonned town of Tarren Mill was taken over by the Forsaken, often clashing with our own population and caravans. Rumors say that the undeads are eyeing Southshore..."
hillsbrad.1.option.1:0 "Understood."

hillsbrad.2.t:0 "The Question of Dun Garok"
hillsbrad.2.d:0 " The Stormpike dwarves of Dun Garok have inhabited the hills to the south-east as far as we can remember. They have been amical to us throughout our shared history, but with the world changing, maybe we need to reconsider our position towards them."
hillsbrad.2.option.1:0 "Leave them be."
hillsbrad.2.option.2:0 "Propose a mutual guarantee."
hillsbrad.2.option.3:0 "Eliminate them."

hillsbrad.3.t:0 "The Situation in Tarren Mill"
hillsbrad.3.d:0 ""
hillsbrad.3.option.1:0 "Leave them be."
hillsbrad.3.option.2:0 "Reclaim the Village."

hillsbrad.4.t:0 "Our Stance with the Syndicate"
hillsbrad.4.d:0 "The acts of the Syndicate could hardly be described as anything but criminal, nonetheless, they are led by Aliden Perinolde, the rightful heir of the Kingdom of Alterac.\n\n Despites Alterac betrayal of the Alliance during the Second War, maybe it would be of strategical importance on the political scene to back up their claim on the Alteraci throne."
hillsbrad.4.option.1:0 "Their claim on Alterac are rightful."
hillsbrad.4.option.1.d:0 "If they accept, we will enter in a §Hmutual non-agression pact§!."
hillsbrad.4.option.2:0 "It's just a bunch of criminals."
hillsbrad.4.option.3:0 "They are not worth our attention."

hillsbrad.5.t:0 "Hillsbrad Offer their Support"
hillsbrad.5.d:0 "We have received an envoy from Hillsbrad stating that they wish to support us in our claim for the Kingdom of Alterac, starting by forming a non-agression pact with us."
hillsbrad.5.option.1:0 "Their help is welcome."
hillsbrad.5.option.2:0 "We can do it on our own."

hillsbrad.6.t:0 "Kingdom of Hillsbrad proclaimed!"
hillsbrad.6.d:0 "After a successful expansion and consolidation into the region of Hillsbrad, the humans of the region, mostly remnants of the fallen kingdom of Lordaeron, have proclaimed the formation of a new kingdom."
hillsbrad.6.hib:0 "Glory to the Kingdom of Hillsbrad!"
hillsbrad.6.non_hib.2:0 "A new contender in Lordaeron..."

hillsbrad.7.t:0 "Hillsbrad Claims the Crown of Lordaeron!"
hillsbrad.7.d:0 "In a quite unexpected move, the humans of Hillsbrad, most of them remnants of the fallen Kingdom of Lordaeron, have managed to conquer and expand into their surroundings, forging for themselves a brigther future.\n\n More unexpected, their leader have claimed themselves to be the legitimate claimants of the throne of Lordaeron despites not posessing a rightful claim on the throne. A move which has already started to upset the political landscape of the Eastern Kingdoms."
hillsbrad.7.hib:0 "Glory to Lordaeron!"
hillsbrad.7.humans_positive:0 "A welcomed development."
hillsbrad.7.humans_negative:0 "How dare they?!"
hillsbrad.7.others:0 "Duly noted."

hillsbrad.8.t:0 "Choosing a Capital"
hillsbrad.8.d:0 ""
hillsbrad.8.option.1:0 "We will build a proper city!"
hillsbrad.8.option.2:0 "Southshore, the gate to the sea!"
hillsbrad.8.option.3:0 "Only Lordaeron City is worthy!"

