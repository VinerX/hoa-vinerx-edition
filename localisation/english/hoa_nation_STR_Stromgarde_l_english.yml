STR_bring_them_to_justice_desc:0 "A Diplomatic envoy is to be sent to Dalaran to formally invite members of the Council to a Tribunal to discuss the cause of the black pox plague that is ravaging our Kingdom"
STR_denounce_the_kings:0 "Denounce the Kings"
STR_denounce_the_kings_desc:0 "The Kingdoms of Alterac and Lordaeron refuse to support a tribunal to bring those who caused our plague to justice, though Alterac have always been a thorn in our side, King Terenas has always been a friend to Stromgarde."
STR_secure_the_pass:0 "Secure The Pass"
STR_secure_the_pass_desc:0 "We have matter to attend to and we cannot have the Trolls Interfere with them, for now we will stop them from entering our land through the pass, we will deal with them in time."
