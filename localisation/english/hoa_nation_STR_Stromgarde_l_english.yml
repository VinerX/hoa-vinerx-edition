STR_dathanor_cromwell:0 "Dathanor Cromwell"
STR_dathanor_cromwell_desc:0 "Although Dathanor is seen as a hero, he is a intimidating individual, known for his ruthless command and showing no mercy or quarter to those who would endanger the Kingdom."
STR_marcel_dabyrie:0 "Marcel Dabyrie"
STR_marcel_dabyrie_desc:0 "An expert with a sword and shield, Marcel trains the forces that make up his mother's malita movement."
STR_thorvald_stoneheart:0 "Thorvald Stoneheart"
STR_thorvald_stoneheart_desc:0 "Thorvald has lived is life in the mountains of the Hinterlands, though Stromgarde has a small population of dwarves they have strong ties to both the artisans as well as labourers."

