STR_the_second_fleet_desc:0 "If the rumours are to be belived we may soon be in need a larger fleet then we currently have at our disposal, We have contracted the Kul'tirans to assist with building a new fleet."

STR_reginald_baradin_i:0 "Reginald Baradin I"
STR_reginald_baradin_i_desc:0 "Warden Baradin the 1st was a man of few words, he took his duty on without any complaint, he was Loyal to the Kingdom of Stromgarde to a fault, he raised his son as an upstanding warrior, and as such has been chosen as his Successor."

STR_penal_trade:0 "The Penal Trade"
STR_penal_trade_desc:0 ""
STR_the_state_of_tolbarad:0 "The State of Tol'Barad"
STR_the_state_of_tolbarad_desc:0 "Tol'Barad has never been an area of beauty, we sit off the coast of both Gilneas, and Kul'Tiras the latter of which always blow their storms towards us, courtesy of House Stormsong has resulted in our constant need to repair roads that have become washed away in the storms."

STR_basic_skills:0 "Teaching Trades"
STR_basic_skills_desc:0 "Many of those who are sent to Tol'Barad are criminals who have no real life skills, it is our duty to ensure they are able to do their assigned jobs without accidents that endanger not only their lives, but those of the guards as well."
STR_encourage_work:0 "Encourage Work"
STR_encourage_work_desc:0 "Giving the prisoners a reason to work generally stops them from trying to escape or starting a riot, extra rations, leisure time as well as new linen are some of these benifits for hard workers."
STR_wardens_vigil:0 "Wardens Vigil"
STR_wardens_vigil_desc:0 ""
STR_baradin_royal_guard:0 "Baradin Royal Guard"
STR_baradin_royal_guard_desc:0 "Duke Baradin has proven to be a effective warden of Tol'Barad, as such we have sent word to supply another group of elite guard to be at his disposal."

STR_improved_living:0 "Construct Rustberg"
STR_improved_living_desc:0 ""
STR_training_priests:0 "Practicing Priests"
STR_training_priests_desc:0 ""
STR_rehabilitation:0 "Rehabilitation"
STR_rehabilitation_desc:0 ""
STR_monitor_activity:0 "Monitor Resistance"
STR_monitor_activity_desc:0 "It is one thing to kick down the doors of barracks and ransack the prisoners living quarters, but we have found it much more effective to build a network of informants inside the colony to root out any issues before they start to rear there ugly heads"

STR_leisure_fishing:0 "Leisure Fishing"
STR_leisure_fishing_desc:0 "As a reward for good behaviour the warden has allowed the Prisoners to fish on the coastal islands, even if they do not catch anything many of them are still enjoying their quiet time."
STR_safety_concerns:0 "Safety Concerns"
STR_safety_concerns_desc:0 "One of our advisors has recently returned from Tol'Barad, everything seems to be on order but it would seem that the mining operation at the foot of Farson Hold has been proceeding without consideration for the Oil Rigs in the Area."
STR_coastal_oil_rigs:0 "Coastal Oil Rigs"
STR_coastal_oil_rigs_desc:0 "Oil has never been a Major drive for our kingdom, but the other Kingdoms of the North rely on it to keep the night at bay, with news from the south it may be a good decision to begin using Lanterns, even if just for Distractions."
STR_dying_breaths:0 "Dying Breaths"
STR_dying_breaths_desc:0 "In a short space of time, with the assistance of the Warden we have drastically improved the living conditions of the Prisoners, with the war raging on we have offered a pardon to any prisoner who takes up arms against ou4 enemies, even if the war ends before they even land on Tol'Barad."

STR_training_militia:0 "Blackjack Wardens"
STR_training_militia_desc:0 "With the Increase number of reports of injuries to the guards we have begun training our guards to be more..."persuasive" when dealing with troublemakers"
STR_chain_of_command:0 "Chain of Command"
STR_chain_of_command_desc:0 ""
STR_second_hand_equipment:0 "Second Hand Equipment"
STR_second_hand_equipment_desc:0 ""
STR_ruthless_drills:0 "Ruthless Drills"
STR_ruthless_drills_desc:0 ""

STR_expand_farson_hold:0 "The Northern Hold"
STR_expand_farson_hold_desc:0 ""
STR_isolation_wards:0 "Isolation Wards"
STR_isolation_wards_desc:0 ""
STR_arcane_surveillance_network:0 "Arcane Surveillance Network"
STR_arcane_surveillance_network_desc:0 ""
STR_legion_expansion:0 "Legion Expansion"
STR_legion_expansion_desc:0 ""

STR_developing_the_kingdom:0 "Reinvigorated Development"
STR_developing_the_kingdom_desc:0 "We may not be as large a nation as Lordoran, but our Lords heart is just as large, taking full advantage of our resources will help mitigate any issues we may have in the future before they arise"
STR_khazmodan_trade_road:0 "Khaz'modan Trade Road"
STR_khazmodan_trade_road_desc:0 "Since the days of the Arathor Empire we have long been allies to the Dwarves, Thandol Span has long been a master piece of engineering by the dwarves, We may not have the same prowess as the Dwarves when it comes to building bridges, but we can make sure that carts and horses do not get bogged down in the mud on either end."
STR_hinterlands_cave:0 "The Hinterlands Passage"
STR_hinterlands_cave_desc:0 "The Passage into the Hinterlands has long stood as a connection between The Iron Forge Dwarves and the Wildhammers to the north, the Wildhammers have unfortuanly lost control of the mouth of the tunnel in the Hinterlands, we have considering destroying the tunnel but that could cause a dipolmatic incident, as such building some battlements will do for the time."
STR_expanded_dockyards:0 "Faldir's Cove"
STR_expanded_dockyards_desc:0 "We have long used the natural cove south of our capital as our shipyards and trade port, As part of our efforts to develop the region, we have started construction of larger naval yards for both warships and merchant vessels alike."
STR_promote_growth:0 "Enticing Settlers"
STR_promote_growth_desc:0 "By reducing the taxes on nobles as well as the goods tithes from the common folk we hope to allow more families to settle down faster and have larger families, our treasury may not be as large as usual, but as long as we keep the alteraci at bay we wont need a war chest any time soon."
STR_thandol_span_dockworks:0 "Thandol Span Dockworks"
STR_thandol_span_dockworks_desc:0 "An Agreement has been struck with the Anvilmar Clan at the Thandol Span, we have been allowed to build a small inlet port at the foot of the bridge as a connection point for smaller vessals, mostly fishing boats to be built and sent out to sea and have their cargo returned without the need to go to either Faldir's Cove or Bluegill Point"
STR_cobbled_roads:0 "Connecting East to West"
STR_cobbled_roads_desc:0 "Though our Kingdom is not as large as Lordoran we still believe that all people should be able to travel in a safe and timely, be it from our capital to the Kingdom of Khaz'Modan or just down the road for a bit of fishing."
STR_expand_mining_operations:0 "Thoradin Iron Mine"
STR_expand_mining_operations_desc:0 "The mountains in the South Eastern Region of our Kingdom are rich in Iron Ore and have been our main source of metals for decades, however over last few years there have been a number of accidents due to poor construction that we can no longer over look, as such we have provided sufficent funding for the consruction a new mine shaft, with the help of our Dwarven citizens"
STR_arcane_studies:0 "Arcane Studies"
STR_arcane_studies_desc:0 "We have been aproached by some wizards from Dalaran to allow them to use one of our watch towers as some from of retreat."
STR_capital_and_country:0 "Capital and Country"
STR_capital_and_country_desc:0 ""
STR_drywhisker_plains:0 "Open Plain Corrals"
STR_drywhisker_plains_desc:0 ""
STR_centralization_efforts:0 "Centralization Efforts"
STR_centralization_efforts_desc:0 "One of the Kingdoms advisors has offered the idea of centralizing the nations trade around the Capital, the king made the quip that if we were going to centralize the kingdom, should it not be in the center of the kingdom?"
STR_build_workshops:0 "Invest in our Future"
STR_build_workshops_desc:0 "Our younger citizens in the countryside have become disillusioned by the choices of either Farming or serving in the Army, as such we have begun using local merchant guilds to attain apprenticeships for some of the more technical skilled among them."
STR_more_farmhands:0 "Heartland Farms"
STR_more_farmhands_desc:0 "It would seem that our efforts to assist the youth in the country has caused many of the farmhands to change trades, fortunatly we have recently recieved an influx of Alteraci migrate to our lands and are more then willing to work in our lush green lands."
STR_highlands_mill:0 "The Highlands Mill"
STR_highlands_mill_desc:0 "We have very few wooded areas in our lands which has caused problems during our cold winters, with the pass to the north no longer controlled by the wildhammers we need to make sure we can utilise and maintain our forests."
STR_hammers_and_hoes:0 "Hammers and Hoes"
STR_hammers_and_hoes_desc:0 ""
STR_refuge_forges:0 "Refuge Forges"
STR_refuge_forges_desc:0 "If Stromgarde Keep was to ever come under attack either by Sea we must be prepared to have the forges damaged, funding constuction of a small blacksmith in the dip well help alleviate some strain on the Keeps forges, as well as serve the nation as a farrier for those who live in the East."
STR_high_perch_equestrians:0 "High Perch Equestrians"
STR_high_perch_equestrians_desc:0 "A Group of Farriers have set up a workshop to the north of the capital to offer services to passing caravans as well as citizens in the area, we have offered them support with their endevors as long as they also offer their services to the Kingdoms Knights."
STR_stromgarde_armory:0 "Stromgarde Forge Works"
STR_stromgarde_armory_desc:0 ""

STR_galson_metal_works:0 "Galson Metal Works"
STR_galson_metal_works_desc:0 ""
STR_manor_mares:0 "Manor Mares"
STR_manor_mares_desc:0 ""
STR_fund_whaling_operations:0 "Fund Whaling Operations"
STR_fund_whaling_operations_desc:0 ""
STR_highperch_crossroads:0 "Highperch Crossroads"
STR_highperch_crossroads_desc:0 ""
STR_drywhisker_gorge:0 "Drywhisker Gorge"
STR_drywhisker_gorge_desc:0 ""
STR_hill_terracing:0 "Hill Terracing"
STR_hill_terracing_desc:0 ""
STR_east_sea_defences:0 "East Sea Defences"
STR_east_sea_defences_desc:0 ""
STR_mithril_refinement:0 "Mithril Refinement"
STR_mithril_refinement_desc:0 ""
STR_we_struck_gold:0 "Gold Mines Uncovered"
STR_we_struck_gold_desc:0 "The Drywhisker Kobolds hid away in the darkness of their cave systems, while trying to route them our men found a hidden passageway which lead to a cavern filled with gold are far as the eye could see."
STR_youth_org_military:0 "Order of the Pathfinders"
STR_youth_org_military_desc:0 "Many children of our Kingdom have shown a kean interest in our deeply held military traditions, as to avoid possible injuries from children trying to teach themselves, we have laid the groundwork for a form of club where children can learn skills that can be transfered across to a field camp."
STR_young_smiths:0 "Young Smiths"
STR_young_smiths_desc:0 ""
STR_youth_org_research:0 "Order of Illumination"
STR_youth_org_research_desc:0 "In order to bridge the gap between the common folk and nobility, an orginization has been formed that will teach willing children how to create illuminated manuscripts, to help foster their abilities to both read and write."
STR_pathfinders:0 "Pathfinder"
STR_pathfinders_desc:0 ""
STR_penal_reform:0 "Penal Logistics Reforms"
STR_penal_reform_desc:0 ""
STR_drywhisker_mines:0 "Drywhisker Mines"
STR_drywhisker_mines_desc:0 ""
STR_boulder_hill_tunnels:0 "Boulder Hill Tunnels"
STR_boulder_hill_tunnels_desc:0 "While excavating boulder hill, our workers discovered an exsiting tunnel network that ran through the hill side, as the system seem to run north we believe it to be an abandoned kobold hovel."
STR_military_staging_camp:0 "Military Staging Base"
STR_military_staging_camp_desc:0 ""
STR_deep_wood_fletchers:0 "Deepwood Fletchers"
STR_deep_wood_fletchers_desc:0 ""
STR_sulfur_extraction:0 "Sulfur Breakthrough"
STR_sulfur_extraction_desc:0 ""
STR_the_fortress_kingdom:0 "The Fortress Kingdom"
STR_the_fortress_kingdom_desc:0 ""
STR_cove_expansion:0 "Cove Clearing Efforts"
STR_cove_expansion_desc:0 ""

STR_dealing_with_alterac:0 "Dealing with Alterac"
STR_dealing_with_alterac_desc:0 "We will try to puch §HThe Kingdom of Alterac§! forces from their battlements in the North West. Our Generals have suggested we move our §HKnights or Royal Guard§! into the region of §HThoradin's Pass§!"

STR_clear_the_infestation:0 "Clear out the Trolls"
STR_clear_the_infestation_desc:0 ""
STR_clear_remnants:0 "Remove Remnants"
STR_clear_remnants_desc:0 "The Trolls flexibility makes them a pain to dislodge from the tunnels, both literally and metaphotically."
STR_renovate_the_pass:0 "Reinforce the Pass"
STR_renovate_the_pass_desc:0 "With the Trolls on the other side of the pass still a threat to us, we should make any possible incursion into our land as difficult as possible"

STR_bloodied_red_hand:0 "Bloodied Red Hand"
STR_bloodied_red_hand_desc:0 ""
STR_deny_the_exchange:0 "Deny The Exchange"
STR_deny_the_exchange_desc:0 ""

STR_triumph_in_the_west:0 "Triumph in the West"
STR_triumph_in_the_west_desc:0 ""
STR_prisoner_exchange:0 "Prisoner Exchange"
STR_prisoner_exchange_desc:0 ""

STR_rebuild_thoradins_Wall:0 "Rebuild Thoradins Wall"
STR_rebuild_thoradins_Wall_desc:0 ""
STR_stormpike_pact:0 "Stormpike Pact"
STR_stormpike_pact_desc:0 "In the event that the Stormpike clan would be pushed out of their dwarven fortress of Dun Garok, we have offered them shelter in Thoradins wall, from there they may lead counter attacks against whatever invader has taken their home."
STR_kick_the_witherbark:0 "Kick the Witherbark"
STR_kick_the_witherbark_desc:0 "The Witherbark Raptors are a continued menace both our tunnel guards and the Wildhammers to the North, time to cull some of their numbers, right under the nose of those damn trolls."
STR_the_meeting_at_the_lodge:0 "Meeting at the Lodge"
STR_the_meeting_at_the_lodge_desc:0 "We have organized a meeting at the Quel'Danil Lodge between the High Elf rangers, the Wildhammer dwarves and ourselves, it has been agreed that if the threat from the trolls become too great that we will stand beside them in battle."
STR_wildhammer_path:0 "The Wildhammer Path"
STR_wildhammer_path_desc:0 ""
STR_evacuate_gryphons:0 "Evacuate Gryphons"
STR_evacuate_gryphons_desc:0 ""
STR_northen_bulwark:0 "The Northen Bulwark"
STR_northen_bulwark_desc:0 ""

STR_storm_on_the_horizon:0 "Storm on the Horizon"
STR_storm_on_the_horizon_desc:0 ""
STR_the_embers_of_war:0 "The Embers of War"
STR_the_embers_of_war_desc:0 ""

STR_kingdom_politics:0 "Kingdom Politics"
STR_kingdom_politics_desc:0 ""
STR_status_quo:0 "Status Quo"
STR_status_quo_desc:0 "The Kingdom has been stable for decades, and with no major protests or riots it is not fit to change the current ruling order."
STR_a_change_in_discourse:0 "A Kingdom Divided"
STR_a_change_in_discourse_desc:0 "Our Lord has called upon his advisers to best plan our nations diplomatic actions for the following years."

STR_cultural_exchange:0 "Cultural Exchange"
STR_cultural_exchange_desc:0 ""
STR_a_dear_friend:0 "A Dear Friend"
STR_a_dear_friend_desc:0 "Border clashes have displaced a large number of Stromic citizens that have had to flee, Lordaeron has accepted them willingly and have not requested any form of aid from us, though we suspect this kindness has also caused a strain on their administaion, as such we have sent an envoy to offer them tools...We will just leave out that they are tools taken from the Alteraci."
STR_brewfest:0 "Brewfest"
STR_brewfest_desc:0 ""
STR_the_drunken_hammer:0 "The Drunken Hammer"
STR_the_drunken_hammer_desc:0 "While some of the people made trips to the south to celebrate brewfest with the dwarves of Khaz'Modan, a couple of our smiths visted the Stormpike Bunker, many a drink was had, and a few of our forgehands came back with improved designs for armour, most however came back with hangovers."
STR_champions_of_the_seas:0 "Champions of the Seas"
STR_champions_of_the_seas_desc:0 "Kul'tiras has long protected the trade through the Channel, construction on three lighthouses in the channel has been slow and the thick fog has become troublesome for ships to navigate through safely, we have agreed to fun the construction, but in turn we own the oil rights in the area."
STR_coal_for_iron:0 "Coal For Iron"
STR_coal_for_iron_desc:0 "Stromgarde Coal is known for its much cleaner burn then Gilneans, its use in forges reduces their downtime for cleaning."
STR_the_southern_kingdom:0 "The Southern Kingdom"
STR_the_southern_kingdom_desc:0 "We have not had much contact with Kingdom of Stormwind over the past couple of years diplomatically, however we have maintained reasonable trade relations over the years, buying their grain and wine and supplying them with sturdy horses to help plow their fields. One particular item we purchase from stormwind on bulk is the wonderful Mageroyal that we use for our red dyes."

STR_shelter_for_the_exiles:0 "Shelter For the Exiles"
STR_shelter_for_the_exiles_desc:0 ""
STR_shelter_for_the_exiles_tt:0 "§YThe Initial Influx of Refugees will place a strain on our nation, but this will subside with time§!"

STR_the_peoples_king:0 "The Peoples King"
STR_the_peoples_king_desc:0 ""
STR_bitter_heart:0 "A Bitter Heart"
STR_bitter_heart_desc:0 ""
STR_a_cold_shoulder:0 "A Cold Shoulder"
STR_a_cold_shoulder_desc:0 ""
STR_breakdown_of_civilities:0 "Breakdown of Civilities"
STR_breakdown_of_civilities_desc:0 ""
STR_the_survivors:0 "The Survivors"
STR_the_survivors_desc:0 ""
STR_a_blood_debt:0 "A Blood Debt"
STR_a_blood_debt_desc:0 ""
STR_never_again:0 "Never Again!"
STR_never_again_desc:0 ""
STR_ensure_compliance:0 "Ensure Compliance"
STR_ensure_compliance_desc:0 ""

STR_ear_of_the_king:0 "Ear of the King"
STR_ear_of_the_king_desc:0 ""
STR_gateway_to_the_kingdoms:0 "Gateway to the Kingdoms"
STR_gateway_to_the_kingdoms_desc:0 "We will begin taxing goods that pass through our lands, as we are resposible for caravans and goods that travel without our lands it would not be wrong to ask for payment for such services."
STR_reject_summons:0 "Reject Summons"
STR_reject_summons_desc:0 ""
STR_maintain_borders:0 "Maintain Our Borders"
STR_maintain_borders_desc:0 ""
STR_highlanders:0 "Highland Experts"
STR_highlanders_desc:0 ""

STR_death_in_the_family:0 "Death in the Family"
STR_death_in_the_family_desc:0 ""
STR_mourne_the_fallen_king:0 "Mourne The Fallen King"
STR_mourne_the_fallen_king_desc:0 ""
STR_the_black_pox:0 "The Black Pox"
STR_the_black_pox_desc:0 ""
STR_quarantine_the_hamlets:0 "Quarantine The Hamlets"
STR_quarantine_the_hamlets_desc:0 "The Royal Apothecaries seem to have discovered another source of the plague outside the capital, they have requested that a number of villages be Quarantined to allow them to study and hopefully halt the plague."
STR_the_tower_explosion:0 "The Tower Explosion"
STR_the_tower_explosion_desc:0 ""
STR_forbidden_knowledge:0 "Forbidden Knowledge"
STR_forbidden_knowledge_desc:0 ""
STR_the_black_pyres:0 "The Black Pyres"
STR_the_black_pyres_desc:0 "The Air fills with black smoke every noon and the bodies of the plague are burned."
STR_the_traitor_revealed:0 "The Traitor Revealed"
STR_the_traitor_revealed_desc:0 ""

STR_powder_keg_incident:0 "Powder keg Incident"
STR_powder_keg_incident_desc:0 ""
STR_an_unexpected_offer:0 "An Unexpected Offer"
STR_an_unexpected_offer_desc:0 ""

STR_the_red_banner:0 "The Red Banner"
STR_the_red_banner_desc:0 ""
STR_a_tithe_of_steel:0 "A Tithe Of Steel"
STR_a_tithe_of_steel_desc:0 ""
STR_slaves_for_gold:0 "Slaves for Gold"
STR_slaves_for_gold_desc:0 ""
STR_dragonmaw_landing:0 "Dragonmaw Landing"
STR_dragonmaw_landing_desc:0 "We have purchased a parcel of land from the Wildhammers to assist the Orcs from the south, even though the wildhammers have no ancestral claim to the region we still deemed it best to aquire the land though more diplomatic means then simply taking it."
STR_undermine_the_brotherhood:0 "Undermine the Brotherhood"
STR_undermine_the_brotherhood_desc:0 "Stormwinds Knights have been causing havoc for the Orcish forces in the south, unfortunatly for Stormwind we have 'dealt' with a number of farriers, as such many of their steeds are already running afoul."
STR_makrogahn:0 "Mak'Rogahn"
STR_makrogahn_desc:0 ""

STR_the_royal_visit:0 "Royal Military Envoy"
STR_the_royal_visit_desc:0 "News from the south has reached Stromgarde that Anduin Lothar has begun reforming the Stormwind Army, the king has decided to visit the kingdom to see how they are progressing."
STR_the_dark_riders:0 "Dark Riders"
STR_the_dark_riders_desc:0 ""
STR_our_demands:0 "Demands to Stormwind"
STR_our_demands_desc:0 ""
STR_behind_enemy_lines:0 "Behind Enemy Lines"
STR_behind_enemy_lines_desc:0 ""
STR_summon_a_warcouncil:0 "Summon a Warcouncil"
STR_summon_a_warcouncil_desc:0 "The Situation in the Stormwind has lead the king to believe that we may soon face the same threat."
STR_reinforce_stormwind:0 "Reinforce Stormwind"
STR_reinforce_stormwind_desc:0 "Stormwind will need assistance against the Orc Horde, the king has dispatched men to the south to assist them with the war, he has acknowledged the concerns around security with sending men south but has ensured the nobles that the Kingdom has more then enough forces to hold any foe at bay."
STR_inside_our_borders:0 "Inside Our Borders"
STR_inside_our_borders_desc:0 ""
STR_the_broken_highlands:0 "The Broken Highlands"
STR_the_broken_highlands_desc:0 "The Trolls somehow managed to bypass our defense, it would seem the some of the Nobles are not happy with the king sending their forces south to aid Stormwind, but we did not expect Treason from them, Its a wonder if Alterac is behind this."
STR_the_guardians_gift:0 "The Guardians Gift"
STR_the_guardians_gift_desc:0 ""

STR_bleed_them_dry:0 "Bleed Them Dry"
STR_bleed_them_dry_desc:0 "We will hold the line and muster our forces against the Troll Invasion, they will learn the taste of our steel."
STR_repel_the_savages:0 "Repel the Savages"
STR_repel_the_savages_desc:0 "A number of fearful looking apparitions have been spotted on the battlefield, many of the men are shocked by their presence but they seem to be fighting along side Captain Hearthwell."
STR_harvest_their_essence:0 "Harvest Their Essence"
STR_harvest_their_essence_desc:0 "Reports from the front of some of our men being effected by some sort of curse have begun to surface, the king however has explained that he has already consulted with Captain Carver and a handful of healers, and it would seem that these apparitions have been saving them from the brink of death and transforming them."
STR_the_kings_deployment:0 "The Kings Deployment"
STR_the_kings_deployment_desc:0 "The King has taken it upon himself to enter the fray against the Trolls, though it would seem his nephew does not support this action."
STR_conscript_the_devout:0 "Conscript the Devout"
STR_conscript_the_devout_desc:0 "Seeing the Crimson Flames actions in person have unnerved some of the followers of the light, but those who have been saved by the Chosens Interference have seen them as warriors of a greater power."
STR_the_chosens_commander:0 "The Chosens Commander"
STR_the_chosens_commander_desc:0 "From a portal opened at Highperch a massive figure strode forth, many men drew their arms expecting a fight, none of them expected the being to kneel before the King, who was still dwarved by the figure."
STR_the_crimson_will:0 "The Crimson Will"
STR_the_crimson_will_desc:0 "The number of devoted have swelled in number, many have activly begun seeking out members of the chosen to see how they may be of assistance."
STR_hex_hound_hunters:0 "Hex Hunter Hounds"
STR_hex_hound_hunters_desc:0 "The Trolls left hexes behind on the lands, it would take years to find all their totems and destroy them. Aldric however has summoned hounds from the crimson flames domain that are attuned to hunt troll voodoo magic"
STR_living_flames:0 "Living Flames"
STR_living_flames_desc:0 "From the old dwarven binding circles the King called upon the living flames that dwelled within, their bodies taking form from the rocks the lay scattered around the shrine."
STR_subjugate_the_hinterlands:0 "Subjugate the Hinterlands"
STR_subjugate_the_hinterlands_desc:0 ""
STR_the_empires_crown:0 "The Empires Crown"
STR_the_empires_crown_desc:0 "The Trolls refuse to accept the Crimson Flame, they saw the power it held as it swept aside their weak Loa magics. They can have it their way, gather wood for a pyre."
STR_great_war_machines:0 "Great War Machines"
STR_great_war_machines_desc:0 "Giants from the flames domain have made creations that we would expect only from dwarves and gnomes, could they be their ancestors?"
STR_felsteel_production:0 "Felsteel Production"
STR_felsteel_production_desc:0 "Forges built upon the Crimson Wills eternal flame melt iron and steel like they were butter, only the chosen are granted permission to enter the forges, but the creations that emerge from the flames are made beyond dwarven craftsmanship."
STR_whispers_in_the_flames:0 "Whispers in the Flames"
STR_whispers_in_the_flames_desc:0 "My King, many of the citizens have begun to hear whispers from their hearths, many have begun building small altars in worship to the crimson flame, but we have found some have instead began to live in complete darkness."
STR_shadows_of_doubt:0 "Shadows Of Doubt"
STR_shadows_of_doubt_desc:0 "My Lord your Nephew has began a campaign to dethrone you, he accuses you of being a false king and that you are leading this kingdom to ruin, he must jest."
STR_crush_the_heretics:0 "Crush The Heretics"
STR_crush_the_heretics_desc:0 "My Lord, Your Nephew has Fled the Kingdom, he seems to have been trying to garner some level of support among the nobles to curtain the powers of the throne."
STR_chosen_of_the_flame:0 "Chosen of the Flame"
STR_chosen_of_the_flame_desc:0 "Lord, we have more willing subjects who wish to serve the crimson flames ambitions of spreading its teachings through the lands."
STR_the_temple_of_eternal_flame:0 "Temple of Eternal Flame"
STR_the_temple_of_eternal_flame_desc:0 "A Temple has been constructed upon the eternal flame of the crimson will, its construction was aided by the chosen, who have been able to focus the flame to become a great beacon to the sky."
STR_crimson_lords_chosen:0 "Crimson Lords Chosen"
STR_crimson_lords_chosen_desc:0 "Is it true my lord, that you were chosen by the Crimson Lord himself to spread his teachings through the kingdoms?"
STR_pact_with_the_legion:0 "Pact With the Legion"
STR_pact_with_the_legion_desc:0 "We are the Legion of the faithful, we will show the lords power to all, and burn those who refuse his warm embrace."

STR_destructive_terraforming:0 "Destructive Terraforming"
STR_destructive_terraforming_desc:0 "The King has Decreed that the land around the Temple of Eternal Flame needs to be cleared of unnessecary landmarks and debris, he has issued the command to use explosives taken from the dwarves to do so."

STR_mastering_the_flame:0 "Mastering The Flame"
STR_mastering_the_flame_desc:0 "Many have suffered greatly trying to master the crimson flame, but it seems with the chosens teachings many more have been able to harness the power without being consumed by it."
STR_eternal_guard_dogs:0 "Eternal Guard Dogs"
STR_eternal_guard_dogs_desc:0 "The Hex Hounds have become valued pets of the faithful, they act just like any other guard dog would, protecting cattle and other livestock, they also are capable of taking down Troll Raptors as an added bonus."
STR_designs_from_beyond:0 "Designs From Beyond"
STR_designs_from_beyond_desc:0 "The Giants have shown us plans for a great creation, fueled by the crimson lords very essence, this creation would be used to clear obstables with eash and bring walls crumbling down."

