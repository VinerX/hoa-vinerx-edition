stromgarde.1.t:0 "Meeting of the Seven Kingdoms."
stromgarde.1.d:0 "The Kingdom of Lordearon has called a Meeting of the Seven Kingdoms, something that has not been done for a millennia, it would seem as though they are taking the threat from the Orcs to the south seriously."
stromgarde.1.option.1:0 "We shall attend"
stromgarde.1.option.2:0 "We have our own matters to attend to."

stromgarde.2.t:0 "Secure the Fontier"
stromgarde.2.d:0 "Lordaeron has requested that we align ourselves more closly with their politics to better serve the realms."
stromgarde.2.option.1:0 "We shall enter the fold."
stromgarde.2.option.2:0 "I tire of this Nagging."

stromgarde.3.t:0 "Tol'Barad Prisoners"
stromgarde.3.d:0 "The Warden at Tol'Barad has sent an envoy informing us that many of our prisoners sentences have been commuted due to good behaviour, though this was not what was expected we have little choice in the matter."
stromgarde.3.option.1:0 "Keep a close eye on them."

stromgarde.4.t:0 "Weapon Specialists"
stromgarde.4.d:0 "Our skirmishes with Alterac over the years have made it quite obvious were are one of the superior fighting forces in the region, however some of our men have found fighitng blow for blow against an opponent can be troublesome, as such High command has offered up ideas to specialize our forces."
stromgarde.4.option.1:0 "Great Weapons"
stromgarde.4.option.2:0 "Arbalests"
stromgarde.4.option.3:0 "Spellweavers"
stromgarde.4.option.4:0 "Lancers"

stromgarde.5.t:0 "Wardens Vigil"
stromgarde.5.d:0 "Tol'Barad has undergone extensive improvements to ensure order within its confines. Substantial resources, manpower, and planning have been invested to create a disciplined and controlled environment."
stromgarde.5.option.1:0 "Further Devlop the Prisons"
stromgarde.5.option.2:0 "Look to cut off the Pirates"

### Survivors Event
stromgarde.6.t:0 "A Bloody Dawn"
stromgarde.6.d:0 "A Group of bloodied stromic citizens were intercepted to the north of Thoradin's Wall, they told the guards of an attack on a small village by Alteraci forces, claiming that if they did not disarm themselves they would be arrested. We sent a small guard detachment and found the site of the battle, we found eighteen bodies of men, women...and one child."
stromgarde.6.option.1:0 "We will bury the Alteraci once and for all."

stromgarde.7.t:0 "Meeting of the Seven Kingdoms."
stromgarde.7.d:0 "The Kingdom of Lordearon has called a Meeting of the Seven Kingdoms, something that has not been done for a millennia, though it would seem they are more worried about internal threats then that of the Orcs to the south."
stromgarde.7.option.1:0 "We shall attend"
stromgarde.7.option.2:0 "We have our own matters to attend to."

stromgarde.11.t:0 "A Thousand Years Of Peace"
stromgarde.11.d:0 "Our Kingdom has spent the last thousand years in relative peace, once the land was cleared of the Witherbark Trolls we were able to begin farming without needing to look over our shoulders all the time, our people..."
stromgarde.11.option.1:0 "Feel safe in their homes"
stromgarde.11.option.2:0 "Still fear the Witherbark"

stromgarde.12.t:0 "Lord Trollbanes Rule"
stromgarde.12.d:0 "Lord Trollbane has guided our kingdoms growth and prosperity for years, above all else his focus on the..."
stromgarde.12.option.1:0 "Masons Guild"
stromgarde.12.option.2:0 "Stromgarde Ambassadors"
stromgarde.12.option.3:0 "Civil Guard"

stromgarde.13.t:0 "A New Year"
stromgarde.13.d:0 "In the early days of the new year, Lord Trollbane had already finalized his requirements from his administration, his main focus was on..."
stromgarde.13.option.1:0 "The Stromic Army"
stromgarde.13.option.2:0 "Our Kingdoms Development"
stromgarde.13.option.3:0 "Getting Politics Out of the Way"

### OLD GODS
stromgarde.14.t:0 "The Powder Keg Incident"
stromgarde.14.d:0 "In the Early morning a large explosion was heard on our eastern border, it was so loud the King himself rode out with his knights to assess what had happened, one of the bridges of the Thandol Span was blackened rubble, while the King and his forces were assisting those trapped beneath rubble and sending riders for priests for the wounded, a heavily armed group of Anvilmar Dwarves demanded we withdrew as once. The King knowing how much the Dwarves cherished the Span withdrew his men and ordered his men to grab the most wounded person near them."
stromgarde.14.option.1:0 "Get me the Priests...NOW!"

stromgarde.15.t:0 "The Span Seized"
stromgarde.15.d:0 "The Anvilmar have blamed us for the Explosion that occured on the bridge and have refused any form of diplomatic actions we have taken to attempt to resolve this issue peacefully, an hour ago a battalion of Dwarven soldiers walked across the bridged and seized our territory, we have ordered our soldiers to pull back for now as starting a war with the Dwarven Kingdom is the last thing we want to do."
stromgarde.15.option.1:0 "Find me who is responsible"

 stromgarde.16.t:0 "Destruction of The Thandol Span"
 stromgarde.16.d:0 "A ruckus was heard outside the council hall, an Anvilmar clansman had broken through the heavy chamber doors and demanded an audience while being held back by three guards, seeing that his expression was not due to anger but pain calm was demanded in the chamber.The Clansman had informed us of what had occured at the Thandol Span, the ancient consturction that symbolized our connection to the wildhammers of the north had been partially destroyed by the careless actions of the Humans of Stromgarde, the Kings decision was final."
 stromgarde.16.option.1:0 "We will safeguard the Thandol Span."

 ### HORDE
 stromgarde.20.t:0 "A Boat of Long Knives"
 stromgarde.20.d:0 "In the early morning a pink skin was brought before Blackhand, the fool was one of a few captured by the Bleeding Hollow, having willing come ashore outside one of their camps. The Boat Was carrying weapons, sharp blades assumed to have been on route to be delivered to the lands to the west. As the man was dragged away babbling in human tongue, Doomhammer let out a laugh that shook the hall, he brought one of the blades presented to him and pointed out the three marks on the side of the blade, two crudely eteched symbols which belonged to the Bleeding Hollow clan and the Blackrock, the third one was unknown to Doomhammer as it was a Fist, These weapons were a seen as a sign of either peace or subjugation. Blackhand ordered a group of orcs to follow the pink skins back to where they came, accompanied by a warlock who understands the tongue of man. With regards to the weapons, they were far too long to serve as common knives, and too small to be used effectivly by our forces."
 stromgarde.20.option.1:0 "The Hordes Scouts will make Use of these weapons."

 stromgarde.21.t:0 "A Deal with the Red Hands"
 stromgarde.21.d:0 "Throm Stormbreath has told sent word that a boatful of slaves have been sent from the Red hands Prison Island, We are allowed to do whatever we wish with them, in return we are to send ahe left over gold from Sunnyglade and Redridge."
 stromgarde.21.option.1:0 "Send Word to the Bleeding Hollow, The Trinkets are valuable"

 stromgarde.22.t:0 "A Warriors Duel"
 stromgarde.22.d:0 "Our Advisor from the Horde has organized our official acceptence into the Horde, however to be inducted into their ranks King Trollbane must best a skilled Warrior from the Blackrock Clan. A Painless task for our King, besting an orc will be childs play."
 stromgarde.22.option.1:0 "Set Sail to the South"

 stromgarde.23.t:0 "Mak'Rogahn"
 stromgarde.23.d:0 "We have heard news from ours eyes in the north, the leader of the Redhands is on his way to our lands, he has demanded a position in the horde and has challenged Doomhammer to Mak'Rogahn to prove his rightful place."
 stromgarde.23.option.1:0 "When did this Human learn our language?"

 stromgarde.24.t:0 "Orgrim Doomhammer"
 stromgarde.24.d:0 "The Orc that Trollbane is to fight is none other then Orgrim Doomhammer, right hand of the Orcish Warchief and a military genius. /n "This is no simple Orc" Trollbane said through gritted teeth, "If i am to die here tell my sons, whoever kills Stormbreath will have the throne, but if i live through this, im taking that Orcs head myself"."
 stromgarde.24.option.1:0 "Light be with you King Trollbane"

 stromgarde.25.t:0 "Thoras Trollbane"
 stromgarde.25.d:0 "The Human Leader arrived on the Western Front flanked by heavily armored division of guards, the Redhand engraved in their Plate armor and on their standards, the King was a Large man wore a simple crown and wielded a mightly Axe, a weapon more suited to an Orc then a Human. Both the King and Doomhammer sized each other up on the field the King turned to his men and shouted something to them in the Human tongue something abour Stormbreath, then turned and brandished his Axe."
 stromgarde.25.option.1:0 "For The Horde!"

 stromgarde.26.t:0 "Duel Interrupted"
 stromgarde.26.d:0 "While the Duel between Lord Trollbane and the Orc was raging on we began to hear the Thundering of Hooves, The Orcs begun to grab their weapons and look towards the sound as a dozen stormwind knights burst through the tree line riding directly towards the Duel, they cut through the lines like a knife through Butter, they were indiscriminate in their attacks, targeting the orks and ourselves as we rushed to the Lords side, we found him laying on the ground a lance wound in his back with Orc healer tending to his wounds, with Doomhammer beating a knight to death with his own helmet."
 stromgarde.26.option.1:0 "Damn Stormwind to their Fate!"

 stromgarde.27.t:0 "Duel Interrupted"
 stromgarde.27.d:0 "While the fight was raging on between Doomhammer and the Human a thundering sound could be heard, an alarm was raised by the lookouts but it was too late, a group of Knights had already begun charging through our lines right into the Duel, Trollbane used this distraction to take Doomhammer unaware but instead of trying to strike Doomhammer threw his Axe at a horseman charging up behind Doomhammer, before being piece by a lance through the back."
 stromgarde.27.option.1:0 "Kill the Knights, and find a healer!"

 stromgarde.28.t:0 "An Odd Occurence"
 stromgarde.28.d:0 "One of our Mages recieved an odd message from a Wizard from the Guardians Tower explaining that something odd is happening to the east in the swamps, we have been unable to contact the individual at this time."
 stromgarde.28.option.1:0 "Use our contacts in Redridge to confirm this."
 stromgarde.28.option.2:0 "Ignore the Wizard, leave Medivh alone."

 stromgarde.29.t:0 "Greenskins"
 stromgarde.29.d:0 "Our Contacts have confirmed that the Swamps are filled with Greenskined creatures, that seem to be intelligent and are in the midst of some sort of Civil War."
 stromgarde.29.option.1:0 "By the Light!"

 stromgarde.30.t:0 "The Dragon Queen"
 stromgarde.30.d:0 "While clearing the Dragons and Orcs from the Dwarven city we found a large number of eggs as well as the Dragon Queen, some Orc Warlock screamed at her to kill us but she resisted his commands."
 stromgarde.30.option.1:0 "Liberate the Queen!"
 stromgarde.30.option.2:0 "Dragons? This close to the Kingdom?"
 stromgarde.30.option.3:0 "Study that Orb"

 ### TROLL TUNNEL AUTO PEACE
 stromgarde.31.t:0 "Bleeding us Dry"
 stromgarde.31.d:0 "We have been unable to take the tunnel back from the Humans, Many of our tribesmen have taken injuries from their men and need time to recover, the tunnel is a bottleneck that only results in more losses, it may be best to give it to the humans and barricade the entrance"
 stromgarde.31.option.1:0 "Let the humans have their tunnel"
 stromgarde.31.option.2:0 "We will make the humans bleed"
 STR_pass_peace_tt:0 "The Witherbark have withdrawn from the tunnel and fortified the entrance to their City"

 ### BORDER WAR WIN - ALT
 stromgarde.32.t:0 "A Final Blow"
 stromgarde.32.d:0 "We have finally pushed the Army of Alterac out of our borders, General Hath has agreed that continued incursions at this time are meaningless for both sides, and we will cease hostilities for now."
 stromgarde.32.option.1:0 "They will be back in time."

 ### BORDER WAR LOSS - ALT
 stromgarde.33.t:0 "A Harrowing Defeat"
 stromgarde.33.d:0 "Our army has been routed from our territory, General Hath has agreed to halt any futher advances at this time as he does not think the Stormpike dwarves will stand for any more damage being done to Thoradins Wall, and we will cease hostilities for now."
 stromgarde.33.option.1:0 "We will return in time."

 ### BORDER WAR WIN - TROLLS
 stromgarde.34.t:0 "The Echos of War."
 stromgarde.34.d:0 "We have forced the trolls from the ledge, now our people will not need to fear being beset by trolls in the night."
 stromgarde.34.option.1:0 "We will deal with the rest in time."

 ### BORDER WAR LOSS - TROLLS
 stromgarde.35.t:0 "The Tunnel Stands"
 stromgarde.35.d:0 "The Trolls have held the ledge, our forces have been battered by the sheer savagery of the trolls, morale is low and the offensive has been stopped."
 stromgarde.35.option.1:0 "Those damned beasts."

 ### BORDER WAR WIN - TROLL SIDE
 stromgarde.36.t:0 "Our Warriors Stand"
 stromgarde.36.d:0 ""
 stromgarde.36.option.1:0 "Dis it not da last of dem."

 ### BORDER WAR LOSS - TROLL SIDE
 stromgarde.37.t:0 "Lost Land"
 stromgarde.37.d:0 ""
 stromgarde.37.option.1:0 "Dey will rue da day."

 ### DEATH
 stromgarde.40.t:0 "Book of the Dead"
 stromgarde.40.d:0 "In the Ruins of the Mage tower we have found books of forbidden magics that should have been sealed away long time ago, Our Arcanists have been able to dispel the death magics, however the Lord Galen has deemed that these tomes may be the key to aiding the Kingdoms recover, King Danath has begrudgingly agreed with his brother on this matter."
 stromgarde.40.option.1:0 "The Dead Workers."
 stromgarde.40.option.2:0 "The Vengeful Dead."

 stromgarde.41.t:0 "The Traitor Revealed"
 stromgarde.41.d:0 "In the shadowed halls of the family crypt, King Danath's heart raced as he ventured into the depths of his fathers chamber. In the candle lt darkness, the flickers of arcane symbols etched on the floor glow a pale green. There, he beheld his brother Galen, clad in robes of darkness, hands outstretched holding an ominous tome. Whispers of incantations filled the air, intertwining with the stench of decay as Galen's desperate attempts at necromancy were unveiled before his horrified kin, there in front of Danath stood the late King Thoras."
 stromgarde.41.option.1:0 "Danath Strikes the abomination."
 stromgarde.41.option.2:0 "Danath Stays his Hand."

 stromgarde.42.t:0 "A Clash of Steel"
 stromgarde.42.d:0 "Amidst the chilling mist that clung to the castle's ancient walls, Danath's heart sank as he confronted the monstrous figure before him. His father, once a noble ruler, stood now as a twisted, undead puppet under the malevolent control of his own son. The very air grew heavy with sorrow and betrayal as Danath's sword clashed against the unholy abomination. With every strike, memories of happier times mingled with the horror of the present, until a final, tragic blow fell, ending both the life of Danath and any remnants of hope for the Kingdom."
 stromgarde.42.option.1:0 "They will never know"

 stromgarde.43.t:0 "A Cold Silence"
 stromgarde.43.d:0 "Galens necromantic ambitions had backfired in the cruelest of ways, as his undead father lurched forth with hollow eyes. In a moment of astonishing clarity, a glimmer of recognition flickered within those vacant orbs. With a surge of unexpected strength, the undead king's hands closed around Galen's throat, not in vengeance, but in a desperate attempt to free himself from the chains of dark magic. As life returned to his father's gaze, a single tear rolled down his cheek as he ended his own son's life and shattered the malevolent spell."
 stromgarde.43.option.1:0 "The King Returns!"

 stromgarde.44.t:0 "An absent mind"
 stromgarde.44.d:0 "Over the last few weeks the king has been acting strange, keeping to himself and rarely speaking to the court, his mind seems to be elsewhere and some of the nobles have noted him staring at the priestess longingly."
 stromgarde.44.option.1:0 "Keep a Watchful Eye"

 stromgarde.45.t:0 "A Pointless Demands"
 stromgarde.45.d:0 "The Kingdom of Stromgarde has issued a diplomatic commons for members of the Council of seven to explain the outbreak of a plague that seems to have originated from the Mage Tower inside their capital, it would seem they have come to this conclusion from their own invesigation, however it would seem the plague is localized only to their own lands."
 stromgarde.45.option.1:0 "Delay the hearing till the plague is no more"

 stromgarde.46.t:0 "Wizard Bastards"
 stromgarde.46.d:0 "The Kirin Tor have spat on our desire to have a hearing on the plague that originated from their own mage tower in our lands, they sit in their city and wine and dine while our people have to watch their loved one wither away."
 stromgarde.46.option.1:0 "They have been free too long"

 stromgarde.47.t:0 "Traitors and Turncoats"
 stromgarde.47.d:0 "A Large number of our army have decided to stand against us in this war, there have been complaints from the enlisted men that they do not feel comfortable serving beside the dead...fools, those dead are more then willing to stand in service of the Kingdom and for their King!"
 stromgarde.47.option.1:0 "Death is too good for them"

 stromgarde.50.t:0 "A Dark Rider"
 stromgarde.50.d:0 "In the Dead of night someone snuck into the Kings Quarters, it is unknown if their intention was to assassinate him, but in the skirmish they stole Trol'kalar, riders have already been dispatched to find their origin."
 stromgarde.50.option.1:0 "We will find them."

 stromgarde.51.t:0 "The Guardians Domain"
 stromgarde.51.d:0 "Our Scouts tracked the riders to the borders of Karazhan, the realm of Stormwinds Guardian, King Trollbane requested entry into the lands to try to find a trace of the riders, but the King of Stormwind has denyed his request. In reponse, King Trollbane has begun gathering a number of stilled warriors to accompany him into Karazhan."
 stromgarde.51.option.1:0 "We will do it ourselves."

 stromgarde.52.t:0 "The Guardians Domain"
 stromgarde.52.d:0 "We had not heard from the king in nearly a month, Stormwind did not take long to discover the kings as it seems he was being watched by the kingdoms spys. Some of the men resisted and were placed under house arrest, others left willingly thinking the worst. But one day the King rode through the gates of Stormwind, he handed a letter to one of the guards and asked for it to be taken to the king. It would seem that while battling through the defenses of the tower Medivh and the King came upon a chance meeting, it would seem that one of the Guardians followers had mistakely taken Trol'kalar when they were instead instructed to look for a Troll Blade."
 stromgarde.52.option.1:0 "At least war is averted."

 stromgarde.53.t:0 "Noble Traitors"
 stromgarde.53.d:0 "What sort of Stromgardian Noble would side with the savage trolls of the north? After we sent men south to assist Stormwind a group of duplicitous nobles have let trolls settle their lands, they feign innocence but royal scouts have already confirmed that they have been were for weeks."
 stromgarde.53.option.1:0 "Gather the Loyal Generals"

 stromgarde.54.t:0 "Cleansing Flame"
 stromgarde.54.d:0 "As the Trolls pushed south into our lands, the King took his royal guard and stood at the top of Highperch, seeing his men die heroically against the trolls he raised Trol'kalar the blade emitting and green hue and uttered words that no man had ever heard, as green flames begun to errupt from some of the trolls on the battlefield, with another few words a portal opened next to the King and three arcane hounds ran onto the battlefield."
 stromgarde.54.option.1:0 "No more Hexes!"

stromgarde_third_war.1.t:0 "The Question of the Alliance"
stromgarde_third_war.1.d:0 "Recent reports from the Hillsbrad Foothills and Arathi informs us that the orcs attacks on the internments camps have culminated into the siege of the biggest and most fortified of them: Durnholde Keep. Our guards stationed on the wall have informed us that the keep has been completely destroyed by the united orcish clans led by a certain Thrall and that there are no plans to rebuild it.\n\n This news is but another reminder that all these taxes that the Alliance forces upon our kingdom serves no purpose and that its leadership is purely incompetent. With Danath all but lost beyond the Dark Portal, and the ogres still infesting our lands a council has been convened to discuss the kingdoms future."
stromgarde_third_war.1.option.1:0 "The King will break the news to the Alliance."
stromgarde_third_war.1.option.2:0 "We fought the orcs together, we will not abandon them."
stromgarde_third_war.1.option.3:0 "Our Path is our own for tread."

stromgarde_third_war.2.t:0 "Death of the King"
stromgarde_third_war.2.d:0 "The Kings sudden death has rocked the kingdom, as the kings council was on their way to deliver news from the north of a new plague, King Thoras Trollbanes life less body was found in the halls of the Keep. Prince Galen was beside himself when he heard the news, not only had his cousin been lost beyond the portal, now his father had passed."
stromgarde_third_war.2.option.1:0 "Galen will be crowned King, but for now let him mourn."

stromgarde_third_war.3.t:0 "The Ogres are back!"
stromgarde_third_war.3.d:0 "The Ogres had hid themselves away in the Southern Mines for Years, they had dug deep into the rock and built a tunnel network a rabbit would be jealous of, now they have returned to the surface, bringing with them reminders of the Second War."
stromgarde_third_war.3.option.1:0 "The Prince's coronation comes first, contain them."

stromgarde_third_war.4.t:0 "These Damned Ogres!"
stromgarde_third_war.4.d:0 "The Day before the Princes coronaiton another horde of ogres appeared from barrows and begun attacking our people, even the prince snapped from his malaise and ordered an all out assault on the ogres."
stromgarde_third_war.4.option.1:0 "Push them from our lands, not a single one will survive!"

stromgarde_third_war.5.t:0 "From the Rear!"
stromgarde_third_war.5.d:0 "How are there so many of them, did we not kill countless of them during the war?"
stromgarde_third_war.5.option.1:0 "Route those at the rear."

stromgarde_third_war.6.t:0 "Arathi Filth!"
stromgarde_third_war.6.d:0 "When we are stuck fighting off the ogres the so called 'Syndicate' of Noble criminals have decided to join the fray."
stromgarde_third_war.6.option.1:0 "If only Terenas had let us end that bloodline!"

stromgarde_third_war.7.t:0 "Now kobolds?"
stromgarde_third_war.7.d:0 "First Ogres, then Trators, now Kobolds? Light Preserve us."
stromgarde_third_war.7.option.1:0 "Dont let the kingdom fall!"

stromgarde_third_war.9.t.1:0 "Stromgarde reaffirms its support for the Alliance."
stromgarde_third_war.9.t.2:0 "Stromgarde withrdraws from the Alliance"
stromgarde_third_war.9.d.1:0 "In the wake of the Siege of Durnholde and the looming failure of the Orc Interment Act, Stromgarde has opted to reassert its commitment to the Alliance. Despite recent setbacks,King Genn Greymane recognize the emergence of a new Horde as an undeniable threat. Understanding that only through collective strength can the nations of the Alliance avert further devastation to their lands."
stromgarde_third_war.9.d.2:0 "Following the Siege of Durnholde and the impending failure of the Orc Interment Act, Stromgarde has made the resolute decision to withdraw from the Alliance. Citing the loss of Prince Danath Trollbane, the poor handling of the Alterac crisis and the considerable resources squandered on the Internment camps. The Kingdom of Stromgarde have chosen to find their own path forward."
stromgarde_third_war.9.option.1:0 "We are stronger together."
stromgarde_third_war.9.option.2:0 "Troubling news."

