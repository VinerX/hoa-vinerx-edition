STR_purge_the_light:0 "Tarnish The Light"
STR_purge_the_light_desc:0 "The Light has long held sway over our lands, but we been shown the true nature of The Light by our Masters, with the help of their servants we will tighten our grasp on this land."
STR_desecrate_the_altars:0 "Desecrate the Altars"
STR_desecrate_the_altars_desc:0 "Though the worship of the light within the kingdom has reduced greatly there are still those who have personal Altars, it would be best to send soldiers quarantine these individuals and ensure no traces of 'The Pox' Remain."
