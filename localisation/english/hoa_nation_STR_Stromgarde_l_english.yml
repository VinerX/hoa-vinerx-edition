STR_ennoble_apothecary:0 "Ennoble Apothecaries"
STR_ennoble_apothecary_desc:0 "May of the Royal Apothcaries have risked their lives to save to Kingdom from the plague and helped may people move on from the deaths of their loved ones, the King has deemed a number of them shall be Ennobled, though this has caused some friction with the Nobility."
