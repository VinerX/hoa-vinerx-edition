GUT_warlord_gurthan:0 "Warlord Gurthan"
POLITICS_WARLORD_GURTHAN_DESC:0 "Once the mighty warlord of the Gurthan clan, commander of the mogu defence of the serpent's spine, and the tamer of beasts. Mysterious resurrected, he now seeks to reclaim the sperent's spine and erradicate the mantid from his clan's home using the haunting spirits and remaining mogu of his clan."

GUT_krol_the_blade:0 "Krol the Blade"
POLITICS_KROL_THE_BLADE_DESC:0 "Krol the blade, champion of the remaining Gurthan mogu that stayed in the dread wastes. He was reawakened by Warlord Gurthan to lead his armies, though it remains to be seen to if he continue to serve the fallen warlord or try and claim the glory of the restoring the Gurthan clan for himself."
