smack_heads_together_1_decision:0 "Smack Heads Together - Level 1"
smack_heads_together_1_decision_desc:0 "Our warriors are rowdy, and frequently quarreling amongst eachother. This state of affairs cannot stand. Its time to smack some heads together and instil some discipline, even if it means their lust for battle is tempered."
