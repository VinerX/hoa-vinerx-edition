################################################################
#Horde Ideology - Forge Homeland
################################################################
horde_prepare_industrial_sector_decision:0 "Prepare Industrial Sectors"
horde_prepare_industrial_sector_decision_desc:0 "Our new homeland is woefully lacking in workable space for facilities, living quarters, and many other sorts of desirable amenities. We can comission a large scale project to make room for our ambitious plans for this land."
horde_build_roads_decision:0 "Construct Interconnected Roads"
horde_build_roads_decision_desc:0 "The Infrastructure of this land of ours is woefully lacking. If we are to make this rough land our new home, we must see to it that resources and people can travel swiftly from place to place."
horde_build_military_factories_decision:0 "Invest in the Smithies"
horde_build_military_factories_decision_desc:0 "Though we may have claimed this land as our own, there are already forces that seek to take it from us. We must ensure that our warriors are forever able to defend our new borders with fresh stocks of weaponry made within our forges."
horde_build_civilian_factories_decision:0 "Establish Peon Guilds"
horde_build_civilian_factories_decision_desc:0 "There are many members of our clan unworthy for military service who could be put to work bettering our newly found land. We must organize them into guilds that they may better complete the many projects our territory requires."
horde_build_farms_decision:0 "Assure Food Supplies"
horde_build_farms_decision_desc:0 "Expanding and reforming our nation into something new is great but we won't go far if we cannot feed our population and armies with a reliable source of food."
horde_build_stables_decision:0 "Prepare Local Stables"
horde_build_stables_decision_desc:0 "Our mounted warriors are in need of a fresh source of mounts. We can prepare a series of stables and holding pens to better herd suitable beasts for this purpose."
horde_build_lumber_mills_decision:0 "Expand the Lumber Camps"
horde_build_lumber_mills_decision_desc:0 "Nearly all of our structures require some manner of lumber during their construction. We should expand our lumber yards to ensure the flow of this resource is never interrupted."
horde_build_iron_mines_decision:0 "Dig out Iron Mines"
horde_build_iron_mines_decision_desc:0 "Our forges are in desperate need of an additional source of Iron. We can choose to commit a substantial amount of labour to excavating several suitable locations"
horde_build_sulfur_mines_decision:0 "Dig out Sulfur Mines"
horde_build_sulfur_mines_decision_desc:0 "We have need of more explosive powder. New sulfur mines can be dug out with a significant investment of time and resources."
horde_build_oil_refinery_decision:0 "Drill for Oil"
horde_build_oil_refinery_decision_desc:0 "Our navy is in need of a great deal of oil in order to properly function. We should see to the creation of a series of oil refineries to make better use of what 'Black Gold' we currently possess."
horde_build_arcane_towers_decision:0 "Channel Leylines"
horde_build_arcane_towers_decision_desc:0 "Our Spellcasters claim they can synthesize additional mana crystals if we were to only provide them the requisite facilities to channel the natural leylines of the world."

