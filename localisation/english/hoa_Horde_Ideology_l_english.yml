horde_demand_respect_decisions:0 "Demand Respect"
horde_demand_respect_decisions_desc:0 "Our clan is led by those with the will to grab it by the horns and force it to heel. A weak leader is swiftly deposed and replaced with one who has the strength to assert their right to rule. If you are to retain control over your clan, they must respect you, either through force of will, or force of arms!"
horde_respect_1_to_2_decision:0 "Yell Loudly"
horde_respect_1_to_2_decision_desc:0 "Oftentimes the loudest voice within our clan is the one the weaker members pay the most attention. If you were to make your voice the loudest of these, others may take you more seriously as Warchief."
horde_respect_2_to_3_decision:0 "Inspire the Warriors"
horde_respect_2_to_3_decision_desc:0 "Our Warriors look up to senior members of the Warrior Caste for motivation. Though you longer fight directly among the rank and file, tales of your exploits from your younger days could serve as useful inspiration, and even encourage some amount of reverence for you."
horde_respect_3_to_4_decision:0 "Lead From the Front"
horde_respect_3_to_4_decision_desc:0 "There is no need for you to cast aside your axe, even if you are no longer as fit as the younger warriors. The sight of their Warchief close to the thick of battle will give our warriors something to look to when the situation turns for the worse. Besides, the chaos of battle brings back thrilling memories, and serves as a good excuse to ditch your nagging retainers and minders."
horde_respect_4_to_5_decision:0 "Subjugate Lesser Chieftains"
horde_respect_4_to_5_decision_desc:0 "There are always pretenders to your throne that need to be put back in their place. Now that the warriors revere you, it is time to crush any notion that you could ever possibly be replaced until your noble heart ceases to beat."

horde_wartime_fervour_decisions:0 "Wartime Fervor"
horde_wartime_fervour_decisions_desc:0 "The horde is not an idle nation of farmers and artisans. It is a powerful and respected tribal collection of warriors and craftsmen. Our strength is not to be denied by our lessers, and we will brook not even the slightest perception of weakness by our neighbors."
horde_peacetime_preparations_decisions:0 "Peacetime Preparations"
horde_peacetime_preparations_decisions_desc:0 "Peace is naught but a lull before our next battle. Though we may currently lack a foe to lock horns with, there is no shortage of battle to be had within our own ranks. Some of these battles must be quelled before they become a greater problem, others encouraged to ensure our edge is never dulled. As Warchief, you will decide which is which."

horde_forge_new_nation_decisions:0 "Forge a New Nation"
horde_forge_new_nation_decisions_desc:0 "As members of the Horde, we must waste no time in developing our nation into a mighty one worthy of the Horde, as it is from our land that we project our power and might to the rest of the world."
horde_nation_project_flag:0 "Horde nation project already ongoing"

the_tides_of_conquest_decisions:0 "The Tides of Conquest"
the_tides_of_conquest_decisions_desc:0 "The Horde of old cared little of the plights of other races, they spent their time forging their own path to glory through conquest."

