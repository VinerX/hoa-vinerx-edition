Horde_Forge_Homeland:0 "Founded a New Homeland"

horde_clan_respect_1_idea:0 "Clan Respect: Irrelevant"
horde_clan_respect_1_idea_desc:0 "Who are you? The Warchief? Really? Someone actually declared you to be in charge? Is this a joke? I'm not listening to you!"
horde_clan_respect_2_idea:0 "Clan Respect: Ignored"
horde_clan_respect_2_idea_desc:0 "It would seem many members of the clan don't pay your decrees much mind. We must see to it that this situation does not remain true, lest their disorder continue to sabotage our war efforts."
horde_clan_respect_3_idea:0 "Clan Respect: Mediocre"
horde_clan_respect_3_idea_desc:0 "Though many will groan when you issue an order that they question, they will usually deign to follow it. Though relatively orderly, the clan needs a greater sense of purpose and motivation"
horde_clan_respect_4_idea:0 "Clan Respect: Respected"
horde_clan_respect_4_idea_desc:0 "The clan looks to you for guidance. All is right with our world now that your will is unquestioned. But could you go further? Could you become a legend?"
horde_clan_respect_5_idea:0 "Clan Respect: Exalted"
horde_clan_respect_5_idea_desc:0 "All future Chieftains of our clan will look to your actions for guidance. Your greatness is assured, and your legend will inspire for generations to come! For the moment, the fervor of our warriors has never been greater."

