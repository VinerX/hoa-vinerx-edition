################################################################
#Horde Ideology - Wartime Measures
################################################################

horde_charge_1_decision:0 "To Battle!"
horde_charge_1_decision_desc:0 "Charge! Let none escape the wrath of the horde! This reckless assault could be the deciding factor in breaking this stalemate!"
horde_charge_2_decision:0 "For the Horde!"
horde_charge_2_decision_desc:0 "Give our enemies no quarter and no mercy! Charge forth until your feet bleed and your enemies lie dead in front of us!"
horde_charge_3_decision:0 "Lok'tar O'gar!"
horde_charge_3_decision_desc:0 "Go forth! Today, someone will die. It will be either them, or it will be us! Either way, this stalemate ends now!"

horde_light_forges_1_decision:0 "Light the Forges!"
horde_light_forges_1_decision_desc:0 "The forges must be lit day and night to see to it that we possess enough weapons to defeat those who would presume to stand against us."
horde_light_forges_2_decision:0 "Strengthen the Bellows"
horde_light_forges_2_decision_desc:0 "We need more weapons, more smiths, and more iron! To be disarmed is to be dishonoured, and the Horde can never abide such a fate!"
horde_light_forges_3_decision:0 "There is Never Enough!"
horde_light_forges_3_decision_desc:0 "No rest, no peace! Not until our enemies lie broken before us. Nothing else matters, the war machine must come before all else!"

horde_charge_1_idea:0 "Charge Forth!"
horde_charge_1_idea_desc:0 "We will not be caught in a perpetual cycle of attack and retreat! We will push through regardless of the cost."
horde_charge_2_idea:0 "Relentless Assault!"
horde_charge_2_idea_desc:0 "No quarter, no mercy! We will push through, and they will break!"
horde_charge_3_idea:0 "Lok'tar O'gar"
horde_charge_3_idea_desc:0 "Either you die! Or I will!"

