beat_the_drums_1_decision:0 "Beat The Drums - Level 1"
beat_the_drums_1_decision_desc:0 "The call for battle is the dream of every young warrior, that they may prove themselves to their scornful elders. When the drums of war begin to beat, the lust for battle within our clan will begin to thunder as warriors young and old ready themselves for the conflict to come."
