rally_the_clan_1_decision:0 "Rally the Clan - Level 1"
rally_the_clan_1_decision_desc:0 "Our clan is lost and scattered amongst various lands and continents. We can make a concerted effort to put out a call to those lost sheep, that they may return to the fold and strengthen the clan."
