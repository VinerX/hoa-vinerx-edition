black_dragon_first.1.t:0 "A Loyal Follower"
black_dragon_first.1.d:0 "Gul'Dan sat at the altar, pouring over the arcane he had been working on for days, the lack of sleep was beginning to effect him, he felt as through the blistering heat eminating from the Altar of Storms was sapping his very life away, for all he knew it might have been.\nA hand came to rest upon his shoulder as he bolted upright, a Blackrock orc stood there, drapped in the robes of a warlock, before Gul'Dan could open his mouth to curse the fool the Orc laughed and forced a cup of liquid into Gul'Dans hands.\n'Master you will kill yourself long before the humans or the Warchief do if you persist the way you do, but your dedication to our work has made all this possible' He raised his own cup and finished it in what felt like moments, bowed and began to walk away.\nGul'Dan stood stunned for a moment, who was this Orc to treat him like he was a child who needed motivation, he pressed his lips to the cup on instinct and felt the chilled liquid run down his throat, whoever he was he managed to procure cold refreshments in a fiery hellscape. Gul'Dan returned to his work and hand and throught..."
black_dragon_first.1.option.1:0 "Did i make that marking?"

black_dragon_first.2.t:0 "A Warrior from the Front"
black_dragon_first.2.d:0 "The Warchief walked through the encampment, the advance had been delayed by a group of pesky humans destroying a bridge, he saw the bodies of the dead from the last attack, the Knights carving through their lines like his warriors meant nothing.\nA cheer rang out to his left, as he began to make his way towards it a the glint of a blade caught his eye, in the middle of the crowd was a Blackrock Clansmen, Holding above his head a massive greatsword taken from one of the Humans, he held it above his head light it weight nothing to him, a hush fell over the Revelry as they saw the warchief approached, he reached out his hand towards the Orc and motioned to give him the blade.\n'Warchief, what the humans lack in strength they make up for in forge work, i took this from a human warrior and used it to cut the legs off three human horses, all that heavy armour is pointless if they cant get up', The tired Warchief looked at the Warrior and smiled..."
black_dragon_first.2.option.1:0 "'We shall put these to good use'"

