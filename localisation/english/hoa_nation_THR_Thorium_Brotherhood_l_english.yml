THR_dark_iron_legacy:0 "Dark Iron Legacy"
THR_dark_iron_legacy_desc:0 "By the time of the trade with the various human city-states to the north, the dwarves, led by High King Modimus Anvilmar, had three powerful factions brooding within the city of Ironforge. The Dark Irons led by the Thaurissan family, lived in the shadows of the mountain and held a strong penchant for political scheming as well as having cornered the gem market of the dwarves."

THR_Mercenary_Armies:0 "Thorium Mercenaries"
THR_Mercenary_Armies_desc:0 "The Thorium Brotherhood are a non-militaristic guild, not relying on an army of their own. When doing excurions from their lands they rely on Mercenaries and Adventurers to do their dirty work."
