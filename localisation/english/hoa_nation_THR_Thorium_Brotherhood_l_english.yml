THR_overseer_oilfist:0 "Overseer Oilfist"
POLITICS_OVERSEER_OILFIST_DESC:0 "Current Overseer of the Thorium Brotherhood. Former apprentice to Lokhtos Darkbargainer, he quickly rose through the guild. During the Thorium Brotherhood's departure from Blackrock Depths, it was Oilfist's plan that resulted in success. \nDuring the escape, Oilfist proved his skill at arms against the guild's elemental taskmasters. Once free, the Guild elected Oilfist to lead over the absent Lokhtos. \nOilfist takes his job very seriously, and deals harshly with those who disagrees - although he has many underlings, Oilfist has no qualms about getting his hands dirty."

