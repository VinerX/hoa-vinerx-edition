STM_korgall:0 "Kor'gall"
POLITICS_KORGALL_DESC:0 "Warlord of the Stonemaul Clan and a tyrant even by the standards of the Ogres, he is a formidable warrior in his own right."
POLITICS_KORGALL_DESC_THIRD_WAR:0 "Warlord of the Stonemaul Clan. A Tyrant even by the standards of the Ogres, he wields the legendary axe, Serathil, and uses it’s magical powers to allow him to control the Stonemaul Clan with impunity. In Dustwallow Marsh, he is a formidable warrior in his own right and the legendary axe augments his own powers. \nHe watches the expansion of the Horde in Kalimdor and wonders when would be the best time to exert his strength over the Orcs, too."

