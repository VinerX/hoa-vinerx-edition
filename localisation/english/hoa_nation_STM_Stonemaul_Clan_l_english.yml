STM_Korgalls_Reign:0 "Kor'galls Reign"
STM_Korgalls_Reign_desc:0 "Kor'gall is a brutal and merciless leader. He murders any who stand in his way of his leadership and will stop at nothing to assert his rule."
STM_Slave_Labor:0 "Slave Labor"
STM_Slave_Labor_desc:0 "As Stonemaul landed in Kalimdor, they began ravaging local villages. Picking up the human and other various races along the way to create a slave work force."
