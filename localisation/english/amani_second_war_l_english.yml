ama_sw_autonomy_asserted_tt:0 "Amani military operations will be conducted under Amani command, maximising operational freedom while maintaining the alliance with the Horde."
ama_sw_dragons_unavailable_tt:0 "The Dragonmaw Clan does not yet have enslaved dragons. Conventional siege methods will have to suffice."
