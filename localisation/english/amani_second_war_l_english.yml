l_english:

###############################
# Amani Tribe Second War Focus Tree
# Expanded: 75 total focuses, 93 with all branches
###############################

# ==========================================
# EXISTING FOCUSES (23) — names and descriptions preserved
# ==========================================

AMA_sw_zuljins_resolve:0 "Zul'jin's Resolve"
AMA_sw_zuljins_resolve_desc:0 "He stood alone against the elven hordes when every other troll chieftain fled. The elves took his eye, his arm, his freedom — but they could not take his hatred. Zul'jin's will is forged from three thousand years of Amani suffering. As the Horde marches upon the kingdoms of men and elves, the Warlord of Zul'Aman sees his moment. This time, the trolls will not be on the losing side of history."

AMA_sw_loa_blessings:0 "Blessings of the Loa"
AMA_sw_loa_blessings_desc:0 "The Loa — ancient spirits of the wild — have watched over the Amani since before the elves first defiled these lands. Akil'darah the Eagle, Halazzi the Lynx, Jan'alai the Dragonhawk, and Nalorakk the Bear demand blood and reverence. We call upon them now, offering sacrifices that have not been made in generations. Their power will flow through our warriors. Their fury will be our fury."

AMA_sw_tribal_war_council:0 "Tribal War Council"
AMA_sw_tribal_war_council_desc:0 "Zul'jin summons the chieftains of every forest troll tribe that still answers the Amani name. Witherbark, Mossflayer, Vilebranch, Shadowpine — all must answer the call. Around the great fire in the heart of Zul'Aman, the Warlord lays out his vision: a united troll front, an alliance with the orcish Horde, and a war of extinction against the elves of Quel'Thalas. The chieftains must choose — join the crusade or be forgotten."

AMA_sw_securing_zulaman:0 "Securing Zul'Aman"
AMA_sw_securing_zulaman_desc:0 "Before the Amani can march to war, Zul'Aman itself must be an unbreachable fortress. The ancient temple-city has withstood elven sieges before, but the Horde brings new tactics and new threats. Walls are raised, pits are dug, and every approach to the city is turned into a killing ground. The elves will not catch us unprepared — not this time."

AMA_sw_spirit_guardians:0 "Spirit Guardians"
AMA_sw_spirit_guardians_desc:0 "The Loa do not merely watch — they fight alongside those who honour them. Chosen warriors are ritually bonded with animal spirits, gaining the strength of the bear, the speed of the lynx, the sight of the eagle, and the fury of the dragonhawk. These spirit guardians are more than soldiers; they are living vessels of divine will, and they will be the spearhead of our assault on Quel'Thalas."

AMA_sw_forest_watchers:0 "Forest Watchers"
AMA_sw_forest_watchers_desc:0 "The forests of the north belong to the Amani — they always have. We know every trail, every hollow, every tree that speaks to the spirits. By expanding our network of watchers and trackers, no elven ranger patrol will slip through unnoticed. Information is the first weapon of war, and in our forests, we see everything."

AMA_sw_horde_war_council:0 "Horde War Council"
AMA_sw_horde_war_council_desc:0 "Zul'jin travels south to meet the Warchief Doomhammer himself. The orcs are brutal and direct, so different from the delicate scheming of the elves — and Zul'jin respects that. Around the war table, Amani chieftains sit alongside Blackrock generals, forging an alliance of convenience that both sides know may not outlast the war. But for now, the enemy of my enemy is more than a friend — he is an army."

AMA_sw_southern_front:0 "The Southern Front"
AMA_sw_southern_front_desc:0 "While the bulk of our forces prepare for the elven campaign, we must not leave our southern border exposed. Stromgarde and its Trollbane warriors have been a thorn in troll-kind's side for generations. A southern army will keep the humans pinned in Arathi while the main host strikes north. Two fronts — one purpose. Total war."

AMA_sw_champions_of_loa:0 "Champions of the Loa"
AMA_sw_champions_of_loa_desc:0 "The spirit guardians are merely the beginning. True champions of the Loa are warriors who have died and been reborn through the spirits' grace, wielding powers that the arcane-obsessed elves cannot comprehend. These champions walk with one foot in the spirit world, their strikes guided by ancient wisdom and their bodies shielded by the very essence of the wild."

AMA_sw_hex_warfare:0 "Hex Warfare"
AMA_sw_hex_warfare_desc:0 "The elves rely on their precious arcane magic — sterile, bloodless, predictable. Ours is the magic of spirit and shadow, of curses whispered in the dark and hexes that wither the soul. Our witch doctors have honed their craft through generations of war against these pale usurpers. Let the elves preen with their polished staffs — we will show them what true power looks like."

AMA_sw_blood_oath:0 "Blood Oath to Doomhammer"
AMA_sw_blood_oath_desc:0 "Zul'jin and Orgrim Doomhammer slice their palms and clasp hands as blood mingles between orc and troll. The oath is simple and binding: the Amani will fight alongside the Horde, and in return, the Horde will support the Amani's war against Quel'Thalas. There are no fancy treaties, no magisterial loopholes — only blood and honour. Zul'jin has never trusted a promise more in his life."

AMA_sw_crush_stromgarde:0 "Crush Stromgarde"
AMA_sw_crush_stromgarde_desc:0 "The Kingdom of Stromgarde has stood as a bulwark against the trolls since the Troll Wars. Their walls, their warriors, their vaunted Trollbane bloodline — all of it must fall. We will sweep down from the highlands like a tide of vengeance and drown the Arathi in their own arrogance. The name Trollbane will become a curse, not a title."

AMA_sw_rangers_nightmare:0 "Rangers' Nightmare"
AMA_sw_rangers_nightmare_desc:0 "The elven Farstriders think themselves masters of the forest. We will teach them otherwise. Our spirit-touched trackers, our hex-casting witch doctors, and our warriors who move like shadows through the trees will turn every elven ambush into an elven funeral. The forest is our home. They are merely guests who have overstayed their welcome."

AMA_sw_axes_for_quelthalas:0 "Axes for Quel'Thalas"
AMA_sw_axes_for_quelthalas_desc:0 "Every forge in Zul'Aman burns day and night. Smiths blessed by the Loa oversee the creation of weapons imbued with spiritual power — axes that never dull, spears that seek elven hearts, shields that turn arcane fire aside. This is not industry; it is holy work. Every weapon is a prayer, and every prayer is answered in elven blood."

AMA_sw_hillsbrad_pacified:0 "Hillsbrad Pacified"
AMA_sw_hillsbrad_pacified_desc:0 "With Stromgarde crushed and the Arathi highlands under Amani control, our forces sweep into Hillsbrad to secure the eastern flank. The human settlements are dismantled, their fields claimed, their towers burned. The old troll lands of the eastern kingdoms begin to resemble what they once were — before the humans, before the elves, before the Sundering."

AMA_sw_blessed_axes:0 "Blessed Axes"
AMA_sw_blessed_axes_desc:0 "The Loa personally consecrate the finest weapons ever produced in Zul'Aman. Akil'darah grants keen sight for the thrown spear. Nalorakk grants crushing force for the axe. Jan'alai grants fire that consumes even elven enchantments. When a warrior wields a blessed axe, he does not merely fight — he becomes the Loa's instrument upon the mortal plane."

AMA_sw_burning_borderlands:0 "Burning the Borderlands"
AMA_sw_burning_borderlands_desc:0 "This is the moment Zul'jin has waited for since the day the elves first took his eye. The Amani horde crosses into Quel'Thalas in force, their war cries splitting the enchanted silence of the elven forests. Everything burns — villages, waystones, ancient trees the elves have nurtured for millennia. We are not here to conquer. We are here to erase. Let Silvermoon see the smoke on the horizon and know that Zul'jin is coming."

AMA_sw_never_forgive:0 "Never Forgive the Humans"
AMA_sw_never_forgive_desc:0 "The Troll Wars. The exile. The centuries of humiliation as the younger races claimed the lands that were ours before their ancestors crawled from the mud. The Amani have been wronged by every kingdom of men from Lordaeron to Stormwind. There will be no reconciliation, no peace, no coexistence. The humans call us savages — we will show them what savagery truly means."

AMA_sw_flames_of_vengeance:0 "Flames of Vengeance"
AMA_sw_flames_of_vengeance_desc:0 "The burning of the borderlands was only the beginning. Our forces push deeper into Quel'Thalas, leaving nothing in their wake but ash and lamentation. The elves thought their Runestones would protect them. They thought their magic made them invincible. They thought the Amani were broken. Every one of those assumptions is being proven wrong with each troll axe that finds its mark."

AMA_sw_trollbane_broken:0 "Trollbane Legacy Broken"
AMA_sw_trollbane_broken_desc:0 "The name Trollbane has terrorised our people for centuries — a dynasty of human kings who built their fame on troll corpses. No longer. With Stromgarde in ruins and the Trollbane bloodline scattered to the winds, we claim the human lands of the east as our own. The Arathi Highlands will be renamed. The statues of human heroes will be toppled. And the trolls will walk freely where once we were hunted."

AMA_sw_victory_or_defeat:0 "Victory or Defeat"
AMA_sw_victory_or_defeat_desc:0 "The Second War reaches its climax, and the Amani stand at a crossroads. If the Horde is victorious, Zul'jin's alliance with Doomhammer will have been vindicated — the Amani will rise as a power in the post-war order. If the Horde falls, the Amani face an uncertain future: surrounded by vengeful Alliance nations and stripped of their orcish allies. The Warlord must decide the path forward — or fate will decide for him."

AMA_sw_empire_reborn:0 "Empire Reborn"
AMA_sw_empire_reborn_desc:0 "Victory. The Horde has triumphed, and the Amani alongside them. Quel'Thalas lies broken, its Runestones shattered, its Sunwell darkened. The elves who survived flee south as their ancestors once fled the Sundering. Zul'jin looks out upon lands that have not belonged to trolls since the world was young and declares the Amani Empire reborn. A new age begins — an age of trolls."

AMA_sw_retreat_to_zulaman:0 "Retreat to Zul'Aman"
AMA_sw_retreat_to_zulaman_desc:0 "The war is lost. The Horde has crumbled, and the Amani cannot stand alone against the Alliance's full might. Zul'jin orders the withdrawal to the ancient forests of Zul'Aman — the one place the elves have never been able to fully penetrate. The Amani war machine is shattered, but the spirit endures. We will return to the shadows, heal our wounds, and wait. Time is on our side. It always has been."

AMA_sw_enduring_hatred:0 "Enduring Hatred"
AMA_sw_enduring_hatred_desc:0 "Defeat does not mean acceptance. The Amani people have survived worse — the Troll Wars, the coming of the elves, the Sundering itself. Our hatred is an eternal flame that no Alliance victory can extinguish. We retreat, but we do not surrender. The forest watches. The forest waits. The forest remembers."

# ==========================================
# NEW FOCUSES — Act I: The Warlord
# ==========================================

AMA_sw_name_of_zuljin:0 "The Name of Zul'jin"
AMA_sw_name_of_zuljin_desc:0 "In the great hall of Zul'Aman, the tribal chiefs listen to only one voice. Zul'jin's name is legend among the forest trolls — the warrior who escaped the elves, the leader who freed his people, the one-eyed king who never surrendered. But legend alone will not win wars. Zul'jin must transform his personal legend into political authority, binding the chiefs to his command through fear, respect, and the promise of glory. The name of Zul'jin shall mean more than a chieftain — it shall mean the rebirth of a nation."

AMA_sw_old_feuds_one_enemy:0 "Old Feuds, One Enemy"
AMA_sw_old_feuds_one_enemy_desc:0 "For generations the Amani tribes have quarrelled over hunting grounds, sacred sites, and ancient slights. The Shadowpine distrust the Mossflayer. The Witherbark remember offences a century old. Zul'jin must do what no chieftain has done before: suppress these rivalries, redirect the anger outward, and forge the tribes into a single weapon. The elves are the common enemy. Everything else can wait until the elven cities burn."

AMA_sw_council_beneath_trees:0 "The Council Beneath the Trees"
AMA_sw_council_beneath_trees_desc:0 "Beneath the ancient canopies of Zul'Aman, Zul'jin establishes a permanent war council — not a throne, for the trolls have never had kings in the human fashion, but a gathering of chiefs, spirit-priests, and proven warriors. This council will represent every major faction within the Amani nation, balancing the demands of warbands, hunters, priests, and elders. It is not democracy — it is organised survival. A unified council can mobilise the tribes faster, manage disputes before they become blood feuds, and present a single face to the Horde."

AMA_sw_warbands_answer_call:0 "Warbands Answer the Call"
AMA_sw_warbands_answer_call_desc:0 "The war drums echo from Zul'Aman to the farthest reaches of the eastern forests. Wandering warbands, exiled hunters, and remote villages all hear the call. Zul'jin's agents spread through the woodland speaking of conquest, loot, and elven land ripe for the taking. Veterans of centuries of skirmishing against the elves emerge from the shadows bearing ancestral weapons. The Amani nation swells with warriors who have nothing to lose and everything to avenge."

AMA_sw_promise_elven_land:0 "Promise Them Elven Land"
AMA_sw_promise_elven_land_desc:0 "Words cost nothing, but promises bind nations. Zul'jin stands before the gathered chiefs and makes a sacred vow: every tribe that fights for the Amani will receive a share of conquered Quel'Thalas. The fertile groves of the Ghostlands, the jewel-like villas of Eversong, the ancient clearings where elven cities now stand — all of it will be redistributed to the faithful. This is not charity. It is payment for blood, and the chiefs understand blood-currency better than any human contract. The promise turns reluctant allies into eager conquerors."

# ==========================================
# NEW FOCUSES — Act II: The Pact with Doomhammer
# ==========================================

AMA_sw_amani_guides_north:0 "Amani Guides Through the North"
AMA_sw_amani_guides_north_desc:0 "The northern kingdoms are alien to the orcs who crossed the sea from Draenor. But to the Amani, every forest path, every mountain pass, every hidden ford is etched into tribal memory from a thousand generations of habitation. Zul'jin dispatches his finest trackers to guide Horde armies through terrain that would otherwise consume them. The orcs bring brutality and numbers; the Amani bring the land itself. This is the true value of the alliance — not a few troll regiments on a distant flank, but mastery of the terrain that will decide the northern war."

AMA_sw_our_war_their_war:0 "Our War, Their War"
AMA_sw_our_war_their_war_desc:0 "A confrontation at the highest level of Amani politics. Doomhammer speaks of continental conquest — Stormwind, Khaz Modan, Lordaeron, the whole eastern continent. Zul'jin cares about exactly one thing: the destruction of Quel'Thalas. The council divides sharply. Some chiefs argue for full integration into the Horde's grand strategy — the stronger the Horde becomes, the more resources flow north. Others warn that the orcs will abandon the elven front the moment their own interests shift. Zul'jin must decide: are the Amani a partner in a multi-front war, or a power with a single sacred purpose?"

AMA_sw_demand_northern_offensive:0 "Demand the Northern Offensive"
AMA_sw_demand_northern_offensive_desc:0 "Zul'jin travels to Doomhammer's command tent and speaks bluntly: the Horde promised support for the Quel'Thalas campaign, and the Amani have upheld their end of the pact. Now the Warchief must deliver. Zul'jin demands that Blackrock commit significant forces to the northern front — not token garrisons, not empty promises, but real armies pushing toward Silvermoon. Doomhammer's response will reveal whether the blood oath means anything or whether the Amani are fighting alone under a Horde banner. If the Warchief has authority, he will honour the pact. If not, the Amani will remember."

AMA_sw_no_orc_commands:0 "No Orc Commands Zul'Aman"
AMA_sw_no_orc_commands_desc:0 "Zul'jin makes one thing absolutely clear to every orcish officer and Blackrock emissary: the Amani fight with the Horde, not under it. Amani warbands operate under Amani command. Amani territory is governed by Amani law. When the war is over, no orc warlord will appoint governors in conquered troll lands. This is not rebellion — this is the natural order. Doomhammer may command the Horde, but Zul'jin commands the Amani. The pact is between equals, and equals do not take orders."

# ==========================================
# NEW FOCUSES — Loa Warfare
# ==========================================

AMA_sw_invoke_akilzon:0 "Invoke Akil'zon"
AMA_sw_invoke_akilzon_desc:0 "Akil'zon, the Great Eagle, soars above all mortal concerns and sees the battlefield as the Loa see it — from above, with perfect clarity. The priests of Akil'zon perform the ancient rites at the Eagle Shrine, calling down the spirit's blessing upon our scouts and trackers. Warriors touched by Akil'zon move through the canopy like shadows and see through elven illusions. The Farstriders think themselves masters of the forest canopy — they will learn that something higher watches from above."

AMA_sw_invoke_nalorakk:0 "Invoke Nalorakk"
AMA_sw_invoke_nalorakk_desc:0 "Nalorakk, the Great Bear, embodies the raw, unstoppable strength of the ancient forests. At the Bear Shrine deep within Zul'Aman, the priests make offerings of honey, fish, and the hearts of fallen enemies. Warriors blessed by Nalorakk feel their limbs grow heavy with spirit-power, their hides toughen like bark, their strikes carry the weight of falling trees. When the Nalorakk-touched charge the elven lines, the elves will learn what it means to face a force of nature that cannot be reasoned with, bargained with, or stopped by spellcraft."

AMA_sw_invoke_janalai:0 "Invoke Jan'alai"
AMA_sw_invoke_janalai_desc:0 "Jan'alai, the Dragonhawk, is fire made flesh — a spirit of conflagration and consuming heat. At the shrine that bears her name, the priests feed the sacred flames with oils rendered from forest beasts and incantations spoken in the oldest troll tongue. Warriors blessed by Jan'alai feel fire in their blood, their axe blades shimmer with heat, and their war cries carry the crackle of burning timber. The elves of Quel'Thalas will recognise fire — their ancestors fled the flames of the Sundering, and now the flames return to finish what the Sundering began."

AMA_sw_invoke_halazzi:0 "Invoke Halazzi"
AMA_sw_invoke_halazzi_desc:0 "Halazzi, the Lynx, is the spirit of the hunt — patient, silent, and deadly. Unlike the brute force of Nalorakk or the fiery presence of Jan'alai, Halazzi's blessing is subtle. Warriors touched by the Lynx move without sound, track prey across impossible distances, and strike before the enemy knows they are in danger. Elven sentries will find their throats cut before they can raise the alarm. Patrols will vanish in the forest without a trace. Halazzi does not fight wars — Halazzi ends them, one silent kill at a time."

AMA_sw_great_loa_offering:0 "The Great Offering"
AMA_sw_great_loa_offering_desc:0 "The four great Loa have been invoked individually — now they must be honoured together in a ceremony not performed since the Troll Wars. The priests demand a Great Offering: ritual sacrifices at all four shrines simultaneously, with every major chieftain in attendance. The cost in resources and time is vast, but the reward is undeniable — the combined blessing of Akil'zon, Nalorakk, Jan'alai, and Halazzi working in harmony. For the duration of the blessing, the Amani will fight as their ancestors fought at the height of the ancient empire. After three thousand years, the Loa's full might returns to the mortal plane."

# ==========================================
# NEW FOCUSES — Act III: Northern War Preparation
# ==========================================

AMA_sw_trails_known_to_us:0 "Trails Known Only to Us"
AMA_sw_trails_known_to_us_desc:0 "The maps the Horde captured from human cities show Quel'Thalas as an impenetrable wall of enchanted forest. But the maps were drawn by humans who had never set foot north of the Thandol Span. The Amani have walked these forests since before human civilisation existed. We know the gaps between the Runestones, the streams that lead behind elven watch positions, the ancient paths that the elves have forgotten. Every trail that leads into Quel'Thalas leads to a knife in the dark."

AMA_sw_silence_messengers:0 "Silence the Messengers"
AMA_sw_silence_messengers_desc:0 "The elven Farstriders communicate through a network of signal fires, messenger hawks, and arcane relays that covers all of Quel'Thalas. Our forest watchers have studied these patterns for months. Now we strike. Simultaneous attacks on every relay point, every messenger route, every signal tower along the border. When the first Amani war party crosses into elven territory, Silvermoon will not know about it for a day. A day is an eternity in war. A day is enough to burn ten villages."

AMA_sw_study_runestones:0 "Study the Runestones"
AMA_sw_study_runestones_desc:0 "The great Runestones of Quel'Thalas are more than monuments — they are the backbone of the elven magical defence, channelling arcane power from the ley lines and reinforcing the wards that protect elven territory. Our witch doctors and spirit-seers have observed the stones for generations, noting their patterns, weaknesses, and dependencies. The Runestones are powerful, but they are not invincible. They rely on ley lines that can be disrupted, on elven magisters who can be killed, and on the assumption that trolls are too primitive to understand arcane mechanics. That assumption is about to prove costly."

AMA_sw_break_the_wards:0 "Break the Wards"
AMA_sw_break_the_wards_desc:0 "Armed with knowledge gained from decades of observation, our forces launch coordinated strikes against the weak points in the elven magical network. Witch doctors perform disruptive rituals at key ley line junctions. Warriors desecrate minor waystones to create cascading failures. Hexes are laid to confuse and overwhelm magister sentries. The goal is not to destroy the Runestone network entirely — that requires forces we do not yet possess — but to create gaps, instabilities, and moments of vulnerability that our warriors can exploit. Every cracked ward is an open door into elven territory."

AMA_sw_call_dragonfire:0 "Call Upon Dragonfire"
AMA_sw_call_dragonfire_desc:0 "Doomhammer's greatest weapon in the northern war is not his axe — it is the red dragons enslaved by the Dragonmaw Clan. Zul'jin formally requests that Doomhammer divert dragon support to the Amani front. The elven Runestones and coastal fortifications will not withstand dragonfire. A single flight of dragons could break open sections of the elven defensive line that would otherwise cost thousands of troll lives. The request is politically delicate — the Dragonmaw guard their dragons jealously, and Doomhammer must balance every request against the needs of a dozen other fronts. But Zul'jin has honoured the blood oath. Now the Horde must honour it in return."

# ==========================================
# NEW FOCUSES — Act IV: Conquest of Quel'Thalas
# ==========================================

AMA_sw_break_farstrider_screen:0 "Break the Farstrider Screen"
AMA_sw_break_farstrider_screen_desc:0 "The Farstriders are the eyes and ears of Quel'Thalas — light rangers who patrol the borderlands, report on invading forces, and bleed any attacker with precision ambushes before they reach the main elven defensive lines. It is time to blind the elves. Our forest watchers, spirit-touched hunters, and hex-casters launch a coordinated counter-ranger campaign. The Farstriders will be hunted. Their patrol patterns will be ambushed. Their supply caches will be burned. By the time the main Amani army crosses into elven territory, the Farstriders will be a broken remnant, not a military force."

AMA_sw_seize_runestone_lands:0 "Seize the Runestone Territories"
AMA_sw_seize_runestone_lands_desc:0 "With the wards disrupted and the Farstriders driven from their positions, our forces advance on the Runestone territories — the arcane heartland of southern Quel'Thalas. Each captured runestone is systematically desecrated, its ley line connections severed, its protective wards shattered. Elven magisters who attempt to defend the stones are overwhelmed by numbers and hex-fire. The loss of the Runestones does not merely weaken the elven military position — it is a spiritual catastrophe. The symbols of elven arcane supremacy are being toppled by the very primitives they were built to ward against."

AMA_sw_seize_northern_approach:0 "Secure the Northern Approaches"
AMA_sw_seize_northern_approach_desc:0 "With the Farstrider screen broken and the Runestone territories falling, the path to Silvermoon lies open. Our forces seize the northern approaches — the chokepoints, river crossings, and high ground that control access to the elven capital. The elves retreat behind their final defences, hoping that geography and magic will save what their armies could not. But every retreat reduces their supply territory, concentrates their defenders into a shrinking perimeter, and proves what the Amani have always known: the elves are not invincible. The elves are prey."

AMA_sw_hunters_farstriders:0 "Hunters of the Farstriders"
AMA_sw_hunters_farstriders_desc:0 "Even as the main army pushes toward Silvermoon, specialist hunter-warbands continue the campaign of terror against the Farstriders. Surviving ranger companies are tracked to their hiding places and destroyed. Elven commanders who distinguished themselves in the border skirmishes are targeted for assassination. Messages sent between ranger cells are intercepted, their contents used to ambush relief forces. This is not conventional warfare — it is the final stage of a campaign of extinction against those elves who dared believe the forest belonged to them."

AMA_sw_road_to_silvermoon:0 "The Road to Silvermoon"
AMA_sw_road_to_silvermoon_desc:0 "The impossible is becoming real. Amani banners fly over territory that has not known troll rule since the Troll Wars. The roads to Silvermoon — ancient elven highways built on the bones of our ancestors — are now crowded with Amani warbands marching north. Zul'jin himself rides at the head of the central column, his one remaining eye fixed on the distant spires of the elven capital. The elves have hidden behind their walls for three thousand years, confident that their magic and their arrogance made them untouchable. They are about to discover that three thousand years is exactly how long it takes for patience to become vengeance."

AMA_sw_beneath_elven_barrier:0 "Beneath the Elven Barrier"
AMA_sw_beneath_elven_barrier_desc:0 "Silvermoon's ultimate defence is the Ban'dinoriel — an arcane barrier of immense power that shields the elven capital from conventional assault. Our forces establish siege lines beneath the barrier, surrounding the city and cutting off every land approach. The barrier's power is drawn from the Sunwell and the Runestone network — both of which we have already weakened. It cannot hold forever. While the siege continues, our witch doctors study the barrier's fluctuations, identifying moments of weakness. The elves have used magic to hide from the trolls for three millennia. But magic, like any weapon, can be broken."

# ==========================================
# NEW FOCUSES — Forest Troll Reunification
# ==========================================

AMA_sw_messengers_hinterlands:0 "Messengers to the Hinterlands"
AMA_sw_messengers_hinterlands_desc:0 "Zul'jin dispatches emissaries to every forest troll tribe of the eastern kingdoms. Witherbark hunters in the Hinterlands. Vilebranch warriors watching the Alterac passes. Firetree and Smolderthorn bands in the foothills of Khaz Modan. The message is the same everywhere: the Amani are rising. The elves are falling. Join the restoration of the troll nation, or be remembered as the tribes that chose cowardice when history was being written. The messengers carry tokens blessed by the Loa — proof that Zul'jin's power is real and the old spirits walk with him."

AMA_sw_restore_forest_confederation:0 "Restore the Forest Confederation"
AMA_sw_restore_forest_confederation_desc:0 "For the first time since the Troll Wars, the forest troll tribes agree to recognise a single authority. The Witherbark pledge their warriors. The Vilebranch end their isolation. The scattered bands of Firetree and Smolderthorn return to the fold. This is not annexation — it is restoration. The Amani Empire was the original forest confederation, binding all the tribes of the eastern woods under a single banner. Zul'jin does not claim to be their king; he claims to be the one who restored what was broken. The tribes will retain their customs, their chiefs, and their autonomy — but when the war drums sound, they answer to Zul'Aman."

AMA_sw_one_banner_forests:0 "One Banner Above the Forests"
AMA_sw_one_banner_forests_desc:0 "The process that began with messengers and promises culminates in a great gathering at the foot of Zul'Aman. Every tribe, every clan, every remote band of forest trolls that answered the call sends its representatives. Before the assembled nation, Zul'jin raises a new banner — the ancient symbol of the Amani Empire, re-sewn with threads blessed by all four great Loa. This is not a flag of conquest. It is a declaration that the forest trolls will never again be scattered, divided, and hunted piece by piece. One people. One nation. One banner. Under this banner, the Amani will never be broken again."

AMA_sw_call_scattered_tribes:0 "Call the Scattered Tribes"
AMA_sw_call_scattered_tribes_desc:0 "Victory over Quel'Thalas sends shockwaves through the troll world. Tribes that hesitated, that watched from the shadows, that made their peace with the human kingdoms — they now reconsider. Zul'jin sends messengers far beyond the eastern forests, reaching troll bands that have not answered an Amani summons in centuries. The message is different now: it is no longer a plea for aid, but an invitation to join a victorious nation. The scattered tribes can remain scattered and be forgotten, or they can join the greatest troll resurgence since the Sundering. Many will choose to remember who they are."

# ==========================================
# NEW FOCUSES — Victory Path A: Restore the Old Empire
# ==========================================

AMA_sw_restore_sacred_sites:0 "Return to the Sacred Sites"
AMA_sw_restore_sacred_sites_desc:0 "The elves built their temples and runestones atop Amani holy ground — ancient shrines where the Loa were first called, where the first troll kings held court, where the spirits of the forest first spoke to mortal ears. For three thousand years these sites have been desecrated by elven occupation. Now they are reclaimed. Priests perform purification rituals. Offerings are made. The Loa return to places they abandoned when the elves first seized them. This is not conquest — it is atonement for millennia of exile."

AMA_sw_rebuild_forest_roads:0 "Rebuild the Forest Roads"
AMA_sw_rebuild_forest_roads_desc:0 "Conquest is meaningless without control, and control requires movement. The old Amani road network — ancient paths through the eastern forests that predate human and elven settlement — must be restored. These roads once connected every major Zul'Aman settlement, enabling trade, military deployment, and communication across the entire empire. Centuries of neglect and elven obstruction have left them overgrown and broken. Restoration will bind conquered territories together, allow rapid reinforcement of threatened sectors, and signal that the Amani are here to stay, not merely to raid."

AMA_sw_new_council_zulaman:0 "The New Council of Zul'Aman"
AMA_sw_new_council_zulaman_desc:0 "The war council served its purpose. Now the Amani nation needs something more permanent — a governing body that can administer the restored empire in peacetime as effectively as the chiefs led in wartime. Representatives from every major tribe, every major conquered territory, and every Loa priesthood gather in the rebuilt great hall of Zul'Aman. Zul'jin presides not as a king but as the Warlord — first among equals, tempered by war and trusted by all. The New Council will oversee land distribution, mediate inter-tribal disputes, and ensure that the empire constructed through blood is maintained through wisdom."

AMA_sw_fortify_eastern_marches:0 "Fortify the Eastern Marches"
AMA_sw_fortify_eastern_marches_desc:0 "The rebuilt Amani Empire will have enemies. The human kingdoms to the south and west will not forget what happened to Quel'Thalas. The dwarves will not be content with troll control of the northern passes. Naval powers will threaten the coastline. The eastern marches — the new borders of the empire — must be fortified with watchtowers, garrisons, and warded defences that draw on both troll spirit-magic and captured elven arcane knowledge. The empire will not be surprised. Never again."

AMA_sw_empire_more_than_warbands:0 "An Empire of More Than Warbands"
AMA_sw_empire_more_than_warbands_desc:0 "The Amani have always been a nation of warriors. But an empire requires more than warriors — it requires administrators, builders, diplomats, and governors. Zul'jin commissions the creation of a permanent state apparatus: tax collectors who answer to the Council rather than local chiefs, archivists who record treaties and land grants, courier networks that span the entire restored territory, and a civil guard that maintains order without the brutality of a wartime warband. This is the hardest transformation the Amani have ever attempted: from a collection of warrior bands into a state that can endure beyond one generation's victories."

AMA_sw_amani_empire_capstone:0 "The Amani Empire Reborn"
AMA_sw_amani_empire_capstone_desc:0 "Three thousand years after the Troll Wars shattered the old empire, the Amani nation stands restored. Quel'Thalas is no more. The sacred sites are reclaimed. The forest roads hum with troll travellers and traders. The New Council governs with Zul'jin's authority and the Loa's blessing. The forest tribes answer to a single banner. Zul'jin — one-armed, one-eyed, scarred beyond recognition — looks upon what his people have built. It is not the world that was lost. It is something new: an Amani Empire that has learned from catastrophe, survived genocide, and rebuilt itself not through vengeance alone but through the grim, patient work of nation-building. The ancient enemy is defeated. The Amani endure."

# ==========================================
# NEW FOCUSES — Victory Path B: War of Vengeance Continues
# ==========================================

AMA_sw_hunt_elven_commanders:0 "Hunt the Elven Commanders"
AMA_sw_hunt_elven_commanders_desc:0 "The fall of Silvermoon is not enough. Zul'jin orders a systematic campaign to track down and eliminate every surviving elven military commander. Farstrider captains who escaped the siege. Magisters who teleported to safety. Officers who commanded the defence of the Runestone territory. None of them will be permitted to regroup, rebuild, or return. Hunter-warbands are dispatched across the continent with lists of names and descriptions. The price of leading an army against the Amani is death — not imprisonment, not ransom, not exile. Death."

AMA_sw_no_refuge_farstriders:0 "No Refuge for the Farstriders"
AMA_sw_no_refuge_farstriders_desc:0 "The surviving Farstriders have fled south, seeking shelter in human kingdoms that still stand against the Horde. Zul'jin makes clear that harbouring elven rangers will be treated as an act of war. Diplomatic messages are dispatched to every nation that might offer sanctuary. Refugees are tracked across borders. Safe houses are identified and burned. The forest will follow its prey, even into foreign lands. The Farstriders who once hunted trolls for sport will learn what it means to be hunted by a nation."

AMA_sw_punish_allies:0 "Punish Those Who Aided Them"
AMA_sw_punish_allies_desc:0 "Quel'Thalas did not defend itself alone. Dalaran provided arcane expertise. Gilneas sent supplies through mountain passes. Even distant Kul Tiras sheltered elven refugees. The Amani do not forget. Sanctions, punitive raids, and diplomatic isolation are directed at every nation that extended aid to the elven kingdom during its final hours. This is not about territorial expansion — it is about demonstrating that siding with the enemies of the Amani carries permanent consequences. The lesson is simple: when the elves next seek allies, no one will answer."

AMA_sw_humans_remember_troll_wars:0 "The Humans Remember the Troll Wars"
AMA_sw_humans_remember_troll_wars_desc:0 "The victory over Quel'Thalas has awakened old fears. Human kingdoms that thought the trolls were a dying race now see an Amani Empire resurgent on their northern border. Propaganda flows both ways — human lords remind their people of the Troll Wars, of the horrors of troll occupation, of the savagery they claim is inherent to our nature. Zul'jin's response is not denial. It is confirmation. Yes, the Amani remember the Troll Wars too — and the lesson we learned is that soft-hearted peace only gives the younger races time to recover and strike again. There will be no peace this time. Only victory."

AMA_sw_axe_does_not_rest:0 "The Axe Does Not Rest"
AMA_sw_axe_does_not_rest_desc:0 "Zul'jin makes his final declaration to the assembled nation: the Amani war of vengeance will not end with Quel'Thalas. The elves were the first target, the oldest grudge, the deepest wound — but they were not the only ones. Every kingdom that profited from troll suffering, every nation that sheltered elven survivors, every power that treated the Amani as primitives unworthy of respect — all of them will face the axe in time. This is not a policy of total war against all nations simultaneously; it is a declaration that the Amani do not negotiate, do not forgive, and do not forget. The axe rests when justice is complete, and justice has barely begun."

# ==========================================
# NEW FOCUSES — Victory Path C: Zul'Aman First
# ==========================================

AMA_sw_debt_is_paid:0 "Our Debt Is Paid"
AMA_sw_debt_is_paid_desc:0 "Zul'jin addresses the Horde directly: the blood oath was honoured. The Amani fought alongside the Horde, the Horde supported the Amani campaign against Quel'Thalas, and the ancient enemy is destroyed. The debt is paid in full. From this moment forward, the Amani will not commit forces to campaigns that do not serve direct Amani interests. Doomhammer's continental war is his affair. The Amani have their own nation to build, their own borders to secure, their own dead to mourn and their own victory to consolidate. The Horde may not like this — but the Horde is not in a position to compel obedience from a victorious Amani Empire."

AMA_sw_guard_reclaimed_forest:0 "Guard the Reclaimed Forest"
AMA_sw_guard_reclaimed_forest_desc:0 "With the decision to prioritise Amani interests, the empire turns inward. Fortifications are raised along the new borders. Reserve warbands are established to respond to incursions. Diplomatic watch posts monitor the movements of neighbouring powers. The philosophy is simple: the Amani have fought for three thousand years to reclaim their forests, and they will not lose them through negligence. The reclaimed territories will be defended with the same ferocity that won them. Anyone who tests this resolve will discover that defensive war comes just as naturally to the Amani as offensive war — perhaps more so."

AMA_sw_trade_with_horde:0 "Trade with the Horde, Bleed for No One"
AMA_sw_trade_with_horde_desc:0 "The Amani maintain trade relations with the Horde, exchanging forest products, captured elven artifacts, and troll-crafted goods for orcish steel, siege equipment, and access to continental resources. But this is a commercial relationship, not a military pact. Amani timber feeds Horde war machines; Horde iron reinforces Amani fortifications. Both sides benefit, and neither side bleeds the other's blood. It is the pragmatic arrangement of two powers that respect each other's strength but recognise that their long-term interests have diverged. Business, not brotherhood."

AMA_sw_equal_ally:0 "An Equal Ally, Not a Vassal"
AMA_sw_equal_ally_desc:0 "Zul'jin demands — and receives — formal recognition of the Amani Empire's equal status within the Horde alliance. No more implied subordination. No more assumptions that Amani forces answer to orcish command. No more dismissal of troll concerns as secondary to Horde grand strategy. The Amani are partners, not subordinates — and if Doomhammer cannot accept this, the Amani are prepared to stand alone. Diplomacy backed by demonstrated military power is not begging; it is politics. And after the destruction of Quel'Thalas, nobody can deny that the Amani have the power to back their words."

AMA_sw_independent_amani_empire:0 "The Independent Amani Empire"
AMA_sw_independent_amani_empire_desc:0 "Zul'jin declares the full independence of the Amani Empire — a sovereign state that cooperates with the Horde on matters of mutual interest but charters its own course. The decision is historic. The Amani are no longer a vassal, a client, or a junior partner. They are a nation in their own right, with their own foreign policy, their own military doctrine, and their own vision for the future. The Horde may accept this or not — the Amani no longer require the Horde's permission to exist. The forests of the north belong to the trolls alone, and the trolls alone will decide their fate."

# ==========================================
# NEW FOCUSES — Victory Path D: Northern Horde
# ==========================================

AMA_sw_pact_vindicated:0 "The Pact Vindicated"
AMA_sw_pact_vindicated_desc:0 "Zul'jin stands before the assembled Horde leadership and declares the blood oath a triumph. The alliance between orc and troll did what three thousand years of Amani isolation could not: it destroyed Quel'Thalas. The trolls who distrusted the Horde were wrong. The orcs who dismissed the trolls as primitive were wrong. Together, they achieved something neither could have accomplished alone. This is not the end of the alliance — it is its true beginning. The pact is vindicated, and the future belongs to those who proved themselves on the battlefield."

AMA_sw_trolls_northern_horde:0 "Trolls of the Northern Horde"
AMA_sw_trolls_northern_horde_desc:0 "The Amani Empire formally reintegrated into the Horde's military structure — not as auxiliaries, but as a full partner with its own corps command, its own campaign planning authority, and its own voice in strategic decisions. Amani regiments are raised for deployment on every front. Troll scouting parties roam ahead of Horde armies from Hillsbrad to Alterac. The old distinction between 'orc war' and 'troll war' dissolves. This is the Horde's war, and the Amani are a founding pillar of the Horde — more than allies, more than partners: family."

AMA_sw_scouts_every_front:0 "Amani Scouts for Every Front"
AMA_sw_scouts_every_front_desc:0 "Amani expertise in forest warfare and reconnaissance is deployed across the entire Horde front. Troll trackers accompany Blackrock divisions into Khaz Modan. Amani rangers guide Bleeding Hollow warbands through the Alterac passes. Zul'Aman-trained scouts sail with the Horde fleet. The Amani contribution is no longer just the northern campaign — it is the eyes and ears of the entire Horde war effort. The forest trolls who once hid from the world are now the instrument through which the Horde sees the world."

AMA_sw_seat_at_war_council:0 "A Seat at the War Council"
AMA_sw_seat_at_war_council_desc:0 "Zul'jin formally demands — and receives — a permanent seat at the Horde's highest war council. The Warlord of Zul'Aman sits alongside Doomhammer himself, with equal voice in strategy, equal authority over combined operations, and equal claim to the spoils of victory. This is unprecedented. No non-orc has held such a position in the Horde's command structure. But the Amani have earned it with blood, with victory, and with the simple fact that the northern front would have been impossible without them. The Horde is no longer an orcish empire with troll auxiliaries — it is a dual power, north and south, orc and troll, united under two Warlords who recognise each other's strength."

AMA_sw_empire_within_horde:0 "An Empire Within the Horde"
AMA_sw_empire_within_horde_desc:0 "The Amani Empire reaches its full form as a constituent state within the Horde alliance — not a puppet, not a province, but an empire in its own right that maintains its own laws, culture, and institutions while contributing fully to Horde military operations. This is the synthesis that many thought impossible: a proud, ancient nation that accepts no master, fighting alongside an alliance of younger powers that accepts no permanent hierarchies. The Amani are the northern sword of the Horde. The Horde is the continental shield of the Amani. Together, they are unstoppable."

# ==========================================
# NEW FOCUSES — Defeat Path
# ==========================================

AMA_sw_close_forest_paths:0 "Close the Forest Paths"
AMA_sw_close_forest_paths_desc:0 "The war is lost, but Zul'Aman can still be saved. Zul'jin orders the systematic closure and trapping of every approach to the ancient forest. Elven rangers who attempt to pursue the retreating Amani armies find the forest turned against them — paths that were clear last week are now blocked by fallen trees and concealed pits. Bridges are burned. Chokepoints are fortified. The forest that welcomed the Amani home will kill anyone else who enters. The retreat is not a rout — it is a prepared defensive operation that will make every metre of advance cost the enemy dearly."

AMA_sw_hide_warbands:0 "Hide the Warbands"
AMA_sw_hide_warbands_desc:0 "The surviving warbands are dispersed into the deepest forest, hidden in camps that no outsider could find. Weapons are cached. Warriors assume civilian identities. The army appears to dissolve, but it does so deliberately. When the Alliance investigators roam Zul'Aman after the war, they will find villages of peaceful forest dwellers, not military formations. The warriors are still there, waiting in the shadows, training in secret. The Amani learnt millennia ago that survival sometimes requires invisibility. The warbands do not surrender — they vanish."

AMA_sw_preserve_loa_shrines:0 "Preserve the Sacred Shrines"
AMA_sw_preserve_loa_shrines_desc:0 "The greatest danger in defeat is not territorial loss — it is spiritual death. If the Loa shrines are defiled by elven conquerors, the Amani may lose the favour of the spirits forever. Zul'jin orders every shrine to be consecrated with protective wards, hidden by illusions woven by the most powerful witch doctors, and guarded by warrior-priests who will die before allowing desecration. The shrines will survive this defeat, as they survived the Troll Wars, as they survived the Sundering. The Loa will still have homes in Zul'Aman when the invaders are dust."

AMA_sw_rebuild_watch_posts:0 "Rebuild the Watch Posts"
AMA_sw_rebuild_watch_posts_desc:0 "As the immediate crisis of defeat passes, the Amani turn to the long-term work of survival. Watch posts are rebuilt along the new, reduced borders. Village defences are strengthened. An early-warning network of trackers and signal fires is re-established — more extensive than before the war, informed by hard experience. No army will approach Zul'Aman undetected again. The lesson of the Second War is not that the Amani were weak — it is that they were too visible. Visibility will not be a mistake they repeat."

AMA_sw_heal_wounded_nation:0 "Heal the Wounded Nation"
AMA_sw_heal_wounded_nation_desc:0 "The Amani have suffered grievously. Thousands dead. Territory lost. Allies scattered. The Horde, upon which so much was staked, lies in ruins. But the Amani have survived worse. The wounded are tended. Orphaned children are adopted by surviving families. Fallen warriors are honoured in ceremonies that affirm the continuity of the nation beyond any single generation. Healing is slow, and the scars will never fully fade — but the nation lives. And while the nation lives, nothing is truly lost. Every fallen warrior is a reason to continue. Every scar is a lesson carried forward."

AMA_sw_zuljins_fate:0 "Zul'jin's Fate"
AMA_sw_zuljins_fate_desc:0 "The Warlord who led the Amani to war must now decide his own aftermath. Zul'jin stands at a fork in his own legend. He can remain the defiant leader, continuing to direct the isolated nation from the shadows of Zul'Aman, a living symbol of resistance. Or he can withdraw from public life, allowing new leadership to emerge while his legend grows in the telling — the one-armed, one-eyed king who almost destroyed the elves and will return when the time is right. Either choice shapes the Amani nation's identity for generations. Even in defeat, Zul'jin's will shapes the future."

AMA_sw_generation_of_hatred:0 "A Generation of Hatred"
AMA_sw_generation_of_hatred_desc:0 "The war is over, but the hatred lives. Every Amani child is raised on stories of what the elves did, what the humans permitted, what the Alliance celebrated. The defeat of the Second War is not the end of Amani history — it is the foundational trauma that will fuel the next rising, whenever it comes. Guerrilla attacks continue in the shadows. Elven patrols vanish in the forest. The humans who settled reclaimed Amani land find their homes burned in the night. This is not peace. This is an armistice enforced by exhaustion, and exhaustion always passes."

AMA_sw_wait_next_weakness:0 "Wait for the Next Weakness"
AMA_sw_wait_next_weakness_desc:0 "Zul'jin's final strategic directive as Warlord: wait. The Amani have outlived empires. They have outlived the Kaldorei Imperium that shattered the world. They will outlive the Alliance and the Horde both. The key is patience. Watch. Prepare. Train new warriors in the deepest forests. Preserve the old knowledge that the younger races dismiss as superstition. Wait for the inevitable moment when the human kingdoms grow complacent, when the elves rebuild too quickly and exhaust their magic, when some new catastrophe creates an opportunity. The Amani have been waiting for three thousand years. A few more decades is nothing."

# ==========================================
# NEW FOCUSES — Reactions to Major Events
# ==========================================

AMA_sw_guldans_betrayal:0 "Gul'dan's Treachery"
AMA_sw_guldans_betrayal_desc:0 "News reaches Zul'Aman: Gul'dan the warlock has abandoned Doomhammer's campaign, taking a significant portion of the Horde's forces on a doomed quest for power. The Horde is fractured. The war hangs in the balance. Zul'jin must decide how the Amani respond to this crisis in the alliance. Every troll chief has an opinion. Some urge solidarity with Doomhammer — the warlocks were always dangerous and the Warchief was right to oppose them. Others see opportunity: Gul'dan's betrayal is an orc problem, and the Amani should focus on securing their own gains before the Horde collapses entirely. The wrong choice could leave the Amani isolated and vulnerable on the eve of what seemed like final victory."

AMA_sw_doomhammer_was_right:0 "Doomhammer Was Right"
AMA_sw_doomhammer_was_right_desc:0 "Zul'jin publicly affirms his support for Doomhammer and denounces Gul'dan's betrayal. The Amani remember the warlocks' methods from the First War — dark magic that corrupted and enslaved, the same kind of arrogance that made the elves so unbearable. Doomhammer's war is honourable; Gul'dan's scheming is not. The Warchief's authority is strengthened by having a major allied power declare unequivocally in his favour. Trust between Blackrock and Zul'Aman deepens. In the chaos of war, loyalty is worth more than gold."

AMA_sw_orc_problems_not_ours:0 "Orc Problems Are Not Ours"
AMA_sw_orc_problems_not_ours_desc:0 "Zul'jin keeps the Amani focused on the northern front. Gul'dan's betrayal is regrettable, but it is an internal Horde matter. The Amani did not create the warlock problem and will not bleed to solve it. Resources that might have gone to support Doomhammer's recovery operations are instead directed to finishing the Quel'Thalas campaign. If the Horde survives this crisis, the Amani will have secured their objectives and can negotiate from strength. If the Horde does not survive, the Amani will still control the northern forests and can defend them alone, as they have defended them for centuries."

AMA_sw_horde_victory_ama_survived:0 "The Horde Endures"
AMA_sw_horde_victory_ama_survived_desc:0 "Against all expectations, the Horde has triumphed — but the Amani were defeated in their own campaign. The paradox is unsettling. The orcs now rule the continent while the trolls who fought alongside them from the beginning cower in their ancient forest. Zul'jin must navigate this new reality. Doomhammer may honour the old alliance with renewed support for the Amani cause. But he may also dismiss Zul'jin's people as spent — a broken weapon no longer useful to the Horde's purposes. The Amani must re-establish their relevance to an alliance that no longer needs them, or find a way to survive independently within a world dominated by orcish power."

AMA_sw_harbor_horde_remnants:0 "Harbor the Remnants"
AMA_sw_harbor_horde_remnants_desc:0 "The Horde is collapsing. Orcish formations that survived the Alliance counteroffensive scatter across the continent, hunted and desperate. Zul'jin extends an offer: any orc who can reach Zul'Aman will find sanctuary. These are not surrenders — they are refugees of a broken war machine seeking the only safe ground left east of the mountains. The Amani absorb orcish stragglers into their own warbands, gaining trained warriors, siege engineers, and captured Alliance intelligence. The human kingdoms will be furious when they discover trolls sheltering Horde remnants, but the human kingdoms are already enemies. There is nothing left to lose."

# ==========================================
# NEW FOCUSES — Sunwell Question
# ==========================================

AMA_sw_sunwell_question:0 "The Sunwell Question"
AMA_sw_sunwell_question_desc:0 "Our forces have seized control of the Isle of Quel'Danas and the Sunwell — the most powerful magical site north of Dalaran. It is a nexus of arcane energy, a place of immense power that sustained the elven kingdom for millennia. But it is also a foreign power source, fundamentally arcane in nature, built by elven magisters using principles that troll spirit-magic was never designed to interact with. The Sunwell cannot simply be ignored — its power will draw attention. It cannot be casually used — the risks of arcane corruption are unknown. Zul'jin must decide: seal it, destroy it, or attempt to study it."

AMA_sw_seal_sunwell:0 "Seal the Sunwell"
AMA_sw_seal_sunwell_desc:0 "Pragmatism prevails. The Sunwell is sealed behind walls of spirit-warded stone, surrounded by a garrison of warrior-priests who will ensure nothing enters and nothing leaves. The Amani do not attempt to use the well's power, do not attempt to destroy it, and do not permit anyone else to approach it. This is the cautious path — deny the asset to enemies without taking the risks of exploitation. Quel'Thalas was built on the Sunwell's power, and Quel'Thalas fell. The Amani will not make the same mistake of dependency. The sealed Sunwell becomes a monument to victory, not a tool for future wars."

AMA_sw_destroy_sunwell:0 "Destroy the Elven Source of Power"
AMA_sw_destroy_sunwell_desc:0 "Zul'jin orders the Sunwell's destruction. The elven source of power is too dangerous to leave intact — a lure for elven remnants seeking restoration, a point of vulnerability that any arcane-literate enemy could exploit, and fundamentally alien to Amani spiritual tradition. Witch doctors and captured elven mages are forced to cooperate in a ritual of unmaking. The Sunwell's light gutters and dies. The arcane energy that sustained Silvermoon for millennia dissipates into the ether. This is not vandalism — it is strategic elimination. The elves can never return to Quel'Thalas as a functioning magical society without their well. The destruction secures the Amani victory permanently."

AMA_sw_study_sunwell:0 "Study the Ancient Magic"
AMA_sw_study_sunwell_desc:0 "Against the warnings of traditionalist priests, Zul'jin authorises a cautious study of the Sunwell's properties. Captured elven scholars are interrogated. Dalaran texts seized during the war are translated. Amani witch doctors — some of whom served in the Horde alongside orcish warlocks — attempt to understand the well's principles through the lens of spirit-magic. This is dangerous work. Arcane exposure can corrupt, and the Sunwell contains power that dwarfs anything the Amani have ever attempted to harness. But if it can be understood, adapted, and controlled through Amani spiritual traditions rather than elven arcane theory, the possibilities are limitless. The risk is great. The reward is greater."

# ==========================================
# NEW FOCUSES — Economic and Industrial Development
# ==========================================

AMA_sw_war_workshops:0 "War Workshops of Zul'Aman"
AMA_sw_war_workshops_desc:0 "The orcish Horde brought to Azeroth methods of mass production that the Amani had never attempted — not through ignorance, but through a culture that valued individual craftsmanship over industrial scale. That culture must adapt. Zul'jin commissions the construction of war workshops throughout Zul'Aman: foundries for axe heads, tanneries for armour, fletchers for spears and arrows. Orcish advisors share techniques that transformed the Blackrock Clan from raiders into continent-conquerors. The Amani will not abandon their traditions — blessed weapons are still superior — but they will produce them in quantities suitable for modern war."

AMA_sw_timber_for_war:0 "Timber for the War"
AMA_sw_timber_for_war_desc:0 "The forests of Zul'Aman are not merely spiritual territory — they are a vast economic resource. A systematic logging operation is established under the supervision of the war council. Timber feeds the construction of siege engines, fortifications, and warships. It is traded to the Horde in exchange for metals and manufactured goods. The logging is conducted with Loa-blessed rituals of renewal — the Amani take only what the forest can spare, ensuring that this resource will sustain future generations. Even in total war, the Amani do not forget that the forest is their mother, not their mine."

AMA_sw_spoils_of_quelthalas:0 "Spoils of Quel'Thalas"
AMA_sw_spoils_of_quelthalas_desc:0 "The conquest of Quel'Thalas yields more than territory — it yields the accumulated wealth of an ancient elven civilisation. Forges that produced enchanted blade steel. Workshops that wove spell-thread fabrics. Libraries containing magical knowledge that the elves hoarded for themselves. Laboratories where alchemical preparations unknown to troll medicine were perfected. All of these facilities are now in Amani hands, operated under guard by surviving elven craftsmen or by trolls trained to maintain the equipment. The spoils of conquest will fuel the empire's development for a generation."

# ==========================================
# NEW FOCUSES — End of war combination responses
# ==========================================

# ==========================================
# EXISTING IDEAS — names and descriptions preserved
# ==========================================

AMA_sw_loa_blessings_idea:0 "Blessings of the Loa"
AMA_sw_loa_blessings_idea_desc:0 "The ancient Loa spirits watch over the Amani, lending their divine power to our warriors. The eagle's sight, the bear's strength, the lynx's speed, and the dragonhawk's fire flow through those who honour them."

AMA_sw_rangers_nightmare_idea:0 "Rangers' Nightmare"
AMA_sw_rangers_nightmare_idea_desc:0 "Our warriors have been trained to counter every Farstrider tactic. Elven rangers who once dominated the forest now find themselves hunted in turn."

AMA_sw_eternal_hatred_idea:0 "Eternal Hatred"
AMA_sw_eternal_hatred_idea_desc:0 "Three thousand years of oppression have forged an unbreakable hatred in the Amani heart. Our warriors fight with a fury that no human or elf can match."

# ==========================================
# NEW IDEAS
# ==========================================

AMA_sw_warbands_mobilized_idea:0 "Warbands Mobilised"
AMA_sw_warbands_mobilized_idea_desc:0 "Zul'jin's call to arms has been answered. Warbands from every corner of the Amani nation have assembled, eager for elven blood and the promise of reclaimed land. The forest is alive with armed trolls."

AMA_sw_sacred_sites_restored_idea:0 "Sacred Sites Restored"
AMA_sw_sacred_sites_restored_idea_desc:0 "The ancient Loa shrines of Zul'Aman have been cleansed of elven desecration and reconsecrated. The spirits return to their ancient homes, and their power flows freely through the restored Amani Empire."

AMA_sw_preserved_loa_idea:0 "Preserved Loa Shrines"
AMA_sw_preserved_loa_idea_desc:0 "Even in defeat, the Amani protected their most sacred sites. The Loa shrines remain intact, their spirits undiminished. This preservation will be the foundation of the nation's eventual recovery."

AMA_sw_vengeance_eternal_idea:0 "Eternal Vengeance"
AMA_sw_vengeance_eternal_idea_desc:0 "The Amani war against their enemies does not end with one victory. It is a permanent state of being — a sacred duty passed from generation to generation. The axe does not rest, and it never will."

AMA_sw_survivors_will_idea:0 "The Survivor's Will"
AMA_sw_survivors_will_idea_desc:0 "The Amani have survived the Troll Wars, the coming of the elves, and the Second War. They have learned that endurance is the ultimate weapon. Time is on their side — it always has been."

AMA_dragonfire_support:0 "Dragonfire Support"
AMA_dragonfire_support_desc:0 "The Dragonmaw Clan has deployed enslaved red dragons to support the Amani front. Dragonfire can break elven wards, destroy fortifications, and terrify defenders who have never faced aerial attack."

AMA_nalorakk_blessing:0 "Nalorakk's Blessing"
AMA_nalorakk_blessing_desc:0 "The Great Bear has granted his strength to the Amani warriors. Armour feels lighter, strikes land harder, and the endurance of the ancient bear flows through troll veins."

# ==========================================
# EXISTING EVENTS — preserved
# ==========================================

amani_second_war.1.t:0 "The Tribal War Council"
amani_second_war.1.d:0 "The great fire at the heart of Zul'Aman casts dancing shadows across the gathered chieftains. Zul'jin stands before them — one-armed, one-eyed, and more fearsome than any troll alive. 'The orcs march on the human kingdoms,' he declares, his voice carrying the weight of three thousand years of grievance. 'They are not our kin, but they are our weapon. I have seen their armies. I have seen their war machines. And I have seen what happens to the enemies who stand before them.' He pauses, letting the fire crackle in the silence. 'The elves will not expect us. They think we are beaten, cowering in the northern forests while they sip their wine in Silvermoon. We will show them what three thousand years of patience looks like.' One by one, the chieftains rise and swear their fealty. The Amani are united."
amani_second_war.1.option.1:0 "For the Amani! For Zul'Aman!"

amani_second_war.2.t:0 "The Horde War Council"
amani_second_war.2.d:0 "Zul'jin meets Orgrim Doomhammer in the shadow of the fallen dwarf fortresses of Khaz Modan. The Warchief is everything the elves are not — honest in his brutality, direct in his ambitions. 'The elves are a disease,' Doomhammer says, 'and you know their lands better than any of my scouts. Fight alongside the Horde, Warlord, and Quel'Thalas is yours to burn.' Zul'jin studies the orc's scarred face for a long moment. He has spent his entire life distrusting outsiders. But the elves have been outsiders in his homeland for three thousand years, and the Horde offers what no other force in history has offered: a genuine chance at victory. The Warlord extends his hand. 'The Amani will fight with the Horde. But make no mistake, Warchief — we fight for Amani purposes. When Quel'Thalas falls, it falls to us.' Doomhammer grins. 'It is agreed.'"
amani_second_war.2.option.1:0 "The pact is sealed. Let the elves quake."

amani_second_war.3.t:0 "The Borderlands Ablaze"
amani_second_war.3.d:0 "The attack comes at dawn — as all good attacks do. Amani warbands pour out of the northern forests like a flood of vengeance, their axes gleaming in the first light, their war paint glowing with Loa magic. The elven border outposts are overwhelmed in minutes. Villages that have known only peace for centuries are reduced to burning husks. Zul'jin himself leads the central thrust, his remaining arm wielding an axe that has waited decades for this moment. As the flames rise toward the Quel'Thalas sky, a messenger runs to the Warlord. 'The elves are mobilizing, Warlord. Their rangers, their magisters — they are coming.' Zul'jin's scarred face splits into a terrible grin. 'Good. Let them come. Let them see what vengeance looks like.'"
amani_second_war.3.option.1:0 "Burn it all. Leave nothing but ash."

amani_second_war.4.t:0 "The Crossroads of Fate"
amani_second_war.4.d:0 "The war hangs in the balance. From the smoldering borderlands of Quel'Thalas to the blood-soaked fields of Arathi, the Amani have proven themselves worthy of their ancestors. Zul'jin has led his people with cunning and ferocity, earning the respect of orcish warlords and the terror of elven commanders. But war is never certain, and the Horde is not invincible. Doomhammer's legions have been checked before the walls of Lordaeron. The Alliance navy tightens its blockade. And the elves, for all their arrogance, have begun to fight with the desperation of a cornered animal. Zul'jin must decide — press the attack toward Silvermoon with everything we have and stake everything on victory, or begin preparing for the worst. The Amani nation will survive. The question is: as conquerors, or as survivors?"
amani_second_war.4.option.1:0 "Victory is within reach! Press the attack!"
amani_second_war.4.option.2:0 "The war is lost. Begin the retreat to Zul'Aman."
amani_second_war.4.option.3:0 "We will fight to the last troll if we must."
amani_second_war.4.option.4:0 "Secure what we have. Survival is victory enough."

