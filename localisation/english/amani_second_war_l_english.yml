###############################
# Amani Tribe Second War Focus Tree
###############################

AMA_sw_zuljins_resolve:0 "Zul'jin's Resolve"
AMA_sw_zuljins_resolve_desc:0 "He stood alone against the elven hordes when every other troll chieftain fled. The elves took his eye, his arm, his freedom — but they could not take his hatred. Zul'jin's will is forged from three thousand years of Amani suffering. As the Horde marches upon the kingdoms of men and elves, the Warlord of Zul'Aman sees his moment. This time, the trolls will not be on the losing side of history."

AMA_sw_loa_blessings:0 "Blessings of the Loa"
AMA_sw_loa_blessings_desc:0 "The Loa — ancient spirits of the wild — have watched over the Amani since before the elves first defiled these lands. Akil'darah the Eagle, Halazzi the Lynx, Jan'alai the Dragonhawk, and Nalorakk the Bear demand blood and reverence. We call upon them now, offering sacrifices that have not been made in generations. Their power will flow through our warriors. Their fury will be our fury."

AMA_sw_tribal_war_council:0 "Tribal War Council"
AMA_sw_tribal_war_council_desc:0 "Zul'jin summons the chieftains of every forest troll tribe that still answers the Amani name. Witherbark, Mossflayer, Vilebranch, Shadowpine — all must answer the call. Around the great fire in the heart of Zul'Aman, the Warlord lays out his vision: a united troll front, an alliance with the orcish Horde, and a war of extinction against the elves of Quel'Thalas. The chieftains must choose — join the crusade or be forgotten."

AMA_sw_securing_zulaman:0 "Securing Zul'Aman"
AMA_sw_securing_zulaman_desc:0 "Before the Amani can march to war, Zul'Aman itself must be an unbreachable fortress. The ancient temple-city has withstood elven sieges before, but the Horde brings new tactics and new threats. Walls are raised, pits are dug, and every approach to the city is turned into a killing ground. The elves will not catch us unprepared — not this time."

AMA_sw_spirit_guardians:0 "Spirit Guardians"
AMA_sw_spirit_guardians_desc:0 "The Loa do not merely watch — they fight alongside those who honour them. Chosen warriors are ritually bonded with animal spirits, gaining the strength of the bear, the speed of the lynx, the sight of the eagle, and the fury of the dragonhawk. These spirit guardians are more than soldiers; they are living vessels of divine will, and they will be the spearhead of our assault on Quel'Thalas."

AMA_sw_forest_watchers:0 "Forest Watchers"
AMA_sw_forest_watchers_desc:0 "The forests of the north belong to the Amani — they always have. We know every trail, every hollow, every tree that speaks to the spirits. By expanding our network of watchers and trackers, no elven ranger patrol will slip through unnoticed. Information is the first weapon of war, and in our forests, we see everything."

AMA_sw_horde_war_council:0 "Horde War Council"
AMA_sw_horde_war_council_desc:0 "Zul'jin travels south to meet the Warchief Doomhammer himself. The orcs are brutal and direct, so different from the delicate scheming of the elves — and Zul'jin respects that. Around the war table, Amani chieftains sit alongside Blackrock generals, forging an alliance of convenience that both sides know may not outlast the war. But for now, the enemy of my enemy is more than a friend — he is an army."

AMA_sw_southern_front:0 "The Southern Front"
AMA_sw_southern_front_desc:0 "While the bulk of our forces prepare for the elven campaign, we must not leave our southern border exposed. Stromgarde and its Trollbane warriors have been a thorn in troll-kind's side for generations. A southern army will keep the humans pinned in Arathi while the main host strikes north. Two fronts — one purpose. Total war."

AMA_sw_champions_of_loa:0 "Champions of the Loa"
AMA_sw_champions_of_loa_desc:0 "The spirit guardians are merely the beginning. True champions of the Loa are warriors who have died and been reborn through the spirits' grace, wielding powers that the arcane-obsessed elves cannot comprehend. These champions walk with one foot in the spirit world, their strikes guided by ancient wisdom and their bodies shielded by the very essence of the wild."

AMA_sw_hex_warfare:0 "Hex Warfare"
AMA_sw_hex_warfare_desc:0 "The elves rely on their precious arcane magic — sterile, bloodless, predictable. Ours is the magic of spirit and shadow, of curses whispered in the dark and hexes that wither the soul. Our witch doctors have honed their craft through generations of war against these pale usurpers. Let the elves preen with their polished staffs — we will show them what true power looks like."

AMA_sw_blood_oath:0 "Blood Oath to Doomhammer"
AMA_sw_blood_oath_desc:0 "Zul'jin and Orgrim Doomhammer slice their palms and clasp hands as blood mingles between orc and troll. The oath is simple and binding: the Amani will fight alongside the Horde, and in return, the Horde will support the Amani's war against Quel'Thalas. There are no fancy treaties, no magisterial loopholes — only blood and honour. Zul'jin has never trusted a promise more in his life."

AMA_sw_crush_stromgarde:0 "Crush Stromgarde"
AMA_sw_crush_stromgarde_desc:0 "The Kingdom of Stromgarde has stood as a bulwark against the trolls since the Troll Wars. Their walls, their warriors, their vaunted Trollbane bloodline — all of it must fall. We will sweep down from the highlands like a tide of vengeance and drown the Arathi in their own arrogance. The name Trollbane will become a curse, not a title."

AMA_sw_rangers_nightmare:0 "Rangers' Nightmare"
AMA_sw_rangers_nightmare_desc:0 "The elven Farstriders think themselves masters of the forest. We will teach them otherwise. Our spirit-touched trackers, our hex-casting witch doctors, and our warriors who move like shadows through the trees will turn every elven ambush into an elven funeral. The forest is our home. They are merely guests who have overstayed their welcome."

AMA_sw_axes_for_quelthalas:0 "Axes for Quel'Thalas"
AMA_sw_axes_for_quelthalas_desc:0 "Every forge in Zul'Aman burns day and night. Smiths blessed by the Loa oversee the creation of weapons imbued with spiritual power — axes that never dull, spears that seek elven hearts, shields that turn arcane fire aside. This is not industry; it is holy work. Every weapon is a prayer, and every prayer is answered in elven blood."

AMA_sw_hillsbrad_pacified:0 "Hillsbrad Pacified"
AMA_sw_hillsbrad_pacified_desc:0 "With Stromgarde crushed and the Arathi highlands under Amani control, our forces sweep into Hillsbrad to secure the eastern flank. The human settlements are dismantled, their fields claimed, their towers burned. The old troll lands of the eastern kingdoms begin to resemble what they once were — before the humans, before the elves, before the Sundering."

AMA_sw_blessed_axes:0 "Blessed Axes"
AMA_sw_blessed_axes_desc:0 "The Loa personally consecrate the finest weapons ever produced in Zul'Aman. Akil'darah grants keen sight for the thrown spear. Nalorakk grants crushing force for the axe. Jan'alai grants fire that consumes even elven enchantments. When a warrior wields a blessed axe, he does not merely fight — he becomes the Loa's instrument upon the mortal plane."

AMA_sw_burning_borderlands:0 "Burning the Borderlands"
AMA_sw_burning_borderlands_desc:0 "This is the moment Zul'jin has waited for since the day the elves first took his eye. The Amani horde crosses into Quel'Thalas in force, their war cries splitting the enchanted silence of the elven forests. Everything burns — villages, waystones, ancient trees the elves have nurtured for millennia. We are not here to conquer. We are here to erase. Let Silvermoon see the smoke on the horizon and know that Zul'jin is coming."

AMA_sw_never_forgive:0 "Never Forgive the Humans"
AMA_sw_never_forgive_desc:0 "The Troll Wars. The exile. The centuries of humiliation as the younger races claimed the lands that were ours before their ancestors crawled from the mud. The Amani have been wronged by every kingdom of men from Lordaeron to Stormwind. There will be no reconciliation, no peace, no coexistence. The humans call us savages — we will show them what savagery truly means."

AMA_sw_flames_of_vengeance:0 "Flames of Vengeance"
AMA_sw_flames_of_vengeance_desc:0 "The burning of the borderlands was only the beginning. Our forces push deeper into Quel'Thalas, leaving nothing in their wake but ash and lamentation. The elves thought their Runestones would protect them. They thought their magic made them invincible. They thought the Amani were broken. Every one of those assumptions is being proven wrong with each troll axe that finds its mark."

AMA_sw_trollbane_broken:0 "Trollbane Legacy Broken"
AMA_sw_trollbane_broken_desc:0 "The name Trollbane has terrorised our people for centuries — a dynasty of human kings who built their fame on troll corpses. No longer. With Stromgarde in ruins and the Trollbane bloodline scattered to the winds, we claim the human lands of the east as our own. The Arathi Highlands will be renamed. The statues of human heroes will be toppled. And the trolls will walk freely where once we were hunted."

AMA_sw_victory_or_defeat:0 "Victory or Defeat"
AMA_sw_victory_or_defeat_desc:0 "The Second War reaches its climax, and the Amani stand at a crossroads. If the Horde is victorious, Zul'jin's alliance with Doomhammer will have been vindicated — the Amani will rise as a power in the post-war order, with elven lands under troll control and human kingdoms humbled. If the Horde falls, the Amani face an uncertain future: surrounded by vengeful Alliance nations and stripped of their orcish allies. The Warlord must decide the path forward — or fate will decide for him."

AMA_sw_empire_reborn:0 "Empire Reborn"
AMA_sw_empire_reborn_desc:0 "Victory. The Horde has triumphed, and the Amani alongside them. Quel'Thalas lies broken, its Runestones shattered, its Sunwell darkened. The elves who survived flee south as their ancestors once fled the Sundering. Zul'jin looks out upon lands that have not belonged to trolls since the world was young and declares the Amani Empire reborn. A new age begins — an age of trolls."

AMA_sw_retreat_to_zulaman:0 "Retreat to Zul'Aman"
AMA_sw_retreat_to_zulaman_desc:0 "The war is lost. The Horde has crumbled, and the Amani cannot stand alone against the Alliance's full might. Zul'jin orders the withdrawal to the ancient forests of Zul'Aman — the one place the elves have never been able to fully penetrate. The Amani war machine is shattered, but the spirit endures. We will return to the shadows, heal our wounds, and wait. Time is on our side. It always has been."

AMA_sw_enduring_hatred:0 "Enduring Hatred"
AMA_sw_enduring_hatred_desc:0 "Defeat does not mean acceptance. The Amani people have survived worse — the Troll Wars, the coming of the elves, the Sundering itself. Our hatred is an eternal flame that no Alliance victory can extinguish. We retreat, but we do not surrender. Every elf who sleeps soundly in Silvermoon, every human who celebrates in Lordaeron — they will learn that peace is an illusion. The forest watches. The forest waits. The forest remembers."

###############################
# Ideas
###############################

AMA_sw_loa_blessings_idea:0 "Blessings of the Loa"
AMA_sw_loa_blessings_idea_desc:0 "The ancient Loa spirits watch over the Amani, lending their divine power to our warriors. The eagle's sight, the bear's strength, the lynx's speed, and the dragonhawk's fire flow through those who honour them."

AMA_sw_rangers_nightmare_idea:0 "Rangers' Nightmare"
AMA_sw_rangers_nightmare_idea_desc:0 "Our warriors have been trained to counter every Farstrider tactic. Elven rangers who once dominated the forest now find themselves hunted in turn."

AMA_sw_eternal_hatred_idea:0 "Eternal Hatred"
AMA_sw_eternal_hatred_idea_desc:0 "Three thousand years of oppression have forged an unbreakable hatred in the Amani heart. Our warriors fight with a fury that no human or elf can match."

###############################
# Events
###############################

amani_second_war.1.t:0 "The Tribal War Council"
amani_second_war.1.d:0 "The great fire at the heart of Zul'Aman casts dancing shadows across the gathered chieftains. Zul'jin stands before them — one-armed, one-eyed, and more fearsome than any troll alive. 'The orcs march on the human kingdoms,' he declares, his voice carrying the weight of three thousand years of grievance. 'They are not our kin, but they are our weapon. I have seen their armies. I have seen their war machines. And I have seen what happens to the enemies who stand before them.' He pauses, letting the fire crackle in the silence. 'The elves will not expect us. They think we are beaten, cowering in the northern forests while they sip their wine in Silvermoon. We will show them what three thousand years of patience looks like.' One by one, the chieftains rise and swear their fealty. The Amani are united."
amani_second_war.1.option.1:0 "For the Amani! For Zul'Aman!"

amani_second_war.2.t:0 "The Horde War Council"
amani_second_war.2.d:0 "Zul'jin meets Orgrim Doomhammer in the shadow of the fallen dwarf fortresses of Khaz Modan. The Warchief is everything the elves are not — honest in his brutality, direct in his ambitions. 'The elves are a disease,' Doomhammer says, 'and you know their lands better than any of my scouts. Fight alongside the Horde, Warlord, and Quel'Thalas is yours to burn.' Zul'jin studies the orc's scarred face for a long moment. He has spent his entire life distrusting outsiders. But the elves have been outsiders in his homeland for three thousand years, and the Horde offers what no other force in history has offered: a genuine chance at victory. The Warlord extends his hand. 'The Amani will fight with the Horde. But make no mistake, Warchief — we fight for Amani purposes. When Quel'Thalas falls, it falls to us.' Doomhammer grins. 'It is agreed.'"
amani_second_war.2.option.1:0 "The pact is sealed. Let the elves quake."

amani_second_war.3.t:0 "The Borderlands Ablaze"
amani_second_war.3.d:0 "The attack comes at dawn — as all good attacks do. Amani warbands pour out of the northern forests like a flood of vengeance, their axes gleaming in the first light, their war paint glowing with Loa magic. The elven border outposts are overwhelmed in minutes. Villages that have known only peace for centuries are reduced to burning husks. Zul'jin himself leads the central thrust, his remaining arm wielding an axe that has waited decades for this moment. As the flames rise toward the Quel'Thalas sky, a messenger runs to the Warlord. 'The elves are mobilizing, Warlord. Their rangers, their magisters — they are coming.' Zul'jin's scarred face splits into a terrible grin. 'Good. Let them come. Let them see what vengeance looks like.'"
amani_second_war.3.option.1:0 "Burn it all. Leave nothing but ash."

amani_second_war.4.t:0 "The Crossroads of Fate"
amani_second_war.4.d:0 "The war hangs in the balance. From the smoldering borderlands of Quel'Thalas to the blood-soaked fields of Arathi, the Amani have proven themselves worthy of their ancestors. Zul'jin has led his people with cunning and ferocity, earning the respect of orcish warlords and the terror of elven commanders. But war is never certain, and the Horde is not invincible. Doomhammer's legions have been checked before the walls of Lordaeron. The Alliance navy tightens its blockade. And the elves, for all their arrogance, have begun to fight with the desperation of a cornered animal. Zul'jin must decide — press the attack toward Silvermoon with everything we have and stake everything on victory, or begin preparing for the worst. The Amani nation will survive. The question is: as conquerors, or as survivors?"
amani_second_war.4.option.1:0 "Victory is within reach! Press the attack!"
amani_second_war.4.option.2:0 "The war is lost. Begin the retreat to Zul'Aman."
amani_second_war.4.option.3:0 "We will fight to the last troll if we must."
amani_second_war.4.option.4:0 "Secure what we have. Survival is victory enough."
