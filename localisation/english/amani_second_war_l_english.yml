# NEW EVENTS — localisation
# ==========================================

amani_second_war.10.t:0 "Our War, Their War"
amani_second_war.10.d:0 "The war council chamber in Zul'Aman is thick with tension. Two factions have emerged among the chiefs. One, led by veteran warriors who have shed blood alongside orcish regiments, argues that the Amani's future lies in full commitment to the Horde's grand strategy — the stronger the Horde becomes, the more resources and support flow north. The other, led by traditionalists who remember every broken promise of the Troll Wars, argues that the orcs will abandon the elven front the moment their own interests shift. Zul'jin listens in silence, his one eye moving between the speakers. 'The Horde is our weapon,' one chief declares. 'The Horde is a temporary ally,' another counters. 'When their war ends, ours continues.' The Warlord must decide. Is this a joint war, or is the Horde merely a tool to be discarded after the elves are dealt with?"
amani_second_war.10.a:0 "The Horde is a weapon. We aim it at the elves and nothing more."
amani_second_war.10.b:0 "Our future is with the Horde. We commit to the grand strategy."

amani_second_war.15.t:0 "Call Upon Dragonfire"
amani_second_war.15.d:0 "Zul'jin's emissaries arrive at the Dragonmaw holdings bearing gifts and a formal request: the Amani seek dragon support for the Quel'Thalas campaign. The elven Runestones and coastal fortifications are resistant to conventional siege, but dragonfire can break both. The dragon riders of the Dragonmaw Clan are the Horde's ultimate terror weapon, and deploying them over Quel'Thalas would terrify the elven defenders while destroying their magical infrastructure. The request is ambitious — the Dragonmaw guard their dragons with fanatical possessiveness — but the blood oath Doomhammer swore to Zul'jin implies that the full resources of the Horde support the Amani campaign. The question is whether the Dragonmaw agree."
amani_second_war.15.a:0 "Send for the dragons. The elves must learn what fire can do."

amani_second_war.16.t:0 "Amani Request for Dragon Support"
amani_second_war.16.d:0 "The Amani seek our dragons to burn their way through Quel'Thalas. Zul'jin's emissaries present a compelling case: the elven Runestones and fortifications will cost thousands of troll lives to breach conventionally, but a single flight of dragons could shatter their defensive line. Deploying dragons also sends a powerful political message — that the Horde honours its commitments, even at the expense of our most precious resource. However, every dragon sent north is a dragon not available for our own operations. The elders debate fiercely. Some argue that denying Zul'jin will damage the Horde alliance at a critical moment. Others insist that the dragons are our treasure, not the Horde's to distribute. The decision rests with the Dragonmaw leadership."
amani_second_war.16.a:0 "Deploy a flight of dragons. Zul'jin has earned this."
amani_second_war.16.b:0 "The dragons stay with Dragonmaw. The Amani can manage without them."

amani_second_war.20.t:0 "The Great Offering"
amani_second_war.20.d:0 "The four great shrines of Zul'Aman blaze with ritual fires as the priests perform the Great Offering — a ceremony not conducted since the height of the Troll Wars. At the Eagle Shrine, offerings of sky-iron and captured elven messenger hawks. At the Bear Shrine, the hearts of great beasts and honey from ancient hives. At the Dragonhawk Shrine, sacred oils and flame-enchanted jewels seized from elven arcane vaults. At the Lynx Shrine, the pelts of shadow-panthers and the silence of the deepest forest. The Loa answer. For the first time in three thousand years, all four great spirits manifest simultaneously, their power visible as shimmering auras around the assembled priests. Every troll in Zul'Aman feels it — a surge of ancient strength, a reminder of what the Amani were before the elves shattered the world. The blessing will not last forever. But while it persists, the children of Zul'Aman will fight as their ancestors fought at the empire's zenith."
amani_second_war.20.a:0 "The Loa walk with us. Nothing can stop us now."

amani_second_war.30.t:0 "Messengers to the Distant Tribes"
amani_second_war.30.d:0 "Amani emissaries fan out across the eastern kingdoms, carrying tokens blessed by the Loa and Zul'jin's personal seal. To the Witherbark in the Hinterlands: Zul'jin offers alliance against the human settlements encroaching on troll hunting grounds. To the Vilebranch in the Alterac highlands: the promise of participation in a restored troll confederation. To the scattered bands of Firetree and Smolderthorn: an end to exile, a place in the new order. The responses vary. Some tribes meet the messengers with honour and eagerness — they have been watching the Amani resurgence and want to be part of it. Others are suspicious, remembering old conflicts and questioning whether Zul'jin's promises will be kept when victory is achieved. The messengers report back with treaties, pledges, and in some cases, evasions. The reunification of the forest trolls has begun, but it will take more than words to complete."
amani_second_war.30.a:0 "Every tribe that joins us strengthens the nation."

amani_second_war.31.t:0 "The Confederation Restored"
amani_second_war.31.d:0 "One by one, the forest troll tribes pledge allegiance to the restored Amani confederation. The gathering at the foot of Zul'Aman is the largest troll assembly since the Troll Wars. Witherbark axe-throwers in their distinctive red war paint. Vilebranch warriors carrying skull-trophies from their campaigns in the Alterac passes. Mossflayer trackers whose knowledge of the eastern forests rivals even the Amani. Shadowpine witch doctors whose hexes are whispered about in fear from Lordaeron to Gilneas. Each tribe swears its own oath in its own dialect, invoking its own ancestral spirits alongside the four great Loa. It is messy, noisy, and chaotic — everything a human treaty ceremony is not. And it is beautiful. Zul'jin has achieved what generations of Amani chiefs could not: the forest trolls are one people again."
amani_second_war.31.a:0 "Under the ancient banner, we are one."

amani_second_war.32.t:0 "The Amani Messenger"
amani_second_war.32.d:0 "An Amani emissary stands before the tribal elders, bearing Zul'jin's personal seal and a proposal: join the restored Amani confederation, contribute warriors to the war against Quel'Thalas, and receive a share of the conquered elven lands. The messenger recounts the Amani victories — the shattered Runestones, the burning borderlands, the Farstriders driven from their patrol routes. This is not a plea from a dying nation, the emissary explains. This is an invitation from a rising power. The choice before the tribe is stark: be remembered as allies who stood with the Amani in their hour of triumph, or be forgotten as cautious isolationists who missed the rebirth of the troll nation. The elders debate. Some argue for joining — the Amani are clearly winning, and the spoils will be immense. Others counsel caution — Zul'jin's promises may evaporate when the war ends, and the tribe could find itself a subordinate province rather than an equal partner. The decision will shape the tribe's future for generations."
amani_second_war.32.a:0 "We answer the call. The Amani are our kin."
amani_second_war.32.b:0 "We keep our own counsel. The Amani can win without us."

amani_second_war.40.t:0 "Zul'jin's Fate"
amani_second_war.40.d:0 "In the aftermath of defeat, the Warlord must decide what becomes of his own legend. Some of his closest advisors urge him to step back, to let the legend of Zul'jin grow in the telling while younger, less conspicuous leaders guide the nation through the difficult years ahead. The Alliance will be looking for the one-armed, one-eyed troll who led the assault on Quel'Thalas — better that they find a gray-haired elder in a forest hut than a warlord in a war camp. Others argue the opposite: Zul'jin must remain visible, a living symbol of defiance. His continued leadership is the only thing that will hold the scattered tribes together through the dark times. Every troll who sees him will know that the Amani still have a leader, a purpose, and a future."
amani_second_war.40.a:0 "Step back into legend. The nation continues, with or without its Warlord."
amani_second_war.40.b:0 "Stand defiant. Let the elves know Zul'jin is still here, still watching, still waiting."

amani_second_war.50.t:0 "The Betrayal of Gul'dan"
amani_second_war.50.d:0 "Shocking news reaches the Amani war council: Gul'dan the warlock has abandoned Doomhammer's campaign, taking a significant portion of the Horde's forces on a reckless quest for power across the seas. The Horde is fractured. Fronts that were advancing are suddenly stalled. Doomhammer is reportedly in a fury, diverting forces to hunt the traitors. For the Amani, the implications are immediate and dire. Horde support for the Quel'Thalas campaign — already less than promised — may evaporate entirely. The strategic initiative that was tilting toward the Horde is now uncertain. Zul'jin convenes an emergency council. The chiefs demand to know the Amani response."
amani_second_war.50.a:0 "Doomhammer was right to oppose the warlocks. We stand with the Warchief."
amani_second_war.50.b:0 "Gul'dan's treachery is an orc problem. We stay focused on Quel'Thalas."
amani_second_war.50.c:0 "If the Horde fractures, we must secure our gains quickly."

amani_second_war.60.t:0 "The Sunwell"
amani_second_war.60.d:0 "Our forces control the Isle of Quel'Danas. At its heart lies the Sunwell — a font of arcane energy so powerful that it sustained the elven kingdom for ten thousand years. Amani scouts report that the area is unnaturally quiet, the air thick with residual magic that makes troll skin prickle and spirit-wards flicker. The priests are deeply uneasy. This is elven magic, fundamentally alien to the Loa's domain, and they warn that any attempt to interact with the well could bring corruption. The witch doctors are more pragmatic — power is power, and the Amani should at least understand what they have captured. The war chiefs simply want the well dealt with so it cannot become a rallying point for elven remnants. Zul'jin must decide the Sunwell's fate."
amani_second_war.60.a:0 "Seal the area. No one enters, no one leaves, no one uses it."
amani_second_war.60.b:0 "Destroy it. The elven source of power must be eliminated."
amani_second_war.60.c:0 "Study it carefully. Power understood is power that cannot be used against us."

amani_second_war.70.t:0 "The Scattered Tribes Return"
amani_second_war.70.d:0 "The fall of Quel'Thalas has done what centuries of Amani diplomacy could not — it has convinced every forest troll band east of the mountains that the Amani Empire is back. Bands that fled into the deep wilderness during the Troll Wars emerge bearing ancestral weapons and half-remembered clan names. Remote villages that traded with nobody and knew no chief now send their young warriors to Zul'Aman. The reunification that Zul'jin began with promises and diplomacy is now completing itself through the magnetism of victory. Everyone wants to be on the winning side. Everyone wants to say they were there when the empire returned."
amani_second_war.70.a:0 "Welcome home. The nation is whole again."

amani_second_war.80.t:0 "A Warband Demands the Eastern Forests"
amani_second_war.80.d:0 "A delegation of war chiefs presents Zul'jin with an ultimatum disguised as a request. Their warriors have bled for the campaign — they have earned the right to the choicest conquered lands. The eastern forests of Quel'Thalas, with their rich hunting grounds and captured elven settlements, must be distributed to the warbands immediately, not held in reserve for some future state council. The chiefs make clear that their warriors grow restless, and a warlord who hoards the spoils may find his warbands returning to their villages. Zul'jin must manage this demand carefully — honour the warriors' claim, redirect their ambition, or risk a crisis of authority."
amani_second_war.80.a:0 "Promised land is warriors' land. Let them take what they have earned."
amani_second_war.80.b:0 "Compensate them with arms and supplies instead. The land belongs to the nation."
amani_second_war.80.c:0 "Refuse. Conquered land will be distributed by the council, not claimed by force."

amani_second_war.81.t:0 "The Priests Demand an Offering"
amani_second_war.81.d:0 "The high priests of the four great Loa approach Zul'jin with a formal request. The war has been blessed by the spirits, but the spirits demand recognition. A great ceremonial offering must be made — resources diverted from the war effort, precious materials sacrificed, rituals performed at each shrine. The priests argue that the Loa's continued favour depends on it. The war chiefs argue that every resource diverted to ceremony is a resource not spent on killing elves. Zul'jin must navigate the eternal tension between spiritual obligation and military necessity."
amani_second_war.81.a:0 "Honour the Loa. Without their blessing, we fight blind."
amani_second_war.81.b:0 "Redirect these resources to the war. The Loa understand necessity."
amani_second_war.81.c:0 "A compromise: a smaller offering, and the priests join the front lines."

amani_second_war.82.t:0 "A Chief Defies Zul'jin's Authority"
amani_second_war.82.d:0 "Zul'jin's order to integrate Amani warbands with Horde formations has been publicly refused by a prominent chief who declares that his warriors will not take orders from orcs. The defiance is spreading — several other chiefs have expressed sympathy, and one has withdrawn his warband from the front entirely. This is not merely a military problem; it is a direct challenge to Zul'jin's authority over the tribal coalition. How the Warlord handles this defiance will determine whether the council's unity survives the stresses of war."
amani_second_war.82.a:0 "Enforce obedience. Zul'jin's word is law."
amani_second_war.82.b:0 "Tolerate the autonomy. The chief is a problem for another day."
amani_second_war.82.c:0 "Challenge the chief to single combat. Let the Loa decide who leads."

amani_second_war.83.t:0 "Divide the Spoils"
amani_second_war.83.d:0 "With Quel'Thalas conquered, the question that has been deferred throughout the campaign can no longer be avoided: how will the spoils be divided? The war chiefs demand distribution of territory to reward those who fought hardest. The priests intervene to claim the most sacred captured sites for the Loa. The council members who stayed behind in Zul'Aman argue for reserving key territories under state administration. The captured elven treasury complicates everything — everyone wants gold, but gold alone cannot buy the loyalty of warriors who were promised land. Zul'jin's distribution will define the early character of the restored empire."
amani_second_war.83.a:0 "Reward the warriors. Their blood paid for every acre."
amani_second_war.83.b:0 "Prioritise the sacred sites. The Loa must be honoured first."
amani_second_war.83.c:0 "Reserve key territories for the state. The empire needs centralised administration."

