shadowmoon_obedience.1.t:0 "Kil'jaeden Demands Obedience"
shadowmoon_obedience.1.d:0 "With Doomhammer in control of the Horde and the Human kingdoms defeated or shattered, the bloodlust that had consumed the horde under the control of Gul'dan and his puppet Blackhand had subsided. Doomhammer had begun grantings lands in the newly captured world to the clans that were left behind on our dying world.\nWhile many of the orcish clans slowly began the trek to the new world, Ner'zhul had a unwelcomed visitor, Kil'jaeden appeared to him once again using the guise of Rulkan. Ner'zhul having grown tired of this game asked the Demon why he had invaded his dreams again, Kil'jaeden did not honey his words as he once did, his demands were simple.\nObey the Legion, or have your clan crushed, turned to ash and scattered to the winds of time."
shadowmoon_obedience.1.option.1:0 "I was once decieved, I refuse you Demon!"
shadowmoon_obedience.1.option.2:0 "My Clan will never serve the..."

