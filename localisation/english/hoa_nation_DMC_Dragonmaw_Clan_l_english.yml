DMC_last_of_the_rylaks_idea_1:0 "The Last of the Rylaks"
DMC_last_of_the_rylaks_idea_1_desc:0 "To fend off stavation the Dragonmaw were forced to consume their own Rylaks to survive, the ones they brought with them through the Portal were some of the only remaining of their kind."
DMC_last_of_the_rylaks_idea_2:0 "The Rylaks Slow Recovery"
DMC_last_of_the_rylaks_idea_2_desc:0 "As a food source has been secured our Rylaks are no longer at risk of being consumed by our clan, but their numbers are still very low, and it will take time for them to recover."
DMC_last_of_the_rylaks_idea_3:0 "The First Of Their Kind"
DMC_last_of_the_rylaks_idea_3_desc:0 "It has been a long time since we have held Baby Rylaks in our own hands, fearsome in appearance but playful in nature the children of the horde can be seen chasing them around the camps playfully."
