DMC_misty_reed_post:0 "Misty Reed Post"
DMC_misty_reed_post_desc:0 "The construction of the Misty Reed Post began with a group of ogres who just wanted to stay out of the rain in the midst of the swamp, the Outpost has now become a major hub of transit with defensive fortifications and a place for shipwrights to complete their working without being harrassed by crocolisks."
