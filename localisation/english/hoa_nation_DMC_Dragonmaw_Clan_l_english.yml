DMC_flight_defensive_2:0 "Defensive Specialization"
DMC_flight_defensive_2_desc:0 "The massive winged birds the Pink Skins ride have sharp beaks and talons, our riders have gotten used to carrying spears to fend them off before they can rip them to shreds."
