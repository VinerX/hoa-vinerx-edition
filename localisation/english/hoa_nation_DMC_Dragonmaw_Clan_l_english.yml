DMC_fix_the_roads:0 "Fix the Roads"
DMC_fix_the_roads_desc:0 "The Bleeding Hollow are more used to these horrible conditions, we had to pull over a dozen ogres out of Mud Pits this week, and we had a rylak slide on landing and end up in the ocean."
DMC_strike_the_earth:0 "Ogre Hill Camps"
DMC_strike_the_earth_desc:0 "The Ogres have begun to chip away at the mountain range to the West as they have become tired of sleeping on the swampy ground, they have also reported that they have found ores in the walls of one of their caves."
