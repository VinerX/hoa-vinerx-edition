#events
###############################
dragonmaw.1.t:0 "Blackhand's Orders"
dragonmaw.1.d:0 "Warchief Blackhand has charged us with overseeing the eventual creation of a naval base in these swamps. The local race of fishmen occupy much of this coast line. We must destroy them in order to continue with this mission."
dragonmaw.1.option.1:0 "For the Warchief!"
dragonmaw.2.t:0 "Victory over the Marshtide Tribe"
dragonmaw.2.d:0 "The pitiful fish people where no match for our warriors, they have left these lands largely undeveloped and unexploited. We should get to work immediately in order to establish our future naval base."
dragonmaw.2.option.1:0 "For the Horde!"
dragonmaw.3.t:0 "Warchief Overseeing Breeding"
dragonmaw.3.d:0 "In order to ensure victory, the Warchief himself will be overseeing the breeding of our newly tamed red dragons. We must work overtime in order to ensure his expectations our met."
dragonmaw.3.option.1:0 "No mistakes men!"

dragonmaw.4.t:0 "Tainted by Madness"
dragonmaw.4.d:0 "The Creatures of this temple are mindless beasts, the Trolls seem to have been conducting rituals upon them which had led to madness, putting them down is all we can do."
dragonmaw.4.option.1:0 "Sleep now Beasts"

dragonmaw.5.t:0 "Zuluhed's Visions"
dragonmaw.5.d:0 "Zulehed of the Dragonmaw Clan has requested permission to investigate his Visions of winged beast that breath fire."
dragonmaw.5.option.1:0 "Allow the Elder Shaman his request."

dragonmaw.6.t:0 "Blackened Mountains"
dragonmaw.6.d:0 "The Visions show a cave filled with red lizard beasts, the area looks to be the same as Blackrock mountains."
dragonmaw.6.option.1:0 "The Area is Large, We must find Answers."

dragonmaw.7.t:0 "The Blackrock Orc"
dragonmaw.7.d:0 "A Blackrock scout has reported to us the exsitence of a large red reptile in the Redridge mountains, an area scorched with the same blackrock we have be searching for."
dragonmaw.7.option.1:0 "Report to the Warchief"

dragonmaw.10.t:0 "Our Failures"
dragonmaw.10.d:0 "The Dragonmaw along with the Stormreavers were ordered to take the Elven kingdom, we have missed the deadline the warchief set for us and there are reports that he is sending an a band of overseers to enforce his commands."
dragonmaw.10.option.1:0 "Get me Gul'dan!"

dragonmaw.11.t:0 "The Warlocks Punishment"
dragonmaw.11.d:0 "Gul'dan has been absent for most of the war with the elves, going off with his warlocks to other parts of the front and refusing to explain himself, the Warchief ordered us to keep him in check."
dragonmaw.11.option.1:0 "The Warchiefs Orders will be followed"

dragonmaw.12.t:0 "A Dark Pact"
dragonmaw.12.d:0 "Gul'dan has offered us a path to victory, he has given us a number of his Death Knights to fight against the Elves, he has also sent word to Cho'Gall to explain the need for specilized forces to fight the elves to the Warchief."
dragonmaw.12.option.1:0 "He has brought us time."

dragonmaw.13.t:0 "Redouble Efforts"
dragonmaw.13.d:0 "Doomhammer and the trolls will not be pleased, but we will need to retreat from the north, with Gul'dan and his warlocks missing from the battlefield we are unable to break the cities barrier. Sent troops south to reinforce the Blackrock Clan we can negotiate with Warchief once we have struck a heavy blow against the humans."
dragonmaw.13.option.1:0 "Only send who we can spare."

dragonmaw.14.t:0 "Blackhands Sons"
dragonmaw.14.d:0 "Rend and Maim have demanded an audience with the Cheiften, and Zuluhed has obliged. The Warchief has demanded his head for his failures against the Elves in the north."
dragonmaw.14.option.1:0 "The Horde will not be a Dragons Pet"
dragonmaw.14.option.2:0 "For My Clan."

dragonmaw.15.t:0 "A Power Struggle"
dragonmaw.15.d:0 "With our new Homeland Secured many have begun to build new homes and rest, while out warriors fight on other battlefields Nekros has taken this as a perfect time to challenge the Chieften to a Mak'gora."
dragonmaw.15.option.1:0 "Zuluhed's Victory"
dragonmaw.15.option.2:0 "Nekros's Victory"

