DMC_the_rylaks_slow_recovery_desc:0 "After beating the Fishmen back we found our Rylaks did not care much for their meat, it was not until a Ogre game back holding a large lizard the size of a tree log that both we and the rylaks could eat out fill."
DMC_flight_offensive_1:0 "Agressive Training"
DMC_flight_offensive_1_desc:0 "The Rylaks have gotten a taste for blood, ever since we arrived they have begun to attack anything that moves just to see if the meat is to their liking."
DMC_flight_defensive_1:0 "Defensive Training"
DMC_flight_defensive_1_desc:0 "Ensuring the safety of both our Rylaks and their riders is key to making the best use out of what few Rylaks still live."
