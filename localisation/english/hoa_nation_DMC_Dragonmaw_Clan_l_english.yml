DMC_look_to_the_seas:0 "Look to the Seas"
DMC_look_to_the_seas_desc:0 "The land route to the other human lands are to be secured by the other clans, but the seas are another matter all together, great husks of ships were left behind in ports from the land we have taken, and this is of confern to many."
DMC_the_next_generation:0 "The Next Generation"
DMC_the_next_generation_desc:0 "For the few years we have lived on this world we have seen our loyal beasts thrive, and we will continue to ensure they are the greatest weapons of war that they can be."
