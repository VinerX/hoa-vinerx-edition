DMC_pit_fighting:0 "Dragon Pit Fights"
DMC_pit_fighting_desc:0 "A practice brought about by Nekros where an aspiring warrior engaging in one on one combat with a Dragonspawn victory results in the warrior being reciving equipment fitting their station, as well as being met by the cheers of their clansmen and the cries of sorrows from the dragons nearby."

