DMC_dragonriders_idea:0 "Dragonriders"
DMC_dragonriders_idea_desc:0 "The Dragonmaw during their time on Azeroth mastered the art of wrangling dragons and training them to obey them."

DMC_oversized_bats_idea:0 "Oversized Bats"
DMC_oversized_bats_idea_desc:0 "As much as the Trolls try to deny it, they have massive bats."

DMC_dream_of_dragons:0 "Dream of Dragons"
DMC_dream_of_dragons_desc:0 "Zuluhed has embarked on a mission to discover the meaning behind his visions"
DMC_lack_of_eggs:0 "Lack of Eggs"
DMC_lack_of_eggs_desc:0 "The Red Dragon Queen we have enslaved has told us of their slow hatching cycles, however under threat of Injury to her young she has told us where we can find more eggs."
DMC_begin_training:0 "Dragon Wrangling"
DMC_begin_training_desc:0 "Now that we have access to dragon eggs, we will begin the process of breaking the beasts to our will."
DMC_secure_the_queen_idea:0 "Imprisoned Queen"
DMC_secure_the_queen_idea_desc:0 "We have Imprisoned the Queen in the hold of Grim Batol, and have brought her consorts to heel."
DMC_dragon_harnesses:0 "Dragon Harnesses"
DMC_dragon_harnesses_desc:0 "We have begun mounting harnesses onto the dragons to better control their fiery breath, though some a very stubbon."

DMC_build_up_stockpiles_idea:0 "Axe Stockpiles"
DMC_build_up_stockpiles_idea_desc:0 "We are soon to embark north to the Dwarven Highlands the Dragons have told us about, we need to make sure we have enough weaponry before we attack the Dwarves."

