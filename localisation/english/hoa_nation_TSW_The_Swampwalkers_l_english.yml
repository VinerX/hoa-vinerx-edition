TSW_tremors_in_the_roots:0 "Tremors in the Roots"
TSW_tremors_in_the_roots_desc:0 "Beneath our mire-laden home, a stirring resonates through the earth. Something unfamiliar, yet foreboding. We, the Bog Beasts of the Swamp of Sorrows, hearken to nature's call, for the essence of this disturbance demands our attention. We delve deeper, seeking understanding and preparing to protect our sacred realm."

TSW_expand_the_swamp:0 "Expand the Swamp"
TSW_expand_the_swamp_desc:0 "We navigate the labyrinthine maze of our murky domain with instinctual grace. Yet, the need for expansion urges us onward. We shall forge new trails through tangled foliage and mud."

TSW_deeper_roots:0 "Deeper Roots"
TSW_deeper_roots_desc:0 "As denizens of the murky depths, we, the Swampwalkers, draw power from the ancient soil that binds us. We delve deeper, intertwining our essence with the primal earth, bolstering our might. Through strengthened roots, we thrive, harnessing the untamed forces of nature to ensure our dominance within the ever-shifting swamplands."

TSW_murky_waters:0 "Murky Waters"
TSW_murky_waters_desc:0 " In the depths of the murky waters, we, the Swampwalkers, find solace and strength. The veiled currents hold secrets untold, guiding us through the labyrinth of our domain."

TSW_spawning_pools:0 "Spawning Pools"
TSW_spawning_pools_desc:0 "We carve sacred spawning pools, where the essence of our kind converges, birthing mighty new brethren that shall perpetuate our legacy. From the depths we rise, multiplying our numbers and solidifying our dominion over the swamp."

TSW_vegetation_overgrowth:0 "Vegetation Overgrowth"
TSW_vegetation_overgrowth_desc:0 "Amidst the shadowed embrace of our cherished swamp, we, the Swampwalkers, yearn to weave a denser tapestry of life. With every breath, we infuse the land with our essence, coaxing the tendrils of vegetation to grow with unrivaled vigor. As the verdant canopy thickens, it becomes a haven where our kind thrives."

TSW_purify_the_cave:0 "Purify the Spring"
TSW_purify_the_cave_desc:0 "Within Purespring Cavern to the west of the swamp, dormant magic pulses, awaiting liberation. We shall cleanse the tainted waters, purifying them from impurities that plague their sacred essence."

TSW_seed_new_life:0 "Seed New Life"
TSW_seed_new_life_desc:0 "Within our ancestral swamp, we embrace our role as guardians of growth. With care and wisdom, we sow the seeds of life, intertwining our roots with the fertile soil. Through our collective will, we channel the essence of the swamp, coaxing verdant life to sprout and flourish. From tender shoots to towering canopies, the swamp breathes anew, a testament to our symbiotic existence."

TSW_consume_the_green_skins:0 "Consume the Green Skins"
TSW_consume_the_green_skins_desc:0 "The green skins lay broken, their bodies ripe for our consumption. Our spores infest their flesh, birthing new kin in our image. Their defeat becomes our triumph as we expand our dominion, shrouding the swamp in our infectious embrace."

TSW_unwilling_neutrients:0 "Unwilling Nutrients"
TSW_unwilling_neutrients_desc:0 ""

TSW_infest_peons:0 "Infest Peons"
TSW_infest_peons_desc:0 "The feeble peons, remnants of the vanquished green skins, unknowingly become vessels of our dominance. Our fungal tendrils infiltrate their minds, harnessing their labor for our insidious agenda. "

TSW_overgrow_their_buildings:0 "Overgrow their Buildings"
TSW_overgrow_their_buildings_desc:0 "With the orcish structures abandoned, we surge forth, embracing the symbiotic dance with our swamp realm. We intertwine our essence with the decaying remnants, unleashing the wild growth. The swamp reclaims what was lost, as nature's triumph heralds our resurgence."

TSW_restore_the_west_lands:0 "Restore the West Lands"
TSW_restore_the_west_lands_desc:0 "The western parts of the swamp suffer the scars inflicted by the green-skins. We need to mend the torn fabric of the bog. Through our roots, we will channel vitality, nurturing life's resurgence within the area."

TSW_infest_wolves:0 "Infest Wolves"
TSW_infest_wolves_desc:0 "The green skins rid upon huge four-legged creatures known as wolves. We should infest these mobile creatures' corpses to do the bidding of the swamp lord."

TSW_integrate_their_weapons:0 "Integrate Their Tools"
TSW_integrate_their_weapons_desc:0 "While the green-skins tools caused much damage to the swamp, it is for this exact reason that we shall integrate them into our own bodies, using them to do as much harm as they did to us."

TSW_feeding_frenzy:0 "Feeding Frenzy"
TSW_feeding_frenzy_desc:0 ""

TSW_infested_grunts:0 "Infest Grunts"
TSW_infested_grunts_desc:0 "We have learned that the green skins soldiers are known as 'grunts', they have fought fiercely and that is why we will infest their bodies to make use of their strength."

TSW_consume_the_marshtide:0 "Consume the Marshtide"
TSW_consume_the_marshtide_desc:0 "When moving to reclaim the eastern reaches of the swamp, we have come across the Marshtide murloc tribe. While the murlocs have never been as much of a threat to the swamp as the green skins, we might have to consume them as well..."

TSW_corrupt_the_marshtide:0 "Corrupt the Marshtide"
TSW_corrupt_the_marshtide_desc:0 "The Marshtide tribe of murloc to the east have not done as much damage to the swamp as the green skins, despites inhabiting its coast for much more longer. Maybe we should channel our dark energies to turn them against our enemies..."

TSW_call_from_below:0 "Call from Below"
TSW_call_from_below_desc:0 "As our roots grow deeper and deeper in the ground, we sense something, something beaconing us to grow further..."

TSW_infest_the_wildlife:0 "Infest the Wildlife"
TSW_infest_the_wildlife_desc:0 "We have always lived in harmony with the other creatures of the swamp, often calling for their aid. But as we have grown our roots deeper towards the voices of below, they have been whispering us to infest the wildlife... "

TSW_void_touched_tendrils:0 "Void Touched Tendrils"
TSW_void_touched_tendrils_desc:0 "The strange powers of below have been slowly spreading through our roots, imbuing them with new forms of magic."

TSW_void_beasts:0 "Void Beasts"
TSW_void_beasts_desc:0 "Our roots now grow deeper than they have ever grown and the voices of below are now clear within our minds. They speak of the Dark Ones and grant us great powers in their names..."

TSW_grabbing_arms:0 "Grabbing Roots"
TSW_grabbing_arms_desc:0 ""
TSW_the_forest_whispers:0 "Whispers in the Forests"
TSW_the_forest_whispers_desc:0 ""
TSW_ancient_behemoths:0 "Forgotten Behemoths"
TSW_ancient_behemoths_desc:0 ""
TSW_primordial_tide:0 "The Primordial Tides"
TSW_primordial_tide_desc:0 ""

TSW_heart_of_the_swamp:0 "Heart of the Swamp"
TSW_heart_of_the_swamp_desc:0 "We, the Swampwalkers, embody the very essence of the swamp, faithfully serving as its devoted custodians. Its lush, vibrant bogs are not only our home but also our lifeblood, and without their nurturing embrace, our existence would languish and fade. We are resolute in our unwavering commitment to shield and safeguard it."

TSW_night_stalkers:0 "Night Stalkers"
TSW_night_stalkers_desc:0 "Some of our stealthy brethren, revered as Night Stalkers, adeptly traverse the swamp in the darkness of the night, their movements shrouded in secrecy. Like elusive phantoms, they maneuver under the canopy, unseen and unnoticed."

TSW_fen_lurkers:0 "Fen Lurkers"
TSW_fen_lurkers_desc:0 "Fen Lurkers hide with the vines on trees and entangle any unsuspecting pray that draws close enough to them."

TSW_swamp_lurkers:0 "Swamp Lurkers"
TSW_swamp_lurkers_desc:0 "Swamp lurkers hide deep within the pools of the swamp and will emerge to engulf the green skins before they will be able to suspect a thing."

