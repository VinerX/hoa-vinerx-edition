swampwalkers.1.t:0 "Strange Creatures"
swampwalkers.1.d:0 "Green skinned creatures have moved into are region and have started to cut down the trees and fill the swamps waters with roads and other monstrosities. Little do they know we the heart of the swamp our waiting for them."
swampwalkers.1.option.1:0 "They should be careful..."
swampwalkers.2.t:0 "Victory over the Bleeding Hollow"
swampwalkers.2.d:0 "We have engulfed the last of these green skinned creatures. Their roads have sunk back into the swamp and their large towers engulfed in vines and split apart by trees. Let this be a sign for any more that should try to take our lands."
swampwalkers.2.option.1:0 "The swamp thrives!"
swampwalkers.3.t:0 "Consume the Green Skins"
swampwalkers.3.d:0 "We have engulfed the last of these green skinned creatures. Their roads have sunk back into the swamp and their large towers engulfed in vines and split apart by trees. Let this be a sign for any more that should try to take our lands."
swampwalkers.3.option.1:0 "They have joined the Swarm."
swampwalkers.4.t:0 "Infested Wolves"
swampwalkers.4.d:0 "The green skins rid upon huge four-legged creatures known as wolves. We should infest these mobile creatures’ corpses to do the bidding of the swamp lord."
swampwalkers.4.option.1:0 "The swamp thrives!"
swampwalkers.5.t:0 "Night Stalkers"
swampwalkers.5.d:0 "The green skins cannot see well at night and our often less in numbers. Night Stalkers will follow the few green skins in the swamp at night and make sure they never see day again."
swampwalkers.5.option.1:0 "The swamp thrives!"
swampwalkers.6.t:0 "Fen Lurkers"
swampwalkers.6.d:0 "The elusive Fen Lurkers, camouflaged amidst the twisting vines and foliage-laden trees, lie in wait for unsuspecting prey. With their cunning and patient nature, they ensnare and entangle any unfortunate victim who ventures too near, their grip as tenacious as the very roots that bind them."
swampwalkers.6.option.1:0 "The swamp thrives!"
swampwalkers.7.t:0 "Swamp Lurkers"
swampwalkers.7.d:0 "Nestled within the murky depths of the swamp's shadowed pools, the elusive Swamp Lurkers lie in patient concealment. With uncanny precision, they emerge, their movements silent and swift, to ensnare the unsuspecting green-skinned intruders. Like vengeful phantoms, they strike without warning or mercy, engulfing their victims before a flicker of suspicion can take hold."
swampwalkers.7.option.1:0 "They will fear us."
swampwalkers.8.t:0 "The Call from Below"
swampwalkers.8.d:0 "A dark voice calls to us deep from within the murky waters of the swamp. It has empowered us with dark magics and soon all will fall beneath the voices will."
swampwalkers.8.option.1:0 "Obey the voices commands."
swampwalkers.9.t:0 "The Marsh Rises!"
swampwalkers.9.d:0 "The Bleeding Hollow Clan has failed at their task of dealing with the tree abominations, and now its out turn to clear up their mess, less we suffer the same fate as them."
swampwalkers.9.option.1:0 "For The Horde!"

swampwalkers.10.t:0 "The Jungle Groans"
swampwalkers.10.d:0 "The Jungle has awoken, it can feel the old wounds healing, the trolls will be assimilated or will nourish the lands as all flesh creatures should."
swampwalkers.10.option.1:0 "We will guide the jungles"
swampwalkers.10.option.2:0 "They know what is best"

swampwalkers.12.t:0 "Rumble in the Jungle"
swampwalkers.12.d:0 "The Trolls seek to stop us, they missed their chance long ago when they watched us crush the humans."
swampwalkers.12.option.1:0 "They will feed the Jungle"

