TSW_restore_the_east_lands:0 "Restore the East Lands"
TSW_restore_the_east_lands_desc:0 "The east of the swamp is now back under our control and it is time we mend the damage that has been done to it."
TSW_the_sunken_temple:0 "The Sunken Temple"
TSW_the_sunken_temple_desc:0 ""

TSW_consume_the_temple:0 "Consume the Temple"
TSW_consume_the_temple_desc:0 "Nestled amidst the heart of the foreboding swamp, an ancient temple stands as a haunting testament of ages past. Once revered, it now lies partially submerged, its weathered walls bearing witness the ever-changing nature of the swamp. Once defiled by the presence of trolls and green dragons, we have wrested control over it, driving out the intruders."

TSW_infest_dragons:0 "Infest the Dragons"
TSW_infest_dragons_desc:0 "Within the hallowed halls of the ancient temple, majestic and formidable green dragons hold sway, their presence commanding both awe and reverence. The prospect of harnessing the power of these mighty beings presents an opportunity of immense potential."

TSW_infest_the_blue_skins:0 "Infest the Blue Skins"
TSW_infest_the_blue_skins_desc:0 "The blue skinned trolls that inhabit the temple are numerous and constitute a wellspring of untapped potential. By assimilating their abundant ranks and delving into the depths of their intricate knowledge, we will grow in power."

TSW_drive_out_the_green_skins:0 "Drive out the Green Skins"
TSW_drive_out_the_green_skins_desc:0 "Long before the arrival of the green skins, the once-pristine southern region, now desecrated as the Blasted Lands, flourished as the majestic Black Morass, an integral part of our sacred swamp. With the main part of the swamp now back under our control, we shall now purge the south of the presence of the orcs and reclaim the Black Morass."

TSW_restore_order_to_the_black_morass:0 "Restore Order to the Black Morass"
TSW_restore_order_to_the_black_morass_desc:0 "We now control the northern parts of the Blasted Lands and we witness the damage made to the land. We are already hard at work in spreading our roots and tendrils into the area and claiming it as our own, as it should be."

TSW_terraform_the_west:0 "Terraform the West"
TSW_terraform_the_west_desc:0 "As the swamp now start slowly spreading into the Blasted Lands, we can continue furthering our goals deeper into the region, terraforming it back to its original shape."

TSW_terraform_the_coastline:0 "Terraform the Coastline"
TSW_terraform_the_coastline_desc:0 "The coastline of the Black Morass was not too much unlike the shores of the Swamp of Sorrows, with the control regained over them, we can finally give it back the life it once had."

TSW_terraform_the_south:0 "Terraform the South"
TSW_terraform_the_south_desc:0 "The southern part the Blasted Lands have luckily not been damaged as much as the rest, but work still need to be done to drive away the tainted corruption brought by the orcs that still wither the land."

TSW_terraform_the_dark_portal:0 "Terraform the Dark Portal"
TSW_terraform_the_dark_portal_desc:0 "The Dark Portal stands tall as a spot of corruption in the middle of the Blasted Lands, this is apparently where the orcs came from. We must spread the swamp to its surrounding in order to get complete control over the portal."

TSW_spread_to_azeroth:0 "Spread to Azeroth"
TSW_spread_to_azeroth_desc:0 "With the Black Morass gloriously restored, the resplendence of our sacred swamp and our very essence flourishes anew. Yet, this monumental achievement has unveiled the stark reality that countless voracious creatures lurk beyond our realm, willing to come here and destroy everything. We, the guardians of this ethereal domain, must rise to make sure the swamp remains untouched."

TSW_the_deep_growths:0 "The Deep Growths"
TSW_the_deep_growths_desc:0 "Long have the trolls bent the jungles will to their own, the loas power keep them docile, but the creatures of the land a free of their influence."

