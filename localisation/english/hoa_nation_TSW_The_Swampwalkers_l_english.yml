TSW_reclaim_the_swamp:0 "Reclaim the Swamp"
TSW_reclaim_the_swamp_desc:0 "These green skins were nothing but the first. To the east we have felt more of them harming the swamp. We shall consume them just as we did with their kin and reclaim the swamp!"

