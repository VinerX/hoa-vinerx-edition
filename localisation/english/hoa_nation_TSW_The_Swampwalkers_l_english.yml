TSW_spread_to_draenor:0 "Spread to Draenor"
TSW_spread_to_draenor_desc:0 "If the green skins came to us through the portal, maybe we can come to them...?"

TSW_further_infestation:0 "Further Infestation"
TSW_further_infestation_desc:0 "As we keep fighting the green skins, more of them fall to us in combat, meaning more of them to infest and bolster our ranks..."

TSW_infest_ogres:0 "Infest Ogres"
TSW_infest_ogres_desc:0 "With the green skins fight large grotesque creatures known as ogres. While they seem less intelligent than the orcs, they possess great strength that could be of great use."

TSW_infested_rylaks:0 "Infest Rylaks"
TSW_infested_rylaks_desc:0 "The green skins brought with them strange flying beasts that our kin have never seen before on Azeroth. They use these 'rylaks' as mount during battle to harass us from the skies. Infesting such beasts could allow use to not only fight on land, but also in the air."

TSW_new_life_blooms:0 "New Life Blooms"
TSW_new_life_blooms_desc:0 ""
TSW_choking_clouds:0 "Choking Clouds"
TSW_choking_clouds_desc:0 ""

TSW_infest_warlocks:0 "Infest Warlocks"
TSW_infest_warlocks_desc:0 "Some of the green skins wield strange magic that is not unlike the one felt by our ancestors long ago. It is dark and corrupting but also very powerful, investigating it might be the key to defeating the orcs."

TSW_infest_the_pale:0 "Infest the Pale"
TSW_infest_the_pale_desc:0 "As we came to learn, not all of these green skins are actually green-skinned. A small portion of them are small withered pale creatures that fight with ferocity and deceit. They also harbor within them a strange essence that could be useful to our raincallers."

