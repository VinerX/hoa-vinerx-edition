l_english:
 # ----------------------------------------------------------
 # TIER 1: The Warchief Is Defied (0–19)
 # ----------------------------------------------------------
 horde_authority_defied:0 "Warchief Authority: The Warchief Is Defied"
 horde_authority_defied_desc:0 "Orgrim Doomhammer's orders are openly questioned. Clans pursue their own objectives, supply lines are contested, and the Horde is a mob of warriors rather than an army. Without a decisive display of strength, the coalition will splinter."

 # ----------------------------------------------------------
 # TIER 2: Contested Leadership (20–39)
 # ----------------------------------------------------------
 horde_authority_contested:0 "Warchief Authority: Contested Leadership"
 horde_authority_contested_desc:0 "The clans obey when it suits them, but Doomhammer's authority is fragile. Every defeat is magnified by whispered doubts, and ambitious chieftains test the limits of his patience."

 # ----------------------------------------------------------
 # TIER 3: Fragile Obedience (40–59)
 # ----------------------------------------------------------
 horde_authority_fragile:0 "Warchief Authority: Fragile Obedience"
 horde_authority_fragile_desc:0 "The clans acknowledge Doomhammer as Warchief and follow his commands, but their loyalty is born of necessity rather than conviction. A major setback could unravel this uneasy balance."

 # ----------------------------------------------------------
 # TIER 4: Recognized Warchief (60–79) — country-specific
 # ----------------------------------------------------------
 horde_authority_recognized_blackrock:0 "Recognized Warchief: Doomhammer Commands"
 horde_authority_recognized_blackrock_desc:0 "The Blackrock Clan has become the undisputed heart of the Horde. Doomhammer's authority flows through every chieftain, and his war plans are executed with precision and conviction."

 horde_authority_recognized_bleedinghollow:0 "Recognized Warchief: Kilrogg's Loyalty"
 horde_authority_recognized_bleedinghollow_desc:0 "The Bleeding Hollow fight with the savage discipline that has made Kilrogg's warriors feared across Draenor and Azeroth alike. Under a strong Warchief, they are the Horde's unbreakable veteran core."

 horde_authority_recognized_dragonmaw:0 "Recognized Warchief: Dragons Answer the Call"
 horde_authority_recognized_dragonmaw_desc:0 "The Dragonmaw Clan deploys its captured red dragons with devastating coordination. Under Doomhammer's command, their aerial supremacy becomes the Horde's greatest tactical advantage."

 horde_authority_recognized_stormreaver:0 "Recognized Warchief: Gul'dan Bides His Time"
 horde_authority_recognized_stormreaver_desc:0 "Gul'dan's warlocks serve the Horde — for now. The Stormreaver Clan's arcane power is a fearsome weapon, but every spell is cast under Doomhammer's watchful eye."

 horde_authority_recognized_twilighthammer:0 "Recognized Warchief: Twilight Marches"
 horde_authority_recognized_twilighthammer_desc:0 "The Twilight's Hammer follows the Horde into battle, their dark zealotry channeled by the Warchief's iron will. Their presence is an omen, but for now it serves the Horde's purpose."

 horde_authority_recognized_amani:0 "Recognized Warchief: Zul'jin's Pact"
 horde_authority_recognized_amani_desc:0 "The Amani fight alongside the Horde with growing trust. Zul'jin sees Doomhammer as a worthy ally — not a master, but a partner in the destruction of their common enemies."

 horde_authority_recognized_generic:0 "Recognized Warchief"
 horde_authority_recognized_generic_desc:0 "The clans obey Doomhammer's commands with growing respect. The Horde functions as more than a collection of warriors — it is becoming an army."

 # ----------------------------------------------------------
 # TIER 5: Will of the Horde (80–100) — country-specific
 # ----------------------------------------------------------
 horde_authority_will_blackrock:0 "Will of the Horde: The Doomhammer Falls"
 horde_authority_will_blackrock_desc:0 "Orgrim Doomhammer has forged the Horde into an unstoppable war machine. His word is law, his strategy is gospel, and every clan moves as an extension of his will. The Alliance has never faced anything like this."

 horde_authority_will_bleedinghollow:0 "Will of the Horde: Death Before Dishonor"
 horde_authority_will_bleedinghollow_desc:0 "The Bleeding Hollow have become the Horde's living legend. Kilrogg's warriors fight with a ferocity that borders on the supernatural — they are the Warchief's fist, and they do not stop until the enemy is broken."

 horde_authority_will_dragonmaw:0 "Will of the Horde: Skies Ablaze"
 horde_authority_will_dragonmaw_desc:0 "The Dragonmaw Clan has mastered the red dragonflight. Their aerial dominance is absolute — no Alliance formation can hold, no fortress can withstand, no retreat is safe under the shadow of Horde dragons."

 horde_authority_will_stormreaver:0 "Will of the Horde: The Warlock's Gambit"
 horde_authority_will_stormreaver_desc:0 "Gul'dan's warlocks commit their full power to the Horde's war effort — for now. The Stormreaver war machine is a terrifying fusion of orcish brutality and demonic sorcery."

 horde_authority_will_twilighthammer:0 "Will of the Horde: The Hour Grows Late"
 horde_authority_will_twilighthammer_desc:0 "The Twilight's Hammer serves Doomhammer with fanatical devotion. Their dark rituals empower the Horde's advance, and their presence on the battlefield demoralizes even the bravest Alliance soldiers."

 horde_authority_will_amani:0 "Will of the Horde: Forest Lords Unchained"
 horde_authority_will_amani_desc:0 "The Amani Tribe has become the Horde's masters of the northern forests. Zul'jin's trolls coordinate seamlessly with orcish warbands, and the elven borderlands have become a killing ground."

 horde_authority_will_generic:0 "Will of the Horde"
 horde_authority_will_generic_desc:0 "The Horde fights as a single entity, each clan a weapon in the Warchief's arsenal. Doomhammer's commands are absolute, and the combined might of the orcish race is unleashed without hesitation or restraint."

 # ----------------------------------------------------------
 # Timed ideas
 # ----------------------------------------------------------
 horde_authority_total_commitment:0 "Total Commitment"
 horde_authority_total_commitment_desc:0 "The Warchief has demanded everything. Every clan, every warrior, every resource is committed to a single overwhelming offensive. The Horde will either break the enemy or break itself trying."

 # ----------------------------------------------------------
 # Authority change events — titles, descriptions, options
 # ----------------------------------------------------------
 horde_authority_events.1.t:0 "A Clan Submits to the Warchief"
 horde_authority_events.1.d:0 "A clan has formally pledged its allegiance to Orgrim Doomhammer. Every new submission strengthens the Warchief's grip on the Horde and silences those who doubt his right to lead."
 horde_authority_events.1.a:0 "The Horde grows stronger."

 horde_authority_events.2.t:0 "A Clan Defies the Warchief"
 horde_authority_events.2.d:0 "A clan has openly refused to follow the Warchief's orders. The defiance is a wound to Doomhammer's authority — if one clan can refuse, others will test the limits of his patience."
 horde_authority_events.2.a:0 "They will learn obedience."

 horde_authority_events.3.t:0 "Gul'dan's Betrayal"
 horde_authority_events.3.d:0 "Gul'dan has abandoned the Horde, taking the Stormreaver and Twilight's Hammer clans with him in pursuit of the Tomb of Sargeras. The Warchief's authority has been dealt a devastating blow — the clans that remain watch and wait, uncertain whether Doomhammer can still command their loyalty."
 horde_authority_events.3.a:0 "I will tear his skull from his shoulders!"

 horde_authority_events.4.t:0 "Victory for the Horde!"
 horde_authority_events.4.d:0 "A major triumph has been won. The clans roar with approval, and even the most ambitious chieftains must acknowledge that Doomhammer's leadership brings results. Victory is the currency of authority."
 horde_authority_events.4.a:0 "Lok'tar ogar!"

 horde_authority_events.5.t:0 "A Stinging Defeat"
 horde_authority_events.5.d:0 "The Horde has suffered a significant setback. Grumbling spreads through the camps — the Warchief's plan has failed, and ambitious voices begin to wonder aloud whether another could do better."
 horde_authority_events.5.a:0 "We will recover. We always do."

 horde_authority_events.6.t:0 "The Warchief Commands: Total Commitment"
 horde_authority_events.6.d:0 "Doomhammer summons every chieftain and demands absolute commitment to a single, overwhelming offensive. The clans hesitate, then obey — the Warchief's authority is not yet something they dare to refuse."
 horde_authority_events.6.a:0 "Everything. Everyone. Now."

 horde_authority_events.7.t:0 "A Clan Deserts the Horde"
 horde_authority_events.7.d:0 "A clan has broken ranks and abandoned the Horde. The desertion sends shockwaves through the remaining clans — if the Warchief cannot keep his warriors together, how can he lead them to victory?"
 horde_authority_events.7.a:0 "Cowards will be dealt with. The Horde endures."

 horde_authority_events.8.t:0 "Crush the Dissenters"
 horde_authority_events.8.d:0 "Voices of defiance grow louder. Doomhammer must decide whether to make an example of the troublemakers or let the discontent fester."
 horde_authority_events.8.a:0 "Execute the loudest. The rest will learn."
 horde_authority_events.8.b:0 "Let them grumble. We have a war to fight."
