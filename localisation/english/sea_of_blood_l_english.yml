l_english:

 # ============================================================
 # DECISION CATEGORY
 # ============================================================
 sea_of_blood:0 "Sea of Blood"
 sea_of_blood_desc:0 "The maritime struggle between the Alliance and Horde for control of the Great Sea. Ten strategic islands form the chain between Kul Tiras and the Eastern Kingdoms — whoever commands them commands the sea lanes."

 # ============================================================
 # STATISTICS — faction island count (decorative, top of panel)
 # ============================================================

 # Alliance stats
 sob_stats_alliance_0_2:0 "§BAlliance Islands: 0–2/10§!"
 sob_stats_alliance_0_2_desc:0 "The Alliance holds a minimal foothold in the island chain. Our fleet cannot project power across the Great Sea.\n\nCheck National Spirits for full maritime control effects."
 sob_stats_alliance_3_4:0 "§BAlliance Islands: 3–4/10§!"
 sob_stats_alliance_3_4_desc:0 "The Alliance holds a modest position in the island chain. The fleet can operate, but control of the sea lanes is not yet assured.\n\nCheck National Spirits for full maritime control effects."
 sob_stats_alliance_5_6:0 "§BAlliance Islands: 5–6/10§!"
 sob_stats_alliance_5_6_desc:0 "The Alliance holds a strong position in the island chain. Our forward bases support regular naval patrols and the fleet moves with growing confidence.\n\nCheck National Spirits for full maritime control effects."
 sob_stats_alliance_7_8:0 "§BAlliance Islands: 7–8/10§!"
 sob_stats_alliance_7_8_desc:0 "The Alliance commands the majority of the island chain. Horde shipping is interdicted and our naval dominance is near-total.\n\nCheck National Spirits for full maritime control effects."
 sob_stats_alliance_9_10:0 "§BAlliance Islands: 9–10/10§!"
 sob_stats_alliance_9_10_desc:0 "The Alliance holds total command of the Sea of Blood. The Horde has been swept from the waves.\n\nCheck National Spirits for full maritime control effects."

 # Horde stats
 sob_stats_horde_0_2:0 "§RHorde Islands: 0–2/10§!"
 sob_stats_horde_0_2_desc:0 "The Horde holds a minimal foothold in the island chain. Our fleet cannot challenge Alliance dominance at sea.\n\nCheck National Spirits for full maritime control effects."
 sob_stats_horde_3_4:0 "§RHorde Islands: 3–4/10§!"
 sob_stats_horde_3_4_desc:0 "The Horde holds a modest position in the island chain. Forward bases allow limited operations, but the sea remains contested.\n\nCheck National Spirits for full maritime control effects."
 sob_stats_horde_5_6:0 "§RHorde Islands: 5–6/10§!"
 sob_stats_horde_5_6_desc:0 "The Horde holds a strong position in the island chain. Our raiders strike deep into Alliance waters and the northern sea lane beckons.\n\nCheck National Spirits for full maritime control effects."
 sob_stats_horde_7_8:0 "§RHorde Islands: 7–8/10§!"
 sob_stats_horde_7_8_desc:0 "The Horde commands the majority of the island chain. Alliance shipping is in chaos and our fleet dictates the tempo of the war at sea.\n\nCheck National Spirits for full maritime control effects."
 sob_stats_horde_9_10:0 "§RHorde Islands: 9–10/10§!"
 sob_stats_horde_9_10_desc:0 "The Horde holds total command of the Sea of Blood. The Alliance fleet is shattered.\n\nCheck National Spirits for full maritime control effects."

 # ============================================================
 # ISLAND STATUSES — decorative decisions
 # Alliance = §B, Horde = §R, Contested = §Y
 # ============================================================

 # Tol Barad
 sob_tol_barad_alliance:0 "§BTol Barad — Alliance§!"
 sob_tol_barad_alliance_desc:0 "Tol Barad serves as a strategic fortress, its high walls and deep anchorage providing a forward base for fleet operations. Island role: Strategic Fortress."
 sob_tol_barad_horde:0 "§RTol Barad — Horde§!"
 sob_tol_barad_horde_desc:0 "The fortress island of Tol Barad is under Horde control, its oil refineries burning to fuel the war machine. Island role: Strategic Fortress."
 sob_tol_barad_contested:0 "§YTol Barad — Uncontested§!"
 sob_tol_barad_contested_desc:0 "Tol Barad lies beyond the reach of either faction — its fortress walls silent, its oil fields idle. Island role: Strategic Fortress."

 # Crestfall
 sob_crestfall_alliance:0 "§BCrestfall — Alliance§!"
 sob_crestfall_alliance_desc:0 "Crestfall's sheltered harbour serves as a forward staging point for Alliance naval operations. Island role: Forward Naval Base."
 sob_crestfall_horde:0 "§RCrestfall — Horde§!"
 sob_crestfall_horde_desc:0 "Crestfall's harbour now launches Horde raiding parties into Alliance shipping lanes. Island role: Forward Naval Base."
 sob_crestfall_contested:0 "§YCrestfall — Uncontested§!"
 sob_crestfall_contested_desc:0 "The harbour at Crestfall lies empty — no banners fly over its docks. Island role: Forward Naval Base."

 # Zul'Dare
 sob_zuldare_alliance:0 "§BZul'Dare — Alliance§!"
 sob_zuldare_alliance_desc:0 "Zul'Dare's natural deep-water anchorage serves the Alliance fleet as a repair and resupply station. Island role: Naval Anchorage."
 sob_zuldare_horde:0 "§RZul'Dare — Horde§!"
 sob_zuldare_horde_desc:0 "Zul'Dare has become a vital Horde anchorage — its deep waters shelter the fleet between raids. Island role: Naval Anchorage."
 sob_zuldare_contested:0 "§YZul'Dare — Uncontested§!"
 sob_zuldare_contested_desc:0 "The anchorage at Zul'Dare sits unused — its deep waters hold no ships. Island role: Naval Anchorage."

 # Purgation Isle
 sob_purgation_alliance:0 "§BPurgation Isle — Alliance§!"
 sob_purgation_alliance_desc:0 "Purgation Isle's remote location provides a minor Alliance outpost in the island chain."
 sob_purgation_horde:0 "§RPurgation Isle — Horde§!"
 sob_purgation_horde_desc:0 "Purgation Isle has fallen to the Horde — another link in the island chain severed."
 sob_purgation_contested:0 "§YPurgation Isle — Uncontested§!"
 sob_purgation_contested_desc:0 "Purgation Isle remains unclaimed — a small, windswept rock in the Great Sea."

 # Channel Island
 sob_channel_alliance:0 "§BChannel Island — Alliance§!"
 sob_channel_alliance_desc:0 "Channel Island watches over the sea lane approaches to Kul Tiras."
 sob_channel_horde:0 "§RChannel Island — Horde§!"
 sob_channel_horde_desc:0 "Channel Island now provides the Horde a forward vantage point near Kul Tiran waters."
 sob_channel_contested:0 "§YChannel Island — Uncontested§!"
 sob_channel_contested_desc:0 "Channel Island's watchpost is abandoned — no one claims this wind-swept rock."

 # Balor
 sob_balor_alliance:0 "§BBalor — Alliance§!"
 sob_balor_alliance_desc:0 "Balor secures the southern approach through the Great Sea, providing a waypoint for Alliance convoys. Island role: Southern Route."
 sob_balor_horde:0 "§RBalor — Horde§!"
 sob_balor_horde_desc:0 "The southern sea route lies under Horde control — Balor's position threatens Alliance shipping along Stranglethorn. Island role: Southern Route."
 sob_balor_contested:0 "§YBalor — Uncontested§!"
 sob_balor_contested_desc:0 "The island of Balor is uncontrolled — the southern route remains open but undefended. Island role: Southern Route."

 # The Bite
 sob_bite_alliance:0 "§BThe Bite — Alliance§!"
 sob_bite_alliance_desc:0 "The Bite guards the northern approach into the Sea of Blood, its shoals a natural barrier. Island role: Northern Approach."
 sob_bite_horde:0 "§RThe Bite — Horde§!"
 sob_bite_horde_desc:0 "The Bite has fallen — the Horde now threatens the northern sea lane into Lordaeron waters. Island role: Northern Approach."
 sob_bite_contested:0 "§YThe Bite — Uncontested§!"
 sob_bite_contested_desc:0 "The Bite lies silent — its jagged coastline watches over empty waters. Island role: Northern Approach."

 # Tol Dagor
 sob_tol_dagor_alliance:0 "§BTol Dagor — Alliance§!"
 sob_tol_dagor_alliance_desc:0 "Tol Dagor's prison-fortress houses the enemies of the Alliance, its heavy winds making approach treacherous for the unwary. Island role: Prison Fortress."
 sob_tol_dagor_horde:0 "§RTol Dagor — Horde§!"
 sob_tol_dagor_horde_desc:0 "Tol Dagor has fallen — the Horde now controls its prison-fortress and the oil-rich approaches to Kul Tiras. Island role: Prison Fortress."
 sob_tol_dagor_contested:0 "§YTol Dagor — Uncontested§!"
 sob_tol_dagor_contested_desc:0 "Tol Dagor's prison stands empty, its heavy winds keeping even the boldest captains at bay. Island role: Prison Fortress."

 # Misty Isle
 sob_misty_isle_alliance:0 "§BMisty Isle — Alliance§!"
 sob_misty_isle_alliance_desc:0 "The Misty Isle has been secured — its high cliffs and dragon roosts now serve the Alliance fleet as an observation post overlooking the northern Great Sea. Island role: Aerial Outpost."
 sob_misty_isle_horde:0 "§RMisty Isle — Horde§!"
 sob_misty_isle_horde_desc:0 "The Misty Isle serves as a Dragonmaw stronghold — red dragons launch from its cliffs to scour the waves of Alliance ships. Island role: Aerial Outpost."
 sob_misty_isle_contested:0 "§YMisty Isle — Uncontested§!"
 sob_misty_isle_contested_desc:0 "The Misty Isle's peaks are wreathed in cloud — no banners fly over its dragon roosts. Island role: Aerial Outpost."

 # HighBank
 sob_highbank_alliance:0 "§BHighBank — Alliance§!"
 sob_highbank_alliance_desc:0 "HighBank's formidable coastal fortress has been wrested from the Horde — its deep-water naval base now shelters the Alliance fleet in the northern reaches. Island role: Coastal Fortress."
 sob_highbank_horde:0 "§RHighBank — Horde§!"
 sob_highbank_horde_desc:0 "HighBank's coastal fortress dominates the northern approach — the Horde fleet uses its deep harbour as a springboard against Lordaeron's shores. Island role: Coastal Fortress."
 sob_highbank_contested:0 "§YHighBank — Uncontested§!"
 sob_highbank_contested_desc:0 "HighBank's coastal fortress stands abandoned — its naval base silent, its watchtowers empty. Island role: Coastal Fortress."

 # ============================================================
 # ALLIANCE MISSIONS
 # ============================================================
 sob_alliance_secure_foothold:0 "Secure a Foothold"
 sob_alliance_secure_foothold_desc:0 "The Alliance must establish control over at least four of the ten strategic islands to begin projecting naval power across the Sea of Blood."
 sob_alliance_foothold_reward_tt:0 "The Alliance has secured its foothold in the Sea of Blood. Our island network is now operational.\n§GEffect:§!\n• Alliance Unity: +10"

 sob_alliance_command_sea:0 "Command of the Sea"
 sob_alliance_command_sea_desc:0 "With eight or more islands under Alliance control, we can claim dominance over the entire Sea of Blood and deny the Horde any maritime option."
 sob_alliance_command_reward_tt:0 "The Alliance commands the Sea of Blood. Horde naval operations are crippled, and the northern approach is sealed.\n§GEffect:§!\n• Alliance Unity: +20"

 # ============================================================
 # HORDE MISSIONS
 # ============================================================
 sob_horde_break_chain:0 "Break the Island Chain"
 sob_horde_break_chain_desc:0 "The Kul Tiran island chain blocks our path north. Seize at least five of the strategic islands to shatter Alliance naval dominance."
 sob_horde_break_chain_reward_tt:0 "The island chain is broken! The northern sea lane opens before the Horde.\n§GEffect:§!\n• Warchief Authority: +15"

 sob_horde_command_sea:0 "Rule the Sea of Blood"
 sob_horde_command_sea_desc:0 "With eight islands under Horde control, the Sea of Blood becomes a Horde lake — the Alliance fleets are swept aside."
 sob_horde_command_reward_tt:0 "The Sea of Blood belongs to the Horde. Alliance naval power is shattered.\n§GEffect:§!\n• Warchief Authority: +20"

 # ============================================================
 # SPECIAL OPERATIONS
 # ============================================================
 sob_horde_dragon_strike:0 "Unleash the Red Dragons"
 sob_horde_dragon_strike_desc:0 "Order the Dragonmaw Clan to deploy their red dragons against Alliance shipping. The seas shall burn."
 sob_dragon_strike_effect_tt:0 "Red dragons take to the skies above the Great Sea. Alliance convoys scatter in panic.\n§GEffect:§!\n• Warchief Authority: -8\n• Gain Dragonfire Raids spirit (90 days)\n  - Naval Strike Attack: +15%\n  - Convoy Raiding Efficiency: +20%"

 sob_alliance_amphibious:0 "Kul Tiran Amphibious Offensive"
 sob_alliance_amphibious_desc:0 "With control of the seas, the Kul Tiran marines can launch a decisive amphibious assault against Horde-held shores."
 sob_amphibious_effect_tt:0 "The Kul Tiran fleet sails to war — marines board landing craft, the shore batteries are silenced.\n§GEffect:§!\n• Gain Amphibious Offensive spirit (60 days)\n  - Naval Invasion Speed: +25%\n  - Invasion Defence: +15%\n  - Navy Organization: +10%"

 # ============================================================
 # EVENTS
 # ============================================================
 sea_of_blood.1.t:0 "Sea of Blood"
 sea_of_blood.1.d:0 "Monthly maritime control update."
 sea_of_blood.1.option.1:0 "OK"

 sea_of_blood.2.t:0 "Sea of Blood — Shift in Maritime Control"
 sea_of_blood.2.d:0 "The balance of power in the Sea of Blood has shifted. The island chain changes hands, and with it the fate of the war at sea."
 sea_of_blood.2.option.1:0 "Inform the Admiralty"

 sea_of_blood.3.t:0 "Sea Lanes Under Threat"
 sea_of_blood.3.d:0 "The Alliance is losing its grip on the Sea of Blood. Key islands have fallen to the Horde, and our naval operations are suffering."
 sea_of_blood.3.option.1:0 "We must reclaim the sea"

 sea_of_blood.4.t:0 "The Seas Are Ours"
 sea_of_blood.4.d:0 "The Horde tightens its grip on the Sea of Blood. Alliance shipping lanes are in chaos, and the path north lies open."
 sea_of_blood.4.option.1:0 "Lok'tar ogar!"

 # ============================================================
 # SEA OF BLOOD TIER SPIRITS
 # ============================================================

 # Alliance tiers
 soa_alliance_disputed:0 "Disputed Sea Lanes"
 soa_alliance_disputed_desc:0 "The Alliance holds two or fewer island outposts. Our ships face enemy dominance at every crossing — naval invasions are near-impossible without overwhelming force."
 soa_alliance_weak:0 "Weak Maritime Presence"
 soa_alliance_weak_desc:0 "Only three island outposts remain under Alliance control. The fleet can still operate, but every sortie is a gamble across contested waters."
 soa_alliance_contested:0 "Contested Waters"
 soa_alliance_contested_desc:0 "Four islands are under Alliance control — the island chain is split and neither side holds a decisive advantage at sea."
 soa_alliance_advantage:0 "Limited Maritime Advantage"
 soa_alliance_advantage_desc:0 "The Alliance controls five of the ten strategic islands. Kul Tiran patrols now operate from a working network of forward bases."
 soa_alliance_initiative:0 "Maritime Initiative"
 soa_alliance_initiative_desc:0 "Six or seven islands fly the Alliance banner. The fleet dictates the tempo of naval operations, intercepting Horde movements before they reach open water."
 soa_alliance_command:0 "Command of the Sea of Blood"
 soa_alliance_command_desc:0 "Eight or nine islands — the Horde clings to the margins. The Alliance fleet moves at will, and enemy shipping flees before our guns."
 soa_alliance_total:0 "Total Maritime Control"
 soa_alliance_total_desc:0 "Every island in the Sea of Blood is under Alliance control. The Horde has no foothold at sea — their fleets are trapped in port."

 # Horde tiers
 soa_horde_disputed:0 "Disputed Sea Lanes"
 soa_horde_disputed_desc:0 "The Horde holds two or fewer island outposts. Our fleet cannot contest Alliance dominance — naval invasions are suicidal without a miracle."
 soa_horde_weak:0 "Weak Maritime Presence"
 soa_horde_weak_desc:0 "Only three island outposts remain under Horde control. The fleet can still operate, but every crossing is a desperate gamble."
 soa_horde_contested:0 "Contested Waters"
 soa_horde_contested_desc:0 "Four islands are under Horde control — the island chain is split and neither side holds a decisive advantage at sea."
 soa_horde_advantage:0 "Limited Maritime Advantage"
 soa_horde_advantage_desc:0 "The Horde controls five of the ten strategic islands. Forward bases now support our raiders and threaten Alliance supply lines."
 soa_horde_initiative:0 "Maritime Initiative"
 soa_horde_initiative_desc:0 "Six or seven islands fly the Horde banner. Our fleet strikes where it chooses, and Alliance captains fear to leave port."
 soa_horde_command:0 "Command of the Sea of Blood"
 soa_horde_command_desc:0 "Eight or nine islands — the Alliance clings to the margins. The northern sea lane lies open, and nothing stands between our fleet and Lordaeron's shores."
 soa_horde_total:0 "Total Maritime Control"
 soa_horde_total_desc:0 "Every island in the Sea of Blood kneels before the Horde. The Alliance fleet is shattered — their ports burn, their convoys sink, their shores lie naked."

 # ============================================================
 # LOCAL ISLAND BONUS IDEAS
 # ============================================================
 soa_island_tol_barad:0 "Tol Barad Fortress"
 soa_island_tol_barad_desc:0 "The fortress island of Tol Barad provides unmatched surveillance of the Great Sea and strengthens our coastal defences."
 soa_island_crestfall:0 "Crestfall Forward Base"
 soa_island_crestfall_desc:0 "Crestfall's deep harbour serves as a staging ground for amphibious operations."
 soa_island_zuldare_alliance:0 "Zul'Dare Anchorage"
 soa_island_zuldare_alliance_desc:0 "Zul'Dare's sheltered waters serve as a repair station for Alliance warships."
 soa_island_zuldare_horde:0 "Zul'Dare Anchorage"
 soa_island_zuldare_horde_desc:0 "Zul'Dare's deep anchorage shelters the Horde fleet and launches constant raids against Alliance shipping."
 soa_island_balor:0 "Balor — Southern Route"
 soa_island_balor_desc:0 "Balor controls the southern sea approach. Convoys move safely through these waters and our fleet can range further afield."

 soa_island_tol_dagor:0 "Tol Dagor Prison Fortress"
 soa_island_tol_dagor_desc:0 "Tol Dagor's prison-fortress houses captives whose intelligence proves invaluable, while its heavy winds shield the island from approach."
 soa_island_misty_isle_alliance:0 "Misty Isle Aerial Outpost"
 soa_island_misty_isle_alliance_desc:0 "The high peaks of the Misty Isle serve as a forward airbase — our gryphon riders and bombers range over the northern Great Sea."
 soa_island_misty_isle_horde:0 "Misty Isle Dragon Roosts"
 soa_island_misty_isle_horde_desc:0 "Red dragons launch from the Misty Isle's cliffs, raining fire on Alliance shipping and sweeping the skies clear of enemy aircraft."
 soa_island_highbank_alliance:0 "HighBank Coastal Fortress"
 soa_island_highbank_alliance_desc:0 "HighBank's formidable fortifications shield our coastal operations from Horde bombardment and make any amphibious assault a costly prospect."
 soa_island_highbank_horde:0 "HighBank Coastal Fortress"
 soa_island_highbank_horde_desc:0 "HighBank's fortress walls repel Alliance shore bombardment and protect the Horde's northern beachhead."

 # ============================================================
 # SPECIAL OPERATION SPIRITS
 # ============================================================
 soa_dragonfire_raids:0 "Dragonfire Raids"
 soa_dragonfire_raids_desc:0 "Red dragons sweep the sea lanes, setting Alliance ships ablaze and scattering their convoys in panic."
 soa_kul_tiran_amphibious:0 "Kul Tiran Amphibious Offensive"
 soa_kul_tiran_amphibious_desc:0 "The full might of the Kul Tiran marine force has been committed — landing craft swarm the shores under covering fire from the Grand Fleet."
