ZAN_Rastakhans_Iron_Fist:0 "Rastakhan's Iron Fist"
ZAN_Rastakhans_Iron_Fist_desc:0 "God-King Rastakhan has a strong iron grip on his empire and it is rare that the trolls question his laws, thus his regime goes unquestioned by most."
ZAN_Golden_Fleet:0 "The Golden Fleet of Zandalar"
ZAN_Golden_Fleet_desc:0 "The Golden Fleet is one of the oldest and largest navies in the whole of Azeroth. It often goes unchallenged at seas simply due to its sheer might. At least thats what Zandalar likes to think."
