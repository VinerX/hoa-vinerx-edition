MLC_majordomo_executus:0 "Majordomo Executus"
POLITICS_MAJORDOMO_EXECUTUS_DESC:0 "As the Majordomo of Ragnaros’ Forces, he stands at the top of the Elemental Hierarchy just beneath Ragnaros. He is an extremely powerful flamewalker that proved to be nearly invincible in the battles within the Elemental Plane. \nAs the Majordomo of the Firelands, he commands the Molten Core and is the one in charge of the Runes of Warding."
MLC_shazzrah:0 "Shazzrah"

POLITICS_RAGNAROS_DESC:0 "Ragnaros the Firelord was the incredibly powerful Elemental Lord of Fire. After being summoned to Azeroth by Sorcerer-Thane Thaurissan, he took control of Blackrock Mountain and ruled there for more than two hundred years over his minions from deep inside its fiery core. Banished back to the Firelands, he aligned himself with Deathwing and Al'Akir in the effort to bring about the Hour of Twilight. Ragnaros laid siege to the sacred Mount Hyjal in an attempt to incinerate the World Tree Nordrassil, unleashing his most powerful minions in the process. Despite the incredible destructive forces at his disposal, the Cenarion Circle aided by mortal champions of Azeroth were able to lay siege to the Firelord's domain, where they bested all of the challenges he laid before them and eventually destroyed him within his own fortress. Years after his death, he was replaced as Firelord by Smolderon. Ragnaros was known to be seconded by a Majordomo."
