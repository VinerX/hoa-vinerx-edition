MLC_Infernal_Rebirth:0 "Infernal Rebirth"
MLC_Infernal_Rebirth_desc:0 "The Molten Core has been dormant for too long. It is time that Ragnaros awakened and claimed dominion over the lands"

MLC_Mobilize_Troops:0 "Mobilize Forces"
MLC_Mobilize_Troops_desc:0 "Begin mobilizing our forces. It's time for a new era in the world of Azeroth"

MLC_Melt_The_Ice:0 "Melt The Ice"
MLC_Melt_The_Ice_desc:0 "Our first target will be the Frostmane Tribe to our north. They will not stand in the way of Ragnaros, the Fire Lord"

MLC_Awake_The_Beast:0 "Awake The Beast"
MLC_Awake_The_Beast_desc:0 "It is time to get our industry online"

MLC_Soothe_The_Fire:0 "Soothe The Fire"
MLC_Soothe_The_Fire_desc:0 "Ragnaros has awoken. The world has changed very much since his last awakening. Perhaps, it's best to test the waters"

MLC_Fight_To_Blackrock:0 "Fight to Blackrock"
MLC_Fight_To_Blackrock_desc:0 "The Dark Iron Dwarves have served their purpose. It's time to prepare our forces to march on Blackrock"

MLC_Smolderon:0 "Elemental Lord Smolderon"
MLC_Smolderon_desc:0 "Ragnaros has grown weak. It's time new management took over control"

MLC_The_Dark_Path:0 "The Dark Path"
MLC_The_Dark_Path:0 "With Ragnaros and anyone else that could threaten Smolderon out of the way, it's time to get to work"

MLC_There_Can_Be_Only_One:0 "There Can Be Only One"
MLC_There_Can_Be_Only_One_desc:0 "The Blackrock Clan currently controls Blackrock Mountain. It's time to change that"

MLC_King_of_the_Hill:0 "King of the Hill"
MLC_King_of_the_Hill_desc:0 "Our forces are in position. It's time to take Blackrock Mountain"

MLC_Hail_to_the_King:0 "Hail to the King"
MLC_Hail_to_the_King_desc:0 "Blackrock Mountain is now under our control"

###############################
#events
###############################

moltencore.1.t:0 "Infernal Rebirth"
moltencore.1.d:0 "The Molten Core lies at the very bottom of Blackrock Depths. It is the heart of Blackrock Mountain and the exact spot where, long ago in a desperate bid to turn the tide of the dwarven civil war, Emperor Thaurissan summoned the elemental Firelord, Ragnaros, into the world. Though the firelord is incapable of straying far from the blazing Core, it is believed that his elemental minions command the Dark Iron dwarves, who are in the midst of creating armies out of living stone. The burning lake where Ragnaros lies sleeping acts as a rift connecting to the plane of fire, allowing the malicious elementals to pass through. Chief among Ragnaros' agents is Majordomo Executus - for this cunning elemental is the only one capable of calling the Firelord from his slumber."
moltencore.1.option.1:0 "Summon Fire Lord Ragnaros"

