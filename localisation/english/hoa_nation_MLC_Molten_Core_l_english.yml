MLC_Legacy_Of_Ragnaros:0 "The Firelord's Legacy"
MLC_Legacy_Of_Ragnaros_desc:0 "Ragnaros the Firelord has held a strong legacy over the Molten Core and Dark Iron Dwarves as a whole. Shaping much of the land all together."
