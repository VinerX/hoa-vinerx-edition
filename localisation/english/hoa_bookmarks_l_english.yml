 #########################
 # Rise of the Horde (581)
 #########################
 RISE_OF_THE_HORDE_NAME:0 "Rise Of The Horde"
 RISE_OF_THE_HORDE_DESC:0 "Thirteen thousand years ago, the Fallen Titan Sargeras contacted the Eredar on Argus, offering them power in exchange for their service. While Archimonde and Kil’jaeden accepted, the third leader, Velen, had a vision revealing Sargeras’ true plan. Velen rallied his followers and fled Argus, becoming the Draenei. In response, Kil’jaeden, feeling betrayed, hunted the Draenei across the stars, forcing them to abandon several planets. \n\nRecently, one of Kil’jaeden’s scouts discovered the Draenei on a planet named Draenor, where they had lived peacefully among other races for 200 years. Knowing the Draenei will flee if the Burning Legion arrives, Kil’jaeden believes he can manipulate the Orc clans into rallying against the Draenei, allowing him to finally have his revenge."

 DRE_RISE_OF_THE_HORDE_DESC:0 "Having arrived on Draenor over 200 years ago aboard the Genedar the Draenei faced the unfortunate destruction of their last Naaru fortress. With their last ship destroyed, the Draenei knew they could not flee if Kil'jaeden were to find them. They have since fostered good relations with the other races on Draenor, knowing that one day they may have to stand together against the Burning Legion."

 BRC_RISE_OF_THE_HORDE_DESC:0 "The Blackrock clan stands unrivaled as the most industrious and formidable Orc clan on Draenor. Under the iron-fisted rule of the mighty warlord Blackhand, they have amassed unparalleled industrial might and military prowess. Driven by ambitions of conquest, the Blackrock orcs tirelessly wage war against the formidable Gronn and cunning Ogres of Gorgrond. Their goal extends beyond mere domination; they aim to secure absolute control over the region's vast resources  and solidify the Blackrock clan's supremacy in Gorgrond, setting the stage for their influence to extend across the entirety of Draenor."

 SMC_RISE_OF_THE_HORDE_DESC:0 "The Shadowmoon Clan serves as the spiritual leaders of the orcish people, renowned for their deep connection with the elemental furies. Their leader Ner'zhul is revered as the greatest Shaman on Draenor and is considered the closest thing his people have to a unified leader. Recently, however, Ner'zhul has been consumed by sorrow over the death of his mate, Rulkan, spending much of his time communicating with the spirits and seeking their guidance for the future of  his people."

 FWC_RISE_OF_THE_HORDE_DESC:0 "Led by Garad, the Frostwolves stand as the dominant Orc clan in Frostfire Ridge. Despite Garad's oldest son abandoning the Frostwolves to join their rival, the Thunderlord clan, where he quickly ascended to Chieftain Garad remains committed to redeeming himself through his dedication to his other sons, Ga’nar and Durotan, grooming them for leadership within the clan knowing that a conflict with the Bladespire Ogres is looming on the horizon. "

 WSC_RISE_OF_THE_HORDE_DESC:0 "One of the strongest orc clans on Draenor, the Warsong engage in constant skirmishes against the ogres of Highmaul, raiding countless settlements and expanding their once small territory to include much of Nagrand. Grommash Hellscream now believes he can deliver the final blow and claim the remaining ogre lands for the Warsong."

 HIM_RISE_OF_THE_HORDE_DESC:0 "Once the dominant power on Draenor, Highmaul is now in a state of decline, having lost many of its lands in skirmishes against the Warsong. High Imperator Mar'gok has fortified the remaining ogre holdouts in Nagrand, aiming to lure the overconfident Hellscream into a trap. By eliminating the Warsong leader, he hopes to reclaim Nagrand and restore Highmaul's former glory."

 SKR_RISE_OF_THE_HORDE_DESC:0 "The descendants of the once mighty Apexis Empire, Skyreach stands as the last bastion of power of the once great Arakkoa empire. Seeking to reclaim their former glory, High Sage Viryx, under the orders of the goddess Rukmar, has begun excavating ancient Apexis technology. If the High Arakkoa succeed in reverse-engineering these powerful artifacts, no one on Draenor will be able to stand against them."

 OTHER_RISE_OF_THE_HORDE_DESC:0 "With the coming rise of the Horde and arrival of the Burning Legion, all nations on Draenor will have to pick a side to survive the coming storm."

 #########################
 # First War (592)
 #########################
 FIRST_WAR_NAME:0 "The First War"
 FIRST_WAR_DESC:0 "The world of Azeroth has known relative peace for countless years, but an unforeseen threat looms on the horizon. Foul creatures called Orcs have used an interdimensional gateway to escape their dying homeworld known as Draenor. Seeking to conquer the whole of Azeroth and claim its vast resources for themselves, the Orcs suspect little resistance from the tamer civilizations of mankind. But, the valiant humans of the Kingdom of Stormwind stand in their path. Fighting for their survival, the humans will not be as easy a target as the Orcs might think. Can the Orcish Horde conquer all with their brute strength and savagery? Or will The might of Stormwind be enough to crush this newfound foe?"

 STO_FIRST_WAR_DESC:0 "King Llane Wrynn is the Sovereign Monarch of Stormwind whom had lead his people to victory against the Gurubashi in years past. The nation of Stormwind has since the Splintering of the Arathor Empire grown into a prosperous nation in its own right. However, Stormwind has become isolated following the wars against gnolls and trolls alike and dark times lie ahead as an unknown threat starts to invades the Kingdom's territory. Can the Kingdom surive this new threat which is determined to destroy them?"

 BRC_FIRST_WAR_DESC:0 "The mighty Chieftain of the Blackrock Clan, Blackhand, is known as a tactical genius and a ruthless warlord whom rules his people with a iron fist. A dominating presence both on and off the field of battle whom has become the Horde’s Warchief and in the wake of the Draenei’s fall; yearns to spill more blood. All the while, his Second-In-Command Orgrim Doomhammer is starting to suspect that a certain warlock is pulling his strings."

 TSC_FIRST_WAR_DESC:0 "Once the Apprentice of Ner'zhul, Gul'dan usurped his master's role as the spiritual leader for the Orcs. The old ways of shamanism have been suppressed in the wake of more sinister magic. Unknown to the public, Gul'dan and his Shadow Council is the true power behind the Horde while the Warchief is little more than a puppet. It wasn't long ago a stranger reached out to Gul'dan in a dream and showed him a world ripe for conquest, and the promise of power beyond comprehension."

 BHC_FIRST_WAR_DESC:0 "Lead by Kilrogg Deadeye; these orcs had grown up in the vast jungle of their home world. Now obliterated and barren they seek to find new Jungles to inhabit in Azeroth. Kilrogg has been recently been granted a vision of vast untamed jungle south of the Human's domain. Can he claim it or himself? Or will native resistance be too much for this Warlord?."

 FWC_FIRST_WAR_DESC:0 "As the youngest of Garad; Durotan is a tempered leader whom was chosen as successor as Chieftain for the Frostwolf Clan. There are dark times ahead, the orcish clans have banded together as the Horde but have forsaken sacred traditions along the way as they traverse the threshold of the Dark Portal to conquer a new world. Can the Frostwolves be a voice of reason and bring salvation to the Orcish Race?"

 THC_FIRST_WAR_DESC:0 "A strange type of pale orcs inhabit this clan constantly calling to unknown beings they call the Void. Cho'Gall a powerful two-headed ogre has been tasked to lead these strange creatures. Can Cho'Gal keep the pale orcs in check or fall to the whispers of the void himself?"

 DMC_FIRST_WAR_DESC:0 "The Dragonmaw Clan, a fearsome orcish clan deeply entrenched in the ways of taming and subjugation of rylaks. Hailing from the harsh and rugged lands of the southwestern Gorgrond. Led by their chieftain, Zuluhed the Whacked, the clan joined Blackhands incursion through Gul'dans portal with the promise of a future in a new land where they need not feed on their own rylaks to survive."

 KAR_FIRST_WAR_DESC:0 "The Guardian Medivh is tasked with protecting the world from the forces of evil. He grew up friends with Stormwind's King Lane and Commander Lothar and is eternally loyal to Stormwind. However, Medivh has grown silent in recent years locked up in his tower. Mystery shrouds the fate of the once all mighty Guardian..."

 TMB_FIRST_WAR_DESC:0 "The Tomb Guardians, under the leadership of the former Guardian of Tirisfal, Aegwynn, are tasked with protecting the Tomb of Sargeras. Despite relinquishing most of her magical powers to her son, Medivh, Aegwynn continues to dedicate herself to reinforcing the tombs’ defenses. Her ultimate goal is to prevent any being on Azeroth from releasing the fallen titan's avatar that she sealed within the tomb many centuries ago."

 IRO_FIRST_WAR_DESC:0 "Having not seen a large scale combat in thousands of years the Kingdom of Khaz Modan has started to stagnate. Many forges across Khaz Modan remain cold and their once grand standing armies have been reduced to regional protectors and adventures. With no true enemy the dwarves spend their time funding expeditions to both excavate and explore Azeroth."

 LOR_FIRST_WAR_DESC:0 "The Kingdom of Lordaeron, the grand bastion of humanity stands as one of the oldest and most revered realms of mankind. Its rich history and cultural heritage grant it significant prominence among the human nations. However, Lordaeron finds itself ensnared by daunting internal trials, grappling with ailing administration and a stagnant military force, the fate of Lordaeron hangs in the balance..."

 TSW_FIRST_WAR_DESC:0 "Mire to the south fallen silent, pools have dired up, soil drained of moisture, life withering. Green Men wade through our water, cut our trees and burn our roots, remove from swamp reclaim our home, feed their bodies to the roots."

 STR_FIRST_WAR_DESC:0 "The Kingdom of Stromgarde stands as a proud and formidable human nation. Nestled within the rolling hills and fertile plains of the Arathi Highlands, Stromgarde is a beacon of strength and prosperity. Ruled by the illustrious House of Trollbane, the kingdom is renowned for its mighty warriors and skilled craftsmen."

 DIC_FIRST_WAR_DESC:0 ""

 STC_FIRST_WAR_DESC:0 ""

 #BBC_FIRST_WAR_DESC:0 "Placeholder."

 #BTG_FIRST_WAR_DESC:0 "Placeholder."

 #BMC_FIRST_WAR_DESC:0 "Placeholder."

 #GUR_FIRST_WAR_DESC:0 "Native to the jungles of Stranglethorn the Gurubashi suffered a massive defeat at the hand of the Guardian of Tirisfal 18 years ago. Still recovering they wait for the ability to take revenge of humanity. Perhaps they could join these new creatures from a strange world or could they pose a new threat even greater than Stormwind."

 OTHER_FIRST_WAR_DESC:0 "The First War is centered around the southern Eastern Kingdoms, its recommended that you play nations with a focus tree or directly in this area. You can also play in the other regions of the world for fun but expect less development."

 #########################
 # Second War (596)
 #########################
 SECOND_WAR_NAME:0 "The Second War"
 SECOND_WAR_DESC:0 "The First war is over, King Llane and his grand armies lay dead in the ruins of Stormwind City. Yet not all hope is lost. Before the city could fall Anduin Lothar & Archmage Khadgar have both killed Medivh and the Titan Sargeras possessing him preventing a Demonic invasion of Azeroth, and lead thousands of refugees across the sea to Lordaeron, Bringing horrific stories of death and destruction with them. King Terenas Menethil of Lordaeron has called an emergency Council of all 7 Human Kingdoms on how best to deal with this threat, Pledging that no matter how the meating goes he will restore Prince Varian Wyrnn to the throne of Stormwind. \n\nMeanwhile the Horde has been on the move, Orgrim Doomhammer has destroyed the Shadow Council and secured absolute loyalty from the clans. Despite King Magni Bronzebeard moving quickly to organize a Dwarven and Gnomish defense. The now united Horde has plunged deep into Khaz Modan in only a matter of days, and the majority of Magnis' defenses lay in ruin. Should the Council of 7 Nations fail to create a strong alliance in the north capable of challenging this new united Horde, All of Azeroth may be swept beneath the Tides of Darkness."

 LOR_SECOND_WAR_DESC:0 "King Terenas Menethil is the wise and just sovereign monarch of Lordaeron; one of the most prominent political powers upon the Eastern Kingdoms. When Anduin Lothar arrives to Lordaeron's Court with the Crown Prince of Stormwind and tales of a Kingdom's destruction. The King of Lordaeron doesn't hesitate but to call the neighbouring human nations to an emergency meeting; the Council of Seven Kingdoms."

 QUE_SECOND_WAR_DESC:0 "High King Anasterian Sunstrider, the sovereign of Quel'thalas has ruled his people throughout the many conflicts which has threatened the High Home's continued existence. He remembers the debt of gratitude which the Quel'dorei owe humanity for their aid in the Troll Wars. While the news of the Horde is disconcerting, he's wary of putting his people in needless danger."

 STR_SECOND_WAR_DESC:0 "King Thoras Trollbane is the Warrior King of Stromgarde and a close friend to the King of Lordaeron. Stromgarde might not be the largest of the human kingdoms but it's indisputably one of the most powerful. The Fallen shall be avenged. Esarus thar no'Darador!"

 IRO_SECOND_WAR_DESC:0 "With the relentless orcish onslaught threatening their lands, the valiant dwarves of Ironforge prepare for the ultimate test of their strength and resolve. As the neighboring Loch Modan falls to the enemy and the brave Dun Modr Militia marches forth to safeguard the Wetlands, the fate of Ironforge hangs in the balance. Alongside their allies of Gnomeregan and Northeron, will Ironforge repell the Horde or will Khaz Modan become yet another conquest of the orcs?"

 #KUL_SECOND_WAR_DESC:0 "Lord Admiral Daelin Proudmoore is a master of the sea and commander of Azeroth's finest navy. The Maritime Nation of Kul Tiras has prospered through the trade which comes through the Tradewind Market of Boralus. As the longtime friend of Anduin Lothar, when the news of Stormwind's fall reaches his ear; the Lord Admiral makes his people ready for war."

 GIL_SECOND_WAR_DESC:0 "King Genn Greymane grew up seeing the Kingdom of Gilneas thrive under his father's rule and how it evolved into a middle-power capable of rivaling even Kul Tiras or Stromgarde. While Stormwind's destruction is tragic, it doesn't mean that Gilneas will share its fate."

 BRC_SECOND_WAR_DESC:0 "Orgrim Doomhammer has quietly condemned Gul'dan's treachery while he was Blackhand's Second-In-Command. He seized an opportunity challenge his Warchief to a Mak'gora while the Warlock was in a comma and emerged victorious as Warchief of the Horde. Now, after having culled the Shadow Council and its influence; it's time to claim the rest of the continent. Lok'Tar Ogar!"

 SRC_SECOND_WAR_DESC:0 "Amidst the swirling chaos of the Horde's dominance, the Stormreaver Clan, under the ambitious leadership of Gul'dan, stands as a formidable force. Tasked with the creation and training of the fearsome Death Knights, this clan has become a symbol of dread and power. While their loyalty to the Horde remains unyielding, whispers of Gul'dan's hidden agenda echo through the clan's ranks. As the Stormreaver Clan plunges deeper into the darkness, will they remain faithful to the Horde's cause or succumb to the insidious schemes of their enigmatic leader?"

 AMA_SECOND_WAR_DESC:0 "Zul'jin hates the High Elves of Quel'Thalas with an unrivalled fury. The Amani Empire may have been crushed in the Troll Wars, but the Amani Tribe survived and they've not forgotten. After thousands of years, there's an opportunity for vengeance and make elves and humans pay in blood."

 STO_SECOND_WAR_DESC:0 "Anduin Lothar arrives in Lordaeron's Court with troubling news. King Llane Wrynn is dead and Stormwind has fallen. The surviving population has been granted refuge in Hillsbrad Foothills while the Lord Regent must see to end the threat which seeks to wipe out humanity."

 DMC_SECOND_WAR_DESC:0 "As the Battle for Khaz Modan rages on, the Dragonmaw, a fierce clan within the mighty Horde, wages a relentless campaign against the stalwart dwarves of Northeron within the highlands to the east. Guided by haunting visions of majestic dragons, they seek not only to conquer this contested land, but to bend these ancient creatures to their will, wishing to transform them into awe-inspiring war mounts to fuel the Horde's war effort."

 BHC_SECOND_WAR_DESC:0 "Part of the Horde, the Bleeding Hollow clan has been the vanguard in the war against the Coalition of Khaz Modan. Led by the cunning and merciless Kilrogg Deadeye, their insatiable hunger for power propels them forward, seeking not only victory but the unraveling of ancient enigmas that lie hidden within the dwarven lands."

 STC_SECOND_WAR_DESC:0 "A recent addition to the orcish Horde, the goblins of the Steamwheedle Cartel are not exactly on the side of the orcs because they share the same ideals. Seeking nothing but profit, the goblins hope that the war will bring them good profit and fortune."

 OTHER_SECOND_WAR_DESC:0 "The Second War is centered around the Eastern Kingdoms and features a total war. It should be very easy to side with the Horde or Alliance and help as any nation in the mod. You can also play however you want."

 #########################
 # Invasion of Draenor (600)
 #########################
 DRAENOR_INVASION_NAME:0 "The Invasion of Draenor (Coming Soon)"
 DRAENOR_INVASION_DESC:0 "The Second War is over and the Alliance stands unopposed in the Eastern Kingdoms. Victory was swept away from the Orcish Horde by Guldan when he betrayed them before the siege of Capital City. Archmage Khadgar has destroyed the Dark Portal connecting Azeroth and Draenor. While small portions of Orcs hide in Grim Batol and Blackrock Mountain Orgrim Doomhammer’s Horde poses no real threat to the nations of Azeroth. However a new horde has formed on Draenor, Nerzul of the Shadowmoon clan has devised a plan to reopen the dark portal in order to steal magical artifacts necessary to link Draenor to countless other worlds and exploit their resources instead. With a renewed assault from Draenor on Azeroth, The Sons of Lothar backed by the Alliance of Lordaeron have deemed it there responsibility to take the war to Draenor and end the orc threat to all worlds once and for all."

 #########################
 # Third War (610)
 #########################
 THIRD_WAR_NAME:0 "The Third War"
 THIRD_WAR_DESC:0 "In the aftermath of the Second War, the Eastern Kingdoms have enjoyed a relative peace. The Kingdom of Lordaeron notably, after successful reconstruction and reforming efforts is still struggling to contain the orcish population in internment camps. Near the frontier with Arathi, especially, camps face unexpected uprisings as freed orcs rally together, fostering rumors of a burgeoning new Horde. Meanwhile, rumors abound about strange occurrences in the barony Caer Darrow, somes are even talking about necromancy being practiced within the halls of the Darrowmere Keep.\n\nMeanwhile to the far north, deep within the frostbitten lands of Northrend, an unsettling presence stirs within the icy embrace of Icecrown. Malevolent forces are at work and the fews to have bear witness of it talk about the deads rising... The cold expanse conceals secrets of dark power, and ancient forces bide their time, waiting to make their mark upon Azeroth.\n\nThe winds of change are blowing, great heroes and evil alike shall soon arise; for Azeroth seems to be on the brink of a new reign of chaos..."

 LOR_THIRD_WAR_DESC:0 "Amidst relative peace, the Kingdom of Lordaeron faces underlying tensions. Orcs continue to raid internment camps along the Arathi frontier, sowing seeds of uncertainty. Whispers circulate, hinting at forbidden magic emanating from the enigmatic Caer Darrow, fueling unease. Yet, the kingdom draws solace from its stalwart defenders, the valiant Knights of the Silver Hand, and the leadership of King Terenas, as well as his son, Prince Arthas. United in their resolve, the people of Lordaeron place their faith in these defenders, in hope that they will protect the kingdom against the struggles that are to come."

 CAE_THIRD_WAR_DESC:0 "For decades now, Caer Darrow have been the fief of the House of Barov, an extremely wealthy family of Lordaeronian nobility. From their manor in the middle of Darrowmere Lake, rebuilt to be even more magnificent after the Second War, the family lives lavishly and manages its numerous holdings, from Southshore to Brill.\nHowever, in recent years, these aristocrats have become dissatisfied with their opulent wealth and power, succumbing to greater greed and rage. Fortunately, a fortuitous opportunity presented itself in the form of Kel'Thuzad, a powerful mage from Dalaran. He extended an enticing deal that promises to secure their wealth, and much more, for the rest of their life, and beyond..."

 QUE_THIRD_WAR_DESC:0 "The Kingdom of Quel'thalas basks in a tranquil era after the Second War, having repelled the Amani trolls to their domain. Under the esteemed leadership of King Anasterian Sunstrider, the elven realm flourishes. The future appears promising with the emergence of Prince Kael'thas, a beacon of hope for the future of the kingdom. As they revel in peace, the high elves strive to preserve their ancient traditions and to protect their beloved Sunwell, the arcanic source of their power."

 FWC_THIRD_WAR_DESC:0 "The upbringing of Thrall is a tragic one, his parents killed by Gul'dan's assasins, he was then taken into Durnhold Keep where he became a slave and gladiator. Years laters, he would be freed and cross path with Grom Hellscream and Drek'thar who would teach him the old orcish way and his origins as son of Durotan, chieftain of the Frostwolf Clan. Thrall would then meet former warchief Orgrim Doomhammer, and together they would liberate the orcs from the internment camps.\n\n Now, with Doomhammer dead, Thrall leads the free orcs. With their situation uncertain, they must whether to forge a new home in the Eastern Kingdoms or seek uncharted lands beyond the sea..."

 SRG_THIRD_WAR_DESC:0 "In life, Ner'zhul was the elder shaman of the orcish Shadowmoon Clan. When on Azeroth the Horde was defeated and the azerothians counter-attacked through the Dark Portal, he was tricked into making a blood pact with the Demon Lord Kil'Jaeden which binded the orcs into eternal servitude. Seeking to save his people, Ner'zhul opened countless portals to flee Draenor, but he was eventually captured by the Demon Lord.\n As punishment, his mortal form was destroyed and his spirit transformed into the Lich King to be encased into the ices of the Icecrown glacier, back on Azeroth. Now gifted with control over the undead, his mission is to weaken Azeroth for a future Legion invasion. But the Lich King may have its own plans..."

 AZJ_THIRD_WAR_DESC:0 "Nestled deep beneath the icy expanse of Northrend, the ancient Kingdom of Azjol'Nerub stretch all over the cavernous expanse of the continent. Its people, the enigmatic nerubians are arachnoid and insectoid beings of great wisdom.\n\n However recently, foreboding signs have started to trouble the peace of the millennia-old kingdom. Communication with hives buried beneath the Icecrown Glacier has been severed, replaced with unsettling reports of sinister forces at play."

 KAL_THIRD_WAR_DESC:0 "Kal'dorei, meaning 'Children of the Stars' in the night elven tongue, is the name given to the night elves that inhabit the forests of Kalimdor. Their empire once spanned most of Azeroth but after the Legion invasion and the Great Sundering millenias ago, they have entrenched themselves into the worship of nature and their goddess: Elune.\n\nGranted eternal life by the powers of the blessed Nordrassil great tree, they are staunch and fierce protectors of nature and will go at any length to safeguard their traditions and the land they call home."

 STO_THIRD_WAR_DESC:0 "With the Repairs of Stormwind City almost complete an Eerie Calm has fallen over The Kingdom. While negotiations over payment of the Stonemasons are the court seems to talk about, other forces seem to be moving against Stormwind once more, The Blackrock Orc still hold areas of Redridge and expeditions into Troll Territory seem to be bearing fruit most of the Kingdoms coffers going to the payment of the Army, however Stormwind has begun to accumulate a large amount of Debt, resulting in a era of stagnation."

 DFB_THIRD_WAR_DESC:0 "A rebelion formed by the Stonemasons Guild of Stormwind, after completing the rebuilding of Stormwind, the Nobles decided to withhold payment from The Stonemasons, this lead to a number of Riots one of which resulted in the death of Queen Tiffin who was struck by thrown debris. Now being hunted by the Stormwindian Army, the Brotherhood make their stand in Westfall\n\n§BTo Play as the Defias you Pick Stormwind then wait until the Riots breakout.\nSome additional political unrest could help to stoke the flames.§!"

 NET_THIRD_WAR_DESC:0 "Formed as a Forward base of Operations for the Alliance, Nethergarde Keep has seen better days, having suffered the brunt of the 2nd Orc Invasion and having Commander Trollbane take the fight to the Orcs through the Dark Portal, the rebuilding Process has been slow.\n\n With the Turmoil brewing in the North the future of the Keep is grim, but with the constant attacks by Ogres, needing to deal with Murloc fishermen, and the occasional Cultist summoning a demon from the twisting nether, the men dont have time to worry about politics, the portal may be closed but that does not mean our duty is over."

