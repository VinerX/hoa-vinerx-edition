#events
###############################
theramore_third.1.t:0 "Landfall"
theramore_third.1.d:0 "The citizens of Lordaeron are not used to such long boat rides, many of them fell quite ill over the voyage, but their spirits were lifted upon seeing land, many of them burried their hands in the swampy soil and thanked the light, but the local murlocs did not seem as over joyed.\n\nEven in this new land there are still Murlocs, their fishermen fled from our arrival, but before we could even get settled, they attacked us in force!"
theramore_third.1.option.1:0 "To Arms!"

theramore_third.2.t:0 "Settling the Coast"
theramore_third.2.d:0 "The murloc threat has finally been dealt with, and now we have some time for our people to build homes in these new lands. However, not all is well. To the west, a growing threat emerges from the marshes, and if our people are to truly ever be safe, we must begin making plans."
theramore_third.2.option.1:0 "Secure Our Lands"
theramore_third.2.option.1.d:0 "Core and convert all lands we conquered from the Murlocs to our people."

theramore_third.3.t:0 "Westward Expansion"
theramore_third.3.d:0 "The time has come to clear out the marshes from the Withervine threat, ensuring our foothold in this new land will not be challenged for some time."
theramore_third.3.option.1:0 "Inland Excursion"

theramore_third.4.t:0 "Settling the West"
theramore_third.4.d:0 "The marshes have been secured, and we can begin constructing outposts in these new lands. While the coastline and the marshes offer our people a new home, the dwarven allies amongst our ranks have begun eyeing the western mountains.\n\nThere is a tribe of tauren who currently inhabit this mountian pass, but they may be amenable to granting our dwarves some territory."
theramore_third.4.option.1:0 "Build Outposts"
theramore_third.4.option.1.d:0 "Core and convert all lands we conquered in the marshlands to our people."

theramore_third.5.t:0 "Bael Modan"
theramore_third.5.d:0 "Our dwarves have taken up residence in their new mountian home, Bael Modan, but diplomatic talks with the local tauren remain unclear on how they will yet respond..."
theramore_third.5.option.1:0 "Establish Bael Modan"
theramore_third.5.option.1.d:0 "§HKeep playing as Theramore.§!"
theramore_third.5.option.2:0 "Oversee Bael Modan Personally"

theramore_third.6.t:0 "Stonespire Tribe Accepts"
theramore_third.6.d:0 "The local tauren have agreed to cede their former territory to the dwarves so they may establish Bael Modan in peace!"
theramore_third.6.option.1:0 "Wonderful News!"

theramore_third.7.t:0 "Bael Modan Secured"
stonespire_third.1.d:0 "The tauren have been routed, and our dwarven allies in Bael Modan can finally start flourishing in their new home."
theramore_third.7.option.1:0 "Victory!"

theramore_third.10.t:0 "Those Feared Lost"
theramore_third.10.d:0 "A few of our ships were unaccounted for the first few weeks after our landing, it seems our hopes have been answered, a few of the ships thought lost have arrived on the shore, seems they ran into some small troubles along the way."
theramore_third.10.option.1:0 "Welcome!"

theramore_third.11.t:0 "Another Ship?"
theramore_third.11.d:0 "Another one of our ships have arrived, the sailors on board speak of a horrible incident at sea, where a monster attempted to sink them, they spoke of a Squid the side of a castle."
theramore_third.11.option.1:0 "Rather Concerning"

theramore_third.12.t:0 "Lost Shipwreak"
theramore_third.12.d:0 "One of our scouts came across the remains of the ship on the southern coast of the marshes, it seems the crew crashes into the rocks as they attempted to make landfall, the more concerning discovery is a discovery a of a few bodies, with large scratch marks and what look to be burn marks."
theramore_third.12.option.1:0 "Please dont be dragons."

