HAK_jindo_the_hexxer:0 "Jindo The Hexxer"
POLITICS_JINDO_THE_HEXXER_HAKKARI_DESC:0 "After the events of the Gurubashi civil war, Jin’do and the Hakkari have been hiding away in the temple of Atal’hakkar biding their time as they figure out a way to return the great Loa of Blood back to life and let him take vengeance on the non-believers of the world."
HAK_jammalan_the_prophet:0 "Jammal`an the Prophet"
POLITICS_JAMMALAN_THE_PROPHET_DESC:0 "Leader of the Hakkari, in the Swamps of Sorrow. His tribe runs the sacred temple of Atal’hakkar. The primary temple for the Hakkar, the Soulflayer. Having foreseen the greatness that the Hakkari and the Gurubashi could strive with the power of Hakkar he has plotted and schemed how to get the great plan back on track before the Zandalar and the traitors foiled the path to greatness and immortality that Hakkar would lead them on."

