  AZJ_lvl_5_aviary:0 "Flyer Nests"
  AZJ_lvl_5_aviary_desc:0 "Our winged breathern enjoy dwelling in the northen reaches of our kingdom, their numbers have grown and it has been deemed necessary to expand the tunnels to account for their population."

  AZJ_corprethar_5_wheat:0 "Corp'rethar Gateway"
  AZJ_corprethar_5_wheat_desc:0 "Though an uncommon request the flyers have asked for a gateway to be constructed near Corprethar so they may hunt the creatures who roam the lands above."

  AZJ_3nesting_grounds_3slots:0 "Nursing Chambers"
  AZJ_3nesting_grounds_3slots_desc:0 "Before we knew it our winged breathern had begun making the most our of the large network of tunnels we had excavated for them, chambers have turned into nurseries for their young and the sounds of excitement from the young ones fill the hearts of our brothers and sisters."

