AZJ_religious_concepts:0 "Religious Concepts"
AZJ_religious_concepts_desc:0 "In ancient Azjol-Nerub, there were five or six schools of religious thought, and theological debates were common. Eventually, however, nerubians have come to a conclusion that worshiping creatures from beyond the world is insane, and, in the words of the seer Ul'Tomon, "makes as much sense as a fly caught in a web worshiping the spider who is about to devour him". To modern nerubians, even the concept of "worship" itself is alien."

AZJ_whispers_from_below:0 "Whispers From Below"
AZJ_whispers_from_below_desc:0 "Deep below our kingdom lies The Forgotten, buried beneth the very tunnels we live in, it still whispers to us, the Elders teach little of our past but tell the young to fear the stuff of legends."

AZJ_mil_advisor_cost_reduction:0 "Elder Vorus Kahar"
AZJ_mil_advisor_cost_reduction_desc:0 ""

AZJ_army_xp_gain_300_days:0 "Nerubian Training"
AZJ_army_xp_gain_300_days_desc:0 "Gain access to the modern military training facilities of the resurgent Nerubian civilization, empowering your army with valuable experience"

AZJ_servants_for_the_spider_kingdom_idea2:0 "Old Forgotten Knowledge"
AZJ_servants_for_the_spider_kingdom_idea2_desc:0 "Our minds remember the touch of the old gods, that once used us as fodder against the Trolls and Elves, what we learned from their exploitation of us, will always remain ours."

