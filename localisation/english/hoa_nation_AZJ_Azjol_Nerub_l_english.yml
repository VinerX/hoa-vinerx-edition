#events
###############################

azjolnerub.1.t:0 "Cast out Nefarion"
azjolnerub.1.d:0 "With that weakling Nefarion gone from our lands, we must integrate Nefarions holdings into our empire."
azjolnerub.1.option.1:0 "Secure the Lands"

azjolnerub.2.t:0 "Obsidian Idol"
azjolnerub.2.d:0 "As we delve deep into the worship of the old gods, we've made contact with the Black Dragonflight. They too follow the ways of the old gods. Maybe we can learn a thing or two from them"
azjolnerub.2.option.1:0 "Praise the Old Gods"

azjolnerub.3.t:0 "Threaten Kalu'ak"
azjolnerub.3.d:0 "Kalu'ak stands in the way of our ambitions. Send Kalu'ak a threat to hand over territory or face the might of the Nerubian Empire"
azjolnerub.3.option.1:0 "Send the threat"

azjolnerub.4.t:0 "Kalu'ak Denies our Demand"
azjolnerub.4.d:0 "Kalu'ak has denied our demand for Indu'le Village and Moa'ki Harbor. They will now discover what it means to stand against Azjol Nerub"
azjolnerub.4.option.1:0 "Prepare the soldiers"

azjolnerub.5.t:0 "Unleash Yogg'saron"
azjolnerub.5.d:0 "Having seized control of Ulduar, we exult in the vast knowledge and advanced technology of the Titan Keepers. Our minds teem with visions of progress and the extraordinary power that soon shall be within our grasp. Yet, amidst these marvels, lies the most important reason of our conquest, the prison of our master, Yogg-Saron. Throughout countless ages, this insidious Old God has cunningly sown seeds of corruption, slowly ensnaring the minds of his jailers, yearning for the day he might break free. But as destiny's most enigmatic weaver, our God always has multiple plans in motion, and it was our hand that delivered the final blow to break him free. Now, we stand as both liberators and servants, unshackling the dark might of Yogg-Saron upon Northrend, and soon, upon the entire realm of Azeroth, as the ominous Hour of Twilight looms ever closer..."
azjolnerub.5.option.1:0 "Our new god has arrived"

azjolnerub.6.t:0 "The Faceless Ones"
azjolnerub.6.d:0 "Throughout countless eons, our noble nerubian race has valiantly waged an unyielding war against the faceless ones, ancient and abhorrent abominations sworn to serve the Old Gods. These nightmarish creatures dwell in the deepest crevices of Northrend, even surpassing the depths of Azjol'Nerub itself. Yet now, an unsettling change sweeps across our kingdom. The insidious whispers of the Old Gods find their way into the hearts and minds of more and more nerubians each passing day, blurring the once-clear line between us and our nightmarish adversaries. We find ourselves entangled in their sinister designs, bound by servitude to the same malevolent masters. In a sequence of events unfathomable just years ago, our revered King Anub'arak has sworn fealty to these dark forces, forging an unholy alliance with their dreaded faceless minions, effectively abdicating his powers to these malicious creatures..."
azjolnerub.6.option.1:0 "We grow ever closer to the old gods"

azjolnerub.7.t:0 "Birthplace of the Nerubians"
azjolnerub.7.d:0 "Recent explorations have unveiled the ancient birthplace of our people, the Nerubians. Our ancestral site has been rediscovered amidst the rugged terrain of our homeland. However, neighboring powers are eyeing our sacred grounds with covetous intent. We must decide whether to defend our heritage fiercely or seek diplomatic resolutions to safeguard our birthplace from exploitation."
azjolnerub.7.option.1:0 "Ok"

azjolnerub.8.t:0 "An Invitation to the Fold"
azjolnerub.8.d:0 "We, the stalwart denizens of Azol-Nerub, stand at the threshold of history, poised to embark on a new chapter of our journey. With unwavering resolve, we extend our hand to Nazjatar, seeking kinship and mutual benefit. Our kingdom's ancient knowledge and indomitable spirit shall fortify this alliance, ensuring a future of shared triumphs. As emissaries of our people, we proudly declare our intent to unite with Nazjatar, forging bonds that will endure through the ages."
azjolnerub.8.option.1:0 "We wish to join our comrades"

azjolnerub.9.t:0 "An Invitation to the Fold"
azjolnerub.9.d:0 "Nazjatar has accepted our wish to join them in their worship of the old god N'zoth"
azjolnerub.9.option.1:0 "Glory to N'zoth!"

azjolnerub.10.t:0 "An Invitation to the Fold"
azjolnerub.10.d:0 "Nazjatar has denied our wish to join them in their worship of the old god N'zoth"
azjolnerub.10.option.1:0 "How dare they!"

