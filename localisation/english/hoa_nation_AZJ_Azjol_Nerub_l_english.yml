  AZJ_1mills_1slot_moonrest_10mana_desc:0 "The magic that dwells in this place has long been a source of enrichment to the Nymphs and Ancients which once held it, the crystals which on these lands will make fine reagents for our vizers."

  AZJ_1civ_1slot_10wood_on_moonrest:0 "Harvest the Ancients"
  AZJ_1civ_1slot_10wood_on_moonrest_desc:0 "The Ancients which once cause our young to scurry to the shadows, who shook our tunnels with their every step will now serve as paper and furniture for our kingdom."

