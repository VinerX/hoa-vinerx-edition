AZJ_king_anubarak:0 "King Anub'arak"
POLITICS_KING_ANUBARAK_DESC:0 "The King Below, the Lord of all Nerubians, and the Emperor of Azjol-Nerub. He is a stalwart leader and a peerless warrior."

