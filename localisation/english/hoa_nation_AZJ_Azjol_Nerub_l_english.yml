  AZJ_birthplace_of_the_nerubians:0 "Birthplace of the Nerubians"
  AZJ_birthplace_of_the_nerubians_desc:0 "Azjol-Nerub is a vast underground region that stretches beneath half the breadth of Northrend. It is inhabited by the arachnid-like nerubians. Azjol-Nerub contains huge libraries of literature, philosophy, arcane lore, and serves as a center of knowledge, art, and learning."

