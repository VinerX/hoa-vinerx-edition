  AZJ_war_with_the_forgotten_desc:0 ""

  AZJ_the_reign_of_anub_arak:0 "The Reign of Anub'arak"
  AZJ_the_reign_of_anub_arak_desc:0 "Anub'arak was the last king of the nerubian empire of Azjol-Nerub."

  AZJ_securing_the_southern_entrance:0 "Securing the Southern Entrance"
  AZJ_securing_the_southern_entrance_desc:0 "The Icemist Tribe to our south is our first obstacle on the path to the Nerubian rejuvenation. We will destroy their pitiful tribe and secure the south of our empire."

