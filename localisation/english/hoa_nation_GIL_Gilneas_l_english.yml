gilneas.1.t:0 "Meeting of the Seven Kingdoms."
gilneas.1.d:0 "The Kingdom of Lordearon has called a Meeting of the Seven Kingdoms, something that has not been done for a millennia, it would seem as though they are taking the threat from the Orcs to the south seriously."
gilneas.1.option.1:0 "We shall attend"
gilneas.1.option.2:0 "We have our own matters to attend to."

gilneas.2.t:0 "Meeting of the Seven Kingdoms."
gilneas.2.d:0 "The Kingdom of Lordearon has called a Meeting of the Seven Kingdoms, something that has not been done for a millennia, though it would seem they are more worried about internal threats then that of the Orcs to the south."
gilneas.2.option.1:0 "We shall attend"
gilneas.2.option.2:0 "We have our own matters to attend to."

### Third War events
gilneas_third_war.1.t:0 "The Kingdom of Gilneas"
gilneas_third_war.1.d:0 "   Despites the kingdom's participation during the Second War on the side of the Alliance, Gilneas, and especially its King, Genn Greymane, have always been critical of the Alliance and reluctant to fully commit to it. After all, isolationist policies and self-reliance is part of the gilnean culture.\n\n   This critical stance has been even more exacerbated at the end of the war with the introduction of Alliance-wide taxes for the construction and maintenance of the orcs internment camps as well as the Nethergarde Keep. The great amount of dead gilnean soldiers during the war was another toll to the trust in the Alliance and convinced King Greymane that this Alliance had gotten them nothing but dead gilneans.\n\n   It is then naturally that shortly after the war, the King announced the eventual withdrawal of his kingdom from the Alliance if things were not to improve. Since then, the membership of Gilneas has been an uneasy one and despites the year passing, the kingdom is still part of the Alliance.\n\n    But the king didn't lie idle during all these years, devising a monumental project to wall off his kingdom from the rest of the world. While the idea was accepted by many, some did raise protests against it, as it would cut off the towns of Pyrewood and Ambermill from the rest of the kingdom. Especially, a new yet already influent noble, Lord Darius Crowley, staunch supporter of the Alliance, showed his discontent with the project as the wall would pass through his lands.\n\n    The current situation of Gilneas is a rather unstable one, torn between the King's isolationist views and the young nobility's stance toward the Alliance, only time will tell if the kingdom remains stable or turns to strife."
gilneas_third_war.1.option.1:0 "Understood."

gilneas_third_war.2.t:0 "Gilneas and the Alliance"
gilneas_third_war.2.d:0 "   Recent reports from the Hillsbrad Foothills and Arathi informs us that the orcs attacks on the internments camps have culminated into the siege of the biggest and most fortified of them: Durnholde Keep. Our neighbors from Lordaeron state that the keep has been completely destroyed by the united orcish clans led by a certain Thrall and that there are not plans to rebuild it.\n\n    These news are yet another proof that all these taxes that the Alliance forces upon our kingdom serves no purpose and that its leadership is purely incompetent. Moreover, it has rekindled the eternal debate between the isolationist and the Alliance supporters within our kingdom and the nobles have demanded a declaration from the King on the matter."
gilneas_third_war.2.option.1:0 "This is the final straw. Gilneas shall pursue its own path."
gilneas_third_war.2.option.2:0 "I'm sure we can work towards bettering things."

gilneas_third_war.3.t:0 "The Way Forward"
gilneas_third_war.3.d:0 "   With the kingdom's recent withdrawal from the Alliance, King Genn Greymane has once more put forward his plan to isolate the kingdom from the rest of the world and focus on self-reliance. This project crystalize in the construction of a monumental wall that would cut the gilnean peninsula from the rest of the continent, but also our holdings in the Silverpine Forest.\n\n    The proposal's greatest opponent, Lord Crowley has stated that we cannot let down the people of Silverpine and that this wall would eventually brings the end of our nation.\n\n   In any case, the King remains the one to decide."
gilneas_third_war.3.option.1:0 "Go on with the plan."
gilneas_third_war.3.option.1.d:0 "§HThe kingdom will begins the construction of a great wall on the border with the Silverpine Forest.§!"
gilneas_third_war.3.option.2:0 "Crowley is right, this is foolish."

gilneas_third_war.4.t:0 "The Wall"
gilneas_third_war.4.d:0 "   After one year of planning and hard work, the great wall separating the gilnean peninsula is finally finished. Named after the king, the Greymane Wall stretches from east to west and signals the beginning of a new era of isolation for the kingdom. Hopefully its monumental sides will protect our kingdom from outside threats..."
gilneas_third_war.4.option.1:0 "At last!"

gilneas_third_war.5.t:0 "Lordaeron Requests Aid"
gilneas_third_war.5.d:0 "   We have received today an unexpected request from Lordaeron. A letter written by none other than King Terenas Menethil II informs us that his kingdom is besieged by dark forces and a mysterious plague of undead that spreads through the land. He urges us to come to their aid in battling the undeads that have already risen in parts of the kingdom."
gilneas_third_war.5.option.1:0 "Ignore their pleas."
gilneas_third_war.5.option.2:0 "We can spare a few things."

gilneas_third_war.6.t:0 "Undeads at our borders!"
gilneas_third_war.6.d:0 "   My king! The undeads are at our borders and some of them are already crossing into the kingdom from the north! We must act quickly before their overwhelm our garrisons!"
gilneas_third_war.6.option.1:0 "Open the gates!"
gilneas_third_war.6.option.1.d:0 "§HWe send troops behind the wall to deal with the undead threat.§!"
gilneas_third_war.6.option.2:0 "Abandon our holdings in Silverpine."
gilneas_third_war.6.option.2.d:0 "§RThis could have dire consequences...§!"

gilneas_third_war.7.t:0 "Crushing Defeat"
gilneas_third_war.7.d:0 "   My lord... the troops that we have sent beyond the wall in the Silverpine Forest to combat the undead threats have almost all been wiped out and raised into undeath, joining the ranks of our enemies..."
gilneas_third_war.7.option.1:0 "Damn it!"

gilneas_third_war.8.t:0 "Arugal's Proposal"
gilneas_third_war.8.d:0 "   King Greymane has summoned to his court the Archmage Arugal, a gilnean mage that studied in Dalaran and has recently returned to his homeland after the onset of the plague of undead.\n\n   The king has pleaded the archmage to find a way to protect his kingdom from the waves of undead regrouping behind the wall.\n\n   Arugal, wishing to answer his king request, has told him about the worgen, a mystical race of lupine creatures that he had been studied. He told the king about their supposed strength and ferocity, but the archmage has also warned him that not much is known about these creatures..."
gilneas_third_war.8.option.1:0 "So be it, unleash these creatures!"
gilneas_third_war.8.option.1.d:0 "§HArchmage Arugal begins summoning an army of worgen...§!"
gilneas_third_war.8.option.2:0 "We cannot dabble in dark magic."

gilneas_third_war.9.t:0 "A Disaster"
gilneas_third_war.9.d:0 "   Upon the king's order, the archmage Arugal lost no time to travel to the Greymane Wall. Finally atop the great monument, he began his ritual, summoning countless of worgen at the foot of the fortification.\n\n   At first the creatures swiftly took care of the undead legion, slashing and gnawing through bones with their sharp fangs and claws. Soon enough, the undead were either laying inert on the ground or retreating up north. Arugal rejoiced as the creatures were more fierce and powerful that he expected.\n\n   His plan had worked flawlessly so far and he was eager to see the king's reaction when he would hear the news. But as the undead targets were rapidly becoming rarer, the beasts started to turn against the gilnean soldiers, turning them into piles of meat as quick as the undead before them. The smile on the archmage face was quickly replaced by a terrified expression.\n\n   Once the worgen had finished with the soldiers, they ran away in the distance towards the towns of Pyrewood and Ambermill..."
gilneas_third_war.9.option.1:0 "Terrible..."

gilneas_third_war.10.t:0 "Lord Darius Crowley"
gilneas_third_war.10.d:0 "   King Greymane has summoned Lord Dragius Crowley at his court today after the noble has been caught sending equipment and troops to the Alliance, going against the king's order.\n\n   At first the two men exchanged quite politely, but as usual between the two of them their voices quickly rose. King Greymane tried to reason with Crowley, explaining him that the alliance had done nothing good for the kingdom and that helping them would be a lost cause. Crowley on the other hand, insisted that he was doing the best for Gilneas and that soon enough he would end the King's tyranny.\n\n   The king, even more angered by these words warned the noble that this would be an act of treason and that he would swiftly take matters into action if he were to rebel."
gilneas_third_war.10.option.1:0 "Crowley storms out the castle."
gilneas_third_war.10.option.2:0 "The king convince Crowley."

gilneas_third_war.11.t:0 "The Northgate Rebellion"
gilneas_third_war.11.d:0 "   My king! Lord Crowley has rallied troops from all over the kingdom and has declared an open rebellion against your rule! Already he is mustering troops in his lands to the north and preparing to march on the capital!"
gilneas_third_war.11.option.1:0 "That wretched bastard!"
gilneas_third_war.11.option.1.d:0 "§RLord Darius Crowley starts a rebellion...§!"
gilneas_third_war.11.option.2:0 "Crowley shall save Gilneas!"
gilneas_third_war.11.option.2.d:0 "§RLord Darius Crowley starts a rebellion...§!\n§HPlay as the rebels led by Crowley.§!"

gilneas_third_war.12.t:0 "Arugal take over Shadowfang Keep"
gilneas_third_war.12.d:0 "   In his sorrow for everything he has done, Archmage Arugal has left for Shadowfang Keep and now lives among the worgen that he now calls his 'sons'. All the northern provinces beyond the wall are now under control of the archmage and his lupine creatures."
gilneas_third_war.12.option.1:0 "He is next after we take care of Crowley."
gilneas_third_war.12.option.2:0 "We serve the pack."


gilneas_third_war.13.t.1:0 "Gilneas reaffirms its support for the Alliance."
gilneas_third_war.13.t.2:0 "Gilneas withrdraws from the Alliance"
gilneas_third_war.13.d.1:0 "In the wake of the Siege of Durnholde and the looming failure of the Orc Interment Act, Gilneas has opted to reassert its commitment to the Alliance. Despite recent setbacks,King Genn Greymane recognize the emergence of a new Horde as an undeniable threat. Understanding that only through collective strength can the nations of the Alliance avert further devastation to their lands."
gilneas_third_war.13.d.2:0 "Following the Siege of Durnholde and the impending failure of the Orc Interment Act, Gilneas has made the resolute decision to withdraw from the Alliance. Citing the Kingdoms lack of destruction in the Second War, the poor handling of the Alterac crisis and the considerable resources squandered on the Internment camps. The Kingdom of Gilneas have chosen to find their own path forward."
gilneas_third_war.13.option.1:0 "We are stronger together."
gilneas_third_war.13.option.2:0 "Troubling news."

