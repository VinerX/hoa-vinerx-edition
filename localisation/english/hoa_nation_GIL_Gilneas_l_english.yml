GIL_militant_defiance:0 "Militant Defiance"
GIL_militant_defiance_desc:0 "Gilneas's army is a proud military branch for a prouder people. Greymane's admiration for strength and staunch self-reliance runs deep in the blood of all the kingdom's denizens."

