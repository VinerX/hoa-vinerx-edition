 royal_guard:0 "Royal Guard"
 royal_guard_desc:0 "Royal Guards are veterans of combat that won't give the enemy a inch in a defensive formation."
 mounted_royal_guard:0 "Mounted Royal Guard"
 mounted_royal_guard_desc:0 ""
 paladin:0 "Paladin"
 paladin_desc:0 "Paladins are masters of the saddle and can only be matched by wielders of unholy magic."
 templar:0 "Templars"
 templar_desc:0 ""
 archmage:0 "Archmage"
 archmage_desc:0 "Archmages wield destructive magical powers capable of leveling cities, but are vulnerable to all types of troops."

