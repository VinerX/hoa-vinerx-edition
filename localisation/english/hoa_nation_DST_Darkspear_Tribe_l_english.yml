#units
###############################

###############################
#ideas
###############################
DST_Stranglehorn_Troubles:0 "Stranglehorn Troubles"
DST_Stranglehorn_Troubles_desc:0 "The Stranglehorn Vale is too intense for the Darkspear Tribe to handle, the might of famines and ruthless conflict ravage the Darkspear Tribe."
DST_Amani_Rivalry:0 "Amani Rivalry"
DST_Amani_Rivalry_desc:0 "The Darkspear Tribe have an ancient rivalry with the Amani tribe, despite being so far away. Their rivalry surpases the Skullsplitter and Bloodscalp Tribes despite being actively at war with them."

DST_overpopulated_1:0 "Overpopulated"
DST_overpopulated_1_desc:0 ""
DST_overpopulated_2:0 "Overpopulated"
DST_overpopulated_2_desc:0 ""
DST_overpopulated_3:0 "Overpopulated"
DST_overpopulated_3_desc:0 ""

#Classic Ideas
DST_zalazanes_betrayal:0 "Zalazane's Betrayal"
DST_zalazanes_betrayal_desc:0 "Witness de power of me voodoo... you ain't leavin' dis island ALIVE!"
DST_tormented_souls:0 "Tormented Souls"
DST_tormented_souls_desc:0 "Utilizing dark magic, Zalazane enslaved many of his fellow tribespeople and amassed an army of mindless Darkspear trolls."
DST_era_of_adventurers:0 "Era of Adventurers"
DST_era_of_adventurers_desc:0 "Placeholder : A village of exclamation points sits over the next hill."
DST_blessing_of_bwomsamdi:0 "Blessing of Bwomsamdi"
DST_blessing_of_bwomsamdi_desc:0 "§RSpirits of de Darkspear... ARISE! Take up de ancient masks, take up de bloody spears... you be followin' VOL'JIN, now!\nNow GO! Use me boon wisely.§!\nVol'jin earned the blessing of Bwomsamdi."
DST_darkspear_envoys:0 "Darkspear Envoys"
DST_darkspear_envoys_desc:0 "Our tribes speakers visit the far flung tribes providing enlightenment and generating intrigue."
DST_vicious_war_raptors:0 "Vicious War Raptors"
DST_vicious_war_raptors_desc:0 "Vicious mounts that fight alongside their rider in a fury unmatched."
DST_master_headhunters:0 "Master Headhunters"
DST_master_headhunters_desc:0 ""Leave it to me, I take a big weight off your shoulders.""
DST_fleet_preparation:0 "Fleet Preparation"
DST_fleet_preparation_desc:0 "Darkspear shipwrights work day and night to produce the ships we need to return home."
DST_atal_mhuto:0 "Atal-Mhuto"
DST_atal_mhuto_desc:0 "Even the Shadows are not safe for our enemies. The Atal-Mhuto will carve out their hearts."
DST_mastery_of_destroyers:0 "Mastery of Destroyers"
DST_mastery_of_destroyers_desc:0 "We've mastered the sea on the decks of our destroyers - the finest ships the Darkspear have to offer."
DST_watchers_in_the_shadows:0 "Watchers in the Shadows"
DST_watchers_in_the_shadows_desc:0 "Returned home, and Returned Conquerors. The Darkspear have retaken their ancestral home having overcome all trials before them."
DST_loas_gift:0 "Loa's Gift"
DST_loas_gift_desc:0 ""§HNow, I may not be da Loa o’ makin' tings grow, but I am da Loa o’ gettin’ tings done, ya see?"§!"
DST_gurubashi_fury:0 "Gurubashi Fury"
DST_gurubashi_fury_desc:0 "Gurubashi are good at one thing - violence. We can adapt this for our forces who storm the beaches"
DST_supplies_from_orgrimmar:0 "Supplies from Orgrimmar"
DST_supplies_from_orgrimmar_desc:0 "Thrall sends needed aid from Orgrimmar in our time of need. The Horde supports our efforts for now."
DST_godslayers:0 "Godslayers"
DST_godslayers_desc:0 "The fury of a god is no small thing - we must put down the Hakkari and Atal'ai!"

###############################
#focus tree
###############################

DST_classic_zalazanes_betrayal:0 "Zalazane's Betrayal"
DST_classic_zalazanes_betrayal_desc:0 "Zalazane struck out with the voodoo magic he learned under Master Gadrin’s tutelage and hexxed a large portion of the tribe. Those trolls stand as puppets beneath the marionette - slaves to the will of Zalazane who seeks to bring the rest of the tribe into the fold. "

DST_classic_expanding_senjin_village:0 "Expanding Sen'jin Village"
DST_classic_expanding_senjin_village_desc:0 "A village named after the last Chief of the Darkspear, we must seek to grow our roots to provide for our wayward people. This is to be our home for the near future, and if the Darkspear are to survive then the tribe should be mindful of how we proceed."

DST_classic_clearing_out_the_coast:0 "Clearing out the Coast"
DST_classic_clearing_out_the_coast_desc:0 "Makrura plague our coast, haunt the fishermen, and snap their lines. They block our way to the water and introduce a risk to the young of the tribe. Perhaps Master Gadrin or Vornal could use them as reagents."

DST_classic_practical_prey:0 "Practical Prey"
DST_classic_practical_prey_desc:0 "Long have the Darkspear felt kindred with the Raptors of the wild. They carry us astride into battle and fight as lifelong companions for our warriors. Let us provide some additional space for the current stock we have, and maybe they can aid us in the battle to come."

DST_classic_aid_from_orgrimmar:0 "Aid from Orgrimmar"
DST_classic_aid_from_orgrimmar_desc:0 "Lok’tar ogar! Orgrimmar has heard of the Darkspear plight and sends aid. Our allies will not leave us standing alone against this threat. Let us assemble an army capable of sweeping Zalazane into the sea where his cursed soul belongs. "

DST_classic_era_of_adventurers:0 "Era of Adventurers"
DST_classic_era_of_adventurers_desc:0 "Young trolls and orcs venture forth from the valley of trials in droves seeking the world laid before them. Some of these eager individuals have found their way to the village and seem quite competent about accomplishing menial tasks.\nWe did overhear one of them incessantly saying “KEK” however… We asked Master Gadrin to keep an eye on that one."

DST_classic_reinforcements_from_the_den:0 "Reinforcements from the Den"
DST_classic_reinforcements_from_the_den_desc:0 "More recruits leave the valley of trials into this wild world we live in. Sen’jin Village is their first sight upon leaving the secluded valley. Their stay with us may be brief, but they can help us accomplish much with that time."

DST_classic_the_weapons_of_war:0 "The Weapons of War"
DST_classic_the_weapons_of_war_desc:0 "War is uncivilized, brutal, and fatalistic. Zalazane’s uprising across the water represents a dire threat to our people and the tribe must prepare for this coming conflict. We should approach Trayexir, and seek out better equipment."

DST_classic_clear_out_kolkar_crag:0 "Clear out Kolkar Crag"
DST_classic_clear_out_kolkar_crag_desc:0 "The small yet formidable centaur tribe dwelling in the Kolkar Crag represent a threat to our backside as we prepare for this war for survival. We should secure our flank and drive them from the Crag."

DST_classic_infiltrating_the_isles:0 "Infiltrating the Isles"
DST_classic_infiltrating_the_isles_desc:0 "Let us begin seeking wise egresses onto the Isles again. Any intelligence we can collect ahead of the battle ahead will strengthen our people's resolve."

DST_classic_tormented_souls:0 "Tormented Souls"
DST_classic_tormented_souls_desc:0 "The tormented souls of the Darkspear who have perished underneath the tyrannical rule of Zalazane. Their souls forfeit without the guidance of Bwonsamdi... Maybe we can entreat the Loa to assist us with this foe."

DST_classic_putting_them_to_the_test:0 "Putting them to the Test"
DST_classic_putting_them_to_the_test_desc:0 "The Darkspear warriors will drill day and night in preparation for the trial ahead. We must retake our new home and drive his evil from our land."

DST_classic_bargain_with_bwonsamdi:0 "Bargain with Bwonsamdi"
DST_classic_bargain_with_bwonsamdi_desc:0 "Bwonsandi, Lord of the Grave has been a protector of the Darkspear for generations. His shrine lies abandoned on the Isles. We must risk his ire and seek his aid for the fight to come."

DST_classic_zalazanes_fall:0 "Zalazane's Fall"
DST_classic_zalazanes_fall_desc:0 "Death to the betrayer!\nDeath to the traitor\nDeath to Zalazane!"

DST_classic_united_once_more:0 "United Once More"
DST_classic_united_once_more_desc:0 "The Isle is once more ours! We must begin cleaning up the ruination left behind from our fight. Put things right and welcome our people home."

DST_classic_rebuilding_the_isles:0 "Rebuilding the Isles"
DST_classic_rebuilding_the_isles_desc:0 "We've retaken the Echo Isles from the clutches of Zalazane. It is time to repair what was damaged in the battle and improve this place."

DST_classic_restoring_the_ports:0 "Restoring the Ports"
DST_classic_restoring_the_ports_desc:0 "Our fleet will be instrumental in retaking our lost island home. We must construct more naval bases, and prepare for the trials to come."

DST_classic_reviving_the_fleet:0 "Reviving the Fleet"
DST_classic_reviving_the_fleet_desc:0 "It is time to choose how we will move forward in these trying times. A swift and nimble raiding fleet built from Destroyers.. Or a larger, more robust fleet centered around hulking juggernaughts reminiscent of the Second War."

DST_classic_raiding_fleet:0 "Raiding Fleet"
DST_classic_raiding_fleet_desc:0 "The old ways are best. We must remain quick and nimble to outclass our enemies on the high seas."

DST_classic_battle_fleet:0 "Battle Fleet"
DST_classic_battle_fleet_desc:0 "Nimble has its uses, but Big Bad Mojo has it's power and place too."

DST_classic_deal_with_ratchet:0 "Deal with Ratchet"
DST_classic_deal_with_ratchet_desc:0 "The goblins have a schematic for a ship that could take us underwater. Think of the havoc we could cause unseen from the depths."

DST_classic_stick_to_tradition:0 "Stick to Tradition"
DST_classic_stick_to_tradition_desc:0 "Troll Destroyers put fear into the heart of the alliance during the Second War. A danger unseen until it was too late. How fitting would it be to substantiate their fears?"

DST_classic_cooperate_with_orgrimmar:0 "Cooperate with Orgrimmar"
DST_classic_cooperate_with_orgrimmar_desc:0 "Orgrimmar's aid during the struggle with Zalazane was pivotal for our survival. We should teach some of the more sea faring orcs our ways of the water."

DST_classic_gurubashi_legacy:0 "Gurubashi Legacy"
DST_classic_gurubashi_legacy_desc:0 "Gurubashi Ferocity knows no bounds. A worthy doctrine for our forces that will reach the shores first as they must hold the beach head for the rest of our people to arrive."

DST_classic_proudmoores_design:0 "Proudmoore's Design"
DST_classic_proudmoores_design_desc:0 "The Kul'tiran ships that arrived with Daelin Proudmoore struck an imposing figure with their booming cannons and tall masts. We could learn something from the shattered hulks."

DST_classic_modern_firepower:0 "Modern Firepower"
DST_classic_modern_firepower_desc:0 "Something is to be said of the massive booming cannons of a Kul'tiran flagship. Our people know too well the fury of their cannons. Let's petition the goblins of Ratchet for some enlightening aid in our future designs."

DST_classic_darkspear_hold:0 "Darkspear Hold"
DST_classic_darkspear_hold_desc:0 "A place of beginning for the newest members of our tribe. We must settle this place for our people and work towards a better future."

DST_classic_reigniting_the_forges:0 "Reigniting the Forges"
DST_classic_reigniting_the_forges_desc:0 "Zalazane left this place to rot when he seized power. His shambling puppets could not perform complex tasks such as metal working, or carving.. It's time we re-ignite the forge fires."

DST_classic_spitescale_cavern:0 "Spitescale Cavern"
DST_classic_spitescale_cavern_desc:0 "These caverns served to conceal Spitescale foes from our past. We will dedicate this place to Bwonsamdi in honor of those we lost during the struggle of the Echo Isles. "

DST_classic_harvesting_effort:0 "Harvesting Effort"
DST_classic_harvesting_effort_desc:0 "Rebuilding will take plenty of wood, but we must take care to not remove too many trees."

DST_classic_newly_forged_weapons:0 "Newly Forged Weapons"
DST_classic_newly_forged_weapons_desc:0 "The future of our people is set forth in newly made weapons. We must be prepared for anything that comes. Demons, Centaur, Murlocs, or Naga. With the right weapon, they all fall the same."

DST_classic_darkspear_training_grounds:0 "Darkspear Training Grounds"
DST_classic_darkspear_training_grounds_desc:0 "Proper training is the difference between a dead troll, and a living troll. Prepare the training grounds so that we can be prepared to face anything."

DST_classic_offshore_oil:0 "Offshore Oil"
DST_classic_offshore_oil_desc:0 "Oil holds little worth for our destroyers but the goblin technology requires it. It may be worth collecting some if we explore their technology."

DST_classic_bloodtalon_shore:0 "Bloodtalon Shore"
DST_classic_bloodtalon_shore_desc:0 "The raptors that claimed these isles before our coming are fierce, independant creatures. It would do well to remember they are our equals, and fought by our side against the tainted voodoo of Zalazane."

DST_classic_fortifying_the_isles:0 "Fortifying the Isles"
DST_classic_fortifying_the_isles_desc:0 "Never again shall we be cast out into the world. The Darkspear Hold will keep our people for all days to come."

DST_classic_altar_of_hireek:0 "Altar of Hir'eek"
DST_classic_altar_of_hireek_desc:0 "Hir'eek blesses the isle of night. We must leave sacrifices for his blessing in the days to come. His blessing conveys safe passage in the dark of night."

DST_classic_troll_batriders:0 "Troll Batriders"
DST_classic_troll_batriders_desc:0 "Hir'eek's children carry us swiftly through the skies to bring fiery vengeance upon all who challenge us."

DST_classic_unstable_concoction:0 "Unstable Concoction"
DST_classic_unstable_concoction_desc:0 "This concoction of vile ingrediants ignites with a hunger to consume the world. It will burn through ships, structures, flesh or even the vial it was mixed in if left long enough."

DST_classic_liquid_fire:0 "Liquid Fire"
DST_classic_liquid_fire_desc:0 "Fire that spreads like water - truly a devastating weapon. Almost unstoppable in its urge to consume as it splashes across our foes."

DST_classic_the_future_of_the_darkspear:0 "Future of the Darkspear"
DST_classic_the_future_of_the_darkspear_desc:0 "Our path forward lies open to us. We could contribute more for the overall goals of the Horde, or focus on reclaiming our home for the immediate future."

DST_classic_expanding_our_influence:0 "Expanding our Influence"
DST_classic_expanding_our_influence_desc:0 "Our goals to retake our island home are far from our current grasp. We need more resources, and the closer we can find our way to the Island will assist with our future efforts."

DST_classic_preparing_the_fleet:0 "Preparing the Fleet"
DST_classic_preparing_the_fleet_desc:0 "We must prepare a great navy for which to carry our warriors back to our island home. Rally the shipwrights and let us make preparation to avenge Sen'jin and all of those we lost."

DST_classic_claiming_alcaz_island:0 "Claiming Alcaz Island"
DST_classic_claiming_alcaz_island_desc:0 "Alcaz Isle presents a unique opportunity to seize some additional land without incurring difficulties with the Theramore humans."

DST_classic_preparing_a_forward_base:0 "Preparing a Forward Base"
DST_classic_preparing_a_forward_base_desc:0 "Seizing a beachhead will assist in taming this isolated island, and puts us much closer to begin surveying the lost lands."

DST_classic_integrating_alcaz:0 "Integrating Alcaz"
DST_classic_integrating_alcaz_desc:0 "Alcaz will serve well to watch our flanks as we push across the Great Sea. It's position offers a strategic advantage that will keep our enemies on edge."

DST_classic_claiming_the_isles:0 "Claiming the Isles"
DST_classic_claiming_the_isles_desc:0 "These pygymy men are violent savages with no respect towards peace or co-existance. They will feel our spears, and our raptors will feast well."

DST_classic_showdown_with_zarjira:0 "Showdown with Zar'jira"
DST_classic_showdown_with_zarjira_desc:0 "The Sea Witch Zar'jira represents a dark past for our people. Fleeing our shattered isle as our people fall to murloc weapons and foul magic. It is time we visit vengeance upon her."

DST_classic_darkspear_beachhead:0 "Darkspear Beachhead"
DST_classic_darkspear_beachhead_desc:0 "Send the Shadowhunters ahead to lay the path for the tribe. We will follow."

DST_classic_in_memory_of_senjin:0 "In Memory of Sen'jin"
DST_classic_in_memory_of_senjin_desc:0 "The island is far from quiet with the sounds of the wounded and dying. Murlocs still fight in small groups but we've taken control the isles."

DST_classic_horde_commitments:0 "Horde Commitments"
DST_classic_horde_commitments_desc:0 "The Horde has fought by our side from years now. It is past time for us to assist our allies in their struggles."

DST_classic_darkspear_envoys:0 "Darkspear Envoys"
DST_classic_darkspear_envoys_desc:0 "We should consider sending diplomats to some of the isolated tribes and offer them our aid. Zandalar remains eternal on the waves and renewing contact would be wise."

DST_classic_envoy_to_shatterspear:0 "Envoy to Shatterspear"
DST_classic_envoy_to_shatterspear_desc:0 "The Shatterspear lay isolated to the north of Kalimdor. They home is protected by sheer cliffs on all side, with a cave entrance marking the only major entry point. It could prove a strategic location to entrench in if we are to pursue war with the Night Elves."

DST_classic_envoy_to_the_raventusk:0 "Envoy to the Raventusk"
DST_classic_envoy_to_the_raventusk_desc:0 "The Raventusk have already been in frequent diplomatic conversation with the Horde in the past. Their need for aid has only risen as the Vilebranch oppress the wayward tribe. We could bring them into the fold by retaking their tribe's lost lands."

DST_classic_reinforcing_gromgol:0 "Reinforcing Grom'gol"
DST_classic_reinforcing_gromgol_desc:0 "Grom'gol represents a staging ground in the south of the Eastern Kingdoms and provides supplies to Stonard. It would do us well to send additional support as we had extensive experience in the jungles of Stranglethorn."

DST_classic_meeting_with_the_zandalari:0 "Meeting with the Zandalari"
DST_classic_meeting_with_the_zandalari_desc:0 "A courier has arrived from Zul'dazar bearing a message from God King Rastakhan. We would do well to lend our ears."

DST_classic_beheading_hakkar:0 "Beheading Hakkar"
DST_classic_beheading_hakkar_desc:0 "The Gurubashi have given themselves to a dark power. A power that threatens our world. Lok'tar ogar!"

DST_classic_far_off_outposts:0 "Far Off Outposts"
DST_classic_far_off_outposts_desc:0 "The Horde holds many locations across Kalimdor. We would do well to send some of our troops to these locations to assist with keeping the peace."

DST_classic_shadowprey_village:0 "Shadowprey Village"
DST_classic_shadowprey_village_desc:0 "A humble fishing village to assist our peaceful Tauren allies. It could prove useful as a staging ground considering the centaur horde amassing in Desolace."

DST_classic_malakajin:0 "Malaka'jin"
DST_classic_malakajin_desc:0 "Malaka'jin stands in Stonetalon Peak from our days journeying with Thrall. Now it exists as a hunting village that needs protection from Grimtotem Raiders."

DST_classic_legends_of_the_third_war:0 "Legends of the Third War"
DST_classic_legends_of_the_third_war_desc:0 "We lost many in the violence of the Third War but it is time we look forward at what can be learned from the events of the war."

DST_classic_ravasaur_trainers:0 "Ravasaur Trainers"
DST_classic_ravasaur_trainers_desc:0 "The Darkspear Tribe has extensive experience taming raptors, and ravasaurs. We have minor experience with the larger Devilsaur found in Un'goro or on the far away island Zandalar had found."

DST_classic_gift_from_the_zandalari:0 "Gift from the Zandalari"
DST_classic_gift_from_the_zandalari_desc:0 "A clutch of Direhorns have arrived from Zuldazar - gifts from King Rastakhan in hopes of renewing friendly negotiations with all of the wayward Troll Tribes."

DST_classic_vicious_war_raptors:0 "Vicious War Raptors"
DST_classic_vicious_war_raptors_desc:0 "Raptors are cunning, voracious creatures who are fiercely loyal, and incredibly well trained under their rider. These mounts represent the best of our people - troll and raptor fighting side by side."

DST_the_prize_of_ungoro:0 "The Prize of Un'Goro"
DST_the_prize_of_ungoro_desc:0 "Un'goro sits far to the south as a tropical wilderness hidden amidst the mountains but contains a beast like no other - the Devilsaur."

DST_classic_master_headhunters:0 "Master Headhunters"
DST_classic_master_headhunters_desc:0 "§H"It's time for a little blood!"§!\nOur headhunters possess an aim uncanily good at shearing heads from their shoulders."

DST_classic_berserker_training:0 "Berserker Training"
DST_classic_berserker_training_desc:0 "§RIt takes Guts.§!\nTrolls are wild fighters when giving into their base insticts and letting the bloodlust run rampant in their veins."

DST_classic_darkspear_axeman:0 "Darkspear Axeman"
DST_classic_darkspear_axeman_desc:0 "Every troll carries an axe with them - utilitarian, and in a pinch can mean the difference between life and De Other Side."

DST_classic_voodoo_magic:0 "Voodoo Magic"
DST_classic_voodoo_magic_desc:0 "Who Do Voodoo?\n Trolls believe in the primordial powers of Voodoo in all aspects of their life. Witchdoctors representing a respected society with troll culture."

DST_classic_dire_troll_rituals:0 "Dire Troll Rituals"
DST_classic_dire_troll_rituals_desc:0 "Hulking beasts of pure strength that strike fear into the hearts of their enemies. How can you fight something that can rip a horse in two?"

DST_classic_atal_mhuto:0 "Atal-Mhuto"
DST_classic_atal_mhuto_desc:0 "The most well trained of the Shadow Hunters. They possess the finest of gear, and take the most dangerous missions in the field to serve their chieftain."

DST_classic_wood_carvers:0 "Wood Carvers"
DST_classic_wood_carvers_desc:0 "Jungle Wood is springy, and resists change. You just have to know how to coax it into the right shape for the right job."

DST_classic_darkspear_ballista:0 "Darkspear Ballistae"
DST_classic_darkspear_ballista_desc:0 "A piece of you here, a piece of you there... A piece of you waaaaayyy over there, staining the wall."

DST_classic_raptor_carts:0 "Raptor Carts"
DST_classic_raptor_carts_desc:0 "Keep all hands, feet, and other extremities within the cart at all times. The vehicle is hungry"

DST_classic_conquerors_return:0 "Conquerers' Return"
DST_classic_conquerors_return_desc:0 "The Darkspear return victorious and triumphant from the lost isles. Sen'jin's spirit can rest easy now."

DST_classic_godslayers:0 "Godslayers"
DST_classic_godslayers_desc:0 "We return from the jungles of Gurubashi stained with the blood of Hakkar's followers. We are resolved to retake our lost island home more than ever."

###############################
#events
###############################
darkspear_classic.1.t:0 "Betrayed by Kin"
darkspear_classic.1.d:0 "Placeholder: Zalazanes betrayal cut deep for Vol'jin. A lifelong brother whose path was led astray. We escaped with barely the clothes on our backs, and now must choose how to invest our resources."
darkspear_classic.1.option.1:0 "Battles Ahead"
darkspear_classic.1.option.2:0 "Tribe First"

darkspear_classic.2.t:0 "Growing our Tribe"
darkspear_classic.2.d:0 "Placeholder: Orgrimmar sends us supplies in our hour of need, but we can't rely on them forever. Sen'jin Village represents the newest of many homes for the Darkspear. We must look to the needs of our people or risk losing more of our people."
darkspear_classic.2.option.1:0 "Balanced Approach"
darkspear_classic.2.option.2:0 "Civic Needs"

darkspear_classic.3.t:0 "Future of the Darkspear"
darkspear_classic.3.d:0 "Placeholder: A choice lays before us. Continue the path forward with our allies in the Horde, or consider an alternative route where we take a more direct approach."
darkspear_classic.3.option.1:0 "Grow our Influence"
darkspear_classic.3.option.2:0 "Existing Commitments"

darkspear_classic.4.t:0 "Master and Commander"
darkspear_classic.4.d:0 "Placeholder: We must take to the waves in order to regain our lost home. Choices lay ahead for how the Darkspear will reign over the waves. Grok bless our way."
darkspear_classic.4.option.1:0 "Hit and Run"
darkspear_classic.4.option.2:0 "Stand and Fight"

darkspear_classic.5.t:0 "Sea Legs: A tale of two legs"
darkspear_classic.5.d:0 "Placeholder: Orcs can join us on the seas. Definitely do not have experience running a navy after being back, to back World War Azeroth losers."
darkspear_classic.5.option.1:0 "Ouch"
darkspear_classic.5.option.2:0 "Oof."

darkspear_classic.6.t:0 "Tidings from Zul'dazar"
darkspear_classic.6.d:0 "The Soulflayer. The Blood God. The Faceless One. The Loa of Blood.\nHakkar comes.\n\nThe Atal'ai have risen once more in Zul'Gurub, seeking to bring their god back into this world. In their desperation to return to the glory of old, they would bind themselves as slaves to Hakkar, dooming their people to eternal servitude. Zandalar has called for aid to crush this ancient threat, for it poses an unspeakable danger—one that would drown the world in terror and blood. In return, Zandalar offers weapons, supplies, and support for the battles yet to come. "
darkspear_classic.6.option.1:0 "To Kill A God."

darkspear_classic.7.t:0 "Homecoming"
darkspear_classic.7.d:0 "Vol'jin stood amidst the carnage, his expression hardened with grim determination as he took stock of the heavy losses his people had endured to reclaim their home. The smoldering remnants of battle still clung to the air, a testament to the fierce struggle between the Darkspear trolls and the once-endless tides of watery fiends. Piles of murloc corpses marked where the lines had clashed, the ebb and flow of the battle visible in the spots where the troll ranks had buckled beneath the overwhelming mass of the murloc charge.\n\nAhead, the murloc villages lay in ruin with shattered huts, broken idols, and the glittering baubles plundered from the depths now reflecting the flames that flickered across the Isles, stained with the blood of the fallen.\n\nA heavy silence had settled over the island in the aftermath. Trolls gathered around the healing wards, eating their meager rations in quiet, their eyes filled with a wild, haunted light. The battle had been relentless—days of ceaseless fighting as murlocs surged from the depths to drag trolls from their ships, their squelching footfalls ever-present in the night. Haunting cries echoed through the darkness, before a dreaded Mrglgulglrrlglgul would signal another wave of spears and gnashing teeth. Driving them back had come at a terrible cost—lives that could never be restored.\n\nYet, despite it all, the Darkspear once again stood upon their ancestral home, knowing full well that such a price was worth paying for something so priceless.\n"We fled across da sea wit’ da Horde, facin’ trials and foes alike. Strugglin’, both wit’in and wit’out. Our people… we fought gods, fought creatures from da deep, and cast back da demons who sought to end us. It been many years, but now, we come home once more. We gonna rebuild dis place, and we be makin’ a monument to all da bruddas and sistas we lost along da way.” Pausing in his speech before casting eyes upwards and shouting.\n\n§R“Bwonsamdi”§!"
darkspear_classic.7.option.1:0 "The Loa Answers"

darkspear_classic.8.t:0 "Lord of the Grave"
darkspear_classic.8.d:0 "The Loa cast into view like a whip cracking overhead, the smell of a spirit ashes filling the air and a hazy fog settling over the isle.\n“"Eh eh eh, ya don’t gotta be shoutin' like dat, mon. Ol’ Bwonsamdi always be watchin’ over da Darkspear. Now... what is it ya be wantin', hmm?"\n\n"Take da fallen to da Other Side. Let da lives lost here be honored in da afta’life, and may da sacrifices of dese murlocs please ya, as we bring our people back to deir rightful home."\n\n"Ahh, Vol’jin... ya be doin’ well, mon. But don’t ya go forgettin' ‘bout ol' Bwonsamdi’s shrine once ya bring da people back, eh? Best be makin’ plenty o’ sacrifices, ya know? Heh heh… ya wouldn’t wanna disappoint me now, would ya?"\n\nWith a hyena's laugh, the Loa of the Dead transforms into a large troll skull, which snaps shut, collapsing in on itself and crumbles into ash, scattering above the camp. Around the island, the troll corpses flicker to life, consumed by blue, ghostly flames. As their bodies give way to the spectral fire, armor clatters to the ground, leaving behind funeral urns etched with the names of the fallen, dark symbols etched into their pottery.\n\nFrom the soil below, ghostly arms stretch upward, pulling murloc corpses into deep, blackened pools that shimmer like tar, their surfaces contorted with the faces of the damned in silent horror. In mere moments, all that remains of the battle are the urns, the heavy, labored breaths of the surviving trolls, and a soft mist clinging to the island like a shroud of the dead."
darkspear_classic.8.option.1:0 "Praise the Loa"

darkspear_classic.9.t:0 "Triumphant Return"
darkspear_classic.9.d:0 "Placeholder : Darkspear return to the shores of Kalimdor in splendor and glory - having overcome all odds placed before them and re-taken the Darkspear Island. Sen'jin's murderer has been vanquished and the people stand united and wholly able to assist the Horde in their endeavors."
darkspear_classic.9.option.1:0 "For the Horde!"

darkspear_classic.10.t:0 "Ruins of Zul'Gurub"
darkspear_classic.10.d:0 "Placeholder : We've finished up the remnants of the Gurubashi who were loyal to Hakkar. The Atal'ai have been shattered and routed. We can turn our eyes towards reclaiming our lost home."
darkspear_classic.10.option.1:0 "For Sen'jin!"

