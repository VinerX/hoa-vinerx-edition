###############################
#characters
###############################
DST_senjin:0 "Sen'jin"
POLITICS_SENJIN_DESC:0 "A wise and spiritual leader of the Darkspear trolls. One who has a deep connection between the Loa and the spirits that the trolls revere. Torn between the ancient past of his people and their future as a tribe, Sen’jin sets out to seek guidance from the Loa on whether to abandon his Gurubashi ancestry or to embrace it."
POLITICS_SENJIN_SECOND_WAR_DESC:0 " A wise and spiritual leader of the Darkspear trolls. One who has a deep connection between the Loa and the spirits that the trolls revere. He lives a calm and peaceful life upon the darkspear islands, unaware and cut off from the troubles on the mainland."

DST_voljin:0 "Vol'jin"
POLITICS_VOLJIN_DESC:0 ""

DST_rokhan:0 "Rokhan"
POLITICS_VOLJIN_DESC:0 "After the death of chieftan Vol'jin, Rokhan had stepped up to become the new chieftan of the Darkspear tribe"

DST_master_gadrin:0 "Master Gadrin"
DST_vanira:0 "Vanira"
