frostmane.1.t:0 "Message from the Horde"
frostmane.1.d:0 "Our sentry’s have stopped an envoy from the “Orcish Horde” this mysterious race has never been reported in the history of our tribe and has supposed conquered Stormwind and the Dark iron lands. They seek to eradicated Ironforge and Gnomeregan and are offering us lands in exchange for our help."
frostmane.1.option.1:0 "Perhaps an alliance with them could be useful."
frostmane.1.option.2:0 "We do not need the help of these “Orcs”."

