FRT_Guerilla_War:0 "Dun Morogh War"
FRT_Guerilla_War_desc:0 "The Frostmane-Khaz Modon conflict has been ongoing for a number of decades, maybe even centuries for control over western Dun Morogh. Now Frostmane engages in Guerilla Conflict to try and overcome their enemy."
FRT_Winterax_Exiles:0 "Winterax Tribe Exiles"
FRT_Winterax_Exiles_desc:0 "The Winterax Tribe was the other Ice Troll Tribe to flee Northrend. After they fled to Alterac, its presumed they were defeated as exiles keep slowly trickling into Frostmane through the mountains."
