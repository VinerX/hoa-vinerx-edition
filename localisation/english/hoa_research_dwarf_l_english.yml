dwarf_thane_tech:0 "Thane"
dwarf_thane_tech_desc:0 "Oer armies are led by th' voice o' tha' thanes, who drive 'em tah battle against oer foes."
dwarf_thane_training_tech_1:0 "Thane Training"
dwarf_thane_training_tech_1_desc:0 "Th' new book o' war fer th' thanes improves their leadership by providin' concise orders."
dwarf_thane_training_tech_2:0 "Thane Training II"
dwarf_thane_training_tech_2_desc:0 "Assignin' nimble lads as runners fer tha' thanes will allow their voice to reach further."
dwarf_thane_training_tech_3:0 "Thane Training III"
dwarf_thane_training_tech_3_desc:0 "Equippin' th' thanes an' their lads wit' signal horns an' banners greatly increases th' ability fer them tah communicate across th' field."
dwarf_thane_training_tech_4:0 "Thane Training IV"
dwarf_thane_training_tech_4_desc:0 "Extensive drillin' by tha' thanes will teach th' fightin' lads how to coordinate wit' their thanes wit'oot delay."

