dwarf_rifleman_equipment_3_desc:0 "Modernized equipment fer oer riflemen, includin' thorium bullets allows 'em tah punch through light armor plate."

dwarf_engineer_tech:0 "Engineer"
dwarf_engineer_tech_desc:0 "Few can match th' merits o' Dwarven ingenuity! Assigning engineers to oer armies is vital fer buildin' defenses an' clearin' obstructions."
dwarf_engineer_training_tech_1:0 "Improved Engineer I"
dwarf_engineer_training_tech_1_desc:0 "Expandin' th' role of oer engineers by givin' them full kits will give them new capabilities."
dwarf_engineer_training_tech__2:0 "Improved Engineer II"
dwarf_engineer_training_tech__2_desc:0 "Th' latest explosives from th' forges mean oer lads can clear oot land quicker than before."
dwarf_engineer_training_tech__3:0 "Improved Engineer III"
dwarf_engineer_training_tech__3_desc:0 "New supply kits allow fer battlefield projects tha' rival th' civilan works back in oer holds."
dwarf_engineer_training_tech__4:0 "Improved Engineer IV"
dwarf_engineer_training_tech__4_desc:0 "Advanced tactics allow oer engineers to quickly redeploy their stoot legs to any sector on th' field."

dwarf_runecarvers_sanctum_tech:0 "Runecarver's Sanctum"
dwarf_runecarvers_sanctum_tech_desc:0 ""

dwarf_rune_priest:0 "Rune Priest"
dwarf_rune_priest_tech:0 "Rune Priest"
dwarf_rune_priest_tech_desc:0 "Th' rune priests are apart o' th' mystics. Their magic will soothe th' wounds o' oer lands faster than traditional means."
dwarf_rune_priest_training_tech_1:0 "Rune Priest Training"
dwarf_rune_priest_training_tech_1_desc:0 "Equippin' oer priests wit' armored robes means they can venture farther into tha' battlefield."
dwarf_rune_priest_training_tech_2:0 "Rune Priest Training II"
dwarf_rune_priest_training_tech_2_desc:0 "Supplyin' th' priests wit' th' means to establish temporary wards on th' fields will improve their healin' capabilities."
dwarf_rune_priest_training_tech_3:0 "Rune Priest Training III"
dwarf_rune_priest_training_tech_3_desc:0 "Further research an' experimentation wit' magic will enhance th' prowess o' oer priests."
dwarf_rune_priest_training_tech_4:0 "Rune Priest Training IV"
dwarf_rune_priest_training_tech_4_desc:0 "Settin' a formal hierarchy fer oer priests, attached to tha' o' oer fightin' lads will grant them th' authority to act wit'oot delay."

