dwarf_mustering_hall_tech:0 "Mustering Hall"
dwarf_mustering_hall_tech_desc:0 "When th' Thanes call fer war, oer lads will answer th' call."

dwarf_axeman_equipment_tech_1:0 "Axeman Equipment"
dwarf_axeman_tech:0 "Axeman"
dwarf_axeman_tech_desc:0 "Th' frontline mus' be held, an' th' axemen will defend it."
dwarf_axeman_equipment:0 "Axeman Equipment"
dwarf_axeman_equipment_desc:0 "Standard axes typically meant fer harvestin' lumber."
dwarf_axeman_equipment_1:0 "Axeman Equipment I"
dwarf_axeman_equipment_1_desc:0 "Refinin' oer axes fer splittin' skulls will do oer axemen many favors."
dwarf_axeman_iron_constitution_tech:0 "Iron Constitution"
dwarf_axeman_iron_constitution_tech_desc:0 ""
dwarf_axeman_brutal_blows_tech:0 "Brutal Blows"
dwarf_axeman_brutal_blows_tech_desc:0 ""
dwarf_axeman_equipment_2:0 "Axeman Equipment II"
dwarf_axeman_equipment_2_desc:0 "Splittin' th' development o' waraxes into throwin' axes an' heavy two-handers means oer lads can adapt in battle."
dwarf_axeman_close_combat_experts_tech:0 "Close Combat Drills"
dwarf_axeman_close_combat_experts_tech_desc:0 ""
dwarf_axeman_uproar_tech:0 "Bolstering Uproar"
dwarf_axeman_uproar_tech_desc:0 ""
dwarf_axeman_equipment_3:0 "Axeman Equipment III"
dwarf_axeman_equipment_3_desc:0 "Improvin' th' durability o' oer axes to be as sturdy as moontain rock will allow 'em to go further."

dwarf_enforcer_tech:0 "Enforcer"
dwarf_enforcer_tech_desc:0 "Th' thanes must 'ave order, thus they rely on th' enforcers to maintain it."
dwarf_enforcer_training_tech_1:0 "Improved Enforcer I"
dwarf_enforcer_training_tech_1_desc:0 "Further incorporation o' enforcers among th' fightin' lads improves their effectiveness in supressin' rebel-rousers."
dwarf_enforcer_training_tech_2:0 "Improved Enforcer II"
dwarf_enforcer_training_tech_2_desc:0 "An improved hierarchy means th' enforcers can respond faster against those tha' threaten th' thanes' law."
dwarf_enforcer_training_tech_3:0 "Improved Enforcer III"
dwarf_enforcer_training_tech_3_desc:0 "Supplyin' oer enforcers wit' incentives will keep th' populace sated."
dwarf_enforcer_training_tech_4:0 "Improved Enforcer IV"
dwarf_enforcer_training_tech_4_desc:0 "A sub-unit o' enforcers dedicated tah intelligence gatherin' will allow them to root oot problems before they arise."

dwarf_mountaineer_tech:0 "Mountaineer"
dwarf_mountaineer_tech_desc:0 "All proper dwarven lads live in oer close tah th' mootains. Specializin' them fer navigatin' oer moontains comes with nae thought."
dwarf_mountaineer_training_tech_1:0 "Improved Mountaineer I"
dwarf_mountaineer_training_tech_1_desc:0 "New trainin' fer oer mountaineers will endure them fer even th' toughest mootains."
dwarf_mountaineer_training_tech__2:0 "Improved Mountaineer II"
dwarf_mountaineer_training_tech__2_desc:0 "Developin' lighter equipment fer oer mountainers will allow 'em to carry more, oer move quicker dependin' on their mission."
dwarf_mountaineer_training_tech__3:0 "Improved Mountaineer III"
dwarf_mountaineer_training_tech__3_desc:0 "Utilizin' ram transports fer th' moontainers extends their capabilities."
dwarf_mountaineer_training_tech__4:0 "Improved Mountaineer IV"
dwarf_mountaineer_training_tech__4_desc:0 "Oer moontainers are draftin' a school o' tactics specifically fer moontain warfare. Wit' this, they'll secure th' advantage in battle."

dwarf_rifleman:0 "Rifleman"
dwarf_rifleman_equipment_tech_1:0 "Rifleman Equipment"
dwarf_rifleman_tech:0 "Rifleman"
dwarf_rifleman_tech_desc:0 "Oer armies are famed across th' land—especially fer oer lads in blue."
dwarf_rifleman_equipment:0 "Rifleman Equipment"
dwarf_rifleman_equipment_desc:0 "Prototype firearms developed an' tested fer use by oer fightin' lads."
dwarf_rifleman_equipment_1:0 "Rifleman Equipment I"
dwarf_rifleman_equipment_1_desc:0 "Refined rifle designs tha' improve handlin' an' ease o' use fer riflemen."
dwarf_rifleman_solid_core_tech:0 "Solid Core"
