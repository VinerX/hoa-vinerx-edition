dwarf_administration_folder:0 "Dwarf Administration"
dwarf_administration_folder_desc:0 ""

dwarf_hovel_tech:0 "Dwarf Hovel"
dwarf_hovel_tech_desc:0 "Every lad with a beard ooght tah 'ave a home for hisself."
dwarf_hold_tech:0 "Dwarf Hold"
dwarf_hold_tech_desc:0 "Th' thanes require more than a hovel if they're tah oversee their kinsmen."
dwarf_great_hall_tech:0 "Great Hall"
dwarf_great_hall_tech_desc:0 "We shall sing th' songs o' oer moontain kings within these halls!"

dwarf_craftsman_tech:0 "Craftsman"
dwarf_craftsman_tech_desc:0 "Th' craftsmen are th' backbone o' oer clan. From miners tah smiths, they make it all. Better yet, they can be put tah use on th' battlefield as well."
dwarf_tools_equipment:0 "Dwarf Tools"
dwarf_tools_equipment_tech:0 "Dwarf Tools"
dwarf_tools_equipment_desc:0 "All th' essentials a lad needs whether in th' workshop or on th' march."
dwarf_tools_equipment_1:0 "Dwarf Tools"
dwarf_tools_equipment_1_desc:0 "All th' essentials a lad needs whether in th' workshop or on th' march."
dwarf_craftsman_training_tech_1:0 "Craftsman Training"
dwarf_craftsman_training_tech_1_desc:0 "Military engineers amongst th' craftsmen know how tah break t'roogh enemy forts, and how tah strengthen oer oon as well."
dwarf_craftsman_training_tech_2:0 "Improved Craftsman II"
dwarf_craftsman_training_tech2_desc:0 "Stoot dwarves need stoot bridges, th' craftsmen can take care o' that."
dwarf_craftsman_training_tech_3:0 "Improved Craftsman III"
dwarf_craftsman_training_tech_3_desc:0 "City architects know th' ins 'n' oots o' settlements. They can take advantage o' th' twight twistin' corridors an' density o' buildings."
dwarf_craftsman_training_tech_4:0 "Improved Craftsman IV"
dwarf_craftsman_training_tech_4_desc:0 "After studyin' the structure o' the Dark Portal, the craftsmen are confident in dismantlin' th' enemy's line around it an' other gateways."

dwarf_miner_tech:0 "Miners"
dwarf_miner_tech_desc:0 "Support crews o' oer minin' lads assist th' clansmen in battle by fortifyin' th' lines."
dwarf_miner_training_tech_1:0 "Miner Training"
dwarf_miner_training_tech_1_desc:0 "Cross-trainin' miners under th' clansmen prepares 'em for th' field."
dwarf_miner_training_tech_2:0 "Miner Training II"
dwarf_miner_training_tech_2_desc:0 "Specialized armor for oer miners makes 'em better at their jobs."
dwarf_miner_training_tech_3:0 "Miner Training III"
dwarf_miner_training_tech_3_desc:0 "New excavatin' tools make for faster trenches."
dwarf_miner_training_tech_4:0 "Miner Training IV"
dwarf_miner_training_tech_4_desc:0 "Prototype weapons from oer engineers is th' edge in battle."

dwarf_mining_tools_tech:0 "Mining Tools I"
dwarf_mining_tools_tech_desc:0 "A true dwarf can break ore wit' his head, but picks make it easier."
dwarf_mining_tools_tech_2:0 "Mining Tools II"
dwarf_mining_tools_tech_2_desc:0 "Tah break t'roogh 'arder stone means havin' harder picks."
dwarf_mining_tools_tech_3:0 "Mining Tools III"
dwarf_mining_tools_tech_3_desc:0 "New pick forgin' techniques allow us tah get cleaner ore."
dwarf_mining_tools_tech_4:0 "Mining Tools IV"
dwarf_mining_tools_tech_4_desc:0 "Specialized tools for carvin' oot th' strongest o' materials means nothin' can hold oer lads back."
dwarf_mining_tools_tech_5:0 "Mining Tools V"
dwarf_mining_tools_tech_5_desc:0 "Addin' experimental ore-finders will mean oer lads are gettin' more in a day than before."

dwarf_ore_mine_tech:0 "Ore Mine"
dwarf_ore_mine_tech_desc:0 "Mining from th' surface only gets us so far. We were always meant tah be undergroond!"
dwarf_mine_cart_tech_1:0 "Mine Carts I"
dwarf_mine_cart_tech_1_desc:0 "Th' lads are hardy, but cannae carry more in bags. Sendin' carts o'er tah 'em will help 'em oot."
dwarf_mine_cart_tech_2:0 "Mine Carts II"
dwarf_mine_cart_tech_2_desc:0 "Developin' railway tracks means ore can be hauled oot faster."
dwarf_mine_cart_tech_3:0 "Mine Carts III"
dwarf_mine_cart_tech_3_desc:0 "Wit' a bit o' dwarven engineerin', we can reinforce these carts tah haul more."
dwarf_mine_cart_tech_4:0 "Mine Carts IV"
dwarf_mine_cart_tech_4_desc:0 "Automatin' the cart lines means more lads with picks in their hands."

dwarf_craftsman_tools_tech:0 "Craftsman Tools I"
dwarf_craftsman_tools_tech_desc:0 "Many o' oer craftsmen make by hand. Givin' them tools will allow 'em tah do more."
dwarf_craftsman_tools_tech_2:0 "Craftsman Tools II"
dwarf_craftsman_tools_tech_2_desc:0 "Standardized designs for oer tools means th' workshops can interchange parts."
dwarf_craftsman_tools_tech_3:0 "Craftsman Tools III"
dwarf_craftsman_tools_tech_3_desc:0 "No design is like oer design, but it woold nae hurt tah take 'inspiration' from o'er folk like the wee gnomes."
dwarf_craftsman_tools_tech_4:0 "Craftsman Tools IV"
dwarf_craftsman_tools_tech_4_desc:0 "Oer bright lads 'ave thooght up new designs, let's put 'em tah th' test."
dwarf_craftsman_tools_tech_5:0 "Craftsman Tools V"
dwarf_craftsman_tools_tech_5_desc:0 "Modernizin' all oer tools tah th' dwarf standard means no lack o' progress."

dwarf_workshop_tech:0 "Workshop"
dwarf_workshop_tech_desc:0 "It's been said by many lasses that th' workshop is a dwarf's o'er home. They are essential in producin' anythin' th' clan needs."

dwarf_foundry_tech:0 "Foundry"
dwarf_foundry_tech_desc:0 "Foondaries are oer specialized workshops that produced arms for th' clansmen."

dwarf_reinforced_iron_armor_tech:0 "Reinforced Iron Armor"
dwarf_reinforced_iron_armor_tech_desc:0 "Iron is simple an' robust, and can be used fer th' personal protection o' th' clansmen."
dwarf_reinforced_mithril_armor_tech:0 "Reinforced Mithril Armor"
dwarf_reinforced_mithril_armor_tech_desc:0 "A shinin' silvery metal lighter than iron but with th' same durability. Th' clansmen will be able tah equip more armor without burden."
dwarf_reinforced_thorium_armor_tech:0 "Reinforced Thorium Armor"
dwarf_reinforced_thorium_armor_tech_desc:0 "Once known as th' strongest o' metals, this hard metal is heavy an' strong. Th' frontline o' clansmen who require th' heaviest armor will benefit from this."
dwarf_reinforced_dark_iron_armor_tech:0 "Reinforced Dark Iron Armor"
dwarf_reinforced_dark_iron_armor_tech_desc:0 "A rare ore from th' depths o' Blackrock Moontain. Oer clansmen are best protected by this armor than any o'er."

dwarf_reinforced_iron_plating_tech:0 "Reinforced Iron Plating"
dwarf_reinforced_iron_plating_tech_desc:0 "Iron is simple an' robust, and can be used fer oer armored vehicles."
dwarf_reinforced_mithril_plating_tech:0 "Reinforced Mithril Plating"
dwarf_reinforced_mithril_plating_tech_desc:0 "A shinin' silvery metal lighter tha' iron but with th' same durability. Oer steamtanks an' th' like can fashion thicker plates than before."
dwarf_reinforced_thorium_plating_tech:0 "Reinforced Thorium Plating"
dwarf_reinforced_thorium_plating_tech_desc:0 "Once known as th' strongest o' metals, this hard metal is heavy an' strong. Th' spearhead o' oer steamtanks will last longer under enemy fire wit' thorium armor."
dwarf_reinforced_dark_iron_plating_tech:0 "Reinforced Dark Iron Plating"
dwarf_reinforced_dark_iron_plating_tech_desc:0 "A rare ore from th' depths o' Blackrock Moontain. Oer armored vehicles will be more resilient than ever wit' dark iron armor plating."

dwarf_forge_tech:0 "Dwarven Forges I"
dwarf_forge_tech_desc:0 "Even th' most basic o' forges can produce steamtanks amongst o'er tools."
dwarf_forge_tech_2:0 "Dwarven Forges II"
dwarf_forge_tech_2_desc:0 "Specialized casts an' molds make oer craftsmen more efficient."
dwarf_forge_tech_3:0 "Dwarven Forges III"
dwarf_forge_tech_3_desc:0 "Stronger bellows make fer hotter fires in oer forges."
dwarf_forge_tech_4:0 "Dwarven Forges IV"
dwarf_forge_tech_4_desc:0 "Usin' newer heat-resistant metals makes oer forges stronger, more durable, and capable o' doin' more."
dwarf_forge_tech_5:0 "Dwarven Forges V"
dwarf_forge_tech_5_desc:0 "We can mimic th' foondries o' th' Great Forge itself across th' clan-lands. Nae forge o' o'er folk will ever compare."

dwarf_underground_development_tech:0 "Underground Development I"
dwarf_underground_development_tech_desc:0 "By master-plannin' oer moontain holds, we can improve oer efficiency by focusin' production at key sites."
dwarf_underground_development_tech_2:0 "Underground Development II"
dwarf_underground_development_tech_2_desc:0 "Integratin' th' different wards t'roogh connectin' tunnels makes th' job easier fer oer kinsmen."
dwarf_underground_development_tech_3:0 "Underground Development III"
dwarf_underground_development_tech_3_desc:0 "Oer miners 'ave discovered a new technique o' stabilizing tunnels. Wit' their help, we can expand th' size o' oer holds."
dwarf_underground_development_tech_4:0 "Underground Development IV"
dwarf_underground_development_tech_4_desc:0 "Developin' industrial wards fer specific purposes in oer holds concentrates oer craftsmen together, meanin' bigger workshops an' more o' 'em."
dwarf_underground_development_tech_5:0 "Underground Development V"
dwarf_underground_development_tech_5_desc:0 "Nae o'er can match th' capabilities o' oer holds. Wit' th' latest tools, we can build deeper than ever before."

dwarf_arsenal_tech:0 "Arsenal"
dwarf_arsenal_tech_desc:0 ""

dwarf_iron_axes_tech:0 "Iron Axes"
dwarf_iron_axes_tech_desc:0 "Iron is simple an' robust, and can be used fer oer axemen an' Rams."
dwarf_mithril_axes_tech:0 "Mithril Axes"
dwarf_mithril_axes_tech_desc:0 "A shinin' silvery metal lighter than iron but with th' same durability. Oer axemen can carry more o' these, givin' 'em an edge in battle."
dwarf_thorium_axes_tech:0 "Thorium Axes"
dwarf_thorium_axes_tech_desc:0 "Once known as th' strongest o' metals, this hard metal is heavy an' strong. Givin' these tah clansmen like the Rams means a more powerful strike each time."
dwarf_dark_iron_axes_tech:0 "Dark Iron Axes"
dwarf_dark_iron_axes_tech_desc:0 "A rare ore from th' depths o' Blackrock Moontain. Th' strength o' oer axemen an' riders will be unmatched wit' dark iron."

