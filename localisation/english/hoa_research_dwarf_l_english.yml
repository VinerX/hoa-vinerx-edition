dwarf_iron_barrels_tech:0 "Iron Barrels"
dwarf_iron_barrels_tech_desc:0 "Iron is simple an' robust, and can be used fer storin' munitions an' other equipment for all oer clansmen."
dwarf_mithril_barrels_tech:0 "Mithril Barrels"
dwarf_mithril_barrels_tech_desc:0 "A shinin' silvery metal lighter than iron but with th' same durability. Reducin' th' weight o' barrels means faster transportation."
dwarf_thorium_barrels_tech:0 "Thorium Barrels"
dwarf_thorium_barrels_tech_desc:0 "Once known as th' strongest o' metals, this hard metal is heavy an' strong. Thorium barrels can be used tah safely transport materials like gunpowder."
dwarf_dark_iron_barrels_tech:0 "Dark Iron Barrels"
dwarf_dark_iron_barrels_tech_desc:0 "A rare ore from th' depths o' Blackrock Moontain. Th' hardiest o' clansmen need th' hardiest o' barrels, an' dark iron provides."

