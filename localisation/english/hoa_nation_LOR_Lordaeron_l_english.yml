LOR_lights_defenders:0 "Silverhand Knights"
LOR_lights_defenders_desc:0 ""

 LOR_eyes_to_eastweald:0 "Eyes to Eastweald"
 LOR_eyes_to_eastweald_desc:0 "The Eastweald is a stretch of fertile foothills located east of the Tirisfal Glades. The our second largest city Stratholme which our operatives have identified as another target to try to lessen the courts stranglehold over the kingdom."
 LOR_the_far_east:0 "The Far East"
 LOR_the_far_east_desc:0 ""

 LOR_reward_the_downtrodden:0 "The Loyal Downtrodden"
 LOR_reward_the_downtrodden_desc:0 "The People of both north and westdale have had to manage on their own against the pests on their lands, with the citizen of Westdale needing to fend of spiders for nearly a year, and the milita of Northdale chasing the trolls back over the border, yet they still were willing to help our labourers fix the roads."
 LOR_appease_tyrs_hand:0 "Appease Tyrs Hand"
 LOR_appease_tyrs_hand_desc:0 "The Settlements to the East of Tyrs Hand seem to be in some form of rebellion, a silent one at that, we should investigate this issue at once."
 LOR_a_warm_guesture:0 "A Warm Guesture"
 LOR_a_warm_guesture_desc:0 "While returning from mission in the East one of our men was caught in a sudden downpour, and sought shelter at a small Stead near the Crown Guard Tower, the Family welcomed him into their home and he spoke with them for a time, when the rain had ceased they gave him a new cloak that their mother had made."

 LOR_lights_hope_chapel:0 "Lights Hope Chapel"
 LOR_lights_hope_chapel_desc:0 "It would seem that the Chapel has suffered some damage over the years, we have once again found evidence of funds that should have gone towards its renovations instead being sent to the lands east Tyr's Hand"
 LOR_crown_guard_towers:0 "Crown Guard Towers"
 LOR_crown_guard_towers_desc:0 ""
 LOR_the_kings_road_desc:0 "While our labourers were improving the road linking the Capital to Stratholme, a number of concerns were raised over the lack of visability in some of the more wooded areas, while the court may be against the idea of constructing watch towers as a whole, we have sown the idea in some of their minds that they may be able to draw taxes from the land owners."
 LOR_banewood_whalers:0 "Banewood Whalers"
 LOR_banewood_whalers_desc:0 "The Men and Women who make a living stripping oil and meat from whales that dwell in the north sea do a task that most take for granted, in return for Improving their working and living standards we will recuit a few of them to help find any shipping inconsistencies for us, as no one pays close attention to someone who reeks of whale fat."

 LOR_easten_lumbermills:0 "Eastern Lumbermills"
 LOR_easten_lumbermills_desc:0 "Of all the mismanagement the Courts have caused this is the only one we can say for certain is not terrible. The Administation has been purchasing materials for projects that were either canceled or were never planned at all, the Lumber for these projects were never collected and the mills have simply kept them in storage all this time, we should reward the workers for their service."
 LOR_a_new_vintage:0 "A New Vintage"
 LOR_a_new_vintage_desc:0 "Corins Crossing has become a very popular fork in the road, it would seem that someone has set up a Vinyard in the North East and has begun supplying the town with wine."
 LOR_welcomed_guests:0 "Welcomed Guests"
 LOR_welcomed_guests_desc:0 "We were shocked to discover that in the port city of Hasic that sizable number of Gryphons had begun nesting in the region, we approached one of the wildhammer dwarves in the area and she said that if they wish to live in our land the wildhammers are not going to stop them, we just need to train them outselves."

 LOR_loose_lips:0 "Loose Lips"
 LOR_loose_lips_desc:0 "The Administration knew of its own shortcomings and attempted to rectify this issue by using the local administration in Stratholme to lessen this shortfall in the East, little did they know the admin in Stratholme was under the control of the Court, no heads will roll for this it was a matter of trust, nothing more."
LOR_restrain_the_court:0 "Restrain The Court"
LOR_restrain_the_court_desc:0 "The Courts Power has wained, now it only contains those too scared to go against us, or those who are skilled enough to be of aid to the kingdom."
 LOR_decade_late_census:0 "A Decade Late Census"
 LOR_decade_late_census_desc:0 "The Census Date we have is from 582, its been over a decade since we have correctly alocated funding to regions of kingdom that are in need of it."
 LOR_the_matter_of_hearthglen:0 "The Matter of Caer Darrow"
 LOR_the_matter_of_hearthglen_desc:0 "Caer Darrow is an old fortress built around an elven runestone that has been part of Lordaeron for as long as records show. Its owners, the Barov family, also own the deeds to Brill, Tarren Mill and Southshore, which makes working in those areas difficult. It is advised we transform Caer Darrow into a principality to reduce the family's ability to hinder our efforts, or offer them some form of tax incentives."

