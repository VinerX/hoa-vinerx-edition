LOR_durnholde_keep_fortification_desc:0 ""
LOR_feed_the_industry:0 "Feed the Forges"
LOR_feed_the_industry_desc:0 "The Coal Makers Union has answered our call to war, they have identified an area of the kingdom that they plan to clear cut and mass produce coal for the forges, the commoners however will not enjoy their lively hoods being destroyed, but they wont be complaining if the Orcs kill them."
