 LOR_the_lordaeron_admiralty:0 "Lordaeron Admiralty"
 LOR_the_lordaeron_admiralty_desc:0 "The Lordaeron Admitalty is a cobbled together organization, formed mostly by members hand picked by the church, at least 4 of its members have warrants for their arrest for privateering."

 LOR_meeting_of_the_seven_kingdoms_alliance:0 "Meeting of the Seven Kingdoms"
 LOR_meeting_of_the_seven_kingdoms_alliance_desc:0 "We have recently attended the Meeting of the Seven Kingdoms, our citizens seem to be in favour of a greater alliance against possible invaders."

 LOR_meeting_of_the_seven_kingdoms_neutral:0 "Meeting of the Seven Kingdoms"
 LOR_meeting_of_the_seven_kingdoms_neutral_desc:0 "We have recently attended the Meeting of the Seven Kingdoms, our citizens seem to be in favour of a greater alliance against possible invaders."

 LOR_Valad_Toreps:0 "Lord Valad Toreps"
 LOR_Valad_Toreps_desc:0 "The noble Lord Valad Toreps, visiting from Stormwind, has won the support of many nobles and has the ability to sway many of our political decisions."

 LOR_lianne_menethil:0 "Lady Lianne Menethil"
 LOR_prince_arthas_menethil:0 "Prince Arthas Menethil"
 LOR_princess_calia_menethil:0 "Princess Calia Menethil"

 LOR_era_of_peace:0 "Era of Peace"
 LOR_era_of_peace_desc:0 "For many years now, Lordaeron has enjoyed relative peace and prosperity. However, this peace has led to a stagnation of the kingdom's military forces. With no recent conflicts to test their mettle, many soldiers have grown complacent and ill-prepared for the horrors of war."
 LOR_a_looming_threat_idea:0 "A Looming Threat"
 LOR_a_looming_threat_idea_desc:0 "Our citizens have not faced a war in their lifetime, nor have any of their parents before them, we have sent word to the far edges of the kingdom of a looming threat."
 LOR_pacification_army_idea:0 "Pacification Army"
 LOR_pacification_army_idea_desc:0 "We have continued to build the army under the premise that even if we do not end up going to war, the men and women who are trained will be better suited to fend off any threat their city or village might face."
 LOR_make_them_bleed:0 "Make Them Bleed"
 LOR_make_them_bleed_desc:0 "Too many good men and women have died to these black blooded savages, we cannot allow them a foothold in our lands or any other for that matter!"

 LOR_workshop_decree_idea:0 "Workshop Assistance Decree"
 LOR_workshop_decree_idea_desc:0 "The King has issued a Decree that workshops may be called upon in times of war to be turned into military forges if they are needed."

 LOR_naval_apprentices:0 "Novice Shipbuilders"
 LOR_naval_apprentices_desc:0 "It would seem that our plan to offer hot meals instead of payment for services has given us a number of new workers in our shipyards, unfortunaly some of them are of fighting age."

 LOR_mothballed_fleet:0 "Mothballed Fleet"
 LOR_mothballed_fleet_desc:0 "Having not seen combat in decades Lordaerons fleet has been made obsolete, it sits in her ports undermanned with barely enough supplies to carry out missions against Murlocs and pirates."
 LOR_mothballed_fleet_2:0 "Mothballed Fleet"
 LOR_mothballed_fleet_2_desc:0 "Having not seen combat in decades Lordaerons fleet has been made obsolete, it sits in her ports undermanned with barely enough supplies to carry out missions against Murlocs and pirates."
 LOR_mothballed_fleet_3:0 "Mothballed Fleet"
 LOR_mothballed_fleet_3_desc:0 "Having not seen combat in decades Lordaerons fleet has been made obsolete, it sits in her ports undermanned with barely enough supplies to carry out missions against Murlocs and pirates."

 LOR_courts_of_lordaeron_1:0 "Courts of Lordaeron"
 LOR_courts_of_lordaeron_1_desc:0 "The court of Lordaeron is a hotbed of intrigue and power struggles among the elites of the kingdom. Advisors to the king wield significant influence, and factions constantly maneuver for position and control"
 LOR_courts_of_lordaeron_2:0 "Courts of Lordaeron"
 LOR_courts_of_lordaeron_2_desc:0 "The court of Lordaeron is a hotbed of intrigue and power struggles among the elites of the kingdom. Some of the less troublesome advisors have been brought to heel, but the other members of the court still do not seem to know their place"
 LOR_courts_of_lordaeron_3:0 "Courts of Lordaeron"
 LOR_courts_of_lordaeron_3_desc:0 "The Court of Lordaeron has been throughly restrained in their actions against the Kingdom, it will not be long before we have them under control and have weeded out all nobles who would use thier position to undermine the kings Authority"

 LOR_poor_administration_1:0 "Poor Administration"
 LOR_poor_administration_1_desc:0 "Years of stagnation and the sheer size of the Kingdom of Lordaeron have taken a toll on the kingdom's administration. The bureaucracy is bloated and inefficient, and corruption is rampant. With so many regions and cities to oversee, it is difficult to maintain order and enforce the law"
 LOR_poor_administration_2:0 "Poor Administration"
 LOR_poor_administration_2_desc:0 "Years of stagnation and the sheer size of the Kingdom of Lordaeron have taken a toll on the kingdom's administration. While we had been able to remove some wasteful elements in the administration we have a long way to go before the system is fully reformed"
 LOR_poor_administration_3:0 "Stabilized Administration"
 LOR_poor_administration_3_desc:0 "It has taken longer then expected, but we have brought the administration to a controlable level of incompetence, we still have work to do, but at least now the citizens wont need to worry about the bread being taxes from their hands"

 LOR_stromgarde_assistance:0 "Stromgarde Assistance"
 LOR_stromgarde_assistance_desc:0 "We have accepted a large number of Stromic settlers from the contested areas between Stromgarde and Alterac, King Trollbane has noticed our hospitality and being the "Peoples King" has decided to provide assistance to all citizens of the neighbouring territories, we have been able to spin this as a diplomatic treating and as such have given our administration a minor reprieve"

 LOR_land_purchases:0 "Land Purchases"
 LOR_land_purchases_desc:0 "We have a list of all the individuals who accepted the purchase offer on their lands, many of them are known associates to the court."

 LOR_citizen_turmoil:0 "Currency Turmoil"
 LOR_citizen_turmoil_desc:0 "The Common Folk are considerably upset over having the value of what small wealth they currently have lessened, but it is a step we must make to avoid needing to expand our administation any further."

 LOR_open_currency:0 "Open Currency"
 LOR_open_currency_desc:0 "We have sent Envoys to nations we trade with informing them of the planned currency shift, and the agreement that any mint they currently hold will be valued equally for the next six months."

 LOR_tax_exemption:0 "Limited Tax Exemptions"
 LOR_tax_exemption_desc:0 "In order to free up land for use from the Barov family we have needed to provide them with Tax Exemptions to grease their palms."

 LOR_surplus_materials:0 "Surplus Lumber"
 LOR_surplus_materials_desc:0 "Due to some administrative hiccups we had more building materials then first thought."

