LOR_hillsbrad_resettlement:0 "Hillsbrad Resettlement"
LOR_hillsbrad_resettlement_desc:0 "New boats arrive every day, carrying more and more souls who fled in the hordes wake, many of the citizens of Hillsbrad have become outraged as they now find their quite streets filled with vagrants, and their nights guarding their poultry from hungry refugees."
LOR_westfall_farmers:0 "Westfall Farmers"
LOR_westfall_farmers_desc:0 "80% of the population of Westfall were farmers before the orcish horde tore through the lands, many of those who were displaced were older and are unable, or unwilling to take up the sword, as such we will give them the ability to till the lands again."
LOR_vengeful_commoners:0 "Vengeful Commoners"
LOR_vengeful_commoners_desc:0 "Many of the Refugees from Stormwind have taken to drinking to deal with their suffering, many of them are able to be contained by a firm hand an kind words, others have given the guards a considerable fight even bare fisted, one of the advisors have suggested adding boxing as a manditory training regiment."
LOR_outpost_guards:0 "Outpost Guards"
LOR_outpost_guards_desc:0 "While they may have escaped the terrors of the south many still fear another invasion, though Durnholde Keep lies in Hillsbard many have seen the fearsome speed the Orcs wolves utilise to bypass defense, as such a Garrison will be built North of Southshore to help ease concerns."
LOR_within_our_borders:0 "Within Our Borders"
LOR_within_our_borders_desc:0 ""
LOR_stormwind_aux:0 "Stormwind Auxiliary"
LOR_stormwind_aux_desc:0 "The Stormwind Remnants have little means to equip themselves with little more then axes and wooden tables, a deal has been the Stormwind Regent that a number of his people will fall under the command of Lordaeron, while the people of Hillsbrad will now be free from mandatory conscription."

