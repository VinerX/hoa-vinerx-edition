LOR_martial_law_desc:0 "The Entire Kingdom of Alterac is to be placed under Marshal Law, through there are individuals that have proven worthy of our trust within their borders, the larger threat of another betrayal remains."
LOR_hard_earned_trust:0 "Hard Earned Trust"
LOR_hard_earned_trust_desc:0 "The Young Prince has been spending his time tirelessly aiding us in the occupied regions, quelling resistance and being a general advocate for a peaceful resolution to our conflict"

