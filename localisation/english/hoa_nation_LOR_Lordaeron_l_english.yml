 LOR_western_takeover:0 "Western Incursion"
 LOR_western_takeover_desc:0 "We have a Limited Period of time before those in the West invade the Port, we must ensure the Trolls will no longer cause a problem before then."
 LOR_troll_incursion:0 "Troll Incursion"
 LOR_troll_incursion_desc:0 "The Humans have no clue what they are doing, their push from the south has forced a number of trolls to be pushed up north, the Farstrider Enclave is constantly fending off Trolls with all their might, but it may be too much."
 LOR_protect_the_sunwell:0 "Protect the Sunwell"
 LOR_protect_the_sunwell_desc:0 "The Humans wish to invade the Sunwell Isle beneath out very nose, foolish are the kingdoms of man to think we would not notice their fleets."
 LOR_QUE_weakness:0 "Quel'Thalas Weakness"
 LOR_QUE_weakness_desc:0 "The Elf has told us of the weakness of the city, as have given himself to the church, the bishop has plans for the High Elf, but for the time we will see the elves pay for their oversight."

