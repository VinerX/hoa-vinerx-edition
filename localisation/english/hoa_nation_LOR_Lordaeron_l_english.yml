LOR_eternal_foes:0 "Eternal Foes"
LOR_eternal_foes_desc:0 "We cannot afford to ignore the Trolls any longer, with the war on our border its only a matter of time before they become change from being a thorn in our side to a threat."
LOR_burn_them_all:0 "Burn Them All!"
LOR_burn_them_all_desc:0 "We should have listened to the High Elves Years ago, the Trolls have killed our citizens, stolen livestock, and Burned villages to the ground, Its time we put them to the flame."
