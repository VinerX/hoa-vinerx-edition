 LOR_a_looming_threat:0 "A Looming Threat"
 LOR_a_looming_threat_desc:0 "We have not faced the threat of war for many years, we have had enough men-at-arms to fight the troll encroachments on our lands as well as deal with any pests that have been a trouble in our lands, the kingdom is not ready for a war of any scale, we must prepare for the worst."

 LOR_doctine_selection:0 "Doctrine Selection"
 LOR_doctine_selection_desc:0 "As we have not fought a large scale land war for centuries, as such many of our generals have been voicing their opinions on what fomation our new army will take."
 LOR_question_of_the_fleet:0 "The Question of the Fleet"
 LOR_question_of_the_fleet_desc:0 ""

 LOR_end_our_isolation:0 "End Our Isolation"
 LOR_end_our_isolation_desc:0 "It is time to shrug off the Shackles the Courts and administation have imposed upon the kingdom, it is a necessary step we must take for the future of our kingdom and for the lands of the North as well."

 LOR_forge_grants:0 "Forge Grants"
 LOR_forge_grants_desc:0 ""
 LOR_pacification_army:0 "Pacification Army"
 LOR_pacification_army_desc:0 "We have begun posting recuitment posters in areas of the kingdom where spider infestations are constant and trolls are a contant concern, as we can see currently we have had a larger number of volunteers then usual this month."
 LOR_naval_engineers:0 "Naval Engineers"
 LOR_naval_engineers_desc:0 "While we are still restrained by the Courts where we can allocate resources, we have been able put together a new initiative for to increase the number of workers in our shipyards, instead of paying them we have given them the Guarantee of Three warm meals a day."

 LOR_warriors_of_light:0 "Warriors of the Light"
