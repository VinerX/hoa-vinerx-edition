 LOR_redpine_gnolls:0 "Redpine Gnolls"
 LOR_redpine_gnolls_desc:0 "The Redpine Gnolls have been causing some trouble for the locals in the East, they are currently not a major threat to the common folk due to the garrison in Hearthglen, but pushing them back into the mountain would aid the Peasants considerably."
 LOR_mossflayer_trolls:0 "Mossflayer Trolls"
 LOR_mossflayer_trolls_desc:0 "The Mossflayer Trolls have been coming over from the northen border and raiding the settlements in the area, the Elves seem to be doing nothing to deal with the trolls within their borders."
 LOR_murloc_pests:0 "Murloc Pests"
 LOR_murloc_pests_desc:0 "Murlocs have once again reappeared on our shores, through they are not spreading inland they are causing issues with local fishermen who are being menanced."
 LOR_spider_issues:0 "Spider Issues"
 LOR_spider_issues_desc:0 "Many oversized groups of spiders inhabit the caves and mountain ranges of our kingdom, it is common practice to remove any sizable infestations when they appear but it would seem that the court has been ignoring these issues and instead charging protection money from the locals."

