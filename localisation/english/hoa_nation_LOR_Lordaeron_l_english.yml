LOR_snowy_hills_and_icy_plains:0 "Snowy Hills & Icy Plains"
LOR_snowy_hills_and_icy_plains_desc:0 "Pilgrims from the far north have come to our aid in times of need, it would seem that one individual from the land for Northrend heeds the call of the Light, he was once banished from Alterac and wishes to return home."
LOR_green_skins:0 "Green Skins?"
LOR_green_skins_desc:0 "We have found a lodge of Orcs in the Alterac lands, we will put them to the sword like the rest of their kind."
LOR_faithless_heathens:0 "Faithless Heathens"
LOR_faithless_heathens_desc:0 "The Stromgarde Royalty give lip service to the light, they wear it as a badge of glory and do not give it the respect it deserves."
LOR_durnholde_lookouts:0 "Durnhole Lookouts"
LOR_durnholde_lookouts_desc:0 "Thoradin's Wall poses a challenge to us, it is well fortified and blocks our view beyond."
LOR_expand_durnhole:0 "Expand Durnhole"
LOR_expand_durnhole_desc:0 "The Contested Territory between Alterac and Stromgarde is sparsely populated, we could displace the locals or as the bishop has suggested, we can offer them protection from both sides."
LOR_patrol_the_wall:0 "Patrol the Wall"
LOR_patrol_the_wall_desc:0 "A new Patrol route has been made by Durnholde, they patrol the length of the Wall and interrogate anyone who is not of our Kingdom, through the questioning is light it has begun to cause unrest among the common folk."
LOR_communion_of_the_faithful:0 "Communion of the Faithful"
LOR_communion_of_the_faithful_desc:0 "The Bishop has suggested that we create a chapel for the fallen inside of Durnholde, this will draw in the faithful from the nearby lands that we may guide them on the path of the light."
LOR_sermon_interruptions:0 "Sermons Interruptions"
LOR_sermon_interruptions_desc:0 "For everyday in the last two weeks Stromgarde has run the bells on top of the Walls during times of Prayer, it is no coincidence, every time the chapel tolls it bells 10 minutes afterwards so does the wall, enough with these Heathens, take the Wall and any lands who resist the light."
LOR_light_scorched_stone:0 "Light Scorced Stone"
LOR_light_scorched_stone_desc:0 "The Dwarves of the Stormpike have stood against them, the Confessors have prepared for this, they believe in the 'makers', we will show them the path of the light."
LOR_the_high_and_mighty:0 "The High & Mightly"
LOR_the_high_and_mighty_desc:0 ""
LOR_troll_warnings:0 "Troll Warnings"
LOR_troll_warnings_desc:0 "The High Elves refused to inform us of the threat of the Trolls as they encroached on our lands, as such we will build a tower looking directly as their lodge, they have protested this action for reason of privacy, but this is for the greater good."
LOR_poachers_and_fires:0 "Poachers & Fires"
LOR_poachers_and_fires_desc:0 ""
LOR_the_traitors_testimonial:0 "Traitors Testimonial"
LOR_the_traitors_testimonial_desc:0 "A High Elf has approached the ruler of Hearthglen and wishes to tell us of the Weakness of Quel'thalas, there seems to be a number of stones that protect the capital."
LOR_strike_the_sunwell:0 "Strike the Sunwell"
LOR_strike_the_sunwell_desc:0 "The Sunwell seems to be a font of power for the High Elves, if we could take it from them it may ease our need to take the city and would save the lives of many faithful."
LOR_naval_gambit:0 "Naval Gambit"
LOR_naval_gambit_desc:0 "We will send as many ships as we can muster towards the Sunwell Isle, many may die in the cold waters, but the Elven Fleet will be too distracted to man a defensive of the Manland."
LOR_eastern_distraction:0 "Eastern Distraction"
LOR_eastern_distraction_desc:0 "Attacking the Trolls in the East will benifit us more then one would expect, our generals have created a plan to distract the Elves by invading the Trolls which will force them to the North, they will be too busy dealing with the Incursion do expect our acquisition of the Dawnstrider Harbor."
LOR_mage_cowards:0 "Mage Cowards"
LOR_mage_cowards_desc:0 ""
LOR_deal_with_the_exodus:0 "Deal with the Exodus"
LOR_deal_with_the_exodus_desc:0 "A Number of Mages have left the Kingdom as we limit their access to Dalaran, thought many of these mages are of little concern to us, a number were key to the improvement of the Kingdoms Armies, we have our ways to deal with this issue."
LOR_bar_physical_entry:0 "Limit Physical Entry"
LOR_bar_physical_entry_desc:0 ""
LOR_siphon_the_leylines:0 "Siphon the Leylines"
LOR_siphon_the_leylines_desc:0 "Though it is impossible to cut Dalaran off from its Leylines, it however possible to disrupt its flow, a large number of humans, and elves, have come to our aid."
LOR_anti_magic_wards:0 "Anti-Magic Wards"
LOR_anti_magic_wards_desc:0 ""
LOR_the_mageocracy:0 "End the Mageocracy"
LOR_the_mageocracy_desc:0 ""
LOR_clear_the_outskirts:0 "Clear the Outskirts"
LOR_clear_the_outskirts_desc:0 ""

LOR_secure_the_new_lands:0 "Secure our New Lands"
LOR_secure_the_new_lands_desc:0 ""
LOR_threat_eliminated:0 "The Threat Eliminated"
LOR_threat_eliminated_desc:0 ""

###### Third/3rd War
LOR_uncertain_times:0 "Uncertain Times"
LOR_uncertain_times_desc:0 "An Uncertain Peace fell upon the northen kingdoms after the Alliance Expedition closed the dark portal. With the war the brought the kingdoms together over the splinters began to form as the kingdoms political differences began to tear the once unifiying alliance apart."
LOR_a_worthy_heir:0 "A Worthy Heir"
LOR_a_worthy_heir_desc:0 "With every passing year King Terenas seems to become more infirm, though he is still a strong leader of the realm, many have begun to turn their eyes to his heir. Arthas may still be a young man in the eyes of many, but his dedication to the light, and friendship with the newly crowned king of Stormwind has made many feel that the future looks bright for their children."
LOR_the_lightbringer:0 "The Lightbringer"
LOR_the_lightbringer_desc:0 "Uther the leader of the Silverhand Paladins has kept peace in the lands for years, using his wisdom to settle civil disputes as well as his might to quell Troll incursions and the ocassional capture of escaped Orcs from the internment camps."

LOR_internment_taxes:0 "Internment Taxes"
LOR_internment_taxes_desc:0 ""
LOR_church_unrest:0 "Silverhand Schism"
LOR_church_unrest_desc:0 ""

LOR_military_affairs_court:0 "Military Affairs Court"
LOR_military_affairs_court_desc:0 "When we brought the courts to heel we did not expect the haste in which we did it to cause this much damage, many minor offenses have been dealt with in the quickest way possible to deal with the backlock of judgements needed on cases. What we can do to speed up the process is pardon any crimes minor that were commited by Soliders of the Alliance during the War."

LOR_the_alternative:0 "An Alternative"
LOR_the_alternative_desc:0 "Two of the Seven Kingdoms Proposed possible solutions to the ongoing Occupation of Alterac, the time has come to determine the fate of the land, while Aliden Perenolde has been able to cultivate some support, the shadow his father left may be too great for him to overcome."
LOR_prestors_son:0 "Lord Prestors Son"
LOR_prestors_son_desc:0 "While the Seven Kingdoms had convened, two unexpected guest had arrived at the hall, Lady Katrana the Royal Advisor of Stormwind and a familiar face. It would seem that Lord Daval Prestor has been tending to his wife in her final years living a simple life in Khaz'Modan, his son, Daval Prestor II is a spitting image of his father, though he does not have the same wit and charm as his father he still holds a claim to the Throne of Alterac. Both Genn and Thoras had their doubts about him."
LOR_court_consensus:0 "The Courts Consensus"
LOR_court_consensus_desc:0 "Daval Pestor II asked his sister to leave the court so that her position did not interfere with his negotiations, an action that had Thoras scoff, Daval proceeded to lay his plans for Alterac, he did not wish to rule it as a King, but instead as a Baron, subjected to the whims of the Alliance until such time as his fathers return. Genn Greymane however objected to this notion as Isiden Perenolde already had a true claim to the throne."
LOR_the_barony_of_ALT:0 "A New Barony"
LOR_court_consensus_desc:0 "Daval Pestor II asked his sister to leave the court so that her position did not interfere with his negotiations, an action that had Thoras scoff, Daval proceeded to lay his plans for Alterac, he did not wish to rule it as a King, but instead as a Baron, subjected to the whims of the Alliance until such time as his fathers return. Genn Greymane however objected to this notion as Isiden Perenolde already had a true claim to the throne."

LOR_embrace_your_fears:0 "Embrace Your Fears"
LOR_embrace_your_fears_desc:0 ""

LOR_the_princes_dark_return:0 "The Prince Returns"
LOR_the_princes_dark_return_desc:0 "Many thought that Arthas has died at Stratholme, but we have unconfirmed reports from the Western Fields that the prince has been seen emerging from the Whispering Forest with knights clad in dark plate laying waste to the undead plaguing the area."

LOR_daughter_of_the_tides:0 "Daughter of the Tides"
LOR_daughter_of_the_tides_desc:0 "After the return of Prince Arthas, Jaina Proudmore has left the seclusion of the Proudmore Keep and has begun to urge her father to intervene in the war against the Scourge. With the unexpected arrival of Baron Prestor they may be able to tip the tide in our favour."

LOR_end_the_barovs:0 "End the Barovs"
LOR_end_the_barovs_desc:0 ""

LOR_the_royal_wedding:0 "The Royal Wedding"
LOR_the_royal_wedding_desc:0 "With the indead purged from the lands, King Arthas has announced his intention to marry Princess Jaina Proudmore, the square erupted in cheers and applause as the heroes of the third war embraced each other. However Uther and Saidan were not so quick to congratulate the young couple."

LOR_knights_priest_peasents:0 "Knights, Priests, Peasants"
LOR_knights_priest_peasents_desc:0 ""

LOR_vandermar_economic:0 "Vandermar Resurgence"
LOR_vandermar_economic_desc:0 ""

###############################
#events
###############################

lordaeron.1.t:0 "Troll Incursions"
lordaeron.1.d:0 "Reports from the East state that the Trolls have become more brazen with their attacks, a group of soldiers were able to minimise the damage but were lost in the fighting."
lordaeron.1.option.1:0 "Contact the Civil Guard"

lordaeron.2.t:0 "Noble Discovery"
lordaeron.2.d:0 "The Nobles have begun to become suspicious of our intervention in the court, a small disagreement could quickly spiral into a silent revolt to maintain their control over the courts."
lordaeron.2.option.1:0 "We will deal with them in time"

lordaeron.3.t:0 "The Meeting of the Seven Kingdoms"
lordaeron.3.d:0 "While we have already established the Alliance, the handful of Stormwind’s refugees and the full commitment of the Kirin Tor won’t be enough to stop the coming Horde. We must call upon all the Human kingdoms and win them over to our side, should we fail the coming war may be over before it can even begin."
lordaeron.3.option.1:0 "Summon their Leaders."

lordaeron.5.t:0 "The Principality of Hearthglen"
lordaeron.5.d:0 "With the constant interference from the Barovs on the kings court, the idea has been discussed as to splitting up the administration into Dutchies, documents are already being drawn up to give the Barovs greater autonomy in the Kingdom in exchange for lessening restrictions on their holdings.\n One of out members has also brought forward the idea of turning Heathglen into its own Dutchy, most of its population are simple folk that care little for politics, allowing a local figure to manage the day to day activities may be helpful in the long run."
lordaeron.5.option.1:0 "Offer the Land to this new Holy Order"
lordaeron.5.option.2:0 "Offer Guardianship to the Lord of Mardenholde."
lordaeron.5.option.3:0 "Maintain Control for Now."

lordaeron.6.t:0 "Army Formation Meeting"
lordaeron.6.d:0 ""
lordaeron.6.option.1:0 "Cavarly Focus"
lordaeron.6.option.2:0 "Siege Warfare"
lordaeron.6.option.3:0 "Attritional Warfare"
lordaeron.6.option.4:0 "Citizen Army"

lordaeron.7.t:0 "The Question of the Fleet"
lordaeron.7.d:0 ""
lordaeron.7.option.1:0 "Protection of Trade"
lordaeron.7.option.2:0 "High Seas Fleet"

lordaeron.8.t:0 "Tyrs Hand Unrest"
lordaeron.8.d:0 "Much like many of the issues that were hidden from us by the court over the years, Tyrs hand has been in silent rebellion of the Kingdom for quite some time now, as their requests for assistance against some form of band of sea serpents were ignored, it may be best to provide them with some direct assistance."
lordaeron.8.option.1:0 "Help their workshops."
lordaeron.8.option.2:0 "Construct a Forge."

lordaeron.9.t:0 "Tyrs Revolt Contained"
lordaeron.9.d:0 "Tyrs Hand has come out in revolt against our kingdom, it has come to our attention that the administations tax collecters had entered then town a few days ago and caused considerable damage, and unfortunatly killed a few people, we have been able to convince the revolts leaders to instead refuse to pay taxes for the forseable future, it would seem that someone in the Court or the Administation has found out about our plans."
lordaeron.9.option.1:0 "As long as they dont start a War."

lordaeron.10.t:0 "On Feathered Wings"
lordaeron.10.d:0 "The Human Kingdoms of the North have banded together to fight the Orc menance, long has it been since we have seen the humans have this level of determination to stand for anything."
lordaeron.10.option.1:0 "For The Alliance!"
lordaeron.10.option.2:0 "We have lasted this long alone."

lordaeron.11.t:0 "Only us and the Fish"
lordaeron.11.d:0 "Lordaeron Told us to Take the Islands, most of the workers and ran from the "Pirates" those who took up arms were either "Invited" to our ranks, or thrown the stockade, we should probably make a bigger Stockade."
lordaeron.11.option.1:0 "For Lordearon Lads!"

lordaeron.12.t:0 "A Step too Far"
lordaeron.12.d:0 "When Lordaeron Stepped onto the Islands many of the admiralty recommended caution, while we waited for reports from those who fled the island the last boat load of dock workers told us of our sailors being held in Inhumane conditions in Stockades, this has left us no choice."
lordaeron.12.option.1:0 "Bombard The Ports!"

# THIRD WAR EVENTS
# THIRD WAR EVENTS
# THIRD WAR EVENTS

lordaeron_third_war.1.t:0 "Council Meeting"
lordaeron_third_war.1.d:0 "It was yet another day of council meeting for King Terenas Menethil. Listening to his councillors and emissaries all day wasn't his favorite activity but as the king it was a responsability he had to go through.\n Like often recently, the topic of the orcs regrouping and attacking internments camp was wildly debated and many representatives from the southern regions of the kingdom were pleading the king to act on the matter. But their demands were all cut off by the Kirin Tor ambassador from Dalaran:\n\n' The orcs are not our primary concern here! How many times must I repeat myself... King Terenas, you must heed my warning! This plague that has gripped the northlands could have dire ramification...'\n\n As the emissary pronounced these words, he was met with the usual skepticism of the audience:\n\n'Plague? You wizards are just being paranoïd! Let's keep all this in perspective, even if this plague does pose a threat to us, what are you proposing that we do?'\n\n'It is simple, as I have said the Kirin Tor are already prepared to place the villages under strict quarantine.', replied the emissary.\n\nIt is at these words that the King snapped back from looking at that strange crow that had flew into the throne room, raising his voice and giving his opinion on the matter..."
lordaeron_third_war.1.option.1:0 "'We must act lest we become prisoners of our own lands.'"
lordaeron_third_war.1.option.2:0 "'The people shall not be prisoners in their own lands.'"

lordaeron_third_war.2.t:0 "The Prophet's Warning"
lordaeron_third_war.2.d:0 "Just as the king finished pronouncing his words, the strange crow that was now standing in the middle of the thrown room erupted with strange green flows of magic. He grew in size and soon before the eyes of the King and his council, the crow had transformed into a man.\n\n'Yet, prisoners they are, good king.', the man began.\n\n'What is the meaning of this? Who are you?', the king began questioning.\n\n'Humanity is in peril! The tides of darkness have come again and the whole world is poised on the brink of war!', uttered in a prophetic tone the stranger before continuing, despites the guards already closing in on him.\n'Hear me! The only hope for your people is to travel west, to the forgotten lands of Kalimdor.'\n\nIt is then that the king stood up and faced the man:"
lordaeron_third_war.2.option.1:0 "'It shall be WE who decide how to best protect our people!'"
lordaeron_third_war.2.option.1.d:0 "'§LI failed humanity once before and I will not do so again. If you cannot take up this cup then I shall find another who will...', said the stranger before leaving the courtroom on his own volition.§!"
lordaeron_third_war.2.option.2:0 "'We shall not leave our land, but we will heed your warning.'"
lordaeron_third_war.2.option.3:0 "'Please, tell us more.'"

lordaeron_third_war.3.t:0 "The Defense of Strahnbrad"
lordaeron_third_war.3.d:0 "Recent orc uprisings in southern Lordaeron have forced the Alliance to take decisive measures. To contain the orcish threat, King Terenas has sent two of the realm's greatest paladins - his son, Prince Arthas, and the legendary Uther the Lightbringer - to deal with the orcs once and for all.\n\n Is it in the morning that the two met in the outskirts of Stahnbrad in Alterac before making their way to the town and dealing with a raid of the Blackrock clan of orcs that was ravaging the village.\n\n The two champions have then sought to liberated the villagers that had been taken back to the orcs' camp, only to arrive too late as the orcs had already sacrified the innocents to their dark demonic masters. To avenge, their death, the paladins valiantly battled the orcs and killed their leader, driving them away from our lands. They no longer pose a threat."
lordaeron_third_war.3.option.1:0 "The people of Lordaeron can count on their champions!"

lordaeron_third_war.4.t:0 "Undead spotted in northern Alterac"
lordaeron_third_war.4.d:0 "We have recently received a worrying report from none other than Prince Arthas Menethil. He informs us that while he was escorting Miss Jaina Proudmoore, promising mage of Dalaran and daughter of Admiral Proudmoore of Kul'tiras, they have encountered a village overrun with undead in the alteraci regions bordering the [HEA.GetName].\n\n The prince tells us that he has taken care of the matter after battling the deads and slaying the necromancers that were infesting the village. Worryingly, the one that seemed to lead the operation has managed to flee, the prince has pledged to take care of that matter. But more concerning, he and Jaina have speculated that the plague might be spreading via contaminated grain. For now, he conceed that it is just a speculation, but the prince wish to warn us that the grain was contained in crates bearing the regional seal of Andorhal, the major distribution center of the entirety of the [HEA.GetName]..."
lordaeron_third_war.4.option.1:0 "Worrying indeed... Tells the Prince to investigate Andorhal."
lordaeron_third_war.4.option.1.d:0 "§LSomething is off...§!"

lordaeron_third_war.5.t:0 "Andorhal"
lordaeron_third_war.5.d:0 "After reporting to his father about the undead in northern Alterac, Prince Arthas and Jaina Proudmoore made haste towards Andorhal, the distribution center of all the grain in the region of Hearthglen, as well as the heart of its economy.\n\n It is with horror that they discovered the city in flame upon their arrival, besieged by the undead. It is with bravor that they fought against the risen creatures, to free the city of their grasp but also to know more of what dark machination were taking place within. It is when they crossed the gates of the already ruined city that they encountered a strange wizard standing besides two undead ghouls, dressed in black robes and skulls..."
lordaeron_third_war.5.option.1:0 "'Hello again, children.'"

lordaeron_third_war.6.t:0 "The Cult of the Damned - Part 1"
lordaeron_third_war.6.d:0 "'I am Kel'Thuzad', the wizard spoke in a husky voice. 'And I've come to deliver a warning. Leave well enough alone. Your curiosity will be the death of you.'\n\n'Are you responsible for this plague, necromancer? Is this cult your doing?', inquired the Prince.\n\n 'Yes, I ordered the Cult of the Damned to distribute the plagued grain. But the sole credit is not mine. I serve the dreadlord Mal'Ganis. He commands the Scourge that will cleanse this land and establish a paradise of eternal darkness!'\n\n 'And what exactly is this Scourge meant to cleanse?', answered Arthas, vindictively.\n\n'Why, the living, of course' continued the man, with a terrifyingly calm tone. 'His plan is already in motion. Seek him out at Stratholme if you need further proof.', he finished before disapearing into the smoke clouds of the burning city as the two ghouls by his side turned feral and attacked the prince."
lordaeron_third_war.6.option.1:0 "Quick, follow him!"

lordaeron_third_war.7.t:0 "The Cult of the Damned - Part 2"
lordaeron_third_war.7.d:0 "Advancing through the streets of Andorhal was a hard task, between the crumbling buildings and the smoke clouds caused by the fire, the greatest danger was the hordes of undead roaming the streets. Nonetheless, Arthas and his troops, along with Jaina, swiftly made their way through the town, finally confronting Kel'Thuzad and mortally wounding him.\n\n'Naive fool. My death will make little difference in the long run.', said the necromancer, his voice bolstered with unatural vigor. 'For now, the scourging of this land... begins.', he finished, his last breath leaving his lungs before falling to the ground.\n\n His words resonated into the minds of every soldiers accompanying prince Arthas, as far in the distance, the clanging of bells could be heard coming from all directions..."
lordaeron_third_war.7.option.1:0 "'We shall end this in Stratholme.'"
lordaeron_third_war.7.option.1.d:0 "§RThe Cult of the Damned rises...§!"

lordaeron_third_war.8.t:0 "Andorhal has fallen!"
lordaeron_third_war.8.d:0 "My king! We have been informed that Andorhal has fallen to the undead scourge! More reports are coming from all over the realm about villages falling to the deads!"
lordaeron_third_war.8.option.1:0 "'Prepare the troops!'"

lordaeron_third_war.9.t:0 "Undead rise in Tirisfal Glades"
lordaeron_third_war.9.d:0 "We have lost communication with the western town of Vandermar, as well as the Agamand Mills north of it. Earlier scouting parties reports increasing presence of undead in the area."
lordaeron_third_war.9.option.1:0 "Worrying..."
lordaeron_third_war.9.option.1.d:0 "§RSeems like the Cult of the Damned wasn't solely working in the vicinity of Andorhal...§!"

lordaeron_third_war.10.t:0 "Undead rise is the Eastweald"
lordaeron_third_war.10.d:0 "The authorities of Eastweald have sent an emissary to inform us that they have lost control of the area surrounding Darrowshire."
lordaeron_third_war.10.option.1:0 "The situation is getting worse by the day..."

lordaeron_third_war.11.t:0 "Undead rise in Hillsbrad"
lordaeron_third_war.11.d:0 "The village of Northdale, not far from the frontier with the high elven kingdom of Quel'thalas has apparently been taken over by the Cult of the Damned."
lordaeron_third_war.11.option.1:0 "We must act quickly!"

lordaeron_third_war.12.t:0 "Undead rise in Silverpine"
lordaeron_third_war.12.d:0 "So far we were thinking that our fiefs in Silverpine Forest were spared by the machinations of the Cult of the Damned, but our most recents reports indicates that the entire cemetary of the Scepulcher have risen as undead."
lordaeron_third_war.12.option.1:0 "May the Light saves us."

lordaeron_third_war.13.t:0 "Lost control over the Northern Regions"
lordaeron_third_war.13.d:0 "The sparse villages of the highlands of northern Lordaeron have been overrun with the undead. The authorities of Hearthglen and Stratholme are readying their troops."
lordaeron_third_war.13.option.1:0 "They truly are everywhere..."

lordaeron_third_war.14.t:0 "The Undead are on the Move"
lordaeron_third_war.14.d:0 "At first, the undead were aimlessly wandering the affected hamlets and towns of the kingdom, with only a few reports of significant attacks on the troops that had been sent to secure the surroundings of these areas.\n\n But now it seems that the deads are on the move, animated by a single will. Multiple envoys have reach Lordaeron City today, warning the king that the undead are spreading and already engaging our valiant soldiers and paladin.\n\nIt appears like war has finally began."
lordaeron_third_war.14.option.1:0 "It is just the beginning..."

lordaeron_third_war.15.t:0 "Stratholme - Part 1"
lordaeron_third_war.15.d:0 "The rain was pouring heavily on Arthas as he reviewed and waited for his troops to amass outsides of the gates of Stratholme. If what Kel'thuzas said was correct, the city was already under the influence of the demon Dreadlord Mal'ganis. The young Prince was engulfed in his thoughts when Lord Uther entered the camp. They both exchanged greeting, with Uther commenting on Arthas casualness, reminding him that he was still his superior as a paladin. But Arthas was mostly concerned with the revelation he had to inform his mentor of.\n\n'Listen, Uther, there is something about the plague you should know...', he marked a pause before continuing. 'We're too late... All the people of Stratholme have already been infected. They may look fine now but it's just a matter of time before they turn into the undead!'\n\n Arthas marked a second pause, visibly concerned by the course of action he was about to propose, but it was his duty to do the best for Lordaeron."
lordaeron_third_war.15.option.1:0 "This entire city must be purged."
lordaeron_third_war.15.option.2:0 "This entire city must be saved."

lordaeron_third_war.16.t:0 "Stratholme - Part 2" # From lordaeron_third_war.15.option.1
lordaeron_third_war.16.d:0 "'How can you even consider that?!' uttered Uther, shocked by his pupil. 'There's got to be some other way.'\n\n'Damn it, Uther! As you future king, I order you to purge this city!' answered Arthas.\n\n'You are not my king yet, boy! Nor would I obey that command even if you were!' shouted back Uther, raising his voice.\n\n' Then I must consider this an act of treason.'\n\nThe old paladin felt like the man standing before him was a complete stranger, not recognizing his apprentice in these words. ' Treason? Have you lost your mind, Arthas?'\n\n'Have I?' asked the Prince, annoyed, before taking a deep breah. 'Lord Uther, by my right of succession and the sovereignty of my crown, I hereby relieve you of your command and suspend your paladins from service. Those of you who have the will to save this land, follow me!'"
lordaeron_third_war.16.option.1:0 "'The rest of you... get out of my sight!'"
lordaeron_third_war.16.option.1.d:0 "§L'You've just crossed a terrible treshold, Arthas.'§!"

lordaeron_third_war.17.t:0 "Stratholme - Part 2" # From lordaeron_third_war.15.option.2
lordaeron_third_war.17.d:0 "Upon hearing these words, Uther felt pride and hope as his apprentice continued his speech, bolstering confidence in the minds of his troops, readying them for the trial they were about to embark on.\n\n A short while after, it is with bravery that Uther, Jaina, Arthas and his troops entered Stratholme. It is with horror that they witnessed citizens turning into undead right before their eyes, but now was not the time for innaction. They valiantly fought the undead and rescued as much innocents as they could.\n\n As they kept battling through the streets of Stratholme, now getting overwhelmed by more and more undead by the minutes, Arthas ordered Uther and Jaina to evacuate the rest of the citizens and wait for him outside the city, while he and a close guard of soldiers would confront Mal'ganis..."
lordaeron_third_war.17.option.1:0 "'I will be back.'"

lordaeron_third_war.18.t:0 "The Culling"
lordaeron_third_war.18.d:0 "It is with a heavy heart that Arthas crossed the gates of Stratholme, leading a small group of hand-picked soldiers. They were greeted by the pleas of citizens, asking the prince to do something about their brethren that had already fallen ill.\n\nArthas remained silent before finding the will to act. This had to be done. With horrors, the citizens of Stratholme witnessed their prince murder an innocent women that was begging him with a swift hammer blow. Panic quickly ensued as the other citizens started running back into their houses, only interrupted by the Dreadlord himself, appearing before the prince and his troops. 'I've been waiting for you, young prince. I am Mal'ganis. As you can see, your people are now mine.' started the dreadlord, before turning the citizens around him into mindless zombies. 'I will now turn this city household by household, until the flame of life has been snuffed out... forever.'\n\n'I won't allow it, Mal'ganis!' shouted back Arthas. 'Better that these people die by my hand than serve as your slaves in death!'\n\n The dreadlord chuckled before disapearing back into a shadowy mist. Arthas knew he had to act, and quickly. He and his troop made haste through the streets of Stratholme, slaying every innocent soul they could come across, sometimes breaking into their houses.\n\n For hours Arthas and his men purged the city, their faces blanketed in a cold indifference, and as the Prince arrived in the Crusader's Square, the Dreadlord was here, patiently waiting for him."
lordaeron_third_war.18.option.1:0 "This ends here."

lordaeron_third_war.19.t:0 "Confronting Mal'Ganis"
lordaeron_third_war.19.d:0 "The Prince slowly walked into the Crusader's Square, his eyes filled with rage while the dreadlord was overlooking him with a sly grin.\n\n'We're going to finish this right now, Mal'ganis. Just you and me.'\n\n'Brave words' the demon chuckled ' Unfortunately for you, it won't end here. Your journey has just begun, young prince.'\n'Gather your forces and meet me in the arctic land of Northrend. It is there that we shall settle the score between us. It is there that your true destiny will unfold.'\n\n As Arthas was about to charge the dreadlord, the latter vanished once again, nowhere to be seen. 'I'll hunt you to the ends of the earth if I have to! Do you hear me?!' erupted the young prince, screaming his lungs out, rage engulfing him."
lordaeron_third_war.19.option.1:0 "'TO THE ENDS OF THE EARTH!'"
lordaeron_third_war.19.option.1.d:0 "§HArthas leaves for Northrend to hunt Mal'ganis...§!"

lordaeron_third_war.20.t:0 "The Aftermath"
lordaeron_third_war.20.d:0 "She never thought she would have the courage to witness it with her own eyes, but she had to see. Jaina walked through the devasted streets of Stratholme, littered with corpses of livings and undead alike. The tainted air filled her lungs, but not of the plague, but of the smoke that was rising from the buildings of the city. Arthas, after confronting the dreadlord, had decided to set fire to the entire town.\n\n She had also meet with Uther inside the ruins. Fear and concern could be seen the paladin's eyes. She told him that Arthas had left for Northrend to hunt the dreadlord. They then exchanged a few words before Uther left to inform King Terenas.\n\n Jaina was about to leave as well before she heard a sound in her back. Turning around, a strange man draped in crow feathers was standing besides her. Jaina instantly recognized the stranger that she had caught sight back in Dalaran, he had warned Archmage Antonidas about the coming storm...\n\n 'The dead in this land might lie still for the time being, but don't be fooled.' said the prophet. 'Your young prince will find only death in the cold north. Commandable as that may be, his passions will be his undoing. It falls to you now, young sorceress.'\n\nHis gaze gained in intensity before continuing:\n\n'You must lead your people west to the ancient lands of Kalimdor. Only there can you combat the shadow and save this world from the flame...'"
lordaeron_third_war.20.option.1:0 "Then it is settled..."
lordaeron_third_war.20.option.2:0 "This is madness!"
lordaeron_third_war.20.option.2.d:0 "§HKeep playing as Lordaeron.§!"

lordaeron_third_war.21.t:0 "Prince Arthas left for Northrend"
lordaeron_third_war.21.d:0 "My king, we have received worrying news from Lord Uther. Your son, Prince Arthas, has left for the frozen continent of Northrend. Apparently it is to hunt down the dreadlord demon behind the undead plague."
lordaeron_third_war.21.option.1:0 "Send an emissary, he must come back!"

lordaeron_third_war.22.t:0 "Northrend"
lordaeron_third_war.22.d:0 "The howling wind of the cold north felt like cuts to the bone and the sun could barely shine through the misty grey clouds in the sky. Quite unlike his troops, Prince Arthas was eager to commence his expedition into this light-forsaken land. The month long trip had only strengthened his rage and resolve to avenge his people, all he could think of now was to defeat Mal'ganis.\n\n With a swift review of his forces, the Prince led his men forward into the daunting embrace of the frozen forests and rugged hills. Soon enough, the prince and his troop encountered familiar faces: dwarves led by none other than Muradin Bronzebeard, an old friend of Arthas. The prince quickly rushed to the help of the dwarves being attacked by waves of undead and together they succesfully repelled the onslaught.\n\n After quickly taking time to reunite with his friend, Arthas and Muradin went rescuing the remaining troops of the latter that had been cut off from the rest by more undead.\n\n The task accomplished, the Prince inquired his old friend about the reason of his presence on the frozen continent. Muradin informed him that they were looking after an ancient runeblade, Frostmourne, that his said to hold immense powers..."
lordaeron_third_war.22.option.1:0 "'Frostmourne you say?'"

lordaeron_third_war.23.t:0 "The Emissary"
lordaeron_third_war.23.d:0 "Upon rescuing Murading along with his troops, Arthas and his friend made their way back to the base camp, only to be greeted by an emissary of Lordaeron. Sent by King Terenas himself, the emissary informed the Prince that Uther had convinced the king to recall Arthas and his troops from Northrend, effectively ending his expedition to defeat Mal'Ganis.\n\nArthas thought longly on the matter while his soldiers were already preparing the journey back, so eager to leave the forsaken north and to return to Lordaeron, without even waiting for their prince's approval.\n\n Arthas knew that he couldn't defeat the dreadlord and his legions of undead alone, but his men were already set on going back their homeland, so much so that even by ordering them to stay, they would rather obey their king than their prince. In his mind, Arthas devised a plan, a sinister one, but was he ready to enact it..."
lordaeron_third_war.23.option.1:0 "'The ships must be burned.'"
lordaeron_third_war.23.option.2:0 "'Fine, let's go home.'"

lordaeron_third_war.24.t:0 "Dissension"
lordaeron_third_war.24.d:0 "Hellbent on assuring that his men never leave Northrend, Arthas, alongside a reluctant Muradin set out to destroy the ships anchored off the shores of the base camp. Knowing that destroying the vessels himself would result in his troops rebelling if they were ever to learn the truth, Arthas decided instead to hire mercenaries in order to do his dirty work.\n\nThe Prince waited patiently for the mercenaries to attack and destroy the ships, before leading his troops against them, making sure that they were all slain to prevent the truth from being revealed. With the ship burned and his soldier now stuck with him, Arthas could now resume his expedition into the frozen north..."
lordaeron_third_war.24.option.1:0 "'There is no way home for any of us.'"
lordaeron_third_war.24.option.1.d:0 "§L'Save through victory! In this land we will stand or fall together.'§!"

lordaeron_third_war.25.t:0 "Frostmourne - Part 1"
lordaeron_third_war.25.d:0 "Prince Arthas was overlooking his basecamp in the cold morning mist, his friend Muradin by his side.\n\n'You lied to your men and betrayed the mercenaries who fought for you. What's happening to you, Arthas? Is vengeance all that's important to you?' inquired the dwarf.\n\nWithout a look, Arthas coldly answered his old friend: 'Spare me, Muradin. You weren't there to see what Mal'Ganis did to my homeland.'\n\n The dwarf sighed, his friend had well changed since the last time they had met. As he was about to head back to the camp, Muradin's thoughts are cut off by the warnings of one of Arthas men.\n\n'The undead! We are under attack!'\n\n Mere minutes later, the entire basecamp was surrounded by the undead, in an amount that the expedition had not encountered yet.\n\n'This looks bad, we are completely surrounded!' worried Muradin, seeing as the undead troops kept growing in the distance.\n\n'There's still one chance. Help me claim Frostmourne! If it's as powerful as you said, it might tilt the scales in our favor!' proposed Arthas, visible determination in his eyes.\nAfter giving it some thought and assessing the danger of such quest, Muradin finally nodded, but warned his friend..."
lordaeron_third_war.25.option.1:0 "'I have a bad feeling about this, lad...'"

lordaeron_third_war.26.t:0 "Frostmourne - Part 2"
lordaeron_third_war.26.d:0 "The two discretly and quickly made their way out of the basecamp, along with a few elite soldiers, before they all became surrounded with too much undead. Prince Arthas made sure to leave the commandment to his most trusted captain, hoping that they would hold off the undead long enough.\n\n Muradin led Arthas and his men to the location of the way gate that would lead them to the vault of Frostmourn. Crossing the magical portal of the waygate, they arrived in a maze of winding frozen corridors. The place was guarded by strange creatures of the north, both living and undead, each more ferocious than the last.\n\nFinally, after much hardship, they had made their way to the entrance of Frostmourne's chamber, guarded by a powerful elemental revenant. The elemental warned the Prince that they would only meet death and darkness within the vault. Ignoring the Guardian's warning, the champions engaged into a difficult battle against the elemental and his minions, managing to defeat it after a difficult battle.\n\n In its last echoing breath, the elemental warned that they were not trying to protect the blade from Arthas, but rather protect him from the blade..."
lordaeron_third_war.26.option.1:0 "'Turn back before it's too late...'"

lordaeron_third_war.27.t:0 "Frostmourne - Part 3"
lordaeron_third_war.27.d:0 "Arthas and Muradin entered the chamber, their steps echoing against its frozen walls. At its center, upon a sinister pedestal, hovered the blade frozen in a crystal of ice.\n\n'Behold, Muradin, our salvation, Frostmourne.' announced Prince Arthas upon getting sight of the weapon.\n\n'Hold, lad. There's an inscription on the dais' replied the dwarf, cautiously approaching the altar, kneeling to read the inscription.'It says: Whomsoever takes up this blade shall wield power eternal. Just as the blade rends flesh, so must power scar the spirit.'\n\n Muradin stood back, before warning his friend: 'Oh, I should've known. The blade is cursed! Let's get the hell out of here!'"
lordaeron_third_war.27.option.1:0 "'I would gladly bear any curse to save my homeland.'"
lordaeron_third_war.27.option.2:0 "'Damn it. Let's destroy it so no one fall to its curse!'"

lordaeron_third_war.28.t:0 "Frostmourne - Part 4"
lordaeron_third_war.28.d:0 "Muradin tried to convince his friend: 'Leave it be, Arthas. Forget this business and lead your men home.'\n\n'Damn the men! Nothing shall prevent me from having my revenge, old friend. Not even you.'\n\n Upon shouting back at Muradin, Arthas stepped closer to the blade...\n\n'Now, I call out to the spirits of this place. I will give anything or pay any price, if only you will help me save my people.'\n\n Suddenly, Arthas felt like the blade was talking to him, he could hear whispers emanating from the sword... As he approached his hand from the floating crystaline prison, it suddenly shattered into pieces. One of these shard struck Muradin down, leaving him dead, but the prince didn't even take notice of his friend.\n Discarding his paladin warhammer, he reached out to take up the blade that was now planted firmly into the ground at his feet.\n\n As he grasped the handle of the weapon, the whispers became suddenly louder, before receding to the back of his mind where they became quiet. Now armed with the legendary Frostmourne, Arthas exited the vault and made his way back to the camp."
lordaeron_third_war.28.option.1:0 "..."

lordaeron_third_war.29.t:0 "The Vengeance"
lordaeron_third_war.29.d:0 "Arthas hastly returned to his men, desperately trying to hold off the undead. Now confident that Frostmourne would be Mal'Ganis' demise, he rallied his troops for a counter-attack.\n\n Frostmourne easily slashed through the waves of undead creatures, and despites suffering heavily casualties, the prince and his soldiers stormed Mal'Ganis' hideout, forcing the dreadlord to appear before him.\n\n'So, you've taken up Frostmourne at the expense of your comrades' lives, just as the Dark Lord said you would.' The dreadlord grinned 'You're stronger than I thought.'\n\n'You waste your breath, Mal'Ganis. I heed only the voice of Frostmourne now.' coldly answered Arthas.\n\nThe demon chuckled, slightly amused. ' You hear the voice of the Dark Lord. He whispers to you through the blade you wield. What does he say, young human? What does the Dark Lord of the Dead tell you now?'\n\n Arthas remained silent, listening to the voices coming from the blade that had became louder and were now engulfing his mind completely.\n\n'He tells me that the time for my vengeance has come.'\n\n At the sound of these words, the expression on the dreadlord's face quickly shifted, his sly grin replaced by terror. 'What? He can't possibly mean to--'\n\n Arthas didn't hesitate, swiftly striking down the demon before he could finish his sentence, ending Mal'Ganis with a single, decisive blow of Frostmourne."
lordaeron_third_war.29.option.1:0 "'It is finished.'"
lordaeron_third_war.29.option.1.d:0 "§LHis vengeance now achieved, Prince Arthas gives one last look to his men before disapearing into the blizzard...§!"

lordaeron_third_war.30.t:0 "Prince Arthas Returns - Part 1"
lordaeron_third_war.30.d:0 "When he first heard the reports, King Terenas couldn't believe it. His son Arthas had finally returned from Northrend! As much as he was happy to the prospect of seeing his son and heir again, Terenas was also relieved that soon enough, the prince would be back on the battlefield, leading the troops again the undead that were still plaguing parts of the kingdom.\n\n The keep's bells were ringing outside, signaling that the prince had arrived in Lordaeron City, and soon enough the doors of the throne room would open, and soon, they opened.\n\nArthas entered the throne room escorted with two men, probably under his command. He was drapped in a dark cape and a strange set of armor but King Terenas could recognize his son nonetheless. The prince finally reacher the center of the room and drew his blade before keeling in front of his father.\n\n'Aah my son...' started the king, standing up to welcome the prince."
lordaeron_third_war.30.option.1:0 "'I knew you would be victorious.'"

lordaeron_third_war.31.t:0 "Prince Arthas Returns - Part 2"
lordaeron_third_war.31.d:0 "Arthas was kneeling before his father but in reality he couldn't hear his congratulations over the whispers of Frostmourne. The Lich King had talked to him through the cursed blade ever since he had wielded it for the first time back in Northrend. With each day spent holding the sword, the will of the Lich King had seeped into his mind, and soon enough the prince had become his most devoted servant.\n\nToday more than any other, the voice of the Dark Lord was resonating into his mind: 'You no longer need to sacrifice for your people. You no longer need to bear the weight of your crown. I've taken care of everything...'\n\n Hearing this, Arthas smilled, before standing up and approaching the throne in front of which his father was standing. The prince firmly gripped his father's shoulder, guiding him to his throne and compelling him to sit. Then, he raised his blade, directing it towards his father's throat.\n\n'What are you doing my son?' inquired the king, terror in his eyes."
lordaeron_third_war.31.option.1:0 "'Succeeding you, Father.'"

lordaeron_third_war.32.t:0 "Prince Arthas Returns - Part 3"
lordaeron_third_war.32.d:0 "Arthas pushed the blade through his father's throat, claiming his life. He then drew the weapon out and contemplated his work, he didn't feel anything, no sadness, no joy, no remorse. He was now obeying the Lich King and the Lich King alone.\n\n As the sound of the crown of Lordaeron falling and rolling down the steps of the royal seat resonated through the throne room, Arthas turned around and addressed himself to the few nobles within the room that were witnessing the scene in shock and disbelief.\n\n'This kingdom shall fall. And from the ashes shall arise a new order that will shake the very foundations of the world.'"
lordaeron_third_war.32.option.1:0 "For the Lich King!"
lordaeron_third_war.32.option.2:0 "The Prince has gone mad!"

lordaeron_third_war.33.t:0 "Spread too thin"
lordaeron_third_war.33.d:0 "Ever since the Kingdoms betrayal during the 2nd War Alterac has remained under martial law, some of the other kingdoms have offered council on possible solutions to end the stagnation, but with the Orcs siege at Durnholde we can no longer delay."
lordaeron_third_war.33.option.1:0 "This is no time for rash decisions!"
lordaeron_third_war.33.option.2:0 "Summon the Seven Kingdoms!"

lordaeron_capitulation.1.t:0 "The Fall of Lordaeron"
lordaeron_capitulation.1.d:0 "With the Fall of the Kingdom, Northen Lordaeron falls into anarchy and turmoil, who shall you stand with?"
lordaeron_capitulation.1.option.1:0 "The Grand Marshals Command"
lordaeron_capitulation.1.option.2:0 "Stand Firm Crusaders!"
lordaeron_capitulation.1.option.3:0 "The Silverhand will not faulter"
lordaeron_capitulation.1.option.5:0 "1st Legion Survivors"

lordaeron_FIL.1.t:0 "Hold it together"
lordaeron_FIL.1.d:0 "The Prince betrayed us, wipe out and raised most of the Legion, we were the lucky few, though luck is a foul mistress."
lordaeron_FIL.1.option.1:0 "Where are the Captains?."

lordaeron_ruins.1.t:0 "The Ruins of Lordaeron"
lordaeron_ruins.1.d:0 "The Great Kingdom of Lordaeron lays in ruins, but the people will endure, the undead ravaged the lands and murdered our people but we will rebuild the kingdom on top of thier rotting remains."
lordaeron_ruins.1.option.1:0 "For Lordaeron!"

