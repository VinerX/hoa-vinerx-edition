LOR_the_highland_clans:0 "The Highland Clans"
LOR_the_highland_clans_desc:0 "Stromgarde Crushed a number of clans have appeared in the East, many of which dispise is for what we have done, however a member of the Kings Guard has sided with us, he has begun to proclaim that the Stromgarde Bloodline is dead, as the only remaining member is Galen is weak fool who would have sided with the orcs if given the chance."
LOR_eastern_guardians:0 "Eastern Guardians"
LOR_eastern_guardians_desc:0 "The Kingdom of Stromgarde has fallen and with it The Trollbane Family, those who escaped the capital said the Royal Guard stood side by side with the Royal Family, cutting down both Orcs and Trolls during the evacuation. Many of the Citizens who escaped the kingdom have a desire to take up arms once more."

