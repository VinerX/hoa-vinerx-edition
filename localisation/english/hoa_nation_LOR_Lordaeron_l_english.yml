LOR_a_stagnant_peace:0 "The Stagnant Peace"
LOR_a_stagnant_peace_desc:0 "Lordaeron has long stood as the largest of the Kingdoms of North, with border disputes in the South East, Troll Incursions in the East, and general squabbles between peasants.\nThe Citizens of Lordaeron have become accustomed to a mild simmering of conflict over the last few centuries."
LOR_high_court_appointments:0 "High Court Appointments"
LOR_high_court_appointments_desc:0 ""
LOR_widows_farmers_and_orphans:0 "Widows, Farmers & Orphans"
LOR_widows_farmers_and_orphans_desc:0 ""

LOR_a_conflict_averted:0 "A Conflict Averted"
LOR_a_conflict_averted_desc:0 ""
LOR_in_the_light_we_trust:0 "In the Light We Trust"
LOR_in_the_light_we_trust_desc:0 ""

 LOR_worker_assistance:0 "Worker Assistance"
 LOR_worker_assistance_desc:0 "The Country side has long langushed under administrative failures, we should first start with the Peasants to avoid a possible revolt when we begin reforms."

 LOR_grain_independence:0 "Grain Independence"
 LOR_grain_independence_desc:0 "No longer will the people of this kingdom worry in the winter that our stores will run dry, instead we will let them eat Bread."

 LOR_approve_land_purchases:0 "Approve Land Purchases"
 LOR_approve_land_purchases_desc:0 "The Court has been directed to purchase land from landowners who still have outstanding debts to us, for the total sum of their debts, which we will ensure they will pay."
 LOR_rural_expansion:0 "Rural Expansion"
 LOR_rural_expansion_desc:0 "Land Owners in Hillsbrad as well as Hearthglen have willing taken up out offer to purchase their lands, now it is time to begin clearing said land of unnecessary trees and or builds."
 LOR_grain_tax_reform:0 "Grain Tax Reform"
 LOR_grain_tax_reform_desc:0 "Grain is the life blood of our nation, we have for the longest time allowed producers to sell their goods abroad before needing to pay their tithes to the kingdom. The new reforms will stop nobles from buying locally produced grain before it has been collected for taxes."

 LOR_porter_requests:0 "Porters Guild"
 LOR_porter_requests_desc:0 "The Local Porters Guild has recently come into some financial troubles an are unable to pay their taxes, the court has deemed it best to attempt to sieze their property to pay their dues, but it has been decided instead to sieze some of their wagons and use them instead to transport goods to our army."
 LOR_porters_road:0 "The Porters Road"
 LOR_porters_road_desc:0 "To ensure the Porters Guild does not miss its payments again, roadworks have been planned on the main pathway between the capital and Solliden Farmstead."
 LOR_craftsmen_assistance:0 "The Courts Craftsmen"
 LOR_craftsmen_assistance_desc:0 "It would seem that the craftsmen the court entursed to bring the Wagons back to working condition have failed at their task, though an unfortunate set back we had already expected this, plans have already been put forward to start new workshops."

 LOR_mine_expansion:0 "Mine Expansions"
 LOR_mine_expansion_desc:0 "While the courts control our export laws we are dependent upon imports from other kingdoms, the courts however do not control our ability to expand our exsisting number of mines and quarries."
 LOR_black_gold:0 "Black Gold"
 LOR_black_gold_desc:0 "During the expansion of a mine in the East we struck oil, the workers we had scattered and the Guards thought they might have ran into kobolds."
 LOR_the_steel_works:0 "The Court Forges"
 LOR_the_steel_works_desc:0 "The Court has once again put our treasury towards expanding the Armies blacksmiths while we still have a recuitment issue, we will try to keep them from only funding their own pet projects."
 LOR_merge_coal_makers:0 "Coal Makers Union"
 LOR_merge_coal_makers_desc:0 "Our current purchases of charcoal are made from individual craftsmen, the courts have long been known to change the value of this essential good far too frequently to serve their own means, one of our men have already begun the process of forming a Union to best serve the people, and keep the court in check."

 LOR_currency_stable:0 "Stabilize the Mint"
 LOR_currency_stable_desc:0 "For too long the Court has been trading in old minted coins without any attempts to standadize the currency, it pains us to say but we will need to collect as much of the old mint and debase it to cut down on administative oversight."
 LOR_the_kings_court:0 "The Kings Court"
 LOR_the_kings_court_desc:0 "We have been able to identify a number of middlemen that have been assisting the court in interfering with the daily workings of the kingdom, we have removed of these individuals and have sent a clear warning to thiei handlers that they serve the King first."
 LOR_the_home_front:0 "The Home Front"
 LOR_the_home_front_desc:0 "Now that we have lessened the courts interference and removed some Burucratic shortfalls we can now see that there are a large number of requests from citizens to deal with issues they are having with local pests...and Trolls."

LOR_workshop_decree:0 "Workshop Decree"
 LOR_workshop_decree_desc:0 "As the Possibility of war grows ever higher, the king has found the necessary to prepare the nations workshops to possibly serve as makeshift forges so serve as the life blood of the Army."
 LOR_forge_grants_idea:0 "Forge Grants"
 LOR_forge_grants_idea_desc:0 "Funding new forges inside the kingdom will provide us with a new labour force to tap into if we end up going to war."
LOR_construction_edicts:0 "Surplus Lumber"
LOR_construction_edicts_desc:0 ""

LOR_look_to_the_church:0 "Look to the Church"
LOR_look_to_the_church_desc:0 "We sought the assistance of the Church in addressing the issue of the court nobles, as it would seem even the King Guard are already in their pockets. The Church holds a moral authority and sound ethical standing, they have a vested interest in purging the corruption within the court as many of the chapels that dot our kingdom have languished in a state of disrepair."
LOR_mandatory_positions:0 "Mandated Positions"
LOR_mandatory_positions_desc:0 ""
LOR_church_sactions:0 "Church Sactions"
LOR_church_sactions_desc:0 "It has been discovered that Nobles have been using their local chapels to hide their wealth from the courts."
