 LOR_kirin_tor_magocracy:0 "Kirin'Tor Magocracy"
 LOR_kirin_tor_magocracy_desc:0 "It was not long after Dalaran fell that a number of Archemages ripped portals open to bring those who had escaped to the Mage Quater, the King granded them refuge but they brought a arcane contraption with them that even the royal guard could feel."

