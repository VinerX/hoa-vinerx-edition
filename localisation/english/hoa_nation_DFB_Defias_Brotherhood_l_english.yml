 defias.1.t:0 "The Westfall Scramble"
 defias.1.d:0 "While felling from the kings guards we were met by other on the road who shared our frustration with the kingdom, they join our ranks, bringing their tools and expertise, be in with metal work, or other less...honourable professions."
 defias.1.option.1:0 "Protect the People!"

 defias.2.t:0 "The Keep Falls!"
 defias.2.d:0 "We came to this city to rebuild it, with out sweat and blood we built it, and with out sweat and blood we tore it down."
 defias.2.option.1:0 "Let the Revolution Begin!"

 defias.3.t:0 "Full Retreat"
 defias.3.d:0 "The Loyal Lapdogs have been unrelenting in their attacks, with out backs to the sea many have fled into the Deepmines to try to try some form of last stand."
 defias.3.option.1:0 "Secure a Foothold!"
