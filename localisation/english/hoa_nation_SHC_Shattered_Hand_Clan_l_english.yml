POLITICS_KARGATH_BLADEFIST_DESC:0 "Kargath Bladefist was a notorious gladitor; raised as a slave by the ogres of the Gorian Empire. His unwavering resolve to sever his hand to free himself lead to a slave revolt and the foundation of the Shattered Hand Clan."

