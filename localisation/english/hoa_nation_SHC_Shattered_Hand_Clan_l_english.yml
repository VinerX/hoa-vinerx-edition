#events
###############################

shattered_hand_roth.1.t:0 "Breath of the Sun"
shattered_hand_roth.1.d:0 "A few of our hunters ventured too far into the lands of the Arrakoa in search of fresh meat, they soon found themselves in a visious fight with our savage neighbours who have been using the area as a hunting ground.\n\nNeither side stood a chance when the Arrakoa became tired of their presence and sun scorched the entire area to prove their point."
shattered_hand_roth.1.option.1:0 "Damnable Overgrown Kaliri"

shattered_hand_roth.30.t:0 "The Moonlight Raid"
shattered_hand_roth.30.d:0 "They didnt even try to hide themselves, they attacked at full force.\n\nIn the bright moonlight a horde of Sabercats attacked the southern garrison, they killed or maimed anyone they could get there claws on, some where left alive missing limbs in some sort of sick display and others were dragged away screaming."
shattered_hand_roth.30.option.1:0 "First the Ogres, now the furballs?"

