SHC_flood_the_east:0 "Flood the East"
SHC_flood_the_east_desc:0 "Members of Vragors conclave who have been afflicted by the red pox have dragging enslaved elementals to the north of the Hollow, their plan is to spread the cursed water into the Crag to the north, displacing the Arrakoa in the area."
SHC_the_unfortunate_few:0 "The Unfortunate Few"
SHC_the_unfortunate_few_desc:0 "In the Process of flooding the Crag it would seem that a few members of the Shadowmoon Clan had come to investigate the ritual, the fools failed to keep their distance from the infected, we have since heard that a number of them had contacted the Redpox and decided to Immolate themselves to avoid spreading it"
SHC_skirmish_in_the_south:0 "Southern Skirmish"
SHC_skirmish_in_the_south_desc:0 "Our Interference in the north east has not gone unnoticed, a number of Arrakoa attacked a small settlement in the southern area of our lands, Kargath personally led the defence and subsiquent counter attack."
SHC_sneaky_bastards:0 "Sneaky Bastards"
SHC_sneaky_bastards_desc:0 "We have been fooled, the attack in the south was a diversion, while returning from battle Kargath was set upon by a group of ogres, though though he and his guard were able to slay them, Kargath was stabbed with a poisoned blade, from his symptoms it seems to be a rather aggressive strain of the Redpox, he has left for the quarantine camp, and in his absence has place Vragor as chieftain."

SHC_the_clan_alone:0 "Healing Balms"
SHC_the_clan_alone_desc:0 ""

SHC_throne_of_bone_and_ash:0 "Throne of Bone and Ash"
SHC_throne_of_bone_and_ash_desc:0 "Vargors conclave have finalized their ritual site, an elemental conduit made of the bones of the saberon and fused together using enslaved fire elementals, their abominable act however has led to an interesting discovery."

SHC_those_beyond_hope:0 "Those Beyond Hope"
SHC_those_beyond_hope_desc:0 "Warriors having been left in a weakened state by the ravages of the Red Pox, sought salvation through other means. The Conclave, harnessed elemental magics to transform these orcs into brutal warriors. Cutting off both of their hands in a show of dedication, bare weapons infused with the cursed blood of Sethe. These cursed warriors roam the lands in search of their final rest."

