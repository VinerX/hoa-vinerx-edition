SHC_the_path_of_honor:0 "The Path of Glory"
SHC_the_path_of_honor_desc:0 "Those warriors afflicted with the Redpox are given a choice, either enter the camps and hope the Shamans assist in their recovery, or take up the Axe and dredge their way into the Arrakoa lands in search of a worthy death."
SHC_cripple_bird_cat:0 "The Cripple, The Bird, and a Cat"
SHC_cripple_bird_cat_desc:0 ""
SHC_the_dark_vision:0 "The Dark Vision"
SHC_the_dark_vision_desc:0 "Kargath has been granted a vision, a monster in Orcs skin turning into savages and burning the world after world, whispers from the east talk of Ner'zhuls new apprentice, the green orc."
SHC_trust_the_hand:0 "Trust The Hand"
SHC_trust_the_hand_desc:0 ""
SHC_talismen_of_the_fallen:0 "Talismen of the Fallen"
SHC_talismen_of_the_fallen_desc:0 "Vragor brought to us talismans from the fallen, he recouted tales of warriors infected with the pox fighting against Arrakoa in great battles, many stories ended with the warriors death, but every story had a talisman"
SHC_aid_zharoks_rise:0 "Aid Zharoks Rise"
SHC_aid_zharoks_rise_desc:0 "Vragor has informed of of an Exile in the East who wishes to help our people with their sickness, though not entirely without her own benefit, she is more then willing to take in the infected as her is own people have already been altered by the sickness."
SHC_bend_the_elements:0 "Bend the Elements"
SHC_bend_the_elements_desc:0 "After the Culling of the Sabercats many of the elements have refused communion, Vragor has been able to coax them into action, through at dismay of the elders."
SHC_final_glory:0 "Final Glory"
SHC_final_glory_desc:0 "A Large Number of Warriors have asked the Chieftain for permission to head to the east to the Veil, Zharok tended to the pain of their loved ones for the short time she spent in the Pox Encampments, and wish to extend to her their gratitude.\n\nShe will need true warriors when the time comes."
