SHC_from_the_west:0 "From The West"
SHC_from_the_west_desc:0 "Members of the Slave Pits continue to trek through Warsong territory, the Clansmen having seen the fires of Highmaul allow us free passage seeing us as true warriors."

SHC_Newely_Formed_Clan_1:0 "Liberation from Highmaul"
SHC_Newely_Formed_Clan_1_desc:0 "Led by Kargath, the orc slaves of Highmaul broke free from their rulers and fled east. Settling in the Spires of Arak, they establish themselves as a new clan called Shattered Hand."

SHC_Newely_Formed_Clan_2:0 "Liberation from Highmaul"
SHC_Newely_Formed_Clan_2_desc:0 "Led by Kargath, the orc slaves of Highmaul broke free from their rulers and fled east. Settling in the Spires of Arak, they establish themselves as a new clan called Shattered Hand."

SHC_liberated_gladiators_1:0 "Liberated Gladiators"
SHC_liberated_gladiators_1_desc:0 "The Shattered Hand Cut their teeth in the Arenas of Highmaul, fighting Ogres, Beast and other Orcs, they will use anything they can to survive."
SHC_liberated_gladiators_2:0 "The Path of Glory"
SHC_liberated_gladiators_2_desc:0 ""

SHC_only_war_1:0 "Bred for Battle"
SHC_only_war_1:0 "Many of the clan were born into servitude, knowing only how to fight and do manual labour, it will take some time before they return to the roots of their people."

