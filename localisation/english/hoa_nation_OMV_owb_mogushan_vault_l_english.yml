owb_mogushan_vault.1:0 "Great Vault Discovered"
owb_mogushan_vault.1.d:0 "While surveying for resources your workers have stumbled upon something extraordinary: a massive, rusted metal door buried beneath layers of sand and stone, adorned with cryptic runes and a faded symbol resembling a cogwheel pierced by a sword. After days of excavation, the truth is revealed—a long-forgotten vault, sealed tight and pulsing with an eerie arcane hum. Whispers among your troops suggest it could be a relic left behind by the titans. The question remains: will you harness its secrets, or leave this relic buried in the past"
owb_mogushan_vault.1.option.1:0 "Leave it be"
