l_english:
 # Decision Category
 stormreaver_secret_designs_category:0 "The Secret Designs of Gul'dan"
 stormreaver_secret_designs_category_desc:0 "Hidden from the Horde, whispered in darkness, Gul'dan pursues his own designs. How much power can he accumulate before Orgrim or the Legion realizes what he is doing?"

 # Decision 1: Raise New Death Knights
 src_secret_design_death_knights:0 "Raise New Death Knights"
 src_secret_design_death_knights_desc:0 "The work begun at the Shadow Council's fall is not finished. More bodies wait for willing souls. More knights await transformation."
 src_create_first_dk_tt:0 "Creates the first Death Knight and sets Teron Gorefiend on his path."
 src_expand_dk_tt:0 "Expands the Death Knight order with additional warriors."

 # Decision 2: Fel Artillery Rituals
 src_secret_design_fel_artillery:0 "Fel Artillery Rituals"
 src_secret_design_fel_artillery_desc:0 "Imbue siege engines with fel fire. The Alliance walls will burn."

 # Decision 3: Warlock Support Cadres
 src_secret_design_warlock_cadres:0 "Warlock Support Cadres"
 src_secret_design_warlock_cadres_desc:0 "Detach warlock support teams to front-line clan operations. Let them see the value of our magic."

 # Decision 4: Gather Forbidden Relics
 src_secret_design_relics:0 "Gather Forbidden Relics"
 src_secret_design_relics_desc:0 "Scour the conquered lands for artifacts of power. The humans left much behind."

 # Decision 5: Bind Lesser Demons
 src_secret_design_bind_demons:0 "Bind Lesser Demons"
 src_secret_design_bind_demons_desc:0 "Summon and bind minor demons to serve as scouts and weapons. The Legion need not know... yet."
 src_demonic_attention_tt:0 "Our activities have attracted the attention of darker forces."

 # Decision 6: Drain Captured Artifacts
 src_secret_design_drain_artifacts:0 "Drain Captured Artifacts"
 src_secret_design_drain_artifacts_desc:0 "The Alliance carries enchanted weapons. Drain them of their power."

 # Decision 7: Expand the Stormreaver Coven
 src_secret_design_expand_coven:0 "Expand the Stormreaver Coven"
 src_secret_design_expand_coven_desc:0 "Recruit more warlocks to the clan. Power grows with numbers."

 # Decision 8: Restore Hidden Contacts
 src_secret_design_restore_contacts:0 "Restore Hidden Contacts"
 src_secret_design_restore_contacts_desc:0 "The Shadow Council's network was shattered but not destroyed. Rebuild the old spiderweb."

 # Decision 9: Compromise a Clan Adviser
 src_secret_design_compromise_adviser:0 "Compromise a Clan Adviser"
 src_secret_design_compromise_adviser_desc:0 "Place a trusted agent close to another clan's leadership."

 # Decision 10: Rebuild the Inner Circle
 src_secret_design_inner_circle:0 "Rebuild the Inner Circle"
 src_secret_design_inner_circle_desc:0 "The Shadow Council's core must be restored. Select trusted warlocks."

 # Decision 11: Conceal the Coven
 src_secret_design_conceal_coven:0 "Conceal the Coven"
 src_secret_design_conceal_coven_desc:0 "Redouble efforts to hide our true activities from Doomhammer's spies."

 # Decision 12: Search Medivh's Memories
 src_secret_design_medivh_memories:0 "Search Medivh's Memories"
 src_secret_design_medivh_memories_desc:0 "The Guardian's mind was vast. Somewhere in the fragments seen before the coma lies the way."

 # Decision 13: Trace the Ancient Coordinates
 src_secret_design_trace_coordinates:0 "Trace the Ancient Coordinates"
 src_secret_design_trace_coordinates_desc:0 "Medivh showed us the Tomb's location. Now we must map it precisely."

 # Decision 14: Survey the Great Sea
 src_secret_design_survey_sea:0 "Survey the Great Sea"
 src_secret_design_survey_sea_desc:0 "Send scouts across the ocean. The Broken Isles wait beneath the waves."

 # Decision 15: Prepare the Raising Ritual
 src_secret_design_raising_ritual:0 "Prepare the Raising Ritual"
 src_secret_design_raising_ritual_desc:0 "The Tomb was sunk deep. Raising it will require immense power."

 # Decision 16: Gather the Stormreavers
 src_secret_design_gather_clan:0 "Gather the Stormreavers"
 src_secret_design_gather_clan_desc:0 "Bring the clan together. Every warlock will be needed."

 # Decision 17: Secure Twilight's Hammer Cooperation
 src_secret_design_secure_thc:0 "Secure Twilight's Hammer Cooperation"
 src_secret_design_secure_thc_desc:0 "Cho'gall and his ogres will be essential to hold off pursuers."

 # Decision 18: Deliver Results to the Warchief
 src_secret_design_deliver_results:0 "Deliver Results to the Warchief"
 src_secret_design_deliver_results_desc:0 "Demonstrate our value to Orgrim. Show him what loyal Stormreavers can achieve."

 # Decision 19: Share Limited Knowledge
 src_secret_design_share_knowledge:0 "Share Limited Knowledge"
 src_secret_design_share_knowledge_desc:0 "Give Orgrim a taste of our power — just enough to satisfy his demands."

 # Decision 20: Renew the Old Communion
 src_secret_design_legion_contact:0 "Renew the Old Communion"
 src_secret_design_legion_contact_desc:0 "Kil'jaeden has been silent too long. Reach out to the old master. There is a different path to power."

 # Decision 21: Prove Our Loyalty
 src_secret_design_legion_proof:0 "Prove Our Loyalty"
 src_secret_design_legion_proof_desc:0 "The Legion demands proof. The war must continue — but our purpose must shift."

 # Decision 22: Rip Open the Way
 src_secret_design_open_the_way:0 "Rip Open the Way"
 src_secret_design_open_the_way_desc:0 "The Tomb is not a vault to plunder. It is a gateway. Open it for the Burning Legion."

 # Decision 23: Sacrifice a Minor Conspirator
 src_secret_design_sacrifice_conspirator:0 "Sacrifice a Minor Conspirator"
 src_secret_design_sacrifice_conspirator_desc:0 "Offer up a coven member. Let Orgrim believe he has found the traitor."

 # Decision 24: Publicly Support the Offensive
 src_secret_design_support_offensive:0 "Publicly Support the Offensive"
 src_secret_design_support_offensive_desc:0 "Make a show of supporting the Warchief's campaign. Actions silence doubt."

 # Event 1: Orgrim Demands Inspection
 src_secret_designs.1.t:0 "The Warchief Demands Answers"
 src_secret_designs.1.d:0 "A Blackrock messenger arrives with a demand: Orgrim Doomhammer has heard whispers of Stormreaver activity beyond the scope of his orders. He demands to inspect our operations personally.\n\nHe claims it is routine. We know better."
 src_secret_designs.1.a:0 "Refuse the inspection. It is none of his concern."
 src_secret_designs.1.a.tt:0 "Orgrim's suspicion grows. Authority is damaged."
 src_secret_designs.1.b:0 "Allow a controlled inspection. Show him what he wants to see."
 src_secret_designs.1.c:0 "Open defiance. Gul'dan answers to no orc."

 # Event 2: Orgrim Learns of Defiance
 src_secret_designs.2.t:0 "Gul'dan Defies the Warchief"
 src_secret_designs.2.d:0 "The Stormreaver warlock has refused to submit to inspection. His messengers were turned away at the gates of Stormwind Keep. The warlock grows bolder — and more dangerous."
 src_secret_designs.2.a:0 "Place them under Dragonmaw watch. This insolence cannot go unanswered."

 # Event 3: Kil'jaeden Speaks
 src_secret_designs.3.t:0 "The Deceiver Whispers"
 src_secret_designs.3.d:0 "In dreams, the familiar voice returns. Kil'jaeden speaks through the fel, his tone patient but demanding. The old master has not forgotten his servant — and he has expectations."
 src_secret_designs.3.a:0 "Accept the gift. Power flows both ways."
 src_secret_designs.3.b:0 "Swear renewed obedience. The Legion's path may be safer than the Tomb."
 src_secret_designs.3.b.tt:0 "Opens the Legion path. Demonic attention increases."

 # Event 4: Advisers Urge Caution
 src_secret_designs.4.t:0 "The Coven Grows Nervous"
 src_secret_designs.4.d:0 "Our inner circle warns that Doomhammer's spies are closing in. Shadow Lord Fel'dan reports that the Dragonmaw have doubled their watchers around Stormwind Keep. They urge caution — perhaps temporary retreat from open activities."
 src_secret_designs.4.a:0 "Ignore them. Gul'dan bows to no one."
 src_secret_designs.4.b:0 "They may have a point. Reduce our visibility."

 # Event 5: Magical Accident
 src_secret_designs.5.t:0 "Ritual Misfire"
 src_secret_designs.5.d:0 "A forbidden ritual has gone wrong. Fel energy erupted through the sanctum, shattering wards and alerting half of Stormwind to our activities. Several initiates were consumed by the backlash."
 src_secret_designs.5.a:0 "The cost is acceptable. Clean up the mess and continue."
 src_secret_designs.5.a.tt:0 "Suspicion increases. The accident was visible."
 src_secret_designs.5.b:0 "Cut our losses. The dead cannot be recovered."

 # Event 10: Dalaran Detection
 src_secret_designs.10.t:0 "Arcane Disturbance Detected"
 src_secret_designs.10.d:0 "The Kirin Tor's scrying network has detected an unusual concentration of fel energy emanating from Stormwind. The warlocks of the Horde are conducting rituals of considerable power. This must be reported to Lordaeron."
 src_secret_designs.10.a:0 "Warn the Alliance. The Horde's warlocks are a threat that cannot be ignored."

 # Event 11: Lordaeron Learns
 src_secret_designs.11.t:0 "Dalaran Reports Dark Magics"
 src_secret_designs.11.d:0 "Archmage Antonidas sends word: the Kirin Tor have detected powerful fel rituals in Horde-occupied Stormwind. The warlock Gul'dan appears to be conducting operations beyond typical combat magic. The implications are troubling."
 src_secret_designs.11.a:0 "Take note. This may present an opportunity."

 # Event 12: Stormreaver Knows They Are Detected
 src_secret_designs.12.t:0 "Dalaran Knows"
 src_secret_designs.12.d:0 "Our contacts report that Dalaran has detected the coven's activities. The Kirin Tor's scrying network has traced the fel signature back to Stormwind Keep. We are no longer entirely hidden."
 src_secret_designs.12.a:0 "Curse them. Accelerate the tomb preparation before they interfere."
 src_secret_designs.12.b:0 "Good. Let them watch. They can do nothing to stop us."

 # Event 13: Dalaran Traces Communications
 src_secret_designs.13.t:0 "Kirin Tor Traces Warlock Communications"
 src_secret_designs.13.d:0 "The Kirin Tor's diviners have intercepted magical communications between the Stormreaver coven and unknown recipients. By tracing these threads, they hope to reveal the warlock's true designs."
 src_secret_designs.13.a:0 "Continue the trace. Every scrap of intelligence matters."

 # Event 20: Decision Point
 src_secret_designs.20.t:0 "The Fork in Darkness"
 src_secret_designs.20.d:0 "The Tomb is found. The ritual is prepared. The clan is gathered. And now the whisper returns — Kil'jaeden's voice, offering a different path.\n\nGul'dan stands at a crossroads. One road leads into the Tomb, to seize power for himself alone. The other leads into the Legion's service, to use the Tomb as their gateway into Azeroth.\n\nBoth are betrayal. Only one is personal."
 src_secret_designs.20.a:0 "The Tomb's power is mine. I serve no master."
 src_secret_designs.20.b:0 "I have always been the Legion's instrument. Open the gate."

 # Event 50: Legion Portal Opens
 src_secret_designs.50.t:0 "The Legion Comes"
 src_secret_designs.50.d:0 "It is done. The portal tears open above the Broken Isles, a wound in the sky through which the Burning Legion pours. Gul'dan stands before the inferno, herald to the end of Azeroth. The Horde is abandoned. The Legion has arrived."
 src_secret_designs.50.a:0 "All will burn before the Legion."

 # Event 51: Orgrim Learns of Legion
 src_secret_designs.51.t:0 "The Legion Opens the Way"
 src_secret_designs.51.d:0 "Disaster. Gul'dan has not merely deserted — he has opened a gateway for the Burning Legion itself. Demon armies pour through into Azeroth. The warlock has betrayed not just the Horde, but the entire world."
 src_secret_designs.51.a:0 "This is beyond betrayal. This is annihilation."

 # Event 52: Alliance Learns of Legion
 src_secret_designs.52.t:0 "The Legion Arrives on Azeroth"
 src_secret_designs.52.d:0 "Reports flood in from every corner of the Alliance: demons are appearing across the continent. The warlock Gul'dan has opened a portal for the Burning Legion. The Second War has just become something far more terrible."
 src_secret_designs.52.a:0 "Sound the alarm. The enemy of all life has come."

 # Event 60: Raise the Broken Isles
 src_secret_designs.60.t:0 "Raise the Broken Isles"
 src_secret_designs.60.d:0 "The storm gathers. The ritual reaches its peak. Gul'dan channels all his power and the sea itself begins to churn. Ancient spires break the surface. The Tomb of Sargeras rises from the depths.\n\nPower awaits inside."
 src_secret_designs.60.a:0 "Enter the Tomb. Claim what was promised."
 src_secret_designs.60.a.tt:0 "Gul'dan enters the Tomb of Sargeras to claim its power. The historical fate awaits."

 # Event 61: Gul'dan Survives
 src_secret_designs.61.t:0 "The Tomb Survived"
 src_secret_designs.61.d:0 "By sheer will and bloody sacrifice, Gul'dan has escaped the Tomb of Sargeras alive — unlike the doomed expedition history records. The demons inside were fierce, and many Stormreaver warlocks did not return. But Gul'dan himself survived.\n\nHe is damaged. Diminished. But alive."
 src_secret_designs.61.a:0 "We live. That is what matters."
 src_secret_designs.61.a.tt:0 "Gul'dan survives the Tomb expedition, damaged but alive. A non-historical outcome."

 # Event 70: Orgrim Confronts Gul'dan
 src_secret_designs.70.t:0 "The Warchief's Patience Ends"
 src_secret_designs.70.d:0 "Doomhammer arrives at Stormwind Keep unannounced. His guards surround the inner sanctum. The Warchief's eyes burn with barely contained fury.\n\n'You think I do not see, warlock? Your ships. Your rituals. Your whispered ambitions. Explain yourself — or face the consequence.'"
 src_secret_designs.70.a:0 "I answer to no one. The Stormreavers are beyond your reach."
 src_secret_designs.70.b:0 "You misunderstand, Warchief. Everything I do strengthens the Horde."
 src_secret_designs.70.c:0 "Enough. The time for pretense is over. Stormreavers — to the ships!"

 # Event 71: Orgrim Tolerates Gul'dan
 src_secret_designs.71.t:0 "The Warchief's Judgment"
 src_secret_designs.71.d:0 "The war is won. The Horde has triumphed. And now Orgrim Doomhammer makes his decision regarding the warlock who served loyally.\n\nGul'dan watches the Warchief's face, reading the calculation behind those iron eyes. Loyalty was proven on the battlefield. But Doomhammer has never trusted him."
 src_secret_designs.71.a:0 "Accept Orgrim's tolerance. Wait for the right moment."
 src_secret_designs.71.b:0 "Victory changes nothing. I will rule what the Horde has won."

 # Idea tooltips
 SRC_suspicion_trusted:0 "Trusted Asset"
 SRC_suspicion_trusted_desc:0 "Orgrim Doomhammer regards the Stormreavers as a useful, if distasteful, tool."

 SRC_suspicion_watched:0 "Watched"
 SRC_suspicion_watched_desc:0 "Spies have been placed among us. Doomhammer is keeping a close eye on Stormreaver activities."

 SRC_suspicion_suspected:0 "Suspected"
 SRC_suspicion_suspected_desc:0 "The Warchief suspects independent action. Inspections are frequent. Questions are pointed."

 SRC_suspicion_open_rival:0 "Open Rival"
 SRC_suspicion_open_rival_desc:0 "The pretense has crumbled. Doomhammer sees Gul'dan as a rival to be contained or crushed."

 SRC_forbidden_power_low:0 "Minor Magical Accumulation"
 SRC_forbidden_power_low_desc:0 ""

 SRC_forbidden_power_medium:0 "Growing Magical Power"
 SRC_forbidden_power_medium_desc:0 "The coven's power is building. Rituals grow in scope."

 SRC_forbidden_power_high:0 "Immense Forbidden Power"
 SRC_forbidden_power_high_desc:0 "Gul'dan has accumulated formidable dark power. The coven stands ready for great works."
