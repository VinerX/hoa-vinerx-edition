l_english:
 stromgarde_sw.1.t:0 "The Call from Capital City"
 stromgarde_sw.1.d:0 "An envoy from Lordaeron arrives at the gates of Stromgarde Keep bearing King Terenas's personal seal. The Council of the Seven Nations has convened, and the Alliance of Lordaeron now calls upon the Kingdom of Stromgarde to honour the ancient bonds of Arathor.\n\nTrollbane's hall buzzes with debate. The old guard demands every sword remain to hold the Highland passes against whatever comes. The younger commanders who fought alongside Lothar's refugees speak of honour, of debts to Stormwind, of the gathering storm beyond Khaz Modan.\n\nThree clear paths lie before the King, each carrying its own weight of sacrifice."
 stromgarde_sw.1.a:0 "All our strength for Lothar вЂ” we march with the Alliance"
 stromgarde_sw.1.b:0 "We shall guard the southern approaches вЂ” hold Arathi at all costs"
 stromgarde_sw.1.c:0 "Our eyes are on the mountain passes вЂ” the silence from Alterac troubles us"
 stromgarde_sw.1.d:0 "Stromgarde stands alone вЂ” we will not bind our fate to Lordaeron"
 stromgarde_sw.2.t:0 "The Army Divided вЂ” A Commander's Choice"
 stromgarde_sw.2.d:0 "Months have passed since the banners of the Alliance were raised over Stromgarde Keep. The demands of war pull in every direction вЂ” Lothar's field army requires reinforcement, the southern approaches demand vigilance, and the mountain passes grow restless.\n\nKing Trollbane convenes his war council once more. The allocation of forces must be reconsidered."
 stromgarde_sw.2.a:0 "Every decision shapes the outcome of this war."

# Phase 2: Alterac Question
 stromgarde_sw.10.t:0 "The Perenolde Problem"
 stromgarde_sw.10.d:0 "Lordaeron's envoy spoke of unity, of all seven kingdoms standing together against the Orcish Horde. But from Alterac there is only silence.\n\nKing Perenolde has sent no troops, offered no supplies, and his border patrols turn back Stromic messengers with thin excuses. The old border disputes between Stromgarde and Alterac have never truly healed, and now вЂ” with a war brewing вЂ” Perenolde's silence feels less like neutrality and more like something far darker.\n\nSome on the council urge caution: 'Let Terenas deal with his own neighbours.' Others see an opportunity to finally settle the score with the kingdom that has been a thorn in Stromgarde's side for generations."
 stromgarde_sw.10.a:0 "Keep a close watch on our western border."
 stromgarde_sw.11.t:0 "Gathering Evidence"
 stromgarde_sw.11.d:0 "The reports from the western passes are troubling. Alterac patrols have withdrawn from the border, leaving mountain trails unguarded. Captured merchants speak of strange caravans moving at night, of green-skinned figures glimpsed in the high valleys.\n\nThe pattern is unmistakable to those who know how to read it: Perenolde is not simply failing in his duties вЂ” he is actively clearing the way for something."
 stromgarde_sw.11.a:0 "Take this evidence to the King immediately."
 stromgarde_sw.12.t:0 "The Truth Uncovered"
 stromgarde_sw.12.d:0 "A captured Alterac courier, intercepted on the mountain road, carried letters sealed with Perenolde's own signet. The contents leave no room for doubt: Alterac has struck a bargain with the Horde, promising safe passage through the mountain passes in exchange for survival.\n\nTrollbane slams the letters onto the council table. 'I knew it,' he growls. 'That snake has been feeding us lies while sharpening a knife for our backs.'\n\nThe question now is not whether Perenolde is a traitor вЂ” but how much damage has already been done, and whether Stromgarde can stop the flood before it begins."
 stromgarde_sw.12.a:0 "Rally the mountain regiments. Seal every pass we can reach."

# Alterac Betrayal outcomes
 stromgarde_sw.20.t:0 "The Alterac Betrayal вЂ” Our Vigilance Pays"
 stromgarde_sw.20.d:0 "The word arrives at dawn: Alterac has thrown open its mountain passes to the Horde. Orcish columns are already moving through the high valleys, aiming to bypass the Alliance front entirely and strike at the heart of Lordaeron.\n\nBut Stromgarde was not caught sleeping. Thanks to months of patient investigation, the mountain regiments were already positioned along the key passes. The border forts are manned, the trails are watched, and blocking detachments are moving into position.\n\nThe Orcs will find the road north far harder than Perenolde promised them."
 stromgarde_sw.20.a:0 "Hold the passes! Every hour we buy saves Lordaeron."
 stromgarde_sw_blocked_passes_tt:0 "The mountain passes through southern Alterac have been partially blocked by Stromic forces, reducing the number of Horde columns that can reach the northern front."
 stromgarde_sw.21.t:0 "The Knife at Our Back"
 stromgarde_sw.21.d:0 "The alarm bells ring across Arathi. Orcish banners have been sighted on the northern roads вЂ” not south of the Thandol Span where they were expected, but streaming down through the Alterac passes that should have been impassable.\n\nPerenolde has betrayed them all. The mountain paths that Stromgarde ignored are now highways for the Horde, and the first columns are already behind the Alliance defensive line.\n\nTrollbane's face darkens as he reads the scouting reports. 'We should have watched Alterac closer. Now every kingdom north of here will pay for our blindness.'"
 stromgarde_sw.21.a:0 "Sound the general alarm. Every soldier to the wall."

# Phase 3: Thandol Span
 stromgarde_sw.30.t:0 "The Horde Approaches Thandol"
 stromgarde_sw.30.d:0 "Scouts return from the south with grim tidings: the Orcish war machine has reached the far side of the Thandol Span. The ancient bridge that connects Khaz Modan to the Arathi Highlands вЂ” Thoradin's own crossing вЂ” is now the last barrier between the Horde and the northern kingdoms.\n\nThe Thandol Span is defensible, but only if it is properly garrisoned. If the Orcs force a crossing before Alliance reinforcements arrive, the road to Stromgarde Keep вЂ” and beyond it to Lordaeron itself вЂ” will lie open."
 stromgarde_sw.30.a:0 "Mobilise the garrison. The Span must hold."
 stromgarde_sw.30.b:0 "Our forces are spread too thin. We must fall back to the Keep."
 stromgarde_sw.31.t:0 "The Gate to Arathi is Open"
 stromgarde_sw.31.d:0 "The Thandol Span has fallen.\n\nDespite the garrison's valiant stand, Orcish numbers and siege engines proved too much. The ancient bridge is now in Horde hands, and the first raiding parties have already been sighted in the southern highlands.\n\nThe shield of Arathi has been pierced. What follows will decide the fate of the northern kingdoms."
 stromgarde_sw.31.a:0 "Fall back to the Keep. Make them pay for every inch of Arathi soil."
 stromgarde_sw.32.t:0 "The Road South Reopens"
 stromgarde_sw.32.d:0 "After months of bitter fighting, Alliance forces have driven the Horde back across the Thandol Span. Stromic engineers work through the night to repair the damage, and the first supply columns are already crossing southward.\n\nThe gate that once let the enemy flood north now becomes the path of liberation. Khaz Modan awaits."
 stromgarde_sw.32.a:0 "Now we carry the war to them."
 stromgarde_sw.33.t:0 "Trollbane's Warning"
 stromgarde_sw.33.d:0 "An urgent dispatch arrives from Stromgarde: the Horde has reached the Thandol Span. King Trollbane's garrison is digging in, but he warns that without reinforcement the ancient crossing will not hold indefinitely.\n\nThe southern front is about to become the war's decisive theatre."
 stromgarde_sw.33.a:0 "We must reinforce the Span immediately."

# Phase 4: Danath's March South
 stromgarde_sw.40.t:0 "Danath's Rangers"
 stromgarde_sw.40.d:0 "With the Orcish Horde now a direct threat to Arathi soil, Danath Trollbane вЂ” nephew to the King and the finest field commander Stromgarde has produced in a generation вЂ” proposes the formation of a specialised ranger force.\n\nHis vision is simple: light, fast-moving companies that can strike Horde supply lines, harry advancing columns, and buy time for the heavier Alliance infantry to assemble behind the Highland passes. The men are eager, and Danath's reputation guarantees no shortage of volunteers."
 stromgarde_sw.40.a:0 "Form the ranger companies. Give Danath whatever he needs."
 stromgarde_sw.41.t:0 "The Arathi Expeditionary Force"
 stromgarde_sw.41.d:0 "Danath's rangers have bloodied the Horde across a dozen skirmishes, but the strategic situation demands a larger decision.\n\nLothar's army in the north requests seasoned commanders to stiffen the Alliance line. Keeping Danath at home means a commander who knows every pass and ridge of Arathi by heart. Sending him south to Lothar strengthens the main Alliance army and builds the bonds of coalition warfare.\n\nA third voice on the council whispers of a bolder vision still: begin preparing now for the day when the tide turns, and the Alliance marches south to liberate Khaz Modan."
 stromgarde_sw.41.a:0 "Send Danath to Lothar вЂ” the Alliance needs his sword arm"
 stromgarde_sw.41.b:0 "Keep Danath in Stromgarde вЂ” Arathi is his true duty"
 stromgarde_sw.41.c:0 "Begin preparing for the southern expedition вЂ” Khaz Modan will need us"
 stromgarde_sw.42.t:0 "Danath's March South"
 stromgarde_sw.42.d:0 "The strategic picture has shifted. The Horde is reeling, the Thandol Span is back in Alliance hands, and the time for defence is over.\n\nDanath Trollbane stands before the assembled regiments of Stromgarde and delivers a speech that will echo through the chronicles: 'We held the line when no one else could. Now we show them what Stromgarde does when the tide turns.'\n\nThe march south begins. Khaz Modan will be free."
 stromgarde_sw.42.a:0 "Forward! To Khaz Modan and victory!"
 stromgarde_sw.50.t:0 "Veterans of the Second War"
 stromgarde_sw.50.d:0 "The war is over. The Dark Portal stands sealed, the Horde is broken, and the armies of the Alliance return to their homes carrying both scars and glory.\n\nStromgarde has paid a heavier price than most. Its regiments were at the front from the first alarm at Thandol to the final assault on Blackrock Spire. Its sons bled in the mountain passes, on the plains of Arathi, and in the liberation of Khaz Modan.\n\nBut those who return are steel. They have fought the Orcish Horde face to face and prevailed. The kingdom is exhausted, but it is unbowed вЂ” and its army is now the most battle-hardened force on the continent."
 stromgarde_sw.50.a:0 "Stromgarde remembers. Stromgarde endures."

# Phase 1: Divided Army decisions
 STR_commit_to_field_army:0 "Commit Regiments to the Field Army"
 STR_commit_to_field_army_desc:0 "Dispatch additional regiments to reinforce Lothar's Alliance army on the central front. Every sword sent north strengthens the coalition but leaves fewer to guard our own borders."
 STR_reinforce_homeland:0 "Reinforce the Arathi Line"
 STR_reinforce_homeland_desc:0 "Consolidate our forces along the defensive positions in the Arathi Highlands. The southern approaches and the Thandol Span must hold at all costs."
 STR_strengthen_mountain_watch:0 "Strengthen the Mountain Watch"
 STR_strengthen_mountain_watch_desc:0 "Redirect forces to patrol the mountain passes along the Alterac border. If Perenolde is hiding something, we will find it вЂ” and if the Horde tries to use the passes, we will be ready."
 STR_recall_reserves:0 "Recall Reserve Forces"
 STR_recall_reserves_desc:0 "Call up emergency reserves to address an immediate manpower crisis. This will strain relations with our allies, who expect Stromgarde to bear its share of the burden."

# Phase 2: Alterac investigation decisions
 STR_patrol_western_border:0 "Patrol the Western Border"
 STR_patrol_western_border_desc:0 "Increase patrols along the Stromgarde-Alterac frontier. If Perenolde is concealing troop movements or opening the passes to an enemy, our patrols may catch the evidence."
 STR_question_alterac_merchants:0 "Question Alterac Merchants"
 STR_question_alterac_merchants_desc:0 "Alterac traders pass through Stromgarde regularly, carrying goods вЂ” and information. A few well-placed questions, some coin in the right pockets, and we may learn what Perenolde is hiding."
 STR_send_scouts_into_passes:0 "Send Scouts into the Passes"
 STR_send_scouts_into_passes_desc:0 "Send reconnaissance teams deep into the mountain passes that separate Alterac from the northern kingdoms. This risks a diplomatic incident, but if the Horde is already using these routes, we must know."
 STR_share_suspicions_with_terenas:0 "Share Suspicions with Lordaeron"
 STR_share_suspicions_with_terenas_desc:0 "Send a trusted emissary to Capital City to brief King Terenas on what we have observed. If Alterac is compromised, the Alliance must prepare a response before the knife falls."

# Phase 3: Thandol Span decisions
 STR_fortify_thandol_northern:0 "Fortify the Northern Approaches"
 STR_fortify_thandol_northern_desc:0 "Construct bunkers, artillery positions, and supply depots on the northern end of the Thandol Span. If the Horde tries to cross, they will hit a wall of steel."
 STR_prepare_thandol_demolition:0 "Prepare Demolition Charges"
 STR_prepare_thandol_demolition_desc:0 "Rig the Thandol Span with prepared demolition charges. If the Horde forces a crossing, the span itself can be brought down вЂ” at terrible cost, but denying the enemy their highway north."
 STR_emergency_rally:0 "Emergency Rally"
 STR_emergency_rally_desc:0 "The Horde has crossed the Thandol Span. Call every available soldier, militiaman, and retiree to the colours. Arathi must not fall."
 STR_secure_thandol_span:0 "Secure the Thandol Span"
 STR_secure_thandol_span_desc:0 "With the Horde driven back, repair and garrison the crossing permanently. The Thandol Span must never again be a point of weakness."
 STR_escort_alliance_engineers:0 "Escort Alliance Engineers South"
 STR_escort_alliance_engineers_desc:0 "Provide armed escort for Alliance engineering teams crossing into Khaz Modan. The faster the roads and bridges are rebuilt, the sooner the counteroffensive can begin in earnest."

# Phase 4: Danath decisions
 STR_relieve_ironforge:0 "Relieve Ironforge"
 STR_relieve_ironforge_desc:0 "Dispatch a relief column to break the siege of Ironforge. If the dwarven capital falls, the Horde will control the entire Khaz Modan industrial heartland."
 STR_clear_the_wetlands:0 "Clear the Wetlands"
 STR_clear_the_wetlands_desc:0 "Launch a coordinated offensive to drive Horde forces out of the Wetlands. Control of this region will secure the Alliance southern flank and open the road to the Badlands."
 STR_advance_toward_blackrock:0 "Advance Toward Blackrock"
 STR_advance_toward_blackrock_desc:0 "Push south into the heart of Horde territory. Blackrock Mountain is the ultimate objective вЂ” the seat of the Orcish war machine and the key to ending this war."

# New ideas/spirits
 STR_army_divided_field:0 "The Army Divided: To the Front"
 STR_army_divided_field_desc:0 "The bulk of Stromgarde's army has been committed to Lothar's field army on the central front. Our regiments fight alongside the Alliance's finest, but the homeland's defences are thinner than the council would like."
 STR_army_divided_homeland:0 "The Army Divided: Southern Shield"
 STR_army_divided_homeland_desc:0 "Stromgarde's forces are concentrated on the southern defensive line, anchored on the Thandol Span and the Arathi approaches. Every hill has a garrison, every pass has a blocking force. The Alliance's shield is strong вЂ” but the field army fights with fewer Stromic swords."
 STR_army_divided_mountain:0 "The Army Divided: Mountain Watch"
 STR_army_divided_mountain_desc:0 "Stromgarde's regiments are deployed primarily in the mountain passes and along the Alterac frontier. Our reconnaissance network extends deep into the high valleys. The Alliance's eyes are sharp вЂ” but the southern front and the field army receive fewer reinforcements."
 STR_suspicious_neighbour:0 "Suspicious Neighbour"
 STR_suspicious_neighbour_desc:0 "The silence from Alterac grows more troubling by the day. Perenolde's border patrols have vanished, his messengers make excuses, and the mountain passes are suspiciously quiet. Something is being hidden in those peaks."
 STR_thandol_garrisoned:0 "Thandol Span Garrisoned"
 STR_thandol_garrisoned_desc:0 "The ancient crossing between Khaz Modan and Arathi is fully garrisoned with Stromic regulars. Bunkers, artillery, and prepared positions make the northern approach a killing ground."
 STR_thandol_broken:0 "The Gate to Arathi is Open"
 STR_thandol_broken_desc:0 "The Horde has forced the Thandol Span. The enemy is now on Arathi soil, and the road to Stromgarde Keep вЂ” and beyond it, the heartland of the Alliance вЂ” lies dangerously exposed."
 STR_thandol_secured:0 "The Road South Reopens"
 STR_thandol_secured_desc:0 "The Thandol Span is back in Alliance hands, repaired and secured. Supply convoys and reinforcement columns now stream southward into Khaz Modan, turning the old crossing into the highway of liberation."
 STR_danath_rangers:0 "Danath's Rangers"
 STR_danath_rangers_desc:0 "Danath Trollbane has raised a corps of light, fast-moving ranger companies specialising in reconnaissance, raiding, and delaying actions. They are the Horde's shadow in the Arathi Highlands."
 STR_danath_expeditionary:0 "Danath's Expeditionary Force"
 STR_danath_expeditionary_desc:0 "Danath Trollbane and a hand-picked contingent of Stromic veterans now serve in Lothar's field army. Their presence strengthens the Alliance's fighting spirit and deepens the bonds between the coalition's members."
 STR_danath_arathi_defender:0 "Danath: Defender of Arathi"
 STR_danath_arathi_defender_desc:0 "Danath Trollbane commands the defence of his homeland in person. Every soldier in Arathi fights harder knowing their general is on the line with them."
 STR_danath_southern_prep:0 "Preparing the Southern Expedition"
 STR_danath_southern_prep_desc:0 "Even as the war rages, Danath Trollbane is quietly assembling the logistics, maps, and specialised companies that will be needed when the Alliance turns south to liberate Khaz Modan. When that day comes, Stromgarde will be ready."
 STR_danath_march_south:0 "Danath's March South"
 STR_danath_march_south_desc:0 "The counteroffensive has begun. Danath Trollbane leads the Stromic regiments south across the liberated Thandol Span, carrying the war into Horde-occupied Khaz Modan. The tide has turned."
 STR_veterans_second_war:0 "Veterans of the Second War"
 STR_veterans_second_war_desc:0 "The war is won. Stromgarde has paid in blood for every inch of ground from Thandol to Blackrock, and its surviving soldiers are now the most battle-hardened force on the continent. The kingdom is exhausted, but its army is steel."
 LOR_danath_reinforcement:0 "Danath's Stromic Contingent"
 LOR_danath_reinforcement_desc:0 "A hand-picked force of Stromic veterans under the command of Danath Trollbane has joined Lothar's field army. Their arrival boosts morale and provides seasoned troops for the central front."

# Decision category names (for tooltips)
 STR_divided_army_decisions:0 "The Divided Army"
 STR_alterac_watch_decisions:0 "The Alterac Watch"
 STR_thandol_span_decisions:0 "The Thandol Span"
 STR_danath_decisions:0 "Danath's Campaign"
