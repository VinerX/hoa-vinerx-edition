 STR_sw_investigation_advanced_tt:0 "Investigation progress advanced."
 STR_sw_investigation_no_progress_tt:0 "No new evidence found."

# LORD PROTO event additions
 lordaeron_second_war_proto.4.t:0 "Stromgarde Answers"
 lordaeron_second_war_proto.4.d:0 "The reply from Stromgarde has arrived. King Trollbane's messengers have delivered his decision вЂ” one that will shape the Alliance's strategic posture on the southern front."
 lordaeron_second_war_proto.4.option.1:0 "We are honoured by their commitment."
 lordaeron_second_war_proto.4.option.2:0 "Their caution is understandable."
 lordaeron_second_war_proto.4.option.3:0 "A strange choice, but we must accept it."
 lordaeron_second_war_proto.4.option.4:0 "Then Stromgarde stands alone."
