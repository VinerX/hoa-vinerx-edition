halloween_event.1.t:0 "The Day of Reckoning"
halloween_event.1.d:0 ""
halloween_event.option.1:0 "Play As the Horseman"
halloween_event.option.2:0 "Ignore the Madman"

headless_horseman.0.t:0 "Before My Time"
headless_horseman.0.d:0 "In days of yore, my time held true, the Horseman's curse set for a future due. But a meddlesome Bronze, with temporal might, twisted the threads in eternal night. Years before fate's hour, I ride forth now with unholy power. Cry out in terror, ye mortals so frail, for the dragon's whim has unveiled my tale!"
headless_horseman.0.option.1:0 "A Time Most Fitting"

headless_horseman.1.t:0 "The Horseman Rises"
headless_horseman.1.d:0 "prepare yourselves, the bells have tolled! Shelter your weak, your young and your old! Each of you shall pay the final sum. Cry for mercy, the reckoning has come!"
headless_horseman.1.option.1:0 "A Cautious Horseman"
headless_horseman.1.option.2:0 "A Bold Horseman"
headless_horseman.1.option.3:0 "A Statesman Horseman"
headless_horseman.1.option.4:0 "A Cruel Horseman"

headless_horseman.2.t:0 "A New Head"
headless_horseman.2.d:0 "As you awake your body walks into several walls having no head makes for a difficult life. You should choose one from what is available to you in the monastery."
headless_horseman.2.option.1:0 "Ahh yes, a Suitable Smile"

headless_horseman.3.t:0 "The Haunting Begins"
headless_horseman.3.d:0 "The people of Lordaeron ignored you in life and as a result will be one of the first to know of your presence."
headless_horseman.3.option.1:0 "So many lives, so little time."

headless_horseman.4.t:0 "Soldiers Arise"
headless_horseman.4.d:0 "soldiers arise, stand and fight! Bring victory at last to this fallen knight!"
headless_horseman.4.option.1:0 "Sprouting Pumpkins"
headless_horseman.4.option.2:0 "Riders of the Night"

headless_horseman.5.t:0 "Broom Closets"
headless_horseman.5.d:0 "The Horseman demands more closets to house his brooms in."
headless_horseman.5.option.1:0 "his will be done."

headless_horseman.6.t:0 "Raised from the Depths"
headless_horseman.6.d:0 "Over the countless years of Azeroth’s history countless ships have sunk to the depths. The Horseman can raise many of them but must choose what is more important."
headless_horseman.6.option.1:0 "Raise mostly Heavy Ships."
headless_horseman.6.option.2:0 "Raise as many small ships as possible."

headless_horseman.7.t:0 "The Haunting of Brill"
headless_horseman.7.d:0 "Brill is the only thing standing between the Horseman and the capital city of Lordaeron. it is from here that the horseman shall strike."
headless_horseman.7.option.1:0 "To The Fields."

headless_horseman.8.t:0 "Corrupt the Land"
headless_horseman.8.d:0 "The people of Lordaeron do not deserve the very land they live on. The Horseman’s Magic can corrupt their lands and raise skeletons across the kingdom."
headless_horseman.8.option.1:0 "Rattle Me Bones!"

headless_horseman.9.t:0 "The Kingdom Falls"
headless_horseman.9.d:0 "The people of Lordaeron have been slain the fallen kingdom now belongs to the Headless Horseman."
headless_horseman.9.option.1:0 "Hail to the new king!"

headless_horseman.10.t:0 "The Haunting of Farstrider Square"
headless_horseman.10.d:0 "Farstrider Square lays in the very heart of Silvermoon City and the kingdom of Quel’thalas. Striking here will be an easy way to bring the high elves to their knees."
headless_horseman.10.option.1:0 "Let the Haunting Begin!"

headless_horseman.11.t:0 "Fall of Quel'thalas"
headless_horseman.11.d:0 "Quelthalas lays in ruins the Horseman now sits in Sunfury Spire as the ruler of the golden kingdom. The Sunwell once a beacon of light now glows orange empowering your pumpkin fiends to new heights."
headless_horseman.11.option.1:0 "Glory to the new kingdom."

headless_horseman.12.t:0 "The Haunting of Kharanos"
headless_horseman.12.d:0 ""
headless_horseman.12.option.1:0 "Let the Haunting Begin!"

headless_horseman.13.t:0 "The Haunting of Goldshire"
headless_horseman.13.d:0 "Goldshire, the heart of Elwynn forest and thus the Kingdom of Stormwind, it is from here that the horseman shall strike."
headless_horseman.13.option.1:0 "Let the Haunting Begin!"

headless_horseman.14.t:0 "A Throne Fit for your Head"
headless_horseman.14.d:0 "King Llane is dead and in his place in Stormwinds throne now sits the Headless Horseman. The kingdom of Stormwind has bowed down to its new master."
headless_horseman.14.option.1:0 "Long live the king!"

headless_horseman.15.t:0 "The Haunting of Razor Hill"
headless_horseman.15.d:0 "Razor hill a small town in central Durotar, currently held by the Razormane Quilboars it is from here that the horseman shall strike."
headless_horseman.15.option.1:0 "Let the Haunting Begin!"

headless_horseman.16.t:0 "The Haunting of Bloodhoof Village"
headless_horseman.16.d:0 "Bloodhoof Village a small town in Mulgore, currently held by the Palemane Tribe it is from here that the horseman shall strike."
headless_horseman.16.option.1:0 "Let the Haunting Begin!"

headless_horseman.17.t:0 "The Time for Vengeance"
headless_horseman.17.d:0 "The Time has come for all to know the Horsemans wrath."
headless_horseman.17.option.1:0 "The Horseman Rises."
