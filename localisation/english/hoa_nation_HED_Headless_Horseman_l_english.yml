HED_headless_horseman:0 "The Headless Horseman"
HED_headless_horseman_desc:0 ""
POLITICS_HEADLESS_HORSEMAN_DESC:0 "Once known as the brave knight Sir Thomas, a noble hero of the Silver Hand. The Headless Horseman now stands as a defiled mockery of his gallant past. He served faithfully amongst the legends of the Light like Uther the Lightbringer, Ashbringer Alexandros Mograine, and Saidan Dathrohan. The last compelled the young knight to slaughter refugees; having been convinced they were infected with plague. A cruel twist of fate, Sir Thomas slayed his own family during the massacre. The last he struck with his blade had been his own daughter. Suffering from this loss and grave immorality, Sir Thomas retreated to the Scarlet Monastery. The craven paladin suffered from madness, speaking in rhymes and doom-says. With saddened hearts, the paladins executed Sir Thomas by decapitating him. They believed he would be spared from his grief, and ceremonially buried him within a tomb in respect for his great deeds. Yet Sir Thomas would not be left to rest. On the eve of Hallow's End, a foul magic crept within and twisted the former paladin into the blazed image of a sinister spectral rider. Bearing a foul mask and riding on his resurrected steed, Sir Thomas - now the Headless Horseman departs from his tomb to terrorize the land. With legions of magically animated pumpkin fiends and risen knights, Azeroth lies vulnerable to burn in eerie green fire."
