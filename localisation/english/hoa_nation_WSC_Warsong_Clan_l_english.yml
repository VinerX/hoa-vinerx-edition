POLITICS_GROM_HELLSCREAM_DESC:0 "Grommash Hellscream is a powerful warrior whom leads the Warsong Clan from the front. He was the first orc whom drank the blood of Mannaroth the Destructor and bound the Horde to the Burning Legion. He would redeem himself by paying the ultimate price to free the orcs from the Blood Curse."

