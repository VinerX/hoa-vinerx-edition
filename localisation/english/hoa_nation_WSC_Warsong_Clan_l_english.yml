warsong_third_war.1.t:0 "Thrall's Guidance"
warsong_third_war.1.d:0 "Thrall speaks of a land far beyond a horizon that our fathers would have called our new home, the young leader has instructed us to distract the humans while we withdraw to the sea."
warsong_third_war.1.option.1:0 "We will do more then distract the humans"

warsong_third_war.2.t:0 "Hold the Shore"
warsong_third_war.2.d:0 "The Humans have begun to muster a larger force, Thrall and his clansmans have begun to retreat out to see on the human ships, those of the Frostwolf clan who have chosen to stay behind fight side by side with our own, we will hold the shore till our dying breath."
warsong_third_war.2.option.1:0 "Give him his Axe, he is not dead yet"

warsong_third_war.3.t:0 "The Promised Land"
warsong_third_war.3.d:0 "We landed on the distant shore among the wrackage of countless ships, dread set into our hearts as the idea of our clansmen dying at sea set in, a warcry sounded in the distance as we rushed into the red barren hills, one of our own was fighting a winged...'woman' our warriors rallied, this was not a the peaceful land our fathers had promised, but a land where we could continue our traditions without starvation."
warsong_third_war.3.option.1:0 "Lok'tar Ogar"

warsong_third_war.4.t:0 "The Clans Reunited"
warsong_third_war.4.d:0 "Chieften, our scouts have reported Orcs locked in fierce combat with the Pigmen to the south, they wield the elemental powers of the elements, they must be the Frostwolf clan."
warsong_third_war.4.option.1:0 "Little Brother!"

