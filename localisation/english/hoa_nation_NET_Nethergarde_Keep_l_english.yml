NET_kirin_tor_outpost_desc:0 ""
NET_native_taskforce:0 "The Native Taskforce"
NET_native_taskforce_desc:0 "On top of dealing with the Vrykul we are having issues with the feral little wolf people, the blue kobolds and the trees.\nThe only beings on this continent that have no attacked us as of yet are the Iron Dwarves who are keeping to themselves, and the Bipedal Ox people, work is being made to try to understand their language, but they seem to be pleased that we have stopped the Vrykul from attacking their camps."
NET_by_hammer_or_shield:0 "Open Hand, Or the Hammer"
NET_by_hammer_or_shield_desc:0 ""
NET_by_hammer_or_shield_tt:0 "Unlocks §HDecisions§! to subdue the Vrykul Threat, either through diplomacy, or by putting threats to the blade."

NET_its_always_trolls:0 "Its Always Trolls!"
NET_its_always_trolls_desc:0 "Jungle Trolls, Forest Trolls, Now Frost Trolls. Whats next, Desert Trolls?"

