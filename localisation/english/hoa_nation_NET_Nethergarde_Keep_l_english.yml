 NET_restrain_elementals:0 "Restrain Elementals"
 NET_restrain_elementals_desc:0 "When the Horde Entered our world through the dark portal, their fel magics sapped the life from the lands, Elementals that had remained dormant for years rose up and their life force was used to as fuel, few remain after the Invasion, but they still fight us as though we were the cause of their suffering."
