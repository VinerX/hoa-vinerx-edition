 NET_a_heroes_welcome:0 "A Heroes Return"
 NET_a_heroes_welcome_desc:0 "Some of the men and women we sent north have chosen to stay in their kingdoms of origin to help rebuild, the others have returned to our command as rumours of a new offensive begun to circulate among the army."
 NET_a_heroes_welcome_tt:0 "§H3 Nethergarde Auxiliaries§! will come under our command"
 NET_secure_the_swamp:0 "Secure the Swamps"
 NET_secure_the_swamp_desc:0 ""
 NET_internal_security:0 "Internal Security"
 NET_internal_security_desc:0 "Members of the Cult may still be present in our army, we should do all we can to root them out and bring them to justice"

 NET_clear_the_coast:0 "Clear the Coastline"
 NET_clear_the_coast_desc:0 ""
 NET_cleanse_the_altar:0 "Cleanse The Altar"
 NET_cleanse_the_altar_desc:0 ""
 NET_concerned_clansmen:0 "Concerned Clansmen"
 NET_concerned_clansmen_desc:0 "A Number of Orc are concerned about the Tainted Forest as demons still dwell within its depths, they have begun to build a makeship barricade in the Area, if it aleviates their concerns we will build two forts in the area."
 NET_sea_deterrents:0 "Naval Deterrents"
 NET_sea_deterrents_desc:0 ""
 NET_ancient_fossils:0 "Ancient Fossils"
 NET_ancient_fossils_desc:0 "We have discovered a number of fossils along the coastline of the Blasted Lands, we have contacted the Explorers League for the first time since our Internal Conflict."
 NET_comb_the_depths:0 "Comb the Depths"
 NET_comb_the_depths_desc:0 ""
 NET_treasures_of_the_first_war:0 "Treasures of the First War"
 NET_treasures_of_the_first_war_desc:0 "Within the Caverns we have discovered a large tresure trove of Stormwind minted gold coins, a few years ago we would have gladly handed them back to the Kingdom, but we are in dire need of finances ourselves, maybe the Goblins are a better trading partner for now."
 NET_the_watchful_eye:0 "The Watchful Eye"
 NET_the_watchful_eye_desc:0 "The Orcs are have requested to build a guard post on the Plateau to the south, though they have given us a list of its tactical advantages in the area, Councillor Fordring approved the post after the clansmen agreed that their main concern was the Tainted Forest."
 NET_taken_in_the_night:0 "Taken in the Night"
 NET_taken_in_the_night_desc:0 "A number of cases of missing clansmen have been reported to the watch, neither our guards or the clan watchmen have seen anything suspicious, Warlord Blacktusk has reported a concerning number of negative interactions with the Archmages men in the last few weeks, they may be connected."
 NET_improved_living_standards:0 "Improved Living Standards"
 NET_improved_living_standards_desc:0 "Between payments from the Explorers League and our trade agreements with the Goblins we have been able to repair quite a lot of the damage caused by the Crusader Uprising."
 NET_mermaid_sightings:0 "Mermaid Sightings"
 NET_mermaid_sightings_desc:0 "Notice: To all members of coastal patrols, a large number of sightings of 'Mermaids' have been reported, along with an increase number of drownings, from now on all patrols will require five personal, one of which needs to be a Priest or Mage."
 NET_maintain_vigil:0 "Maintain Vigil"
 NET_maintain_vigil_desc:0 ""
 NET_sieze_the_north:0 "Sieze The Northern Passage"
 NET_sieze_the_north_desc:0 ""
 NET_prune_the_hedges:0 "Prune the Hedges"
 NET_prune_the_hedges_desc:0 ""
 NET_history_repeats:0 "History Repeats"
 NET_history_repeats_desc:0 "The Bleeding Hollow know the swamps well, it was their first home when they entered our world, but they are no longer fighting alone."
 NET_to_build_a_home:0 "To Build a Homeland"
 NET_to_build_a_home_desc:0 ""
NET_forgotten_totems:0 "Forgotten Totems"
NET_forgotten_totems_desc:0 "Councillor Redfang has brought to our attention that a handful of Bleeding Hollow totems have been discovered in the swamps, she feels she should bring this to our attention as there are still some ritual limitations imposed upon the clans."
 NET_the_marshtide:0 "Push out the Marshtide"
 NET_the_marshtide_desc:0 ""
 NET_pontoon_pathways:0 "Pontoon Pathways"
 NET_pontoon_pathways_desc:0 ""
 NET_dragonmaw_envoy:0 "Dragonmaw Envoy"
 NET_dragonmaw_envoy_desc:0 "We have recieved unexpected guests from the north, a handful of grunts sailed into the Misty Reed Port in search of a idol left behind by Zuluhed during his departure back to Dreanor, they were quite confused to see humans working hand in hand with Orcs to return the post to its previous glory."
NET_dragonmaw_trading_post:0 "Dragonmaw Trade Post"
NET_dragonmaw_trading_post_desc:0 ""
 NET_the_frostwolf_request:0 "The Frostwolf Request"
 NET_the_frostwolf_request_desc:0 "A Number of our Patrols near the tainted forest have begun reporting the sounds of Orcs in distress and the unmistakable cackle of demons, The Frostwolf Shamans have also raised concerns that the spirits in the area have begun acting erratic, Councillor Fordring has permitted the Redwalker Clan to invesigate the area post haste."

NET_a_new_invasion:0 "A New Invasion"
NET_a_new_invasion_desc:0 "That blasted Archmage has opened a portal to the twisting nether and untold numbers of demons are spilling forth, so this is where he has been all this time. Rally the men, this is no time to be shaking in our boots."

NET_restrictions_be_damned:0 "Restrictions Be Damned"
NET_restrictions_be_damned_desc:0 ""
NET_otherwordly_savagery:0 "Otherwordly Savagery"
NET_otherwordly_savagery_desc:0 "The Bleeding Hollow seem to be the most passive members of the Red Walkers, but when the Demon horde came to their doorstep they were more then willing to take the fight to them."
NET_otherwordly_savagery_tt:0 "A new generation of §HDire Orcs§! will be brought forth by the Bleeding Hollow Clan"
NET_unshackle_the_blademasters:0 "Unshackle the Blademasters"
NET_unshackle_the_blademasters_desc:0 "Many are still distrusful of the Burning Blade Clan, and rightly so, the madness that seems to fill their souls when in the heat of battle is enough to cause any man to despair."
NET_unshackle_the_blademasters_tt:0 "Some §HBlademasters§! of the Burning Blade Clan have been offered arms worthy of their station."
NET_the_dogs_of_war:0 "The Dogs of War"
NET_the_dogs_of_war_desc:0 "The Frost Wolf Clan suffered a great loss at the hands of the demons and their followers. While they are few in numbers the Dire Wolves under their care have flourished in the red wastes"
NET_the_dogs_of_war_tt:0 "The Frostwolves will let their §HDire Wolves§! loose on the demons."

NET_approach_the_mountain:0 "Approach The Mountain"
NET_approach_the_mountain_desc:0 "A Few brave Orcs have offered to attempt to negotiate with the current Blackrock Chieftain, he may aid us in return for a favour at some point, through we dread the thought of it."
NET_dragonmaw_sellswords:0 "Dragonmaw Sellswords"
NET_dragonmaw_sellswords_desc:0 ""
NET_dragonmaw_sellswords_tt:0 "The Dragonmaw Clan will send Forces to help us banish the demons."
NET_combined_arms_training:0 "Combined Arms Divisions"
NET_combined_arms_training_desc:0 ""
NET_embers_of_the_faith:0 "Embers of The Faith"
NET_embers_of_the_faith_desc:0 ""
NET_tirions_resolve:0 "Tirion's Resolve"
NET_tirions_resolve_desc:0 ""
NET_by_steel_and_blood:0 "By Fire and Steel"
NET_by_steel_and_blood_desc:0 ""
NET_blasted_ridge_battlefield:0 "Blasted Ridge Battlefront"
NET_blasted_ridge_battlefield_desc:0 ""
NET_fel_blooded_elves:0 "Forced Purificaiton"
NET_fel_blooded_elves_desc:0 "Thas'ranan and his traitorous ilk have been suring up the Demons frontlines with their tainted Magics, but i doubt even his great intellect could account for the combined efforts of both shamanic purification and the lights cleansing to cause such a rapid decline in their power."
NET_salvage_the_ruins:0 "Salvage the Ruins"
NET_salvage_the_ruins_desc:0 ""
NET_from_the_tainted_forest:0 "From the Tainted Forest"
NET_from_the_tainted_forest_desc:0 "Survivors from the Tainted Forest Patrols have fought their way back to us, the Rangers are worse for ware, but the Orcs seems to have gone a little feral."

NET_order_of_valor:0 "Order of Valor"
NET_order_of_valor_desc:0 "The Orcs find the teachings of the Light an odd practice, with no physical form unlike that of the elements they call upon, but some shamans have been able to understand it, they see it as the 'the Elements within', the very soul of a being, their belief is esoteric compared to our own, it has stired within Councillor Fordring, the light was not some gift bestowed upon the paladins of the silver hand or a bishop, but the very light of creation itself."

NET_the_grandmarshal:0 "The New Grand Marshal"
NET_the_grandmarshal_desc:0 ""
NET_an_unfit_holding:0 "An Unfit Holding"
NET_an_unfit_holding_desc:0 "We were once again attacked yesterday by a group of Vrykul, many of our men perished but we dealt the same blow to the beasts, The Grand Marshal has ordered those responsible for this landing site to be put to the sword."
NET_reinforce_the_landing:0 "Battlement Constructions"
NET_reinforce_the_landing_desc:0 ""

NET_overrun:0 "Tactical Withdrawl"
NET_overrun_desc:0 ""
NET_return_twofold:0 "Vengence Landing"
NET_return_twofold_desc:0 ""
NET_taste_the_blade:0 "Taste the Blade"
NET_taste_the_blade_desc:0 ""
NET_cobblers_and_ferriers:0 "Cobblers & Ferriers"
NET_cobblers_and_ferriers_desc:0 ""
NET_those_of_plagued_lands:0 "Those of Plagued Lands"
NET_those_of_plagued_lands_desc:0 "Many Farmers are unable to work their fields, the plague has done untold damage to their soil, it may be years before they may be useable, we have reached out to those in Eastweald who have experience in growing crops in hills or mountain sides to help with rations."
NET_disgruntled_paladins:0 "Disgruntled Paladins"
NET_disgruntled_paladins_desc:0 ""
NET_path_of_least_resistance:0 "Path of Least Resistance"
NET_path_of_least_resistance_desc:0 "The Grand Marshal wishes to deal with the vrykul as quickly as possible, but knows better then to try to fight them on the cliff face, as such we will push as far north as we can before the vrykul are able to react."
NET_highland_breeds:0 "Highland Breeds"
NET_highland_breeds_desc:0 ""
NET_weapons_of_savages:0 "Weapons of Savages"
NET_weapons_of_savages_desc:0 ""
NET_lame_creatures:0 "Lame Creatures"
NET_lame_creatures_desc:0 ""
NET_steel_dwarves:0 "Steel Dwarves"
NET_steel_dwarves_desc:0 ""
NET_rain_vengence:0 "Rain Vengence"
NET_rain_vengence_desc:0 ""
NET_ancient_elevator:0 "Ancient Elevator"
NET_ancient_elevator_desc:0 ""

NET_stone_and_steel_alike:0 "Stone & Steel Alike"
NET_stone_and_steel_alike_desc:0 "These Vrykul are able to cleave steel as easy as they cleave stone, without proper armor plating they may as well be butter to these giants."
NET_the_enemies_designs:0 "The Enemies Designs"
NET_the_enemies_designs_desc:0 ""
NET_burn_the_village:0 "Burn the Village"
NET_burn_the_village_desc:0 "The Vrykul cast their rune magic from on top of their towers, shoot arrows from their roofs, and their drakes burn our men in their streets...Flatten the village, raze it to the ground and give them no place to hide or fight from."
NET_repurpose_towers:0 "Repurpose Towers"
NET_repurpose_towers_desc:0 ""
NET_sack_the_keep:0 "Sack the Keep"
NET_sack_the_keep_desc:0 ""
NET_those_within:0 "Those Who Slumber Within"
NET_those_within_desc:0 "We have discovered within Utgarde Keep and many of the surrounding areas a number of what could only be described as burial chambers, with a massive number of sleeping Vrykul dwelling within."
NET_burn_the_beasts:0 "Burn The Beasts!"
NET_burn_the_beasts_desc:0 ""
NET_let_sleeping_dogs_lie:0 "Let Sleeping Dogs Lie"
NET_let_sleeping_dogs_lie_desc:0 ""

NET_formalize_appointment:0 "Formalize Appointment"
NET_formalize_appointment_desc:0 "Our limited responsibilities allowed an unofficially leader of the fortress, the added operations given to us by the alliance has caused commands to become sluggish as not every standing member is present at any one time in Northrend or the Fortress, as such it has been decided to appoint an official head of both the military and administration for the duration of the Northern Expedition."

### Neutral

NET_shipyard_exchange:0 "Shipyard Exchange"
NET_shipyard_exchange_desc:0 "A Fight has broken out at the docks councillor, with the Alliance splintering it seems some of the men are attempting to leave against orders."
NET_alliance_veto:0 "Alliance Veto"
NET_alliance_veto_desc:0 "Lordaeron has ordered us to permit the safe passage of any member of the military who wishes to return to their Kingdoms, the worst result of this is the Kul'tiran shipwrights have all but left."
NET_mutiny:0 "Mutiny"
NET_mutiny_desc:0 "Cannon fire has broken out between two of our ships, one of the ships crews was attempting to take the Destoyer back to Gilneas without any consultation with the Council, as such the other ship opened fire to cripple the sails and a full exchange of cannon fire began."
NET_reused_cannons:0 "Reused Cannons"
NET_reused_cannons_desc:0 "With the Shipwrights gone both ships are beyond repair, however most of their equipment was salvaged by gnome divers wishing to try out their new suits."
NET_slipped_through_our_fingers:0 "Slipped Through the Cracks"
NET_slipped_through_our_fingers_desc:0 "Sir, another tunnel system filled with demon worshippers was found, the men were able to kill or capture most of them but the rest escaped using some sort of crystal."
NET_track_their_movements:0 "Track Their Movements"
NET_track_their_movements_desc:0 "If we cant use there crystals to follow them we will just track the magical signature that is left behind when they Teleport, or that is what we hope to accomplish but the Archmage seems more interesting in scraping green goo off the side of the Portal."
NET_ranger_secondment:0 "Ranger Secondment"
NET_ranger_secondment_desc:0 "An Official Request has been put forward to Lordaeron to send a skilled tracker and Advisor to help us put an end to the Cultists activities. Its not that we dont trust the High Elf mages, but they spend more time in their books then actively searching for threats."
NET_destroy_the_portal_network:0 "Destroy the Portal Network"
NET_destroy_the_portal_network_desc:0 "In our Hunt for the Shadowsworn the rangers have discovered a rather concerning findings within the Keep."

