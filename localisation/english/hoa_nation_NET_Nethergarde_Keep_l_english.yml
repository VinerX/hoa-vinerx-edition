#events
###############################

nethergarde.1.t:0 "Research Funding Cut"
nethergarde.1.d:0 "A Nation has made the decision to cease funding research at Nethergrade Keep, casting a shadow over our quest for knowledge. They have also withdrawn any forces they may have provided us."
nethergarde.1.option.1:0 "Very well"

nethergarde.2.t:0 "Operations Funding Cut"
nethergarde.2.d:0 "A Nation has made the decision to cease operational funding for Nethergrade Keep, further reducing our pacification efforts. They have also withdrawn any forces they may have provided us."
nethergarde.2.option.1:0 "Very well"

nethergarde.3.t:0 "Murloc Pacification"
nethergarde.3.d:0 "We have found that due to supply cuts were are unable to maintain our border with the Murlocs in the South, though they are not as aggressive as the Ogres they are still disrupting our camps."
nethergarde.3.option.1:0 "Take what we can"

nethergarde.4.t:0 "Ogre Resurgence"
nethergarde.4.d:0 "The Ogres have come out of their mounds in great force, our estimates of how many were still underground was off by quite a margin, we lack the active military forces to continue a presence in the area."
nethergarde.4.option.1:0 "Move the men and equipment."

nethergarde.5.t:0 "Ogre Invasion"
nethergarde.5.d:0 "There has been an attack in the west, the Ogres have also been seen massing outside of their mounds and taunting out men, they have begun moving north towards the old Orc stronghold."
nethergarde.5.option.1:0 "Pull back and maintain a line of defence."

nethergarde.6.t:0 "Magical Creatures"
nethergarde.6.d:0 "It is quite obvious that we lack the manpower to handle all the tasks given to us by the Alliance, and as such we have begun to fall behind on progress reports. While Lordenson is busy training a standing army, we shall begin looking at using less sentient manpower."
nethergarde.6.option.1:0 "Those bog creatures in the swamps."
nethergarde.6.option.2:0 "Ship some wyrmlings from Quel'thalas."
nethergarde.6.option.3:0 "Construct Sentries from Local Materials."

nethergarde.7.t:0 "Horde Remnants"
nethergarde.7.d:0 "When the bulk of the Horde fled back through the dark portal they left a wealth of relics behind, the shamanistc totems were unearthed early in the pacification and sent to the Wildhammer Dwarves to cleanse, but other remnants of power remained."
nethergarde.7.option.1:0 "All of these artifacts are too tainted, purge them with the light."
nethergarde.7.option.2:0 "Unearthed Necrolyte relics."
nethergarde.7.option.3:0 "Investigate Demonic Runestones."

nethergarde.8.t:0 "The Blasted Lands"
nethergarde.8.d:0 "The Area of land which two decades ago was a lush dense swamp has become a plain of life sapped earth, the research we have conducted has lead us to discovering a way to repair the damage the orcs had inflicted upon it, even if only a little."
nethergarde.8.option.1:0 "A small step, but its still progress."

nethergarde.9.t:0 "Military Doctrine"
nethergarde.9.d:0 ""
nethergarde.9.option.1:0 "Lordaeron Knights"
nethergarde.9.option.2:0 "Quel'thalas Rangers"
nethergarde.9.option.3:0 "Gilnean Footmen"
nethergarde.9.option.4:0 "Stormwind Milita"

nethergarde.10.t:0 "Otherworldly Materials"
nethergarde.10.d:0 "Commander, we have had a breakthrough in our investigations in the Blasted Lands, we have found a cache of materials that we believe the Orcs brought through from their own world."
nethergarde.10.option.1:0 "Task the Blacksmiths"
nethergarde.10.option.2:0 "Task the Tanners"
nethergarde.10.option.3:0 "Task the Jewelers"

nethergarde.11.t:0 "The Matter of the Orcs"
nethergarde.11.d:0 "The General has long held resevations in regards to the orcs Presence here in the blasted lands, he sees them as a threat and rightly so, the Quatermaster refuses to put them to the sword as he cannot condemn those innocent among them, the Archmage has recieved word from Quel'thalas that the High King cares little for what we do with the Orcs."
nethergarde.11.option.1:0 "A Closed Door Meeting"

nethergarde.12.t:0 "A Bloody Compromise"
nethergarde.12.d:0 "A Mightly yell was heard from inside the chamber, as the door slammed open and the General barged out, the Quartermaster grinned with a missing tooth and a bloody nose."
nethergarde.12.option.1:0 "This Bodes...Well?"

nethergarde.13.t:0 "Old Enemies"
nethergarde.13.d:0 "The Quatermaster sat with a few of the Orc leaders and explained the situation to them, He had been able to make a deal with the General that as long as the Orcs help fight off the Dreadmaul they will be able to occupy the area in which the ogres currently reside, however they will still be prisoners but will not need to remain in such cramped living conditions."
nethergarde.13.option.1:0 "A New Home?"

nethergarde.14.t:0 "A Dire Choice"
nethergarde.14.d:0 ""
nethergarde.14.option.1:0 "Life or Death"

nethergarde.16.t:0 "The Generals Revolt"
nethergarde.16.d:0 "The General is now in open rebellion against our terms with the Orcs, he has taken a large group of men to the north to deal with the rest of the diremaul who fled the old orc fortress of Rockard."
nethergarde.16.option.1:0 "Where is the Archmage?"

nethergarde.17.t:0 "The Sea of Blood"
nethergarde.17.d:0 "We knew the General had his reservations about the orcs, he made it abundantly clear, but now he has gone to far, he has been seen massacring the orcs under out supervision, and is now in open rebellion. \n The Council of Seven has fallen silent as they are having their own issue in the north, and have withdrawn their forces."
nethergarde.17.option.1:0 "Arrest the General and his would be Templars"

nethergarde.18.t:0 "Northern Refugees"
nethergarde.18.d:0 "A Group of Orc trackers discovered a few boats on the southern reaches of the Shattered Beachhead in the early morning, and followed the tracks south. They came upon a group of humans fighting a very large agressive party of Murlocs, and rushed to assist them."
nethergarde.18.option.1:0 "Give them food and Shelter"

nethergarde.19.t:0 "The Assassination"
nethergarde.19.d:0 "We have unfortunate news to report, during one of Lungertz routine inspections of the portal he was set upon by a group wearing a red crest of Lordaeron, in the ensuing battle Lungertz was struck by a warhammer bearing the crest of the Silverhand, the Assassins were later apprehended a group of local militia.\n With the Archmage busy in the west and the General in exile we are in need of new coucil members, the most likely candidate is Watcher Theronus, but he currently busy helping supress a Murloc incursion."
nethergarde.19.option.1:0 "Send them to the Gallows"

nethergarde.20.t:0 "An Unexpected Candidate"
nethergarde.20.d:0 "Watcher Theronus has returned from the west but has declined a position on the council, he believes another should take the position as lacks the skills to govern the Keep while continuing his current duties, we have petitioned the other captains and the feel the same way.\nA refugee from the north stepped forward to fill the role, he was a simple looking man, with greying hair and scars from battle, many of the men scoffed at the idea of this farmer being a council member and said he would be better suited in Westfall.\nRelthorn was the first to notice, but this was not a simple farmer, but a champion of the 2nd War."
nethergarde.20.option.1:0 "Let us get right to work."

nethergarde.21.t:0 "Evacuation Orders"
nethergarde.21.d:0 "My Lord, we have recieved news from the Swamps that a forced of Nethergrade Keep have demanded our Evacuation from the Swamps, they have given us 3 Days to take as much equipment as we can before they begin to forceably evict us, with the Termoil in the north we cannt expect any assistance in this matter, worst of all my lord, they were flanked by Orc Wolf Riders, bearing the banners of a clan we have never encounted before, many of the men fear the portal may have been reopened."
nethergarde.21.option.1:0 "Pull Back, May the light Preserve us."

nethergarde.22.t:0 "Horde Escape"
nethergarde.22.d:0 "Council Members, it has come to our attention that may of the Orcs in the Internment camps have escaped west, a large number of Lordarons ships have been spotted passing by Tol'Bard and Kul'Tiras, the most concerning part of this report is that some of the ships have been spotted off the coast of Westfall, we have concerns they may be attempting to land on the Eastern Coast to join the other clans."
nethergarde.22.option.1:0 "This is quite Concerning."

nethergarde.23.t:0 "Elven Refugees"
nethergarde.23.d:0 "We have ran into an Interesting issue, we have recieved and increased number of high elf researchers from the north, from what they tell us there is an army of the undead pilliaging its way towards the capital"
nethergarde.23.option.1:0 "Give them supplies and bedding"

nethergarde.24.t:0 "Fel Blooded Bastard"
nethergarde.24.d:0 "It would seem we discovered the Archmages plot far too late, he was not simply studying Fel energy, he has been utterly consumed by it, the fool has been tricked by a demon to open a portal to our world."
nethergarde.24.option.1:0 "Light Preserve Us!"

nethergarde.30.t:0 "The Mountains Shadow"
nethergarde.30.d:0 "A group of Orcs had offered to approach the Blackrock Clan in the North for assistance with the demons, but it would seem that Dal'rends demands were too great for us to even consider."
nethergarde.30.option.1:0 "Have we considered Stormwind?"

nethergarde.31.t:0 "An Unexpected Shipment"
nethergarde.31.d:0 "When Councillor Fordring mentioned in jest that we should attempt to contact Stormwind for aid he was not expecting a weapons shipment to be dropped at out doorstep, it would seem that they had attempted to deliver supplys to Aridens camp but instead left them at Splinterspear Junction."
nethergarde.31.option.1:0 "We may have an ally inside the capital"

nethergarde.50.t:0 "The Slumbering Vrykul"
nethergarde.50.d:0 ""
nethergarde.50.option.1:0 "This is Pointless!"
nethergarde.50.option.2:0 "Burn them while they sleep!"

nethergarde.70.t:0 "Traitor in the Keep"
nethergarde.70.d:0 "The Mages in conjunction with the Rangers have successfully disrupted several Shadowsworn summoning rituals in the Blasted Lands, however while tracking the fel energies used by the cult, out mages discovered a hidden network leading directly back to Nethergarde Keep.\n\nThe Evidence is undeniable, Lungertz has been supplying the Shadowsworn with weapons, rations and even arcane reagents sent. Demon worshiping scum."
nethergarde.70.option.1:0 "Execute the Traitor Immediately!"
nethergarde.70.option.2:0 "Interrogate Him First"

nethergarde.100.t:0 "Appoint Lungertz"
nethergarde.100.d:0 "Lungertz has done well in the period after Trollbanes departure, with the damage sustained mostly repaired under his watch, his ability to navigate the political landscape of the Alliance will serve us well"
nethergarde.100.option.1:0 "Your Council is Valued Lungertz"

nethergarde.110.t:0 "Appoint Lordenson"
nethergarde.110.d:0 "Lordenson acts as the defactor leader of the Keeps standing army, in Trollbanes absence he has been a staunch proponent of the Keep continued existence, there have been two incursions and both times we were unprepared, he has seen too many good soliders fall in battle, and their deaths still haunt him."
nethergarde.110.option.1:0 "At your command Lordenson"

nethergarde.120.t:0 "Appoint Thasranan"
nethergarde.120.d:0 "Thasranan is our residence expert on the Portal, though it seems most of his time is spent arguing with Lordenson, after the official council appointment he has been spending more time at the portal, containing the remnants of taint upon the land and working with the gnomes to make new contraptions."
nethergarde.120.option.1:0 "Your Tenure is extended Thasranan"

