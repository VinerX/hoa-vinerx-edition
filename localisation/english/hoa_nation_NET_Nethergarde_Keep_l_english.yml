NET_feed_on_chaos:0 "Feed on Life Itself"
NET_feed_on_chaos_desc:0 "We have found a rather unsavory method to quench the thirst for mana the High Elf refugees have suffered since the distruction of the Sunwell"

 NET_the_bastion_agreement:0 "The Bastion Agreement"
 NET_the_bastion_agreement_desc:0 "We have recieved disturbing news from the northen kingdoms, something to do with infected grain and some form of revolt in Stormgarde. The Messenger we have sent north have not yet returned, and as our rations are dependent upon Stormwinds farms we have approched them as Mediators."
