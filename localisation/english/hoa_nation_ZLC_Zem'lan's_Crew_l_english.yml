    ZLC_ashvane_encampment:0 "The Ashvane Encampment"
    ZLC_ashvane_encampment_desc:0 "Within Redrock Harbor to the east of us resides a mining operation run by the Ashvane Trading Company. While it would certainly by ideal to have seized total control of the area long ago, Zem'lan withheld our crew in order to milk the profits they bring to the region. Those who deviate from this order face severe punishment, and the mining operation's insular and isolated nature make them none the wiser to our existence. For the time being the company has brought profits to the surrounding area through their unique connections to many far away markets. \n\nThis is a delicate balancing act, however. Eventually we will need to give up this state of affairs and end the operation swiftly to solidify our authority over the surrounding area."
    ZLC_the_golden_isle:0 "The Golden Isle"
    ZLC_the_golden_isle_desc:0 "Though his men guard the port, Zem'lan himself resides alongside his goldslaves on the Golden Isle, a place bountiful with treasure. Zem'lan's usage of the goldslaves is a drain on both our manpower and our morale, but also serve to keep his hoard properly protected from thieves and environmental hazards."
    ZLC_the_crews_treasure_hoard:0 "The Crew's Treasure Hoard"
    ZLC_the_crews_treasure_hoard_desc:0 ""
    ZLC_redrock_mine:0 "Redrock Mine"
    ZLC_redrock_mine_desc:0 "None of Zem'lan's crew were ever much for construction, but the takeover of the Ashvane Encampment in Redrock Harbor was a bountiful one indeed. This act did require shutting the operation off from the markets they one traded with, and thus our economy is not quite as strong as it once was, but with the resources of the Azerite mine available the crew now has the fuel necessary to make its dream of plunder on an unimaginable scale a reality."
    ZLC_mass_rituals:0 "Mass Rituals"
    ZLC_mass_rituals_desc:0 "At Witchdoctor Yoksa's recommendation, we have now begun to use the idols that gave us immortality on unsuspecting others, enslaving the captives of our raiding and pillaging into our forces."
    ZLC_harbor_network:0 "Harbor Networks"
    ZLC_harbor_network_desc:0 ""
    ZLC_corsair_arms:0 "Corsair Arms"
    ZLC_corsair_arms_desc:0 ""
    ZLC_landing_volleys:0 "Landing Volleys"
    ZLC_landing_volleys_desc:0 ""
    ZLC_raiding_parties:0 "Raiding Parties"
    ZLC_raiding_parties_desc:0 "Our pirates and fleet have been fully mobilized, ensuring we deliver a swift blow to any of the enemies combat ships and merchant boats while raiders descend on their coastal towns and secure beachheads."
    ZLC_flight_to_camp_lastwind:0 "Flight to Camp Lastwind"
    ZLC_flight_to_camp_lastwind_desc:0 "Though Zem'lan has indeed been "slain", just as with any other undead there is always the possibility of his return. Jamboya and the crewmates who helped him have fled northeast to Camp Lastwind to reorganize and prepare to solidify control over the port."
    ZLC_a_new_motivator:0 "A New Motivator"
    ZLC_a_new_motivator_desc:0 ""
    ZLC_lure_of_the_temple:0 "Lure of the Temple of Akunda"
    ZLC_lure_of_the_temple_desc:0 ""
    ZLC_lure_of_the_temple_idols:0 "Lure of the Temple of the Idols"
    ZLC_lure_of_the_temple_idols_desc:0 ""


ZLC_Zemlans_Curse:0 "The Curse of Zem'lan"
ZLC_Zemlans_Curse_desc:0 "Pirate-King Zem'lan set a curse upon the Trolls that served alongside him during the Sethrak invasion of the port. Cursing them to serve him eternally, causing them and himself to be cursed to the port city as skeletons for eternity."
    ###############################
    #focus tree
    ###############################
    ZLC_the_day_the_port_fell:0 "The Day the Port Fell"
    ZLC_the_day_the_port_fell_desc:0 "In ages past, Zem'lan was once a might port, run by the eponymous pirate king and his loyal crew. When the town came under threat from the Faithless sethrak, however, Zem'lan seemed to stand no chance to hold them off. Not if they fought fair, that is."
    ZLC_the_first_time_i_died:0 "The First Time I Died"
    ZLC_the_first_time_i_died_desc:0 "Forced to flee to the Golden Isle, Zem'lan's crew gathered around the cursed altar. Yoksa, the witchdoctor, had proven the dark power that the idols held, and here they sat before all. The price paid for such a bargain would be immense, but if it could turn the tide on their invaders, it was a bargain the Pirate-King was more than ready to make."
    ZLC_the_golden_isle:0 "The Golden Isle"
    ZLC_the_golden_isle_desc:0 "What was once the refuge of the Pirate-King's Zandalari crew is now cursed irrevocably from the day they were subjected to their cruel fates. While his men reside in the port, Zem'lan hoards his heaps of plunder on the Golden Isle alone, save for his goldslaves that tend to the heaps of treasures. Not all in the port are ready to accept Zem'lan's rule as eternal, however."
    ZLC_ruling_the_waves:0 "Ruling the Waves"
    ZLC_ruling_the_waves_desc:0 "Zem'lan himself is no stranger to the oceans surrounding Zandalar, but not all his crew can say the same. This is unacceptable. Pillaging nearby towns is nice, but how the hell is the King meant to stack his treasure sky high if half his men can't even find their way around the Voldun Sea?"
    ZLC_built_right_in_the_bay:0 "Built Right in the Bay!"
    ZLC_built_right_in_the_bay_desc:0 "Zem'lan's raiding parties are feared across Voldun, but certainly not for their fleet. Most of the crew's vessels are a mix of older crafts maintained with wood and metal seized from the north and whatever light seafaring boats a raiding party could steal on their exit. With the debris left in the port now cleared out, it's high time for us to start creating new ships of our own."
    ZLC_built_right_in_the_bay_tt:0 "§3Dockyards§! built in the Port of Zem'lan will be constructed §Y25% faster§!!"
    ZLC_the_good_old_yard_arm:0 "The Good Old Yard Arm"
    ZLC_the_good_old_yard_arm_desc:0 "The damned's greatest strength is often Zem'lan's greatest weakness. Disciplining a crew of undead is a difficult task indeed. Zem'lan's prefered method by far, though, is hanging crewmates by the yard arm. Dealing with the upstarts may be as simple as raising the stakes of this tried and true punishment. Where physical pain is not an option, surely prolonged discomfort and isolation will break all their psyches in time?"
    ZLC_yoksas_scheme:0 "Yoksa's Scheme"
    ZLC_yoksas_scheme_desc:0 "Witchdocter Yoksa was the first to recommend Zem'lan use the dark power of the idols found by Jamboya. Now he proposes we turn the idols on our prisoners held for ransom as well, raising a whole new band of obedient troops. This is certain to be dangerous, but Yoksa, ever clever, suggests that raising tension within the crew will distract them from daring to speak out against their king."
    ZLC_a_rising_tide:0 "A Rising Tide"
    ZLC_a_rising_tide_desc:0 "To the northwest lies a region of cliffs and beaches. Though not uninhabited, those in the area have been under extreme threat from the sandstorm elementals that populate the region. The coastlne does serve as a strategically valuable position, and securing the region now while it is still divided and largely unorganized would be wise."
    ZLC_controlling_the_cliffside:0 "Controlling the Cliffside"
    ZLC_controlling_the_cliffside_desc:0 "Vol'dun's southwestern coast is now firmly in our hands, but the question of how to resolve the conflicts between the groups within our newly acquired territory is still yet to be answered. Perhaps we would benefit from picking a side..."
    ZLC_the_fate_of_redrock:0 "The Fate of Redrock"
    ZLC_the_fate_of_redrock_desc:0 "The crew has turned a blind eye towards the encampment built by the Ashvane Trading Company in the east for quite some time, and eventually no amount of punishments will be enough to stop our men from disrupting the status quo. It's time to stop playing games and take what we deserve!"
    ZLC_question_of_the_high_isles:0 "Question of the High Isles"
    ZLC_question_of_the_high_isles_desc:0 "With the harbor now firmly under Zem'lan's control, the question of its strategic value has arisen. In particular, there exists an island chain directly to the south which seems ripe for the picking. Though such an action would anger Zandalar, who nominally has claim over the area, the isles have a small population with little potential for resistance, and it may serve as a valuable show of strength to Zem'lan's crew..."
    ZLC_downsizing:0 ""Downsizing""
    ZLC_downsizing_desc:0 "TODO"
    ZLC_redistribution_tt:0 "§CCompleting this focus will allow Jamboya and the other fugitives to return from Camp Lastwind if they have not already done so.§!\n\n"
    ZLC_liberation_tt:0 "§CZem'lan's captives, freed by Jamboya, will return to their homes§!\n\n"

