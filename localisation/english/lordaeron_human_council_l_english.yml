l_english:
 lordaeron_council.1.t:0 "The Human Kings Convene"
 lordaeron_council.1.d:0 "The rulers of Lordaeron, Stromgarde, Gilneas, Alterac and Kul Tiras meet beneath the banners of Lordaeron. Stormwind's survivors have made a distant war impossible to ignore, but a gathering of kings is not yet an army. Before Ironforge or Quel'Thalas can be asked to commit, the human realms must decide whether they can act as one."
 lordaeron_council.1.a:0 "A common danger demands a common answer."
 lordaeron_council.1.b:0 "Every crown will guard its own strength first."

 lordaeron_council.2.t:0 "The Stormwind Claim"
 lordaeron_council.2.d:0 "Anduin Lothar places the broken seal of Stormwind before the council. The kingdom has fallen, but its army and its claim have not. If the Alliance is to be more than a defensive pact, the liberation of Stormwind must become a cause shared by every human throne."
 lordaeron_council.2.a:0 "Stormwind will not be forgotten."
 lordaeron_council.2.b:0 "First we must preserve the kingdoms that remain."

 lordaeron_council.3.t:0 "Who Commands the Alliance?"
 lordaeron_council.3.d:0 "The kings have agreed to cooperate, but cooperation needs a command structure. Terenas can provide the authority of Lordaeron, Lothar the trust of Stormwind's veterans, and a council could preserve every crown's independence. The decision will define the Alliance before its first great battle."
 lordaeron_council.3.a:0 "Let the debate begin."
 lordaeron_council.3.b:0 "No crown will surrender its army lightly."

 lordaeron_council.4.t:0 "A Human Compact Takes Shape"
 lordaeron_council.4.d:0 "Orders, messengers and supply ledgers now cross the borders of the human kingdoms. The Alliance is still young and quarrelsome, but its armies can finally be asked to serve a common plan. The next question is no longer whether the humans will fight together, but which allies must be brought into the war before the Horde reaches them."
 lordaeron_council.4.a:0 "Now we can begin the real work."

 lordaeron_council.5.t:0 "The Khaz Modan Question"
 lordaeron_council.5.d:0 "Reports from the south make the council reconsider the limits of the human compact. Ironforge, Gnomeregan and the other defenders of Khaz Modan hold the industrial gate between the Horde and the northern kingdoms. Their alliance cannot be summoned as a ceremonial afterthought; it must be negotiated as the war reaches their gates."
 lordaeron_council.5.a:0 "Send the envoys south."

 lordaeron_council.6.t:0 "The Dwarven Pact"
 lordaeron_council.6.d:0 "Ironforge has accepted the invitation, and the defenders of Khaz Modan now stand within the wider Alliance war plan. Their engineers, foundries and mountain roads will not make the war easy, but they give the coalition a southern shield that can endure the Horde's pressure."
 lordaeron_council.6.a:0 "By hammer and crown, we stand together."
