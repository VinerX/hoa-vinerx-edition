POLITICS_GOD_QUEEN_BRETTA_DESC:0 "Mother of the God King Skovald, and former Queen of Stormheim - she refuses to concede her throne to her son, who murdered her husband and his brothers. One of the Valkyra; a powerful shield maiden and warrior."

