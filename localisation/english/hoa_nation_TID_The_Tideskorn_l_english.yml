TID_Vrykul_Infighting:0 "Vrykul Infighting"
TID_Vrykul_Infighting_desc:0 "The Vrykul are a warmongering people, when war cannot show itself they must stay occupied during the down times. Many Vrykul turn to infighting to train themselves and to gain superiority over others."
TID_The_Great_Harbor:0 "The Great Harbor"
TID_The_Great_Harbor_desc:0 "The Great Tideskorn Harbor is the mightiest settlement in the Tideskorn Clan, its vast slipways and docks allow for large amounts of cargo and ships to come in and out of the city."
