DFC_Vrykul_Infighting:0 "Vrykul Infighting"
DFC_Vrykul_Infighting_desc:0 "The Vrykul are a warmongering people, when war cannot show itself they must stay occupied during the down times. Many Vrykul turn to infighting to train themselves and to gain superiority over others."

DFC_The_Slumbering_King_Ymiron:0 "The Slumbering King's Wrath"
DFC_The_Slumbering_King_Ymiron_desc:0 "The Slumbering King demands the slaughter of the weak, his brave Dragonflayers heed his demands. However, many do flee his wrath, but this will not stop his desire to kill the weaklings."

DFC_The_Slumbering_King_Ymiron_2:0 "The King's Demands"
DFC_The_Slumbering_King_Ymiron_desc:0 "The Slumbering King demands the slaughter of the weak, his brave Dragonflayers heed his demands. With the Kings Awakening the main cause of death in the Dragonflayer Clan have been caused by Honourable combat."

DFC_Reinforcements_From_Gjalerbron:0 "Reinforcements from Gjalerbron"
DFC_Reinforcements_From_Gjalerbron_desc:0 "The Fortress of Gjalerbron continues to send us reinforcements from our reawakened brothers, soon the Vrykul will be the true rulers of Northrend!"
