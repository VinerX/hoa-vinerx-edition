l_english:
# ============================================================
# LORDAERON SECOND WAR — Expanded Focus Localisation
# ============================================================

# SILVER HAND BRANCH
 LOR_the_knights_of_the_silver_hand:0 "The Knights of the Silver Hand"
 LOR_the_knights_of_the_silver_hand_desc:0 "Archbishop Alonsus Faol has witnessed what the Horde did to the clerics of Northshire — brave souls, but untrained for the horrors of combat. He proposes a new order: warrior-priests who wield both hammer and Holy Light, embodying the highest virtues of humanity. With Lothar's blessing, the paladins shall rise."

 LOR_archbishop_faol:0 "Archbishop Alonsus Faol"
 LOR_archbishop_faol_desc:0 "The gentle shepherd of the Church of the Holy Light is no warrior, but his vision gave birth to the paladins. Faol's moral authority steadies the hearts of the faithful as the kingdom faces its darkest hour."

 LOR_uther_the_lightbringer:0 "Uther the Lightbringer"
 LOR_uther_the_lightbringer_desc:0 "Uther is the first and greatest of the paladins — a towering figure whose faith in the Light is matched only by his skill with a warhammer. Where he rides, courage follows."

 LOR_uther_the_lightbringer_tt:0 "The first paladin takes the field. Where Uther stands, the Light itself seems to fight alongside the men of Lordaeron."

 LOR_libram_of_holy_light:0 "Librams of the Silver Hand"
 LOR_libram_of_holy_light_desc:0 "Archbishop Faol presents each paladin with an enchanted libram — a sacred tome embodying a specific virtue. The Libram of Protection, of Justice, of Retribution, of Holiness, of Compassion. These relics channel the Light against the necromantic fog that shrouds the death knights."

 LOR_paladins_of_the_alliance:0 "Paladins of the Alliance"
 LOR_paladins_of_the_alliance_desc:0 "The Silver Hand is no longer Lordaeron's secret weapon — paladins ride out to every front of the coalition, their blazing auras a beacon to friend and foe alike. They heal the wounded, smite the unworthy, and remind every soldier what they fight for."

# SUPREME COMMAND BRANCH
 LOR_the_council_of_seven_nations:0 "The Human Kings Convene"
 LOR_the_council_of_seven_nations_desc:0 "The rulers of the human kingdoms gather in Capital City. Stormwind's survivors have made the Horde's war impossible to ignore, but the human realms must first decide whether they can act as one before asking the dwarves, gnomes or elves to join them."

 LOR_the_stormwind_claim:0 "The Stormwind Claim"
 LOR_the_stormwind_claim_desc:0 "Anduin Lothar places the broken seal of Stormwind before the council. The kingdom has fallen, but its army and its claim have not. The liberation of Stormwind must become a cause shared by every human throne."

 LOR_who_commands_the_alliance:0 "Who Commands the Alliance?"
 LOR_who_commands_the_alliance_desc:0 "The kings have agreed to cooperate, but cooperation needs a command structure. Terenas can provide royal authority, Lothar the trust of Stormwind's veterans, and a council could preserve every crown's independence."

 LOR_supreme_commander_lothar:0 "Supreme Commander Lothar"
 LOR_supreme_commander_lothar_desc:0 "Anduin Lothar, the Lion of Stormwind, is named Supreme Commander of the united Alliance host. His bloodline descends from King Thoradin himself, and his voice now commands the combined might of every human kingdom — a power few in history have ever wielded."

 LOR_supreme_commander_lothar_tt:0 "Lothar is named Supreme Commander of the Alliance. No living human commands greater respect — or a larger army."

 LOR_terenas_leads_the_coalition:0 "Terenas Leads the Coalition"
 LOR_terenas_leads_the_coalition_desc:0 "King Terenas keeps the Alliance under the authority of Lordaeron's crown. The coalition will be orderly and well supplied, but some kings may resist the weight of the northern throne."

 LOR_council_command:0 "Council Command"
 LOR_council_command_desc:0 "No single crown will command the others. A council of generals and kings will preserve political consensus at the price of slower decisions in the field."

 LOR_the_kings_keep_their_armies:0 "The Kings Keep Their Armies"
 LOR_the_kings_keep_their_armies_desc:0 "The human kingdoms join the common cause without surrendering their armies. The arrangement protects local sovereignty, but every operation will require another negotiation."

 LOR_marshal_the_kingdoms:0 "Marshal the Kingdoms"
 LOR_marshal_the_kingdoms_desc:0 "The human compact becomes a functioning war command. Whether led by Lothar, Terenas or a council, every kingdom must now decide what banners, steel and sons it can commit to the common front."

 LOR_send_alliance_envoys:0 "Envoys to the Human Kingdoms"
 LOR_send_alliance_envoys_desc:0 "The first envoys carry requests, not invitations to every distant ally. The human compact must learn how much each crown can actually contribute before the war reaches the gates of Khaz Modan."

 LOR_the_khaz_modan_question:0 "The Khaz Modan Question"
 LOR_the_khaz_modan_question_desc:0 "Ironforge, Gnomeregan and the defenders of Khaz Modan hold the industrial gate between the Horde and the northern kingdoms. Their alliance must be negotiated when the war reaches their gates, not granted as a ceremonial afterthought."

 LOR_envoys_to_ironforge:0 "Envoys to Ironforge"
 LOR_envoys_to_ironforge_desc:0 "With the human compact established and the Horde pressing south, Lordaeron sends a formal mission to Ironforge. The dwarves will decide whether Khaz Modan enters the wider Alliance on its own terms."

 LOR_the_dwarven_pact:0 "The Dwarven Pact"
 LOR_the_dwarven_pact_desc:0 "Ironforge and its allies have answered the delayed call. Khaz Modan now joins the Alliance war plan as a military partner, bringing its fortresses, workshops and stubborn strength to the common war."
  LOR_the_dwarven_pact:0 "The Dwarven Pact"
  LOR_the_dwarven_pact_desc:0 "Ironforge and its allies answer the delayed call. The human compact becomes a broader Alliance, joining fortresses, workshops and armies before the Horde can isolate them completely."

# LIBERATION OF KHAZ MODAN BRANCH
 LOR_cross_the_thandol_span:0 "Cross the Thandol Span"
 LOR_cross_the_thandol_span_desc:0 "The great bridge of the Thandol Span is the gateway to Khaz Modan. With the Horde in retreat, the Alliance must force the crossing and pursue the orcs into the dwarven highlands — before Doomhammer can regroup."

 LOR_liberate_dun_modr:0 "Liberate Dun Modr"
 LOR_liberate_dun_modr_desc:0 "The dwarven strongholds of Dun Modr and Dun Algaz fell early in the war, crushed under the Horde's advance. Now the Alliance retakes them, stone by bloodied stone, and the banners of Ironforge fly once more over the Wetlands."

 LOR_the_dwarves_rise:0 "The Dwarves Rise"
 LOR_the_dwarves_rise_desc:0 "For months the dwarves of Ironforge and the gnomes of Gnomeregan have been besieged, cut off from the world above. As the Alliance breaks the encirclement, fresh armies pour from the mountain gates — eager to repay every death with interest."

# ASSAULT ON BLACKROCK SPIRE BRANCH
 LOR_the_siege_of_blackrock_spire:0 "The Siege of Blackrock Spire"
 LOR_the_siege_of_blackrock_spire_desc:0 "The united host of humans, dwarves, elves and gnomes closes on the mountain fortress that serves as the Horde's throne. Blackrock Spire looms against a sky black with smoke — the final reckoning is at hand."

 LOR_doomhammers_sortie:0 "Doomhammer's Sortie"
 LOR_doomhammers_sortie_desc:0 "Orgrim Doomhammer hurls the full might of the Horde out of the mountain gates in a desperate, thundering charge. The ground shakes, the skies darken with dragonfire, and the fate of Azeroth will be decided in the shadow of the Spire."

 LOR_the_duel_at_blackrock:0 "The Duel at Blackrock"
 LOR_the_duel_at_blackrock_desc:0 "In the chaos of battle, two titans find each other. Anduin Lothar, the Lion of Stormwind, and Orgrim Doomhammer, Warchief of the Horde — their clash will echo through history. The Alliance holds its breath."

 LOR_turalyons_rally:0 "Turalyon's Rally"
 LOR_turalyons_rally_desc:0 "Lothar has fallen — but Turalyon seizes his mentor's shattered blade and raises it to the heavens. A light brighter than the sun erupts from the young paladin, and the broken Alliance host finds its fury renewed. Doomhammer is struck down, and the Horde breaks."

 LOR_shatter_the_horde:0 "Shatter the Horde"
 LOR_shatter_the_horde_desc:0 "The Horde is broken at the foot of the Spire. Orgrim Doomhammer is in chains, and what remains of the orcish army scatters to the winds. The Alliance drives the killing blow home — this war ends here."

 LOR_pursuit_to_the_dark_portal:0 "Pursuit to the Dark Portal"
 LOR_pursuit_to_the_dark_portal_desc:0 "The fleeing Horde retreats across the Black Morass, harried every step of the way by Alliance cavalry. At the end of their flight stands the Dark Portal — the gateway through which the orcs first poured into Azeroth. There will be no escape."

 LOR_seal_the_dark_portal:0 "Seal the Dark Portal"
 LOR_seal_the_dark_portal_desc:0 "Khadgar and the archmages of the Kirin Tor channel their combined might against the rift. With a roar that shakes the foundations of two worlds, the Dark Portal collapses — the gateway is sealed, and the Second War is over."

 LOR_the_second_war_won:0 "The Second War Won"
 LOR_the_second_war_won_desc:0 "The Dark Portal lies in ruins. The Horde is defeated, its survivors herded into internment camps across Lordaeron. King Terenas looks out over a realm scarred but standing — the Alliance has endured, and the people of Azeroth can finally know peace. For now."
