POLITICS_GRUUL_DESC:0 "The Dragonkiller and Overlord of the Ogres of Outland. He slaughtered many members of the Black Dragonflight and is worshipped as a god by the ogres of the Blades Edge. He is allied to Illidan, the Master of Outland, but to what extent is unclear. \nGruul is the father of the seven gronn lords of the ogres, and the most powerful of them. Although he seems to be nothing but a cruel brute, he possesses intelligence."

