l_english:

###############################
# Focus Tree - Stormreaver Second War
###############################

SRC_sw_guldans_bargain:0 "Gul'dan's Bargain"
SRC_sw_guldans_bargain_desc:0 "Doomhammer purged the Shadow Council, but I survived. I promised him weapons against the Alliance — Death Knights infused with the spirits of slain orc warlocks. He needs my power, and I need his protection... for now."

SRC_sw_rise_of_the_stormreavers:0 "Rise of the Stormreavers"
SRC_sw_rise_of_the_stormreavers_desc:0 "From the ashes of the Shadow Council, a new clan rises. Warlocks, necrolytes, and those loyal to Gul'dan gather under one banner. The Stormreaver Clan shall command the dark arts for the Horde."

SRC_sw_forge_stormreaver:0 "Forge of the Stormreavers"
SRC_sw_forge_stormreaver_desc:0 "The conquered human city of Stormwind shall be repurposed. Its forges will burn with fel fire, its docks will birth our fleet, and its halls will echo with chants to the Legion."

SRC_sw_warlock_gathering:0 "Warlock Gathering"
SRC_sw_warlock_gathering_desc:0 "The Shadow Council is broken but not gone. Survivors from Draenor and Azeroth still answer to Gul'dan. We must gather them before Doomhammer's agents find them first."

SRC_sw_twilights_hammer:0 "Twilight's Hammer Alliance"
SRC_sw_twilights_hammer_desc:0 "Cho'gall, the two-headed ogre magi, is my most powerful lieutenant. His Twilight's Hammer cult brings brute strength and fanatical devotion. Together, we are unstoppable."

SRC_sw_ogre_magi:0 "Ogre Magi"
SRC_sw_ogre_magi_desc:0 "The ogre magi possess both muscle and magic in equal measure. Their two heads allow them to cast spells while wielding weapons. Cho'gall will teach them the deeper mysteries."

SRC_sw_shadow_council_remnants:0 "Shadow Council Remnants"
SRC_sw_shadow_council_remnants_desc:0 "Doomhammer thinks he destroyed the Council, but our agents still operate in the shadows. From Draenor to Azeroth, our network of spies and assassins endures."

SRC_sw_death_knight_project:0 "The Death Knight Project"
SRC_sw_death_knight_project_desc:0 "Slain human knights, their bodies infused with the spirits of orc warlocks... Teron'gor has discovered the ritual. The first Death Knight shall rise."

SRC_sw_necromantic_advancements:0 "Necromantic Advancements"
SRC_sw_necromantic_advancements_desc:0 "Death Knights wield necromantic magic — not the fel flames of warlocks, but the cold grip of death itself. We shall refine their powers and create more of these undead warriors."

SRC_sw_runeblades:0 "Runeblades"
SRC_sw_runeblades_desc:0 "Weapons inscribed with runes of death and decay. Each blade drains the life of its victims and feeds it to the wielder. Death Knights deserve armaments worthy of their power."

SRC_sw_doomhammers_ultimatum:0 "Doomhammer's Ultimatum"
SRC_sw_doomhammers_ultimatum_desc:0 "The Warchief is impatient. He has seen the Death Knights and now demands more. Prove your worth, Gul'dan, or face the same fate as Blackhand."

SRC_sw_serve_the_warchief:0 "Serve the Warchief"
SRC_sw_serve_the_warchief_desc:0 "The Horde is strength. The Horde is survival. For now, Gul'dan will play the loyal servant and lend his warlocks to Doomhammer's war. The secret agenda can wait."

SRC_sw_horde_war_machine:0 "Fuel the Horde War Machine"
SRC_sw_horde_war_machine_desc:0 "Stormwind's factories will produce weapons for the Horde. Our warlocks will empower grunts with dark blessings. Every conquest strengthens our position."

SRC_sw_proven_our_worth:0 "Proven Our Worth"
SRC_sw_proven_our_worth_desc:0 "Let them see our loyalty in battle. When Stormreaver warlocks break the Alliance lines, no one will question our place in the Horde."

SRC_sw_loyal_to_the_end:0 "Loyal to the End"
SRC_sw_loyal_to_the_end_desc:0 "The Stormreaver Clan stands with the Horde until victory or death. Glory to Doomhammer. Glory to the Horde."

SRC_sw_secret_agenda:0 "The Secret Agenda"
SRC_sw_secret_agenda_desc:0 "Doomhammer is a fool. While he wages his petty war, Gul'dan seeks a far greater prize. The Tomb of Sargeras holds power beyond mortal comprehension — and it calls to him."

SRC_sw_whispers_of_the_deep:0 "Whispers of the Deep"
SRC_sw_whispers_of_the_deep_desc:0 "Kil'jaeden's voice grows louder. The Deceiver whispers of a place where Sargeras's avatar once walked this world. The Tomb lies somewhere across the Great Sea."

SRC_sw_search_for_the_tomb:0 "Search for the Tomb"
SRC_sw_search_for_the_tomb_desc:0 "Scouts and warlock scryers are sent across the seas. Ancient maps are studied. The Eye of Sargeras must be found."

SRC_sw_the_tombs_location:0 "The Tomb's Location"
SRC_sw_the_tombs_location_desc:0 "The Broken Isles. Beneath the waves, the Tomb of Sargeras awaits. Gul'dan knows where it is — and when the time is right, he will abandon the Horde to claim it."

SRC_sw_the_great_betrayal:0 "The Great Betrayal"
SRC_sw_the_great_betrayal_desc:0 "At the height of the final battle, Gul'dan orders his ships to sail. The Stormreaver Clan abandons the Horde at Blackrock Spire. Doomhammer's forces are left to die."

SRC_sw_tomb_of_sargeras:0 "Tomb of Sargeras"
SRC_sw_tomb_of_sargeras_desc:0 "Gul'dan raises the Tomb from the ocean floor. But the power within is not what he expected. Demons pour forth, and the warlock who betrayed everyone meets his doom."

###############################
# Events
###############################

stormreaver_second_war.1.t:0 "The First Death Knight"
stormreaver_second_war.1.d:0 "Teron'gor has succeeded. The ritual is complete — the body of a slain human knight, infused with the spirit of a Shadow Council warlock. The first Death Knight has risen. Teron Gorefiend is no longer orc, no longer human, but something entirely new. His eyes burn with necromantic fire, and his voice echoes with the cold of the grave."
stormreaver_second_war.1.option.1:0 "Rise, Teron Gorefiend."

stormreaver_second_war.2.t:0 "Doomhammer's Ultimatum"
stormreaver_second_war.2.d:0 "Doomhammer is impressed by the Death Knights but remains suspicious. 'You have served the Horde well, warlock,' he growls. 'But know this — my trust is not freely given. Betray me, and I will tear your heart from your chest as I did Blackhand's.' The message is clear. Gul'dan must choose: serve the Horde faithfully, or pursue his own path in secret."
stormreaver_second_war.2.option.1:0 "He suspects nothing... yet."

stormreaver_second_war.3.t:0 "The Great Betrayal"
stormreaver_second_war.3.d:0 "As the Horde clashes with the Alliance at Blackrock Spire, Gul'dan gives the order. The Stormreaver fleet raises anchor and sails west, abandoning Doomhammer at the critical moment. Curses echo across the water as the orcs watch their warlock allies disappear over the horizon. The Tomb of Sargeras calls."
stormreaver_second_war.3.option.1:0 "Onward to glory... and doom."

stormreaver_second_war.4.t:0 "The Tomb of Sargeras"
stormreaver_second_war.4.d:0 "Gul'dan raises the Tomb from the ocean floor and enters its dark halls. But the power he seeks is not his to claim. Demons pour from the depths — maddened, ravenous, and ancient. Gul'dan is torn apart by the very creatures he sought to command. Cho'gall and a handful of survivors flee in terror. The greatest warlock the orcs ever knew dies screaming in the darkness."
stormreaver_second_war.4.option.1:0 "His ambition destroyed him."

stormreaver_second_war.5.t:0 "Gul'dan's Secret"
stormreaver_second_war.5.d:0 "Our scouts report suspicious activity from the Stormreaver Clan. Gul'dan's warlocks have been scrying across the Great Sea, searching for something. The warlock is hiding a secret from the Horde."
stormreaver_second_war.5.option.1:0 "Keep a closer eye on him."

stormreaver_second_war.6.t:0 "Death Knights Created"
stormreaver_second_war.6.d:0 "Reports from the Stormreaver Clan confirm Gul'dan's promises. The first Death Knights have been created — fallen human knights reanimated with orc spirits. These undead warriors may prove useful to the Horde."
stormreaver_second_war.6.option.1:0 "Impressive... but watch him closely."

