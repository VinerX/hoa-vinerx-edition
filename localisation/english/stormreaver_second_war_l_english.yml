SRC_secret_agenda:0 "Secret Agenda Active"
SRC_tomb_scouted:0 "Tomb Scouting Underway"
SRC_tomb_found:0 "Tomb of Sargeras Located"
SRC_guldan_dead:0 "Gul'dan is Dead"
SRC_death_knights_created:0 "Death Knights Created"
SRC_ultimatum_received:0 "Ultimatum Received"

###############################
# Expanded Focus Tree
###############################

SRC_sw_outcasts_united:0 "Outcasts United"
SRC_sw_outcasts_united_desc:0 "Gul'dan recruits from the dregs of every clan — warlocks who escaped Doomhammer's purge, necrolytes who served the Shadow Council, ambition-starved grunts with no loyalty but to power. They have no clan. Now they have one."

SRC_sw_clan_of_warlocks:0 "Clan of Warlocks"
SRC_sw_clan_of_warlocks_desc:0 "The Stormreaver Clan takes form — the first orcish clan founded on Azeroth. Its warriors are few, its warlocks many. Gul'dan rules with fear and promises of power."

SRC_sw_shadow_in_the_horde:0 "Shadow in the Horde"
SRC_sw_shadow_in_the_horde_desc:0 "The Shadow Council was destroyed, but its spirit lives on. A new network of informants, assassins, and secret warlocks operates beneath Doomhammer's nose. The Warchief sees only the Stormreavers on the front lines — he does not see the shadows behind them."

SRC_sw_medivhs_whispers:0 "Medivh's Whispers"
SRC_sw_medivhs_whispers_desc:0 "Even as Gul'dan lay comatose after Medivh's death, fragments of the Guardian's mind remained. Visions of a great power locked beneath the waves. A tomb. An eye. He remembers enough to know it exists — but not where."

SRC_sw_the_tombs_call:0 "The Tomb's Call"
SRC_sw_the_tombs_call_desc:0 "Every night the visions return. Sargeras's power, sealed away, waiting. Gul'dan's obsession deepens. The war against the humans is a distraction. The true prize lies somewhere across the Great Sea."

SRC_sw_doomhammers_overseers:0 "Doomhammer's Overseers"
SRC_sw_doomhammers_overseers_desc:0 "Doomhammer is no fool. He plants his own warriors among the Stormreavers — officially as 'advisors,' in truth as spies. Every ritual, every gathering, every whispered conversation is reported back to the Warchief."

SRC_sw_agents_among_overseers:0 "Agents Among Overseers"
SRC_sw_agents_among_overseers_desc:0 "Threats, bribes, promises — Gul'dan turns Doomhammer's spies into his own agents. The Warchief still receives reports, but they contain only what Gul'dan wants him to know. The deception is complete."

SRC_sw_hidden_fel_rituals:0 "Hidden Fel Rituals"
SRC_sw_hidden_fel_rituals_desc:0 "Doomhammer banned fel magic — but he does not see into the catacombs beneath Stormwind. In secret chambers, warlocks summon demons and conduct rituals. The Burning Legion's influence spreads, unseen."

SRC_sw_fel_sanctums:0 "Fel Sanctums"
SRC_sw_fel_sanctums_desc:0 "Deep beneath Stormwind Keep, the foundations of human rule are corrupted into places of demonic worship. These sanctums pulse with fel energy, hidden from prying eyes. The Legion's foothold on Azeroth grows."

SRC_sw_slave_pens:0 "Slave Pens"
SRC_sw_slave_pens_desc:0 "Human prisoners from the First War are put to work in the forges and mines. They are not warriors — just fuel for the Stormreaver war machine. Their suffering feeds the rituals."

SRC_sw_demonic_arsenal:0 "Demonic Arsenal"
SRC_sw_demonic_arsenal_desc:0 "Weapons forged with fel fire, blessed by warlock incantations, quenched in demon blood. The Stormreaver elite arm themselves with tools worthy of the Legion's chosen."

SRC_sw_shadow_recruitment:0 "Shadow Recruitment"
SRC_sw_shadow_recruitment_desc:0 "The Shadow Council's network expands quietly. New operatives are recruited from among the disaffected, the ambitious, the power-hungry. Doomhammer sees nothing."

SRC_sw_warlock_initiates:0 "Warlock Initiates"
SRC_sw_warlock_initiates_desc:0 "A new generation of warlocks rises. Trained in secret by the survivors of the Shadow Council, they will one day surpass their masters. The seeds of corruption are planted deep."

SRC_sw_the_runestone_secret:0 "The Runestone Secret"
SRC_sw_the_runestone_secret_desc:0 "As the Horde besieges Quel'Thalas, Gul'dan studies the elven Runestones that power the Ban'dinoriel barrier. Their arcane energy is immense — and it can be twisted to darker purposes. The key to raising the Tomb may lie within these stones."

SRC_sw_altar_of_storms:0 "Altar of Storms"
SRC_sw_altar_of_storms_desc:0 "Gul'dan dismantles elven Runestones and reshapes them into Altars of Storms. These dark monoliths amplify fel magic beyond anything possible on Azeroth before. Cho'gall uses them to transform loyal ogres into two-headed Ogre Magi."

SRC_sw_power_of_the_runestones:0 "Power of the Runestones"
SRC_sw_power_of_the_runestones_desc:0 "The harvested runestone energy is more than a weapon — it is the key to Gul'dan's grand design. With this power, the Tomb of Sargeras can be raised from the ocean floor. The final piece falls into place."

SRC_sw_ban_dinoriel_deception:0 "Ban'dinoriel Deception"
SRC_sw_ban_dinoriel_deception_desc:0 "'Leave the Stormreavers here,' Gul'dan tells Doomhammer. 'Three more days, and the elven shield will fall.' It is a lie — Gul'dan has no intention of destroying Silvermoon. He needs Doomhammer gone so he can sail west."

SRC_sw_dragonmaw_watchdogs:0 "Dragonmaw Watchdogs"
SRC_sw_dragonmaw_watchdogs_desc:0 "Doomhammer agrees — but leaves the Dragonmaw Clan behind to watch Gul'dan. If the shield does not fall in three days, the Dragonmaw have orders to force the Stormreavers west. And burn them if they resist."

SRC_sw_three_days_deadline:0 "Three Days' Deadline"
SRC_sw_three_days_deadline_desc:0 "The clock ticks. Three days to act before the Dragonmaw enforce Doomhammer's will. Gul'dan must gather his loyalists, seize the fleet, and sail before the deadline expires."

SRC_sw_clan_unity:0 "Clan Unity"
SRC_sw_clan_unity_desc:0 "The internal power struggles that threatened to tear the clan apart are silenced. Gul'dan consolidates his hold over every warlock, necrolyte, and grunt. The Stormreavers speak with one voice — his."

SRC_sw_honor_bound:0 "Honor Bound"
SRC_sw_honor_bound_desc:0 "Gul'dan kneels before Doomhammer and swears a blood oath of loyalty to the Horde. The Warchief accepts — though his eyes betray suspicion. For the first time, the Stormreavers are truly integrated into the orcish war machine."

SRC_sw_stormreaver_legacy:0 "Stormreaver Legacy"
SRC_sw_stormreaver_legacy_desc:0 "The clan proves itself on the battlefield. Stormreaver warlocks rain hellfire on Alliance formations. Their name becomes synonymous with destruction. When the war is won, the clan will have earned its place in the Horde."

SRC_sw_for_the_horde:0 "For the Horde!"
SRC_sw_for_the_horde_desc:0 "Gul'dan has buried his ambitions — or so it seems. The Stormreaver Clan stands with the Horde at the gates of Lordaeron. The Tomb is forgotten. The Eye is forgotten. There is only victory."

SRC_sw_kiljaedens_promise:0 "Kil'jaeden's Promise"
SRC_sw_kiljaedens_promise_desc:0 "The Deceiver speaks. Through the fel flames, Kil'jaeden whispers of the power that awaits in the Tomb of Sargeras. 'Sargeras is dead,' the demon lord intones, 'but his eye remains. Claim it, Gul'dan, and you shall become more than a god.'"

SRC_sw_guldans_chosen:0 "Gul'dan's Chosen"
SRC_sw_guldans_chosen_desc:0 "Not all Stormreavers will follow Gul'dan into betrayal. He selects only the most loyal — those who fear him more than they fear Doomhammer, and those who hunger for power above all else."

SRC_sw_eliminate_overseers:0 "Eliminate the Overseers"
SRC_sw_eliminate_overseers_desc:0 "The time for deception is over. Gul'dan's agents strike simultaneously, silencing every remaining spy and informant. Doomhammer will learn of this — but by then, it will be too late."

SRC_sw_fel_fleet_preparations:0 "Fel Fleet Preparations"
SRC_sw_fel_fleet_preparations_desc:0 "The ships are blessed with demonic wards. Hulls are reinforced with runestone-forged iron. Sails are soaked in fel-infused oils. The fleet that will carry Gul'dan to the Tomb will be unlike anything Azeroth has seen."

SRC_sw_secret_shipyards:0 "Secret Shipyards"
SRC_sw_secret_shipyards_desc:0 "Under the guise of preparing a Horde naval invasion, Gul'dan constructs hidden shipyards along the Stormwind coast. The Warchief believes these docks serve the war effort. They serve only Gul'dan."

SRC_sw_giant_turtles:0 "Giant Sea Turtles"
SRC_sw_giant_turtles_desc:0 "The Stormreavers capture and subdue giant sea turtles from the South Seas using dark magic. These living submarines can carry troops beneath Alliance patrols — perfect for a secret voyage."

SRC_sw_fel_powered_fleet:0 "Fel-Powered Fleet"
SRC_sw_fel_powered_fleet_desc:0 "The Stormreaver armada is complete. Warships powered by demonic engines, crewed by warlocks, shielded by fel magic. No Alliance fleet can stop them. The voyage to the Tomb begins."

SRC_sw_sea_warlocks:0 "Sea Warlocks"
SRC_sw_sea_warlocks_desc:0 "Stormreaver warlocks train in naval combat. They learn to summon storms, to scry enemy positions across the waves, and to set Alliance ships ablaze with fel fire from a league away."

SRC_sw_remnants_of_the_clan:0 "Remnants of the Clan"
SRC_sw_remnants_of_the_clan_desc:0 "Gul'dan is dead. The clan is scattered, hunted, leaderless. But not destroyed. A handful of survivors gather in the shadows of the Broken Isles. The question is not whether they will persist — but what they will become."

SRC_sw_rise_of_gorefiend:0 "Rise of Gorefiend"
SRC_sw_rise_of_gorefiend_desc:0 "Teron Gorefiend — the first Death Knight — takes command of the survivors. He is no mere warlock. He is death given form. Under his cold leadership, the remnants of the Stormreaver Clan becomes something darker."

SRC_sw_the_skull_of_guldan:0 "The Skull of Gul'dan"
SRC_sw_the_skull_of_guldan_desc:0 "Gul'dan's skull still pulses with demonic power. Even in death, the warlock whispers. Gorefiend claims the skull as his own, channeling its power into new and terrible rituals."

SRC_sw_draenor_exodus:0 "Exodus to Draenor"
SRC_sw_draenor_exodus_desc:0 "Azeroth offers nothing but death. The survivors retreat through the Dark Portal, seeking refuge on their dying homeworld. Draenor is a wasteland, but it is theirs."

SRC_sw_dark_horde_reborn:0 "Dark Horde Reborn"
SRC_sw_dark_horde_reborn_desc:0 "From the ashes of the Stormreavers, a new Dark Horde rises. Death Knights command legions of undead. Warlocks summon demonic reinforcements. Gul'dan is dead — but his legacy lives on."

###############################
# Expanded events
###############################

SRC_expanded.1.t:0 "Blood Oath"
SRC_expanded.1.d:0 "Gul'dan kneels before Doomhammer and swears the blood oath. His warlocks follow suit, each one cutting their palm and pressing it to the Warchief's banner. Doomhammer watches in silence, then nods. 'Rise, Stormreavers. You are Horde now.'"
SRC_expanded.1.option.1:0 "The oath is sworn."

SRC_expanded.2.t:0 "Kil'jaeden's Promise"
SRC_expanded.2.d:0 "In the deepest sanctum beneath Stormwind, Gul'dan communes with his true master. Kil'jaeden's voice is silk and fire. 'Sargeras is dead, little warlock, but his Eye remains. The Tomb holds power beyond your comprehension. Find it. Claim it. And when you do, you will kneel before no one.'"
SRC_expanded.2.option.1:0 "I will kneel before no one."

SRC_expanded.3.t:0 "Eliminating the Overseers"
SRC_expanded.3.d:0 "Across Stormwind, Doomhammer's spies are silenced. A knife in the dark for one. A carefully framed 'human ambush' for another. A third simply vanishes. By dawn, every agent the Warchief planted in the Stormreaver Clan is dead or turned."
SRC_expanded.3.option.1:0 "Nothing ties this to us."

SRC_expanded.4.t:0 "Army of the Dead"
SRC_expanded.4.d:0 "Teron Gorefiend has raised more than just himself. A cadre of Death Knights now serves the Stormreaver cause. They ride skeletal steeds, their runeblades drinking the souls of the fallen."
SRC_expanded.4.option.1:0 "The dead march."

SRC_expanded.5.t:0 "Gul'dan's Loyalty"
SRC_expanded.5.d:0 "Reports from Quel'Thalas indicate Gul'dan has made progress on breaking the elven magical barrier. The warlock promises the shield will fall within days. Perhaps he can be trusted after all."
SRC_expanded.5.option.1:0 "Perhaps I misjudged him."

SRC_expanded.6.t:0 "Three Days' Deadline"
SRC_expanded.6.d:0 "Doomhammer has left the siege of Silvermoon, taking the bulk of the Horde west toward Capital City. The Dragonmaw remain, watching. Gul'dan has three days to break the elven barrier — or face the dragons' fire. But the warlock is not working on the barrier. He is preparing a fleet."
SRC_expanded.6.option.1:0 "Every hour counts."

SRC_expanded.7.t:0 "Remnants of the Clan"
SRC_expanded.7.d:0 "The Tomb of Sargeras is a slaughterhouse. Gul'dan and most of the Stormreavers lie dead, torn apart by demons. But a handful escaped — those who waited outside, those who fled before the demons came. They are few. They are broken. But they survive."
SRC_expanded.7.option.1:0 "We endure."

SRC_expanded.8.t:0 "Rise of Gorefiend"
SRC_expanded.8.d:0 "Teron Gorefiend gathers the survivors. His voice is cold as the grave. 'Gul'dan is dead. His ambition killed him. But I am not Gul'dan. I am something new. And I will lead you to a future he never imagined.' The Death Knight raises Gul'dan's skull. 'Power does not die. It changes hands.'"
SRC_expanded.8.option.1:0 "Long live Gorefiend."

SRC_expanded.9.t:0 "Exodus to Draenor"
SRC_expanded.9.d:0 "Azeroth is lost. The survivors retreat through the Dark Portal, back to the dying world that birthed them. Draenor is a wasteland, torn apart by fel magic — but it is the only home they have left. The Stormreaver Clan will rebuild in the shadows of the ruined world."
SRC_expanded.9.option.1:0 "Home... such as it is."

SRC_expanded.10.t:0 "The Dark Horde Reborn"
SRC_expanded.10.d:0 "From the ashes of Gul'dan's ambition, a new power rises. Gorefiend's forces swell with undead and warlocks. The skull of Gul'dan whispers of old enemies and unfinished business. Doomhammer thought he destroyed the dark legacy. He was wrong."
SRC_expanded.10.option.1:0 "Let the world tremble."

SRC_expanded.11.t:0 "Watching the Stormreavers"
SRC_expanded.11.d:0 "The Warchief's orders are clear. Watch Gul'dan. Wait three days. If the barrier does not fall, force his warlocks west. If they resist, burn them all."
SRC_expanded.11.option.1:0 "We watch and wait."

SRC_expanded.12.t:0 "Dragonmaw Reports"
SRC_expanded.12.d:0 "The Dragonmaw have been left behind in Quel'Thalas to watch over Gul'dan and his Stormreavers. They will ensure the warlock keeps his promises — or face the consequences."
SRC_expanded.12.option.1:0 "Good. Keep me informed."

