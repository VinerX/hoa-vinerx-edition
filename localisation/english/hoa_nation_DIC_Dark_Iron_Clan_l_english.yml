darkiron.1.t:0 "A Deal with the Horde"
darkiron.1.d:0 "A large brute creature known as Cho’gall of the Twilight’s Hammer Clan has approached us and demands we give up our lands in exchange for the ushering in of the Hour of Twilight. The Dark Ones have whispered to us and claim that giving this land to the orcish Horde that dwell in the swamps down south will cause great devastation to all nations in the Eastern Kingdoms, and once the dust has settled, we will emerge victorious against any foe."
darkiron.1.option.1:0 "Obey the Whispers."
darkiron.1.option.1.tt:0 "§H[TSC.GetNameWithFlag]§! will gain control over the §HSearing Gorge§!, the eastern part of §HBlackrock Mountain§! and the §HBurning Steppes§!."
darkiron.1.option.2:0 "Defy the Whispers."

darkiron.2.t:0 "An offer from the [BRC.GetName]"
darkiron.2.t.1:0 "[BRC.GetName] ask for a Non-aggression Pact"
darkiron.2.d.1:0 "The ogre Cho'gall has returned to us once more, this time on the behalf of the Blackrock Clan, the leading orcish clan within the Horde. He has informed us that their Warchief, Orgrim Doomhammer, is asking us to relinquish our claims over the upper parts of Blackrock Mountains, where they have established their fortress.\n\n The ogre then left, leaving us to decide after informing us that the Warchief would be awaiting our answer. Once Cho'gall has been gone, Executus, grand majordomo of the Firelord, appeared before us. He told us that Ragnaros himself knew that the orcs would come with such offer, and his orders were to..."
darkiron.2.t.2:0 "[BRC.GetName] ask for a Mutual Guarantee"
darkiron.2.d.2:0 "The ogre Cho'gall has returned to us once more, this time on the behalf of the Blackrock Clan, the leading orcish clan within the Horde. He has informed us that their Warchief, Orgrim Doomhammer, is willing to strike an alliance with us if we accept to relinquish our claims over the upper parts of Blackrock Mountains, where they have established their fortress.\n\n The ogre then left, leaving us to decide after informing us that the Warchief would be awaiting our answer. Once Cho'gall has been gone, Executus, grand majordomo of the Firelord, appeared before us. He told us that Ragnaros himself knew that the orcs would come with such offer, and his orders were to..."
darkiron.2.option.1:0 "...accept the offer."
darkiron.2.option.2:0 "...refuse the offer."

darkiron.3.t:0 "Whispers from Below"
darkiron.3.d:0 "Once again we hear the whispers, faint voices coming from below the earth and echoing discretly against the walls of our halls within the mountains. They creep their way into our minds and order us to allow our newest neighbors, the orcs, to settle within the Badlands to the east...\n Should we obey our masters and give the lands to the green skins?"
darkiron.3.option.1:0 "Obey the voices."
darkiron.3.option.1.d:0 "§1We will transfer any states that we own in the §!§HBadlands§!§1 to the §!§H[BRC.GetNameWithFlag]§!§1.§!\n\n"
darkiron.3.option.2:0 "It would be foolish to disobey the Dark Ones..."

darkiron.4.t:0 "The Command"
darkiron.4.d:0 "The Great Gates are serving as a great obstacle to our conquest, Ambassador Flamelash has ordered us to lay siege to the city. Cho'Gall has reported to us that the firelord has found our mortal stuggle to expand his realm enjoyable, and wishes to offer us a boon...time will tell what power he shall grant us"
darkiron.4.option.1:0 "Wait for the Signal"

darkiron.5.t:0 "The Command"
darkiron.5.d:0 "A Bellowing Roar and a Rush fire erupted from inside the city of Ironforge, a laughter that many had only heard from the deep within the Blackrock Mountain beckoned us.\n The Bronzebeards have been dealt only a fragment of the suffering that was forced upon us all those centuries ago, but it is more then enough."
darkiron.5.option.1:0 "For the Dark Iron Clan!"

darkiron.6.t:0 "Brimstone Massacare"
darkiron.6.d:0 "Our Craftmen were the first to feel it, the heat rising from the Greatforge grew far beyond that had ever been achived, rune carvings glowed a burning red as the very metal of the great anvil began to warp, King Magni was saved by the quick acting of his guards, convincing him of the threat to his life as the smiths attempted to quell the raging furnace.\n A Loud Crack was heard before many thousands of lives were snuffed out, the many homes they dotted the great forge were stained black with tar and soot, as Ragnaros manifested himself inside our very city."
darkiron.6.option.1:0 "What have you done?!"

