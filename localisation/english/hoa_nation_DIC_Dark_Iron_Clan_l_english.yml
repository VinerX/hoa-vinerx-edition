DIC_dagran_thaurissan:0 "Dagran Thaurissan"
POLITICS_DAGRAN_THAURISSAN_DESC:0 "A descendant of the Sorcerer-Thane Thaurissan. Emperor Dagran Thaurissan rules over the Dark Iron clan with an iron fist. Although he is the servant of the Firelord Ragnaros, Dagran boasts great power and dreams of conquering the other dwarven clans so that one day he might overthrow his elemental master with their strength combined."

DIC_moira_thaurissan:0 "Moira Thaurissan"
POLITICS_MOIRA_THAURISSAN_DESC:0 "Daughter of Magni Bronzebeard and husband of Dagran Thaurissan, Moria leads her people against Rangnarous the Firelord who enslaved the dark iron clan after he was summoned into azeroth by the late Sorcerer-Thane Thaurissan."

