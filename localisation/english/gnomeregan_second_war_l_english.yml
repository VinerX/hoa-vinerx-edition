l_english:

###############################
# Gnomeregan Second War Focus Tree
###############################

GNO_sw_mekkatorque_workshop:0 "Mekkatorque's Workshop"
GNO_sw_mekkatorque_workshop_desc:0 "High Tinker Gelbin Mekkatorque is the greatest inventor Gnomeregan has ever produced. As the Horde's war machine rolls across Khaz Modan, Mekkatorque opens the doors of his workshop to every engineer, tinker, and gearmaster in the city. Innovation will be our sharpest weapon. If the orcs want to test our gates, they'll find a welcome beyond their comprehension."

GNO_sw_dwarven_brotherhood:0 "Dwarven Brotherhood"
GNO_sw_dwarven_brotherhood_desc:0 "The gnomes and dwarves of Khaz Modan have been allies since the founding of Ironforge. When Magni Bronzebeard's kingdom stands threatened by the Horde, Gnomeregan does not hesitate. Our bond is forged in iron and steam, not mere parchment — and we will honour it with everything we have."

GNO_sw_iron_gate_preparations:0 "The Iron Gate"
GNO_sw_iron_gate_preparations_desc:0 "The great iron gate of Gnomeregan has never been breached. It was designed by the finest gnome architects, reinforced with dwarven steel, and watched over by automated sentries. Now, with the Bleeding Hollow clan advancing through Khaz Modan, the gate must be fortified further. Let the orcs beat their heads against it until their axes shatter."

GNO_sw_engineering_exchange:0 "Dwarven-Gnomish Exchange"
GNO_sw_engineering_exchange_desc:0 "Ironforge and Gnomeregan each hold secrets the other covets — dwarven mastery of metallurgy meets gnome brilliance in gadgetry. A formal exchange of knowledge and scholars will elevate both kingdoms to new heights of technological prowess. The Horde will face two nations armed with the best of both worlds."

GNO_sw_ironforge_arms_deal:0 "Ironforge Arms Deal"
GNO_sw_ironforge_arms_deal_desc:0 "The forges of Ironforge burn day and night producing rifles, mortars, and ammunition. With a dedicated supply chain from the dwarven capital to our Engineering Labs, Gnomeregan's factories will hum with unprecedented productivity. Arms for the Alliance — stamped with the seal of Bronzebeard."

GNO_sw_mechanical_defenses:0 "Mechanical Defenses"
GNO_sw_mechanical_defenses_desc:0 "Steel plates and static bunkers are primitive. True defense is active — grinding gears, snapping spring-loaded traps, and automated turrets that track movement through heat and pressure. Our engineers have been developing these marvels for years. It is time to deploy them in anger."

GNO_sw_gnomish_ingenuity:0 "Gnomish Ingenuity"
GNO_sw_gnomish_ingenuity_desc:0 "When necessity calls, the gnome mind answers. Mekkatorque has declared a city-wide competition: every workshop, every laboratory, every tinkerer's bench is to produce one war-winning invention within the month. The prize is the High Tinker's personal commendation — and the survival of our race."

GNO_sw_tinkers_mobilize:0 "The Tinkers Mobilize"
GNO_sw_tinkers_mobilize_desc:0 "Every gnome knows their way around a wrench, a spanner, and a sprocket. The Militia Act conscripts every able-bodied tinker into emergency service. They arrive not in gleaming plate but with tool-belts heavy with explosives, spring-loaded gadgets, and a burning determination to defend their home."

GNO_sw_dwarven_artillery_corps:0 "Dwarven Artillery Corps"
GNO_sw_dwarven_artillery_corps_desc:0 "Ironforge has dispatched its finest mortar teams and siege engineers to train Gnomeregan's own artillery corps. Dwarven mortars are the terror of every orc formation in Khaz Modan — and with gnome targeting optics and improved propellant formulae, they will become even deadlier."

GNO_sw_explosive_traps:0 "Explosive Traps"
GNO_sw_explosive_traps_desc:0 "Why fight an orc when you can let the ground beneath him do the work? Pressure-sensitive mines, tripwire grenade clusters, and alchemically-triggered blast zones will transform every approach to Gnomeregan into a deathtrap. The Bleeding Hollow will bleed from more than just their name."

GNO_sw_flying_machines:0 "Flying Machines"
GNO_sw_flying_machines_desc:0 "The skies above Dun Morogh belong to no one — yet. But with gnome gyrocopters and flying machines patrolling the mountain passes, the Horde will never move unseen again. Reconnaissance, strafing runs, and rapid deployment: the third dimension is our newest battlefield."

GNO_sw_alliance_tech_support:0 "Alliance Tech Support"
GNO_sw_alliance_tech_support_desc:0 "Lordaeron, Stormwind refugees, and Ironforge fight with honour and courage — but they lack our technological edge. By dispatching engineering teams to Alliance capitals, we can outfit their armies with gnome-made equipment: improved armour, precision scopes, and communication devices. The Alliance will march with Gnomeregan's genius in every soldier's pack. This commitment also signals our formal alignment with the Alliance of Lordaeron."

GNO_sw_underground_production:0 "Underground Production"
GNO_sw_underground_production_desc:0 "The Hall of Gears and the Workshop are Gnomeregan's industrial heart. By converting civilian assembly lines to war production and expanding our subterranean factory floors, we can churn out equipment faster than the Horde can destroy it. The city that builds beneath the mountain will never run out of ammunition."

GNO_sw_gearworks_militia:0 "Gearworks Militia"
GNO_sw_gearworks_militia_desc:0 "The Gearworks district has been transformed into a training and armament centre for Gnomeregan's citizen militia. Every volunteer receives a custom-fitted battlesuit, a multi-shot rifle, and a satchel of high-explosive charges. The gearworks churn, and an army rises from the workshops."

GNO_sw_gyrocopter_squadrons:0 "Gyrocopter Squadrons"
GNO_sw_gyrocopter_squadrons_desc:0 "A single gyrocopter in the hands of a skilled gnome pilot can outmaneuver a wyvern, strafe an orc column, and relay intelligence faster than any courier. In squadron strength, they become a force that can contest the skies against any flying terror the Horde can muster. The Hangar will roar with the sound of rotors."

GNO_sw_lor_engineering_corps:0 "Lordaeron Engineering Corps"
GNO_sw_lor_engineering_corps_desc:0 "The northern kingdoms fight with swords and shields. Imagine what they could do with gnome engineering at their side. We will dispatch our finest tinkers to Lordaeron and the Stormwind refugee camps, establishing workshops that produce everything from reinforced barricades to steam-powered supply wagons. The Alliance's war effort multiplies tenfold."

GNO_sw_spider_tank_development:0 "Spider Tank Development"
GNO_sw_spider_tank_development_desc:0 "Wheels and treads struggle on mountain slopes. But legs — eight articulated, steam-driven legs — can traverse anything. The spider tank is Gnomeregan's answer to cavalry: an armored walker armed with rotary cannons and flamethrowers, scuttling across terrain that would stall any conventional vehicle. The blueprints are ready. The forge awaits."

GNO_sw_breaking_containment:0 "Breaking Containment"
GNO_sw_breaking_containment_desc:0 "The Bleeding Hollow clan has watched our gates for too long, waiting for the siege to starve us out. They miscalculated. Gnomeregan is not a city that buckles under pressure — it is a coiled spring. With our new weapons, our trained militia, and our unbroken spirit, we will smash through their lines and remind the Horde what happens when you corner a gnome."

GNO_sw_air_reconnaissance:0 "Air Reconnaissance"
GNO_sw_air_reconnaissance_desc:0 "Knowledge is precision, and precision is lethality. Gnomeregan's gyrocopter squadrons will map every Horde encampment, supply depot, and troop rotation across the Khaz Modan front. With real-time intelligence relayed to Alliance commanders, the fog of war lifts — and orcs die in the daylight."

GNO_sw_mechanical_warfare:0 "Mechanical Warfare"
GNO_sw_mechanical_warfare_desc:0 "The age of the gnome soldier is here. Clad in powered exo-frames, operating spider tanks and self-propelled artillery, our forces will redefine what a small race can achieve on the battlefield. Quality over quantity. Gears over flesh. Every gnome soldier becomes a one-gnome army."

GNO_sw_gnomes_strike_back:0 "Gnomes Strike Back"
GNO_sw_gnomes_strike_back_desc:0 "The Bleeding Hollow think they have us pinned. They are wrong. Elite strike teams of gnome engineers and sappers will infiltrate behind Horde lines, sabotage their siege engines, and collapse their supply routes. We may be small, but our explosions are not."

GNO_sw_gnomeregan_holds:0 "Gnomeregan Holds"
GNO_sw_gnomeregan_holds_desc:0 "The siege has tested us, but we remain unbroken. The iron gate stands. The factories run. The people endure. Gnomeregan will not fall — not to orcs, not to dragons, not to any force on this world. Our city is more than walls and gears. It is the resolve of every gnome who calls it home."

GNO_sw_alliance_war_machine:0 "The Alliance War Machine"
GNO_sw_alliance_war_machine_desc:0 "Gnomeregan's contribution to the Alliance war effort is beyond measure. Our flying machines scout enemy movements, our engineers reinforce every front, and our factories produce arms faster than any kingdom in the Eastern Kingdoms. The tide of the Second War turns, and gnomish ingenuity is at the rudder."

GNO_sw_gnomeregan_victory:0 "Victory in Gnomeregan"
GNO_sw_gnomeregan_victory_desc:0 "The Horde has been driven from our lands. The Bleeding Hollow siege is broken, and Gnomeregan stands triumphant. Our alliance with Ironforge is stronger than ever, our technology has proven decisive, and the gnome race has earned its place as a cornerstone of the Alliance. Mekkatorque gazes upon his city — scarred but standing — and knows the future is bright. Or, at the very least, extremely well-lit."

###############################
# Tooltips
###############################

GNO_sw_tinker_militia_tooltip:0 "Mobilizes the Tinkers' Militia from Gnomeregan's workshops"
GNO_sw_assault_team_tooltip:0 "Deploys an elite Gnomish Assault Team against the Bleeding Hollow"

###############################
# Timed Ideas
###############################

GNO_sw_ironforge_arms:0 "Ironforge Arms Supply"
GNO_sw_ironforge_arms_desc:0 "A steady supply of dwarven-forged weaponry and ammunition from Ironforge is boosting Gnomeregan's factory output."

GNO_sw_explosive_defenses:0 "Explosive Defenses"
GNO_sw_explosive_defenses_desc:0 "Every approach to Gnomeregan has been seeded with pressure mines, tripwire charges, and alchemical traps. The Bleeding Hollow will pay in blood for every inch of gnome soil."

GNO_sw_alliance_tech:0 "Alliance Technology Pact"
GNO_sw_alliance_tech_desc:0 "Gnomeregan's engineering teams are embedded with Alliance forces across the Eastern Kingdoms. Our inventions are reshaping the war."

GNO_sw_gearworks:0 "Gearworks Mobilized"
GNO_sw_gearworks_desc:0 "The Gearworks district runs at full wartime capacity, churning out weapons, armour, and gadgets for the gnome militia."

GNO_sw_victory_in_gnomeregan:0 "Victory in Gnomeregan"
GNO_sw_victory_in_gnomeregan_desc:0 "The siege is broken. Gnomeregan stands victorious, its industry and innovation a beacon of hope for the entire Alliance."

GNO_sw_workshop_mobilized:0 "Mekkatorque's Workshop Mobilized"
GNO_sw_workshop_mobilized_desc:0 "Every laboratory, tinker's bench, and engineering bay in Gnomeregan has been redirected toward the war effort."

GNO_sw_ingenuity_bonus:0 "Gnomish Ingenuity"
GNO_sw_ingenuity_bonus_desc:0 "A wave of brilliant invention sweeps through Gnomeregan's workshops, accelerating every research project underway."

GNO_sw_gnomish_engineers_lor:0 "Gnomish Engineering Corps"
GNO_sw_gnomish_engineers_lor_desc:0 "Gnomeregan's finest engineers have established forward workshops, providing technical support, precision equipment, and explosive expertise."

GNO_sw_gnomish_reinforcements_iro:0 "Gnomish Reinforcements"
GNO_sw_gnomish_reinforcements_iro_desc:0 "Gnomeregan's mobilized industry is supplying factories and production lines with cutting-edge engineering support."

GNO_sw_gnomish_reinforcements_lor:0 "Gnomish Reinforcements"
GNO_sw_gnomish_reinforcements_lor_desc:0 "Gnomeregan's mobilized industry is supplying factories and production lines with cutting-edge engineering support."

GNO_sw_dwarven_bonds:0 "Dwarven-Gnomish Bonds"
GNO_sw_debt_of_gratitude:0 "Debt of Gratitude"

###############################
# Events
###############################

gnomeregan_second_war.1.t:0 "Mekkatorque Addresses the People"
gnomeregan_second_war.1.d:0 "The central plaza of Tinkers' Court is packed shoulder-to-gearshoulder with gnomes of every profession. High Tinker Gelbin Mekkatorque stands atop a steam-powered podium, his voice amplified by a device of his own invention. 'Citizens of Gnomeregan,' he calls out, and the crowd falls silent. 'The Horde has shattered the human kingdoms. They have driven through Khaz Modan. And now they come for us.' He pauses, letting the weight settle. 'But we are not humans. We are not dwarves. We are gnomes — and no orc has ever seen what we are capable of when our backs are against the wall. Every workshop a weapons factory. Every tinker a soldier. Every gear a weapon. They will knock on our gates — and we will answer with steel, fire, and the most brilliant minds Azeroth has ever known!' The crowd erupts in cheers. Gnomeregan is at war."
gnomeregan_second_war.1.option.1:0 "For Gnomeregan! For Mekkatorque!"

gnomeregan_second_war.2.t:0 "A Breakthrough!"
gnomeregan_second_war.2.d:0 "An urgent message reaches Mekkatorque's desk: one of the junior engineers in the Hall of Gears has made a discovery that could change everything. The specifics are dense with technical jargon, but the implications are clear — a new power relay system that doubles the efficiency of our mechanical constructs, an alloy blend that strengthens armour without adding weight, a propulsion design that could make our flying machines silent. Mekkatorque reads the report twice, a rare smile crossing his face. 'Promote this gnome,' he says. 'And get this into production immediately.' The breakthrough spreads through the engineering corps like wildfire, and every workshop in the city begins adapting their designs to incorporate the new technology. The Horde will soon face a Gnomeregan more advanced than even we imagined possible."
gnomeregan_second_war.2.option.1:0 "Focus on mechanical engineering. Upgrade the troops."
gnomeregan_second_war.2.option.2:0 "Focus on aerial systems. The skies come first."

gnomeregan_second_war.3.t:0 "The Alliance War Machine Awakens"
gnomeregan_second_war.3.d:0 "The reports arrive from every front simultaneously, and Mekkatorque reads each one with growing satisfaction. Ironforge reports that gnome-engineered factories have tripled their rifle output. Lordaeron writes that our engineering corps saved Hillsbrad from being overrun with their steam-powered barricades. The Stormwind refugees send word that gnome-designed fortifications held against three orcish assaults. And here, at home, the Bleeding Hollow siege has stalled — their war machines broken, their supply lines in chaos. Mekkatorque sets down the last report and looks out the window of Tinkers' Court. The smoke of Horde encampments still rises on the horizon, but it is thinner now. Smaller. 'We did not merely survive,' he murmurs to himself. 'We are winning.' The Alliance war machine is running at full capacity, and at its heart beats a gnome-made engine."
gnomeregan_second_war.3.option.1:0 "For the Alliance! For Gnomeregan!"
