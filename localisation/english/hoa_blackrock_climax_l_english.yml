l_english:
 blackrock_climax.1.t:0 "The Duel at Blackrock Spire"
 blackrock_climax.1.d:0 "The war has come to its bloody crescendo. Beneath the smouldering peak of Blackrock Spire, the Alliance host and the Orcish Horde tear at each other with a fury unmatched in history. In the thick of the slaughter, Anduin Lothar — the Lion of Stormwind, Supreme Commander of the Alliance — faces Orgrim Doomhammer, the Warchief who shattered a kingdom and nearly broke a continent. Their weapons meet, and the world holds its breath."
 blackrock_climax.1.a:0 "Lothar falls... but his sacrifice lights a fire that will never die."
 blackrock_climax.1.b:0 "Doomhammer is struck down! The Horde's spine is broken."
