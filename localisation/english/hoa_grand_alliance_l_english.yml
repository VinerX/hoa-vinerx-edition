l_english:
 grand_alliance.1.t:0 "Quel'Thalas Joins the Alliance"
 grand_alliance.1.d:0 "Lordaeron's envoys have arrived in Silvermoon bearing a formal invitation. King Anasterian's council debates the old oath to Arathor and the peril the Horde poses to all the northern kingdoms. To take up the banner of the Alliance of Lordaeron would bind Quel'Thalas to a war beyond its borders — but the debt of the elves is not forgotten."
 grand_alliance.1.a:0 "For the honor of Silvermoon — we join the Alliance."
 grand_alliance.1.b:0 "Our strength stays behind our own borders."

 grand_alliance.2.t:0 "Gilneas Joins the Alliance"
 grand_alliance.2.d:0 "The invitation from Lordaeron sits before King Greymane. He has no love for foreign entanglements, and the walls of Gilneas are strong. Yet the Horde does not respect walls forever, and to stand utterly alone may be to stand last. His signature — reluctant as it is — would formally bind Gilneas to the Alliance of Lordaeron."
 grand_alliance.2.a:0 "Reluctantly — Gilneas will stand with the Alliance."
 grand_alliance.2.b:0 "Gilneas stands alone."

 grand_alliance.3.t:0 "Stromgarde Joins the Alliance"
 grand_alliance.3.d:0 "With Lordaeron's banners at their side, the men of Stromgarde formalize their place in the Alliance. Trollbane's soldiers have bled against the Horde already; now that sacrifice is bound to a common cause under the Alliance of Lordaeron."
 grand_alliance.3.a:0 "Stromgarde marches with the Alliance."
 grand_alliance.3.b:0 "We defend our own march, and no more."

 grand_alliance.4.t:0 "Gnomeregan Joins the Alliance"
 grand_alliance.4.d:0 "The gnomes of Gnomeregan offer their ingenuity and their machines to the Alliance. Their tinkers and gunmen would be a welcome addition to the war effort against the Horde."
 grand_alliance.4.a:0 "Gnomeregan lends its genius to the Alliance."
 grand_alliance.4.b:0 "We will aid from afar, not from within."

 grand_alliance.5.t:0 "The Coalition of Khaz Modan Joins the Alliance"
 grand_alliance.5.d:0 "Lordaeron's envoys have reached Ironforge. King Magni weighs the invitation: to fold the Coalition of Khaz Modan — Ironforge, Gnomeregan and Northeron alike — into the greater Alliance of Lordaeron. The dwarves have never bent easily to distant crowns, but the Horde threatens all of Khaz Modan, and there is strength in a united front."
 grand_alliance.5.a:0 "By hammer and anvil — Khaz Modan joins the Alliance!"
 grand_alliance.5.b:0 "The Coalition guards Khaz Modan on its own terms."

 grand_alliance.100.t:0 "A New Banner Joins Us"
 grand_alliance.100.d:0 "Another kingdom has answered the call and taken its place within the Alliance of Lordaeron. With each realm that joins, the coalition against the Horde grows stronger."
 grand_alliance.100.a:0 "The Alliance grows."
