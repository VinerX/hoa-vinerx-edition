scarlet.1.t:0 "Meeting of the Seven Kingdoms."
scarlet.1.d:0 "The Kingdom of Lordearon has called a Meeting of the Seven Kingdoms, something that has not been done for a millennia, it would seem as though they are taking the threat from the Orcs to the south seriously."
scarlet.1.option.1:0 "For the Light!"
scarlet.1.option.2:0 "We have no time for politics!"

scarlet_third.1.t:0 "What Remains"
scarlet_third.1.d:0 "Tirion Fordring has offered to house our battered order, through the Undead left its Mark on this land and its people Hearthglen was able to hold its own against the scourge, he has entrused the future of his people to us and the light."
scarlet_third.1.option.1:0 "A Place to rest."

scarlet_third.2.t:0 "News from the East"
scarlet_third.2.d:0 "The Miracle we had been hoping for has finally come, it seems we are not the last bastion to survive the onslaught, Tyrs Hand Holds fast and it would seem some of the order assisted with holding back the tides."
scarlet_third.2.option.1:0 "For The Light!"

