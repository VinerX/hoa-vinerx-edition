l_english:
 LOR_survivors_of_stormwind:0 "Survivors of Stormwind"
 LOR_survivors_of_stormwind_desc:0 "Stormwind's refugees have reached our shores alongside grim veterans and bitter news from the south. Their arrival forces the court of Lordaeron to acknowledge that this war can no longer be treated as a distant calamity."
 LOR_the_council_of_lordaeron:0 "The Council of Lordaeron"
 LOR_the_council_of_lordaeron_desc:0 "Terenas must gather the northern courts and military leaders behind a common response. The work is politically costly, but it is the first step toward a coalition that can actually endure war."
 LOR_secure_stromgarde:0 "Secure Stromgarde"
 LOR_secure_stromgarde_desc:0 "The southern marches cannot be left to Trollbane alone. Whether by men, coin, or supplies, Lordaeron must decide how much it is willing to spend to keep Stromgarde steady."
 LOR_send_alliance_envoys:0 "Send Alliance Envoys"
 LOR_send_alliance_envoys_desc:0 "A coalition cannot be held together by proclamations alone. Lordaeron must cultivate habits of consultation, concession, and shared planning across the northern courts."
 LOR_allied_logistics:0 "Allied Logistics"
 LOR_allied_logistics_desc:0 "Couriers, quartermasters, and supply depots will determine whether the Alliance is merely a council or a war machine. Common effort begins with common movement."
 LOR_reinforce_trollbanes_march:0 "Reinforce Trollbane's March"
 LOR_reinforce_trollbanes_march_desc:0 "The southern frontier needs visible commitment. If Lordaeron wants the Alliance to trust its leadership, it must prove that trust with real support."
 LOR_hold_the_northern_reserve:0 "Hold the Northern Reserve"
 LOR_hold_the_northern_reserve_desc:0 "Lordaeron cannot answer every alarm at once. By preserving its own reserves, the crown can reduce strain at home, though the choice will be felt across the Alliance."
 LOR_a_common_cause:0 "A Common Cause"
 LOR_a_common_cause_desc:0 "Shared sacrifice breeds shared resolve. By committing to the southern front, Lordaeron can turn diplomacy into something harder and more enduring."
 LOR_burden_of_the_crown:0 "Burden of the Crown"
 LOR_burden_of_the_crown_desc:0 "The leadership of the Alliance is not only a matter of prestige. It is a question of what Lordaeron can still sustain without exhausting the kingdom itself."

 LOR_alliance_unity_0:0 "Alliance Unity: Fractured"
 LOR_alliance_unity_0_desc:0 "The Alliance remains a fragile wartime coalition. Distrust, hesitation, and competing priorities make collective action difficult."
 LOR_alliance_unity_1:0 "Alliance Unity: Tentative"
 LOR_alliance_unity_1_desc:0 "The member realms have begun to coordinate in limited ways, though their commitments remain cautious and uneven."
 LOR_alliance_unity_2:0 "Alliance Unity: Gathering"
 LOR_alliance_unity_2_desc:0 "Shared danger and sustained diplomacy are gradually turning the Alliance into a functional coalition."
 LOR_alliance_unity_3:0 "Alliance Unity: Steady"
 LOR_alliance_unity_3_desc:0 "The Alliance now operates with growing trust and coordination, making joint plans more credible and more effective."
 LOR_alliance_unity_4:0 "Alliance Unity: Resolute"
 LOR_alliance_unity_4_desc:0 "The Alliance stands unusually firm. Its members trust common leadership enough to translate promises into coordinated war effort."

 LOR_overextension_0:0 "Lordaeron Overextension: Managed"
 LOR_overextension_0_desc:0 "The burdens placed on Lordaeron remain heavy, but still manageable."
 LOR_overextension_1:0 "Lordaeron Overextension: Strained"
 LOR_overextension_1_desc:0 "Refugees, logistics, and military commitments are beginning to tax the kingdom's administrative capacity."
 LOR_overextension_2:0 "Lordaeron Overextension: Burdened"
 LOR_overextension_2_desc:0 "The crown is being pulled in too many directions at once, and every new obligation carries a visible domestic cost."
 LOR_overextension_3:0 "Lordaeron Overextension: Stretched Thin"
 LOR_overextension_3_desc:0 "The machinery of the kingdom is under severe pressure. Supplies, officials, and patience alike are in short supply."
 LOR_overextension_4:0 "Lordaeron Overextension: Critical"
 LOR_overextension_4_desc:0 "Lordaeron is trying to bear the burdens of several kingdoms at once. Without relief, the strain will begin to undermine the war effort itself."

 LOR_stromgarde_reinforcement_commitment:0 "Commitment to Stromgarde"
 LOR_stromgarde_reinforcement_commitment_desc:0 "Men, coin, and supplies have been earmarked for Trollbane's frontier. The gesture strengthens the Alliance, but it leaves fewer reserves at home."
 LOR_preserved_royal_reserves:0 "Preserved Royal Reserves"
 LOR_preserved_royal_reserves_desc:0 "The crown has held back men and material for future emergencies. The treasury breathes easier, though our allies may judge the decision harshly."
 LOR_stromgarde_reinforcements_received:0 "Lordaeron Reinforcements"
 LOR_stromgarde_reinforcements_received_desc:0 "Lordaeron has committed fresh support to Stromgarde's line, improving readiness on the southern front."

 lordaeron_second_war_proto.1.t:0 "Survivors of Stormwind"
 lordaeron_second_war_proto.1.d:0 "The fall of Stormwind is no longer a distant report but a living reality in Lordaeron's streets. Refugees, officers, and retainers from the south bring with them hard lessons: the Horde can break kingdoms, and Lordaeron will now bear the first weight of holding the human realms together."
 lordaeron_second_war_proto.1.option.1:0 "We will bear this burden."

 lordaeron_second_war_proto.2.t:0 "The Council Convenes"
 lordaeron_second_war_proto.2.d:0 "At Terenas' call, the courts and commanders of the north begin the slow work of forming a common policy. No grand settlement is reached at once, but the act of gathering itself marks a change: the war is now an Alliance matter, not only Lordaeron's."
 lordaeron_second_war_proto.2.option.1:0 "Then let the work begin."

 lordaeron_second_war_proto.3.t:0 "Aid for Stromgarde"
 lordaeron_second_war_proto.3.d:0 "Trollbane's realm guards the exposed southern marches, but every wagon sent there is one not stored in Lordaeron's depots. The question is not whether Stromgarde matters, but how much Lordaeron can afford to spend on proving it."
  lordaeron_second_war_proto.3.option.1:0 "Reinforce Stromgarde."
  lordaeron_second_war_proto.3.option.2:0 "Preserve the royal reserves."

 ###############################
 # Expanded Focuses — War Arc
 ###############################

 LOR_sw_silver_hand:0 "The Silver Hand"
 LOR_sw_silver_hand_desc:0 "Archbishop Alonsus Faol, having witnessed the horrors this war has inflicted upon the innocent, proposes an order that has no precedent in human history: warrior-priests who would wield both sword and holy Light against the darkness. These 'Paladins' would serve as the Alliance's answer to the Horde's warlocks and death knights. Uther, a knight of unwavering faith, is chosen to be the first among them. The Order of the Silver Hand is born."

 LOR_sw_uther_lightbringer:0 "Uther the Lightbringer"
 LOR_sw_uther_lightbringer_desc:0 "Uther's very presence on the battlefield inspires those around him to impossible feats of courage. His hammer, blessed by Faol himself, radiates the holy Light — and where that light falls, orcish fel magic withers. Soldiers who once fled from warlocks now charge behind the Lightbringer, knowing that faith can be a weapon."

 LOR_sw_turalyon_oath:0 "Turalyon's Oath"
 LOR_sw_turalyon_oath_desc:0 "A young priest named Turalyon has taken the vows of the Silver Hand — but unlike Uther's serene devotion, Turalyon's faith is forged in fury. He watched Stormwind burn from afar. He has seen the refugee camps, the orphaned children, the horrors the Horde leaves in its wake. When he swears his oath, there is no calm in his voice — only a quiet, burning promise of retribution."

 LOR_sw_lothar_command:0 "Lothar's Command"
 LOR_sw_lothar_command_desc:0 "Anduin Lothar — the Lion of Azeroth, last of the Arathi bloodline, the man who led Stormwind's survivors through Blasted Lands and orc patrols — is appointed Supreme Commander of the Alliance forces. No living commander knows the Horde's tactics better. No living human inspires greater loyalty. Under Lothar's command, the scattered armies of the Alliance will become a single instrument of war."

 LOR_sw_unified_command:0 "Unified Command"
 LOR_sw_unified_command_desc:0 "With Lothar at the helm, the once-fractured Alliance armies begin to operate as a cohesive force. Common supply depots, shared intelligence, coordinated battle plans — the machinery of a true coalition war machine grinds into motion. Lordaeronian footmen march alongside Stromic berserkers and dwarven riflemen. The Alliance is no longer a diplomatic fiction."

 LOR_sw_appeal_quelthalas:0 "Appeal to Quel'Thalas"
 LOR_sw_appeal_quelthalas_desc:0 "Over two thousand years ago, the high elves stood on the brink of annihilation — and Thoradin of Arathor saved them. A debt was sworn that day, passed from king to king, from age to age. Now envoys ride to Silvermoon bearing Thoradin's ancient pledge, asking the elves to honour what their ancestors promised. The Council of Silvermoon must decide: do the elves of Quel'Thalas remember what they owe the line of Arathor?"

 LOR_sw_hillsbrad_defense:0 "Hillsbrad Defense"
 LOR_sw_hillsbrad_defense_desc:0 "The Horde has broken through the southern defensive lines. Orcish columns pour into Hillsbrad, burning villages and driving refugees before them. The Silver Hand Paladins and Lothar's battle-hardened forces must converge here — on the rolling fields between the mountains and the sea — and hold. If Hillsbrad falls, the road to Capital City is open."

 LOR_sw_siege_capital:0 "Siege of Capital City"
 LOR_sw_siege_capital_desc:0 "They have reached the walls. Orcish siege engines hurl flaming debris against the ancient stone of Capital City while the citizens huddle in cathedrals and cellars. The sky above Lordaeron is black with smoke. This is the darkest hour of the Second War — the Horde at the very gates of the Alliance's heart. And yet, in the streets and on the ramparts, the defenders do not break. They pray. They reload. They wait."

 LOR_sw_paladins_turn_tide:0 "The Paladins Turn the Tide"
 LOR_sw_paladins_turn_tide_desc:0 "At the height of the siege, when the walls tremble and hope hangs by a thread, Uther Lightbringer and his Paladins lead the counter-charge. The Light erupts from their hammers as they crash into the Horde lines, holy fire searing through fel-touched flesh. Turalyon fights with a fury that borders on divine. The orcs — who have never known fear — take a step backward. Then another. The siege of Capital City is broken, not by strategy, but by faith made manifest."

 LOR_sw_counter_offensive:0 "Counter-Offensive"
 LOR_sw_counter_offensive_desc:0 "The siege is lifted, but the war is far from over. Now the Alliance must do what no army has yet done: push the Horde back. Every liberated village, every recaptured mile of road, is bought with blood. This is no longer a defensive war for survival — it is a war of liberation, and its momentum is finally with the Alliance."

 LOR_sw_liberate_khaz_modan:0 "Liberate Khaz Modan"
 LOR_sw_liberate_khaz_modan_desc:0 "Through the mountain passes, past the blackened ruins of dwarven watchtowers and the smoke-stained peaks of Dun Morogh, the Alliance army pushes into Khaz Modan. Ironforge holds — battered, besieged, but gloriously unbroken. When Magni Bronzebeard's gates swing open to admit their liberators, the cheer that rises from the mountain halls can be heard across the entire region. The dwarves have not been broken. And now they march with the Alliance."

 LOR_sw_march_blackrock:0 "March on Blackrock"
 LOR_sw_march_blackrock_desc:0 "Blackrock Mountain — the volcanic heart of the Horde's war machine. From this fortress of iron and flame, Orgrim Doomhammer commands the remnants of his legions for one final stand. The Alliance army halts at the mountain's base, staring up at the blackened peak jutting against the sky. Every soldier knows that this will be the decisive battle. Lothar draws his sword and gives the order to advance."

 LOR_sw_lothar_sacrifice:0 "Lothar's Sacrifice"
 LOR_sw_lothar_sacrifice_desc:0 "At the foot of Blackrock Mountain, beneath a sky lit by volcanic fire, Anduin Lothar meets Orgrim Doomhammer in single combat. The Lion of Azeroth against the Warchief of the Horde. Their duel is brief and brutal — and when Lothar falls, a great cry of anguish rises from the Alliance ranks. But the Lion's death is not a defeat. It is a catalyst. Grief transforms into rage, and rage transforms into a righteous fury that no orc can withstand. Lothar dies a hero — and in dying, he wins the war."

 LOR_sw_turalyon_takes_command:0 "Turalyon Takes Command"
 LOR_sw_turalyon_takes_command_desc:0 "With Lothar gone, a young paladin steps forward to fill the void left by a legend. Turalyon picks up Lothar's shattered sword and raises it toward the smoking peak of Blackrock. 'Soldiers of the Alliance,' he roars, the Light blazing from his being, 'Lothar gave his life for this moment! Will you let his sacrifice be in vain?!' The answer is not spoken — it is screamed, in the voices of ten thousand soldiers who will not let their commander's death pass unavenged."

 LOR_sw_destroy_dark_portal:0 "Destroy the Dark Portal"
 LOR_sw_destroy_dark_portal_desc:0 "While Turalyon leads the final assault, Khadgar and his mages race to the Blasted Lands. The Dark Portal looms before them — the gateway between worlds, the wound through which the orcish Horde first poured into Azeroth. Khadgar channels every ounce of arcane power he possesses, and with a spell that shakes the foundations of reality, the Portal begins to crack. The way to Draenor is sealed. No more orcs will come through. The Second War is over."

 LOR_sw_internment_camps:0 "Internment Camps"
 LOR_sw_internment_camps_desc:0 "The orcish prisoners number in the tens of thousands — warriors who fought, workers who supported them, and clans who will not simply lay down their arms and disappear. The debate in the Alliance council is fierce. Execution would make monsters of the victors. Release would invite the war to begin again. King Terenas proposes a middle path: internment camps, guarded by Alliance troops, where the orcs will be held and studied until the Alliance can determine their ultimate fate. It is not mercy. It is prudence."

 LOR_sw_rebuild_alliance:0 "Rebuild the Alliance"
 LOR_sw_rebuild_alliance_desc:0 "The war has ended, but unity must outlast the crisis that forged it. Terenas Menethil proposes a permanent Alliance of nations — a standing council of kings bound by treaty, where disputes are settled by diplomacy rather than steel. The kingdoms that bled together will now govern together. If this institution endures, the horrors of the Second War need never be repeated."

 LOR_sw_lasting_peace:0 "A Lasting Peace"
 LOR_sw_lasting_peace_desc:0 "The Second War is over. The Horde is broken, the Dark Portal shattered, and the Alliance stands triumphant — scarred, exhausted, but gloriously alive. King Terenas Menethil gazes out over his capital city, its walls bearing fresh scars but its banners still flying. The world has changed. The old certainties are gone. But for the first time in years, the people of Lordaeron sleep without fear of the dawn. A lasting peace — perhaps the first in human history — may truly be within their grasp."

 ###############################
 # Expanded Events
 ###############################

 lordaeron_second_war_expanded.1.t:0 "The Silver Hand Is Founded"
 lordaeron_second_war_expanded.1.d:0 "In the great cathedral of Capital City, Archbishop Alonsus Faol stands before a congregation that includes kings, generals, and common soldiers alike. Before him kneels Uther — a knight whose faith has transformed him into something more. 'Rise, Uther the Lightbringer,' Faol intones, touching the Light-blessed hammer to each shoulder. 'Rise as the first Paladin of the Order of the Silver Hand. Let your faith be your shield, your hammer be your judgment, and the Holy Light be your guide.' As Uther rises, the cathedral erupts in light — not the cold, clinical light of arcane magic, but the warm, golden radiance of something older and purer. The Order of the Silver Hand is born, and the darkness of the Horde has met its answer."
 lordaeron_second_war_expanded.1.option.1:0 "The Light will guide us through this darkness."

 lordaeron_second_war_expanded.2.t:0 "Lothar Takes Command"
 lordaeron_second_war_expanded.2.d:0 "The war council chamber in Capital City falls silent as Anduin Lothar enters. The Lion of Azeroth — last descendant of the Arathi bloodline, the man who led Stormwind's survivors through hell itself — stands before the assembled kings and generals of the Alliance. King Terenas rises and addresses the chamber: 'No man here has faced the Horde as Lothar has. No man here understands their tactics as he does. I propose that Sir Anduin Lothar be named Supreme Commander of the Alliance forces — with full authority over every army, every regiment, every soldier who fights under our banners.' One by one, the kings and generals rise in assent. Lothar's face betrays no emotion, but his hand tightens on the hilt of his sword. 'I accept this burden,' he says quietly. 'I will not let you down.'"
 lordaeron_second_war_expanded.2.option.1:0 "The Lion of Azeroth leads us now."

 lordaeron_second_war_expanded.3.t:0 "The Siege of Capital City"
 lordaeron_second_war_expanded.3.d:0 "The war horns sound from the walls of Capital City, and every man, woman, and child who hears them knows what they mean. The Horde is here. Orcish siege engines — crude, brutal, and devastating — hurl flaming debris over the ancient walls while battering rams thunder against the main gate. The sky chokes with smoke. In the streets, militiamen prepare for close-quarters combat while families shelter in the catacombs beneath the cathedral. Lothar strides along the ramparts, his voice carrying over the chaos, rallying the defenders. This is the moment that will test everything the Alliance has built. If the walls hold, the Alliance lives. If they crumble... there will be no second chance."
 lordaeron_second_war_expanded.3.option.1:0 "Every man to the walls! The city must hold!"

 lordaeron_second_war_expanded.4.t:0 "The Fall of Lothar"
 lordaeron_second_war_expanded.4.d:0 "It happens in a moment that will be etched into Alliance memory forever. At the foot of Blackrock Mountain, surrounded by the roaring armies of both sides, Anduin Lothar faces Orgrim Doomhammer in single combat. The Lion against the Warchief. Swords clash, sparks fly, and for one terrible heartbeat the entire battlefield falls silent. Then Lothar stumbles. Doomhammer's blow catches him across the chest, and the Lion of Azeroth falls. A cry of anguish rises from the Alliance ranks — grief so raw it seems to shake the mountain itself. But then, from that grief, something else rises. Fury. Turalyon, tears streaming down his face, lifts Lothar's shattered sword and charges forward. The Alliance follows. Lothar is dead — but his death has just won the war."
 lordaeron_second_war_expanded.4.option.1:0 "Avenge him. End this war."

 lordaeron_second_war_expanded.5.t:0 "The Dark Portal Destroyed"
 lordaeron_second_war_expanded.5.d:0 "In the hellscape of the Blasted Lands, Khadgar and his circle of mages stand before the monolithic arch of the Dark Portal. The gateway pulses with fel energy, its surface rippling like a wound that will never heal. 'This is it,' Khadgar murmurs, channeling power drawn from the ley lines beneath Azeroth itself. 'When I give the word, pour everything you have into the destabilization matrix.' The mages raise their staffs in unison. Arcane energy, pure and blinding, lances into the Portal. The stone groans. The rift screams. And then — with a thunderclap that can be heard from Lordaeron to Stormwind — the Dark Portal shatters. The way to Draenor is closed. Khadgar sinks to his knees, utterly spent, but a faint smile crosses his lips. 'It's over,' he whispers. 'It's finally over.'"
 lordaeron_second_war_expanded.5.option.1:0 "The nightmare is over. We have won."

# New focuses — The Silver Hand
 LOR_sw_silver_hand:0 "Knights of the Silver Hand"
 LOR_sw_silver_hand_desc:0 "Archbishop Alonsus Faol proposes a new order: holy warriors who will wield the Light as both shield and weapon. Uther the Lightbringer will be their first paladin. The canonisation of this order promises to change the character of the entire war."
 LOR_sw_uther_lightbringer:0 "Uther the Lightbringer"
 LOR_sw_uther_lightbringer_desc:0 "Uther is not only a paladin — he is the ideal that every knight of the Silver Hand strives to embody. His presence on the battlefield radiates hope, steadies broken lines, and reminds the Alliance what it fights for."
 LOR_sw_turalyon_oath:0 "Turalyon's Oath"
 LOR_sw_turalyon_oath_desc:0 "Young Turalyon takes his vows with the quiet intensity of a man who has seen the Horde's brutality first-hand. His devotion to the Light is matched only by his loyalty to his mentor — and his growing sense of responsibility."

# New focuses — Lothar's Command
 LOR_sw_lothar_command:0 "Lothar's Command"
 LOR_sw_lothar_command_desc:0 "Anduin Lothar, last of the Arathi bloodline and hero of Stormwind, is the natural choice to lead the Alliance's armies. His appointment as Supreme Commander gives the coalition a single voice on the battlefield — and a symbol that transcends shattered kingdoms."
 LOR_sw_unified_command:0 "Unified Alliance Command"
 LOR_sw_unified_command_desc:0 "Lothar forges the disparate armies of the Alliance into a single instrument. Borders of pride and ancient precedent dissolve before the urgency of the hour, and for the first time the northern realms fight as one."

# New focuses — Appeal to Quel'Thalas
 LOR_sw_appeal_quelthalas:0 "Appeal to Quel'Thalas"
 LOR_sw_appeal_quelthalas_desc:0 "Lothar invokes the ancient blood oath sworn between King Thoradin of Arathor and the high elves of Quel'Thalas. An oath made millennia ago may yet compel Silvermoon to honour the bond that saved both races in the Troll Wars."

# New focuses — Hillsbrad Defense
 LOR_sw_hillsbrad_defense:0 "Fortify Hillsbrad"
 LOR_sw_hillsbrad_defense_desc:0 "The Hillsbrad coast offers the Horde a natural landing point for a naval invasion of Lordaeron's heartland. Fortifications, patrols, and a well-placed garrison are essential if Capital City is to be shielded from the sea."

# New focuses — Siege of Capital City
 LOR_sw_siege_capital:0 "Siege of Capital City"
 LOR_sw_siege_capital_desc:0 "The Horde has breached the outer defences. Orcish war drums echo through the hills and smoke rises above the northern districts. Capital City itself is now a battlefield, and the survival of the Alliance hangs on the courage of its defenders."
 LOR_sw_paladins_turn_tide:0 "The Paladins Turn the Tide"
 LOR_sw_paladins_turn_tide_desc:0 "At the darkest hour, Uther's Silver Hand makes its true debut. The paladins wade into the breach with hammer and holy fire, their presence reigniting the flagging spirits of every Alliance soldier. The Horde, for the first time, hesitates."

# New focuses — Counter-Offensive
 LOR_sw_counter_offensive:0 "The Counter-Offensive"
 LOR_sw_counter_offensive_desc:0 "With the Horde's momentum broken, the Alliance seizes the initiative. Lothar orders a general advance from north to south, driving the invaders step by step out of Lordaeron and back into the contested highlands."
 LOR_sw_liberate_khaz_modan:0 "Liberate Khaz Modan"
 LOR_sw_liberate_khaz_modan_desc:0 "The campaign passes through the Thandol Span and into the snow-swept peaks of Khaz Modan. The Alliance carries the fight to the Horde's forward positions, aiming to relieve the besieged dwarves of Ironforge and reclaim the mountain passes."

# New focuses — Blackrock Spire
 LOR_sw_march_blackrock:0 "March on Blackrock Spire"
 LOR_sw_march_blackrock_desc:0 "The Horde's seat of power in Azeroth lies in the volcanic heart of Blackrock Mountain. Lothar knows that nothing short of a decisive blow there will end the war, and so the Alliance marches into the burning steppes for a final reckoning."
 LOR_sw_lothar_sacrifice:0 "Lothar's Sacrifice"
 LOR_sw_lothar_sacrifice_desc:0 "At the foot of Blackrock Spire, Anduin Lothar falls in single combat against the Warchief. The Alliance reels in grief, but his death does not break the army — it steels it. Turalyon, consumed by righteous fury, lifts Lothar's shattered sword and rallies the line."
 LOR_sw_turalyon_takes_command:0 "Turalyon Takes Command"
 LOR_sw_turalyon_takes_command_desc:0 "With Lothar gone, Turalyon rises as the Alliance's new military leader. His first act is to finish what Lothar started: the Horde must be shattered, and its retreat cut off before it can regroup. There will be no second Blackrock."

# New focuses — Destroy the Dark Portal
 LOR_sw_destroy_dark_portal:0 "Destroy the Dark Portal"
 LOR_sw_destroy_dark_portal_desc:0 "Khadgar and a small expedition push through to the Blasted Lands with a single purpose: to collapse the Dark Portal and sever the Horde from its homeworld. Success means the end of the Second War. Failure is unthinkable."

# New focuses — Post-War
 LOR_sw_internment_camps:0 "Internment Camps"
 LOR_sw_internment_camps_desc:0 "With the Horde shattered but not fully eradicated, thousands of orcs remain in Alliance custody. The question of what to do with them — prison camps, resettlement, or something harsher — divides the courts. The crown must decide."
 LOR_sw_rebuild_alliance:0 "Rebuild the Alliance"
 LOR_sw_rebuild_alliance_desc:0 "Victory has been won at enormous cost. The Alliance must now transition from a wartime coalition into a lasting partnership. Roads, trade pacts, and shared garrisons will cement the bonds forged in blood."
 LOR_sw_lasting_peace:0 "A Lasting Peace"
 LOR_sw_lasting_peace_desc:0 "The Second War is over. The kingdoms of the Alliance face a future without the immediate shadow of the Horde — but the choices made in this peace will echo for generations. The crown must balance justice, reconciliation, and the silent question of whether the next war has already begun."

# Event localisation
 lordaeron_second_war_expanded.1.t:0 "Knights of the Silver Hand"
 lordaeron_second_war_expanded.1.d:0 "Archbishop Alonsus Faol gathers the most devout and battle-hardened knights of Lordaeron in the Cathedral of Light. Before the altar he consecrates the Order of the Silver Hand, charging Uther the Lightbringer as its first paladin. The ceremony is sombre and grand — a fusion of old martial tradition and the living power of the Holy Light."
 lordaeron_second_war_expanded.1.option.1:0 "Rise, knights of the Light."

 lordaeron_second_war_expanded.2.t:0 "The Lion of Stormwind"
 lordaeron_second_war_expanded.2.d:0 "In a solemn ceremony before the united sovereigns, Anduin Lothar is appointed Supreme Commander of the Alliance forces. He accepts with few words — there is no pride in his bearing, only the weight of a kingdom lost and a promise to see the Horde defeated. The assembled rulers bow their heads, and the war acquires a single will."
 lordaeron_second_war_expanded.2.option.1:0 "For Strom! For the Alliance!"

 lordaeron_second_war_expanded.3.t:0 "The Horde at Our Gates"
 lordaeron_second_war_expanded.3.d:0 "The Horde's naval landing has overwhelmed the Hillsbrad defences. War horns sound from the city walls as orcish banners appear on the northern horizon. Civilians are evacuated from the outer districts, and every able-bodied defender is called to the line. Capital City braces for the worst."
 lordaeron_second_war_expanded.3.option.1:0 "Every man and woman to the walls."

 lordaeron_second_war_expanded.4.t:0 "The Death of Lothar"
 lordaeron_second_war_expanded.4.d:0 "In the shadow of the Blackrock Spire, Anduin Lothar faces the Warchief in single combat. The clash is brief and brutal. Lothar falls, sword shattered, eyes still fixed on the enemy. Across the Alliance line, thousands of soldiers watch in silence — and then in a single roar of grief and fury. The war has taken its greatest champion."
 lordaeron_second_war_expanded.4.option.1:0 "For Lothar! For the Alliance!"

 lordaeron_second_war_expanded.5.t:0 "The Dark Portal Falls"
 lordaeron_second_war_expanded.5.d:0 "Khadgar and the Sons of Lothar reach the Dark Portal in the Blasted Lands. With arcane mastery and desperate courage, they disrupt the gateway's structure until the great rift collapses upon itself. The skies clear, the demonic taint recedes, and the Horde stranded on Azeroth is cut off from Draenor forever. The Second War is over."
 lordaeron_second_war_expanded.5.option.1:0 "It is finished."
