PAL_snagglespear:0 "Snagglespear"
POLITICS_SNAGGLESPEAR_DESC:0 "Chieftain of a Palemane Gnolls and one of the biggest threats to the stability of Mulgore - he fights viciously against the local tauren and harpys, dwelling from Palemane Rock, he sends out his skinners, tanners, and poachers to slay the wildlife of Mulgore - and the tauren who attempt to defend it."

