########################################
#Government Events
########################################

government_city_state.2.t:0 "Merchant Gift"
government_city_state.2.d:0 "The Merchants of our nation have pooled together a tribute to us in hopes that it may curry favor."
government_city_state.2.option.1:0 "Very well"

government_city_state.3.t:0 "Festival Celebrations"
government_city_state.3.d:0 "A large celebration has occured within the nation, we are not sure what it is for but it does not seem to have stirred up any sort of negative outcomes."
government_city_state.3.option.1:0 "This Pie is Great!"

government_city_state.4.t:0 "Artisan Competitions"
government_city_state.4.d:0 "There is currently a craftsmen competition happening in the capital, it may be worth out time to attempt to gather some additional materials if we can."
government_city_state.4.option.1:0 "See what they have spare."

government_city_state.5.t:0 "Diplomatic 'Envoy'"
government_city_state.5.d:0 "One of our esteemed Guests has once again joined us in the capital to be pampered as usual, they however also bring some interesting news from our neighbor."
government_city_state.5.option.1:0 "Do he have any good wine?"

government_city_state.6.t:0 "A Traveling Scholar"
government_city_state.6.d:0 "It would seem that a member of the Kirin'tor has arrived at our door step, he has already mended a few things in the city with his arcane arts and wishes to recieve patronage for his ongoing research."
government_city_state.6.option.1:0 "We have resouces to spare."

government_clan.2.t:0 "Training Bouts"
government_clan.2.d:0 "A few young warriors have decided to go at each other a little harder their usual, they did make quite the scene that the instructors demanded the same level of effort from all the other combatants."
government_clan.2.option.1:0 "Oh to be young."

government_clan.3.t:0 "Rituals"
government_clan.3.d:0 "A Wise man has recently held a ritual with a large number of our clan, it seems to have gone quite well."
government_clan.3.option.1:0 "Very well"

government_clan.4.t:0 "Bountiful Hunt"
government_clan.4.d:0 "A group of hunters have recently returned from a grand expedition, they have returned with enough hides and meat that they were practically giving it away."
government_clan.4.option.1:0 "See if they have any Venison."

government_clan.5.t:0 "Infused Steel"
government_clan.5.d:0 "A Group of smiths have recently begun selling magical weapons, though the effects are minor we have already begun the process of aquiring their wares."
government_clan.5.option.1:0 "For a Fair Price."

government_clan.6.t:0 "Pilgrimage"
government_clan.6.d:0 "A Pilgrimage has returned from another continent, they bring tales of strange creatures and ancient ruins."
government_clan.6.option.1:0 "Better not be the damned Bears."

government_council.2.t:0 "New Blood"
government_council.2.d:0 "The Council is in need of new blood, there is a growing pool of candidates that we must go through, though they may not be suitable, their insight may be better used elsewhere."
government_council.2.option.1:0 "Oh where to begin"

government_council.3.t:0 "A Trade Agreement"
government_council.3.d:0 "An Envoy has reached out to us from a distant land bringing with them a vast trove of interesting items, he wishes to use them as a form of barter for some of our key resouces."
government_council.3.option.1:0 "A Ship in a bottle?"

government_council.4.t:0 "Public Works"
government_council.4.d:0 "Some areas of the nation are in dire need of renovation and general improvements, we should use this time of peace to tend to internal matters."
government_council.4.option.1:0 "Wait...We still have slums?"

government_council.5.t:0 "Council Meetings"
government_council.5.d:0 "The Council members have begun their meeting with the nations generals, hopefully there is no fighting like last time?"
government_council.5.option.1:0 "Who threw that chair?"

government_council.6.t:0 "The Archives"
government_council.6.d:0 "Another wing of the Archives has been completed, with it comes the task of cataloguing every existing book and scroll before its new permanent place is found."
government_council.6.option.1:0 "This book is full of crumbs"

###Crime
government_criminal.2.t:0 "Successful Heist"
government_criminal.2.d:0 "Those Fools didnt know what hit'em, first they were looking at us like trash, then they were just begging us to take their goods."
government_criminal.2.option.1:0 "Distribute the Spoils"

government_criminal.3.t:0 "Criminal Network"
government_criminal.3.d:0 "Out network of fences and street level goons has grown, seems like some of them are now also doing some 'intelligence operations'."
government_criminal.3.option.1:0 "Wait, he does what to his Warriors?"

government_criminal.4.t:0 "Black Market Boom"
government_criminal.4.d:0 "A surge in black market activity has everyone scrambling to get a piece of the action."
government_criminal.4.option.1:0 "Exploit the Chaos."

government_criminal.5.t:0 "Assassin's Precision"
government_criminal.5.d:0 "Seems someone didnt really like what their rival was doing, so we decided to grease our palms, and his front steps."
government_criminal.5.option.1:0 "Some say he had been drinking"

government_criminal.6.t:0 "Smugglers Route"
government_criminal.6.d:0 "Some of the lads have been able to get their hands on some prized goods, not much good to us but those Goblins are more then willing to work for anything that aint nailed down."
government_criminal.6.option.1:0 "As long as they dont blow something up."

