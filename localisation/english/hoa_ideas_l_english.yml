 great_tree_guardians_idea_desc:0 "The Green Dragons of this nations protect a Great Tree, sacred saplings of the World Tree Nordrassil that acts as portal to the Emerald Dream. \n\n §GThis idea will be removed if this nation is played by a human player.§!"
