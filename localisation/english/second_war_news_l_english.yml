l_english:
 # Second War Global News Events
 # Phase 1: Prelude
 second_war_news.1.t:0 "Goblins Forge the Horde Fleet"
 second_war_news.1.d:0 "The Steamwheedle Cartel has accepted Warchief Doomhammer's gold. Goblin shipwrights, engineers, and sappers have begun constructing a massive invasion fleet in the Wetlands, paid for with the plundered treasury of Stormwind. For the first time, the Horde will take to the seas."
 second_war_news.1.a:0 "Lok'tar ogar!"
 second_war_news.1.b:0 "The Horde's reach extends to the waves."

 second_war_news.2.t:0 "The First Death Knight Rises"
 second_war_news.2.d:0 "Gul'dan, desperate to prove his worth to Warchief Doomhammer, has succeeded in binding the orc spirit of Teron'gor into the corpse of a fallen human knight. The creature now known as Teron Gorefiend is the first of a new breed of warrior — a Death Knight, wielding necromantic powers that can match the clerics and magi of the Alliance."
 second_war_news.2.a:0 "A weapon to turn the tide."
 second_war_news.2.b:0 "The Horde sinks to new depths..."
 second_war_news.2.c:0 "Dark tidings from the south."

 second_war_news.3.t:0 "Alexstrasza Enslaved"
 second_war_news.3.d:0 "The Dragonmaw clan, wielding the ancient artifact known as the Demon Soul, has captured the Red Dragon Aspect Alexstrasza. The Life-Binder is now chained deep within Grim Batol, her red dragonflight forced into servitude. Warchief Doomhammer now commands the most devastating aerial force Azeroth has ever seen."
 second_war_news.3.a:0 "The skies belong to the Horde!"
 second_war_news.3.b:0 "This cannot be..."
 second_war_news.3.c:0 "Even the Dragonflights are not safe."

 # Phase 2: Naval War
 second_war_news.4.t:0 "The Sea of Blood"
 second_war_news.4.d:0 "The first naval clashes have erupted across the Great Sea. The islands between Khaz Modan and Lordaeron — Crestfall, Zul'Dare, Tol Barad — have become flashpoints in a maritime struggle that will determine who controls the waves. For the Horde, it is the path to victory. For the Alliance, it is the line that must hold."
 second_war_news.4.a:0 "Control the waves, control the war."
 second_war_news.4.b:0 "The Great Sea becomes a battlefield."

 second_war_news.5.t:0 "The Horde Fleet Sets Sail"
 second_war_news.5.d:0 "Hundreds of crude but deadly warships have departed the Wetlands, crammed with orcish warriors and siege engines. Warchief Doomhammer's armada sails north, bound for the shores of Lordaeron. The Alliance must prepare to meet an invasion by sea — something no strategist had anticipated."
 second_war_news.5.a:0 "To Lordaeron!"
 second_war_news.5.b:0 "They come by sea..."
 second_war_news.5.c:0 "The Horde has taken to the waves."

 second_war_news.6.t:0 "Horde Lands at Hillsbrad"
 second_war_news.6.d:0 "Despite the best efforts of Admiral Proudmoore's fleet — scattered by the arrival of enslaved red dragons — Doomhammer's forces have made landfall in the Hillsbrad Foothills. The invasion of Lordaeron has begun in earnest. The Alliance armies scramble to block the Horde's path to Capital City."
 second_war_news.6.a:0 "The soft lands of humans are now our battlefield."
 second_war_news.6.b:0 "The Horde has reached the heartlands."

 # Phase 3: Khaz Modan Sieges
 second_war_news.7.t:0 "Ironforge Under Siege"
 second_war_news.7.d:0 "The Horde has surrounded Ironforge. Every outer stronghold in Dun Morogh has fallen, leaving the dwarven capital isolated. King Magni Bronzebeard has rallied his people for a last stand within the mountain's ancient halls. The siege of Ironforge has begun."
 second_war_news.7.a:0 "Let them cower in their mountain."
 second_war_news.7.b:0 "The mountain will never fall."
 second_war_news.7.c:0 "The dwarves make their stand."

 second_war_news.8.t:0 "Ironforge Siege Reaches Breaking Point"
 second_war_news.8.d:0 "After months of relentless siege, the situation inside Ironforge has grown desperate. Food stores are dwindling, and the constant bombardment takes its toll. Yet King Magni's defiance remains unbroken — the dwarves would sooner see their halls collapse than surrender to the Horde."
 second_war_news.8.a:0 "Their stubbornness is admirable... and pointless."
 second_war_news.8.b:0 "We will endure."
 second_war_news.8.c:0 "How much longer can they hold?"

 second_war_news.9.t:0 "Gnomeregan Besieged"
 second_war_news.9.d:0 "Gnomish outposts have fallen one by one to the Horde advance, and the great iron gates of Gnomeregan now face direct assault. High Tinker Mekkatorque has mobilized every gear, gadget, and explosive in the city's arsenal. The siege of Gnomeregan begins."
 second_war_news.9.a:0 "The small ones have nowhere left to run."
 second_war_news.9.b:0 "We have inventions they have never dreamed of."
 second_war_news.9.c:0 "Gnomeregan holds the line."

 # Phase 4: Eastern Front
 second_war_news.10.t:0 "Zul'jin Rescued"
 second_war_news.10.d:0 "Horde raiders have stormed the prison camp near Durnholde Keep and freed Zul'jin, the legendary warlord of the Amani forest trolls. Captured by humans and held for years, the one-armed troll chieftain now stands beside Warchief Doomhammer, his vengeance burning bright."
 second_war_news.10.a:0 "Welcome, brother Zul'jin."
 second_war_news.10.b:0 "The troll warlord is free..."
 second_war_news.10.c:0 "An ancient enemy returns."

 second_war_news.11.t:0 "Amani Joins the Horde"
 second_war_news.11.d:0 "Zul'jin has pledged the Amani tribe — and through them, all forest trolls of the Eastern Kingdoms — to the Horde. In exchange, Doomhammer has sworn to help the Amani destroy their ancient enemies: the high elves of Quel'Thalas. The Horde now counts thousands of ferocious troll warriors among its ranks."
 second_war_news.11.a:0 "Together we shall crush the elves!"
 second_war_news.11.b:0 "The trolls rally to the Horde's banner..."
 second_war_news.11.c:0 "Ancient hatreds fuel new alliances."

 second_war_news.12.t:0 "Wildhammer Clan Joins the Alliance"
 second_war_news.12.d:0 "After the Horde's invasion of the Hinterlands threatened Aerie Peak itself, Thane Kurdran Wildhammer has pledged his clan's gryphon riders to the Alliance of Lordaeron. The fierce Wildhammer dwarves and their winged mounts will provide a crucial counter to the Horde's enslaved red dragons."
 second_war_news.12.a:0 "The skies are contested once more."
 second_war_news.12.b:0 "More dwarves to crush."
 second_war_news.12.c:0 "Gryphon riders join the war."

 # Phase 5: Thandol Span
 second_war_news.14.t:0 "Thandol Span Falls"
 second_war_news.14.d:0 "The Horde has seized the Thandol Span, the critical land bridge connecting Khaz Modan to the northern kingdoms. With this strategic chokepoint under orcish control, the Horde's supply lines to the south are secured — and the Alliance's path to liberate Khaz Modan is cut off."
 second_war_news.14.a:0 "The bridge is ours!"
 second_war_news.14.b:0 "The Span has fallen..."
 second_war_news.14.c:0 "A vital chokepoint is lost."

 second_war_news.15.t:0 "Thandol Span Recaptured"
 second_war_news.15.d:0 "Alliance forces have retaken the Thandol Span in a hard-fought assault, reopening the land route to Khaz Modan. With the bridge once more under Alliance control, the path south lies open — and the liberation of the dwarven and gnomish homelands can begin."
 second_war_news.15.a:0 "The road south is open."
 second_war_news.15.b:0 "The bridge is lost..."
 second_war_news.15.c:0 "The Alliance pushes south."

 # Phase 6: Quel'Thalas Front
 second_war_news.16.t:0 "Horde Invades Quel'Thalas"
 second_war_news.16.d:0 "Warchief Doomhammer, guided by his Amani allies, has driven his army north into the enchanted forests of Quel'Thalas. Thousands of forest trolls march alongside orcish warriors, their shared hatred of the high elves burning bright. The outer defenses of the elven kingdom have already fallen."
 second_war_news.16.a:0 "Burn their golden woods!"
 second_war_news.16.b:0 "They dare enter our sacred lands?"
 second_war_news.16.c:0 "War reaches the elven kingdom."

 second_war_news.17.t:0 "Quel'Thalas Mobilizes"
 second_war_news.17.d:0 "Ranger-Captain Alleria Windrunner has returned to Silvermoon, and her impassioned plea before the Convocation — combined with the Horde's invasion — has moved King Anasterian Sunstrider to action. Quel'Thalas now commits fully to the war. Elven rangers, magisters, and destroyers take the field alongside the Alliance for the first time in millennia."
 second_war_news.17.a:0 "Anar'alah belore! The ancient oath is honored."
 second_war_news.17.b:0 "Now the elves bring their full strength."
 second_war_news.17.c:0 "Quel'Thalas stands with the Alliance."

 second_war_news.18.t:0 "Eversong Woods Ablaze"
 second_war_news.18.d:0 "Red dragons, now fully broken to the Dragonmaw clan's will, have descended upon Quel'Thalas. Their fiery breath has set the ancient Eversong Woods alight, and a firestorm now engulfs the elven homeland. The sky above Quel'Thalas glows orange, smoke blotting out the sun."
 second_war_news.18.a:0 "Let their pretty forests burn!"
 second_war_news.18.b:0 "Our homeland... in flames..."
 second_war_news.18.c:0 "Dragons set the elven woods aflame."

 second_war_news.19.t:0 "The Sunwell Shield Rises"
 second_war_news.19.d:0 "As the Horde and its dragons closed on Silvermoon City, the high elven magisters drew upon the sacred Sunwell's boundless energy. A colossal magical barrier now envelops the capital. Dragon fire and siege engines alike shatter against it. Quel'Thalas's heart will not fall this day."
 second_war_news.19.a:0 "The Sunwell protects us."
 second_war_news.19.b:0 "Their magic shields them. For now."
 second_war_news.19.c:0 "Silvermoon stands behind its arcane wall."

 # Phase 7: Betrayals
 second_war_news.20.t:0 "Gul'dan Abandons the Horde"
 second_war_news.20.d:0 "At the critical moment, Gul'dan and his Stormreaver clan — along with Cho'gall's Twilight's Hammer — have deserted the Horde. The warlock has taken a portion of the fleet and sailed west, obsessed with finding the fabled Tomb of Sargeras. Doomhammer's northern campaign has been dealt a blow from within."
 second_war_news.20.a:0 "TRAITORS! They will pay in blood!"
 second_war_news.20.b:0 "Power awaits..."
 second_war_news.20.c:0 "The Horde fractures from within."
 second_war_news.20.d:0 "Gul'dan's ambition knows no loyalty."

 second_war_news.21.t:0 "Gul'dan Perishes at the Tomb of Sargeras"
 second_war_news.21.d:0 "Gul'dan's quest for ultimate power has ended in the only way it could. The warlock reached the Tomb of Sargeras — and was torn apart by the demonic guardians within. His followers were slaughtered by the Black Tooth Grin clan, sent by Doomhammer to exact revenge. The architect of the Horde's corruption is dead."
 second_war_news.21.a:0 "A fitting end for the traitor."
 second_war_news.21.b:0 "The warlock's ambition consumed him..."
 second_war_news.21.c:0 "The monster destroys itself."
 second_war_news.21.d:0 "Gul'dan meets his end."

 second_war_news.22.t:0 "Alterac Betrays the Alliance"
 second_war_news.22.d:0 "King Aiden Perenolde of Alterac, convinced that the Horde is unstoppable, has committed high treason. In exchange for a promise that his kingdom be spared, Perenolde has granted Warchief Doomhammer safe passage through the Alterac Mountains — bypassing every defensive line and putting Capital City directly in the Horde's path."
 second_war_news.22.a:0 "A wise king knows when to kneel."
 second_war_news.22.b:0 "We had no choice..."
 second_war_news.22.c:0 "Perenolde will answer for this treachery!"
 second_war_news.22.d:0 "A kingdom betrays its own."

 second_war_news.23.t:0 "Alterac Occupied"
 second_war_news.23.d:0 "The Alliance has discovered King Perenolde's treason. Forces from Stromgarde, led by King Thoras Trollbane himself, have seized Alterac and its mountain passes. Perenolde has been deposed, and the kingdom placed under military occupation. The Horde's backdoor to Capital City is slammed shut."
 second_war_news.23.a:0 "Justice is served."
 second_war_news.23.b:0 "We are undone..."
 second_war_news.23.c:0 "Alterac pays the price of betrayal."

 # Phase 8: Siege of Capital City
 second_war_news.24.t:0 "The Siege of Capital City"
 second_war_news.24.d:0 "Warchief Doomhammer's army has reached the outskirts of Capital City. Siege engines bombard the ancient walls while death knights and ogre magi prepare for the final assault. King Terenas Menethil II has taken personal command of the city's defense, rallying citizens and soldiers alike. The fate of Lordaeron — and perhaps all humanity — will be decided here."
 second_war_news.24.a:0 "The human capital will fall!"
 second_war_news.24.b:0 "Lordaeron stands!"
 second_war_news.24.c:0 "The Horde is at the gates of Capital City."

 second_war_news.25.t:0 "Capital City Saved"
 second_war_news.25.d:0 "The siege of Capital City has been broken. With the news of Gul'dan's betrayal reaching Doomhammer — and Alliance reinforcements arriving from the east under Turalyon — the Warchief has ordered a full retreat. Lordaeron's capital stands, battered but unbroken. The tide of the war has turned."
 second_war_news.25.a:0 "Lordaeron endures!"
 second_war_news.25.b:0 "Victory slips through our fingers..."
 second_war_news.25.c:0 "The Alliance holds the line."

 # Phase 9: Retreat + Naval Final
 second_war_news.26.t:0 "Khaz Modan Liberated"
 second_war_news.26.d:0 "As the Horde retreats south, the Alliance has liberated Khaz Modan. The sieges of Ironforge and Gnomeregan have been lifted at last. Dwarven and gnomish armies now emerge from their mountain strongholds, eager to join the pursuit. Fresh forces swell the Alliance ranks as the Horde's retreat turns into a rout."
 second_war_news.26.a:0 "The mountain is free!"
 second_war_news.26.b:0 "Gnomeregan stands!"
 second_war_news.26.c:0 "The dwarves and gnomes rejoin the fight."
 second_war_news.26.d:0 "Khaz Modan slips from our grasp."
 second_war_news.26.e:0 "Siege lines are broken."

 second_war_news.27.t:0 "The Battle of Crestfall"
 second_war_news.27.d:0 "Admiral Daelin Proudmoore's fleet has intercepted the fleeing Horde armada near Crestfall. In the ensuing battle, Alliance ships — supported by Wildhammer gryphon riders —virtually annihilated the orcish fleet. But the victory came at a terrible cost: Derek Proudmoore, the Admiral's eldest son, was killed by dragon fire."
 second_war_news.27.a:0 "My son... my boy..."
 second_war_news.27.b:0 "The sea has betrayed us."
 second_war_news.27.c:0 "Naval supremacy secured at bitter cost."

 # Phase 10: Draenor Clans
 second_war_news.28.t:0 "Warsong Clan Arrives from Draenor"
 second_war_news.28.d:0 "The Warsong Clan, led by the legendary Grommash Hellscream, has crossed the Dark Portal to reinforce the Horde. Fierce wolf riders and berserkers now rally to Doomhammer's banner — a surge of fresh fury when the Horde needs it most."
 second_war_news.28.a:0 "Grom Hellscream answers the call!"
 second_war_news.28.b:0 "Reinforcements from beyond the Portal..."
 second_war_news.28.c:0 "A new clan enters the war."

 second_war_news.29.t:0 "Shadowmoon Clan Arrives from Draenor"
 second_war_news.29.d:0 "The Shadowmoon Clan, under the elder shaman Ner'zhul, has answered Doomhammer's summons. Their necrolytes and spirit-talkers bring dark powers from Draenor — powers that will bolster the Horde's magical arsenal in its darkest hour."
 second_war_news.29.a:0 "Ner'zhul's wisdom is ours."
 second_war_news.29.b:0 "Dark shamans join the fray..."
 second_war_news.29.c:0 "Shadowmoon marches to war."

 second_war_news.30.t:0 "Shattered Hand Clan Arrives from Draenor"
 second_war_news.30.d:0 "Kargath Bladefist, chieftain of the Shattered Hand, has led his gladiators through the Dark Portal. These brutal warriors, each having sacrificed a hand for a blade, are among the most savage the Horde can field."
 second_war_news.30.a:0 "Kargath brings the arena to Azeroth."
 second_war_news.30.b:0 "More savages pour through..."
 second_war_news.30.c:0 "The Shattered Hand joins the Horde."

 second_war_news.31.t:0 "Thunderlord Clan Arrives from Draenor"
 second_war_news.31.d:0 "The Thunderlord Clan, led by Fenris Wolfbrother, has crossed the Dark Portal. Masters of the hunt and the wolf, these orcs bring swift cavalry and relentless trackers to Doomhammer's cause."
 second_war_news.31.a:0 "The Thunderlords ride with us."
 second_war_news.31.b:0 "Wolf riders from another world..."
 second_war_news.31.c:0 "Thunderlord wolves join the war."

 second_war_news.32.t:0 "Laughing Skull Clan Arrives from Draenor"
 second_war_news.32.d:0 "The Laughing Skull Clan, led by the unpredictable Mogor, has arrived from Draenor. Though erratic and barely controllable, these berserkers fight with a frenzy that even other orcs find unsettling."
 second_war_news.32.a:0 "Even mad dogs have their use."
 second_war_news.32.b:0 "Mad orcs from the dying world..."
 second_war_news.32.c:0 "The Laughing Skull enters the fray."

 second_war_news.33.t:0 "Bonechewer Clan Arrives from Draenor"
 second_war_news.33.d:0 "The Bonechewer Clan, under Hurkan Skullsplinter, has answered the Warchief's call. Cannibalistic and utterly ruthless, these orcs will stop at nothing to feast upon the Alliance."
 second_war_news.33.a:0 "Let them taste our hunger."
 second_war_news.33.b:0 "Cannibals from beyond the Dark Portal..."
 second_war_news.33.c:0 "Bonechewers join the Horde."

 # Phase 11: Final
 second_war_news.34.t:0 "Anduin Lothar Has Fallen"
 second_war_news.34.d:0 "At the Battle of Blackrock Mountain, Supreme Commander Anduin Lothar met Warchief Orgrim Doomhammer in single combat. Though Lothar fought valiantly, the Doomhammer shattered his greatsword and crushed the Lion of Stormwind's skull. The Alliance has lost its greatest hero. But in that moment of despair, the paladin Turalyon took up Lothar's broken blade and rallied the armies to victory."
 second_war_news.34.a:0 "Our Regent... our hero..."
 second_war_news.34.b:0 "Lothar... no..."
 second_war_news.34.c:0 "The human champion is dead."
 second_war_news.34.d:0 "The Lion of Stormwind falls."

 second_war_news.35.t:0 "Battle of Blackrock Mountain"
 second_war_news.35.d:0 "The decisive battle of the Second War has been joined at Blackrock Mountain. The full might of the Alliance crashes against the remnants of the Horde in the shadow of the great spire. Turalyon leads where Lothar fell, and the Horde's last stand crumbles. Orgrim Doomhammer is captured; the Orcish Horde is shattered."
 second_war_news.35.a:0 "For Lothar! For the Alliance!"
 second_war_news.35.b:0 "The Horde... broken..."
 second_war_news.35.c:0 "The climactic battle has been fought."

 second_war_news.36.t:0 "The Dark Portal Destroyed"
 second_war_news.36.d:0 "At the edge of the Blasted Lands, Archmage Khadgar and the Kirin Tor have performed the ultimate act of the war. Channeling immense arcane power, they have ripped apart the Dark Portal — the gateway to Draenor. The stone frame crumbled to dust in a blinding explosion. The path between worlds is sealed. The Second War is over."
 second_war_news.36.a:0 "Azeroth is safe."
 second_war_news.36.b:0 "The way home... is gone."
 second_war_news.36.c:0 "The Portal is no more."

 second_war_news.37.t:0 "The Second War Ends — Alliance Victorious"
 second_war_news.37.d:0 "After a brutal conflict spanning the entire continent, the Alliance of Lordaeron has emerged victorious. The Horde is shattered, its Warchief in chains, its portal destroyed. From the ruins of Stormwind to the forests of Quel'Thalas, the peoples of Azeroth celebrate peace. But the cost has been immeasurable, and the scars of war will take generations to heal."
 second_war_news.37.a:0 "Victory! For the Alliance!"
 second_war_news.37.b:0 "Defeat..."
 second_war_news.37.c:0 "The Second War is over."

 second_war_news.38.t:0 "Orc Internment Camps Established"
 second_war_news.38.d:0 "In the aftermath of the war, the Alliance has chosen mercy over annihilation. Captured orcs are being rounded up and placed in internment camps across Lordaeron, funded by the Alliance Internment Act. The Kirin Tor eagerly studies their strange magics. The Horde is contained — for now."
 second_war_news.38.a:0 "Mercy is what separates us from beasts."
 second_war_news.38.b:0 "Chains... for the Horde..."
 second_war_news.38.c:0 "The orcs are caged."
