#events
###############################
 tomb_guardians.1.t:0 "Ripples of Fel Magic"
 tomb_guardians.1.d:0 "A wave of immensely potent fel magic has surged throughout the world, emanating from the southern regions of the Eastern Kingdoms. As the sole wielder of such immense power, your son, Medivh, stands out as the only individual with the ability to conjure such destruction. This points to one irrefutable fact, that he has forged an alliance with the Burning Legion."
 tomb_guardians.1.option.1:0 "Medivh must be stopped"
 tomb_guardians.2.t:0 "In Need of Allies"
 tomb_guardians.2.d.1:0 "With the powers of the guardian bestowed upon Medivh and aided by the vast resources of the Legion, Aegwynn found herself unable to defeat him alone. After much consideration, she identified three potential allies: her old friend, the blue Dragon Arcanagos; King Llane and Anduin Lothar, Medivhs closest friends; or a reconvening of the Council of Tirisfal. Ultimately, Aegwynn placed her trust in..."
 tomb_guardians.2.d.2:0 "As I stand in front of the towering walls of Stormwind, frustration and disappointment flood my thoughts. My plea for help has been rejected, and I am left with only two potential allies to aid me in my quest to confront Medivh: the blue Dragon, Arcanagos, and the Council of Tirisfal."
 tomb_guardians.2.d.3:0 "As I stand outside the magnificent Violet Citadel in Dalaran, frustration and disappointment flood my thoughts. My plea for help has been rejected, and I am left with only two potential allies to aid me in my quest to to confront Medivh: the blue Dragon, Arcanagos, and the Kingdom of Stormwind."
 tomb_guardians.2.d.4:0 "Years of secrecy and seclusion have left me with little influence in the world. Despite my best efforts, both King Llane and the Council of Tirisfal have dismissed my pleas for aid, believing me to be delusional. Now, all I can do is pray that my old friend Arcanagos will answer the call, and that my time wasted in both Dalaran and Stormwind will not prevent us from stopping Medivh."
 tomb_guardians.2.option.1:0 "An old Friend"
 tomb_guardians.2.option.2:0 "Those who care for him most"
 tomb_guardians.2.option.3:0 "Reconvene with the Council"
 tomb_guardians.3.t:0 "An old Friend"
 tomb_guardians.3.d:0 "For centuries, the Guardian Aegwynn fought and vanquished countless demons on Azeroth, often with the aid of our dragonflight. Among all of us, Arcanagos has been the most instrumental in her battles. Now, Aegwynn has journeyed to the Nexus seeking to confront a formidable demon that she believes has emerged in the Eastern Kingdoms. Once again, she has specifically requested the aid of Arcanagos in this endeavor."
 tomb_guardians.3.option.1:0 "We shall help our old friend"
 tomb_guardians.4.t:0 "Arcanagos has come to my aid"
 tomb_guardians.4.d:0 "As expected, my loyal friend Arcanagos has answered my call for aid and will accompany me to Kharazhan to confront my son. It is our fervent hope that we can sway him from his allegiance to the Legion before it is too late."
 tomb_guardians.4.option.1:0 "To Kharazhan!"
 tomb_guardians.5.t:0 "An audience with Aegwynn"
 tomb_guardians.5.d:0 "Magna Aegwynn, mother of Medivh and the former Guardian of Tirisfal, has graced our court with her presence today. She has voiced her concerns over the sudden burst of fel magic detected by our mages earlier this month. According to her, she faced the Demon Lord Sargeras in Northrend centuries ago and only then had she encountered fel magic of such magnitude. She suspects Medivh, her son, to be involved in this event and fears that he may have allied himself with the Legion. As his closest friends, she urges us to join forces with her and confront Medivh in Kharazhan."
 tomb_guardians.5.option.1:0 "Send Lothar to Kharazhan"
 tomb_guardians.5.option.2:0 "Medivh is a loyal friend, send her away."
 tomb_guardians.6.t:0 "Stormwind has come to my aid"
 tomb_guardians.6.d:0 "King Llane has answered my call for aid, and will send Anduin Lothar and a battalion of Footman to accompany me to Kharazhan to confront my son. It is our fervent hope that we can sway him from his allegiance to the Legion before it is too late.""
 tomb_guardians.6.option.1:0 "To Kharazhan!"
 tomb_guardians.7.t:0 "An audience with Aegwynn"
 tomb_guardians.7.d:0 "Magna Aegwynn, mother of Medivh and the former Guardian of Tirisfal, has graced our court with her presence today. She has voiced her concerns over the sudden burst of fel magic detected by our mages earlier this month. According to her, she faced the Demon Lord Sargeras in Northrend centuries ago and only then had she encountered fel magic of such magnitude. She suspects Medivh, her son, to be involved in this event and fears that he may have allied himself with the Legion. As his closest friends, she urges us to join forces with her and confront Medivh in Kharazhan."
 tomb_guardians.7.option.1:0 "Medivh must be stooped"
 tomb_guardians.7.option.2:0 "Aegwynn can’t be trusted"
 tomb_guardians.8.t:0 "The Council of Tirisfal has come to my aid"
 tomb_guardians.8.d:0 "After much bickering and heated debate, the Council of Tirisfal has finally agreed to accompany me on my journey to Kharazhan. My fervent hope is that we can convince Medivh to abandon his allegiance to the Legion and willingly surrender his powers to the council."
 tomb_guardians.8.option.1:0 "To Kharazhan!"

