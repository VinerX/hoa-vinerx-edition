TMB_eternal_watchers:0 "Eternal Watchers"
TMB_eternal_watchers:0 "For centuries, Aegwynn had poured the powers of the guardian into various traps, seals, and living manifestations of arcane magic within the Tomb of Sargeras. With the sole purpose to prevent anyone on Azeroth from entering the tomb."
###############################
#focus tree
###############################
TMB_ripples_of_fel_magic:0 "Ripples of Fel Magic"
TMB_ripples_of_fel_magic_desc:0 "I have sensed an immense explosion of fel energy, unlike any I have felt since my victory over Sargeras in Northrend many years ago. It is imperative that I investigate the cause."
TMB_in_need_of_allies:0 "In Need of Allies"
TMB_in_need_of_allies_desc:0 "After ceding most of my power to Medivh, I am not strong enough to confront him alone. Therefore, I must seek allies who can assist me in defeating him."
TMB_confrontation_in_kharazhan:0 "Confrontation in Kharazhan"
TMB_confrontation_in_kharazhan_desc:0 "Now that my allies are assembled, we must confront my son in Kharazhan. Our only hope is that it is not too late to rescue him from the clutches of the Legion."
TMB_a_old_friend:0 "A Old Friend"
TMB_a_old_friend_desc:0 "During the Dragon Hunt many years ago, I formed a strong bond with Arcanagos, a powerful blue dragon. He has aided me in defeating numerous demons throughout the years, and I am confident that I can rely on him to join me in confronting Medivh."
TMB_exiled_to_kalimdor:0 "Exiled to Kalimdor"
TMB_exiled_to_kalimdor_desc:0 "Exiled to Kalimdor"
TMB_return_to_the_tomb:0 "Return to the Tomb"
TMB_return_to_the_tomb_desc:0 "Return to the Tomb"

TMB_those_who_care_for_him_the_most:0 "Those who Care for him Most"
TMB_those_who_care_for_him_the_most_desc:0 "Those who Care for him Most"
TMB_reconvene_with_the_council:0 "Reconvene with the Council"
TMB_reconvene_with_the_council_desc:0 "Reconvene with the Council"
