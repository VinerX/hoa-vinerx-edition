l_english:
 # Focus titles
 KUL_sw_daelins_call:0 "Daelin's Call to Arms"
 KUL_sw_daelins_call_desc:0 "News of Stormwind's fall has reached Boralus. Lord Admiral Daelin Proudmoore, close friend of Anduin Lothar, will not stand idle while the Orcish Horde threatens humanity. The fleet must be prepared for war."

 KUL_sw_proudmoore_legacy:0 "The Proudmoore Legacy"
 KUL_sw_proudmoore_legacy_desc:0 "The Proudmoore name commands respect across the seas of Azeroth. Daelin rallies the great houses of Kul Tiras — Stormsong, Waycrest, Ashvane — to unite behind the Admiralty's cause. His son Derek stands ready to prove himself, while young Jaina hones her talents in distant Dalaran."

 KUL_sw_naval_supremacy:0 "Naval Supremacy"
 KUL_sw_naval_supremacy_desc:0 "Kul Tiras commands the largest and most modern navy in the known world. By refining our doctrine and embracing new ship designs, we will ensure the Horde's crude fleet never challenges our dominance of the waves."

 KUL_sw_coastal_fortifications:0 "Coastal Fortifications"
 KUL_sw_coastal_fortifications_desc:0 "The islands of Kul Tiras are a natural fortress, but even the greatest fleet cannot be everywhere at once. Coastal batteries, watchtowers, and fortified harbors will turn our shores into a death trap for any Horde raiders."

 KUL_sw_alliance_naval_council:0 "Alliance Naval Council"
 KUL_sw_alliance_naval_council_desc:0 "Daelin Proudmoore travels to Lordaeron to address the gathered kings. He offers the full might of the Kul Tiran fleet to the Alliance cause. In return, the Grand Alliance Fleet will be born — a combined armada capable of blockading the Horde and protecting supply lines across the Great Sea."

 KUL_sw_jainas_studies:0 "Jaina's Studies"
 KUL_sw_jainas_studies_desc:0 "Daelin's youngest daughter Jaina studies at the Kirin Tor in Dalaran, showing remarkable aptitude for arcane magic. While the fleet fights at sea, Jaina's magical knowledge could provide crucial support — from weather manipulation to arcane ship defenses."

 KUL_sw_stormsong_shipyards:0 "Stormsong Shipyards"
 KUL_sw_stormsong_shipyards_desc:0 "House Stormsong has built Kul Tiras's fleet for generations. By expanding the shipyards and commissioning new drydocks, we can produce warships faster than the Horde can sink them. The sea will become our factory."

 KUL_sw_tidesage_blessings:0 "Tidesage Blessings"
 KUL_sw_tidesage_blessings_desc:0 "The Tidesages of House Stormsong guide our ships with an ancient understanding of wind and wave. Their blessings grant our fleet unmatched speed and navigation — and their mastery of the deep can be turned into a weapon against the enemy."

 KUL_sw_the_orcish_armada:0 "The Orcish Armada"
 KUL_sw_the_orcish_armada_desc:0 "Reports from Khaz Modan confirm our worst fears: the Horde has been building a fleet. Goblin shipwrights and enslaved engineers have constructed crude but dangerous warships. We must learn everything we can about this enemy fleet before it threatens our waters."

 KUL_sw_shipborne_defenses:0 "Shipborne Defenses"
 KUL_sw_shipborne_defenses_desc:0 "Standard warship designs offer little protection against aerial threats. With rumors of flying beasts in the Horde's arsenal, we must retrofit our vessels with anti-air ballistae, reinforced deck armor, and rapid-response fire crews."

 KUL_sw_grand_alliance_fleet:0 "The Grand Alliance Fleet"
 KUL_sw_grand_alliance_fleet_desc:0 "With the Alliance naval forces coordinated under one command, the Grand Alliance Fleet becomes the dominant force on the seas. Combined operations between Kul Tiran warships, Lordaeronian transports, and allied support vessels will choke the Horde's supply lines."

 KUL_sw_dalaran_magical_aid:0 "Dalaran's Magical Aid"
 KUL_sw_dalaran_magical_aid_desc:0 "Jaina's connections with the Kirin Tor bear fruit. Dalaran dispatches battle mages to serve aboard our warships, providing arcane barriers against enemy projectiles and magical artillery to supplement our cannons. The Horde will face fire from above and below the waves."

 KUL_sw_the_proudmoore_bulwark:0 "The Proudmoore Bulwark"
 KUL_sw_the_proudmoore_bulwark_desc:0 "Commission the finest battleships ever to sail the Great Sea. These floating fortresses — bristling with cannons and reinforced with enchanted ironwood — will form an unbreakable line between the Horde and the shores of the Eastern Kingdoms."

 KUL_sw_convoy_raiders:0 "Convoy Raiders"
 KUL_sw_convoy_raiders_desc:0 "The Horde's war machine runs on supplies shipped across the sea from their captured ports. A dedicated force of fast attack ships and submersibles will hunt Horde supply convoys, starving their armies of equipment and reinforcements."

 KUL_sw_dragonfire_crisis:0 "The Dragonfire Crisis"
 KUL_sw_dragonfire_crisis_desc:0 "The Horde has unleashed a nightmare upon our fleet — enslaved red dragons, their fiery breath reducing proud warships to burning wrecks in minutes. Our sailors speak of skies turning red and the sea itself boiling. We must find a way to counter this terror before morale collapses entirely."

 KUL_sw_fleet_blockade:0 "Fleet Blockade"
 KUL_sw_fleet_blockade_desc:0 "The time has come to take the war to the Horde's doorstep. The Grand Alliance Fleet will establish a naval blockade of Horde-held ports, cutting off their forces in Khaz Modan from reinforcements and choking their war economy. Let them feel what it means to be trapped."

 KUL_sw_gryphon_wing:0 "Gryphon Wing"
 KUL_sw_gryphon_wing_desc:0 "The Wildhammer dwarves of Aerie Peak have long befriended gryphons — fierce flying beasts that can match a dragon in the air. By establishing a gryphon wing aboard our ships, we can intercept Horde dragons before they rain fire on our fleet."

 KUL_sw_tiran_marine_corps:0 "Tiran Marine Corps"
 KUL_sw_tiran_marine_corps_desc:0 "A fleet wins battles — but marines win wars. We will train a dedicated amphibious assault force capable of striking Horde coastal positions, raiding their ports, and securing beachheads for Alliance armies. The sea is our highway to victory."

 KUL_sw_dereks_fate:0 "Derek's Fate"
 KUL_sw_dereks_fate_desc:0 "Derek Proudmoore, eldest son of the Lord Admiral, leads his squadron into battle against the Horde fleet. The engagement is fierce — orcish juggernauts, goblin sappers, and the dreaded red dragons all join the fray. The sea will claim one of House Proudmoore this day."

 KUL_sw_dealins_grief:0 "Daelin's Grief"
 KUL_sw_dealins_grief_desc:0 "The news reaches Boralus like a cannonball to the chest: Derek is dead. His ship, the Proudmoore's Vengeance, was the first to burn when the red dragons struck. The Lord Admiral retreats to his quarters for three days. When he emerges, his eyes hold a cold fire that will never be extinguished."

 KUL_sw_revenge_of_the_admiral:0 "Revenge of the Admiral"
 KUL_sw_revenge_of_the_admiral_desc:0 "Daelin Proudmoore will never forgive. Every orcish sail on the horizon is an insult to his son's memory. Every greenskin that draws breath is a debt unpaid. The Lord Admiral's war is no longer about strategy or Alliance politics — it is personal. It is vengeance."

 KUL_sw_internment_camps_support:0 "Support the Internment Camps"
 KUL_sw_internment_camps_support_desc:0 "When the war finally ends, Daelin Proudmoore is the loudest voice arguing against mercy. Orcs are not prisoners of war — they are monsters that must be caged forever. Kul Tiras provides funding, ships to transport prisoners, and a voice at the Alliance council demanding that no orc ever walk free again."

 KUL_sw_naval_dominance:0 "Command of the Seas"
 KUL_sw_naval_dominance_desc:0 "With the blockade choking the Horde, marine raids disrupting their coastal positions, and our fleets hunting down every enemy vessel, the seas truly belong to Kul Tiras. Let the Horde cower on land — the waves are ours, and they always will be."

 # Ideas
 KUL_sw_proudmoore_legacy_idea:0 "United Behind the Admiralty"
 KUL_sw_proudmoore_legacy_idea_desc:0 "The great houses of Kul Tiras have set aside their rivalries to serve the Admiralty. The nation stands united against the Horde threat."

 KUL_sw_stormsong_shipyards_idea:0 "Expanded Stormsong Shipyards"
 KUL_sw_stormsong_shipyards_idea_desc:0 "The shipyards of House Stormsong are working at full capacity, churning out warships to replace losses and expand the fleet."

 KUL_sw_tidesage_blessings_idea:0 "Tidesage Navigators"
 KUL_sw_tidesage_blessings_idea_desc:0 "Tidesages serve aboard every major warship, guiding them with uncanny precision through storms and shallows alike."

 KUL_sw_shipborne_aa_idea:0 "Shipborne Ballistae"
 KUL_sw_shipborne_aa_idea_desc:0 "Our warships have been retrofitted with specialized anti-air ballistae and rapid-response fire crews to counter aerial threats."

 KUL_sw_tiran_marines_idea:0 "Tiran Marines"
 KUL_sw_tiran_marines_idea_desc:0 "An elite amphibious assault force trained to strike from the sea with devastating effect. The beaches of the Horde will run red."

 KUL_sw_dealins_grief_idea:0 "Daelin's Grief"
 KUL_sw_dealins_grief_idea_desc:0 "The death of Derek Proudmoore has left a void in the Lord Admiral's heart that nothing can fill — except vengeance."

 KUL_sw_dealins_rage_idea:0 "Daelin's Rage"
 KUL_sw_dealins_rage_idea_desc:0 "The Lord Admiral fights with reckless fury, heedless of danger. His hatred of the Horde burns hotter than any dragon's fire."

 KUL_sw_dragonfire_emergency_idea:0 "Dragonfire Emergency"
 KUL_sw_dragonfire_emergency_idea_desc:0 "Red dragon attacks are devastating our fleet. Emergency countermeasures are being deployed, but every day brings fresh losses."

 KUL_sw_dealins_obsession_idea:0 "Daelin's Obsession"
 KUL_sw_dealins_obsession_idea_desc:0 "The war may be over, but Daelin Proudmoore's hatred of orcs has become an all-consuming obsession. He sees enemies in every shadow and demands eternal vigilance against the greenskin menace."

 KUL_sw_naval_dominance_idea:0 "Mistress of the Seas"
 KUL_sw_naval_dominance_idea_desc:0 "No fleet in the known world can challenge Kul Tiras. The Great Sea is our domain, and all who sail it do so at our pleasure."

 KUL_sw_supply_blockade:0 "Alliance Naval Blockade"
 KUL_sw_supply_blockade_desc:0 "The Grand Alliance Fleet has blockaded our ports. Supplies are running thin and reinforcements cannot reach us by sea."

 # Events
 kultiras_second_war.1.t:0 "The Alliance Naval Council"
 kultiras_second_war.1.d:0 "The great hall of Lordaeron fills with the voices of kings and generals. Daelin Proudmoore rises to speak, his voice carrying the weight of the sea itself. 'The Horde thinks they can take our lands and burn our cities. But they forget — they crossed the sea to get here. And the sea belongs to Kul Tiras.' He offers every warship, every sailor, and every cannon to the Alliance cause. The Grand Alliance Fleet is born this day."
 kultiras_second_war.1.option.1:0 "For the Alliance! For the Seas!"

 kultiras_second_war.2.t:0 "The Battle of the Red Sky"
 kultiras_second_war.2.d:0 "The battle was going well — our ships outmaneuvered the orcish juggernauts, our cannons tore through their crude armor. Then the sky turned red. Dragons descended upon the fleet, their flames consuming ship after ship. Derek Proudmoore's squadron was the first hit. His flagship, the Proudmoore's Vengeance, burned from bow to stern. No survivors were found. The Lord Admiral watched his son die through a spyglass, powerless to help. The sea took Derek Proudmoore this day, and something broke in Daelin that will never be mended."
 kultiras_second_war.2.option.1:0 "My son... my boy..."

 kultiras_second_war.3.t:0 "Dragons Over the Fleet"
 kultiras_second_war.3.d:0 "Admiralty reports confirm the worst: the Dragonmaw Clan has enslaved red dragons and is using them as living weapons against our fleet. Ships that took months to build are reduced to cinders in minutes. Our sailors have begun calling the sight 'the red dawn' — because it looks like the sunrise, but it brings only death. Emergency measures are needed before the entire fleet is lost to dragonfire."
 kultiras_second_war.3.option.1:0 "We will find a way to fight fire with fire."

 kultiras_second_war.4.t:0 "A Bitter Peace"
 kultiras_second_war.4.d:0 "The war is won, but Daelin Proudmoore finds no peace. Every time he closes his eyes he sees Derek's ship burning. He sees orcish hands at the helm of dragon-riding slavers. He sees a future where the greenskins rise again and finish what they started. The other Alliance leaders speak of peace and rebuilding. Daelin speaks of extermination. 'There can be no true peace while a single orc draws breath,' he declares at the victory council. The Lord Admiral's obsession has begun — and it will one day cost him everything."
 kultiras_second_war.4.option.1:0 "Never forgive. Never forget."
