POLITICS_KURDRAN_WILDHAMMER_DESC:0 "Thane of the Wildhammer clan, Kurdran is a fierce warrior and a master of gryphon riding. When the Horde invaded Khaz Modan, the Wildhammers answered the call of their dwarven kin. Kurdran himself led the gryphon riders into battle, their winged steeds darkening the skies above the burning fields of Lordaeron. Brave to a fault and loyal to his people, he represents the unyielding spirit of the Northeron highlands."

