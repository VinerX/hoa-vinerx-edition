RDF_Wyrmcrest_Accord:0 "The Wyrmcrest Accord"
RDF_Wyrmcrest_Accord_desc:0 "The Kirin Tor of Dalaran and Dragon Aspects have united to bring down Malycgos and the Blue Dragonflight after they began the Nexus War."

RDF_only_chared_remains:0 "Only Charred Remains"
RDF_only_chared_remains_desc:0 "The Dragon Queen has Commanded the eradication of all Orcs from the face of Azeroth.\n §YThe Red Dragonflight gains a 10% Attack Bonus against all Orc Nations§!"

