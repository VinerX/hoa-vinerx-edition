#events
###############################
steamwheedle.1.t:0 "Offer from the Horde"
steamwheedle.1.d:0 "Boss, this new race called Orcs has destroyed the Kingdom of Stormwind and is offering us the sum of its treasury in order to provide them with ships and other technology to fight the Humans, and Dwarven Kingdoms. We wouldn’t be doing much fighting ourselves and the immense payment would be enough to upgrade are docks in both Kezan and Booty Bay."
steamwheedle.1.option.1:0 "Accept the deal."
steamwheedle.1.option.2:0 "We can get a better deal elsewhere."

steamwheedle.2.t:0 "Invitation to the Kezan Trade Coalition"
steamwheedle.2.d:0 "Boss, the Steamwheedle want us to form some form of mega cartel, their offering profit sharing incentives...there is also a footnote that they have other incentives if we dont agree to their contact."
steamwheedle.2.option.1:0 "Sweet Sweet Profit"
steamwheedle.2.option.2:0 "Other incentives you say?"

steamwheedle.3.t:0 "Capture the Bay"
steamwheedle.3.d:0 "Boss, the landing was a success. We just sailed up and took it; them trolls don't know what hit em!"
steamwheedle.3.option.1:0 "Found Steamwheedle Port"

steamwheedle.4.t:0 "A New Trade Company"
steamwheedle.4.d:0 "Boss, we got a patch of desert with our name written all over it, well yours specifically Boss, we already got some boys over there working on plan."
steamwheedle.4.option.1:0 "Puppet Gadgetzan"
#steamwheedle.4.option.2:0 "Play as Gadgetzan"

steamwheedle.5.t:0 "Farraki Envoy"
steamwheedle.5.d:0 "An envoy from the Farraki Trolls has arrived in Steamwheedle port. He claims that this land and all of Tanaris belong to his Tribe and that we are trespassing in their lands. He demands to know why we are here and what are goals in the region are. We can offer to purchase Steamwheedle port and other lands, or we could simply dispose of this envoy, but this will surely lead to war."
steamwheedle.5.t:0 "Farraki Envoy"
steamwheedle.5.option.1:0 "Offer to purchase the Land"
steamwheedle.5.option.2:0 "Kill the envoy"

steamwheedle.6.t:0 "Farraki Accepts"
steamwheedle.6.d:0 "In a mutually beneficial agreement, the Farraki have consented to sell us the lands. It's time to start colonizing our newly acquired territory and establishing essential industries to make Tanaris habitable."
steamwheedle.6.option.1:0 "They Wont Regret it."

steamwheedle.7.t:0 "Farraki Decline"
steamwheedle.7.d:0 "The Farraki have rejected our offer and are preparing to remove us from Tanaris. While this situation is far from ideal, we might consider maximizing our profits by selling our captives as slaves once we defeat them."
steamwheedle.7.option.1:0 "Prepare for War"

steamwheedle.8.t:0 "Auction Captaincies"
steamwheedle.8.d:0 "Our captaincies will be auctioned to the highest bidder. Following a fierce bidding contest, the winning captain has proposed to expand our..."
steamwheedle.8.option.1:0 "Trade Fleet"
steamwheedle.8.option.2:0 "War Fleet"

steamwheedle.9.t:0 "The Home Market"
steamwheedle.9.d:0 ""
steamwheedle.9.option.1:0 "The Third Trade War"
steamwheedle.9.option.2:0 "The Peace War"

steamwheedle.10.t:0 "Hostile Takeover"
steamwheedle.10.d:0 "Boss Steamwheedles bought out half the bruisers and most of the boys, their saying we can either liquidate the Union, or they are gonna liquidate us."
steamwheedle.10.option.1:0 "Hmm, interesting"
steamwheedle.10.option.2:0 "I'm not gettin' paid enough for this"

steamwheedle.11.t:0 "The Bank Run"
steamwheedle.11.d:0 "Boss, Bombs just went off down at the vault, they said its taken out a lot of capital."
steamwheedle.11.option.1:0 "Tighten your Coin Purse!"

steamwheedle.12.t:0 "Contract Deadline"
steamwheedle.12.d:0 "The Prince is making moves, hes the one who took out the bank, and hes the one who has been making deals down in the mines, if this keeps up both of our heads are gonna roll, or did you already tell him that you signed that contact?"
steamwheedle.12.option.1:0 "Signed, Stamped & Posted"
steamwheedle.12.option.2:0 "Amateur!"

steamwheedle.13.t:0 "Eastern Markets?"
steamwheedle.13.d:0 "It looks like some one has messed up Stormwind pretty good, they seemed to always hate dealing with us so good riddence i say, but heres the thing boss, its not the Humans or the Beards who did it, its some big green guys."
steamwheedle.13.option.1:0 "I smell Profit!"

steamwheedle.14.t:0 "Dealing with the Others"
steamwheedle.14.d:0 "We have been offered two contacts, one by the gnomes as well as one by the beards, both are beneficial to us though not in monetary gain, but in expertiese in fields we are...lets say fledgings in, the terms are very favorable to us, only the beards have a stipulation, we stop calling them 'Beards'."
steamwheedle.14.option.1:0 "The Goblin-Gnome Collective!"
steamwheedle.14.option.2:0 "The Goblin-Be...Dwarven Union!"

steamwheedle.15.t:0 "Membership?"
steamwheedle.15.d:0 "The Warchief offered us a place in their "Horde" but ive got a feeling that they are just trying to get us to do all the heavy lifting from them, they have issues with the Gnomes and Dwarves as is."
steamwheedle.15.option.1:0 "We are business Partners."
steamwheedle.15.option.2:0 "More Pie for us!"

steamwheedle.20.t:0 "Negotiations?"
steamwheedle.20.d:0 "De Goblins said they are going to attack the Tribes to the North, and dey either go through us de easy way, or de hard way."
steamwheedle.20.option.1:0 "Fine"
steamwheedle.20.option.2:0 "Jus kill dem!"

