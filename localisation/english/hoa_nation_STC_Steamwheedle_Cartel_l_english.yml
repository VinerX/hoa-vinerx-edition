STC_mad_training:0 "M.A.D Programming"
STC_mad_training_desc:0 "The Bois keep on bringing back planes that aint even worth scrappin, The Boss says that we can program the flight controls so the moment they take sufficent damage they fly into the closest ship...scratch that, new orders the moment they take any damage."
STC_deadman_switches:0 "Deadman Switches"
