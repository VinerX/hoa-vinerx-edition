l_english:

# --- IRONFORGE SIEGE EVENTS ---
 khaz_modan_siege.10.t:0 "The Mountain Stands Alone"
 khaz_modan_siege.10.d:0 "The enemy has overrun all of Dun Morogh. Our outer holds вЂ” Kharanos, Anvilmar, Gol'Bolar вЂ” have fallen one by one. Only Ironforge Mountain itself remains in our hands. The Great Forge still burns, and the depths still echo with the sound of hammers. We are besieged, but we are not broken.\n\nKing Magni Bronzebeard has ordered the outer gates sealed. Every dwarf old enough to hold an axe has been called to the walls. The mountain has never fallen to an invader вЂ” and it will not start now."
 khaz_modan_siege.10.option.1:0 "The Mountain has never fallen. It never will."
 khaz_modan_siege.10.option.2:0 "Conscript every able-bodied dwarf. We need every hand on the wall."

 khaz_modan_siege.11.t:0 "Rationing Begins"
 khaz_modan_siege.11.d:0 "Three months under siege. The granaries are still full, but Magni's stewards have begun rationing. Ale is being watered down. Mushroom farms in the lower depths are being expanded. The Forlorn Cavern has been converted into a storehouse.\n\nThe dwarves grumble вЂ” mostly about the ale вЂ” but morale holds. The mountain has endured worse."
 khaz_modan_siege.11.option.1:0 "Tighten belts. The mountain provides."
 khaz_modan_siege.11.option.2:0 "Take stock of everything. Leave nothing to chance."

 khaz_modan_siege.12.t:0 "Magni Addresses the Mountain"
 khaz_modan_siege.12.d:0 "Six months of siege. King Magni has called a gathering in the Great Forge to address his people. Standing before the Anvil, with the fires of Khaz'goroth blazing behind him, the King's voice carries through every hall and tunnel.\n\n'They think the mountain is a cage,' Magni declares. 'They are wrong. The mountain is our shield, our forge, our home. Every day they sit outside our gates, their armies bleed in the passes while our forges grow hotter. They cannot take Ironforge вЂ” because Ironforge IS the mountain, and the mountain does not yield.'\n\nThe roar of approval shakes the stone."
 khaz_modan_siege.12.option.1:0 "For the Mountain! For Khaz Modan!"

 khaz_modan_siege.13.t:0 "The Siege Drags On"
 khaz_modan_siege.13.d:0 "Nine months. The Horde remains encamped outside the gates. Rationing has tightened further. Some of the deeper tunnels have collapsed under bombardment. But the forges still burn, and the walls still hold.\n\nThe Bleeding Hollow clan, led by Kilrogg Deadeye, has settled into a long siege. Scouts report that their encampments are becoming semi-permanent. This is no longer a quick assault вЂ” this is a war of endurance.\n\nThe question is: who will break first?"
 khaz_modan_siege.13.option.1:0 "We are dwarves. We do not break."
 khaz_modan_siege.13.option.2:0 "We must find other ways to endure."

 khaz_modan_siege.14.t:0 "A Year Under the Mountain"
 khaz_modan_siege.14.d:0 "One full year. The siege has become a way of life. Babies have been born in the deep tunnels who have never seen the sky. The mushroom farms produce enough to feed the population, and the forges continue to arm our defenders.\n\nIf the tunnels to Gnomeregan still hold, gnomish engineers have proposed linking our defensive networks вЂ” sharing power, supplies, and intelligence. If the mountain and the gear-city stand together, neither can fall alone.\n\nThe question is no longer whether Ironforge can hold. It is whether the Alliance will reach us before the enemy starves us out."
 khaz_modan_siege.14.option.1:0 "Link with Gnomeregan. We survive together."
 khaz_modan_siege.14.option.2:0 "Call up the militia. Every dwarf will fight."

 khaz_modan_siege.15.t:0 "The Mountain Cannot Fall"
 khaz_modan_siege.15.d:0 "Sixty-four weeks. The siege has entered its most desperate phase. The Horde has launched probing attacks into the outer galleries. They were repelled, but at great cost.\n\nMagni stands in the High Seat, his hammer still in hand. His beard has greyed from the strain. But when he speaks, the old fire is there.\n\n'My father's father carved this hall from living stone. His father before him lit the first forge-fire. For two and a half thousand years, Ironforge has stood. It will stand two thousand more. No orc, no dragon, no demon will ever set foot in the Great Forge while a single Bronzebeard draws breath!'"
 khaz_modan_siege.15.option.1:0 "Khaz Modan will outlast them all."
 khaz_modan_siege.15.option.2:0 "Perhaps it is time to seek terms..."

 khaz_modan_siege.20.t:0 "The Siege is Broken!"
 khaz_modan_siege.20.d:0 "The Alliance has arrived! Lordaeron's armies have pushed south through the Wetlands, breaking the Horde's containment. Dun Morogh is being liberated, state by state. The long nightmare is ending.\n\nThe gates of Ironforge swing open for the first time in months. Dwarves emerge blinking into the sunlight, axes ready. There is still a war to win вЂ” but the mountain is free."
 khaz_modan_siege.20.option.1:0 "Open the gates! The Alliance has come!"

 # --- GNOMEREGAN SIEGE EVENTS ---
 khaz_modan_siege.30.t:0 "The Iron Gate is Sealed"
 khaz_modan_siege.30.d:0 "The Horde has reached the gates of Gnomeregan. The outer territories вЂ” New Tinker Town, the Toxic Airfield вЂ” have fallen. The Great Iron Gate, forged by the finest gnomish and dwarven smiths, now stands as the last barrier between the invaders and our city.\n\nHigh Tinker Mekkatorque has ordered the Gate sealed and all defensive systems activated. The gearworks are being converted to war production. The gnomes will not go quietly."
 khaz_modan_siege.30.option.1:0 "Let them try to break the Iron Gate."
 khaz_modan_siege.30.option.2:0 "Mobilize every engineer. This is total war."

 khaz_modan_siege.31.t:0 "The Tinkers' Gambit"
 khaz_modan_siege.31.d:0 "Twelve weeks under siege. The Iron Gate has held against repeated assaults, but the Horde's siege engines are taking their toll. In the Engineering Labs, the tinkers have been working on emergency inventions.\n\nMekkatorque's council debates the next step. Some advocate for a breakout attempt using the Spider Tanks. Others argue for hunkering down and outlasting the enemy. The one thing everyone agrees on: Gnomeregan's technology will be its salvation."
 khaz_modan_siege.31.option.1:0 "Patience. The Gate will hold."
 khaz_modan_siege.31.option.2:0 "Invest everything into new weapon prototypes."

 khaz_modan_siege.32.t:0 "The Gearworks Run Hot"
 khaz_modan_siege.32.d:0 "Twenty-six weeks. The siege has transformed Gnomeregan into a single vast war machine. Factories that once produced clockwork toys now churn out mortar shells. The Gearworks district runs twenty-four hours a day, the sound of machinery echoing through every corridor.\n\nThere is a strange pride in this. The gnomes have always been builders вЂ” now they are building the tools of their own survival. Every shell, every mine, every repaired turret is a statement: we are still here."
 khaz_modan_siege.32.option.1:0 "Let the forges never cool."
 khaz_modan_siege.32.option.2:0 "Conscript the workshop crews. Numbers matter now."

 khaz_modan_siege.33.t:0 "Desperate Measures in the Deep"
 khaz_modan_siege.33.d:0 "Forty-three weeks. Rationing is severe. The Gate has been breached and repaired twice. Casualties mount. In the lower levels, where the trogg tunnels intersect with gnomish excavations, there are... other concerns. But those must wait.\n\nMekkatorque addresses the survivors: 'We have outlasted every expectation. The Ironforge dwarves are still fighting beside us through the deep tunnels. And somewhere north, the Alliance is coming. Hold.'"
 khaz_modan_siege.33.option.1:0 "We have come too far to surrender now."
 khaz_modan_siege.33.option.2:0 "The situation is untenable. We must consider... alternatives."

 khaz_modan_siege.40.t:0 "The Gate Opens"
 khaz_modan_siege.40.d:0 "Relief has come! The Alliance counter-offensive has broken through to Gnomeregan. The Iron Gate, battered but still standing, swings open. Gnomish engineers stream out to join the advancing Alliance forces, eager to repay the Horde for every day of the siege.\n\nThe city is damaged but alive. Gnomeregan has endured."
 khaz_modan_siege.40.option.1:0 "Forward! For Gnomeregan!"

 # --- HORDE EVENTS ---
 khaz_modan_siege.50.t:0 "Aid Request from Ironforge"
 khaz_modan_siege.50.d:0 "A desperate message has arrived from King Magni Bronzebeard. Ironforge is under siege вЂ” the Horde has overrun Dun Morogh and the dwarves are bottled up inside the mountain. They request immediate relief.\n\nThe mountain cannot be allowed to fall. If Ironforge breaks, the industrial heart of the Alliance breaks with it. An expedition must be mounted."
 khaz_modan_siege.50.option.1:0 "We must relieve Khaz Modan."
 khaz_modan_siege.50.option.2:0 "A logistical challenge, but we accept."

 khaz_modan_siege.51.t:0 "Khaz Modan's Resources Flow"
 khaz_modan_siege.51.d:0 "The conquered territories of Khaz Modan are yielding their bounty. Dwarven forges, gnomish workshops, the rich mines of Dun Morogh вЂ” all are feeding the Horde war machine. Ore, oil, and manufactured goods flow south to equip Orgrim's armies.\n\nThis is what Doomhammer wanted. Khaz Modan was never just about conquest вЂ” it was about resources."
 khaz_modan_siege.51.option.1:0 "Let the forges of the enemy arm our warriors."

