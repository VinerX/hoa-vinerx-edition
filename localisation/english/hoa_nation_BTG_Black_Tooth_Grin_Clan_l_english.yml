black_tooth_grin.1.t:0 "Call to Arms"
black_tooth_grin.1.d:0 "Chieftain your father requests your aid, he claims that Gul’dan has betrayed the Horde and seeks to kill your father and claim the Horde as slaves for his demonic master. These traitors must be dealt with immediately."
black_tooth_grin.1.option.1:0 "Gul’dan will regret this."
black_tooth_grin.2.t:0 "Blackhand Demands Integration"
black_tooth_grin.2.d:0 "With the ever-growing expansion and stabilization of the Horde, your father Blackhand’s leadership is unquestionable and sees no use for a puppet clan like ours to keep the balance of power in his favor.\n\n Today we have received a direct request from the Warchief, calling us to fully rejoin the Blackrock Clan. While we certainly understand the importance of unity among orcs, the end of the Black Tooth Grin clan might also be the end of our more ambitious plans..."
black_tooth_grin.2.option.1:0 "Glory to the Blackrock Clan."
black_tooth_grin.2.option.2:0 "Demand we stay independent."
black_tooth_grin.3.t:0 "An offer from Doomhammer"
black_tooth_grin.3.d.1:0 "As sons of the mighty Blackhand, the fate of the [BTG.GetName] now hangs in the balance. With Orgrim Doomhammer ascending to the position of Warchief, he comes forth to request our unwavering loyalty to his rule. But the Horde and the Blackrock Clan, as our birthright, is meant to be ours!\n However, we are faced with a profound decision. Shall we acquiesce to Doomhammer's plea, securing a place within the Horde? Or do we dare to forge a different path, one that is paved with risk and uncertainty?"
black_tooth_grin.3.d.2:0 "As sons of the mighty Blackhand, the fate of the [BTG.GetName] now hangs in the balance. With Orgrim Doomhammer ascending to the position of Warchief, he comes forth to request our unwavering loyalty to his rule.\n\n In exchange, he propose to make the [BTG.GetName] a proper clan, no longer subordinate to the [BRC.GetName]. Moreover, he has promised to hand over the lands around the Dark Portal once the Horde has secured its place on Azeroth as well as allowing any blackrock orcs to join us if they wish so.\n\n While the Horde and the Blackrock Clan are ours by birthright, accepting Doomhammer's offer would secure our place within the Horde as a proper clan..."
black_tooth_grin.3.d.3:0 "As sons of the mighty Blackhand, the fate of the [BTG.GetName] now hangs in the balance. With Orgrim Doomhammer ascending to the position of Warchief, he comes forth to request that the [BTG.GetName] re-integrates the [BRC.GetName] fully, loosing its relative independance and autonomy.\n This order has come to us as absolutely outrageous, as it would mean the end of the clan but also our ambitious plans. Doomhammer is nothing but an impostor and the Horde as well as the Blackrock Clan should be ours by birthright!"
black_tooth_grin.3.option.1:0 "Accept the deal."
black_tooth_grin.3.option.2:0 "We cannot give any guarantee."
black_tooth_grin.3.option.3:0 "The Black Tooth Grin clan will not bow to an impostor!"
black_tooth_grin.3.option.3.d:0 "§HWe declare our independance from the §!§t[BRC.GetName]§!§H but remain within §!§Rthe Horde§!§H.§!\n\n"
black_tooth_grin.3.option.4:0 "Doomhammer will pay for his betrayal!"
black_tooth_grin.3.option.4.d:0 "§RYou will try to avenge the death of your father...§!\n\n"
black_tooth_grin.4.t:0 "A Gift from Gul’dan"
black_tooth_grin.4.d:0 "Gul’dan has informed us the Warchief that Azeroth contains massive amounts of Elemental powers. He believes that if he can conquer them as he did on Draenor, his warlocks will be able to destroy the humans with ease. With this in mind, he and his followers have decided to travel up north to an unknown location, Blackhand has left some of his territories near the Dark Portal to us."
black_tooth_grin.4.option.1:0 "A welcome gift."

