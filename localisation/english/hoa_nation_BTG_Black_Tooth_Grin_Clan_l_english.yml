 BTG_Warchiefs_Chosen:0 "Blackhand's Chosen"
 BTG_Warchiefs_Chosen_desc:0 "The Black Tooth Grin Clan are comprised of Orcs chosen by Blackhand himself, including his sons Dal'rend and Maim."

 BTG_newly_formed_clan:0 "Clan Power Struggle"
 BTG_newly_formed_clan_desc:0 "The Blacktooth Clan was formed by Blackhand to serve as the scouting arm of the Blackrock Clan, while Rend and Main have their power cemented in the clan, with the clan crossing into the new world a new power struggle has begun for positions of respect."
