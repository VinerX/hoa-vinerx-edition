AER_kurdran_wildhammer:0 "Kurdran Wildhammer"
POLITICS_THANE_KURDRAN_WILDHAMMER_DESC:0 "Chief among thanes, Kurdran Wildhammer leads the dwarves of the Wildhammer clan. He is well respected for his tenacity in combat and for his loyalty to friends. Kurdran never surrenders - even against great odds, and is always ready to defend his homeland from invaders."
