AER_land_purchase:0 "Land Purchase"
AER_land_purchase_desc:0 "High Thane, after offerin' oor soothern kinlands to th' tall un's they ga' it to a band o' Orcs withoot takin' a breath! We had 'em sworns tae oaths they'd protect those lands, an' the short-beards did reit spat upon oer honour! 'is would be a rightful cause fer war, High Thane! But th' kinsmen an' thir lasses wuid lose thir homes if we 'eld haste."

AER_wildhammer_legacy:0 "Wildhammer Legacy"
AER_wildhammer_legacy_desc:0 "By the time of the trade with the various human city-states to the north, the dwarves, led by High King Modimus Anvilmar, had three powerful factions brooding within the city of Ironforge. The Wildhammer clan controlled the foothills of the mountain with the most resilient of mountaineers"

AER_Gryphon_Breeding:0 "Highland Gryphons"
AER_Gryphon_Breeding_desc:0 "Like the Stormpikes are with Rams, the Dwarves of Aerie Peak are renowned for their Gryphons. Arguablly training some of the best Gryphons in the Eastern Kingdoms."
