bloodsail_buccaneers_third_war.1.t:0 "Landfall"
bloodsail_buccaneers_third_war.1.d:0 "Our fleet, having narrowly escaped Kul Tiras, has reached a large island off the Stranglethorn coast. Overrun by aggressive murlocs, this island requires an urgent and decisive campaign to clear the infestation and construct a robust fortress, safeguarding our position against any pursuit by Admiral Proudmoore."
bloodsail_buccaneers_third_war.1.option.1:0 "To Arms!"

bloodsail_buccaneers_third_war.2.t:0 "Claiming the Island"
bloodsail_buccaneers_third_war.2.d:0 "The murloc threat eliminated, our fleet can now transform this island, it is time to develop the land and build a robust port, laying the foundation for a secure and thriving new home, ready to withstand any challenges."
bloodsail_buccaneers_third_war.2.option.1:0 "Secure Our New Lands."
