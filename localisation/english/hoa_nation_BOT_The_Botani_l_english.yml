BOT_The_Genesaurs:0 "The Genesaurs"
BOT_The_Genesaurs_desc:0 "The ancient Genesaurs are the caregivers and 'gods' of the Botani. Their massive stature and capabilities are a danger to the Orcs. They are very capable and deadly in combat."
BOT_Infested_Slaves:0 "Infested Ones"
BOT_Infested_Slaves_desc:0 "The Genesaurs and Botani have managed to learn the way to infest other beings, primarily Orcs. Turning them into mindless slaves who adhere to the Botani's commands."
BOT_Hunted_Species:0 "'Hunt till Extinction'"
BOT_Hunted_Species_desc:0 "The Orcs and Ogres of Draenor will continue to hunt the Botani and Genesaurs until they have been confirmed to be extinct."
