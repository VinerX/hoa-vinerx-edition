BOT_phylarch_the_evergreen:0 "Phylarch the Evergreen"
POLITICS_PHYLARCH_DESC:0 "As the ruler of the Botani, Phylarch is driven by a powerful vision to restore the ancient Spore Mounds on Draenor. He seeks to awaken the dormant power within the Spore Mounds to, transform Draenor into a thriving, verdant world once more."

