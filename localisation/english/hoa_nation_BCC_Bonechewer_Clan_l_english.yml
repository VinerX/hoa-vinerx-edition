### warchief Hounds Focus
BCC_tanaan_savages:0 "Tanaan Savages"
BCC_tanaan_savages_desc:0 "We dwelled within the Trees of Tanaan, forged from a legacy of starvation and savagery, we survived by gnawing the bones of those who had perished, and those who crossed our path, be it Saberon, Ogre or Orc."
BCC_ornaments_of_the_fallen:0 "Ornaments Of the Fallen"
BCC_ornaments_of_the_fallen_desc:0 "Adorned with trophies of foes, and mementos of family, we instilled terror in the hearts of the weak."

BCC_the_forbidden_feast:0 "The Forbidden Feast"
BCC_the_forbidden_feast_desc:0 "We were expelled from Hellfire Citadel due to our lingering hunger, treated as if we were mad like the Laughing Skulls, but Hurkan will do what is needed to remind the other clans that we are still warriors."

BCC_claims_of_azeroth:0 "Claims on Azeroth"
BCC_claims_of_azeroth_desc:0 "When the Warchief called we answered, however his requirements for us to hunt down and exterminate the Bleeding Hollow required us to move many of our clansmen through the portal, leaving the Tanaan very under guarded."

BCC_the_grinning_bastards:0 "The Grinning Bastards"
BCC_the_grinning_bastards_desc:0 ""
BCC_the_poxed_ones:0 "The Poxed Ones"
BCC_the_poxed_ones_desc:0 ""
BCC_warsong_enforcers:0 "Warsong Enforcers"
BCC_warsong_enforcers_desc:0 ""
BCC_the_warchiefs_hounds:0 "The Warchief's Hounds"
BCC_the_warchiefs_hounds_desc:0 "If we are going to be the Hounds of the Warchief the Clan is going to need to get used to being around Wolves."

BCC_track_the_traitors:0 "Track the Traitors"
BCC_track_the_traitors_desc:0 "The Bleeding Hollow were always better at tracking down their prey, but we must adapt to meet the Warchiefs demands."

BCC_test_the_jungle:0 "Test The Jungle"
BCC_test_the_jungle_desc:0 "We will send a force into the Jungle to test the Bleeding Hollow, let us see if one of them brings back a Skull."

BCC_the_warchiefs_leash:0 "The Warchief's Leash"
BCC_the_warchiefs_leash_desc:0 "We have reported our incursion into the jungle to the Warchief, though it hard to tell if he enjoyed us bringing him the Traitor Clansmens eyes."

