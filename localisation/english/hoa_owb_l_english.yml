# events
##################################
owb_shared_events.1.t:0 "The Great War"
owb_shared_events.1.d:0 "The overseers tell it grim: the Great War trashed the world. It was a war over the last scraps of food, fuel, and power until someone lit the fuse, and everything blew sky-high. Radiation flooded the land, twisting dirt into poison and air into death. Our kin saw it coming, built this vault, and for generations we have lived inside its Steel walls praying we’d outlast the fallout. But one day we will reclaim the surface world."
owb_shared_events.1.option.1:0 "Humanity Lives on"
owb_shared_events.2.t:0 "Life in the Vault"
owb_shared_events.2.d:0 "Life in the vault’s no picnic. Resources are scarce, space is cramped, and every flickering bulb or jug of murky water gets rationed just to keep us alive behind these sealed doors. Progress? Barely. Each fix or gadget drains our stash, all to stay safe. Still, with the overseers guidance we where able to focus on breakthroughs in....."
owb_shared_events.2.option.1:0 "Civilian Development"
owb_shared_events.2.option.2:0 "Take a balanced approach"
owb_shared_events.2.option.3:0 "Military Development"
owb_shared_events.3:0 "Utilizing Our New lands"


