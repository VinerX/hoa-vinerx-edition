#decisions
###############################

cult_of_the_damned_decisions:0 "§!Cult of the Damned§!"
cult_of_the_damned_decisions_desc:0 "Devout followers of the Lich King, the Cult of the Damned is mostly compromised of living cultists. While they aspire to become undead, their death is something that they need to earn. In the meantime, remaining alive allows them to spy and infiltrate the enemies of their dark master."

CAE_into_the_realm_eternal_decision:0 "Into the Realm Eternal"
CAE_into_the_realm_eternal_decision_desc:0 "The high elves of Quel'thalas protects the Sunwell, a powerful fountain of magic that would be enough to resurrect Kel'Thuzad."
CAE_resurrect_kel_thuzad_decision:0 "Resurrect Kel'Thuzad"
CAE_resurrect_kel_thuzad_decision_desc:0 "With the Sunwell now in our possession, we can finally resurrect the leader of the Cult of the Damned."

CAE_the_siege_of_dalaran_decision:0 "The Siege of Dalaran"
CAE_the_siege_of_dalaran_decision_desc:0 "The Magocracy of Dalaran is in possession of the spellbook of Medivh. We must retrieve it to summon Archimonde and his legion of demons."
CAE_summon_archimonde_decision:0 "§GSummon Archimonde§!"
CAE_summon_archimonde_decision_desc:0 "We now possess the spellbook of Medivh and can finally start the ritual to summon Archimonde to Azeroth."

