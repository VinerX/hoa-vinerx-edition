CAE_the_baron:0 "The Baron"
CAE_the_baron_desc:0 "Baron Riverdare, the leader of Stratholme, is an old friend of Kel’thuzad’s. If we can successfully influence him to join our cause, the second-largest city in Lordaeron will easily fall at the outset of the war.""
CAE_the_knights_of_stratholme:0 "The Knights of Stratholme"
CAE_the_knights_of_stratholme_desc:0 "Baron Riverdare has masterfully guided a significant contingent of his devoted knights to Caer Darrow. Little do they know that their seemingly noble mission is a sinister ruse, as they are destined to meet their demise within the halls of Scholomance, only to be resurrected as relentless servants of the Lich King.""

