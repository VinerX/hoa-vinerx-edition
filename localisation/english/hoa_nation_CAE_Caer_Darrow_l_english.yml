CAE_banished_students:0 "Banished Students"
CAE_banished_students_desc:0 "Over the years, the Kirin Tor has expelled numerous aspiring mages, perhaps not widely recognized for their magical prowess. However, the allure of Kel’thuzad's teachings and the opportunity to align with our cause is likely to attract these disenfranchised sorcerers, bolstering our ranks with eager recruits."
