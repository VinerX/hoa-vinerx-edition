#events
###############################
cult_of_the_damned.1.t:0 "The Cult of the Damned Rises"
cult_of_the_damned.1.d:0 "It is finally time for us to rise from the shadow and unleash the Plague of Undead all over Lordaeron!\n\nAlready our shipments of plagued grain have been sent throughout the realm, it is only a matter of time before entire villages turn to undeath..."
cult_of_the_damned.1.option.1:0 "The damned stand ready..."

cult_of_the_damned.2.t:0 "Prince Arthas takes Command"
cult_of_the_damned.2.d:0 "Prince Arthas has returned from Northrend and has slain the king, beginning the new phase of the Dark Lord's plan for these lands.\n\n He has met with Tichondrius, a dreadlord in service of the Lich King. The demon taught him about the powers of Frostmourne and how the blade was made by the Lich King himself to steal the souls of the livings. He then tasked Arthas to rallies our acolytes in order to prepare for the next phase of the plan.\n\n We revel in these news, as Kel'Thuzad told us that the prince would return."
cult_of_the_damned.2.option.1:0 "My life for Ner'zhul."

cult_of_the_damned.3.t:0 "Rallying the Cult"
cult_of_the_damned.3.d:0 "The no-longer prince swiftly scourged through the countryside of the Principality of Hearthglen, rallying the cultists that were waiting undercover in the last standing villages of the kingdom.\n\nThis task done, the death knight returned to Tichondrius. The dreadlord, pleased with the former prince's actions, told him about the next task at hand. Arthas now had to lead the cult to Andorhal to recover the remains of the acolytes' former master, the necromancer Kel'Thuzad, in order to resurrect him.\n\n Sadly, there was no nexus of ley-energies powerful enough within Lordaeron to bring the necromancer back to life, his remains would have to be transported somewhere else..."
cult_of_the_damned.3.option.1:0 "My life for Ner'zhul."

cult_of_the_damned.4.t:0 "Return to Andorhal"
cult_of_the_damned.4.d:0 "Arthas led his troops to Andorhal, just like he had done when he was still part of the world of the living. This time it was not to save the city from the undead, but quite the contrary.\n\n Followed by the cultists, the former prince battled against the survivors that had entrenched themselves within the eastern part of the city, guarded by a small contingent of knights of the Silver Hand, led by Gavinrad the Dire, a former paladin and comrade of Arthas.\n\nThe death knight wasted no time and slew them all, before making his way to the city cemetary, where he found the tomb that had been dug for the old necromancer... As he approached the grave, he could hear the voice of Kel'thuzad echo in his surroundings.\n\n ' Told you my death would mean little...'"
cult_of_the_damned.4.option.1:0 "'I was right about you, Prince Arthas...'"

cult_of_the_damned.5.t:0 "The Remains"
cult_of_the_damned.5.d:0 "The corpse of the old necromancer was dug out by the cultists and placed in a meat wagon for transport, it was badly damaged but the prince hoped it would be enough.\n\n Arthas and his troops were once again joined by Tichondrius. The dreadlord assessed the advanced decomposition of the necromancer's remains, stating that it would never survive the trip to Quel'thalas. He then proceeded to explain that the only source of power in the Eastern Kingdoms able to resurrect the necromancer would be the power of the Sunwell, the arcanic source of energies of the high elves of Quel'thalas.\n\n Arthas considered the weight of scourging through the high elven lands, as they would probably oppose a fierce resistance, but it had to be done according to the dreadlord.\n\n Before leaving the prince and the cult to their task, the dreadlord told him that in order for Kel'thuzad remains to survive the trip, they would have to be placed in a special urn. Urn that was apparently guarded in western Andorhal..."
cult_of_the_damned.5.option.1:0 "Your wish is my command."

cult_of_the_damned.6.t:0 "An Old Friend - Part 1"
cult_of_the_damned.6.d:0 "Making their way to the western part of the city, Arthas and his undead troops were met with a more fierce resistance. The Order of the Silver Hand had indeed took control over the city and its paladins were dangerous foes to stand against, but cult had no problem defeating them. Finally, the undead arrived near the south-western bridge and Arthas could distinguish a familiar figure.\n\n'Your father ruled this land for seventy years, and you've ground it dust in a matter of days.' shouted none other than Lord Uther the Lightbringer from the other side of the bridge.\n\n'Very dramatic, Uther.' ironized the former prince. 'Give me the urn, and I will make sure you die quickly.'\n\n'The urn holds your father's ashes, Arthas!' insurged the paladin. 'What were you goping to piss on them one last time before you left his kingdom to rot?!'\n\nThe prince chuckled, amused by the irony and his old friend's temperament. 'I didn't know what it held, nor does it matter. I'll take what I came for one way or another."
cult_of_the_damned.6.option.1:0 "And the two engaged into battle."

cult_of_the_damned.7.t:0 "An Old Friend - Part 2"
cult_of_the_damned.7.d:0 "The fight was evenly matched, both were formidable combattant and both were wielding powerful magic. It was a battle of Dark against Light, Life against Death. The clash of their weapons resonated through the desolate city, echoing the shattered trust that used to define their relationship.\n\n As the battle raged on, it was clear that Arthas was getting the upper hand. Despites his unweavering faith in the Light, Uther was starting to struggle against the unholy assault of the death knight. Finally, the paladin fell to the ground, and kneeled, exhausted. 'I dearly hope that there's a special place in hell waiting for you, Arthas.'\n\nThe fallen prince chuckled once more and answered his old mentor. 'We may never know, Uther. I intend to live forever.' He then plunged his blade into the heart of the paladin, claiming his life and his soul.\n\n The urn was now his and he discarded the ashes of his father, letting them fly into the wind, before handing it to the cultists so that they could delicately place the remains of Kel'Thuzad within it.\n\n As they were about to leave Andorhal, the shade of the old necromancer appeared before Arthas and warned him.\n\n 'The dreadlords cannot be trusted. They are the Lich King's jailors. I will tell you all...'"
cult_of_the_damned.7.option.1:0 "... when I walk this world again."
cult_of_the_damned.7.option.1.d:0 "§LWith the remains of Kel'Thuzad now safely contained, the fallen prince lead his troops towards Quel'thalas.§!\n\n§HUnlock decision to declare war on Quel'Thalas.§!"

cult_of_the_damned.8.t:0 "The Ranger-General"
cult_of_the_damned.8.d:0 "So far the high elves of Quel'thalas have offered a formidable resistance to our legion of undead, but not enough to hinder our progression, despites all their faith and efforts in defending the magical woods they call home.\n\n The symbol of their unyielding will could definitely be their ranger-general and leader of the defense: Sylvannas Windrunner. She and her elite rangers, the Farstriders, have been a thorn in the side of Arthas' goals ever since the Scourge set foot into the high elven kingdom. Constantly harassing his troops with guerilla tactics.\n\n But the Ranger-General herself wasn't immune to the death knight's wrath. In a turn of event, the two confronted each others at the gates of Silvermoon. Arthas saluted the high elf bravery, but warned her that the chase was over. Sylvannas made her stand, she would never yield and abandon his people, yet even this resolve couldn't save her. In a swift swing of his blade, the fallen prince cut her leg, forcing her to kneel.\n\n'Finish it! I deserve... a clean death.' she begged."
cult_of_the_damned.8.option.1:0 "' The last thing I'll give you is the peace of death.'"
cult_of_the_damned.8.option.1.d:0 "§LThe screams of the Ranger-General echo through the forest as the prince plunges his sword and tears her spirit from her body, turning the high elf woman into a banshee.§!"
cult_of_the_damned.8.option.2:0 "' You have earned it.'"
cult_of_the_damned.8.option.2.d:0 "§LSylvannas' last breath exit her lungs and she finally falls dead.§!"

cult_of_the_damned.9.t:0 "The Lich-Lord"
cult_of_the_damned.9.d:0 "Arthas stood before the immense fountain of power of the Sunwell. The energies and light that were emanating from it was almost blinding. After his unholy crusade through Quel'thalas, he was finally about to resurrect Kel'thuzad. Death itself had come to claim the high home of the elves.\n\n Approaching the well with the urns in his hands, he called the necromancer from beyond the veil.\n\n'Now, arise, Kel'Thuzad, and serve the Lich King once again!'\n\n When he finished pronouncing these words, he could notice a fantomatic figure exiting the urns and flying towards the magic well, before tainting its water into an unholy purple mist.\n\n The well spurted with magical energies and soon enough the necromancer came back to life, materializing into a powerful Lich. Kel'thuzad was reborn, more powerful than ever, and ready to serve the Lich King once again."
cult_of_the_damned.9.option.1:0 "'I've upheld my end of the bargain, lich.'"
cult_of_the_damned.9.option.1.d:0 "§L'Are you ready to tell me about the dreadlords now?'§!"

cult_of_the_damned.10.t:0 "The Revelation"
cult_of_the_damned.10.d:0 "With Kel'Thuzad resurrected, him and Arthas made their way back to Lordaeron. The lich led him far from preying eyes and especially the ones of the dreadlords.\n\n Breaking the silence, the prince inquired: 'So, you're not upset about me killing you that one time?'\n\n'Don't be foolish.' answered the now Lich. 'The Lich King told me how our encounter would end.'\n\n'The Lich King knew that I would kill you?' asked the prince in amazement.\n\n'Of course. He chose you to be his champion long before the Scourge even began.'\n\n This left Arthas with much to think about. 'If he's so all knowing, then how can the dreadlords control him like they do?'\n\n' They are agents of the ones who created our master: the fiery lords of the Burning Legion.' calmly explained Kel'thuzad. 'It is a vast demonic army that has consumed countless worlds beyond our own. Now it comes to set this world to the flame. Our master was created to pave the way for its arrival. The dreadlords were sent to make sure that he succeeded.'\n\n'So the plague in Lordaeron, the citadels in Northrend, the slaughtering of the elves... It was all just to prepare for some huge demonic invasion?'"
cult_of_the_damned.10.option.1:0 "'Yes. Now come, we have much work to do.'"

cult_of_the_damned.11.t:0 "Archimonde"
cult_of_the_damned.11.d:0 "Kel'Thuzad led Arthas to the Alterac Mountains. He explained to the fallen prince that some Blackrock orcs cultists were still active in the region and that they possessed something he needed. The orc had constructed a demon gate to communicate with the demons, but to no success as the Burning Legion had forsaken them since their failure in the First and Second war. Kel'Thuzad needed to use that gate to receive further instruction from the demonic Legion.\n\n He and Arthas led an onslaught of undead on the orc villages, gathering the artifacts that the Lich needed to use the gate. The orcs were of little opposition and Kel'Thuzad finally reached the gate, where he could start channelling his powers.\n\n'I call upon thee, Archimonde!' casted the Lich as the powers of the demon gate swirled around him. ' Your humble servant seeks an audience!'\n\n Through the portal of the gate appeared the image of a demon, eyes blazing with malice.\n\n'You called my name, puny lich, and I have come. You are Kel'Thuzad, are you not?' inquired the demon lord.\n\n He and the Lich discussed longer. Archimonde ordered Arthas and his undead to seek the spellbook of Medhiv, the Last Guardian of Tirisfal. The Defiler as he was known, informed them that the tome was guarded within the mage city of Dalaran and that had to retrieve it in order to summon the Legion."
cult_of_the_damned.11.option.1:0 "'Once you hold the book, you will begin the summoning.'"
cult_of_the_damned.11.option.1.d:0 "§LArthas and Kel'Thuzad set sight on Dalaran...§!\n\n§HUnlock decision to declare war on Dalaran.§!"

cult_of_the_damned.12.t:0 "Under the Burning Sky"
cult_of_the_damned.12.d:0 "The channelling was finally done, and after waves of demonic creatures, it was now the turn of the Demon Lord Archimonde to be summoned into this world.\n\n His apperance sent waves of demonic magic through the world that could be felt all the way to Kalimdor.\n\n 'Tremble Mortals and despair!' bellowed the Defiler, prompting the mages of Dalaran to escape. 'Doom has come to this world!'\n\n The demon then looked down to his minions. The dreadlord Tichondrius appeared and welcomed his master on Azeroth. Archimonde first act on Azeroth was actually to relieve the Lich King of his command and give the leadership of the Scourge to the dreadlord. The demon then turned back his sight to Dalaran and made his way towards the besieged city.\n\n Arthas and Kel'Thuzad watched as they left in the distance. 'What happens to us now?!' asked the Prince."
cult_of_the_damned.12.option.1:0 "'Be patient, young death knight.'"
cult_of_the_damned.12.option.1.d:0 "'§LThe Lich King foresaw this as well.§!'"

cult_of_the_damned.13.t:0 "The Destruction of Dalaran"
cult_of_the_damned.13.d:0 "Archimonde the Defiler was overlooking Dalaran from a hill. The Demon Lord was focused on inscribing demonic runes into the sand, thinking about the incantation he was about to perform. Satisfied with his spell, he began reciting the spell in the old Eredun tongue of his people.\n\n'Let this scar signify the first blow against the mortal world. From this seal shall arise the doom of men, who, in their arrogance, sought to wield our fire as their own. Blindly they built their kingdoms upon stolen knowledge and conceit. Now they shall be consumed by very flame they thought to control'\n\n Taking a handful of sand, the demon spill it over the runes and as he does, the rest of the sand forms into a sandy replica of Dalaran City. The demon smiles before passing his hand through the sand representation of a tower and grin further as the real tower crumble and falls into the distance.\n\n Satisfied, Archimonde destroy the rest of the sand buildings as the real Dalaran collapse.\n\n'Let the echoes of doom resound across this wretched world, that all who live may hear them and despair.'"
cult_of_the_damned.13.option.1:0 "The Legion shall claim Azeroth!"
cult_of_the_damned.13.option.2:0 "Worrying..."

cult_of_the_damned.14.t:0 "The Cult of the Damned"
cult_of_the_damned.14.d:0 "Nestled inconspicuously within the boundaries of Lordaeron, Caer Darrow, though appearing unremarkable at first glance, conceals a malevolent conspiracy unfolding beneath its seemingly mundane facade. Alexei Barov, a seemingly unassuming figure, has pledged allegiance to the sinister Necromancer known as Kel’thuzad. Formerly a distinguished member of the Kirin Tor of Dalaran, Kel’thuzad delved into the forbidden depths of dark magic under the tutelage of the Lich King. Tasked with a nefarious mission, he aims to undermine the very foundations of the Alliance by unleashing a devastating plague that transforms the unsuspecting human populace into undead minions bound to the will of the Lich King. Caer Darrow serves as the staging ground for this ominous plot, where shadows whisper of impending doom, and the fate of Lordaeron hangs in the balance."
cult_of_the_damned.14.option.1:0 "For the Lich King!"

cult_of_the_damned.15.t:0 "The Scholomance"
cult_of_the_damned.15.d:0 "Beneath the shadows of Caer Darrow lies the Scholomance, initially conceived as an expansive crypt for the Barov family. Evolving into a vast underground facility, it now serves as the training ground for the Cult of the Damned. Within its clandestine halls, members of the cult dedicate themselves to the study and enhancement of Necromantic magic. Their collective aim is the refinement and perfection of the Plague of Undeath."
cult_of_the_damned.15.option.1:0 "Class is now in session."

cult_of_the_damned.16.t:0 "Naxxramas the Floating Citadel"
cult_of_the_damned.16.d:0 "After his encounter with the Lich King in Icecrown, Kel’Thuzad was transported back to the Eastern Kingdoms in Naxxramas, a colossal floating citadel from Northrend. This colossal structure comprises four wings, each more terrifying than the last, dedicated to overseeing the training of our mightiest warriors. Hovering menacingly above Caer Darrow, the citadel veils itself within the clouds, eluding curious gazes. At the opportune moment, this formidable stronghold is poised to play a crucial role in securing our victory in Lordaeron."
cult_of_the_damned.16.option.1:0 "The Alliance will cower in fear."

cult_of_the_damned.17.t:0 "New Specimen: Ghouls"
cult_of_the_damned.17.d:0 "The Lich King has unveiled knowledge about a new Undead Specimen — the Ghouls. Far surpassing the skeletal beings, we previously understood, these creatures are markedly more formidable and vicious. These creatures maintain flesh upon their corpses, and they exhibit an insatiable thirst for blood, akin to untamed beasts."
cult_of_the_damned.17.option.1:0 "Perhaps we can improve this design"

cult_of_the_damned.18.t:0 "New Specimen: Abomination"
cult_of_the_damned.18.d:0 "Following the Lich King's revelation about Ghouls, the Necromancers within Scholomance dedicated their efforts to refining the design into a more grotesque and monstrous entity. Through the amalgamation of several stitched-together corpses, they birthed what they term an "abomination" — a colossal creature boasting incredible strength, rivaling that of an Ogre."
cult_of_the_damned.18.option.1:0 "A truly perfected specimen"

cult_of_the_damned.19.t:0 "Gargoyles from Northrend"
cult_of_the_damned.19.d:0 "The Lich King has dispatched Gargoyles, hailing from the icy expanse of Northrend. Crafted from stone, these winged creatures are formidable in combat and will pose a serious challenge to the aerial supremacy of the Alliance's gryphons in the skies above."
cult_of_the_damned.19.option.1:0 "We will rule the skies."

cult_of_the_damned.20.t:0 "Summoning Rituals"
cult_of_the_damned.20.d:0 "In a departure from the traditional manual craftsmanship of the races of Azeroth, the Lich King has unveiled a dark and mysterious method of summoning monumental structures from the shadowy realms beyond. Though the origins of these eerie structures remain shrouded in mystery, their formidable presence will serve the scourge well."
cult_of_the_damned.20.option.1:0 "The Shadowlands Calls."

cult_of_the_damned.21.t:0 "Meetting with Baron Riverdare"
cult_of_the_damned.21.d:0 "Kel’thuzad's faith in his longtime friend, Baron Riverdare, has proven well-placed. The esteemed Baron has pledged allegiance to the Cult of the Damned. As the leader of Stratholme, Baron Riverdare is poised to deliver a substantial number of warriors to our cause at the very beginning of the war. With the substantial influx of forces and his battle-tested leadership, this alliance will virtually guarantee our victory in the war."
cult_of_the_damned.21.option.1:0 "Together Lordaeron will fall."

cult_of_the_damned.22.t:0 "Knights of Stratholme"
cult_of_the_damned.22.d:0 "Upon their arrival at Caer Darrow, the unsuspecting knights were ushered into the foreboding halls of Scholomance, where their lives were extinguished only to be reborn as undying servants. Now, astride their formidable undead steeds, these once powerful warriors stand ready to serve the Scourge for all eternity."
cult_of_the_damned.22.option.1:0 "A Major addition to our cause."

cult_of_the_damned.23.t:0 "The Lich Kings Gift"
cult_of_the_damned.23.d:0 "The Lich King has generously bestowed upon us two of his most formidable servants from the frigid realm of Icecrown – powerful entities known as Liches. These commanding figures are destined to serve as great generals, presenting formidable adversaries for the esteemed Paladins of the Silver Hand and the mages of the Kirin Tor in Dalaran."
cult_of_the_damned.23.option.1:0 "For the Scourge."

cult_of_the_damned.24.t:0 "Animal Studies"
cult_of_the_damned.24.d:0 "Through rigorous experimentation on various creatures, our necromancers have determined that dogs, due to their reliability and widespread availability, are the optimal candidates for resurrection into undeath. Imbued with the very essence of the plague, this newly created abberation is aptly named the Plague Hound."
cult_of_the_damned.24.option.1:0 "A Undeads best friend."

cult_of_the_damned.25.t:0 "The Slaughterhouse"
cult_of_the_damned.25.d:0 "Introducing the latest addition to our formidable arsenal: The Slaughterhouse. Within its walls, mighty war machines are being crafted, chief among them the ominous Meat Wagon. This innovative construction launches corpses upon our enemies, spreading disease and sowing discord among the enemy ranks as well as serving as a storage facility for corpses to be strategically employed by our necromancers."
cult_of_the_damned.25.option.1:0 "Our arsenal grows."

cult_of_the_damned.26.t:0 "The Scourging of Lordaeron"
cult_of_the_damned.26.d:0 "The moment has arrived to initiate the distribution of the plague across Lordaeron. Beginning in Andorhal, the designated distribution center for the northern boroughs, here we will infect the grain with the plague. Recognizing that it will take time for the full impact to be felt, We will have to infect other villages in the various regions of Lordaeron, ensuring a comprehensive spread of the plague."
cult_of_the_damned.26.option.1:0 "Deploy Abominations."
cult_of_the_damned.26.option.2:0 "Deply Plague Hounds."
cult_of_the_damned.27.t.1:0 "The Scourging of the Eastweald"
cult_of_the_damned.27.t.2:0 "The Scourging of the Eastweald - Part 2"
cult_of_the_damned.27.d:0 "The time has come to determine which settlements in the Eastweald will be afflicted by the plague. Each choice carries its own distinct advantages. Contenders include Darrowshire, Northdale, New Avalon, and Corin’s Crossing. With sufficient resources to infect two settlements in this region, strategic consideration is paramount to maximize the impact of the plague."
cult_of_the_damned.27.option.1:0 "Infect Darrowshire."
cult_of_the_damned.27.option.2:0 "Infect Northdale."
cult_of_the_damned.27.option.3:0 "Infect New Avalon."
cult_of_the_damned.27.option.4:0 "Infect Corin's Crossing."
cult_of_the_damned.28.t:0 "The Scourging of Stratholme"
cult_of_the_damned.28.d:0 ""
cult_of_the_damned.28.option.1:0 "Use Abominations"
cult_of_the_damned.28.option.2:0 "Raise their own Knights"
cult_of_the_damned.29.t:0 "The Scourging of Tirisfal Glades"
cult_of_the_damned.29.d:0 "The time has come to determine which settlements in Tirisfal Glades will be afflicted by the plague. Each choice carries its own distinct advantages. Contenders include Vandermar, Agamand Mills, Brill, and The Old Monastery. With sufficient resources to infect two settlements in this region, strategic consideration is paramount to maximize the impact of the plague."
cult_of_the_damned.29.option.1:0 "Infect Vandermar"
cult_of_the_damned.29.option.2:0 "Infect Agamand Mills"
cult_of_the_damned.29.option.3:0 "Infect Brill"
cult_of_the_damned.29.option.4:0 "Infect The Old Monastery"
cult_of_the_damned.30.t:0 "The Scourging of Silverpine"
cult_of_the_damned.30.d:0 "The time has come to determine which settlements in Silverpine Forest will be afflicted by the plague. Each choice carries its own distinct advantages. Contenders include The Sepulcher, The Farmland, and Fenris Keep. With sufficient resources to infect only one settlement in this region, strategic consideration is paramount to maximize the impact of the plague."
cult_of_the_damned.30.option.1:0 "Infect The Speulcher"
cult_of_the_damned.30.option.2:0 "Infect The Farmlands"
cult_of_the_damned.30.option.3:0 "Infect Fenris Isle"
cult_of_the_damned.31.t:0 "The Scourging of Hillsbrad"
cult_of_the_damned.31.d:0 "The time has come to determine which settlements in Hillbrad will be afflicted by the plague. Each choice carries its own distinct advantages. Contenders include Hillsbrad Fields, Southshore, Tarren Mill, and Durnholde Keep. With sufficient resources to infect two settlements in this region, strategic consideration is paramount to maximize the impact of the plague."
cult_of_the_damned.31.option.1:0 "Infect Hillsbrad"
cult_of_the_damned.31.option.2:0 "Infect Southshore"
cult_of_the_damned.31.option.3:0 "Infect Tarren Mill"
cult_of_the_damned.31.option.4:0 "Infect Durnholde"
