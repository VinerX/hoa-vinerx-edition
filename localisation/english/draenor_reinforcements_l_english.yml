l_english:
 # ----------- Category -----------
 BRC_draenor_reinforcements_category:0 "The Clans Beyond the Portal"
 BRC_draenor_reinforcements_category_desc:0 ""

 # ----------- Expedition Decisions -----------
 BRC_call_warsong_expedition:0 "Call Warsong Wolf Riders"
 BRC_call_warsong_expedition_desc:0 "Grom Hellscream and his Warsong Clan are the finest wolf-riders on Draenor. A vanguard of their cavalry would tear through the Alliance lines."
 BRC_call_warsong_expedition.tt:0 "Spawns 3 Warsong Wolf Rider divisions at the Dark Portal.\nCosts £pol_power_texticon 150 Political Power."

 BRC_call_shadowmoon_expedition:0 "Call Shadowmoon Necrolytes"
 BRC_call_shadowmoon_expedition_desc:0 "Ner'zhul's Shadowmoon Clan commands dark powers that could turn the tide of war. Their necrolytes and warlocks would bolster our magical strength."
 BRC_call_shadowmoon_expedition.tt:0 "Spawns 2 Shadowmoon Necrolyte divisions at the Dark Portal.\nCosts £pol_power_texticon 120 Political Power."

 BRC_call_thunderlord_expedition:0 "Call Thunderlord Hunters"
 BRC_call_thunderlord_expedition_desc:0 "Fenris Wolfbrother's Thunderlord Clan are masters of the hunt, combining wolf cavalry with disciplined grunt formations forged in Frostfire Ridge."
 BRC_call_thunderlord_expedition.tt:0 "Spawns 2 Thunderlord Wolf Rider + 1 Grunt division at the Dark Portal.\nCosts £pol_power_texticon 110 Political Power."

 BRC_call_shattered_hand_expedition:0 "Call Shattered Hand Gladiators"
 BRC_call_shattered_hand_expedition_desc:0 "Kargath Bladefist's Shattered Hand Clan are gladiators forged in brutal arena combat. Their slave-soldiers fight with desperate ferocity."
 BRC_call_shattered_hand_expedition.tt:0 "Spawns 3 Shattered Hand Gladiator divisions at the Dark Portal.\nCosts £pol_power_texticon 110 Political Power."

 BRC_call_laughing_skull_expedition:0 "Call Laughing Skull Berserkers"
 BRC_call_laughing_skull_expedition_desc:0 "Mogor's Laughing Skull Clan are mad berserkers driven by blood frenzy. Unreliable, unpredictable — but devastating when unleashed."
 BRC_call_laughing_skull_expedition.tt:0 "Spawns 2 Laughing Skull Berserker divisions at the Dark Portal.\nCosts £pol_power_texticon 100 Political Power."

 BRC_call_bonechewer_expedition:0 "Call Bonechewer Cannibal Riders"
 BRC_call_bonechewer_expedition_desc:0 "Hurkan Skullsplinter's Bonechewer Clan guards the Draenor side of the Dark Portal. Their cannibal raiders know no fear and no mercy."
 BRC_call_bonechewer_expedition.tt:0 "Spawns 2 Bonechewer Cannibal Rider divisions at the Dark Portal.\nCosts £pol_power_texticon 120 Political Power."

 # ----------- Integration Decisions -----------
 BRC_integrate_warsong:0 "Integrate the Warsong Clan"
 BRC_integrate_warsong_desc:0 "Call Grom Hellscream and the entire Warsong Clan through the Dark Portal. The Warsong will settle in Azeroth and fight alongside us as full members of the Horde."
 BRC_integrate_warsong.tt:0 "The Warsong Clan joins the Horde faction and crosses into Azeroth.\nA land transfer phase will begin upon arrival.\nCosts £pol_power_texticon 250 Political Power and £auth_texticon Authority."

 BRC_integrate_shadowmoon:0 "Integrate the Shadowmoon Clan"
 BRC_integrate_shadowmoon_desc:0 "Summon Ner'zhul and the Shadowmoon Clan to Azeroth. Their mastery of necrolytic magic will strengthen our magical arsenal considerably."
 BRC_integrate_shadowmoon.tt:0 "The Shadowmoon Clan joins the Horde faction and crosses into Azeroth.\nA land transfer phase will begin upon arrival.\nCosts £pol_power_texticon 200 Political Power and £auth_texticon Authority."

 BRC_integrate_thunderlord:0 "Integrate the Thunderlord Clan"
 BRC_integrate_thunderlord_desc:0 "Bring Fenris Wolfbrother's Thunderlord Clan through the Portal. Their wolf-riders and ogre-hunters will add mobility to our forces."
 BRC_integrate_thunderlord.tt:0 "The Thunderlord Clan joins the Horde faction and crosses into Azeroth.\nA land transfer phase will begin upon arrival.\nCosts £pol_power_texticon 200 Political Power and £auth_texticon Authority."

 BRC_integrate_shattered_hand:0 "Integrate the Shattered Hand Clan"
 BRC_integrate_shattered_hand_desc:0 "Kargath Bladefist commands a legion of gladiator slave-soldiers. Bring them through the Portal and unleash them upon our enemies."
 BRC_integrate_shattered_hand.tt:0 "The Shattered Hand Clan joins the Horde faction and crosses into Azeroth.\nA land transfer phase will begin upon arrival.\nCosts £pol_power_texticon 200 Political Power and £auth_texticon Authority."

 BRC_integrate_laughing_skull:0 "Integrate the Laughing Skull Clan"
 BRC_integrate_laughing_skull_desc:0 "The Laughing Skull are the weakest clan on Draenor — their leadership collapsed long ago. Even so, their berserkers could serve as shock troops."
 BRC_integrate_laughing_skull.tt:0 "The Laughing Skull Clan joins the Horde faction and crosses into Azeroth.\nA land transfer phase will begin upon arrival.\nCosts £pol_power_texticon 150 Political Power and £auth_texticon Authority."

 BRC_integrate_bonechewer:0 "Integrate the Bonechewer Clan"
 BRC_integrate_bonechewer_desc:0 "The Bonechewer Clan already controls the Draenor side of the Dark Portal. Summon them through and they will bring their cannibal raiders to feast on Alliance flesh."
 BRC_integrate_bonechewer.tt:0 "The Bonechewer Clan joins the Horde faction and crosses into Azeroth.\nA land transfer phase will begin upon arrival.\nCosts £pol_power_texticon 200 Political Power and £auth_texticon Authority."

 # ----------- Land Transfer ----------
 BRC_transfer_state_26_to_clan:0 "Grant the Nethergarde Pass"
 BRC_transfer_state_26_to_clan_desc:0 "Transfer the Nethergarde Pass in the Blasted Lands to the arriving clan. A strategic chokepoint."
 BRC_transfer_state_74_to_clan:0 "Grant the Blasted Lands Border"
 BRC_transfer_state_74_to_clan_desc:0 "Transfer this border region of the Blasted Lands to the arriving clan."
 BRC_transfer_state_360_to_clan:0 "Grant Redridge Foothills"
 BRC_transfer_state_360_to_clan_desc:0 "Transfer the foothills of Redridge Mountains to the arriving clan."
 BRC_transfer_state_361_to_clan:0 "Grant Redridge Pass"
 BRC_transfer_state_361_to_clan_desc:0 "Transfer the Redridge Pass to the arriving clan. A vital route into the highlands."
 BRC_transfer_state_362_to_clan:0 "Grant Redridge Highlands"
 BRC_transfer_state_362_to_clan_desc:0 "Transfer the Redridge highlands to the arriving clan. Rugged but defensible."
 BRC_transfer_state_392_to_clan:0 "Grant Swamp of Sorrows Outpost"
 BRC_transfer_state_392_to_clan_desc:0 "Transfer this Swamp of Sorrows outpost to the arriving clan. Strategic marshland near the Portal."
 BRC_finish_land_transfer:0 "Complete Clan Settlement"
 BRC_finish_land_transfer_desc:0 "Finalize the clan's settlement in Azeroth. No further land will be transferred."

 # ----------- Event Titles and Descriptions -----------
 draenor_reinforcements.1.t:0 "The Warchief Sends the Call"
 draenor_reinforcements.1.d:0 "Messengers ride through the Dark Portal bearing the Warchief's demand: the clans of Draenor must send warriors to Azeroth. The Second War demands every able-bodied orc.\n\nRunners depart for Nagrand, Shadowmoon Valley, Frostfire Ridge, the Spires of Arak, and Gorgrond."
 draenor_reinforcements.1.option.1:0 "Summon the clans."

 draenor_reinforcements.2.t:0 "The Clans Receive the Summons"
 draenor_reinforcements.2.d:0 "One by one, the clan chieftains receive the Warchief's demand. Some will answer with honor. Others will demand concessions. A few may refuse entirely."
 draenor_reinforcements.2.option.1:0 "We shall see who answers."

 # Warsong response
 draenor_reinforcements.10.t:0 "Grom Hellscream Answers"
 draenor_reinforcements.10.d:0 "Grom Hellscream receives the Warchief's summons in Nagrand. He paces back and forth, Gorehowl glinting in the firelight.\n\n'The Warsong are ready for blood, Warchief. But we will not be your foot soldiers — we lead the charge, or we do not come at all.'"
 draenor_reinforcements.10.option.1:0 "The Warsong will fight."

 # Shadowmoon response
 draenor_reinforcements.11.t:0 "Ner'zhul Considers"
 draenor_reinforcements.11.d:0 "In the shadow-haunted halls of Shadowmoon Valley, Elder Shaman Ner'zhul reads the Warchief's message. His acolytes whisper behind him.\n\n'We will cross the Portal, Warchief — but our necrolyte magic must be permitted without restriction. The spirits do not answer to your warriors.'"
 draenor_reinforcements.11.option.1:0 "The Shadowmoon will join us."

 # Thunderlord response
 draenor_reinforcements.12.t:0 "Fenris Wolfbrother Demands Supplies"
 draenor_reinforcements.12.d:0 "Fenris Wolfbrother and his Thunderlord hunters receive the summons in the frozen wastes of Frostfire Ridge. His wolf-riders are eager for new hunting grounds.\n\n'Our wolves are hungry, Warchief. Provide the equipment to outfit our riders, and the Thunderlord will race through the Portal.'"
 draenor_reinforcements.12.option.1:0 "The Thunderlord will ride."

 # Shattered Hand response
 draenor_reinforcements.13.t:0 "Kargath Bladefist Wants Slaves"
 draenor_reinforcements.13.d:0 "In the Spires of Arak, Kargath Bladefist reads the summons and laughs — a harsh, grating sound.\n\n'My gladiators need fresh meat for the arenas, Warchief. Promise us slaves from the conquered lands of Azeroth, and the Shattered Hand is yours. We have a thousand fighters who know only victory or death.'"
 draenor_reinforcements.13.option.1:0 "The Shattered Hand will march."

 # Laughing Skull response
 draenor_reinforcements.14.t:0 "Mogor Demands Freedom"
 draenor_reinforcements.14.d:0 "Deep in Gorgrond, the Laughing Skull Clan receives the summons. Mogor, their chieftain, grins madly.\n\n'We'll cross, Warchief! But we answer to no one — not you, not your lieutenants, not anyone. The Laughing Skull fights on our own terms. Agreed?'"
 draenor_reinforcements.14.option.1:0 "The Laughing Skull will fight."

 # Bonechewer response
 draenor_reinforcements.15.t:0 "Hurkan Skullsplinter Guards the Gateway"
 draenor_reinforcements.15.d:0 "Hurkan Skullsplinter receives the message at the Draenor side of the Dark Portal itself. His Bonechewer Clan already controls the gateway.\n\n'We hold the portal, Warchief. If we leave, our Draenor holdings are exposed. Guarantee their protection, and our cannibal raiders will feast on your enemies.'"
 draenor_reinforcements.15.option.1:0 "The Bonechewer will cross."

 # BRC negotiates
 draenor_reinforcements.20.t:0 "The Clan Demands Concessions"
 draenor_reinforcements.20.d:0 "The clan has not refused — but they demand concessions before they will cross the Portal. Their chieftain's envoy stands before the Warchief, arms crossed.\n\nTheir demands are significant. Refusing them may cost us the clan's warriors. Accepting them will drain our resources."
 draenor_reinforcements.20.option.1:0 "Accept their demands. They will cross."
 draenor_reinforcements.20.option.1.tt:0 "Pays the clan's demanded price and spends Authority."
 draenor_reinforcements.20.option.2:0 "Refuse. We will not be extorted."
 draenor_reinforcements.20.option.2.tt:0 "The clan stays on Draenor. Warchief Authority suffers."
 draenor_reinforcements.20.option.3:0 "Counter-offer. We will meet them halfway."
 draenor_reinforcements.20.option.3.tt:0 "60% chance they accept a reduced deal, 40% chance they refuse."

 # Transfer begins
 draenor_reinforcements.30.t:0 "The Crossing Begins"
 draenor_reinforcements.30.d:0 "The Dark Portal flares with emerald fire as the clan's forces begin their march from Draenor into Azeroth. Columns of warriors, wolf-riders, and supply wagons stretch across the barren wastes.\n\nThe crossing will take time. But when it is complete, the Horde's strength on Azeroth will swell."
 draenor_reinforcements.30.option.1:0 "Welcome them to Azeroth."
 draenor_reinforcements.30.option.2:0 "Cancel the transfer. It is too risky."

 # Clan-specific transfer
 draenor_reinforcements.31.t:0 "Clan Forces March Through the Dark Portal"
 draenor_reinforcements.31.d:0 "Emerald fire flares as the clan's vanguard steps through the Portal. The Blasted Lands echo with the thunder of boots and the howling of wolves.\n\nThey have arrived."
 draenor_reinforcements.31.option.1:0 "They have arrived."

 # Arrival in Azeroth
 draenor_reinforcements.40.t:0 "The Clan Arrives in Azeroth"
 draenor_reinforcements.40.d:0 "The clan's warriors have crossed the Dark Portal and now stand in the Blasted Lands. Their chieftain approaches the Warchief's camp.\n\nThey are ready to fight. But first, they will need land — somewhere to establish themselves in this strange new world."
 draenor_reinforcements.40.option.1:0 "We must find them territory."

 # Land transfer prompt
 draenor_reinforcements.50.t:0 "Where Shall They Settle?"
 draenor_reinforcements.50.d:0 "The newly arrived clan needs territory in Azeroth. Use the Land Transfer decisions to allocate states to them.\n\nChoose wisely — giving land from other Horde clans will strain the faction. The Warchief's Authority hangs in the balance.\n\nWhen you are satisfied with their allocation, use the 'Complete Clan Settlement' decision."
 draenor_reinforcements.50.option.1:0 "Let us find them a home."
 draenor_reinforcements.50.option.1.tt:0 "Land Transfer decisions are now available. Transfer up to 12 states to the arriving clan."

 # Integration complete
 draenor_reinforcements.60.t:0 "The Clan is Established"
 draenor_reinforcements.60.d:0 "The clan has been settled in Azeroth. Their warriors have claimed their assigned lands and their chieftain has sworn fealty to the Warchief.\n\nThey are now full members of the Horde, ready to fight and die for our cause."
 draenor_reinforcements.60.option.1:0 "Another clan joins the Horde."

 # Edge cases
 draenor_reinforcements.90.t:0 "The Clan Refuses the Call"
 draenor_reinforcements.90.d:0 "The clan has refused to cross the Dark Portal. Their chieftain offers hollow words of loyalty while keeping his warriors on Draenor.\n\nThe Warchief's Authority is diminished."
 draenor_reinforcements.90.option.1:0 "They will not cross."

 draenor_reinforcements.91.t:0 "The Summons Goes Unanswered"
 draenor_reinforcements.91.d:0 "Whether through refusal, inability, or the vagaries of war — the clan will not be coming to Azeroth. Their warriors remain on Draenor.\n\nThe Warchief's prestige has suffered."
 draenor_reinforcements.91.option.1:0 "So be it."

 draenor_reinforcements.92.t:0 "Transfer Intercepted"
 draenor_reinforcements.92.d:0 "The Alliance has managed to intercept our clan's crossing! Warriors were cut down before they could reach the other side.\n\nThis is a disaster for the Warchief's Authority."
 draenor_reinforcements.92.option.1:0 "A tragedy."

 draenor_reinforcements.93.t:0 "Clan Demands Unmet"
 draenor_reinforcements.93.d:0 "The clan's demands were not satisfied. Their warriors grow restless and their chieftain questions the Warchief's leadership."
 draenor_reinforcements.93.option.1:0 "Authority wavers."

 draenor_reinforcements.94.t:0 "A Clan Demands Justice"
 draenor_reinforcements.94.d:0 "One of our clans is furious — land that was rightfully theirs has been given to a newly arrived Draenor clan. They demand satisfaction, or they will take it by force."
 draenor_reinforcements.94.option.1:0 "Appease them with promises and concessions."
 draenor_reinforcements.94.option.2:0 "Let them try to take it back."
 draenor_reinforcements.94.option.3:0 "Buy their loyalty with gold and prestige."

 draenor_reinforcements.95.t:0 "Integration Cooldown Cleared"
 draenor_reinforcements.95.d:0 "Enough time has passed since the last clan integration. New clans may now be summoned through the Dark Portal."
 draenor_reinforcements.95.option.1:0 "We are ready to call more clans."

 draenor_reinforcements.96.t:0 "Portal Lost During Transfer"
 draenor_reinforcements.96.d:0 "Disaster! The Dark Portal has been sealed or lost while a clan was in transit. Their warriors are stranded on the Draenor side. The crossing is cancelled."
 draenor_reinforcements.96.option.1:0 "A catastrophe."

 # ----------- Ideas -----------
 portal_congestion:0 "Dark Portal Congestion"
 portal_congestion_desc:0 "The Dark Portal is straining under the weight of massive troop movements. Supply lines are tangled and formations are disorganized after the crossing."
