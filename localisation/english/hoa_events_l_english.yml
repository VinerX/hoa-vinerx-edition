###########################
#Tutorial Events
###########################
hoa.tutorial.1.t:0 "Hearts of Azeroth 0.7.3"
hoa.tutorial.1.d:0 "Welcome to Version 0.7.3 Hearts of Azeroth has many notable differences from traditional HOI4, and we recommend that first time players run through some of this brief tutorial before beginning. \n\nAs mentioned on the steam page, the mod truly is a Beta in the fullest sense. There will be some pieces of missing or not perfectly polished content and systems scattered throughout. However, the team has made an effort to give the mod a solid semblance of playability, especially for the nations which have focus trees and other content. \n\nJust as the mod is in progress, so too is this tutorial. However, it will be made more comprehensive over time. \n\nIf you do not need to see any of these guides, we hope you enjoy playing!"
hoa.tutorial.1.option.2:0 "Tell me about Races"
hoa.tutorial.1.option.3:0 "Tell me about Religions and Faith"
hoa.tutorial.1.option.4:0 "Tell me about Coring States"
hoa.tutorial.1.option.1:0 "I'm already familiar with these mechanics"

hoa.tutorial.2.t:0 "Races Explained"
hoa.tutorial.2.d:0 "Every country and state on the map begins with a Primary Race, and some with one or multiple Secondary Races, all of which are found in the govenment tab. A nation's primary race determines the 3 Primary Racial Traits which it starts with. Nations can also manually add up to 3 Secondary Racial Traits from any Secondary Races, and nations which share a race will gain an opinion bonus with one another. \n\nSecondary Races can be assimilated and banished based on which are present in the states you own, and sharing a primary or secondary race with an occupied state will increase compliance. You can learn more about this in the section on Coring States."
hoa.tutorial.2.option.2:0 "Return to main menu"
hoa.tutorial.2.option.1:0 "Exit Tutorial"

hoa.tutorial.3.t:0 "Religions Explained"
hoa.tutorial.3.d:0 "Every nation in Hearts of Azeroth begins the game with a religion set. This can be found at the bottom of the government tab alongside a slot for \"Secondary Religion\". Some nations begin with a Secondary Religion, but most just acquire them through decisions. Decisions can also be used to swap your current Primary and Secondary Religions. \n\nThe religions that your nation has access to interactions with depends on what religions are present in the states you own. You can learn more about this in the section on Coring States."
hoa.tutorial.3.option.2:0 "What does my religion do?"
hoa.tutorial.3.option.3:0 "Return to main menu"
hoa.tutorial.3.option.1:0 "Exit Tutorial"

hoa.tutorial.4.t:0 "Coring States"
hoa.tutorial.4.d:0 "After occupying states, nations can spend political power to manually core them, but doing so requires that you share both a religion and a race with the state in question. \n\nEach state's dominant Religion and Race can be viewed on the left of the state selection view, and buttons on the right next to \"Core State\" will be visible if you need to convert a state's race or religion first. \n\nYou can learn more about races and religions in their respective sections."
hoa.tutorial.4.option.2:0 "Return to main menu"
hoa.tutorial.4.option.1:0 "Exit Tutorial"

hoa.tutorial.5.t:0 "Effects of Religions"
hoa.tutorial.5.d:0 "On top of your country having a religion, so too does every state on the map. These can be altered as will be covered in the section on Coring States. Having the primary or secondary religion of a state that you occupy grants a bonus to compliance gain. \n\nHaving the same religion as a nation also will benefit their opinion of your nation and vice versa. \n\nPerhaps most significantly, your primary religion is determines which Faith decisions you have access to. Every religion has 4 unique decisions, each of which confer a unique bonus in exchange for 100 Faith points."
hoa.tutorial.5.option.2:0 "What are Faith points?"
hoa.tutorial.5.option.3:0 "Return to main menu"
hoa.tutorial.5.option.1:0 "Exit Tutorial"

hoa.tutorial.6.t:0 "Faith Points"
hoa.tutorial.6.d:0 "Every nation's current Faith is displayed on the top of the screen. Faith functions similarly to political power, but has more specific applications and more unique sources for generation. \n\nAs described in the tooltip above, every nation gains 10 faith multiplied by stability per month, meaning a nation with 50% stability has a default gain of 5 per month. \n\nHowever, on top of being increased by traditional effects and modifiers, faith can also be accumulated from building Churches in the construction tab. If your nation does not start with Churches unlocked, the relevant techs can be found near the resource buildings in the Administration tab."
hoa.tutorial.6.option.2:0 "Return to main menu"
hoa.tutorial.6.option.1:0 "Exit Tutorial"

