 generic_human.4.t:0 "Beyond the Veil"
 generic_human.4.d:0 "Now that we are followers of the forces of Death, we need to change our religious practices and adopt a religion according to our new alignement."
 generic_human.4.option.1:0 "We shall serve the Lich King."
 generic_human.4.option.2:0 "We will dwelve into the mysteries of Necromancy."
 generic_human.4.option.3:0 "We shall be mighty warriors of Helya."

 generic_human.5.t:0 "Serving the Legion"
 generic_human.5.d:0 "We are now proud disciples of the Legion, it is therefore the most important that we leave the ways of old and adopt new religious practices to please our new masters."
 generic_human.5.option.1:0 "Embracing Fel is the way to go."
 generic_human.5.option.2:0 "Demonology sounds fun."

 generic_human.6.t:0 "Our New Masters"
 generic_human.6.d:0 "Forbidden and ancient knowledge, eldritch whispers and vision of the Black Empire. Our new allegiance to the forces of the Old Gods have shown us many truths. It is time for us to choose who, or what, shall sit on top of our pantheon."
 generic_human.6.option.1:0 "One of the Old Gods will be our master!"
 generic_human.6.option.1.d:0 "One of the Old Gods will be our master!"
 generic_human.6.option.2:0 "We shall bring the Hour of Twilight!"
 generic_human.6.option.3:0 "Let's dwelve into the secrets of the Void."
 generic_human.6.option.4:0 "G'huun, God of Blood and Pestilence."

 generic_human.7.t:0 "One of the Old Gods"
 generic_human.7.d:0 "We have decided to serve one of the original Old Gods, and it shall be..."
 generic_human.7.option.1:0 "Y'Shaarj, the Old One."
 generic_human.7.option.2:0 "N'zoth, the Corruptor."
 generic_human.7.option.3:0 "Yogg'Saron, God of Death."
 generic_human.7.option.4:0 "C'thun, Lord of Madness."

 generic_human.8.t:0 "A Matter of Structure"
 generic_human.8.d:0 "Some of our people have voiced support for changing our current structure to a more clan base system, much like the Orcs or the vrykul in the north."
 generic_human.8.option.1:0 "If it strengthens our bonds then let it be so"
 generic_human.8.option.2:0 "The current form serves us best"

 generic_human.9.t:0 "The Hour of Twilight"
 generic_human.9.d:0 "For too long have the old gods been trapped within their cells, for too long have thier followers stood idle."
 generic_human.9.option.1:0 "We can wait no longer!"

 generic_human.10.t:0 "The Great Ones Reign"
 generic_human.10.d:0 "We have released G'huun from the titan facility, with great effort we breached the walls, destroyed the mechanical protectors and destroyed the Re-Origination Engine, may trolls does in the endevor, but their sacrifices were necessary."
 generic_human.10.option.1:0 "This is only the Beginning"

 generic_human.11.t:0 "Bearers Of the Light"
 generic_human.11.d:0 "Humanity has long followed the teachings of the light, through many of them have delved into more extreme variations of it over the years it has been a stabilizing force for its people."
 generic_human.11.option.1:0 "The Light Guides"
 generic_human.11.option.2:0 "The Tranquil Sunwell"
 generic_human.11.option.3:0 "Songs of the Naaru"

 generic_human.12.t:0 "The Past & The Future"
 generic_human.12.d:0 "The Dwaves and Gnomes have always delved into the mysteries of the world, either though uncovering old technology or through innovation."
 generic_human.12.option.1:0 "Uncover the Secrets of the Past"
 generic_human.12.option.2:0 "Build a Better Tomorrow"

 generic_human.13.t:0 "Natures Harmony"
 generic_human.13.d:0 "The Dwaves and Gnomes have always delved into the mysteries of the world, either though uncovering old technology or through innovation."
 generic_human.13.option.1:0 "Breath of Nature"
 generic_human.13.option.2:0 "Chosen of the Earth Mother"

 generic_human.14.t:0 "Teachings of a Forgotten Age"
 generic_human.14.d:0 "The High Elves are a very long lived race, They tell of stories of a great sundering, and the world being one big landmass. As insane as their tales might be they do hold great knowledge in a number of fields."
 generic_human.14.option.1:0 "Army Innovations"
 generic_human.14.option.2:0 "Aerial Innovations"
 generic_human.14.option.3:0 "Naval Innovations"
 generic_human.14.option.4:0 "Magic Innovations"

 generic_human.15.t:0 "Our Traditions"
 generic_human.15.d:0 ""
 generic_human.15.option.1:0 "Guided by the Elements"
 generic_human.15.option.2:0 "Veneration of the Elements"
 generic_human.15.option.3:0 "The Teaching of the Loa"

 generic_human.16.t:0 "Other Ways to Power"
 generic_human.16.d:0 ""
 generic_human.16.option.1:0 "Hexes & Curses"
 generic_human.16.option.2:0 "Time is Money"
 generic_human.16.option.3:0 "The Dead & The Damned"

 generic_human.17.t:0 "Tread A New Path"
 generic_human.17.d:0 "The Dragonmaw Clan have long been silent, after their pevious leader was eaten by a red dragon most of their knowledge and ways were lost, but the few stragglers who have found their way to our lands tell of their secrets."
 generic_human.17.option.1:0 "Dragon Wranglers"
 generic_human.17.option.2:0 "To Kill a Monster"
 dragon_wranglers_tt:0 "Unlock the Ability to enslave Dragons, serving as the backbone of our Aerial Forces."
 to_kill_a_monster_tt:0 "Unlock the Ability declare war on nations that align themselves with §YBlack Dragons§! or their §YWhispering God§!"

 generic_human.18.t:0 "A Prolonged Sadness"
 generic_human.18.d:0 "After the War of the Ancients, Malygos feel into a deep depression, he lost so many of his flight along with his beloved consort Sindragosa and retreated from the world."
 generic_human.18.option.1:0 "Let him be"
 generic_human.18.option.2:0 "The Spellweaver Stirs"

 generic_human.19.t:0 "Misused Gifts"
 generic_human.19.d:0 "Look at what these Mortals have done, these short lived fools toy with arcane forces they cannot fully comprehends. Many of them rip and tear at the arcane without restraint, guided only by their thirst for power, with the same arrogance that once summoned the Legion."
 generic_human.19.option.1:0 "I grow tired of them."

 generic_human.30.t:0 "Dominate the Market"
 generic_human.30.d:0 ""
 generic_human.30.option.1:0 "Fill the Blackmarket"
 generic_human.30.option.2:0 "No Safe passage for you!"
 generic_human.30.option.3:0 "Me, a Smuggler?"

