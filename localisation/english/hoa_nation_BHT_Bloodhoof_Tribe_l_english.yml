BHT_start_1_nf:0 "The Bloodhoof Tribe"
BHT_start_1_nf_desc:0 "Will the Bloodhoof Tribe perservere, or shall we join our ancestors in the afterlife?"
BHT_start_2a_nf:0 "The Chieftain"
BHT_start_2a_nf_desc:0 "Strong, wise, fearless, these are the words often used to describe Cairne Bloodhoof."
BHT_start_2b_nf:0 "The Raids"
BHT_start_2b_nf_desc:0 "The centaurs from the Kolkar Tribe raid multiple of our settlements on a regular basis, murdering and pillaging everything they can get their filthy hands onto."
BHT_focus_4_nf:0 "Approaching Danger"
BHT_focus_4_nf_desc:0 "This morning at dawn, the tribe witnessed a terrible sight, a caravan of refugees arrived at Camp Bloodhoof. In a very bad shape, covered in blood and having received multiple injuries, our newly arrived brethren were quickly taken care of by our healers. At the end of the day, most of them were recovering well from their wounds. However, they also came bearing frightful news..."

