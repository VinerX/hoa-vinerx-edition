BHT_mulgore_nf:0 "Getting Prepared"
BHT_mulgore_nf_desc:0 "The Chieftain has decided that the tribe will prepare to leave for Mulgore, just like somes of our cousin tribes did already. This will be no easy task and will require us to prepare a proper expedition."

BHT_rally_the_herds_nf:0 "Rally the Herds"
BHT_rally_the_herds_nf_desc:0 "Many of our kodo herds are left grazing the land at safe distance from the camp, we should bring them back here so we can pack them for the expedition."
BHT_avoid_raids_nf:0 "Avoid Kolkar Raids"
BHT_avoid_raids_nf_desc:0 "Leaving for Mulgore or not, the kolkar are still sending raids to our border settlement, we must lay low in the mean time if we do not want to leave some of our brethren laying dead in the dirt."
BHT_regroup_tribesmembers_nf:0 "Regroup Tribesmembers"
BHT_regroup_tribesmembers_nf_desc:0 "Some of our tribesmember live on the outskirt of our territory, surviving by themselves in group of small families and rarely visiting the other settlements. They must be informed of our decision to leave for the promised lands of Mulgore."
BHT_pack_things_up_nf:0 "Pack Things Up"
BHT_pack_things_up_nf_desc:0 "We could depart and leave everything behind, but that would be ripe for the centaurs to claim."
BHT_inventory_review_nf:0 " Last Inventory Review"
BHT_inventory_review_nf_desc:0 "We need to make a complete inventory of every single tools, armors weapons that the tribe possess so they can be put to good use."

BHT_the_long_march_nf:0 "The Long March"
BHT_the_long_march_nf_desc:0 "At last, it is time to depart for the land of Mulgore, we leave behind the Barrens and the Kolkar invaders in hope for a peaceful life."

BHT_mulgore_at_last_nf:0 "Mulgore at Last"
BHT_mulgore_at_last_nf_desc:0 "At last after many adversity, we have reached the lands of Mulgore and have settled here, atop the great Thunder Bluffs. But our respites was short, we established camp on harpy territory, and will we managed to repel those that were living there, the rest of their tribe is on the hunt to drive us back."
BHT_calling_for_help_nf:0 "Calling for Help"
BHT_calling_for_help_nf_desc:0 "We are deeply exhausted from our travels and cannot afford to face a new enemy all alone, we need to plead our cousin tribes for help."

BHT_end_the_harpies_nf:0 "Ending the Harpies"
BHT_end_the_harpies_nf_desc:0 "The Windfury harpies stand between us and a continued safety for our people, just one more battle, one more war, and our tribe will have a proper land to call its own."
