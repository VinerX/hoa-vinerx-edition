BHT_preparing_expedition_decisions:0 "§HPreparing the Expedition§!"
BHT_preparing_expedition_decisions_desc:0 "Leaving for Mulgore is no simple task, scouting parties and explorers estimate this should take us from §H6 months to a whole year§! at worst to reach the verdants lands. We cannot just leave like that and therefore it is important that we properly plan the expedition.§L\n\n Gathering §Gsupplies§! is the top priority, we are going to need a §Hgreat amount of food and water§! if we wish to feed everytone during this long trip. Packing extras just in case would be very wise and is highly recommended.\n Furthermore, it would be insane to leave without a substantial amount of §Oequipements§!: tools, armors and most importantly weapons will be necessary to combat any threat that we may encounter.\n Finally, thanks to our many kodo herds, we won't have to carry all of that ourselves. We need to pack the beasts with as many bags and luggages as possible to create as sizable §Cinventory§!§L.§! \n\n §HCurrent expedition inventory:§!\n§C- Available space: [?BHT_used_space]/[?BHT_inventory_size] used§!\n§G- Supplies: [?BHT_supplies] bags§!\n§O- Equipments: [?BHT_equipments] crates§!§!\n\nCurrently §H[?BHT_leaving_percentage|%H]§! (§H[?BHT_expedition_pop]k§! out of §H[?max_manpower_k]k§!) of the tribe is willing to leave for Mulgore and will consume §G[?BHT_weekly_supply_consume] supplies§! per week§!§H (1 supply / 25k tribesmember)§!§! during the expedition."

BHT_leaving_at_the_last_minute_mission:0 "Leaving at the Last Minute"
BHT_leaving_at_the_last_minute_mission_desc:0 "In three months the centaur horde will reach us, we can't afford to face them but we can take as much time as possible to prepare our exile. \n\n§RMake sure you are well prepared before leaving, you can't go back!\n\n§!§HAn unprepared expedition won't cause a game over but can result with serious §!§Rmaluses§!§H once reaching your destination!§!"
BHT_convince_to_join_decision:0 "Convince Tribesmembers"
BHT_convince_to_join_decision_desc:0 "Although the chieftain is regarded as the most pivotal figure of the tribe, some of us still believe we should stay here in the Barrens. We need to try to convince them if we don't want to leave anyone behind."
BHT_discourage_to_join_decision:0 "Discourage Tribesmembers"
BHT_discourage_to_join_decision_desc:0 "While some believe that we should all go, others think that having that many tribesmember leaving is going to endanger the whole expedition. They argue that it would be near impossible to feed every mouth while constantly being on the move and as such, some of us should stay behind."
BHT_prepare_kodos_decision:0 "Prepare Kodos"
BHT_pack_supplies_decision:0 "Pack Supplies"
BHT_load_equipment_decision:0 "Load Equipment"
BHT_leave_decision:0 "Leave Now"
BHT_leave_decision_desc:0 "We are ready to leave and will finally depart for Mulgore. \n\n§RMake sure you are well prepared before leaving, you can't go back!\n\n§!§HAn unprepared expedition won't cause a game over but can result with serious §!§Rmaluses§!§H once reaching your destination!§!"

BHT_the_long_march_decisions:0 "§HThe Long March§!"
BHT_the_long_march_decisions_desc:0 "Our tribe is on its way to reach the distant lands of Mulgore in hopes of building a better and safer future there. The path is not without struggles and challenges and its only by managing our ressources properly and keeping a high morale that we will succeed in our goal. \n\n§HCurrent expedition inventory:§!\n§C- Available space: [?BHT_used_space]/[?BHT_inventory_size] used§!\n§G- Supplies: [?BHT_supplies] bags§!\n§O- Equipments: [?BHT_equipments] crates§!\n\nCurrently §H[?BHT_expedition_pop]k§! members of the tribe are part of the expedition and consuming §G[?BHT_weekly_supply_consume] supplies§! per week§!§H (1 supply / 25k tribesmember)§!§!.\n\n§HCurrent location:§!\n[BHT_expedition_tribe_current_location]"

BHT_ration_food_decision:0 "Ration Food"
BHT_ration_food_decision_desc:0 "It is important to manage our supplies carefully, especially food, if we want to make sure that we will arrive at destination in good shape."
BHT_food_distribution_decision:0 "Distribute Food"
BHT_food_distribution_decision_desc:0 "That we have a surplus of food or not, distributing food to our tribesmember is sure to improve their mood."
BHT_gather_wild_plants_decision:0 "Gather Wild Plants"
BHT_gather_wild_plants_decision_desc:0 "The savana climate of the Barrens is still home to many kind of plants, mainly wild grains and tubers. It does not make the most savory meals, but now is not the time to be too picky."
BHT_gather_wild_plants_decision_tt:0 "§LGoing through the wilderness allows us to find more edible plants.§!"
BHT_sacrifice_kodo_decision:0 "Sacrifice Kodos"
BHT_sacrifice_kodo_decision_desc:0 "Slaying the valiant beasts that has served us well and that we have learned to love might be a great toll to the tribe's determination, but sometimes the ends justify the means. Their sacrifice won't be in vain."
BHT_boost_morale_decision:0 "Boost Morale"
BHT_boost_morale_decision_desc:0 "With his eloquence and great wisdom, the chieftain will reassure everyone's concern and bolster the will of the tribe."
BHT_prepare_braves_decision:0 "Prepare the Braves"
BHT_prepare_braves_decision_desc:0 "It's not because we are on the move that our warriors need to skip training day. It is also a good way of keeping their will to fight as high as possible."

BHT_calling_for_help_decisions:0 "Calling for Help"
BHT_calling_for_help_decisions_desc:0 "We are deeply exhausted from our travels and cannot afford to face a new enemy all alone, we need to plead our cousin tribes for help."
BHT_calling_for_help_decision:0 "Ask help from [FROM.GetName]"

BHT_offer_MIR_peace:0 "Offer peace to Mirefin Tribe"

