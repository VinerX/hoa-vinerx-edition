#events
###############################
bloodhoof.1.t:0 "The Bloodhoof Tribe"
bloodhoof.1.d:0 "It has been what seems like generations since the Tauren left the lands now known as Desolace, running away from the ever increasing and relentless onslaughts of the bloodthirsty Centaurs. Wanting nothing but to destroy and consume anything, they leave nothing but desolation, bodies and ruins in their wake. \n\nWe, the Bloodhoof, are one of the great Tauren tribes left and are led by one of the greatest Chieftain seen on Kalimdor in generations: Cairne Bloodhoof. The tribe has been roaming the Barrens for a long time now, but even the wild savanas are not safe from our ancient foes. \n\nWith the territorial and enigmatic Night Elves to the north who’ve ignored repeated calls of aid from our kin, we have been left alone to fight against the rampaging and ever encroaching Centaurs. \n\nOur brother and sister tribes share a similar fate, either scattered or surrounded by foes. But we will not fall alone and consumed by the ravenous hordes, our chieftain Cairne has a great vision, one of union and prosperity for the whole of taurenkind, all united under one flag and free from the centaur threat.\n\n Will the Bloodhoof Tribe perservere, or shall we join our ancestors in the afterlife?"
bloodhoof.1.option.1:0 "The Chieftain will lead us in these dire times."

bloodhoof.2.t:0 "The Chieftain"
bloodhoof.2.d:0 "Strong, wise, fearless, these are the words often used to describe Cairne Bloodhoof, mighty chieftain of the tribe that carry his name. A peerless leader, revered by allies and foes alike, Cairne is known to never back down when it comes to taking care of his brethren. Even the weight of time passing hasn't deprived the chieftain from its strength. Deeply wishful for his kind to find a place to call home and live in peace, the chieftain has remained hopeful through these dire times. \n\nLately however, Cairne has been growing more troubled. The Centaurs raids, especially of the Kolkar tribe, have become more and more frequent, and rumors of a great horde coming from the west have hindered the tribe's moral. The chieftain has therefore..."
bloodhoof.2.option.1:0 "...decided to prepare the braves for battle."
bloodhoof.2.option.2:0 "...reassured the tribe about the times to come."
bloodhoof.2.option.3:0 "...ordered to load up the caravans, just in case."

bloodhoof.3.t:0 "The Raids"
bloodhoof.3.d:0 "Ever since our ancestors left the lands of Mashan'she, known today as Desolace, so did the centaur hordes, tracking our kind through the Stonetalon Mountains and now in the lush savannas and oasis of the Barrens. \n\nBut unlike us, taurens, the centaurs do not respects the rites and customs of the Earthmother. In every land they conquer and settle, wildlife suffers. Taking no care to preserve the flora and fauna, the ravenous centaurs murder relentlessly. Their growing presence so close to us have led more and more of our hunting parties to come back home empty-handed due to the decreasing amount of ressources. \n\nBut if that was the only problem, the centaurs also raid multiple of our settlements on a regular basis, murdering and pillaging everything they can get their filthy hands onto. In the last months, the border frictions have alarmingly increased and so did the frequency of their raids. One of the last raid hit Bloodhoof Camp hard, the loss of life and ressources was great, but we managed to repel them. Most importantly, we..."
bloodhoof.3.option.1:0 "...got our hands on their battleplans."
bloodhoof.3.option.2:0 "...captured some equipment."
bloodhoof.3.option.3:0 "...made a great dent in their numbers."

bloodhoof.4.t:0 "Approaching Danger"
bloodhoof.4.d:0 "This morning at dawn, the tribe witnessed a terrible sight, a caravan of refugees arrived at Camp Bloodhoof. In a very bad shape, covered in blood and having received multiple injuries, our newly arrived brethren were quickly taken care of by our healers. At the end of the day, most of them were recovering well from their wounds.\n\n However, they also came bearing frightful news, reports from the west of centaurs amassing in great numbers under the banner of [KOL.GetLeader] of the Kolkar Clan. The refugees explained how the centaur horde was growing in numbers each day and ravaging anything in their path. But most importantly, they were marching east, towards us. The rumors were indeed true and our worst fear had became reality.\n\n Learning this, chieftain Cairne Bloodhoof decided to retreat in his tent to think on the matter. For hours he tried to converse with the spirits of his ancestors, asking for advices in what to come. Many hours of pondering later, two choice stuck out in his mind. Either the Bloodhoof Tribe would have to make the long and dangerous trip to the promised lands of Mulgore, just like much of their cousin tribe had done already. Or they would stay here in the Barrens and try their best to survive the incoming waves of bloodthirsty centaurs. Both options could have been considered suicidal, but a choice had to be made. After some time, Cairne stood up and came out his tent, announcing to his tribe..."
bloodhoof.4.option.1:0 ""Prepare the caravans, we leave for Mulgore!""
bloodhoof.4.option.1.d:0 "§GThe Bloofhood Tribe will prepare to leave for Mulgore.§!\n§HUnlock the corresponding focus tree branch.§!"
bloodhoof.4.option.2:0 ""Alert the braves and get ready, we make our stand here!""
bloodhoof.4.option.2.d:0 "§GThe Bloofhood Tribe will try its best to survive the centaur horde.§!\n§HUnlock the corresponding focus tree branch.§!"

bloodhoof.5.t:0 "Getting Prepared"
bloodhoof.5.d:0 "The Chieftain has decided that the tribe will prepare to leave for Mulgore, just like somes of our cousin tribes did already, but this will be no easy task. We can't just walk there, it's a long and dangerous trip which requires us to go through enemy territory.\n\nWhile the centaurs have been a threat for a long time now, we can't also the ignore the Quilboars and Harpies that inhabit the Barrens and can prove themselves to be equally dangerous foes. And that's without taking into account the wildlife, bloodthirsty hyenas, prowling lions and other creatures alike.\n\n This is why we need to prepare a proper expedition, we will gather ressources and ready ourselves for the coming exile. It will take some time, but it's better to leave ready and prepared than to go blindly face the danger."
bloodhoof.5.option.1:0 "Let's pack the kodos."
bloodhoof.5.option.1.d:0 "§RThe Kolkar Horde will arrive in 3 months and we will be forced to leave.§!\n§HUnlock Preparing Expedition decisions.§!"

bloodhoof.10.t:0 "A Peaceful Resolution"
bloodhoof.10.d:0 "The Bloodhoof Chieftain has offered us a peace, he has deemed as long as we remain outside the barrens he and his tribe will leave us alone."
bloodhoof.10.option.1:0 "Mrgl'luru"
bloodhoof.10.option.1.d:0 "Will accept a peace from the Bloodhoof but lose our land in the Barrens."
bloodhoof.10.option.2:0 "Mrglglglgl"
bloodhoof.10.option.2.d:0 "Will Continue the War with Bloodhoof"

##########################################################
# Events 50 to 99 are reserved for Long March event chain
##########################################################

bloodhoof.50.t:0 "The Long March Begins"
bloodhoof.50.d:0 "  The Sun was still hardly showing on the horizon that the tribe was ammassing on the western edge of the camp. Some people were still packing the last remaining bags of equipment on the back of kodos, the strong beasts undisturbed by the increasing weight. Minds were filled with a mix of fear, worry and a bit of sorrow but also with hope and determination. In the end, should we die or reach the plains of Mulgore, we would do it together.\n\n    Cairne Bloodhoof was overlooking the scene on a small promontory, watching his people, all brothers and sisters to him, busy getting the final preparations done. Just as everyone else, doubt and hope were clashing in his mind. But his thoughts were suddenly disturbed by a voice:\n\n'My Chieftain, the preparation are done, the tribe is ready to leave.'\n\nWithout a word, Cairne hailed his people and proceeded to join the front of the now formed expedition. This was not the time for a great speech, every tribesmember knew what they were getting into. Yet a question remained, one that might have been seen as insignificant but which was actually of great importance...\n\n'Chieftain, shall we follow the roads or carve our own path within the savana?'"
bloodhoof.50.option.1:0 "'We will follow the roads.''"
bloodhoof.50.option.1.d:0 "§H'We should reach Mulgore faster that way.'§!"
bloodhoof.50.option.2:0 "'We will walk the wild path of Earthmother.'"
bloodhoof.50.option.2.d:0 "§H'This might prove to be safer.'§!"

bloodhoof.51.t:0 "Quilboar Patrol"
bloodhoof.51.d:0 "WORK IN PROGRESS"
bloodhoof.51.option.1:0 "Our braves intimidates them and they flee."
bloodhoof.51.option.2:0 "The Chieftain negotiate with them."
bloodhoof.51.option.3:0 "We engage into a fight and drive them away."

bloodhoof.52.t:0 "Pack of Prowlers"
bloodhoof.52.d:0 "WORK IN PROGRESS"
bloodhoof.52.option.1:0 "Their claw would make fine daggers."
bloodhoof.52.option.1.d:0 "§HWe will attack the prowlers.§!"
bloodhoof.52.option.2:0 "Throw some food so they leave us alone."

bloodhoof.53.t:0 "Hunting the Hunters"
bloodhoof.53.d:0 "WORK IN PROGRESS"
bloodhoof.53.option.1:0 "The felines of the barrens are not to be underestimated."

bloodhoof.54.t:0 "The First Oasis"
bloodhoof.54.d:0 "WORK IN PROGRESS"
bloodhoof.54.option.1:0 "Focus on resting."
bloodhoof.54.option.2:0 "Focus on gathering supplies."
bloodhoof.54.option.3:0 "Focus on repairing our equipment."

bloodhoof.55.t:0 "Leaving the Oasis"
bloodhoof.55.d:0 "WORK IN PROGRESS"
bloodhoof.55.option.1:0 "It is time to go."

bloodhoof.56.t:0 "Goblin Merchants"
bloodhoof.56.d:0 "WORK IN PROGRESS"
bloodhoof.56.option.1:0 "+1 equipment for -2 supply."
bloodhoof.56.option.2:0 "+2 supply for -1 equipment."
bloodhoof.56.option.3:0 "+3 supply and +2 equipment for -1 kodo."
bloodhoof.56.option.4:0 "We have nothing to spare."

bloodhoof.57.t:0 "The Trade"
bloodhoof.57.d:0 "WORK IN PROGRESS"
bloodhoof.57.option.1:0 "We didn't manage to haggle better prices."
bloodhoof.57.option.2:0 "The Chieftain use his eloquence to turn the trade in our favor."

bloodhoof.58.t:0 "Raptor Pack"
bloodhoof.58.d:0 "WORK IN PROGRESS"
bloodhoof.58.option.1:0 "I've heard raptor meat taste good..."
bloodhoof.58.option.1.d:0 "§HWe engage combat with the creatures...§!"
bloodhoof.58.option.2:0 "Have our hunters befriend the beasts."
bloodhoof.58.option.2.d:0 "§HThey will try their best to pacify the raptors...§!"

bloodhoof.59.t:0 "Feeding off the Wild"
bloodhoof.59.d:0 "WORK IN PROGRESS"
bloodhoof.59.option.1:0 "It does taste good!"

bloodhoof.60.t:0 "Befriending the Wild"
bloodhoof.60.d:0 "WORK IN PROGRESS"
bloodhoof.60.option.1:0 "We've got some new friends."
bloodhoof.60.option.1.d:0 "§HThis decision might have consequences...§!"

bloodhoof.61.t:0 "The Harpies"
bloodhoof.61.d:0 "WORK IN PROGRESS"
bloodhoof.61.option.1:0 "We have no choice but to make a detour."
bloodhoof.61.option.2:0 "Let's pay the toll with some supplies"
bloodhoof.61.option.3:0 "The chieftain convinces them that we bring no harm."
bloodhoof.61.option.4:0 "The encounter escalates into a fight."
bloodhoof.61.option.4.d:0 "§RWe fight our way throught the harpies...§!"

############

bloodhoof.100.t:0 "Bloodhoof Tribe calls for help!"
bloodhoof.100.d:0 "The Bloodhoof Tribe, one of our cousin tauren tribe has recently migrated to Mulgore and decided to settle on the great Thunder Bluffs that towers the plains of Mulgore. In doing so, they were attacked by the harpies originally inhabiting the areas and the fight still rages on to this day. They are exhausted from their long trip and therefore they ask us for help in order to reppel the harpies from their newfound camp."
bloodhoof.100.option.1:0 "We shall join the fight on their side."
bloodhoof.100.option.2:0 "Send them some of our finest braves."
bloodhoof.100.option.2.d:0 "§H[BHT.GetNameWithFlag]§! will receive one §H10 width division§! of footmen."
bloodhoof.100.option.3:0 "We will deliver equipment. "
bloodhoof.100.option.4:0 "They shouldn't have settled here in the first place."
bloodhoof.100.option.4.d:0 "§RNothing will be done to help§! §H[BHT.GetNameWithFlag]§!."

bloodhoof.101.t:0 "The Founding of Thunder Bluff"
bloodhoof.101.d:0 ""
bloodhoof.101.option.1:0 "The beginning of a new dawn."

bloodhoof.102.t:0 "The [BHT.GetName] offer to join them"
bloodhoof.102.d:0 "The [BHT.GetName], our neighbor, as offered us to join them as integral member of their tribe. They claim that by working together, us taurens will have better chances to survive in this cruel world."
bloodhoof.102.option.1:0 "We graciously accept."
bloodhoof.102.option.2:0 "Not possible, sorry."

bloodhoof.103.t:0 "[FROM.GetName] refuse our offer"
bloodhoof.103.d:0 "The [FROM.GetName] has refused our offer to join our tribe."
bloodhoof.103.option.1:0 "Unfortunate..."
bloodhoof.103.option.2:0 "Sadly we cannot let this slip."

bloodhoof.104.t:0 "[BHT.GetName] ask to join our Defensive Pact"
bloodhoof.104.d:0 "The tauren of the [BHT.GetName] has asked us if we would be willing to welcome them into our Defensive Pact."
bloodhoof.104.option.1:0 "Of course!"
bloodhoof.104.option.2:0 "We must decline."

bloodhoof.105.t:0 "Our own Faction"
bloodhoof.105.d:0 "We have decided to create our own faction to safeguard our position in the world. But what should its name be?"
bloodhoof.105.option.1:0 "Tauren Federation"
bloodhoof.105.option.2:0 "Central Kalimdor Alliance"
bloodhoof.105.option.3:0 "Union of Kalimdor"
bloodhoof.105.option.4:0 "Thunderhoof Coalition"

