 shaman_equipment_desc:0 ""
 shaman_tech:0 "Shaman"
 shaman_tech_desc:0 ""
 shaman_tech_unit_details_tt:0 "\nShamans offer ranged damage and pressure, contesting fast or aerial enemies. Though poor against most walking infantry and unable to pierce armored targets, they also bear a respectable defensive profile.\n\n§HClass:§! Ranged\n§GStrengths:§! Light Cavalry, Pierced Armored Targets, Enemy Air Support, High Hard Attack, Good Air Attack, Low Cost\n§RWeaknesses:§! Unpierced Armored Targets, Infantry and Unarmored Targets, No Piercing, Poor Offense When Alone"
 shaman_equipment_tech_1:0 "Shaman Equipment"
 shaman_equipment_1:0 "Shaman Equipment"
 shaman_equipment_1_desc:0 ""
 shaman_cleansing_waves:0 "Cleansing Waves"
 shaman_cleansing_waves_desc:0 "The waves of the sea are a calming sight to all who gaze upon them, but they will run in terror as the waves begin to engulf their boats and homes."
