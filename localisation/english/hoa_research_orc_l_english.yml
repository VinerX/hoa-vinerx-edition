 orc_barracks_tech:0 "Orc Barracks"
 orc_barracks_tech_desc:0 "The orc barracks are where orc melee units are trained."

 grunt_equipment:0 "Grunt Equipment"
 grunt_tech:0 "Grunts"
 grunt_tech_desc:0 ""
 grunt_tech_unit_details_tt:0 "\nGrunts make up the bulk of our forces, reliable units best suited for holding ground and filling gaps in the frontline.\n\n§HClass:§! Infantry\n§GStrengths:§! High Defense, High Organization, Somewhat Low Cost, Flexibility\n§RWeaknesses:§! Cavalry and Armored Targets, Low Hard Attack, Somewhat Mediocre Offense"
 grunt_equipment_tech_1:0 "Grunt Equipment"
 grunt_equipment_1:0 "Grunt Equipment"
 grunt_equipment_1_desc:0 ""
 berserker_strength_tech:0 "Berserker Strength"
 berserker_strength_tech_desc:0 ""
 reinforced_plates_tech:0 "Reinforced Plates"
 reinforced_plates_tech_desc:0 ""
 grunt_equipment_2:0 "Grunt Equipment II"
 grunt_equipment_2_desc:0 ""
 cleaving_swings_tech:0 "Cleaving Swings"
 cleaving_swings_tech_desc:0 ""
 concussive_blows_tech:0 "Concussive Blows"
 concussive_blows_tech_desc:0 ""
 grunt_equipment_3:0 "Grunt Equipment III"
 grunt_equipment_3_desc:0 ""

 overseer_tech:0 "Overseers"
 overseer_tech_desc:0 ""
 overseer_tech_unit_details_tt:0 "\nOverseers increase our §0Initiative§!, allowing for quicker planning and improved coordination, and our §7Suppression§!, improving the ability of divisions to handle resistance.. They also provide other minor bonuses in combat."
 improved_overseer_1:0 "Improved Overseers I"
 improved_overseer_1_desc:0 ""
 improved_overseer_2:0 "Improved Overseers II"
 improved_overseer_2_desc:0 ""
 improved_overseer_3:0 "Improved Overseers III"
 improved_overseer_3_desc:0 ""
 improved_overseer_4:0 "Improved Overseers IV"
 improved_overseer_4_desc:0 ""

 spearman_equipment:0 "Spearman Equipment"
 spearman_equipment_desc:0 ""
 spearman_tech:0 "Spearman"
 spearman_tech_desc:0 ""
 spearman_tech_unit_details_tt:0 "\nSpearmen trade axes for spears, foregoing some offense and the heavier armor of Grunts for weapons that can strike aerial enemies and excel against fast or hard targets.\n\n§HClass:§! Infantry\n§GStrengths:§! Cavalry and Targets with High Hardness, Solid Defense, High Organization, Decent Air Attack, Low Cost\n§RWeaknesses:§! Armored Enemies, Low Breakthrough, Low Armor"
 spearman_equipment_tech_1:0 "Spearman Equipment"
 spearman_equipment_1:0 "Spearman Equipment"
 spearman_equipment_1_desc:0 ""
 spearman_Impaling_thrusts:0 "Impaling Thrusts"
 spearman_Impaling_thrusts_desc:0 "Many of our Spearman have sound that impaling their spears into their Foes and moving onto the next one is much more to their liking."
 spearman_precision_javelins:0 "Precision Javelins"
 spearman_precision_javelins_desc:0 "The many winged beasts from our homeland are either prey or predator, either way a well aimed shot it all that is needed to ground such creatures."
 spearman_equipment_2:0 "Spearman Equipment II"
 spearman_equipment_2_desc:0 ""
 spearman_chain_coat:0 "Chain Coats"
 spearman_chain_coat_desc:0 "A large fuss was of the lack of protection our spearman had, even after giving them the armor they desired they still objected to its weight."
 spearman_explosive_spears:0 "Explosive Tips"
 spearman_explosive_spears_desc:0 "Using a blackpowder developed by the blackrock we have a better solution to more heavily armored opponents, it might not be strong enough to take down a heavily armored raider, but his wolf will not be safe from impact."
 spearman_equipment_3:0 "Spearman Equipment III"
 spearman_equipment_3_desc:0 ""

 dire_orc_equipment:0 "Dire Orc Equipment"
 dire_orc_equipment_desc:0 ""
 dire_orc_tech:0 "Dire Orcs"
 dire_orc_tech_desc:0 ""
 dire_orc_tech_unit_details_tt:0 "\nDire Orcs act as slow, offense-focused heavy infantry for our forces, foregoing the normally defensive profile of Grunts or similar units for Hardness and pushing potential, especially against softer targets.\n\n§HClass:§! Infantry\n§GStrengths:§! High Breakthrough, Decent Soft Attack, Hardness, High Organization, Somewhat Low Cost\n§RWeaknesses:§! Armored Enemies, Very Low Defense, Low Armor"
 dire_orc_equipment_tech_1:0 "Dire Orc Equipment"
 dire_orc_equipment_1:0 "Dire Orc Equipment"
 dire_orc_equipment_1_desc:0 ""
 dire_orc_hulking_blow:0 "Hulking Blows"
 dire_orc_hulking_blow_desc:0 ""
 dire_orc_war_paint:0 "Enchanted War Paints"
 dire_orc_war_paint_desc:0 "By imbuing Magic into the War paints that are drawn onto the dire orcs of our clans we can provide them with better protection, while not needing to worry about them ripping armor off in the middle of battle."
 dire_orc_equipment_2:0 "Dire Orc Equipment II"
 dire_orc_equipment_2_desc:0 ""
 dire_orc_bloodlust:0 "Bloodlust"
 dire_orc_bloodlust_desc:0 "We dont know if it was the Shamans or the Warlocks to blame for this advancement, as it would seem that the Dire Orcs have begun causing even those around them to go into bouts of rage similar to their own..."
 dire_orc_oversized_armor:0 "Oversized Armor"
 dire_orc_oversized_armor_desc:0 "We keep having Dire Orcs returning from the front with Arrows lodged in their Necks, the sheer muscularity makes removing them to tend to wounds near impossible, as such we are fitting them with armor around their necks and shoulders, They also act as restraint points should we need to wrangle them into submission."
 dire_orc_equipment_3:0 "Dire Orc Equipment III"
 dire_orc_equipment_3_desc:0 ""

 orc_temple_of_the_damned_tech:0 "Temple of the Damned"
 orc_temple_of_the_damned_tech_desc:0 ""

 warlock_equipment:0 "Warlock Equipment"
 warlock_equipment_desc:0 ""
 warlock_tech:0 "Warlock"
 warlock_tech_desc:0 ""
 warlock_tech_unit_details_tt:0 "\nWarlocks provide great ranged support, contesting fast or heavily armored units and aerial enemies. Though poor against most walking infantry, they deal heavy damage to both cavalry and hard targets.\n\n§HClass:§! Ranged\n§GStrengths:§! Cavalry and Hard Targets, Heavily Armored Targets, Enemy Air Support, Very High Hard Attack and Piercing, Good Air Attack\n§RWeaknesses:§! Low Defense, Very Vulnerable Alone"
 warlock_equipment_tech_1:0 "Warlock Equipment"
 warlock_equipment_1:0 "Warlock Equipment"
 warlock_equipment_1_desc:0 ""
 warlock_litany_of_curses:0 "Litany of Curses"
 warlock_litany_of_curses_desc:0 "Our Warlocks are well versed in dozens of curses, each one worse then the last. The Warlocks will turn any opponent on the fields of battle into a screaming mess."
 warlock_waves_of_destruction:0 "Waves of Destruction"
 warlock_waves_of_destruction_desc:0 ""
 warlock_equipment_2:0 "Warlock Equipment II"
 warlock_equipment_2_desc:0 ""
 warlock_demon_minions:0 "Demon Minions"
 warlock_demon_minions_desc:0 "Binding Lesser Demons to do the bidding of our warlocks was the next step to true mastery of the Fel arts."
 warlock_felstorm:0 "Felstorm"
 warlock_felstorm_desc:0 "The battlefield will be a wash with fire, none shall escape the power bestowed upon us by our masters."
 warlock_equipment_3:0 "Warlock Equipment III"
 warlock_equipment_3_desc:0 ""

 necrolyte_tech:0 "Necrolyte"
 necrolyte_tech_desc:0 ""
 necrolyte_tech_unit_details_tt:0 "\nNecrolytes raise some of our fallen troops from the dead! This increases our §6Trickleback§! and decreases the §GExperience Loss§! when our divisions take casualties. It also improves our population's willingness to fight wars in spite of casualties."
 improved_necrolyte_1:0 "Improved Necrolyte"
 improved_necrolyte_1_desc:0 ""
