 great_hall:0 "Great Hall"
 great_hall_desc:0 "Great halls serve as the primary centers for most orcish settlements. It houses the chieftain, warriors, and craftsmen, symbolizing the strength and unity of the clan."
 stronghold_tech:0 "Stronghold"
 stronghold_tech_desc:0 "The Stronghold stands as a formidable testament to the strength and resilience of the clan, serving as a bastion of power and a symbol of our unwavering determination in the face of adversity."
 fortress_tech:0 "Fortress"
 fortress_tech_desc:0 "The Fortress, a towering edifice, embodies the unyielding might of the clan. With its imposing walls and strategic vantage points, it serves as the ultimate bastion of power and a resounding symbol of our dominance."

 peon_tech:0 "Peons"
 peon_tech_desc:0 "Peons, the stalwart laborers of the Horde, toil tirelessly to gather resources and construct mighty structures. Their dedication fuels our expansion and ensures our dominance on the battlefield."
 peon_tech_unit_details_tt:0 "\nPeons increase our §8Entrenchment§! by creating makeshift defenses through backbreaking work. They also grant us bonuses in some specific terrain."

