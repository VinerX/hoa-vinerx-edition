l_english:
 # --- Startup ---
 northern_war.1.t:0 "Northern War Init"
 northern_war.1.d:0 "Northern War system initialised."
 northern_war.1.option:0 "OK"

 # --- Monthly pulses ---
 northern_war.2.t:0 "Northern War Monthly"
 northern_war.2.d:0 "QUE monthly pulse."
 northern_war.2.option:0 "OK"

 northern_war.3.t:0 "Northern War Monthly"
 northern_war.3.d:0 "AMA monthly pulse."
 northern_war.3.option:0 "OK"

 # --- Runestone destroyed ---
 northern_war.10.t:0 "Runestone Destroyed"
 northern_war.10.d:0 "Our warriors have toppled one of the elven Runestones! The very foundations of Quel'Thalas's arcane defences tremble. Every stone we shatter brings us closer to Silvermoon."
 northern_war.10.option:0 "The elves' magic crumbles before us!"
 northern_war.10.option.2:0 "..."

 northern_war.11.t:0 "A Runestone Has Fallen"
 northern_war.11.d:0 "Dire news from the front — the Amani have destroyed one of our Runestones! The Ban'dinoriel barrier weakens with each stone they topple. Our mana reserves have taken a catastrophic blow."
 northern_war.11.option:0 "Reinforce the remaining stones at all costs!"

 # --- Ban'dinoriel activation ---
 northern_war.20.t:0 "The Ban'dinoriel Rises"
 northern_war.20.d:0 "The Convocation has channelled the power of the Sunwell into the ancient Runestones. The great barrier — Ban'dinoriel, the Gatekeeper — now envelops Silvermoon in an impenetrable shield of arcane light. Let the Horde break themselves against it."
 northern_war.20.option:0 "Silvermoon shall never fall!"

 northern_war.24.t:0 "The Elves Raise Their Barrier"
 northern_war.24.d:0 "The high elves have activated their great magical shield — the Ban'dinoriel. Our scouts report an impenetrable wall of arcane energy surrounding Silvermoon. Our siege engines are useless against it."
 northern_war.24.option:0 "Then we break their Runestones first!"

 northern_war.42.t:0 "The Barrier Is Active"
 northern_war.42.d:0 "The elves of Quel'Thalas have raised the Ban'dinoriel barrier around their capital. The dragons' fire alone cannot penetrate it — not yet."
 northern_war.42.option:0 "We need more information."

 # --- Ban'dinoriel shattered ---
 northern_war.21.t:0 "The Ban'dinoriel Shatters"
 northern_war.21.d:0 "The barrier is broken! The Ban'dinoriel, Quel'Thalas's greatest defence, has collapsed into a cascade of dissipating arcane shards. Silvermoon lies vulnerable — for the first time in millennia."
 northern_war.21.option:0 "Evacuate the outer districts immediately!"

 northern_war.22.t:0 "Ban'dinoriel Depleted"
 northern_war.22.d:0 "The Sunwell can sustain the barrier no longer. The Ban'dinoriel flickers and dies, its arcane matrix drained of power. It will be at least six months before we can attempt to raise it again."
 northern_war.22.option:0 "We must hold without the barrier."

 northern_war.25.t:0 "The Barrier Is Broken!"
 northern_war.25.d:0 "The great elven barrier — Ban'dinoriel — has collapsed! Our shamans confirm the arcane energies have dissipated entirely. Silvermoon is exposed! Forward, for Zul'jin! Forward, for the Amani!"
 northern_war.25.option:0 "Charge! To Silvermoon!"

 northern_war.43.t:0 "The Barrier Has Fallen"
 northern_war.43.d:0 "The elven barrier around Silvermoon has collapsed. The path to the Sunwell lies open."
 northern_war.43.option:0 "Prepare the dragons."

 # --- Ban'dinoriel cooldown ---
 northern_war.23.t:0 "Ban'dinoriel Available"
 northern_war.23.d:0 "The arcane matrix has stabilised. The Convocation reports that the barrier can be raised again — should we have the mana to sustain it."
 northern_war.23.option:0 "The Gatekeeper stands ready."

 # --- LOA ---
 northern_war.50.t:0 "The Loa Answer!"
 northern_war.50.d:0 "The drums echo through Zul'Aman as the Loa descend upon the battlefield! Mighty Akil'dan and his brethren lend their power to our warriors. The elves shall know true fear this day."
 northern_war.50.option:0 "Blood for the Loa!"

 # --- BRC campaign ---
 northern_war.70.t:0 "The Quel'Thalas Campaign"
 northern_war.70.d:0 "Warchief Doomhammer has ordered the full invasion of Quel'Thalas. The Amani have opened the forest paths. The Stormreaver clan is to harvest the Runestones. The Dragonmaw will stage from captured coastal settlements. Quel'Thalas shall burn."
 northern_war.70.option:0 "For the Horde!"

 northern_war.71.t:0 "Stormreaver Betrayal — Reassigning Provinces"
 northern_war.71.d:0 "With Gul'dan's Stormreavers abandoning the campaign, their captured provinces must be reassigned among the remaining Horde forces."
 northern_war.71.option:0 "Divide the spoils."

 # --- Caer Darrow ---
 northern_war.80.t:0 "Caer Darrow Runestone Destroyed"
 northern_war.80.d:0 "The ancient elven runestone at Caer Darrow has been shattered! The fortress's arcane protections collapse as we harvest its power. The elves of Quel'Thalas feel the loss even from afar."
 northern_war.80.option:0 "Ancient power is now ours!"

 northern_war.81.t:0 "Caer Darrow Runestone Lost"
 northern_war.81.d:0 "Dire news from Lordaeron — the ancient runestone at Caer Darrow has been destroyed by the Horde. Though distant, each runestone is part of the greater network that shields our kingdom."
 northern_war.81.option:0 "Another piece of our heritage lost."

 northern_war.82.t:0 "Quel'Thalas Requests Caer Darrow"
 northern_war.82.d:0 "An emissary from Silvermoon has arrived with an unusual request: the elves wish to study and harness the ancient runestone beneath Caer Darrow. They claim it is part of the same network that protects Quel'Thalas — and that its power could be vital in the war against the Horde."
 northern_war.82.option:0 "Grant them access. The Alliance must stand together."
 northern_war.82.option.2:0 "This is Lordaeron's heritage. Refuse."

 # --- DMC ---
 northern_war.40.t:0 "Runestone Power Detected"
 northern_war.40.d:0 "Our warlocks have detected a surge of untamed arcane energy — an elven Runestone has been destroyed nearby. This raw power can be harnessed for our own purposes. Gul'dan was right about their potential."
 northern_war.40.option:0 "Harness this power for the Dragonmaw!"

 # --- DAL ---
 northern_war.60.t:0 "Arcane Anomaly Detected"
 northern_war.60.d:0 "The Kirin Tor's sensors have registered a catastrophic arcane disturbance in Quel'Thalas — a Runestone has been destroyed. The Resonance Cascade is disrupting our own magical research. We must investigate."
 northern_war.60.option:0 "Send an expedition to assess the damage."

 northern_war.61.t:0 "The Ban'dinoriel Is Gone"
 northern_war.61.d:0 "The great barrier of Quel'Thalas has collapsed. The arcane shockwave was felt as far as Dalaran. While this is a disaster for our elven allies, the data we are gathering on the resonance cascade is... unprecedented."
 northern_war.61.option:0 "For the Kirin Tor — study everything."

 # --- QUE zone spirits ---
 QUE_southern_defense:0 "Holding the Southern Forests"
 QUE_southern_defense_desc:0 "Our forces maintain control of the Thalassian Pass and southern approaches. Defensive positions are established in the deep woods."

 QUE_runestone_bastion:0 "Runestone Bastion"
 QUE_runestone_bastion_desc:0 "The Runestone Line holds firm. Our sorcerers reinforce the arcane wards daily, maintaining the magical buffer that weakens enemy spellcasters."

 QUE_farstrider_patrols:0 "Farstrider Patrols Active"
 QUE_farstrider_patrols_desc:0 "Ranger-General Sylvanas Windrunner's Farstriders dominate the forest routes. Enemy movements are tracked and countered before they can threaten the interior."

 QUE_approaches_threatened:0 "Silvermoon Under Threat"
 QUE_approaches_threatened_desc:0 "The Horde is at our gates. Evacuation of outlying villages is underway, and every able-bodied elf has been called to defend the capital."

 QUE_ban_dinoriel_barrier:0 "Ban'dinoriel: The Gatekeeper"
 QUE_ban_dinoriel_barrier_desc:0 "The great arcane barrier powered by the Sunwell envelops Silvermoon. No conventional army can breach it. However, maintaining this shield drains our mana reserves rapidly."

 QUE_ban_dinoriel_shattered:0 "Ban'dinoriel Shattered"
 QUE_ban_dinoriel_shattered_desc:0 "The barrier is gone. Its collapse has demoralised our people and exposed the heart of Quel'Thalas. It will take months for the Runestone network to stabilise enough to attempt re-activation."

 # --- AMA zone spirits ---
 AMA_southern_ambush:0 "Ambush in the Southern Forests"
 AMA_southern_ambush_desc:0 "Our headhunters and shadow hunters dominate the border woodlands. Elven patrols are slaughtered before they can report back."

 AMA_runestone_assault:0 "Assaulting the Runestone Line"
 AMA_runestone_assault_desc:0 "We have penetrated the Runestone Line. Our witch doctors work to corrupt the ancient wards while our warriors push deeper into elven territory."

 AMA_farstrider_ambush:0 "Corrupted Ley Lines"
 AMA_farstrider_ambush_desc:0 "We have desecrated the Farstrider routes, corrupting the ley lines that the elves use for communication and rapid travel. Their rangers are blind."

 AMA_approaches_siege:0 "Siege of Silvermoon"
 AMA_approaches_siege_desc:0 "The elven capital is within sight! Our warbands have surrounded Silvermoon. The final assault will crush these arrogant elves once and for all."

 AMA_loa_empowered:0 "Empowered by the Loa"
 AMA_loa_empowered_desc:0 "The spirits of our ancestors walk among us. The Loa have answered Zul'jin's call, lending their unfathomable power to our warriors. No elf can stand against us now."

 # --- DMC spirit ---
 DMC_runestone_power:0 "Runestone Resonance"
 DMC_runestone_power_desc:0 "The destruction of elven Runestones has released raw arcane energy that our warlocks can channel. Our spellcasters and dragon riders grow stronger with each shattered stone."

 # --- DAL spirits ---
 DAL_arcane_crisis:0 "Arcane Resonance Crisis"
 DAL_arcane_crisis_desc:0 "The destruction of Quel'Thalas's Runestones has sent shockwaves through the ley lines. The Kirin Tor's magical research is disrupted — but this is also an unprecedented opportunity for study."

 DAL_shattered_barrier:0 "The Shattered Gatekeeper"
 DAL_shattered_barrier_desc:0 "The collapse of Quel'Thalas's Ban'dinoriel has provided the Kirin Tor with priceless data on large-scale barrier magic. While a tragedy for our allies, the knowledge gained is immeasurable."

 # --- Decision categories ---
 northern_war_amani_category:0 "Eversong War — Amani Operations"
 northern_war_que_category:0 "Eversong War — Quel'Thalas Defence"

 # --- Mana display ---
 QUE_nw_mana_display:0 "Solar Mana: [?QUE_mana_reserve]"
 QUE_nw_mana_display_desc:0 "Mana reserves drawn from the Sunwell.\nRegenerates +5/month while Sunwell is controlled.\n+3/month from Caer Darrow runestone (if intact).\n+2/month while Runestone Line is undamaged.\n\nRunestones destroyed: [?nw_runestones_destroyed] / 3"

 # --- Barrier display ---
 QUE_nw_barrier_display:0 "Ban'dinoriel Status"
 QUE_nw_barrier_display_desc:0 "The Gatekeeper barrier shields Silvermoon from assault.\n§GActive§! — drains 10 mana/month.\n§RShattered§! — unavailable for 6 months after collapse.\nRunestones intact: [?nw_runestones_destroyed] / 3 destroyed."

 # --- Mana cost text (shown on decision button) ---
 QUE_nw_mana_cost_text:0 "[?temp_mana_cost|+] §Gmana§!"
 QUE_nw_mana_cost_text_blocked:0 "[?temp_mana_cost|-] §Rmana§!"

 # --- Opinion modifiers ---
 LOR_quelthalas_runestone_aid:0 "Runestone Research Aid"
 LOR_quelthalas_runestone_refused:0 "Refused Runestone Access"

 # --- AMA decisions ---
 AMA_destroy_runestone_thasalah:0 "Destroy Runestone at Thas'alah"
 AMA_destroy_runestone_thasalah_desc:0 "The Runestone at Thas'alah anchors the Ban'dinoriel in the Ghostlands. Shatter it, and the elven barrier will weaken."

 AMA_destroy_runestone_moon:0 "Destroy Runestone at Sanctum of the Moon"
 AMA_destroy_runestone_moon_desc:0 "This Runestone channels lunar magic into the barrier. Its destruction will blind the elves' arcane sentinels."

 AMA_destroy_runestone_sun:0 "Destroy Runestone at Sanctum of the Sun"
 AMA_destroy_runestone_sun_desc:0 "The solar Runestone fuels the barrier's searing radiance. Topple it, and darkness falls on the elven defences."

 AMA_destroy_runestone_caerdarrow:0 "Destroy the Caer Darrow Runestone"
 AMA_destroy_runestone_caerdarrow_desc:0 "An ancient elven runestone stands in the fortress of Caer Darrow on Lordamere Lake. Its destruction will send a shockwave through the entire network."

 AMA_call_loa:0 "Call Upon the Loa"
 AMA_call_loa_desc:0 "Summon the great Loa spirits of Zul'Aman to empower our warriors. The sacred grounds must be fully under our control for the ritual to work."

 AMA_corrupt_leyline:0 "Corrupt Farstrider Ley Lines"
 AMA_corrupt_leyline_desc:0 "Our witch doctors can poison the magical pathways the elves use to coordinate their rangers. Their precious Farstriders will be deaf and blind."

 AMA_open_path:0 "Open the Path for the Horde"
 AMA_open_path_desc:0 "With the Southern Forests secured, we can guide the Horde's main army through the forest paths and begin the province transfers."

 AMA_loot_shandor:0 "Loot the Vaults of Runestone Shan'dor"
 AMA_loot_shandor_desc:0 "Runestone Shan'dor contains elven magical artefacts. Looting it will drain their mana reserves and enrich our own shamans."

 AMA_loot_falithas:0 "Loot the Vaults of Runestone Falithas"
 AMA_loot_falithas_desc:0 "Runestone Falithas holds ancient elven relics. Plunder its vaults to weaken Quel'Thalas's arcane reserves."

 # --- QUE decisions ---
 QUE_activate_barrier:0 "Activate the Ban'dinoriel Barrier"
 QUE_activate_barrier_desc:0 "Channel the Sunwell's power through the Runestone network to raise the Great Barrier around Silvermoon. Requires significant mana reserves and eternal vigilance."

 QUE_reinforce_thasalah:0 "Reinforce Runestone at Thas'alah"
 QUE_reinforce_thasalah_desc:0 "Invest mana into strengthening the Runestone at Thas'alah against Amani assault."

 QUE_reinforce_moon:0 "Reinforce Runestone at Sanctum of the Moon"
 QUE_reinforce_moon_desc:0 "Channel arcane energy into the lunar Runestone. Its wards will hold longer."

 QUE_reinforce_sun:0 "Reinforce Runestone at Sanctum of the Sun"
 QUE_reinforce_sun_desc:0 "Fortify the solar Runestone with additional mana. Every reinforced stone buys Silvermoon more time."

 QUE_farstrider_patrols:0 "Deploy Farstrider Patrols"
 QUE_farstrider_patrols_desc:0 "Order Ranger-General Sylvanas Windrunner to saturate the Farstrider Routes with elite ranger patrols. They will intercept Amani ambushes and report enemy movements."

 QUE_evacuate_windrunner:0 "Evacuate Windrunner Village"
 QUE_evacuate_windrunner_desc:0 "With the Farstrider routes contested, Windrunner Village is vulnerable. Relocate its population to Silvermoon before the trolls arrive."

 QUE_evacuate_fairbreeze:0 "Evacuate Fairbreeze Village"
 QUE_evacuate_fairbreeze_desc:0 "The Horde approaches the capital's outskirts. Evacuate Fairbreeze Village and bring its people behind Silvermoon's walls."

 QUE_magical_trap:0 "Set Arcane Traps in the Approaches"
 QUE_magical_trap_desc:0 "Our magisters can weave destructive arcane traps along the forest paths leading to Silvermoon. Any troll warband that stumbles into them will regret it."

 QUE_channel_sunwell:0 "Channel the Sunwell"
 QUE_channel_sunwell_desc:0 "Focus the Convocation's efforts on directly channelling the Sunwell's energy into our mana reserves. This strains the magisters but provides a critical boost when reserves run low."

 QUE_claim_caer_darrow:0 "Claim the Caer Darrow Runestone"
 QUE_claim_caer_darrow_desc:0 "The ancient runestone at Caer Darrow on Lordamere Lake is of elven origin. Request access from Lordaeron to connect it to our network — or claim it directly if we control the island."
