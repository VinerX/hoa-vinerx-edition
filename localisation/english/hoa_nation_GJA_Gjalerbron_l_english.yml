GJA_Vrykul_Infighting:0 "Vrykul Infighting"
GJA_Vrykul_Infighting_desc:0 "The Vrykul are a warmongering people, when war cannot show itself they must stay occupied during the down times. Many Vrykul turn to infighting to train themselves and to gain superiority over others."
GJA_Gjalerbron_Fortress:0 "Gjalerbron Fortress"
GJA_Gjalerbron_Fortress_desc:0 "The Fortress of Gjalerbron is one of the mightiest resting sites of the Vrykul, thousands if not more Vrykul slumber in its depths waiting for a time where their might is needed."
GJA_Gjalerbron_Fortress_2:0 "Gjalerbron Fortress"
GJA_Gjalerbron_Fortress_2_desc:0 "The Fortress of Gjalerbron is one of the mightiest awakening sites of the Vrykul and supplies the tribes with constant manpower for the war effort."
