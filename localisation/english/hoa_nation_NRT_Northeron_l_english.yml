NRT_wildhammer_legacy:0 "Wildhammer Legacy"
NRT_wildhammer_legacy_desc:0 "By the time of the trade with the various human city-states to the north, the dwarves, led by High King Modimus Anvilmar, had three powerful factions brooding within the city of Ironforge. The Wildhammer clan controlled the foothills of the mountain with the most resilient of mountaineers"

NRT_Thundermar_Clan:0 "Clan Thundermar"
NRT_Thundermar_Clan_desc:0 "One of the founding Clans of Northeron. Thundermar is the 'capital' and largest Clan within the Kingdom. Which was married into by Keegan Firebeard."
NRT_Firebeard_Clan:0 "Clan Firebeard"
NRT_Firebeard_Clan_desc:0 "One of the founding Clans of Northeron. Firebeards made up large swathes of the southern provinces of Northeron, notably Firebeard's Patrol. Keegan Firebeard married into the Thundermar Clan."

