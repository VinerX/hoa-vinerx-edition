scourge.1.t:0 "The First Test"
scourge.1.d:0 "The moment has arrived to put your newfound powers to the ultimate test. As commanded by the Dreadlords, your mission is to launch an assault on a neighboring settlement of wolvar. While the resistance from the wolvar is anticipated to be minimal, their potential to be assimilated into the ranks of the Scourge presents a valuable opportunity."
scourge.1.option.1:0 "An easy task."
scourge.2.t:0 "Frenzyheart Defeated"
scourge.2.d:0 "As anticipated, the wolvar's resistance proved to be negligible. Yet, rather than engaging in battle, a considerable number of the wolvar opted for a different path – they abandoned their settlement and embarked on a hasty retreat to an undisclosed destination."
scourge.2.option.1:0 "Cowardly vermin."
scourge.3.t:0 "The Vrykul"
scourge.3.d:0 "Pleased with your progress Tichondrius has found a final test before unleashing war upon the human kingdoms. Deep beneath the ice of Northrend lies a race of intelligent arachnids known as Nerubians. Should the scourge be able to wipe these creatures out they could become a formidable part of the scourge."
scourge.3.option.1:0 "The Scourge Grows."
scourge.4.t:0 "The War of the Spider"
scourge.4.d:0 "Moved by your remarkable progress, Tichondrius unveils a final challenge before embarking on a campaign against the human kingdoms. Beneath the frigid vastness of Northrend's ice, an intricate arachnid civilization known as the Nerubians remains hidden. Should the Scourge triumph in annihilating these beings, their potent blend of might and sagacity would undoubtedly emerge as an indispensable asset in the impending conflict against the Alliance."
scourge.4.option.1:0 "Finally a real challenge."
