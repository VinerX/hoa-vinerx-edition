l_english:

###############################
# Gilneas Second War Focus Tree
###############################

GIL_sw_news_from_the_south:0 "News from the South"
GIL_sw_news_from_the_south_desc:0 "Word has reached Gilneas of the catastrophe in the south. Stormwind has fallen, its people scattered like leaves before a storm. The Horde is real, and it is coming. For a kingdom that has long prided itself on self-reliance and distance from the affairs of the continent, this news is a cold blade against the throat. King Genn Greymane must decide what kind of king he will be in the face of extinction."

GIL_sw_pride_of_greymane:0 "The Pride of Greymane"
GIL_sw_pride_of_greymane_desc:0 "Genn Greymane has never been a man who bends. The Lordaeronian kings demand Gilneas bow to their Alliance; the nobles whisper that the king is too stubborn for his own good. But Greymane knows his people. Gilneas has always stood alone, and it has always thrived. The silver-tongued diplomats of Lordaeron will not dictate the destiny of the Gilnean people — not while Genn Greymane draws breath."

GIL_sw_crowleys_counsel:0 "Crowley's Counsel"
GIL_sw_crowleys_counsel_desc:0 "Lord Darius Crowley is everything Genn Greymane is not — passionate where the king is stubborn, outward-looking where the king turns inward. Crowley argues passionately that Gilneas cannot survive the Horde alone. 'Pride is a cold comfort when your walls are burning, Genn,' he warns. The rift between the two men, once the closest of friends, grows deeper with each passing day. The kingdom watches, unsure which vision will prevail."

GIL_sw_the_debate:0 "The Great Debate"
GIL_sw_the_debate_desc:0 "The throne room of Gilneas City becomes a battlefield of words. Greymane on one side, his voice a fortress of conviction — Gilneas alone, Gilneas first, Gilneas forever. Crowley on the other, his passion burning through the assembled nobles — Gilneas with the Alliance, Gilneas standing with humanity, Gilneas choosing survival over pride. The court holds its breath. The king must choose. But so must the lords, and so must the people."

GIL_sw_gilneas_first:0 "Gilneas First"
GIL_sw_gilneas_first_desc:0 "The king has spoken: Gilneas will not join the Alliance of Lordaeron. Our armies will defend our own borders and no others. Our resources will serve our own people and no others. Let Terenas and his courtiers play at empire — the Gilnean people have no interest in bleeding for foreign kings on foreign soil. Gilneas stands alone, as it always has, as it always will."

GIL_sw_heed_the_call:0 "Heed the Call"
GIL_sw_heed_the_call_desc:0 "Crowley's voice has carried the day. Greymane, with visible reluctance, consents to send Gilnean forces to join the Alliance. The king does not smile as he signs the mobilization orders — he knows he is committing his people to a war that will cost Gilnean lives. But even Genn Greymane cannot deny the truth: if the Horde destroys Lordaeron, Gilneas will not survive alone for long."

GIL_sw_a_reluctant_king:0 "A Reluctant King"
GIL_sw_a_reluctant_king_desc:0 "Greymane's heart remains with isolation, but his mind sees the strategic reality. He walks the narrowest possible path — supporting the Alliance just enough to maintain Gilneas's standing, while committing as little as possible. It is a cynical calculation, and Crowley despises it. But the king did not keep Gilneas prosperous for all these years by being idealistic. He is playing a longer game than anyone in the court realises."

GIL_sw_gilnean_stalwarts:0 "Gilnean Stalwarts"
GIL_sw_gilnean_stalwarts_desc:0 "If Gilneas is to stand alone, it must stand strong. The Greymane Wall may eventually shield us from landward threats, but an army of true Gilnean warriors — tough, resourceful, and utterly committed to the defense of their homeland — will be the kingdom's sword. The Stalwarts are drawn from every village and town, volunteers who need no foreign officers to tell them how to fight."

GIL_sw_stand_alone:0 "A Kingdom Stands Alone"
GIL_sw_stand_alone_desc:0 "The die is cast. Greymane has gambled Gilneas's entire future on the proposition that our peninsula can be defended without Alliance help. The military accelerates its defensive preparations. Diplomats are recalled from Lordaeron. Trade is redirected toward self-sufficiency. The outside world may rage and burn — Gilneas will survive by turning inward, as we always have."

GIL_sw_self_reliant_industry:0 "Self-Reliant Industry"
GIL_sw_self_reliant_industry_desc:0 "An isolated kingdom cannot rely on foreign trade. Gilneas must become self-sufficient in everything — food, steel, timber, and arms. New mines are dug, new forges built, new mills raised along the rivers. The industrious Gilnean spirit, long focused on trade and craftsmanship, now turns entirely toward survival. If the world will not help us, we will become a world unto ourselves."

GIL_sw_full_commitment:0 "Full Commitment"
GIL_sw_full_commitment_desc:0 "Greymane, against every instinct, commits Gilneas fully to the Alliance cause. Regiments march south to reinforce the Lordaeronian lines. Gilnean ships join the Kul Tiran blockade. The factories of the peninsula churn out weapons destined for foreign hands. It costs Greymane something to do this — a piece of his pride, perhaps — but the survival of humanity demands nothing less. Even a proud king can learn."

GIL_sw_token_support:0 "Token Support"
GIL_sw_token_support_desc:0 "Greymane approves a minimal contribution to the Alliance — enough to keep Lordaeron from declaring Gilneas a renegade, but not enough to meaningfully weaken the kingdom's defenses. A few regiments, some surplus equipment, a promise to 'seriously consider' further aid. It is the gesture of a king keeping his options open, buying time while the world decides whether to burn or survive."

GIL_sw_tough_as_nails:0 "Tough as Nails"
GIL_sw_tough_as_nails_desc:0 "Gilneans are not the largest soldiers in the Alliance, nor the best-armed, nor the most magically gifted. But there is a stubbornness in the Gilnean character that no Horde axe can cleave through. Our soldiers fight with the tenacity of people defending their own doorsteps — because they are. 'Tough as Gilnean nails' is not just a saying. It is a doctrine."

GIL_sw_coastal_watch:0 "Coastal Watch"
GIL_sw_coastal_watch_desc:0 "The sea has always been Gilneas's ally — a barrier between our peninsula and the troubles of the continent. But the Horde has ships now, crude but numerous, and the Dragonmaw Clan rides on creatures worse than any ship. We must patrol our waters and defend our coasts with vigilance. The sea protects us, but only if we protect our claim to it."

GIL_sw_fortify_the_headlands:0 "Fortify the Headlands"
GIL_sw_fortify_the_headlands_desc:0 "The northern headlands of Gilneas are the kingdom's natural shield — high cliffs, treacherous waters, and narrow approaches that bottleneck any invading force. With proper fortifications, a handful of defenders could hold off an entire army. Coastal batteries are raised, watchtowers are manned, and the rocky coasts of Gilneas become a fortress chain that no invader will breach."

GIL_sw_gilnean_brigades:0 "Gilnean Brigades"
GIL_sw_gilnean_brigades_desc:0 "The Gilnean military is expanded and reorganized into a modern brigade structure. Veterans of the border skirmishes train the new recruits. Equipment is standardised. The old feudal levy system, unchanged for centuries, is finally reformed into a fighting force capable of standing alongside the professional armies of Lordaeron and Stromgarde."

GIL_sw_allied_logistics:0 "Allied Logistics"
GIL_sw_allied_logistics_desc:0 "Wars are won as much by supply lines as by steel. Gilneas leverages its industrial base and its strategic position on the peninsula to become a logistics hub for the Alliance war effort. Our factories produce, our docks load, our roads carry — and the Horde faces an enemy that never runs out of arrows, food, or reinforcements."

GIL_sw_shipments_of_aid:0 "Shipments of Aid"
GIL_sw_shipments_of_aid_desc:0 "Even token support can make a real difference. Gilneas dispatches shipments of arms, food, and medicine to the Alliance front lines. It is not a grand gesture — there are no parades, no speeches, no medals. But soldiers who would have starved eat Gilnean grain. Regiments that would have broken hold lines with Gilnean steel. Sometimes the quietest contributions matter most."

GIL_sw_northgate_regiments:0 "Northgate Regiments"
GIL_sw_northgate_regiments_desc:0 "The Crowley household raises its own forces, independent of the Crown — regiments drawn from the Northgate region, loyal first to Darius Crowley and only secondarily to Greymane. They are well-trained, well-led, and increasingly well-armed. Greymane watches their growth with a mixture of pride and unease. An ally today can become a rival tomorrow."

GIL_sw_headlands_fleet:0 "Headlands Fleet"
GIL_sw_headlands_fleet_desc:0 "The Gilnean navy, long neglected in favour of the army, receives a much-needed expansion. New destroyers and patrol vessels are commissioned for coastal defense. The shipyards work at full capacity for the first time in a generation. Gilneas may not challenge Kul Tiras for mastery of the seas, but we will not be found helpless in our own waters."

GIL_sw_the_greymane_wall:0 "The Greymane Wall"
GIL_sw_the_greymane_wall_desc:0 "From the mouth of the Greymane himself comes the most audacious proposal in Gilnean history: a great wall spanning the entire northern border of the peninsula, sealing Gilneas off entirely from the continent. The cost will be staggering. The construction will take years. But if it succeeds, Gilneas will be an island fortress, untouchable by any land army the Horde or anyone else can muster. The king's vision is megalomaniacal — or it is genius. Only history will judge."

GIL_sw_a_kingdom_sealed:0 "A Kingdom Sealed"
GIL_sw_a_kingdom_sealed_desc:0 "The gates of the Greymane Wall close for the first time, and Gilneas becomes something that no human kingdom has ever been: truly, completely isolated. No armies can march in. No refugees can slip through. No envoys from Lordaeron can arrive to beg for aid we will not give. It is a terrifying solitude — but it is safety, and that is all Greymane ever wanted."

GIL_sw_northgate_tensions:0 "Northgate Tensions"
GIL_sw_northgate_tensions_desc:0 "The rift between Greymane and Crowley has grown too wide to bridge. Crowley's supporters in the Northgate region openly question the king's judgment. There are murmurs of secession, of a rebellion that would split Gilneas in two before the Horde even reaches our borders. Greymane must decide how to handle a rival who was once his closest friend — and who now threatens to become his greatest enemy."

GIL_sw_glory_to_the_alliance:0 "Glory to the Alliance"
GIL_sw_glory_to_the_alliance_desc:0 "The war is won, and Gilneas stood with the Alliance. Greymane's decision to commit, however grudging, has been vindicated. Gilnean soldiers marched under the Alliance banner and returned as heroes. The kingdom's standing in the post-war order is secure. Greymane looks at his people and sees something he did not expect: pride — not in isolation, but in shared victory."

GIL_sw_silverpine_passage:0 "Silverpine Passage"
GIL_sw_silverpine_passage_desc:0 "The Silverpine Forest has always been the gateway between Gilneas and the rest of the continent. By securing this corridor — improving the roads, establishing supply depots, and coordinating with Dalaran's warders — Gilneas can move troops and supplies to the Alliance front more efficiently than ever. Even token support, delivered quickly, is worth more than grand promises that never arrive."

GIL_sw_remember_the_fallen:0 "Remember the Fallen"
GIL_sw_remember_the_fallen_desc:0 "The war has ended, but its cost must never be forgotten. Monuments are raised for the Gilnean dead. Pensions are established for widows and orphans. The king himself visits the families of fallen soldiers, speaking words of gratitude that carry the weight of a man learning humility. Gilneas paid a price. Gilneas will remember."

###############################
# Ideas
###############################

GIL_gilneas_first_idea:0 "Gilneas First"
GIL_gilneas_first_idea_desc:0 "The Crown has formally adopted a policy of national isolation, redirecting all resources toward domestic defense and self-sufficiency."

GIL_heed_the_call_idea:0 "Heeding the Call"
GIL_heed_the_call_idea_desc:0 "Gilneas has answered the Alliance's call to arms. Our forces march alongside the other human kingdoms, and our industry supports the war effort."

GIL_gilnean_stalwarts_idea:0 "Gilnean Stalwarts"
GIL_gilnean_stalwarts_idea_desc:0 "The elite core of the Gilnean army — tough, resourceful volunteers sworn to defend their homeland against any invader. They are the pride of Greymane's military."

GIL_a_kingdom_stands_alone_idea:0 "A Kingdom Stands Alone"
GIL_a_kingdom_stands_alone_idea_desc:0 "Gilneas has chosen isolation over alliance. Our peninsula is fortified, our industry self-sufficient, and our people ready to face the world alone."

GIL_full_commitment_idea:0 "Full Commitment to the Alliance"
GIL_full_commitment_idea_desc:0 "Genn Greymane has set aside his pride and thrown the full weight of Gilneas behind the Alliance cause. Our soldiers and factories serve a common purpose."

GIL_token_support_idea:0 "Token Support"
GIL_token_support_idea_desc:0 "Gilneas provides minimal material assistance to the Alliance while preserving the bulk of its strength for homeland defense."

GIL_the_greymane_wall_idea:0 "The Greymane Wall"
GIL_the_greymane_wall_idea_desc:0 "A colossal barrier spanning the northern border of Gilneas. Once completed, it will seal the peninsula from all landward threats — and from the outside world itself."

GIL_kingdom_sealed_idea:0 "A Kingdom Sealed"
GIL_kingdom_sealed_idea_desc:0 "The gates are closed. Gilneas has withdrawn entirely behind the Greymane Wall. No one enters. No one leaves. The kingdom survives alone."

GIL_absolute_isolation_idea:0 "Absolute Isolation"
GIL_absolute_isolation_idea_desc:0 "With the Greymane Wall complete and all ties to the outside world severed, Gilneas exists as a nation unto itself. Self-sufficiency is no longer a policy — it is reality."

###############################
# Events
###############################

gilneas_second_war.1.t:0 "The Great Debate"
gilneas_second_war.1.d:0 "The throne room of Gilneas City is packed to the rafters with nobles, military officers, and guild representatives — anyone with a voice and a stake in the kingdom's future. Genn Greymane sits upon the Wolf Throne, his expression unreadable. Lord Darius Crowley stands before the assembly, his voice ringing with conviction. 'We cannot hide behind the Greymane Wall — which we have not even built yet — while humanity burns! Stormwind has fallen. Lordaeron calls for aid. If we do not stand together now, there will be no kingdom left to defend!' Greymane rises slowly, the room falling silent. 'And who, Lord Crowley, will defend Gilneas while our soldiers die on foreign soil? Who will protect our shores when the Horde bypasses Lordaeron and strikes where we are weakest? Your passion moves the heart, but it clouds the mind.' The two men lock eyes across the throne room, and the kingdom holds its breath."
gilneas_second_war.1.option.1:0 "Greymane is right. Gilneas must stand alone."
gilneas_second_war.1.option.2:0 "Crowley speaks truth. We must join the Alliance."

gilneas_second_war.2.t:0 "Token Support"
gilneas_second_war.2.d:0 "Greymane signs the papers with visible reluctance. A shipment of Gilnean arms, equipment, and a token force of volunteers will be sent to reinforce the Alliance front lines. It is not the grand commitment Crowley demanded, but it is not the complete refusal the isolationist faction wanted either. The king walks the narrow path, as he always does — keeping Gilneas largely out of the war while avoiding outright alienation from Lordaeron. It is the careful calculus of a ruler who believes this war is not his to fight, but knows he cannot afford to lose the peace that follows. As the ships depart, Crowley watches from the docks with a mixture of disappointment and grudging respect. Greymane watches from his window and says nothing."
gilneas_second_war.2.option.1:0 "A measured response for measured times."

gilneas_second_war.3.t:0 "Tensions at Northgate"
gilneas_second_war.3.d:0 "Word reaches Gilneas City from the Northgate region: Lord Crowley's forces have been drilling independently of the Crown's command. His regiments are better supplied than the king's own, funded by sympathetic nobles who share Crowley's belief that Greymane is leading Gilneas toward disaster. The king's advisors urge a crackdown — arrest the ringleaders, disband the private armies, and remind Crowley who wears the crown. Others caution that outright conflict with the Northgate lords could spiral into civil war at the worst possible time. The Horde is at the gates of Lordaeron, and Gilneas threatens to tear itself apart from within."
gilneas_second_war.3.option.1:0 "Let him play his games. The Crown endures."
gilneas_second_war.3.option.2:0 "Crowley must be reined in. The kingdom needs unity."

gilneas_second_war.4.t:0 "The Greymane Wall Begins"
gilneas_second_war.4.d:0 "The first stones are laid at dawn, and with them, a new chapter of Gilnean history begins. King Genn Greymane himself presides over the ceremony at the northern pass — the narrowest point between Gilneas and Silverpine — where the great wall will rise. 'For too long,' he declares to the gathered crowd, 'Gilneas has been pulled into the wars of other kingdoms. We have bled for causes not our own, spent our treasure on battles that could not touch our shores. No more. This wall will stand long after the Horde is dust. It will stand long after every king in this chamber is forgotten. And it will say to the world, in stone and steel, that Gilneas belongs to the Gilneans.' As the first foundation stones are lowered into place, even Lord Crowley watches in silence. Whatever their disagreements, no one can deny that the king has vision."
gilneas_second_war.4.option.1:0 "Let the wall rise. Let the world wait outside."
