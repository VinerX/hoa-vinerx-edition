l_english:
 # Steamwheedle Fleet Delivery Events
 steamwheedle_fleet.1.t:0 "Steamwheedle Battleships Delivered"
 steamwheedle_fleet.1.d:0 "The Steamwheedle Cartel has delivered five powerful battleships to the Horde fleet at Menethil Harbor. These goblin-engineered vessels may lack elegance, but their oversized cannons and reinforced hulls will give the Alliance something to fear on the open sea."
 steamwheedle_fleet.1.option.1:0 "The Horde sails with goblin iron."

 steamwheedle_fleet.2.t:0 "Amani Frigates Join the Fleet"
 steamwheedle_fleet.2.d:0 "Through goblin shipwrights and Amani lumber, a squadron of eight Amani war frigates has been assembled and delivered to the Horde. The forest trolls know the northern seas well — their ships will prove invaluable for coastal raiding and patrol."
 steamwheedle_fleet.2.option.1:0 "Troll craftsmanship has its uses."

 steamwheedle_fleet.3.t:0 "Frostmane Destroyers Ready"
 steamwheedle_fleet.3.d:0 "The Steamwheedle Cartel has completed construction of the Frostmane Destroyer fleet — eight fast attack vessels built with materials from Dun Morogh. These ships are small but deadly, perfect for screening the Horde's larger vessels and hunting Alliance transports."
 steamwheedle_fleet.3.option.1:0 "Send them to sea."

 steamwheedle_fleet.4.t:0 "Dreadmaul Battleships Commissioned"
 steamwheedle_fleet.4.d:0 "The mightiest vessels of the goblin-built fleet have arrived: six Dreadmaul Battleships, named after the ogres who helped forge their hulls. Slow but nearly indestructible, these ships will anchor the Horde battle line against the Alliance armada."
 steamwheedle_fleet.4.option.1:0 "Dreadmaul sails at last."

 steamwheedle_fleet.5.t:0 "Emergency Shipments Arrive"
 steamwheedle_fleet.5.d:0 "The Steamwheedle Cartel responds to Warchief's urgent request with an emergency shipment: four destroyers, two frigates, and fifty convoy vessels rush-built at the goblin shipyards. It is not enough to challenge the Alliance fleet directly, but it keeps the Horde in the fight."
 steamwheedle_fleet.5.option.1:0 "Every ship counts."

 # Goblin Fleet Delivery Decisions
 STC_fleet_delivery:0 "Horde Fleet Deliveries"
 STC_fleet_delivery_desc:0 "The Steamwheedle Cartel's shipyards are working overtime to supply the Horde with a navy. Each delivery brings the Warchief one step closer to challenging Alliance naval dominance."

 STC_deploy_steamwheedle_battleships:0 "Deliver Steamwheedle Battleships"
 STC_deploy_steamwheedle_battleships_desc:0 "Deploy five goblin-engineered battleships to the Horde fleet at Menethil Harbor. These crude but powerful vessels pack oversized cannons capable of threatening even Kul Tiran capital ships."

 STC_deploy_amani_frigates:0 "Deliver Amani War Frigates"
 STC_deploy_amani_frigates_desc:0 "Commission eight Amani war frigates built with troll lumber and goblin engineering. Fast and maneuverable, they excel at coastal patrol and raiding."

 STC_deploy_frostmane_destroyers:0 "Deliver Frostmane Destroyers"
 STC_deploy_frostmane_destroyers_desc:0 "Eight fast attack destroyers built with Frostmane materials. Small, agile, and deadly — perfect for screening larger vessels and hunting Alliance convoys."

 STC_deploy_dreadmaul_battleships:0 "Deliver Dreadmaul Battleships"
 STC_deploy_dreadmaul_battleships_desc:0 "Deploy six massive Dreadmaul Battleships forged with ogre assistance. Slow but nearly indestructible, these will anchor the Horde battle line."

 STC_emergency_shipments:0 "Emergency Shipment"
 STC_emergency_shipments_desc:0 "Rush-build a small batch of ships to replenish Horde losses. Every vessel counts when facing the Alliance armada."

 # Dragon Allocation Events
 dragon_allocation.1.t:0 "The Warchief Demands Dragons"
 dragon_allocation.1.d:0 "Orgrim Doomhammer has sent word to the Dragonmaw Clan: the enslaved Red Dragons must serve the entire Horde, not just Zuluhed's ambitions. The Warchief demands that dragon-riders be deployed to the Northern Front, where Alliance armies press against our lines. Nekros Skullcrusher's response will test the Warchief's authority like never before."
 dragon_allocation.1.option.1:0 "The dragons remain ours alone."
 dragon_allocation.1.option.2:0 "The Warchief commands — and the Dragonmaw obeys."
 dragon_allocation.1.option.3:0 "Demand the dragons... at our peril."
 dragon_allocation.1.option.4:0 "Negotiate for dragon support."

 dragon_allocation.2.t:0 "Dragons for the Northern Front"
 dragon_allocation.2.d:0 "The Warchief's authority is absolute. Zuluhed the Whacked, ever loyal, orders Nekros Skullcrusher to dispatch a wing of red dragons to the Northern Front immediately. Ten of our finest drakes will fly north to rain fire upon the human armies. It is a heavy cost, but the Horde's victory demands it."
 dragon_allocation.2.option.1:0 "For the Warchief! Send the dragons north."
 dragon_allocation.2.option.2:0 "Send a token force — keep the rest."

 dragon_allocation.3.t:0 "The Dragonmaw Resists"
 dragon_allocation.3.d:0 "Doomhammer's authority is weak, and the Dragonmaw knows it. Nekros Skullcrusher reads the Warchief's demand and scoffs. 'These dragons were won with Dragonmaw blood, not Blackrock posturing. Let Doomhammer fight his own battles.' The clan's defiance is a dangerous gamble — it may shatter the Horde's fragile unity."
 dragon_allocation.3.option.1:0 "Very well — send the dragons. Reluctantly."
 dragon_allocation.3.option.2:0 "Refuse. These dragons belong to the Dragonmaw."

 dragon_allocation.4.t:0 "A Negotiated Deployment"
 dragon_allocation.4.d:0 "The Warchief's authority is recognized but not absolute. Nekros Skullcrusher negotiates: the Dragonmaw will provide dragon support, but the Warchief must acknowledge the clan's sacrifice. A compromise is reached — dragons will fly north, but the Dragonmaw expects greater rewards when victory comes."
 dragon_allocation.4.option.1:0 "A fair bargain. Deploy the dragons."
 dragon_allocation.4.option.2:0 "Send only what we can spare."

 dragon_allocation.5.t:0 "Dragons Take to the Seas"
 dragon_allocation.5.d:0 "Nekros Skullcrusher orders a wing of red dragons to hunt Alliance shipping. The great beasts soar over the Great Sea, their fiery breath turning proud Kul Tiran warships into floating pyres. Alliance sailors whisper of the 'Red Dawn' — the moment the sky turns crimson and death falls from above."
 dragon_allocation.5.option.1:0 "Let the seas burn."
 dragon_allocation.5.option.2:0 "The dragons are too precious to risk at sea."

 dragon_allocation.6.t:0 "Siege Dragons Deployed"
 dragon_allocation.6.d:0 "The siege of Lordaeron's fortifications has stalled. Dragonmaw dragon-riders are dispatched to the front lines, their mounts' flames melting stone walls and routing defenders. Fortresses that would hold for months crumble in days under the sustained assault of living fire."
 dragon_allocation.6.option.1:0 "Tear down their walls."
 dragon_allocation.6.option.2:0 "Keep the dragons close. Let the grunts do the dying."

 dragon_allocation.7.t:0 "Dragons Over the Fleet"
 dragon_allocation.7.d:0 "Admiralty reports confirm the worst: Dragonmaw Clan red dragons are hunting our fleet across the Great Sea. Ships that took months to build are reduced to cinders in minutes. Our sailors have begun calling the sight 'the Red Dawn' — because it looks like the sunrise, but it brings only death. Emergency measures are needed before the entire fleet is lost."
 dragon_allocation.7.option.1:0 "Sound the alarm. All ships to emergency stations."

 dragon_allocation.8.t:0 "The Alliance Responds to the Dragon Threat"
 dragon_allocation.8.d:0 "Word of the dragon attacks on Kul Tiras shipping has reached the Alliance council. Lordaeron pledges additional resources for anti-air defenses, and Dalaran dispatches more battle mages to serve aboard warships. The Alliance stands united against this new airborne terror."
 dragon_allocation.8.option.1:0 "United we stand against the dragon's fire."

 # Dragon Allocation Decisions
 DMC_dragon_allocation:0 "Dragon Deployment"
 DMC_dragon_allocation_desc:0 "The enslaved Red Dragons are the Dragonmaw Clan's greatest weapon — but the Warchief demands they serve the entire Horde. How will we deploy our winged fire?"

 DMC_allocate_northern_front:0 "Deploy to the Northern Front"
 DMC_allocate_northern_front_desc:0 "Dispatch dragons to reinforce the Warchief's armies against Lordaeron. Their air superiority and devastating breath attacks will break Alliance defensive lines."

 DMC_allocate_fleet_raiding:0 "Hunt the Alliance Fleet"
 DMC_allocate_fleet_raiding_desc:0 "Send dragons to raid Alliance shipping in the Great Sea. Their fiery breath will turn warships to ash and starve enemy supply lines."

 DMC_allocate_siege_support:0 "Deploy for Siege Operations"
 DMC_allocate_siege_support_desc:0 "Assign dragons to support Horde siege operations. Their flames will melt stone fortifications and break the strongest walls."

 DMC_keep_strategic_reserve:0 "Keep Strategic Reserve"
 DMC_keep_strategic_reserve_desc:0 "The dragons are too valuable to risk. Keep them close to the Highlands — the Dragonmaw Clan's power depends on them."

 # Dragon Allocation Ideas
 DMC_dragon_support_north:0 "Dragon Support — Northern Front"
 DMC_dragon_support_north_desc:0 "Red dragons are providing air support for our offensive operations. Alliance infantry breaks before the fire from above."

 DMC_dragons_deployed_north:0 "Dragons Deployed North"
 DMC_dragons_deployed_north_desc:0 "A significant portion of our dragon forces has been dispatched to the Northern Front. Our local air power is reduced."

 DMC_dragons_hoarded:0 "Dragons Hoarded"
 DMC_dragons_hoarded_desc:0 "The Dragonmaw Clan keeps its dragons close, refusing to share with the Warchief. Our air power remains intact, but faction unity suffers."

 DMC_dragons_raiding_seas:0 "Dragons Raiding the Seas"
 DMC_dragons_raiding_seas_desc:0 "Red dragons are hunting Alliance shipping across the Great Sea. Their naval strike capability is devastating enemy supply lines."

 DMC_dragons_sieging:0 "Dragons on Siege Duty"
 DMC_dragons_sieging_desc:0 "Our dragons are deployed against Alliance fortifications, their flames melting walls that would resist conventional siege for months."

 horde_dragons_at_sea:0 "Dragons at Sea"
 horde_dragons_at_sea_desc:0 "Dragonmaw drakes are raiding Alliance shipping, clearing the way for Horde naval operations."

 DMC_dragon_siege_support:0 "Dragon Siege Support"
 DMC_dragon_siege_support_desc:0 "Red dragons are assisting siege operations. Fortifications crumble before their flames."

 KUL_sw_dragonfire_crisis_idea:0 "Dragonfire Crisis"
 KUL_sw_dragonfire_crisis_idea_desc:0 "Red dragon attacks are crippling Alliance shipping. Ships burn faster than we can build them, and morale is at breaking point."
