form_wildhammer_clan_category:0 "Form the Wildhammer Clan"
form_wildhammer_clan_category_desc:0 "We unified our old lands through diplomacy or war, it is time to reform the Wildhammer Clan"

form_arathor_category:0 "Form the Empire of Arathor"
form_arathor_category_desc:0 "  The Arathor Empire was the first ever human kingdom and then empire to ever exists. Formed by Thoradin of the Arathi Tribe, he sought to unite the other human tribes in order to fend off the ever growing expanse of the Amani trolls. Arathor was great and mighty and Thoradin treated his subject with fairness and respect.\n\n   This was more than 2800 years ago and now mankind lies divided into different kingdoms. However, should any of these kingdoms dare to reclaim Arathor's ancestral lands, they would not only reclaim its illustrious legacy but also its prestige."
