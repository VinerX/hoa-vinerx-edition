form_union_of_three_hammers_category:0 "Form the Union of Three Hammers"
form_union_of_three_hammers_category_desc:0 "It has been roughly 230 years since the bloody War of the Three Hammers that left us divided and our strength diminished. The Bronzebeard, Wildhammer, and Dark Iron clans, once close allies, have become bitter rivals. This division has weakened our ability to defend ourselves, and some fear that it may lead to our eventual downfall..."
form_union_of_three_hammers:0 "Form Union of the Three Hammers"
form_union_of_three_hammers_desc:0 "We have finally unified all the houses of Ironforge through diplomacy or war! For the first time in 230 years our clans stand united under one banner. At last it is time we put our differences asides for now is the time of the Union of the Three Hammers!"
form_union_of_three_hammers_ironforge_cores_tt:0 "§HCores§! all of §H[IRO.GetNameWithFlag]§! core states."
