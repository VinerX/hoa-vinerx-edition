rebuild_ikvess_decision:0 "Strengthen the Ik'thik Swarm"
rebuild_ikvess_decision_desc:0 "The Sha will help strengthen the Ik'thik Swarms Kypori Tree, granting them more strength for the war effort."
rebuild_zarvess_decision:0 "Strengthen the Zar'thik Swarm"
rebuild_zarvess_decision_desc:0 "The Sha will help strengthen the Zar'thik Swarms Kypori Tree, granting them more strength for the war effort."
rebuild_vorvess_decision:0 "Strengthen the Vor'thik Swarm"
