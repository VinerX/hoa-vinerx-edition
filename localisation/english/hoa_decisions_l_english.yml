clan_meet_with_minor_chieftains_decision:0 "Meet with Minor Chieftains"
clan_meet_with_minor_chieftains_decision_desc:0 "The leader of our clan will call upon minor chieftains. Together, they will discuss matters of importance and work towards the betterment of the clan."
clan_hold_martial_gathering_decision:0 "Hold Martial Gathering"
clan_hold_martial_gathering_decision_desc:0 "A martial gathering is the best place to showcase our clan's fighting strength. Our bravest warriors will compete in fierce battles to prove their martial prowess and bring honor to our name."
clan_extend_working_hours_decision:0 "Extend Working Hours"
clan_extend_working_hours_decision_desc:0 "We need to work longer, sacrificing leisure for the greater good of the clan. Our efforts will bring prosperity to our people and ensure our continued success."
clan_clear_land_decision:0 "Clear Land"
clan_clear_land_decision_desc:0 "Clearing the land will provide us with more space to cultivate and harvest crops, and allow us to build more structures for our clan."
