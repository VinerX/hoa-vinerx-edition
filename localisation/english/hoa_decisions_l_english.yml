burn_dread_wastes_decision:0 "Burn the Dread Wastes"
burn_dread_wastes_decision_desc:0 "The Mantid plague must be destroyed, burn the Dread Wastes and all that lay within it once and for all."


rebuild_amthul_decision:0 "Rebuild Amthul"
rebuild_amthul_decision_desc:0 "Thousands of years ago a Tol’vir known as Irmaat was tricked by Al’Akir into crafting weapons of immense power that when used blasted the city of Amtul under the sands, The time has come to restore the city to its former glory."
rebuild_khintaset_decision:0 "Rebuild Khintaset"
rebuild_khintaset_decision_desc:0 "Khintaset was once a bastion of Tol’vir society, however with years of neglect the sands of Uldum have destroyed much of the city, we should restore this city and incorporate it back into our nation."
rebuild_ammon_decision:0 "Rebuild Ammon"
rebuild_ammon_decision_desc:0 "Ammon was once a great temple, lost thousands of years ago to the sands. We should reclaim Ammon and restore the temple to its former glory."
rebuild_obsidian_dragonshrine_decision:0 "Reclaim The Obsidian Dragonshrine"
rebuild_obsidian_dragonshrine_decision_desc:0 "The Obsidian Dragonshrine is a sacred place for the black dragons and their Aspect Neltharion the Earth-Warder. Since The War of the Ancients we have been cut off from our Shrine in Northrend, but now it is our time to retake out birthright."

rebuild_vilvess_decision:0 "Unleash the Vil'thik Swarm"
rebuild_vilvess_decision_desc:0 "As the Shado-Pan wall crumbles, it is time to push onward to the Vale of Eternal Blossoms. The Vil'thik Swarm will lead the invasion."
rebuild_krikvess_decision:0 "Unleash the Krik'thik Swarm"
rebuild_krikvess_decision_desc:0 "The fall of Golden Lotus gives way for the Krik'thik Swarm to settle in the Vale of Eternal Blossoms."
rebuild_krivess_decision:0 "Revive the Kri'thik Swarm"
rebuild_krivess_decision_desc:0 "Crush the Yuangol Regime and release the Kri'thik Swarm back to their Kypori Tree."
rebuild_sravess_decision:0 "Revive the Sra'thik Swarm"
rebuild_sravess_decision_desc:0 "Crush the Pandaren Regime and release the Sra'thik Swarm back to their Kypori Tree."
