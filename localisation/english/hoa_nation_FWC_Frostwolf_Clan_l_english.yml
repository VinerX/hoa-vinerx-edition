###############################
# Characters
###############################
FWC_durotan:0 "Durotan"
POLITICS_DUROTAN_DESC:0 "The youngest son of Garad, his rise to chieftain is a tale of woe. His eldest brother unbeknownst to his clan abandoned them taking on the name Fenris and now leads the rival Thunderlords, his elder brother Ga’nar was killed in the battle of Bladespire Hold and his father fell victim to the Red Pox epidemic spawned by Gul’dan. He is the embodiment of the morals the Frostwolves stand for: community, family, honor, and harmony. He is the last surviving chieftain who holds critical views of Gul’dan, and the actions taken against the Draenei and stood idly by as his home slowly wasted away through the use of Fel magic. One of the few Orcs to have not drank the blood of Mannoroth, Durotan forbade his clan to do so, Making the frostwolf seen a weak clan by many Orcs. While begrudgingly following the Horde, Durotan has sacrificed morals and beliefs for the betterment of his clan, following the Horde into Azeroth to find a new home for his clan, and his unborn son, Knowing Gul’dan is scheming his demise."
FWC_drekthar:0 "Drek'thar"
POLITICS_DREKTHAR_DESC:0 "Farseer, Elder Shaman and reluctant Chieftain of the Frostwolf Clan after the passing of Durotan and Draka. When the Shamans of Draenor lost connection to the Elements Drek’thar underwent the teachings of Fel Magic under Gul'dan's Shadow Council and committed many atrocities to the Draenei people while being corrupted by these magics, though when arriving on Azeroth he felt the presence of the elements again and renounced the corrupting influence of Fel Magic and embraced the old shamanistic ways and through this embrace was able to get aid of the white wolves of the mountains to their aid after the deaths of the frost wolves back on Draenor. Repentful for his actions and now having the role of leadership forced onto him, he leads his people in harsh and meager conditions in the Alterac mountains hoping to escape the ire of both Horde and Alliance alike."
FWC_thrall:0 "Warchief Thrall"
POLITICS_THRALL_DESC:0 ""

FWC_draka:0 "Draka"
FWC_nazgrel:0 "Nazgrel"
FWC_galvangar:0 "Galvangar"
POLITICS_GALVANGAR_DESC:0 "Galvangar treads the path of the Blade, with Drek’thar traveling to the West to assist the young warchief it falls to him to safeguard what remains of his clan, though he is not a powerful shaman, he has learned to once again respect the elements with Drek'thars guidance."
###############################
# Units
###############################

###############################
# Ideas
###############################
FWC_unwavering_composure:0 "Unwavering Composure"
FWC_unwavering_composure_desc:0 "The Frostwolves are unique among the horde; while their Horde allies are often prone to violent anger and irrationality, since their founding by Garad the orcs that left Frostfire Ridge have always rejected those impulses. It is through this distinction that the clan achieved the strong sense of nobility and spiritual equilibrium which they take such pride in."
FWC_Frostwolf_Packs:0 "Frostwolf Packs"
FWC_Frostwolf_Packs_desc:0 "The Orcs who dwell in the Frostfire Mountains are gifted with the Frostwolves who roam the mountains. Providing them a consist source of pack riders."
FWC_temporary_settlements:0 "Temporary Settlements"
FWC_temporary_settlements_desc:0 "The Orcs have established several temporary settlements for their people across many continents. However it is very costly to upkeep as they are constantly on the move."

FWC_hidden_from_the_world:0 "Hidden from View"
FWC_hidden_from_the_world_desc:0 "With the aid of the Elements we have been able to hide ourselves from the outside world, though the ocassional human will stumble into our midst it seems that no one believes them when they are told an entire warband is just on their doorstep"
###############################
# Focus Tree
###############################

###############################
# Events
###############################
frostwolf.1.t:0 "Call to Arms"
frostwolf.1.d:0 "Doomhammer has successfully convinced Blackhand to end Gul’dans influence over the horde and has rallied clans that will support this cause to his side. Now is the time to stop the corruption of our race and free ourselves from the fel."
frostwolf.1.option.1:0 "To arms!"

frostwolf.2.t:0 "Banished from the Horde"
frostwolf.2.d:0 "Guldan has approached us with an ultimatum, he will kill our entire clan with the support of Blackhand or we will leave the horde and never make any attempts to contact it or anyone inside it ever again."
frostwolf.2.option.1:0 "We can’t risk war."

### Third War

frostwolf_third_war.1.t:0 "The Siege of Durnholde"
frostwolf_third_war.1.d:0 "   Durnholde Keep, once the symbol of the Alliance's dominance over our people now lies in ruins. Our Horde, harnessing the ancient power of shamanism, has not only redeemed itself from it’s defeat against the Alliance but has also cast off the corrupting influence of the Burning Legion and fel magic.\n\n While uncertainties remain, there is a prevailing optimism among our ranks that under the leadership of Warchief Thrall, the Horde is poised to enter a new era of prosperity."
frostwolf_third_war.1.option.1:0 "We are free at last."

frostwolf_third_war.2.t:0 "The Siege of Durnholde"
frostwolf_third_war.2.d:0 "Durnholde Keep now lies in ruins, a testament to the New Horde's destructive power. Our investments in the Alliance Interment Act have proven fruitless, and it's clear we should never have backed this initiative. Rounding up and eliminating the Orc threat might have been the better approach from the start. The logical choice now is to break away from the Alliance and take matters into our own hands by directly addressing the Orc menace."
frostwolf_third_war.2.option.1:0 "The Alliance has failed."

frostwolf_third_war.3.t:0 "The Nightmare"
frostwolf_third_war.3.d:0 "   This night was an unseasy night for Warchief Thrall. In his dreams, the warchief was seeing a clash of monumental proportions between the forces of the Alliance and the Horde. Within the throes of an immense battlefield, the very heavens themselves erupted into torrents of fel fire, plummeting from the skies to wreak havoc upon the opposing forces. This vision of horror was then abruptly ended by the strange figure and voice of an old man, demanding Thrall to rally all the orcs clans.\n\n   The Warchief suddenly woke up to the sound of thunder, drenched in sweat. The nightmare had left him with an unsettling impression of a cataclysmic conflict yet to come..."
frostwolf_third_war.3.option.1:0 "Strange..."

frostwolf_third_war.4.t:0 "The Prophet"
frostwolf_third_war.4.d:0 "   As Thrall exited his hut after this uneasy night, the man that he had seen within his dream now stood before him in the flesh. He then delivered a grave warning to Thrall about the impending demonic threat, stating that his dream of last night wasn't a simple nightmare, but a vision... \n\n   He prompted the necessity for Thrall to unite the orcish clans and embark on a westward journey to the forgotten lands of Kalimdor, the ancient continent where the Horde's salvation awaits.\n\n   Despite his human appearance, Thrall felt that the Elements were vouching for the strange prophet, inclining him to trust in the old man's words..."
frostwolf_third_war.4.option.1:0 "We shall depart for Kalimdor."
frostwolf_third_war.4.option.2:0 "This is nothing but human trickery!"

frostwolf_third_war.5.t:0 "Exodus of the Horde"
frostwolf_third_war.5.d:0 "   In order to leave for Kalimdor, the Horde needed ships, and after successfully raiding the Alliance's port of Southshore, they got their hands on a modest fleet.\n\n   The Frostwolf Clan, after rallying its allies of the Warsong Clan, embarked the human vessels and commenced their momentous journey to the distant lands of Kalimdor\n\nDrek'thar however has chosen to stay behind, he believes some of our number would not survive the trip to this unknown lands, with the demon blood still causing them to be weak he fears they would fall due to exposure long before they reach the promised land."
frostwolf_third_war.5.option.1:0 "Thus begins the Exodus of the Horde."
frostwolf_third_war.5.option.2:0 "Remain with the Remnants"

frostwolf_third_war.6.t:0 "Unexpected Storm"
frostwolf_third_war.6.d:0 "A Storm has torn are fleet apart and we have crash landed on an unexpected isle."
frostwolf_third_war.6.option.1:0 "Shipwrecked"

frostwolf_third_war.7.t:0 "The Darkspear"
frostwolf_third_war.7.d:0 "A Tribe of trolls known as the Darkspear occupy these lands and have offered to join the Horde."
frostwolf_third_war.7.option.1:0 "A Worthy Addition to the Horde"

frostwolf_third_war.8.t:0 "The Underworld Tribe"
frostwolf_third_war.8.d:0 "A Tribe of Murlocs lead by a Sea Witch have risen from the depth to claim these isles for their master."
frostwolf_third_war.8.option.1:0 "To arms warriors!"

frostwolf_third_war.9.t:0 "Journey to Kalimdor"
frostwolf_third_war.9.d:0 "The Time has come to abandon these Isles and continue our journey to Kalimdor"
frostwolf_third_war.9.option.1:0 "Set sail for Kalimdor"

frostwolf_third_war.10.t:0 "Arrival in Durotar"
frostwolf_third_war.10.d:0 "We have arrived in what we believe to be Kalimdor. A desert wasteland hopefully the prophet hasn't tricked us into coming here."
frostwolf_third_war.10.option.1:0 "To arms warriors!"

frostwolf_third_war.11.t:0 "The Search for Grom"
frostwolf_third_war.11.d:0 "Hopefully Hellscream and the Warsong made it to Kalimdor"
frostwolf_third_war.11.option.1:0 ""

frostwolf_third_war.12.t:0 "The Bloodhoof Tribe"
frostwolf_third_war.12.d:0 "A Tribe of strong beasts known as Tauren have offered to join the Horde."
frostwolf_third_war.12.option.1:0 "A Worthy Addition to the Horde"

frostwolf_third_war.13.t:0 "Durotar"
frostwolf_third_war.13.d:0 "    As much as the new lands that surrounds us look dry and harsh, they are not unlike some regions of our old forsaken homeland of Draenor, with its red earth and winding canyons. While some may struggle in such environment, our orcish race can thrive within it.\n\n    In order of his father, Durotan, warchief Thrall has decided to name this land Durotar and claim it as our own. He sees within it a new homeland and the perspective of a prosperous Horde on Azeroth.\n\n    Already we are mustering our troops to secure the canyons and crags of newly named Durotar from the dangerous creatures that inhabits it, and hopefully soon enough we will have control over the whole region."
frostwolf_third_war.13.option.1:0 "Lok-narash warriors!"
frostwolf_third_war.13.option.1.d:0 "§HCore§! all states already owned in §HDurotar§!.\n§HClaim§! all other states in §HDurotar§! that are not owned by us or allies."

frostwolf_third_war.14.t:0 "Founding of Orgrimmar"
frostwolf_third_war.14.d:0 "    Our conquest of these lands have led us to grand canyons within the rugged mountains to the north. Now freed from their previous inhabitants, the large valleys peacefully carry the echos of the wind breezing through them.\n\n    As beautiful as they look, Warchief Thrall believe that these rocky walls would provide perfect protection. Moreover he states that the place is blessed by the elements. As such, he has declared that these canyons will be our new home and within them we shall construct a capital worthy our Horde.\n\n    Deciding to mark the beginning of a new age for The Horde, while also acknowledging our past and traditions, Thrall has decided to name this city in honor of former Warchief Orgrim Doomhammer. Therefore the capital shall be called: Orgrimmar. And our people shall carry its name.\n\n    At last, after years of suffering and tribulation, the Horde has finally found a land to call its own."
frostwolf_third_war.14.option.1:0 "Orgrim would be proud."
frostwolf_third_war.14.option.1.d:0 "§tLok'tar Ogar! For the Horde!§!"

frostwolf_third_war.15.t:0 "Our Brave Warriors"
frostwolf_third_war.15.d:0 "The warriors who held their ground with the Warsong clan and aided our escape have made it safely to the shores of these islands."
frostwolf_third_war.15.option.1:0 "The spirits have guided them well"

frostwolf_third_war.16.t:0 "The Burning Blade"
frostwolf_third_war.16.d:0 "It has been ten long years since we last had contact with the Burning Blade Clan, their savagery and madness had taken them over and they were little but madmen who only saught death through combat, a number of them have landed on our shores fleeing the cult their clan had become, through our people are cautious we are not one to turn away fellow orcs that are in need of help."
frostwolf_third_war.16.option.1:0 "Their Blademasters will serve us well."

frostwolf_third_war.17.t:0 "Drek'thars Return"
frostwolf_third_war.17.d:0 "Drek'thar has travelled across the seas to find us, he mentions a whsiper on the wind guiding him, but no message was sent.\nStill his arrival is more then welcome."
frostwolf_third_war.17.option.1:0 "May the spirits guide us."

### Frostwolf Remnants

frostwolf_WCC.1.t:0 "Those who Remain"
frostwolf_WCC.1.d:0 "Thrall is young, and whats to do what is best for our people, he see hope for all of the clans in this 'new land' but he forgets that this was meant to be our new home, i hope he is right, for all of our sakes."
frostwolf_WCC.1.option.1:0 "The Elements shall hide us."

frostwolf_WCC.2.t:0 "A Message on the Winds"
frostwolf_WCC.2.d:0 "The Young Warchief has done it, he has made it to this new land but it does not seem to be as hospitable as he has hoped.\nI feel that he may need my guidance in this new trial of his."
frostwolf_WCC.2.option.1:0 "May the elements guide me."
frostwolf_WCC.2.option.2:0 "He must face trial this on his own."

