GOR_Gordunni_Clan_desc:0 "The Gordunni Clan are a highly aggressive and fierce Ogre clan."
GOR_Emerald_Nightmares:0 "Emerald Nightmares"
GOR_Emerald_Nightmares_desc:0 "After expanding further and further into Feralas, the Emerald Whispers began to haunt King Gordok's mind, driving him insane."
GOR_Madness_And_Slaughter:0 "Madness and Slaughter"
GOR_Madness_And_Slaughter_desc:0 "The Emerald Whispers slowly delved into Nightmares, as the once prideful King Gordok was driven mad. He ordered his Ogres to slaughter anything they could find, not a living thing would step foot in Feralas except the Gordunni."
