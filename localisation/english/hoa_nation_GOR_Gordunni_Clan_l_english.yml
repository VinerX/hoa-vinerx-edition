POLITICS_KING_GORDOK_DESC:0 "His true name is Ulrok, and he is King of the Gordunni Ogres. He is cunning and powerful, and rules the Gordunni Ogres with an iron fist."
POLITICS_KING_GORDOK_DESC_AZEROTH:0 "His true name is Ulrok, and he is King of the Gordunni Ogres. He is cunning and powerful, and rules the Gordunni Ogres with an iron fist. Dire Maul is his kingdom and he will expand it across Feralas and the world beyond."

