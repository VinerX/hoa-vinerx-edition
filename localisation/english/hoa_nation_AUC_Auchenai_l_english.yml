AUC_Hope_Is_Lost:0 "Hope is Lost"
AUC_Hope_Is_Lost_desc:0 "With the destruction of Auchindoun by Murmur's arrival, majority of the Draenai in Auchindoun died, leaving only a fraction of its former population."
AUC_Necromancy:0 "Necromantic Practices"
AUC_Necromancy_desc:0 "Exarch Maladaar has gone mad after the genocide of the Draenei, he has driven himself to practice Necromancy to resurrect his fallen brothers and sisters."
