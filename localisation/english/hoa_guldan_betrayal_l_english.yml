l_english:
 guldan_betrayal.1.t:0 "The Enemy Is Divided"
 guldan_betrayal.1.d:0 "Word races north from the front: Gul'dan and his Stormreaver have abandoned the siege, chasing the promise of godhood beneath the waves. The Horde that shattered Stormwind now turns upon itself, its clans quarreling over a Warchief who cannot hold them. Such a fracture in the enemy will not last. If the Alliance strikes now — while the orcs are leaderless and at each other's throats — the tide of the Second War may finally turn."
 guldan_betrayal.1.a:0 "Exploit the Horde's crisis!"
 guldan_betrayal.1.b:0 "Consolidate our lines first."

 horde_the_horde_divided_mild:0 "The Horde Divided"
 horde_the_horde_divided_mild_desc:0 "Gul'dan's treachery has unsettled the clans. The Warchief still holds most of the Horde together, but discipline and momentum have suffered."
 horde_the_horde_divided_moderate:0 "The Horde Divided"
 horde_the_horde_divided_moderate_desc:0 "The betrayal has spread. Clans bicker and drift; the war effort falters as the Warchief struggles to keep the Horde marching."
 horde_the_horde_divided_severe:0 "The Horde Fractures"
 horde_the_horde_divided_severe_desc:0 "The Warchief's grip has failed. Clans turn on one another, supply lines collapse, and the offensive grinds to a halt as the Horde tears itself apart."
 guldan_clan_infighting:0 "Followed Gul'dan"
 guldan_clan_infighting_desc:0 "This clan has abandoned the Horde to pursue Gul'dan's ambitions — or to settle old scores. It no longer answers the Warchief's call and wages no coordinated war."
 alliance_the_enemy_is_divided:0 "The Enemy Is Divided"
 alliance_the_enemy_is_divided_desc:0 "The Horde is fractured and leaderless. While the orcs quarrel among themselves, Alliance forces press the advantage on every front."
