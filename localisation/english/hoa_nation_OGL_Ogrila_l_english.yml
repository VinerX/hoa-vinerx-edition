OGL_mogdork_the_wizened:0 "Mog'dorg the Wizened"
POLITICS_MOGDORG_THE_WIZENED_DESC:0 "Lord of Ogri’la, one of the few peaceful Ogre Clans, Mog’dorg believes that cooperation is the best chance for the Ogres of Draenor to survive against the Horde - and he is a chief enemy against Gruul."
POLITICS_MOGDORG_THE_WIZENED_DESC_POST_SHATTERING:0 "Lord of Ogri’la, one of the few peaceful Ogre Clans, Mog’dorg believes that cooperation is the best chance for the Ogres of Outland to survive against the Fel Horde and the Demons that control the planet - and he is a chief enemy against Gruul."

