NFD_ogre_their_heads:0 "Ogre Their Heads"
NFD_ogre_their_heads_desc:0 "The Ogres have no idea who they serve, they came through as Slaves and many remained slaves, an odd choice. My father spoke of their ancestors, great towering behemoths, oh how they have fallen."

NFD_badlands_outpost:0 "Eyes to the Badlands"
NFD_badlands_outpost_desc:0 ""
NFD_badlands_scouts:0 "Badland Scouts"
NFD_badlands_scouts_desc:0 "The Ogres as irritating as they are to deal with they can be subtle sometimes, they have been able to infiltrate deep into the Badlands and have made contact with Velarok, who did not take too kindly to being approached by the Fireguts."
NFD_siege_engineering:0 "Siege Engineering"
NFD_siege_engineering_desc:0 "The Ogres are said to make great boats, not contraptions made of Wood but Iron and Steel, they have minds enough to understand boyancy, let us hope they have minds for siegecraft."
NFD_dragonman_forges:0 "Born of Fire"
NFD_dragonman_forges_desc:0 "The men of the south who have been drawn to my services have been changed to my liking, they are resistant to heat and are more suitable now as my subjects, but many of them are malformed and they disgust me, send them to the Ogres to help them."
NFD_lab_refurbishment:0 "Lab Refurbishment"
NFD_lab_refurbishment_desc:0 "The Ogres have been able to increase the supply number of eggs we have been able to smuggle in through the south, unlike my sister i do not have the means to watch over our own flights eggs so patiently."
NFD_cabal_intergration:0 "Cabal Infilration"
NFD_cabal_intergration_desc:0 ""

NFD_badlands_beatdown:0 "Badlands Beatdown"
NFD_badlands_beatdown_desc:0 "The Failed Titan Experiments have woken from one of their vaults, let us test the old stone against new flesh."

NFD_the_rookery:0 "The Rookery"
NFD_the_rookery_desc:0 "Unlike my lovely sister, i do not have the benifit of having a damp hole in the ground to hide the clutch, instead i am forced to use the Orcs as guards."

