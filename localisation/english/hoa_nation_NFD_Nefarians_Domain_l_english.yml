NFD_the_siblings_plan:0 "The Siblings Plan"
NFD_the_siblings_plan_desc:0 "We must not be too quick to begin out domination of the world, my dear sister has managed to get her claws into a rather upstanding member of the Stormwind Army, and it all seems to be going to plan."
NFD_an_offer_of_compliance:0 "An Offer of Compliance"
NFD_an_offer_of_compliance_desc:0 "The Chromatic experiments are restless, they have a thirst for destruction i have not seen since father, Gyth will serve as a reminder to the Blackrock Warchief of our agreement, and also serve as useful testing ground for his abilities, and if Rend is to turn against us...Gyth will simply eat him."

NFD_waited_long_enough:0 "Waited Long Enough"
NFD_waited_long_enough_desc:0 "Onyxia has her own plans to attend to, I on the other hand see a way forward and would rather snuff out these resistant mortals as soon as possible."
NFD_unwanted_modification:0 "Unwanted Modifications"
NFD_unwanted_modification_desc:0 "The Ogres are a sturdy but stupid race, the Orcs tell of a old empire they ruled before the orcs came to this world. They once had Magi who could shape the Arcane to their bidding, let us see if their bodies can...Adapt to our experiments."
NFD_gnoll_target_practice:0 "Gnoll Target Practice"
NFD_gnoll_target_practice_desc:0 "I find it rather odd that the Badlands seem to be infested with these Drysnout Gnolls, but i have never actually seen one with my own two eyes, my experiments and lackies have told me of them, but i personally consider them a myth."
NFD_slaughter_the_beasts:0 "Slaughter The Beasts"
NFD_slaughter_the_beasts_desc:0 ""
NFD_grind_them_to_dust:0 "Grind Them To Dust"
NFD_grind_them_to_dust_desc:0 ""
NFD_assert_direct_control:0 "Assert Direct Control"
NFD_assert_direct_control_desc:0 ""
NFD_sudden_cave_ins:0 "Sudden Cave In"
NFD_sudden_cave_ins_desc:0 ""
NFD_the_hordes_choice:0 "The 'Hordes' Choice"
NFD_the_hordes_choice_desc:0 "My sister cannot explain how the Thralls Horde managed to gain a foothold in the Badlands, but it matters not, they are far beyond the reach of any help."
NFD_she_protests_to_much:0 "She Protests To Much"
NFD_she_protests_to_much_desc:0 "Dear Sister has thrown a tantrum about how much she needs to do to keep Stormwind from launching a full offensive at Blackrock Mountain, with all the time she is spending with Bolvar i would have assuemed she had the Stormwind army under he complete control."
NFD_a_path_untread:0 "A Path Untread"
NFD_a_path_untread_desc:0 ""

###############################
#events
###############################

nefarians_domain.1.t:0 "The Lord of Blackrock"
nefarians_domain.1.d:0 "Nefarian, eldest son of Deathwing, rules Blackrock Spire as Lord Victor Nefarius. Disguised as a human noble, he commands the Blackrock clan and their ogre allies, weaving a web of deception to futher both his fathers plans, and his own."
nefarians_domain.1.option.1:0 "Excellent..."

nefarians_domain.2.t:0 "My Ambitions"
nefarians_domain.2.d:0 "Seeking to fulfill his father's legacy of destruction, he plots to dominate Azeroth, with his sister firmly placed within Stormwind, his goal is to bend the Orcs this his own will. His ambition is boundless, driven by hubris and a thirst for power."
nefarians_domain.2.option.1:0 "With pleasure..."

nefarians_domain.3.t:0 "Cromatic Experiments"
nefarians_domain.3.d:0 "Using his twisted genius, Nefarian has begun the creation of the chromatic dragonflight, blending the powers of all dragonflights into a supreme force. He forges these abominations to build an army to replenish his flights strength, and even subjugate Ragnaros and his fiery dominion"
nefarians_domain.3.option.1:0 "Taste in my power!"

nefarians_domain.4.t:0 "The Lesser Races"
nefarians_domain.4.d:0 "Using his twisted genius, Nefarian has begun the creation of the chromatic dragonflight, blending the powers of all dragonflights into a supreme force. He forges these abominations to build an army to replenish his flights strength, and even subjugate Ragnaros and his fiery dominion"
nefarians_domain.4.option.1:0 "They understand my Greatness"
nefarians_domain.4.option.2:0 "Dont Drop them"

nefarians_domain.5.t:0 "Winged Backstabber"
nefarians_domain.5.d:0 "The Blackwing Bastard has betrayed us, he has sunk his teeth into the minds of the Dragonmaw and turned them against us, time to stick him like the pig he is."
nefarians_domain.5.option.1:0 "His Skull will be my trophy!"

