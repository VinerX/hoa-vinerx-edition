 generic_horde_peacetime_preparations_focus:0 "Peacetime Preparations"
 generic_horde_peacetime_preparations_focus_desc:0 "In the lull before war, there is little time to remain idle. Ours is a clan of warriors and craftsmen, and we must ready ourselves for the next conflict to come."
