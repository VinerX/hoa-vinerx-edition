 generic_support_the_horde_focus:0 "Support the Horde"
 generic_support_the_horde_focus_desc:0 "Strength, honor, passion. The Horde stands for all these ideals and more. With the Horde at our back the entire world would quake at the mention of our name."
 generic_horde_demand_respect_focus:0 "Demand Respect"
 generic_horde_demand_respect_focus_desc:0 "Our clansmen mock us when they think we aren't looking, they jeer at us within earshot when they think we're too far to listen. Or perhaps... they don't, and this mockery of our right to lead is purposeful... Regardless of the why, it ends now! We will claim the respect we are due as chieftan of our clan. "
 generic_horde_wartime_fervour_focus:0 "Wartime Fervor"
 generic_horde_wartime_fervour_focus_desc:0 "War is our true element. The fire of battle has forged many a legend, and gods willing, with our ferocity as its fuel, it shall forge many more yet."
 generic_prove_our_strength_focus:0 "Prove our Strength"
 generic_prove_our_strength_focus_desc:0 "We cannot expect to enter into the Horde with nothing to show for it. Only by standing strong and proving our worth will the Warchief seek to add our numbers to the might of the Horde."
 generic_horde_displace_pests:0 "Displace Pests"
 generic_horde_displace_pests_desc:0 "Many of the lesser races of Azeroth continue to interrupt our way of life, be it the murlocs damaging our boats, or the Kobolds digging into our mines, we need to move them out of the areas near people if we are to prosper."
 generic_horde_displace_pests_tt:0 "Unlock the Ability declare war on nations controlled vermin nations such as §YMurlocs§!, §YKobolds§!, §YSnobolds§! etc"

 generic_horde_embrace_exiles:0 "Embrace Exiles"
