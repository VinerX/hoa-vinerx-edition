WIN_bena_winterhoof:0 "Bena Winterhoof"
POLITICS_BENA_WINTERHOOF_DESC:0 "Bena Winterhoof well represents her tribe as an artisan alchemist, one that has trained many of Thunder Bluff's finest. The humble Winterhoof Tribe are consummate masters of the alchemical and herbal trades among the noble Tauren of Mulgore. The Winterhoof have survived through cooperation with their fellows upon the plains, but the strangers arriving upon Kalimdor's shores bring grim tidings... Darker even than they've seen already. If the Winterhoof are to survive, this small tribe and its allies must come together as never before, for nothing else will be sufficient to withstand the storm to come."
