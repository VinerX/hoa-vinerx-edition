 BRC_orgrim_doomhammer_desc:0 "Orgrim Doomhammer servers as our second in command. A tactical genius from birth he has the respect of not just our warriors but of all warriors in the horde. Orgrim also has very close ties to the Chieftain of the Frostwolf clan. When the time comes, he could prove to be our greatest asset or worst enemy."
 BRC_dreadmaul_clan_1:0 "Dreadmaul Clan"
 BRC_dreadmaul_clan_1_desc:0 "The Dreadmaul Clan is a clan of Ogres residing inside the Blackrock Clan. They specialize in warriors who use the brute strength of their race to clobber anyone who stands in their way."
