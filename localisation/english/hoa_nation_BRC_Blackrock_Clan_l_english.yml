 BRC_dreadmaul_battleships_idea:0 "Dreadmaul Battleships"
 BRC_dreadmaul_battleships_idea_desc:0 "The ogres of the Dreadmaul clan once forged colossal warships, mounting the largest cannons ever seen on Draenor. Now, they will design our ships on Azeroth."
 BRC_blackrock_shipwrights:0 "Blackrock Shipwrights"
 BRC_blackrock_shipwrights_desc:0 "Solog Roark was the most talented shipwright on Draenor. Employing him to oversee the construction of our fleet here on Azeroth will be imperative to defeating the Humans."

 BRC_cut_off_stromgarde_idea:0 "Cut off Stromgarde"
 BRC_push_for_capital_city_idea:0 "Push for Capital City"
 BRC_victory_in_stromgarde_idea:0 "Victory in Stromgarde"

 BRC_blackrock_lancers_idea:0 "Adapted Weaponry"
 BRC_blackrock_lancers_idea_desc:0 "The pink skins broke through our lines with their armoured forces on the backs of hoofed beasts, our raiders have begun to replicate their heavy long spears, Doomhammer even laughed at the wolves as they tried to balance themselves with a rider and an extra 6-7 feet of wood and iron dangling in front of their faces."

 BRC_feeding_the_clan_idea:0 "Feeding the Clan"
 BRC_shadow_council_warlocks_idea:0 "Shadow Council Warlocks"
 BRC_shadow_council_warlocks_idea_desc:0 "Former warlocks of the Shadow Council have joined the Blackrock Clan. These new experimented spellcasters bolster their ranks."

 BRC_harsh_occupation:0 "Occupation Forces"
 BRC_harsh_occupation_desc:0 "The Warchief has demanded that the land under our control are brought to heel by any means"

 BRC_blackrock_elites:0 "Blackrock Sergeants"
 BRC_blackrock_elites_desc:0 "Resistance is fiercer then we had expected from this world, We have called on the hardened warriors from our ancestral caves."

 BRC_sacked_thelsamar:0 "Sacked Thelsamar"
 BRC_sacked_thelsamar_desc:0 "The Resouces of this village will fuel our ongoing war efforts."

 BRC_banned_fel_magic:0 "Banned Fel Magic"
 BRC_banned_fel_magic_desc:0 "By the Command of Doomhammer, all practice of tainted fel magic will be stomped out."

