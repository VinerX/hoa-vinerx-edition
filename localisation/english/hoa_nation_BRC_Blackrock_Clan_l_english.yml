 BRC_circles_of_binding_fel_idea:0 "Siphoning the Circles of Binding"
 BRC_circles_of_binding_fel_idea_desc:0 "The warlocks and necrolytes of the [BRC.GetName] are siphoning and twisting the elemental powers of the Circles of Binding of the Arathi Highlands to unleash their dark magic."

 BRC_circles_of_binding_shamanism_idea:0 "Circles of Binding"
 BRC_circles_of_binding_shamanism_idea_desc:0 "The shamans from the [BRC.GetName] are communing with the elementals of the arathi Circles of Binding to bolster their powers."

 BRC_horde_overstretch_tier_1_idea:0 "Overstretched Horde - Minimal"
 BRC_horde_overstretch_tier_2_idea:0 "Overstretched Horde - Mild"
 BRC_horde_overstretch_tier_3_idea:0 "Overstretched Horde - Worrying"
 BRC_horde_overstretch_tier_4_idea:0 "Overstretched Horde - Significant"
 BRC_horde_overstretch_tier_5_idea:0 "Overstretched Horde - Problematic"

 BRC_internment_camps_idea:0 "Internment Camps"
 BRC_internment_camps_idea_desc:0 "Troublemakers and opposants are sent into internment camps to work until they are released... or die."

 BRC_increased_garrison_forces_idea:0 "Increased Garrison Forces"
 BRC_increased_garrison_forces_idea_desc:0 "We are increasing the amount of grunts working in our garrisons in order to quell any resistance."

 BRC_masters_of_the_continent_idea:0 "Masters of the Continent"
 BRC_masters_of_the_continent_idea_desc:0 "At last, the Horde's territory spans from North to South, controlling most of the Eastern Kingdoms."

 BRC_Forest_Troll_Allies:0 "Forest Troll Allies"
 BRC_Forest_Troll_Allies_desc:0 "The Smolderthorn and Firetree Tribes have pledged their support to the Dark Horde, having travelled all the way from Zul'Aman, they are clearly loyal supporters of the Dark Horde."
###############################
#focus tree
###############################

 BRC_a_new_world:0 "A New World"
 BRC_a_new_world_desc:0 "After years of suffering from barren wastelands and a lack of resources on Draenor, we have arrived on a new world known as Azeroth. The land is ripe and suitable for our needs. Within time we will be prepared to conquer it all for the Horde!"
 BRC_a_new_world_tt:0 "\nThe §RWarchief§! will be tasking the §7[BHC.GetName]§! and §g[DMC.GetName]§! to §Hexplore and establish a presence§! in the swamps north.\n\n"
 BRC_discipline_peons:0 "Discipline Peons"
 BRC_discipline_peons_desc:0 "Many of our peons have been sluggish in recent years. We must discipline them back into shape in preparation of our conquest."
 BRC_light_the_forges:0 "Light the Forges"
 BRC_light_the_forges_desc:0 "The peons have been brought into the forges and are already working tirelessly to produce tools and weapons to support our coming conquests."
 BRC_a_new_foundry:0 "Construct New foundries"
 BRC_a_new_foundry_desc:0 "On Draenor, Blackrock Foundry is the awe of all the clans. A great forge that towers above the spires of Gorgrond producing endless streams of weapons for our warriors. We shall accomplish the same on Azeroth by creating new foundries to supply our warriors with weapons capable of drowning our enemies in their own blood."
 BRC_steel_weapons:0 "Traditional Weapons"
 BRC_steel_weapons_desc:0 "Despite the discovery of new ore on Azeroth, Blackrock Steel is still the finest known to orcs. It would be madness to abandon this resource for our warcraft."
 BRC_clear_land:0 "Clear Land"
 BRC_clear_land_desc:0 "The land surrounding of the Dark Portal has already been cleared of the vegetation that grew here, mostly because it died from the influence of its dark energies. Some pockets still remains, made up of dying trees and bushes, unusable for anything but taking space nonetheless."
 BRC_thorium_deposits:0 "Thorium Deposits"
 BRC_thorium_deposits_desc:0 "Our peons have come to us with reports of a strange new metal not found on Draenor. It is reported to glow, even when cool, and to be much lighter for its size than traditional metals. We must begin extracting this metal to be used in our weapons!"
 BRC_thorium_weapons:0 "Thorium Weapons"
 BRC_thorium_weapons_desc:0 "After much trial and error, our blacksmiths have produced weapons from the new metal. They allow our troops to strike with greater force than with our traditional weapons, but at the cost of requiring more skilled blacksmiths to produce reliably."
 BRC_prospecting_the_land:0 "Prospecting the Land"
 BRC_prospecting_the_land_desc:0 "We need to dig deeper and look for more place where that new ore could be found. Teams of peons have already been sent all around, prospecting for more."
 BRC_the_blackrock_war_machine:0 "Blackrock War Machine"
 BRC_the_blackrock_war_machine_desc:0 "Our clan is renowned on Draenor for our weaponsmiths and armorers, and we must carry this legacy forward to this new world. Here in [384.GetName] we will begin preparations to create a massive force of smiths to provide for our troops in our upcoming conquests!"
 BRC_the_blackrock_war_machine_2:0 "Blackrock War Machine"
 BRC_the_blackrock_war_machine_2_desc:0 "Our clan is renowned on Draenor for our weaponsmiths and armorers, and we must carry this legacy forward to this new world. Recently, the warchief has ordered to increase the production to meet with the ever growing demand of the war effort."
 BRC_discipline_the_war_band:0 "Discipline the Warband"
 BRC_discipline_the_war_band_desc:0 "The great clans of the Horde have been been squabbling over petty titles and the desecrated lands of Draenor for years. Now with new land fit for the taking, our warrior's bloodlust must be tamed and their loyalty to their Warchief secured before they can be unleashed."
 BRC_adapting_to_azeroth:0 "Adapting to Azeroth"
 BRC_adapting_to_azeroth_desc:0 "This world is strange and foreign to us, but with each passing day the clans grow more and more accustomed to it. With time even the earth's will itself will bend to the might of the Horde!"
 BRC_tame_a_new_sea:0 "Taming a New Sea"
 BRC_tame_a_new_sea_desc:0 "This world possess vast bodies of water. We do not know how truly big they are yet, but we must learn how to traverse these new oceans to expand our horizons and ensure our dominance over this new world."
 BRC_new_naval_tactics:0 "New Naval Tactics"
 BRC_new_naval_tactics_desc:0 "As we adapt to this new world, we have come to recognize the similarities and differences of its vast seas to those we sailed back on Draenor. Our naval knowledge shall be tested, and we must learn to adapt to the new challenges that come with navigating these waters."
 BRC_grunt_equipment:0 "Improved Grunt Equipment"
 BRC_grunt_equipment_desc:0 "As the ways of war change, so too must the tools. To be prepared for the inevitable conquest of this world, we must devise ever stronger weapons for our soldiers."
 BRC_infantry_army:0 "Infantry Army"
 BRC_infantry_army_desc:0 "While the might of a charging wolf pack is to be feared by all, the humble orc grunt has always been and will always be the most numerous and mightiest part of the Horde, and must be given precedence if we are to overwhelm our enemies."
 BRC_blackrock_raiders:0 "Blackrock Raiders"
 BRC_blackrock_raiders_desc:0 "The raiders of the Blackrock Clan are legendary across Draenor. Not even the riders of the Frostwolf Clan can claim such respect."
 BRC_mobile_army:0 "Mounted Army"
 BRC_mobile_army_desc:0 "Any orc can be a grunt, but it takes a truly skilled orc to be a wolf rider. By focusing our efforts on honing the skills of those trained in the art of mounted warfare, we will overrun our enemies before they even know we are upon them."
 BRC_constuct_roosts:0 "Construct Roosts"
 BRC_constuct_roosts_desc:0 "The Dragonmaw lack proper nesting grounds for their beasts of war. Creating new ones shall grant us superiority in the skies."
 BRC_dragonwmaw_rylaks:0 "Dragonmaw Rylaks"
 BRC_dragonwmaw_rylaks_desc:0 "Known as Nelghor in the orcish tongue, the viscious two-headed beasts are controlled by the Dragonwmaw Clan to claim the skies."
 BRC_worg_breeding:0 "Worg Breeding"
 BRC_worg_breeding_desc:0 "Worgs are fierce, intelligent predators that can bear the weight of an orc raider. Improving the worg breeds will make them larger and smarter."
 BRC_supply_the_frontline:0 "Supply the Frontline"
 BRC_supply_the_frontline_desc:0 "Focusing on improving our transportation methods and our supply chain will ensure our armies are well-fed and well-equipped."
 BRC_blackrock_warlords:0 "Blackrock Warlords"
 BRC_blackrock_warlords_desc:0 "Those orc of the Blackrock clan who lead our wolf riders are truly the greatest champions we have. By giving them the honor and recognition they deserve, we can ensure their loyalty to us, and their place as instrumental in the wars to come."
 BRC_blackrock_warlocks:0 "Blackrock Warlocks"
 BRC_blackrock_warlocks_desc:0 "Though for many generations the orc shaman served as the ambassadors to the arcane, they have been swept aside by a new generation. These warlocks, trained by Gul’Dan and his Shadow Council, wield the power of the fel to great effect."
 BRC_necrolytes:0 "Blackrock Necrolytes"
 BRC_necrolytes_desc:0 "The most sinister of our magical forces, our necrolytes bend death to their will, preventing even the most grievously wounded orc from succumbing to their injuries. And if that fails, they bring the orc back to life as undead, ready to serve in death as they did in life."
 BRC_support_weapons:0 "Improved Support Weapons"
 BRC_support_weapons_desc:0 "To accompany our main forces, we will need specialized troops to fulfill the roles of scouts, captains, assassins, and standard-bearers. We must hurry to ensure these troops are ready to fight with the rest of the Horde."
 BRC_improved_catapults:0 "Improved Catapults"
 BRC_improved_catapults_desc:0 "Catapults are already devastating siege weapons. By further enhancing the main mechanism we can destroy enemy fortifications with greater effiency."
 BRC_blademasters:0 "Blackrock Blademasters"
 BRC_blademasters_desc:0 "Hand-picked swordsmen trained by the legendary warriors of the Burning Blade Clan. While not as deadly as their masters, the Blackrock Blademasters still uphold a reputation among their clan."
 BRC_adapted_army:0 "Adapted Army"
 BRC_adapted_army_desc:0 "After much time and trial, our forces can claim to be fully adapted to this once strange world. With knowledge of the beasts, lands, and obstacles they will encounter, the Horde will conquer and triumph over them all!"
 BRC_found_stonard:0 "Found Stonard"
 BRC_found_stonard_desc:0 "The [BHC.GetName] have reported success in conquering the lands to the north. They assure us that the swamps are bountiful and ripe for the taking, much like the ones we encountered upon arriving on this world. It would be wise for us to establish a forward base in this area, to secure our hold over these new resources and aid us in future conquests."
 BRC_feed_the_clan:0 "Feed the Clan"
 BRC_feed_the_clan_desc:0 "We need to establish farms to sustain our army's growing hunger. Hunting and importing through the Dark Portal are no longer sufficient. The pigs we've brought with us are multiplying, and we'll soon have a source of food that we control."
 BRC_clash_with_the_hakkari:0 "Clash with the Hakkari"
 BRC_clash_with_the_hakkari_desc:0 "Clash with the Hakkari"
 BRC_hakkari_tablets:0 "Hakkari Tablets"
 BRC_hakkari_tablets_desc:0 "The [BHC.GetName] has provided us with intelligence of an ancient temple that lies submerged within the murky depths of the swamp. Their scouts suggest that it may contain valuable relics or artifacts and that should send a scouting party to investigate this temple, for the knowledge and treasures that lie within could prove invaluable."
 BRC_develop_the_swamps:0 "Develop the Swamps"
 BRC_develop_the_swamps_desc:0 "Our journey to the Swamps of Sorrows is complete, and Stonard, our forward base, has been established. It is now time for us to expand our presence, we will start by surveying the area and building the necessary infrastructure to connect to the already existing settlements."
 BRC_expand_rockard:0 "Expand [384.GetName]"
 BRC_expand_rockard_desc:0 "While our main outpost is formidable, it is not nearly up to par with what our clan had on Draenor, nor what it deserves! We must put the peons to work to make the hold the envy of all the Horde!"
 BRC_dreadmaul_brutes:0 "Dreadmaul Brutes"
 BRC_dreadmaul_brutes_desc:0 "While not as numerous as the orcs, the Dreadmaul ogres who reside in [384.GetName] are much more massive and formidable foes. By placing a warband of these ogres in each of our predominantly orc armies, we will have a vanguard able to smash through any defensive line!"
 BRC_firegut_flamespeakers:0 "Firegut Flamespeakers"
 BRC_firegut_flamespeakers_desc:0 "Within the Firegut tribe of ogres in our clan there are those who truly deserve the name - the Firespeakers. Able to wield flame as an orc wields an axe, supplementing our main forces with these ogre magi will surely lead to a fiery end for all who oppose the Horde!"
 BRC_construct_ogre_mounds:0 "Construct Ogre Mounds"
 BRC_construct_ogre_mounds_desc:0 "As we build up our fortifications, we can not forget to provide for the ogre clans within the Blackrock Clan. Due to their immense size and appetites, we must build specialized mounds to house these great warriors."
 BRC_ogre_forges:0 "Ogre Forges"
 BRC_ogre_forges_desc:0 "As ogres have much thicker hides than orcs, they can withstand much greater temperatures, and their size allows them to strike much harder. Naturally, we must put the most skilled to work in specialized forges to bolster our weapon-making."
 BRC_the_road_north:0 "The Road North"
 BRC_the_road_north_desc:0 "With our expansion comes the need to send our supply further away from our main settlements of Rockard and Stonard. The journey is especially difficult through the swamps. As such, the Warchief has ordered the construction of a road that will facilitate the supplying of our troop up north."
 BRC_identity_crisis:0 "Identity Crisis"
 BRC_identity_crisis_desc:0 "Orgrim Doomhammer has discovered a plot by Gul'dan to usurp Blackhand as Warchief of the Horde and believes we must act quickly in order to stop him. He has rallied the Frostwolf, Bleeding Hollow, Dragonmaw and Black Tooth Grin clans to our side. In order to save the Horde Gul'dan must be stopped at all costs."
 BRC_the_pink_skins:0 "The Pink Skins"
 BRC_the_pink_skins_desc:0 "Our scouts have reported discovering a race of small, weak bodied humanoids with bountiful wealth. These “pink skins” must be further investigated so they can be subjugated with the rest of the races of this planet."
 BRC_send_scouts_north:0 "Send Scouts North"
 BRC_send_scouts_north_desc:0 "With our preparations complete, it is time to begin scouting the lands to our North, to find new land for our people and new weaklings to conquer."
 BRC_raid_border_settlements:0 "Raid Border Settlements"
 BRC_raid_border_settlements_desc:0 "The “humans”, as the pink skins call themselves, are paltry and weak, unable to resist the might of the Horde. We will strike into their land and claim their outermost settlements for ourselves."
 BRC_dawn_of_the_first_war:0 "Dawn of the First War"
 BRC_dawn_of_the_first_war_desc:0 "We have spent enough time preparing for the wars to come, and have decided on the first to die - the pink skins of Stormwind will fall and be crushed beneath the boots of the Horde, and their bounty will be forfeit."
 BRC_pillage_redridge:0 "Pillage Redridge"
 BRC_pillage_redridge_desc:0 "We have finished our conquest of the first region of Stormwind, what is known to the humans as Redridge. To show our might, we must pillage this land, and send an example to the rest of humanity of what awaits them at our hands."
 BRC_lakeshire_great_hall:0 "Construct a Great Hall in Lakeshire"
 BRC_lakeshire_great_hall_desc:0 "Our main base has become too far from the front lines to effectively supply our forces. We will build a new Great Hall here in Lakeshire, closer to the front, to provide easier access of supplies as we continue the warpath."
 BRC_stonewatch_barracks:0 "Construct a Barracks at Stonewatch"
 BRC_stonewatch_barracks_desc:0 "As our troops move ever forward, they complain of the lodgings they are given. Are tents and cots not enough for these orcs? So be it, a barracks will be constructed to house our troops, so they may be prepared for the battles to come."
 BRC_pillage_elwynn:0 "Pillage Elwynn"
 BRC_pillage_elwynn_desc:0 "As we march ever closer to the stronghold of the humans, we pass more and more villages and manors erected by those who felt safe under the watch of their kingdom. Let us show them that there is no place safe from the might of the Horde."
 BRC_push_into_the_city:0 "Push into the City"
 BRC_push_into_the_city_desc:0 "Our forces are ready. With their lands pillaged and their soldiers routed, the humans have retreated into the city of Stormwind. The siege begins now, and the end of humanity is near. With one great battle, we will wipe this kingdom away and raise our banners from the walls! Lok’tar, Ogar!"
 BRC_study_human_tactics:0 "Study Human tactics"
 BRC_study_human_tactics_desc:0 "While traditional orc warfare revolves around brutal charges and overwhelming force, the frail humans use more cowardly tactics to survive. By studying their methods, we will adapt and subjugate all who stand before us."
 BRC_human_drills:0 "Human Drills"
 BRC_human_drills_desc:0 "The humans use a system of standardized exercises and drills to prepare their troops for war. Orcs traditionally learn through single combat and war games, but perhaps these methods may prove useful to instill discipline in our own forces."
 BRC_reinforced_armor:0 "Reinforced Armor"
 BRC_reinforced_armor_desc:0 "Though our skin is much thicker than the humans, they hide themselves behind thick metal and leather armor to protect their weak bodies. We shall do the same, and our orcs shall be invincible to any puny human strike!"
 BRC_blackrock_assassins:0 "Blackrock Assassins"
 BRC_blackrock_assassins_desc:0 "To supplement our main force, we will train orcs to move unseen to their foes, striking from the shadow and removing commanders and captains from the frey. In doing so, we will disorganize our enemy and give our armies one more edge over the humans."
 BRC_blackrock_spearman:0 "Blackrock Spearman"
 BRC_blackrock_spearman_desc:0 "Where the foot soldiers of Stormwind fall easily before us, their mounted soldiers provide a much sturdier foe. By equipping our soldiers with long spears, they can strike these “knights” down off their mounts and easily dispatch them on the ground."
 BRC_blackrock_lancers:0 "Blackrock Lancers"
 BRC_blackrock_lancers_desc:0 "By combining the long spears of our spearman with the speed and ferocity of our wolf riders, we have created a new force to be reckoned with. These new lancers can crush both foot soldiers and knights with ease, and will prove instrumental in the conquest of Azeroth."

 BRC_blackhands_horde:0 "Blackhand's Horde"
 BRC_blackhands_horde_desc:0 "Blackhand has killed Gul’dan and the traitors willing to side with him. With the Frostwolf Clan loyal to the Horde and Doomhammer commanding our armies. It is time to see the Horde become this planets dominant power."
 BRC_embrace_the_fel:0 "Embrace the Fel"
 BRC_embrace_the_fel_desc:0 "We once thought the Fel was a curse, a corruption of our people. But now we see it as a gift, a power that we can harness to become stronger. We shall now embrace it fully and become more powerful than ever before. Our enemies shall tremble before us and none shall stand in our way to claim our rightful place in this world."
 BRC_improve_the_war_machine:0 "Improve the War Machine"
 BRC_improve_the_war_machine_desc:0 "The Warchief has ordered us to increase the production of war equipment. Our factories and forges must work tirelessly to meet the demands of the war effort and to ensure that our troops are equipped with the latest weaponry in order to crush our enemies."
 BRC_incorporate_the_blacktooth_grin_clan:0 "Incorporate the Blacktooth Grin Clan"
 BRC_incorporate_the_blacktooth_grin_clan_desc:0 "The Black Tooth Grin clan, initially formed by Warchief Blackhand to be the scouting branch of the Blackrock Clan, now falls under the rule of his sons, Rend and Maim Blackhand. With the expansion of the Blackrock clan, Warchief Blackhand now wants to bring the Black Tooth Grin clan back into the fold."
 BRC_renew_forced_aging:0 "Renew Forced Aging"
 BRC_renew_forced_aging_desc:0 "Amidst the growing threat of our enemies, we have decided to renew the use of Fel Magic to age young orcs. With this magic, we can accelerate their growth and train them to become formidable warriors in a shorter time. The Blackrock Clan will not be caught off guard again."
 BRC_our_burning_blood:0 "Our Burning Blood"
 BRC_our_burning_blood_desc:0 ""
 BRC_directed_bloodlust:0 "Directed Bloodlust"
 BRC_directed_bloodlust_desc:0 ""
 BRC_assimilate_the_shadow_council:0 "Assimilate the Shadow Council"
 BRC_assimilate_the_shadow_council_desc:0 "The Shadow Council is nothing but a shadow of its former self. As such, we should integrate them into our own ranks. These warlocks, though small in number, possess great knowledge and power that the Blackrock Clan can utilize to great advantage."
 BRC_the_journey_north:0 "The Journey North"
 BRC_the_journey_north_desc:0 "With the conquest of Stormwind complete, our attention now turns to the north and the Dark Iron dwarves inhabiting what is known by the humans as the Burning Steppes. Despites the area being a wasteland covered in volcanic ash, it is full of precious resources that can only prove useful to our war machine. We shall march forth into the steppes to crush these stubborn foes and claim their lands for our own."
 BRC_strike_the_steppes:0 "Strike the Steppes"
 BRC_strike_the_steppes_desc:0 "With our sights set on the Burning Steppes, we will unleash lightning-fast tactics to keep our foes on the defensive, constantly pushing deeper into enemy lines and taking advantage of their disarray."
 BRC_a_home_in_the_spire:0 "A Home in the Spire"
 BRC_a_home_in_the_spire_desc:0 "With the discovery of the Blackrock Mountains, we have found a perfect location to establish our fortress. The dark, rocky volcano reminds us of our ancestral home on Draenor, and we believe that this place will provide us with a natural defense against our enemies. It is the ideal place to build our new stronghold to project our power from."
 BRC_settle_the_steppes:0 "Settle the Steppes"
 BRC_settle_the_steppes_desc:0 "With Blackrock Mountain secured as our stronghold, we now turn our attention to the Burning Steppes. This desolate region is home to many hostile creatures, but we are undeterred. The orcs of the Blackrock Clan are skilled hunters and fighters, and we will make the Burning Steppes our own. Our scouts have already reported rich mineral deposits, and we will make use of them to further our goals."
 BRC_the_shrine_of_storms:0 "Construct A Shrine of Storms"
 BRC_the_shrine_of_storms_desc:0 "Warchief Blackhand orders the construction of an Altar of Storms on the flanks of Blackrock Mountain, a place where dark energies can be channeled to bolster the might of the Horde. "
 BRC_fire_up_the_cauldron:0 "Fire up the Cauldron"
 BRC_fire_up_the_cauldron_desc:0 "To the north of Blackrock Mountain lies an incredible dark iron dwarven facility: the Cauldron. Time has come for us to utilize its vast resources. We will rekindle the dormant forges and set them ablaze, producing weapons and armor to fuel our war machine. The Horde's enemies will tremble as we unleash the full might of our war-machine upon them."

 BRC_under_a_single_banner:0 "One Horde Under One Banner"
 BRC_under_a_single_banner_desc:0 "Under the strong hand of Warchief Blackhand, we shall unite under a single banner! All clans shall serve directly under the Warchief, and any who resist shall be crushed. Our victories over the humans of Stormwind and the Dark Iron dwarves have proven our strength, and now is the time for the Horde to stand as one. Blackhand will lead us to glory, and any who stand in our way shall feel the wrath of the Horde!"
 BRC_under_a_single_banner_tt:0 "§HThe Warchief will unite all the Horde under one banner, peacefully or by force...§!\n\n"

 BRC_the_thorium_brotherhood:0 "The Thorium Brotherhood"
 BRC_the_thorium_brotherhood_desc:0 "The Thorium Brotherhood, a small guild of Dark Iron dwarves, resides in the Searing Gorge. Though not an immediate threat, their mastery of craftsmanship poses a potential danger in the long run. We should eliminate them now before they cause unrest in the region."

 BRC_blackrock_leadership:0 "Blackrock Leadership"
 BRC_blackrock_leadership_desc:0 "Our clan is currently led by Warchief Blackhand, a powerful and cunning orc whose military prowess is renowned across the Horde. Serving as his second-in-command is Orgrim Doomhammer, a fierce warrior with a sharp mind that many also consider to be a worthy leader. With such strong leaders at the helm, we are destined to dominate our enemies and expand our influence throughout these new lands."
 BRC_doomhammers_horde:0 "Doomhammer's Horde"
 BRC_doomhammers_horde_desc:0 "Now the new Warchief of the Horde, Orgrim Doohammer seeks to lead his people to glory by rejecting the dark forces they once wielded. He plans to unify the orcs under a new vision, one that will bring back honor and respect to the Horde."
 BRC_deal_with_rend:0 "Deal with Rend"
 BRC_deal_with_rend_desc:0 "With the Black Tooth Grin Clan under the leadership of Blackhand's sons, Rend and Maim, the Warchief of the Horde, Orgrim Doomhammer, is unsure of their loyalty. To confirm their allegiance, he plans to speak with them directly and ensure that the clan remains a loyal part of the Horde's forces."
 BRC_deal_with_rend_tt:0 "§HThe warchief will be presented with different options to gain the §!§g[BTG.GetName]§!§H's loyalty.§!\n\n"
 BRC_blacktooth_scouts:0 "Blacktooth Grin Scouts"
 BRC_blacktooth_scouts_desc:0 "The Black Tooth Grin Clan was formed by Blackhand to serve as a scouting force for the Blackrock clan. Comprised of fierce warriors, they are known for their cunning tactics and strategic intelligence gathering. With their knowledge of the land and enemy movements, they are an invaluable asset to the Horde's war efforts."
 BRC_ban_fel_magic:0 "Ban Fel Magic"
 BRC_ban_fel_magic_desc:0 "The new Warchief strongly opposes the use of fel magic and sees it as a dangerous and corrupting force. He believes that the use of such magic goes against the principles of honor and strength that the Horde values. In his eyes, fel magic is an abomination that should be banned and eradicated from the lands that the Horde controls."
 BRC_hunt_the_shadow_council:0 "Hunt the Shadow Council"
 BRC_hunt_the_shadow_council_desc:0 "The Warchief has made it a priority to uncover the location of the Shadow Council. To achieve this, he intends to interrogate Garona Halforcen, who was captured while attempting to flee Stormwind. The Warchief is determined to extract information from Gul'dan's puppet and discover the whereabouts of the dangerous organization."
 BRC_hunt_the_shadow_council_tt:0 "§HWe will try to discover where the §!§1Shadow Council§!§H is hiding and find a way to §!§Rneutralize§!§H them...§!"
 BRC_securing_our_place_on_azeroth:0 "Securing Our Place"
 BRC_securing_our_place_on_azeroth_desc:0 "As we settle on this new world, we must ensure that the Horde's place is secure. Warchief Doomhammer has spoken of the need to establish a lasting presence here, and we must heed his words. Azeroth is our new home, and we will do everything in our power to protect ourselves from those that would want us to go back to the Dark Beyond."
 BRC_old_traditions:0 "Old Traditions"
 BRC_old_traditions_desc:0 "Doomhammer seeks to revive old orcish traditions within the Horde, but the influence of fel magic remains too strong to do so at the moment. Though the bloodlust induced by fel magic is necessary to fight against the humans, the Warchief hopes to find a way to diminish its hold over the Horde."
 BRC_blackrock_discipline:0 "Disciplined Blades"
 BRC_blackrock_discipline_desc:0 ""
 BRC_dark_iron_warlords:0 "Dark Iron Warlords"
 BRC_dark_iron_warlords_desc:0 ""
 BRC_the_fate_of_guldan:0 "The Fate of Gul'dan"
 BRC_the_fate_of_guldan_desc:0 "With Gul'dan finally captured, the Warchief has demanded that we bring the warlock before him so he can decide of his fate. There have been many rumors about what he plans to do with the old orc, some even say he will kill him for all the damage he has done to the Horde."
 BRC_take_over_the_spire:0 "Take Over the Spire"
 BRC_take_over_the_spire_desc:0 "When we raided the Shadow Council, we marched towards Blackrock Mountain, where the council was hiding. Upon arriving, we couldn't help but notice the place's striking resemblance to the Blackrock Clan's home on Draenor, as well as its name echoing our own clan's name. The Warchief now sees this as a good omen and wishes to settle here."
 BRC_alliance_with_the_dark_iron:0 "Alliance with the Dark Iron dwarves"
 BRC_alliance_with_the_dark_iron_desc:0 "Cho'gall of the Twilight's Hammer Clan has met with the Warchief today, he informed him of his recent communication with the Dark Iron dwarves, who once built and dwelt in the Blackrock Spire that we now inhabit today. He wishes to introduce him to the dwarves, stating that we could strike a deal with them to peacefully share the mountain."
 BRC_the_fall_of_stormwind:0 "The Fall of Stormwind"
 BRC_the_fall_of_stormwind_desc:0 "The victory over Stormwind is ours. Our enemies have fallen and their land is under our control. But this is not the end of our conquest. It is time to expand our power and bring the rest of this world under our rule."
 BRC_pillage_the_city:0 "Pillage the City"
 BRC_pillage_the_city_desc:0 "With Stormwind now in our hands, all its riches are now only ours to take. With our troops looting every corner of the city, we will gain the materials necessary to fuel our war machine and further our conquests."
 BRC_human_maps:0 "Human Maps"
 BRC_human_maps_desc:0 "As we were scouring through recently conquered human lands, we stumbled upon some valuable maps that we believe could lead us to even more riches and conquests."
 BRC_the_gnolls:0 "Pests of Elwynn"
 BRC_the_gnolls_desc:0 "We must address the problem of the minor races who inhabit the lands of Stormwind. What we know now as gnolls roam the forests and the kobolds hold the caves and mines for themselves. These creatures have become a nuisance, causing trouble for our troops and disrupting our operations. If left unchecked, they could become a real threat."
 BRC_human_tools:0 "Human Tools"
 BRC_human_tools_desc:0 "Human tools have piqued our interest. We have decided to study them to learn more about human technology and see if we could improve our own weapons and equipment. With our newfound knowledge, we could potentially gain an edge in battle against our enemies."
 BRC_human_masonry:0 "Human Masonry"
 BRC_human_masonry_desc:0 "After conquering Stormwind, we have discovered the guild hall of the Stonemasons. We were intrigued by the plans and masonry techniques we found inside. We have decided to study them and use the knowledge to improve our own building skills. This will undoubtedly prove useful."
 BRC_deal_with_the_trade_prince:0 "Deal with the Trade Prince"
 BRC_deal_with_the_trade_prince_desc:0 "For some time now we have been in contact with the goblins, a race of small humanoids known for shrewdness, relatively clever nature and especially their impressive mechanical contraptions. Our Warchief sees them as potential allies, and knowing their love for wealth, has decided to offer them parts of Stormwind's coffers in exchange for their allegiance to the Horde."
 BRC_deal_with_the_trade_prince_tt:0 "§HThe goblins of §!§L[STC.GetName]§!§H will be offered to join §!§Rthe Horde§!§H in exchange for some of §!§2Stormwind's treasury.§!§!§!\n\n"
 BRC_the_battle_for_khaz_modan:0 "The Battle for Khaz Modan"
 BRC_the_battle_for_khaz_modan_desc:0 "We have been informed that Stormwind's refugees have fled north to seek refuge among the other humans kingdoms. We cannot afford to let them regroup and rebuild their strength. Our armies must march forth and bring the fight to their doorstep. For that, we must first set our sights on the dwarven lands of Khaz Modan if we hope to reach the human kingdoms to the north."

 BRC_steamwheedle_airships:0 "Steamwheedle Airships"
 BRC_steamwheedle_airships_desc:0 "In our quest for aerial dominance, we have established a promising partnership with the esteemed Steamwheedle Cartel. Through diplomatic negotiations and lucrative deals, we aim to secure their renowned airships for our own use. These impressive vessels will grant us unparalleled mobility and firepower, shifting the balance of power in our favor."

 BRC_sack_thelsamar:0 "Sack Thelsamar"
 BRC_sack_thelsamar_desc:0 "Thelsamar is one of the first dwarven town we encountered in our conquest of Khaz Modan and holds a trove of resources that would be better off in our own coffers."
 BRC_study_farstrider_weaponry:0 "Study Farstrider Weaponry"
 BRC_study_farstrider_weaponry_desc:0 "We have seized an impressive number of high elven weapons from Farstrider Lodge in eastern Loch Modan. While we have already encountered elven weaponry during our war with Stormwind, never have we managed to get hold on this much. We should study these finely crafted weapons to make our owns even more efficient."
 BRC_expand_the_spire:0 "Expand the Spire"
 BRC_expand_the_spire_desc:0 "As we consolidate our hold on Blackrock Mountain, it has become clear that the underground halls have potential beyond their current use as a fortress. We have decided to invest in expanding Blackrock Spire and transforming it into a proper orcish settlement, worthy of being our base of operations. By utilizing the vast resources of the mountain, we will be able to create a formidable stronghold."
 BRC_develop_the_burning_steppes:0 "Develop the Burning Steppes"
 BRC_develop_the_burning_steppes_desc:0 "We have been investing the Burning Steppes for a while now. The clan has been working hard to build their homes, but travel between them is still difficult. It is time we build roads and bridges to make transportation easier, and create a proper network of communication between the settlements."
 BRC_expand_blackrock_stronghold:0 "Found Blackrock Stronghold"
 BRC_expand_blackrock_stronghold_desc:0 "As we survey the land at the around Blackrock Mountain, we cannot help but notice a perfect spot to erect a fortress just to is south-east. The location provide strategic advantages and a strong defense position that we can fortify and expand as needed as well as serve as our first line of defense against any enemy attempting to siege the moutain from the south."
 BRC_found_black_tooth_hovel:0 "Found Black Tooth Hovel"
 BRC_found_black_tooth_hovel_desc:0 "Our scouts of the Black Tooth Grin clan need a proper base of operations to recruit and prepare themselves from. We have found a large flat area south of the mountain that looks to be the perfect place."
 BRC_dreadmaul_rock:0 "Dreadmaul Rock"
 BRC_dreadmaul_rock_desc:0 "When we conquered the Burning Steppes, the Firgut and Dreadmaul orcs among our clan have settled around a rocky peak to the east. Since then they have been investing the area, and the location appears to be ideal as a forward base for our operations. We should consider formalizing their presence there and build a proper camp to reinforce our position in the region."
 BRC_grant_the_ogres_autonomy:0 "Grant Ogres Autonomy"
 BRC_grant_the_ogres_autonomy_desc:0 "As we've fought alongside the Dreadmaul and Firegut ogres, we've come to appreciate their strength and loyalty. The Warchief has been considering granting them more autonomy in their operations, so they can better contribute to the Horde's cause. After all, the ogres have proved themselves time and again as worthy members of our clan and the Horde."
 BRC_grant_the_ogres_autonomy_tt:0 "We will allow the §HDreadmaul Ogres§! to settle in the eastern part of the §HBurning Steppes§! in the states of §H[543.GetName]§! and §H[567.GetName]§!.\n\n"
 BRC_strenghthen_ties:0 "Strengthen Ties"
 BRC_strenghthen_ties_desc:0 "As we have witnessed, the ogres have been formidable allies, proving their worth on the battlefield time and time again, as such we should focus on strengthening our relations with them."
 BRC_roosts_in_blackwing_decent:0 "Roosts in Blackwing Decent"
 BRC_roosts_in_blackwing_decent_desc:0 "As we delve deeper into Blackrock Spire, we've discovered a perfect location for our aerial army to thrive: the Blackwing Descent. With its spacious chambers and high ceilings, we can build roosts and aviaries to breed and train our winged beasts to aid us in battle. This will give us a significant advantage over our enemies and allow us to dominate the skies."

 BRC_outpost_in_the_gorge:0 "Outpost in the Gorge"
 BRC_outpost_in_the_gorge_desc:0 "With the Searing Gorge under our control, we have a unique opportunity to harness its untapped potential. By investing in the development of this volatile region, we can exploit its rich mineral deposits, establish strategic infrastructure, and fortify our presence."

 BRC_expand_the_cauldron:0 "Expand the Cauldron"
 BRC_expand_the_cauldron_desc:0 "Within the heart of the Searing Gorge, the Cauldron stands as a testament to the Dark Iron dwarves' ingenuity. We shall harness its power and expand our operations, delving deeper into its depths to unearth ancient relics, rare resources, and forge new weapons of war. The Cauldron will become a stronghold of our dominion."

 BRC_dark_iron_tools:0 "Darkiron Tools"
 BRC_dark_iron_tools_desc:0 "By embracing the knowledge and craftsmanship of the Dark Iron dwarves, we will unlock the secrets of their masterful tools. Through careful study and adaptation, we shall integrate their advanced technology into our arsenal, empowering our troops and enhancing our war efforts. "

 BRC_dark_iron_ore:0 "Darkiron Ore"
 BRC_dark_iron_ore_desc:0 "we need to establish new mining operations to extract the coveted Dark Iron ore. This valuable resource, exclusive to the Blackrock Mountain, will fuel our industry and armaments, providing us with a strategic advantage and unlocking new possibilities for our war machine."

 BRC_expand_supply_network:0 "Searing Gorge Supply Network"
 BRC_expand_supply_network_desc:0 "In the unforgiving landscape of the Searing Gorge, we must forge a robust supply and infrastructure network to support our operations. By constructing roads, bridges, and logistical hubs, we will overcome the challenges of this rugged terrain, ensuring efficient transportation of troops, resources, and equipment within the area."

 BRC_construct_watch_towers:0 "Construct Watch Towers"
 BRC_construct_watch_towers_desc:0 "Amidst the fiery expanse of the Searing Gorge, we recognize the need for heightened vigilance and fortified defenses. By constructing watchtowers strategically throughout the region, our forces will gain superior visibility and early warning capabilities, ensuring the security of our holdings and allowing us to repel any threats that dare to approach."

 BRC_prepare_the_fleet:0 "Prepare the Fleet"
 BRC_prepare_the_fleet_desc:0 "With the Thandol Span being the only way to reach the human kingdoms from Khaz Modan, our armies are limited in their options. The narrow crossing is easily fortified by the humans, making it difficult to attack them head-on. That's why the Warchief has ordered the construction of a fleet to attack the humans from their shores."
 BRC_blackrock_shipwright:0 "Blackrock Shipwrights"
 BRC_blackrock_shipwright_desc:0 "Blackrock Shipwrights"
 BRC_transport_ships:0 "Transport Ships"
 BRC_blackrock_sailors:0 "Blackrock Sailors"
 BRC_dreadmaul_battleships:0 "Dreadmaul Battleships"

 BRC_steamwheedle_battleships:0 "Steamwheedle Battleships"
 BRC_steamwheedle_battleships_desc:0 "Realizing the strategic importance of naval supremacy, we turn once again to the renowned Steamwheedle Cartel for assistance in bolstering our maritime forces. This time we aim to secure powerful battleships from their vast arsenal, ensuring our dominance on the seas and expanding our capabilities for our future offensive against the humans."

 BRC_alliance_with_the_frostmane:0 "Alliance with the Frostmane Trolls"
 BRC_alliance_with_the_frostmane_desc:0 "Seeking to expand our alliances and bolster our forces, we turn our attention to the Frostmane Tribe, a tribe of frost trolls residing in Dun Morough. Claiming the entirety of the snowy mountains as rightfully theirs, they will not decline an occasion to wage war against the dwarves."
 BRC_alliance_with_the_frostmane_tt:0 "§HWe will send an offer to the §!§C[FRT.GetNameWithFlag]§!§H to join §!§RThe Horde§!§H.§!\n\n"

 BRC_frostmane_destroyers:0 "Frostmane Destroyers"
 BRC_tame_giant_turtles:0 "Tame Giant Turtles"
 BRC_lessons_of_the_first_war:0 "Lessons from the First War"
 BRC_elite_forces:0 "Elite Forces"
 BRC_blackrock_sergeants:0 "Blackrock Sergeants"
 BRC_blackrock_occupation_forces:0 "Blackrock Occupation Forces"
 BRC_study_human_tomes:0 "Study Human Tomes"
 BRC_human_formations:0 "Copy Human Formations"
 BRC_night_assaults:0 "Night Assaults"
 BRC_infantry_weapons:0 "Improved Weapons"
 BRC_study_supply_lines:0 "Study their Supply Lines"
 BRC_study_supply_lines_desc:0 "The Stormwind way of supplying their forces is worth studying. Their organized and efficient supply chains were a key factor in their relative efficiency. We can learn from their logistics management to improve our own army and ensure that our troops are well-equipped and well-fed on the frontlines."
 BRC_improved_armor:0 "Improved Armor"
 BRC_improved_raider_equipment:0 "Improved Raider Equipment"

 BRC_keep_them_in_check:0 "Keep the Clans in Check"
 BRC_keep_them_in_check_desc:0 "As leading clan of the Horde, we shoulder the responsibility of upholding the Horde's unity by keeping our orcish brethren in check. Vigilance is paramount to thwart the ambitions of any wayward leader and preserve the cohesive strength of our forces."

 BRC_oversee_dragonmaw_breeding:0 "Oversee Dragonmaw Breeding"
 BRC_oversee_dragonmaw_breeding_desc:0 "The Dragonmaw orcs have always been astute trainers and riders of flying creatures. Since our arrival on Azeroth, they have been working tirelessly to breed the local fauna in order to provide the Horde with strong and powerful mounts to harass our enemies from the skies."
 BRC_oversee_dragonmaw_breeding_tt:0 "\n§H[DMC.GetNameWithFlag]§! will gain:"

 BRC_keep_an_eye_on_guldan:0 "Keep an Eye on Guldan"
 BRC_keep_an_eye_on_guldan_desc:0 "While Gul'dan pledges loyalty to the Horde, his treacherous nature demands our vigilance. We must keep a close watch on his actions, for his ambitions may have the potential to disrupt our unity. By carefully monitoring his every move and anticipating his next steps, we can ensure that Gul'dan's schemes remain aligned with the greater goals of the Horde."
 BRC_keep_an_eye_on_guldan_tt:0 "\n§H[SRC.GetNameWithFlag]§! will gain:"

 BRC_keep_chogall_busy:0 "Keep Cho'gall Busy"
 BRC_keep_chogall_busy_desc:0 "Though Cho'gall may lack Gul'dan's erratic nature, he and the Twilight's Hammer Clan demands our attention. By closely monitoring Cho'gall's activities and diverting his attention to strategic endeavors, we can keep the Twilight's Hammer Clan occupied and prevent their subversive agendas from destabilizing the Horde."
 BRC_keep_chogall_busy_tt:0 "\n§H[THC.GetNameWithFlag]§! will gain:"

 BRC_discipline_the_burning_blade:0 "Discipline the Burning Blade"
 BRC_discipline_the_burning_blade_desc:0 "The Burning Blade Clan's prowess with fel-infused combat techniques is undeniable, yet their unyielding reliance on such power threatens our stability. We must enforce strict discipline upon these formidable blademasters, tempering their bloodlust and channeling their skills towards our collective cause."
 BRC_discipline_the_burning_blade_tt:0 "\n§H[BBC.GetNameWithFlag]§! will gain:"

 BRC_fall_of_humanity:0 "Fall of Humanity"
 BRC_fall_of_humanity_desc:0 ""
 BRC_deal_with_alterac:0 "Deal with Alterac"
 BRC_deal_with_alterac_desc:0 ""
 BRC_alliance_intel:0 "Alliance Intel"
 BRC_alliance_intel_desc:0 ""
 BRC_tyrs_hand_revolt:0 "Tyr's Hand Revolt"
 BRC_tyrs_hand_revolt_desc:0 ""

 BRC_following_orders:0 "Orders Followed"
 BRC_following_orders_desc:0 "The Warchief Ordered the Dragonmaw clan to keep Gul'dan and his warlocks in line, it would seem they have fled the Elven Lands in fulfil their own desires, Zuluhed on the other hand still holds true to his oath to the Horde, and has Fed Gul'dan to his Pet dragons."

 BRC_guldans_creations:0 "Gul'dans Creations"
 BRC_guldans_creations_desc:0 "Gul'dan promise seems to have come to pass, he has given us abominations of Foul Magics, forged from the bodies of human knights, their destruction on the battlefield have yet to be matched, but are these warriors worthy of the horde?"

 BRC_the_time_has_come:0 "The Time has Come"
 BRC_the_time_has_come_desc:0 "It is now time for the Kingdom of Alterac to cast off the shackles of the Alliance and embrace its new allegiance..."
 BRC_the_time_has_come_tt:0 "§H[ALT.GetNameWithFlag]§! §Gwill finally join our side in the war!§!"

 BRC_cut_off_stromgarde:0 "Cut off Stromgarde"
 BRC_tol_barad_invasion_force:0 "Tol'Barad Invasion Force"
 BRC_tol_barad_oil_refineries:0 "Tol'Barad Oil Refineries"
 BRC_ransack_hillsbrad:0 "Ransack Hillsbrad"
 BRC_ransack_hillsbrad_desc:0 "Hillsbrad is known for its fertile lands, making it a prime target for pillaging. Sometimes dubbed as the breadbasket of Lordaeron, its farms and fields are full of food ripe for the taking."
 BRC_invasion_of_hillsbrad:0 "Invasion of Hillsbrad"
 BRC_the_fall_of_stromgarde:0 "The fall of Stromgarde"
 BRC_a_deal_with_the_amani:0 "A Deal with the Amani"
 BRC_amani_frigates:0 "Amani Frigates"
 BRC_vilebranch_axe_throwers:0 "Vilebranch Axe Throwers"
 BRC_witherbark_witch_doctors:0 "Witherbark Witch Doctors"
 BRC_push_into_the_hinterlands:0 "Push into the Hinterlands"
 BRC_the_invasion_of_quelthalas:0 "The invasion of Quel'Thalas"

 BRC_push_for_capital_city:0 "Push for Capital City"
 BRC_push_for_capital_city_desc:0 " Our forces rally and bolster their ranks, preparing for the ultimate assault on Lordaeron, the heart of our enemies. We muster our strength, strategize our every move, and unleash the full might of the Horde in a bid for total victory. Lok'tar ogar!"

 BRC_distribute_lands:0 "Distribute Lands"
 BRC_distribute_lands_desc:0 "As we expand our territories, it is only fair that our clans receive their due share. Each clan has proven its worth and deserves to be rewarded accordingly. Therefore, the Warchief has decided to divide the land among them."
 BRC_distribute_lands_tt:0 "§HThe Warchief will distribute lands between the Horde members.§!\n\n"

 BRC_draenor_shamans:0 "Bring Shamans from Draenor"
 BRC_draenor_shamans_desc:0 "Despites the use of dark magic still remaining prevalent within the Horde, Warchief Doomhammer has decided to call upon the last remaining shamans from Draenor to help us regain our connection to the elements and slowly bring back the old orcish traditions."
 BRC_circles_of_binding:0 "Circles of Binding"
 BRC_circles_of_binding_desc:0 "As we traversed the Arathi Highlands, we came across the mysterious Circles of Binding, surrounded by elementals. The runed stones rings are intriguing and we are still wondering about their origins and purpose but they are source of powerful elemental magic that could prove to be useful..."

 BRC_alteraci_agents:0 "Alteraci Agents"
 BRC_alteraci_agents_desc:0 ""

 BRC_tyrs_hand_mining_operation:0 "Tyr's Hand Mining Operations"
 BRC_tyrs_hand_mining_operation_desc:0 ""

 BRC_fate_of_lordaeron:0 "The Fate of Lordaeron"
 BRC_fate_of_lordaeron_desc:0 "In the wake of our triumphant conquest, we stand at a crossroads for the fate of Lordaeron. The time has come to make a critical decision. Will we rebuild the kingdom under Horde rule, integrating its resources and people, or will we exploit its remnants to further our own ambitions?"

 BRC_victory_over_humanity:0 "Victory Over Humanity"
 BRC_victory_over_humanity_desc:0 "Having emerged victorious over the forces of humanity, we now stand as the dominant power in these lands. Yet, the task of governing such a vast territory is no small feat. We must tread carefully, for managing this grand dominion poses challenges that demand our unwavering resolve. Lok'tar Ogar!"

 BRC_consolidate_our_new_lands:0 "Consolidate our New Lands"
 BRC_consolidate_our_new_lands_desc:0 "Our empire stretches far and wide, but its vastness brings challenges. The Horde's dominion is formidable, yet we must ensure stability."
 BRC_consolidate_our_new_lands_tt:0 "§HUnlock decisions to deal with our §!§toverstretched empire§!§H.§!§!"

 BRC_deal_with_human_resistance:0 "Deal with Human Resistance"
 BRC_deal_with_human_resistance_desc:0 "The conquest of the human kingdoms brought forth the spark of resistance. These feeble humans dare to challenge our dominion. We shall crush their futile resistance with unwavering force. Through internment camps or bolstered garrisons, we shall ensure their compliance. The Horde's might shall prevail over their pityful attempts at defiance."
 BRC_deal_with_human_resistance_tt:0 "§HUnlock decisions to deal with the rampant §!§Rhuman resistance§!§H within our territory.§!§!"

 BRC_masters_of_the_continent:0 "§HMasters of the Continent§!"
 BRC_masters_of_the_continent_desc:0 "Having conquered the vast swaths of the Eastern Kingdoms, our Horde now stands triumphant. Our dominion stretches far and wide and we stand at the pinnacle of our power. The future beckons with endless possibilities, and we shall forge our legacy across Azeroth. Victory is ours!"

BRC_rends_leadership:0 "Rend's Leadership"
BRC_rends_leadership_desc:0 "Dal'Rend Blackhand, son of Blackhand the Destroyer, took control of the Blackrock Clan in the aftermath of his fathers death. Now he must take up the mantle and lead them to victory"

BRC_loss_of_maim:0 "Loss of Maim"
BRC_loss_of_maim_desc:0 "Dal'Rends brother, Maim Blackhand, faced a sudden death at the hands of the Dark Iron Dwarves when under siege within Blackrock Mountain. His death left Rend in despair, however he knew he had to carry on his legacy."

BRC_the_dark_horde:0 "The Dark Horde"
BRC_the_dark_horde_desc:0 "The Dark Horde was Dal'Rends solution to Thralls fleeing of the Eastern Kingdoms. Under influence from an unknown visitor only known as Victor Nefarius, Dal'Rend leads the Dark Horde with vigor and wrath."

BRC_preparation_for_war:0 "Preparations for War"
BRC_preparation_for_war_desc:0 "The Dark Horde rallies its armies in the Burning Steppes to invade the Dark Iron Clan"

BRC_pushing_into_the_badlands:0 "Pushing into the Badlands"
BRC_pushing_into_the_badlands_desc:0 "The Troggs block our path to reconnect with our Ogre brethren, slaughter them all!"

BRC_aid_for_thogrun:0 "Aid for Tho'Grun"
BRC_aid_for_thogrun_desc:0 "Now that the path has been cleared, we will send aid to our Ogre brethren and invite them into the Dark Horde."

BRC_securing_our_flank:0 "Securing our Flank"
BRC_securing_our_flank_desc:0 "The Human Expedition into the Burning Steppes threatens our defenses, we will send a scouting force to see what we are up against."

BRC_ending_morgans_dream:0 "Ending Morgan's Dream"
BRC_ending_morgans_dream_desc:0 "Our scouting party has provided useful information, we shall conduct a raid to destroy the outpost and seize Morgan's territories."

BRC_unleash_the_horde:0 "Unleash the Horde"
BRC_unleash_the_horde_desc:0 "Now that our fronts have been secured we will unleash the might of the Dark Horde upon the Dark Iron Clan!"

BRC_pillage_searing_gorge:0 "Pillage Searing Gorge"
BRC_pillage_searing_gorge_desc:0 "As we begin to occupy the Searing Gorge, we will raid and loot the various settlements in the Gorge."

BRC_pillage_badlands:0 "Pillage Badlands"
BRC_pillage_searing_gorge_desc:0 "As we begin to occupy the Badlands, we will raid and loot the various settlements in the northern Badlands."

BRC_workshops_in_slag_pit:0 "Workshops in the Slag Pit"
BRC_workshops_in_slag_pit_desc:0 "We will utilize the Slag Pits industry for our own, we will build new Workshops after its capture."

BRC_towers_on_iron_summit:0 "Towers on Iron Summit"
BRC_towers_on_iron_summit_desc:0 "The Iron Summit will provide an excellent vantage point for our campaign in the Searing Gorge."

BRC_capture_angor_fortress:0 "Occupying Angor Fortress"
BRC_capture_angor_fortress_desc:0 "With the Capture of Angor Fortress, it shall be repurposed for our efforts and named 'Maim Fortress' in honor of Dal'Rends brother."

BRC_breaking_the_iron_wall:0 "Break down the Gates"
BRC_breaking_the_iron_wall_desc:0 "We must break down the gates to Shadowforge, push into the mountain to gain the riches that lay within."

BRC_might_of_the_dark_horde:0 "Might of the Dark Horde"
BRC_might_of_the_dark_horde_desc:0 "The Dark Horde, despite our lack of manpower, is backed up by its willpower. We will show our fearsome strength to the Dwarves this day."

BRC_nefarians_wrath:0 "Nefarian's Involvement"
BRC_nefarians_wrath_desc:0 "Nefarian has refrained from direct involvement in the war thus far. But with a request from Rend, Nefarian has released the Black Dragons upon the Dark Iron Dwarves."

BRC_push_the_imperial_city:0 "Into the Heart of the City"
BRC_push_the_imperial_city_desc:0 "We have breached their defenses, now we must break down the doors to the Inner City."

BRC_onward_to_the_core:0 "Onward to the Core"
BRC_onward_to_the_core_desc:0 "The Dark Iron Dwarves have been defeated, but their master remains a threat. Destroy their spirits and put the Molten Core on ice."

BRC_victory_within_the_core:0 "Victory in the Core"
BRC_victory_within_the_core_desc:0 "With the Elementals defeat, we have beat our foes. The mountain and all it has to offer is ours once and for all!"

BRC_distribute_new_lands:0 "Distribution of Lands"
BRC_distribute_new_lands_desc:0 "With such a vast number of lands under our domain, we must distribute some to avoid possible issues in the future."

BRC_nefarians_new_domain:0 "Nefarian's Playground"
BRC_nefarians_new_domain_desc:0 "The Molten Core serves as an excellenct domain for Black Dragons, so it has been left for Nefarian to toy with.0"

BRC_fate_of_the_firelord:0 "Fate of the Firelord"
BRC_fate_of_the_firelord_desc:0 "Nefarian is tasked with deciding the fate of §RRagnaros§, how he does it may decide his own fate."

BRC_found_new_mokdoom:0 "Found New Mok'Doom"
BRC_found_new_mokdoom_desc:0 "Within the depths of Shadowforge, we shall establish New Mok'Doom. Providing a dedicated home for the Ogres within Shadowforge, as they are valued members of the Dark Horde."

BRC_spirestone_autonomy:0 "Spirestone Autonomy"
BRC_spirestone_autonomy_desc:0 "With the foundation of New Mok'Doom, the Spirestone Ogres have been granted autonomy within Shadowforge to further support the Dark Horde more thoroughly."

BRC_lands_for_thogrun:0 "Lands for Tho'Grun"
BRC_lands_for_thogrun_desc:0 "Tho'Grun aided in the invasion of the Dark Iron Dwarves, they will be granted minor settlements in the remaining Badlands territory."

BRC_settling_new_lands:0 "Settling New Lands"
BRC_settling_new_lands_desc:0 "Now that our allies have received their share we will begin an Orc Migration throughout Shadowforge City and the Searing Gorge."

BRC_tying_up_loose_ends:0 "Tying Up Loose Ends"
BRC_tying_up_loose_ends_desc:0 "With Dark Iron gone, nothing is stopping us from invading the minor factions in the region."

BRC_ending_the_brotherhood:0 "Ending the Brotherhood"
BRC_ending_the_brotherhood_desc:0 "The Thorium Brotherhood shall end their practices this day, as we lay siege to their citadel."

BRC_track_down_morganth:0 "Track Down Morganth"
BRC_track_down_morganth_desc:0 "Morganth betrayed us once, we shall assure he does not escape us this time. He will meet his end."

BRC_wipe_out_the_gnolls:0 "Wipe Out the Gnolls"
BRC_wipe_out_the_gnolls_desc:0 "The Shadowhide and Redridge Gnolls serve no purpose to us anymore, only a threat to our southern border. Crush them to reclaim our former lands."

BRC_grark_lorkrubs_information:0 "Grark Lorkrub's Information"
BRC_grark_lorkrubs_information_desc:0 "Grark Lorkrub has come to Blackrock Spire providing us information on the whereabouts of the Kargath Expeditionary Force."

BRC_destroy_kargath:0 "Raiding Kargath"
BRC_destroy_kargath_desc:0 "With the assistance of Grark Lorkrub, we have located the K.E.F. and raided the outpost of Kargath. Ending their patrols in the Badlands."

BRC_pushing_out_foreign_influence:0 "Handling Foreign Influence"
BRC_pushing_out_foreign_influence_desc:0 "We understand that the Dark Iron Dwarves and the Horde uphold outposts within our lands. We must deal with these to rid their influence."

BRC_raid_chiselgrip:0 "Raid Chiselgrip"
BRC_raid_chiselgrip_desc:0 "The Outpost of Chiselgrip is a Dark Iron outpost deep within the Burning Steppes. Destroy it and end their puny existence."

BRC_raid_flame_crest:0 "Raid Flame Crest"
BRC_raid_flame_crest_desc:0 "The Outpost of Flame Crest is an outpost upheld by our former brothers of the Horde. We must teach them a lesson to show we are superior."

BRC_occupying_the_outposts:0 "Occupying the Outposts"
BRC_occupying_the_outposts_desc:0 "With the threats removed, we can safely occupy the former Outposts and have greater control over our domain."

BRC_building_up_the_burning_steppes:0 "Building up our Territories"
BRC_building_up_the_burning_steppes_desc:0 "Our industry lacks from its former status, we must build up our infrastructure and industry to strengthen the Dark Horde."

###############################
#events
###############################
 blackrock.1.t:0 "Fate of the Dragonmaw"
 blackrock.1.d:0 "Warchief, survivors from the Dragonmaw clan have arrived they claim that a race of fishmen decimated their clan and that only a handful of them survived."
 blackrock.1.option.1:0 "Pitiful Worms!"
 blackrock.2.t:0 "Bleeding Hollow refugees"
 blackrock.2.d:0 "Warchief, survivors from the Bleeding Hollow clan claim that the clan was engulfed by the very swamps themselves. What little remains of there clan have had their minds broken and are unfit for combat. Perhaps we can’t tame this land after all."
 blackrock.2.option.1:0 "Cowards of all of them!"
 blackrock.3.t:0 "A Settlement in the North"
 blackrock.3.d:0 "The moment has arrived for us to join forces with the Bleeding Hollow and Dragonmaw clans in the north. Our plan is to carve out a large section of the forest and construct a massive settlement, which will serve as our forward operating base in the wars to come. With this stronghold established, we will be in a much stronger position to wage war and secure our dominance over these strange new lands."
 blackrock.3.option.1:0 "Our enemies shall fear this fortress."
 blackrock.4.t:0 "The Hakkari Defeated"
 blackrock.4.d:0 "Warchief we have successfully destroyed the army of what we now know to be trolls. Some of them have escaped to an unknown location and a massive temple sunk beneath the swamp seems to have no entrance and our weapons have proven to be useless in trying to breach it. With ought a doubt the small amount Hakkari Trolls must have escaped to different lands."
 blackrock.4.option.1:0 "None can stop the might of the Horde."
 blackrock.5.t:0 "Hakkari Tablets"
 blackrock.5.d:0 "Our scouting parties have managed to find and enter the ancient temple deep in the swamps, only to be repelled by what we now know to be trolls, an intelligent race inhabiting the temple. However, they were able to secure valuable tablets detailing maps of the continent, its civilizations, and the races present. These informations will surely prove useful."
 blackrock.5.option.1:0 "We will put this knowledge to good use."
 blackrock.6.t:0 "Identity Crisis"
 blackrock.6.d:0 "Orgrim Doomhammer's meeting with Warchief Blackhand was a tense affair, as he brought forth damning evidence of Gul'dan's treachery. The evidence presented was not only compelling but irrefutable, leaving no doubt in Blackhand's mind that Gul'dan was indeed plotting to usurp him as Warchief. Orgrim laid out in detail the extent of Gul'dan's plan and the danger it presented to the Horde, which only served to strengthen Blackhand's resolve to deal with the matter swiftly and harshly."
 blackrock.6.option.1:0 "Call the clans to war."
 blackrock.7.t:0 "Call to Arms"
 blackrock.7.d:0 "At the behest of Orgrim Doomhammer of the Frostwolf clan, Warchief Blackhand has declared Gul'dan an enemy of the Horde and ordered his elimination. However some among us are raising suspicions as the Frostwolf clan is widely disliked among the Horde and some suggest that they may have manipulated the warchief into starting this war. Nevertheless, the conflict promises to be a brutal one, with the powerful fel magic wielded by Gul'dan's followers against the strength and cunning of the orcish warriors."
 blackrock.7.option.1:0 "Side with the Warchief."
 blackrock.7.option.2:0 "Side with Gul’dan."
 blackrock.8.t:0 "End of Gul'dan's Uprising"
 blackrock.8.d:0 "This was a bloody conflict but Gul'dan has finally been defeated. With the traitorous warlock gone, we can finally turn back our attention to conquering this world. Warchief Blackhand is now faced with a difficult decision. He can remain in power and try to lead the orcs towards a brighter future, or he can step down in shame for having been so easily fooled by Gul'dan's machinations. "
 blackrock.8.option.1:0 "Blackhand remains the true Warchief of the Horde."
 blackrock.8.option.2:0 "The Warchief steps down in shame."
 blackrock.9.t:0 "Pillaging Redridge"
 blackrock.9.d:0 "Now that we have taken control of what the human call the Redridge Mountains, we must begin the pillage of the region and adapt it to our way of life. Our peons are already hard at work, building strongholds, digging mines, and clearing the forests to make room for our own settlements. We cannot afford to let the humans retake this land, and we will make sure to fortify our positions around Everstill Lake as well as deeper within the mountains.\n\n  Speaking of, the cliff, crags and valleys of Redrige are rich in resources that will come precious to fuel our war effort. The humans will learn to fear the Horde, and they will not dare to challenge our dominance in this region. We will make this land ours, and we will crush any who stand in our way."
 blackrock.9.option.1:0 "Spoils for the clan, spoils for the Horde."
 blackrock.10.t:0 "Pillaging Elwynn"
 blackrock.10.d:0 "We are now in control of most of Elwynn Forest and we have started seizing all the resources we can from this densely populated area. The humans have left behind many farms and mines, and we shall make them our own. The land will be pillaged from everything it has to offer: food, lumber, and minerals.\n\n   We cannot rely anymore on the Dark Portal to bring us what we need, and we must be self-sufficient if we are to prepare for our final push against the human capital city of Stormwind. The peons have already been put to work, building structures to store our newfound wealth and properly supply our troops on the front."
 blackrock.10.option.1:0 "Spoils for the clan, spoils for the Horde."
 blackrock.11.t:0 "The Fall of Stormwind"
 blackrock.11.d:0 "Stormwind lays in ruins their soldiers butchered on the streets, and there buildings ransacked and set ablaze. Some of there citizens have escaped via sea and fled north to unknown lands, perhaps there is even more of these Humans for us to face in the north."
 blackrock.11.option.1:0 "They can’t hide forever."
 blackrock.12.t:0 "Rend requests to stay independent"
 blackrock.12.d:0 "Trying to claim glory and live up to your legacy your sons Rend and Maim have requested that the Black tooth Grin Clan remain independent until they can prove that they our worthy of your name."
 blackrock.12.option.1:0 "So be it."
 blackrock.12.option.2:0 "These wretched whelps will obey."
 blackrock.13.t:0 "Summon the Draenor Clans"
 blackrock.13.d:0 "Initially left behind to rot on Draenor, these clan’s strength is now needed to defeat the world that now stands against us. We will send summons to every Ogre, and Orc and bring them to Azeroth."
 blackrock.13.option.1:0 "For the glory of the Horde."
 blackrock.14.t:0 "Warchiefs Summons"
 blackrock.14.d:0 "The Warchief has summoned us to join the fight on Azeroth. He has claimed a major victory and believes there is enough supplies and glory for all of the clans."
 blackrock.14.option.1:0 "Join the Conquest."
 blackrock.14.option.2:0 "We do not need the Horde."
 blackrock.15.t:0 "Doomhammer Bans Fel Magic"
 blackrock.15.d:0 "Orgrim Doomhammer has issued his first decree as warchief, forbidding the use of fel magic within the Horde. While he understands the immense power that comes with fel, he claims that the cost of using such dark magic is too great and that the corruption it brings is the very reason why the orc's homeworld of Draenor is dying."
 blackrock.15.option.1:0 "Abandon the fel."
 blackrock.16.t:0 "Warchief Bans Fel magic"
 blackrock.16.d:0 "As one of his first decrees as Warchief Orgrim Doomhammer has forbidden the Horde from using fel magic. Should we fail to comply we will likely end up at war with the rest of the Horde."
 blackrock.16.option.1:0 "Obey the Warchief."
 blackrock.16.option.2:0 "Keep practicing but in secret."
 blackrock.17.t:0 "A Gift from Gul’dan"
 blackrock.17.d:0 "Gul’dan has informed us that Azeroth contains massive amounts of Elemental powers. He believes that if he can conquer them as he did on Draenor, his warlocks will be able to destroy the humans with ease. With this in mind, he and his followers have decided to travel up north to an unknown location, leaving his territories near the Dark Portal to us."
 blackrock.17.option.1:0 "Something seems off..."
 blackrock.18.t:0 "Doomhammer Challenges Blackhand to Mak'Gora"
 blackrock.18.d:0 "   News has spread throughout the clans that Gul'dan, the powerful warlock who has been revealed to be the driving force behind the Horde, has fallen into a mysterious coma. With Gul'dan out of commission, Orgrim Doomhammer sees an opportunity to strike. He has revealed to the other chieftains that Warchief Blackhand, long believed to be the one in charge, was in fact a mere puppet of Gul'dan's dark forces.\n\n In a bold move, Orgrim challenged Blackhand to the ancient orcish tradition of Mak'gora ("Duel of honor" in the orcish tongue), a fight to the death. To no one surprise, Warchief Blackhand accepted the challenge, and although weakened by Gul'dan's absence, stood tall and proud, ready to defend his honor and his position as Warchief. Orgrim, equally determined, held a grim expression on his face, showing no sign of hesitation or doubt. The two exchanged words, their voices low and fierce, before stepping into the circle to begin the fight.\n\n  As the crowd around them roared, the two warriors clashed, their weapons ringing out in a deadly dance. But as the fight kept going, it was beginning to be clear that... "
 blackrock.18.option.1:0 "...Orgrim had the ancestors by his side."
 blackrock.18.option.2:0 "...Blackhand was stronger than expected."
 blackrock.19.t:0 "Doomhamer Gains the Ascendant"
 blackrock.19.d:0 "   Slowly but surely, Doomhammer gained the ascendant, skillfully dodging Blackhand's heavy blows and striking back at lightning-fast speed, gradually wearing down his opponent, driving him back with each successive attack. Despite Blackhand's size and strength, he was no match for Doomhammer's cunning and agility.\n\n   In the end, Doomhammer delivered a devastating blow that shattered Blackhand's helmet and sent him reeling to the ground. As Blackhand struggled to rise, Doomhammer seized the opportunity to deliver a final, crushing blow that caved in his skull and ended the fight decisively.\n\n   The sound of Blackhand's death echoed across the land, marking the end of an era and the rise of Orgrim Doomhammer as the new standing Warchief of the Horde. He must now quickly gain the support of the clans and lead them to victory against the Humans lest this victory be for nothing."
 blackrock.19.option.1:0 "Lok-tar! For the glory of the Horde!"
 blackrock.199.t:0 "The Warchief Remains Strong"
 blackrock.199.d:0 "  As the fight went on, Blackhand began to see through Orgrim's feints and tricks. He anticipated each move and countered with his own powerful strikes. Orgrim, feeling the pressure, started to lose his footing and make mistakes. Blackhand capitalized on these openings, delivering devastating blows to his opponent.\n\n    Finally, with a resounding roar, Blackhand landed a fierce blow to Orgrim's chest, sending him crashing to the ground. The crowd erupted into cheers as Blackhand raised his weapon in triumph. Orgrim laid motionless, defeated. The new Warchief had emerged victorious, cementing his place as the leader of the Horde."
 blackrock.199.option.1:0 ""Lok-tar ogar, Backstabber...""
 blackrock.20.t:0 "The Stormreaver Clan"
 blackrock.20.d:0 "Now spared from execution, Gul'dan has been granted permission by the Warchief to form and lead his own clan: The Stormreavers. They have been entrusted by the Warchief to build a navy for the Horde and will be granted Stormwind city and most importantly its port."
 blackrock.20.option.1:0 "We will watch him closely..."
 blackrock.21.t:0 "Pursuit of new allies"
 blackrock.21.d:0 "With the pillage of Stormwind city we where able to obtain the city’s vast wealth. With no use for gold and very few nations willing to communicate with us. We should try to sell the gold to a race known as “Goblins” scrolls in Stormwind great library’s detail them as a technologically advanced race known for immense greed."
 blackrock.21.option.1:0 "Let us hope this deal works."
 blackrock.22.t:0 "Cho'gall meets with the Warchief"
 blackrock.22.d:0 "Cho'gall has met today with Warchief Doomhammer and brought news of a potential opportunity for the Horde. He revealed that he has been in communication with the Dark Iron dwarves who dwell in the lower parts of the mountain, and that they still hold claim over the halls that we have built our fortress within.\n\n The ogre is offering the Warchief a chance to speak with the dwarves and persuade them to relinquish their claim over the rest of the mountains or potentially strike an alliance. The dwarves surely know the mountain very well and who knows how many of them lives deep within its depth, it would be wise to have them on our side..."
 blackrock.22.option.1:0 "Simply ask them for peace."
 blackrock.22.option.1.d:0 "§HIf the dwarves accept, we will form a non-aggression pact with them.§!"
 blackrock.22.option.2:0 "We will strike an alliance."
 blackrock.22.option.2.d:0 "§HIf the dwarves accept, we will form a mutual guarantee of independance with them.§!"
 blackrock.22.option.3:0 "Leave them be."
 blackrock.22.option.3.d:0 "§HWe leave the dwarves alone, striking no deal with them.§!"
 blackrock.24.t:0 "Frostmane Tribe joins the Horde!"
 blackrock.24.d:0 "Seeking to destroy their ancient dwarven enemies in Dun Morough, the Frostmane Tribe has gladly accepted our proposal to join the Horde! As we speak their warriors are preparing to open a second front in Dun Morough to trap the Dwarves between our two armies. Lok'tar ogar!"
 blackrock.24.option.1:0 "A worthy addition to the Horde."
 blackrock.24.option.1.d:0 "§HThe §!§C[FRT.GetNameWithFlag]§!§H joins §!§RThe Horde§!§H!§!\n\n"
 blackrock.25.t:0 "[FRT.GetName] rejects our Proposal"
 blackrock.25.d:0 "Not wanting to risk annihilation at the hands of Ironforge, the Frostmane Tribe has rejected our offer to join the Horde and instead will watch the war from the sidelines. Let's make them regret their decision by conquering the dwarven lands and showing the might of the Horde!"
 blackrock.25.option.1:0 "We're better off without these trolls."
 blackrock.25.option.2:0 "Let's show them what it means to reject the Horde."
 blackrock.26.t:0 "Dreadmaul Granted Independence"
 blackrock.26.d:0 "The Dreadmaul Ogres proved to be valuable allies in the First war. For their great contribution we have decided to give them a home in the eastern Burning Steppes."
 blackrock.26.option.1:0 "They have earned it."
 blackrock.27.t:0 "Land Distribution"
 blackrock.27.d:0 "Our great warchief [BRC.GetLeader] has carved out a map of the lands we have conquered, including the human kingdom of Stormwind and the lands surrounding the Blackrock Mountain. Each clan will be getting its fair share of territory from their efforts during the war and to ensure victory for future conflicts in the north."
 blackrock.27.option.1:0 "They better be grateful..."
 blackrock.28.t:0 "Dreadmaul finish construction of Juggernauts"
 blackrock.28.d:0 "The Dreadmaul Ogres have finished construction of several juggernauts in our Wetlands naval base. These heavily armored ships will be the first step to defeating the humans at sea."
 blackrock.28.option.1:0 "We will send the Humans to the bottom of the seas!"
 blackrock.28.option.1.d:0 "We receive a §Hjuggernaught fleet§! build by the §HDreadmaul Ogres§!."
 blackrock.29.t:0 "Steemwheedle Battleship Shipment"
 blackrock.29.d:0 "Warchief, our order of battleships from the Steamwheedle Cartel has arrived. These massive ships will surely be able to sink anything the puny humans can construct and ensure the seas belong to the Horde!"
 blackrock.29.option.1:0 "Our alliance has surely payed off."
 blackrock.29.option.1.d:0 "We receive a §Hbattleship fleet§! from §H[STC.GetName]§!."
 blackrock.30.t:0 "Frostmane Destroyers"
 blackrock.30.d:0 "To celebrate our alliance, the Frostmane Tribe has sent us several of their formidable naval destroyers as a gesture of gratitude for our assistance in the war against the dwarves. We look forward to continuing our alliance with the frost trolls and we hope that these new ships will help us win against the humans."
 blackrock.30.option.1:0 "Our alliance has surely payed off."
 blackrock.31.t:0 "A Home In The Spire"
 blackrock.31.d:0 "  Our victory over the humans of Stormwind was a great achievement, but it was only the beginning. We knew that we needed a stronghold from which we could launch our next campaign. That's why, when we discovered the Blackrock Mountains, we saw it as the perfect place to build our fortress. The dark rocky volcano reminded us of our old home back on Draenor, and we knew that it would provide us with the security and resources we needed.\n\n   With the area secured, we began to build our fortress within the mountain. The immense dwarven halls carved within it provided us with everything we needed to build a stronghold that would be impregnable.\n\n  As we worked on our new home, we felt a sense of pride and satisfaction knowing that it would stand the test of time. We used the knowledge we had gained from our battles and incorporated it into our creation, making the best use as possible of the ingenious dwarven pieces of architecture. The result was a fortress that was not only strong and secure but also an embodiment of our strength and determination. We have decided to name the central part of it all 'Hordemar City', to pay homage to the great Horde that bind us all.\n\n  As we looked upon our Blackrock Mountains, we knew that this was the start of something great. It had become our new home, and from there, we would continue our campaign until all of Azeroth bowed before us."
 blackrock.31.option.1:0 "Lok'tar ogar! For the Horde!"
 blackrock.32.t:0 "Under a Single Banner"
 blackrock.32.d:0 "The Time has come to force the rest of the clans to directly serve the Warchief. For to long have they had free reign and acted to their own interests, enough is enough they will submit or die to the united Horde."
 blackrock.32.option.1:0 "For the Horde!"
 blackrock.33.t:0 "Deal with Alterac"
 blackrock.33.d:0 "It has come to our attention that one of the smaller Human kingdoms known as Alterac would rather not fight in the war. They have been pressured into the Alliance by the stronger kingdoms and may be willing to assist us as a form of revenge."
 blackrock.33.option.1:0 "Send an envoy to Alterac."
 blackrock.34.t:0 "Tyr’s Hand Revolt"
 blackrock.34.d:0 "Our alliance with Alterac has proven to be very useful. They have convinced peasants in Western Lordaeron to take up arms against the Kingdom. While a minor distraction this uprising will be able to take some of the Alliances armies away from the front."
 blackrock.34.option.1:0 "Alterac has proven there worth."
 blackrock.35.t:0 "The Time has Come"
 blackrock.35.d:0 "Alterac has helped us fight the Alliance for some time in secret. The time has come for them to formalize their Alliance with us a stab their armies into the back of the Alliance."
 blackrock.35.option.1:0 "The Alliance will tremble before us."
 blackrock.36.t:0 "Deal with the Amani"
 blackrock.36.d:0 "The Forest Trolls native to Lordaeron have struggled against the Humans, Dwarves, and Elves for some time. This race is eager to regain their lands and could prove to be a great ally in this war. We will send envoys to each of the tribes in Lordaeron and ask them to join our side."
 blackrock.36.option.1:0 "Another ally for the Horde"
 blackrock.37.t:0 "Frigates from the Amani."
 blackrock.37.d:0 "As part of our continued alliance with the forest trolls the Amani have sent several frigates of their making. These vessels will surely help in our naval campaign again the humans."
 blackrock.37.option.1:0 "Our alliance has surely payed off."
 blackrock.37.option.1.d:0 "We receive a §Hfrigate fleet§! from the §H[AMA.GetName]§!."
 blackrock.38.t:0 "Tol’Barad Invasion Force"
 blackrock.38.d:0 "In order to cut of Stromgarde from the rest of the alliance we must take out their insular client state known as Tol’Barad. Should Stromgarde fall its nobles will likely escape to this island and keep up the fight. Additionally, vast amounts of oil have been reported to be extracted on the island, something we can’t afford to let the Alliance profit from."
 blackrock.38.option.1:0 "We need to take Tol'Barad!"
 blackrock.38.option.1.d:0 "§HA small invasion force§! lands on §HTol'Barad§!..."
 blackrock.39.t:0 "Hillsbrad Invasion Force"
 blackrock.39.d:0 "Nestled against the southern flanks of the Alterac Mountains, Hillsbrad is a strategic region that holds immense significance for our plans. With its winding trails and narrow passes to the north and its rolling hills and plains to the south, it is pivotal to Stromgarde's supply lines as it connects the kingdom with the rest of the Alliance.\n\n By capturing Hillsbrad, we could sever the link between them and their allies, effectively cutting them from any external supplies and leaving them isolated and vulnerable. Our troops are already discretly crossing the Baradin Bay by boat to land on the eastern shores of the region, hopefully surprising the humans."
 blackrock.39.option.1:0 "Let the invasion begin!"
 blackrock.39.option.1.d:0 "§HA small invasion force§! lands on the eastern shores of §HHillsbrad§!..."
 blackrock.40.t:0 "Alterac has accepted our proposal"
 blackrock.40.d:0 "The Kingdom of Alterac has agreed to stop supporting the alliance and pull its armies back to its nation. Unknown the rest of the Alliance they will be making moves to join the Horde and stab them in the back."
 blackrock.40.option.1:0 "A wise decision for them."
 blackrock.41.t:0 "Alterac has killed our envoy"
 blackrock.41.d:0 "While our intel was correct it seems Alterac would rather die to the might of the Horde then work with us to achieve what they want."
 blackrock.41.option.1:0 "They will pay in blood."
 blackrock.42.t:0 "Warchief Blackhand calls for a united horde"
 blackrock.42.d:0 "Warchief Blackhand has called for a united Horde ruled by him and him alone. He claims that to much autonomy has led to betray and civil war in the Horde and only by uniting under one banner can the Horde continue to thrive on Azeroth."
 blackrock.42.option.1:0 "Submit to the Warchief."
 blackrock.42.option.2:0 "We will die before becoming slaves."
 blackrock.43.t:0 "Envoys from the Horde"
 blackrock.43.d:0 "Envoys from dah Horde have arrived in our nation. Dhey speak of a pact to destroy duh humans and their allies. Dey have already destroyed Stormwind and Khaz Modan dhey could prove to be a valuable ally"
 blackrock.43.option.1:0 "A great opportunity mon."
 blackrock.43.option.2:0 "We do not need dem."
 blackrock.44.t:0 "Shadow Council Located"
 blackrock.44.d:0 "After interrogating Garona Halforcen and receiving confirmation from our Black Tooth Grin scouts, we have located the Shadow Council. They have holed up in the Blackrock Mountains, in the volcanic lands of the Burning Steppes, north of Redridge. Following these reports, the Warchief has three plans in minds.\n\n The first plan is to lead a large raiding party to Blackrock Spire, in the heart of the mountain. This would prevent direct war and strike the Council directly at its core, but it could cost the lives of many orcs. We cannot allow our brothers to die in vain to the twisted spells of the warlocks, but we also cannot let the Shadow Council continue their dark machinations.\n\n For the second plan, the Warchief wants to lead a small discreet group of carefully selected orcs, aimed directly at the Council's leadership. This option, although very risky, has the potential to be more successful, as a small group could sneak in and eliminate key targets without alerting the rest.\n\n Lastly the final option is to declare war directly on the Shadow Council. This war could prove to be a costly one as we are still unsure of what forces are behind the Council, but we cannot allow them to continue their nefarious schemes unchecked."
 blackrock.44.option.1:0 "We ride towards Blackrock Mountain!"
 blackrock.44.option.1.d:0 "§HA raiding party of a thousand orcs led by Warchief Doomhammer is sent towards Blackrock Mountain...§!"
 blackrock.44.option.2:0 "The Warchief will lead a small party."
 blackrock.44.option.2.d:0 "§HThe Warchief leads his small group of warriors towards the mountain...§!"
 blackrock.44.option.3:0 "The time is for war!"
 blackrock.45.t:0 "The Shadow Council Neutralized!"
 blackrock.45.d:0 "After careful planning and preparation, Warchief Orgrim Doomhammer led his troops towards Blackrock Mountain with the intent to neutralize the Shadow Council once and for all. The journey was perilous and fraught with danger, but the orcs remained steadfast in their determination to rid themselves of the Council's influence. In only a few hours, they managed to neutralize the Council, putting an end to their machinations."
 blackrock.45.option.1:0 "They got what they deserve."
 blackrock.45.option.1.d:0 "§HEvery owned states§! get transfered to the §H[BRC.GetNameWithFlag]§! except for their headquarter in §Heastern Blackrock Mountains§!.\n"
 blackrock.46.t:0 "Doomhammer dies at the hands of the Council!"
 blackrock.46.d:0 "News have reached us that the strike force led by the Warchief himself against the Shadow Council's leadership was a complete failure! Despite their careful planning and the selection of only the most capable warriors, the assault ended in a bloody defeat, with Doomhammer himself falling in battle. The Shadow Council, alerted to our attack, was well-prepared and their fel magic proved too strong even for the Warchief and his elite guard.\n\n The news of Doomhammer's death is already spreading quickly among the Horde and is causing great shock and unrest. This is a devastating blow that will take time to recover from and a new Warchief must be chosen quickly if we want to stabilize the situation. For now, we need to decide what to do against the Shadow Council."
 blackrock.46.option.1:0 "Avenge the Warchief! For Doomhammer!"
 blackrock.46.option.2:0 "We will come back later to punish these wretched whelps."
 blackrock.47.t:0 "Choosing a New Warchief"
 blackrock.47.d:0 "With the death of our former Warchief Orgrim Doomhammer, the Blackrock Clan and the Horde must now decide on a new leader. We have three choices to consider: Varok Saurfang, Eitrigg, and Rend Blackhand.\n\n Varok Saurfang has proven himself as a loyal and capable commander, and as Doomhammer's second-in-command, he is well-versed in our ways of war and very popular among the ranks.\nEitrigg, one of Doomhammer's closest advisors and an elite warrior, has also shown his devotion to the Horde time and time again and his zeal doesn't need to be proven again.\nAnd then there is Rend Blackhand, the son of former Warchief Blackhand and current chieftain of the Black Tooth Grin clan, whose family has long been a part of the Horde's leadership. Believing to be the rightful heir of the Horde, Rend is a bloodthirsty and ferocious warrior.\n\n Each of these candidates has their strengths and weaknesses, and we must carefully consider which one would best lead us forward. Our decision will not only impact the Blackrock Clan, but also the entire Horde. We must choose wisely."
 blackrock.47.option.1:0 "Saurfang shall lead the Horde to greatness!"
 blackrock.47.option.2:0 "Eitrigg wise leadership is what we need right now."
 blackrock.47.option.3:0 "Rend Blackhand takes over the Horde!"

 blackrock.48.t:0 "The Fate of Lordaeron"
 blackrock.48.d:0 "    As the dust settles, our Horde stands as the dominant power in the former human lands of Lordaeron. Now, it is time for us to decide their fate.\n\n    One option is to maintain direct control of the entire region, using our strength to enforce our rule and extract resources from the conquered humans. This would ensure our continued dominance, but may lead to unrest and rebellion among the human population.\n\n  Another option is to release Lordaeron as a protectorate, allowing them a degree of autonomy while still maintaining our influence over the region. We would retain control of Lordaeron City, the former capital of the human kingdom, as a symbol of our power.\n\n   The last option involve allowing the humans to retain hold over Tirisfal and their capital city, giving up our claim over it. While the humans would still be under our careful watch, this would undoubtedly improve our capacity to pacify the land, but could also weaken our hold over the region."
 blackrock.48.option.1:0 "Occupy all of their land."
 blackrock.48.option.2:0 "Give them some control, but keep Lordaeron City."
 blackrock.48.option.3:0 "They can have their land under our watch."

 blackrock.49.t:0 "Ruling the Humans"
 blackrock.49.d:0 "With the Lordaeronian Protectorate formed, the question remains of who shall govern the humans in our name. Our great warchief [BRC.GetLeader] has decided to choose one of his son for this important task, but is still unsure about which of them.\n\n Dal'rend comes as the obvious choice, being the main leading figure of the Black Tooth Grin clan, often outshining his brother thanks to his brute strength and untamed ferocity. He is uncompromising and fearless which could prove useful in overseeing the humans.\n\n Maim on the other hand display more tactical ingenuity and is a calculating warrior. Expert in schemes and information gathering, Maim could easily counter any human rebellion before they even start."
 blackrock.49.option.1:0 "Maim will make sure that they obey us."
 blackrock.49.option.2:0 "Dal'Rend shall oversee the humans with a firm hand."

 blackrock.50.t:0 "Ruling the Humans"
 blackrock.50.d:0 "As we seek to rebuild the remnants of Lordaeron under the banner of the Lordaeronian Protectorate, the question remains of who shall govern the humans in our name. Our warchief [BRC.GetLeader] is considering two orcs who stand above all else: Varok Saurfang and Eitrigg.\n\n The first, Varok, second-in-command of the Warchief, is a paragon of honor and wisdom and represents unyielding loyalty and strategic brilliance. He is an excellent leader as proven countless time during battle.\n\n Eitrigg on the other hand, is a seasoned warrior and diplomat, embodying resilience and compassion. His veteranship as lieutenant to the warchief has granted him the same abilities as Varok when it comes to leading.\n\nBoth are extremely worthy of the role and would rule the humans with a strong yet fair fist. In the end, the decision remains between the hands of the Warchief..."
 blackrock.50.option.1:0 "Eitrigg shall govern the humans fairly."
 blackrock.50.option.2:0 "Varok will treat the humans with honor and strength."

 blackrock.51.t:0 "Rename the City"
 blackrock.51.d:0 "The control of the human lands of Lordaeron comes with the control over their capital city, conveniently named Lordaeron City. Its capture was a cornerstone in our victory in the war and remains as a testament to the Horde's strength and unwavering power.\n\n Recently, the idea of renaming the city to reflect our triumph has been spreading amongst our ranks. Doing so would serve two purpose: hinder human moral and most importantly assert our dominance over these lands. Once again, the warchief has been informed on the matter and now has to choose what to do."
 blackrock.51.option.1:0 "A name in honor of our Warchief!"
 blackrock.51.option.2:0 "New Blackrock City has a nice ring to it."
 blackrock.51.option.3:0 "Leave as is."

 blackrock.52.t:0 "Fate of Gul'dan"
 blackrock.52.d:0 "A few weeks after we secured Blackrock Mountain, Gul'dan has been brought before the Warchief. The warlock has promised to abandon his connection with the dark forces of the Burning Legions and provide the warchief with powerful new warriors thanks to a new magic he has uncovered on the condition that his life be spared."
 blackrock.52.option.1:0 "He gets to live, under our watch."
 blackrock.52.option.2:0 "Crush him."

 blackrock.53.t:0 "The Circles of Binding"
 blackrock.53.d:0 "The Arathi Highlands are home to the Circles of Binding, strange rings of carved stones which the origin is still unknown to us. There is four of them scattered across the land, each guarded by different elementals of fire, water, air and earth. These circles are the source of great elemental powers and harnessing that power could be of great use for the Horde. However, attempting to take control of the Circles would not be easy, as the elementals fiercely protect their domain."
 blackrock.53.option.1:0 "Have our warlocks and necrolytes siphon their power."
 blackrock.53.option.2:0 "Our shamans will commune with the elements."
 blackrock.53.option.3:0 "Do nothing."

 blackrock.54.t:0 "Deal with Rend"
 blackrock.54.d:0 "As Orgrim Doomhammer seizes control of the Horde, the fate of the Black Tooth Grin clan, led by Rend and Maim Blackhand, sons of former Warchief Blackhand, hangs in the balance. Three courses of action now lie to guarantee the clan's loyalty, each with its own uncertainties.\n\n The first option is to approach the Black Tooth Grin clan and simply request that they renew their oath to the Horde and now Doomhammer's rule.\n\nAlternatively, Doomhammer may propose a pact. Offering the Black Tooth Grin clan their freedom within the Horde's ranks, coupled with promises of lands once Azeroth is conquered. An offer that the cunning brothers might have a greater likelihood of accepting.\n\n Lastly, there is the daring proposition to reintegrate the Black Tooth Grin clan within the Blackrock Clan, a fraught and difficult request less likely to be embraced."
 blackrock.54.option.1:0 "Simply request their allegiance."
 blackrock.54.option.2:0 "Promise them land and autonomy."
 blackrock.54.option.3:0 "They should re-integrate our ranks."

 blackrock.55.t:0 "Victory over Humanity"
 blackrock.55.d:0 "   Lok'tar! We now stand triumphant over the shattered remnants of humanity! Our relentless onslaught has swept across the lands, from the imposing Dark Portal to the once proud city of Lordaeron, leaving a wake of destruction in our path. Now, the Horde's dominion stretches over all the continent, asserting our dominance and reshaping our very own destiny!\n\n  However, even in the face of our overwhelming might, some stubborn humans refuse to accept their defeat. Taking opportunity of our difficulty to manage this overstretched empire, small pockets of resistance have emerged, gathering in defiance against our rule. Though their numbers may be limited, their resolve poses a potential threat to the stability we seek to establish. These scattered resistance cells, lurking in the shadows of their fallen cities or pillaged countryside, aim to undermine our authority and hinder our progress.\n\n   Our dominance over this vast expanse carries with it great responsibility and opportunity. We shall rise to the challenge and forge a new era under the banner of the Horde. Let our enemies tremble, for we, the Blackrock Clan, are the architects of their doom."
 blackrock.55.option.1:0 "These puny humans will know their new masters."
 blackrock.55.option.1.d:0 "The §Rhuman resistance§! establish itself in some of our §Hrecently conquered states§! leaving a trail of unrest and undermining our efforts to stabilize these areas.\n\n"

 blackrock.56.t:0 "Dealing with the Resistance"
 blackrock.56.d:0 "   In the aftermath of our triumphant conquest of the northern Kingdoms, a puny human resistance movement has emerged, challenging our authority and sowing seeds of dissent. The resistance, which spans across Lordaeron, Alterac, Stromgarde, and other liberated territories, threatens to undermine our dominion.\n\n    To address this growing threat, two distinct strategies have been proposed. The first solution involves the establishment of internment camps, where individuals suspected of participating in the resistance will be detained. These camps will isolate and neutralize potential troublemakers, ensuring the stability of our rule.\n\n   The second option adopts a more tempered approach by reinforcing garrisons with additional grunts. This increased military presence aims to suppress dissent, maintain law and order, and swiftly quell any insurrections that may arise.\n\n   We need to choose the most effective course of action to subdue the human population and consolidate our control over the conquered territories as letting the resistance grow could have dire consequences..."
 blackrock.56.option.1:0 "We shall build camps to contains the troublemakers."
 blackrock.56.option.1.d:0 "We will deal with the §Rhuman resistance§! by building §Hinternment camps§! which takes §1more time§! and §Hcivilian factories§! to build but cost §Cless political power§!.\n§GUnlock decisions to build internment camps.§!\n\n"
 blackrock.56.option.2:0 "Sending more grunts into the concerned area is the way to go."
 blackrock.56.option.2.d:0 "We will deal with the §Rhuman resistance§! by sending §Hadditionnal forces§! in destabilized areas which takes §1less time§! but cost §Hmanpower§! and §Cmore political power§!.\n§GUnlock decisions to send troops in troubled areas.§!\n\n"

 blackrock.57.t:0 "The Fate of Arathi"
 blackrock.57.d:0 "The Arathi Highlands are rugged lands of rolling hills and expansive plains. Within its borders lies the Circle of Bindings, nexuses of elemental magic channeling the primal forces of the elementals of Azeroth. All of this reminiscent of the serene Nagrand of Draenor."
 blackrock.57.option.1:0 "Give it to our allies of the [WBT.GetName]"
 blackrock.57.option.1.d:0 "§HAny states§! that we own in the §HArathi Highlands§! will be transfered to the §H[WBT.GetNameWithFlag]§!.\n\n"
 blackrock.57.option.2:0 "Give it to the [WSC.GetName]"
 blackrock.57.option.2.d:0 "§HAny states§! that we own in the §HArathi Highlands§! will be transfered to the §H[WSC.GetNameWithFlag]§!.\n\n"
 blackrock.57.option.3:0 "Give it to the [RWC.GetName]"
 blackrock.57.option.3.d:0 "§HAny states§! that we own in the §HArathi Highlands§! will be transfered to the §H[RWC.GetNameWithFlag]§!.\n\n"
 blackrock.57.option.4:0 "Keep if for ourselves."

 blackrock.58.t:0 "The Fate of Hillsbrad"
 blackrock.58.d:0 "The Hillsbrad Foothills, south of the Alterac Mountains, is made up of rolling plans and hills covered with forests, with rivers flowing from the mountains and ending in the Baradin Bay. Its biggest river, the Thondoril, begins its course way up north, in Lordaeron."
 blackrock.58.option.1:0 "Give it to the [ALT.GetName]"
 blackrock.58.option.1.d:0 "§HAny states§! that we own in the §HHillsbrad Foothills§! will be transfered to the §H[ALT.GetNameWithFlag]§!.\n\n"
 blackrock.58.option.2:0 "Give it to the [WSC.GetName]"
 blackrock.58.option.2.d:0 "§HAny states§! that we own in the §HHillsbrad Foothills§! will be transfered to the §H[WSC.GetNameWithFlag]§!.\n\n"
 blackrock.58.option.3:0 "Give it to the [FWC.GetName]"
 blackrock.58.option.3.d:0 "§HAny states§! that we own in the §HHillsbrad Foothills§! will be transfered to the §H[FWC.GetNameWithFlag]§!.\n\n"
 blackrock.58.option.4:0 "Keep if for ourselves."

 blackrock.59.t:0 "The Fate Dalaran"
 blackrock.59.d:0 "Dalaran, the once mighty city of mages, now lies conquered under our indomitable Horde. Its grand spires and arcane wonders stand as a testament to the feeble sorceries of humans. Within the city probably lies lots of artifacts and treasures that could very well be useful or interesting..."
 blackrock.59.option.1:0 "Give it to the [ALT.GetName]"
 blackrock.59.option.1.d:0 "§HAny states§! that we own in §HDalaran or its surrounding§! will be transfered to the §H[ALT.GetNameWithFlag]§!.\n\n"
 blackrock.59.option.2:0 "Give it to the [THC.GetName]"
 blackrock.59.option.2.d:0 "§HAny states§! that we own in §HDalaran or its surrounding§! will be transfered to the §H[THC.GetNameWithFlag]§!.\n\n"
 blackrock.59.option.3:0 "Give it to the [FWC.GetName]"
 blackrock.59.option.3.d:0 "§HAny states§! that we own in §HDalaran or its surrounding§! will be transfered to the §H[FWC.GetNameWithFlag]§!.\n\n"
 blackrock.59.option.4:0 "Keep if for ourselves."

 blackrock.60.t:0 "The Fate of the Principality of Hearthglen"
 blackrock.60.d:0 "The Principality of Hearthglen, lodged between the Tirisfal Glades to the west, the Alterac Mountains to the south and Eastweald to the east, is a lush region of forest and farmlands and is the breadbasket of Lordaeron.\n\n It gets its name from the fortified town of Hearthglen to the north, center of the regional administration. To the south is the bustling town of Andorhal, bordering the Darrowmere Lake on which lies the fortress of Caer Darrow, protected by ancient elven runestones."
 blackrock.60.option.1:0 "Give it to the [ALT.GetName]"
 blackrock.60.option.1.d:0 "§HAny states§! that we own in the §HPrincipality of Hearthglen§! will be transfered to the §H[ALT.GetNameWithFlag]§!.\n\n"
 blackrock.60.option.2:0 "Give it to the [LOR.GetName]"
 blackrock.60.option.2.d:0 "§HAny states§! that we own in the §HPrincipality of Hearthglen§! will be transfered to the §H[LOR.GetNameWithFlag]§!.\n\n"
 blackrock.60.option.3:0 "Give it to the [AMA.GetName]"
 blackrock.60.option.3.d:0 "§HAny states§! that we own in the §HPrincipality of Hearthglen§! will be transfered to the §H[AMA.GetNameWithFlag]§!.\n\n"
 blackrock.60.option.4:0 "Keep if for ourselves."

 blackrock.61.t:0 "The Fate of Eastweald"
 blackrock.61.d:0 "Similar the Principality of Hearthglen to the west, Eastweald is rich in forest and farmlands, that used to provide the rest of kingdom with precious wood and food before our conquest.\n\n The shining jewel of Eastweald is Stratholme, the biggest city of the entire Kingdom of Lordaeron. On the east coast lies Tyr's Hand, a great fortified city. being one of their oldest settlement in Lordaeron, it is also home of many temples and holy sites to the humans.\n\n As also a frontier region of Lordaeron, its northern reaches are still home to some pockets of elves and trolls. The elven Kingdom of Quel'thalas as well as the troll lands of Zul'Aman can also be accessed from the Thalassian Pass within the mountains."
 blackrock.61.option.1:0 "Give it to the [LOR.GetName]"
 blackrock.61.option.1.d:0 "§HAny states§! that we own in §HEastweald§! will be transfered to the §H[LOR.GetNameWithFlag]§!.\n\n"
 blackrock.61.option.2:0 "Give it to the [AMA.GetName]"
 blackrock.61.option.2.d:0 "§HAny states§! that we own in §HEastweald§! will be transfered to the §H[AMA.GetNameWithFlag]§!.\n\n"
 blackrock.61.option.3:0 "Give it to the [DMC.GetName]"
 blackrock.61.option.3.d:0 "§HAny states§! that we own in §HEastweald§! will be transfered to the §H[DMC.GetNameWithFlag]§!.\n\n"
 blackrock.61.option.4:0 "Keep if for ourselves."

 blackrock.62.t:0 "The Fate of Northern Lordaeron"
 blackrock.62.d:0 "Northern Lordaeron is one of the least populated areas of the entire kingdom of the same name. It is mainly composed of mountains, highlands and valleys covered in pine forest overlooking the sea to the North from impressive cliffs. The only notable location of the region is the high elven port of Dawnstrider Harbor."
 blackrock.62.option.1:0 "Give it to the [LOR.GetName]"
 blackrock.62.option.1.d:0 "§HAny states§! that we own in §HNorthern Lordaeron§! will be transfered to the §H[LOR.GetNameWithFlag]§!.\n\n"
 blackrock.62.option.2:0 "Give it to the [AMA.GetName]"
 blackrock.62.option.2.d:0 "§HAny states§! that we own in §HNorthern Lordaeron§! will be transfered to the §H[AMA.GetNameWithFlag]§!.\n\n"
 blackrock.62.option.3:0 "Give it to the [DMC.GetName]"
 blackrock.62.option.3.d:0 "§HAny states§! that we own in §HNorthern Lordaeron§! will be transfered to the §H[DMC.GetNameWithFlag]§!.\n\n"
 blackrock.62.option.4:0 "Keep if for ourselves."

 blackrock.63.t:0 "The Fate of Silverpine Forest"
 blackrock.63.d:0 "South of the capital city of Lordaeron lies The Silverpine Forest. This dense woodland, characterized by its towering trees and thick undergrowth is home to many wild creatures and is one of the least developped region of Lordaeron, hosting no big cities. The landscape is a mix of rolling hills and uneven terrain, with occasional clearings where sunlight filters through the canopy in which the humans have often cleared the land for farming.\n\n The forest borders the Lordamere Lake, one of the largest lakes of the Eastern Kingdoms as a whole and acting as a frontier with the regions of Alterac and the magogracy of Dalaran. The forest is traditionally not entirely under Lordaeron's influence, in fact, its southern part is claimed by the Kingdom of Gilneas and acts as the frontier for both kingdoms."
 blackrock.63.option.1:0 "Give it to the [LOR.GetName]"
 blackrock.63.option.1.d:0 "§HAny states§! that we own in §HSilverpine Forest§! will be transfered to the §H[LOR.GetNameWithFlag]§!.\n\n"
 blackrock.63.option.2:0 "Give it to the [TLC.GetName]"
 blackrock.63.option.2.d:0 "§HAny states§! that we own in §HSilverpine Forest§! will be transfered to the §H[TLC.GetNameWithFlag]§!.\n\n"
 blackrock.63.option.3:0 "Give it to the [LBC.GetName]"
 blackrock.63.option.3.d:0 "§HAny states§! that we own in §HSilverpine Forest§! will be transfered to the §H[LBC.GetNameWithFlag]§!.\n\n"
 blackrock.63.option.4:0 "Keep if for ourselves."

 blackrock.64.t:0 "The Fate of Gilneas"
 blackrock.64.d:0 "Gilneas is a coastal kingdom known for its rugged and diverse geography. Its northern regions are dominated by mountain ranges, while the central areas consist of rolling hills, dense forest and marshes as well as fertile farmland. The southern coast features steep cliffs and rocky shores, offering both natural beauty and strategic defense."
 blackrock.64.option.1:0 "Give it to the [SRC.GetName]"
 blackrock.64.option.1.d:0 "§HAny states§! that we own in §HGilneas§! will be transfered to the §H[SRC.GetNameWithFlag]§!.\n\n"
 blackrock.64.option.2:0 "Give it to the [TLC.GetName]"
 blackrock.64.option.2.d:0 "§HAny states§! that we own in §HGilneas§! will be transfered to the §H[TLC.GetNameWithFlag]§!.\n\n"
 blackrock.64.option.3:0 "Give it to the [LBC.GetName]"
 blackrock.64.option.3.d:0 "§HAny states§! that we own in §HGilneas§! will be transfered to the §H[LBC.GetNameWithFlag]§!.\n\n"
 blackrock.64.option.4:0 "Keep if for ourselves."

 blackrock.65.t:0 "The Fate of Kul'Tiras"
 blackrock.65.d:0 "Kul Tiras is an archipelago located in the Great Sea. It consists of several large islands, each characterized by rocky cliffs and lush forests. The central island, Tiragarde Sound, is known for its bustling port city and imposing mountains. The surrounding waters are dotted with smaller islands and treacherous reefs. Kul Tiras' geography offers a diverse and rugged landscape, providing both natural resources and strategic advantages for the island nation."
 blackrock.65.option.1:0 "Give it to the [SRC.GetName]"
 blackrock.65.option.1.d:0 "§HAny states§! that we own in §HKul'Tiras§! will be transfered to the §H[SRC.GetNameWithFlag]§!.\n\n"
 blackrock.65.option.2:0 "Give it to the [TLC.GetName]"
 blackrock.65.option.2.d:0 "§HAny states§! that we own in §HKul'Tiras§! will be transfered to the §H[TLC.GetNameWithFlag]§!.\n\n"
 blackrock.65.option.3:0 "Give it to the [LBC.GetName]"
 blackrock.65.option.3.d:0 "§HAny states§! that we own in §HKul'Tiras§! will be transfered to the §H[LBC.GetNameWithFlag]§!.\n\n"
 blackrock.65.option.4:0 "Keep if for ourselves."

 blackrock.66.t:0 "The Fate of Alterac"
 blackrock.66.d:0 "The Alterac Mountains dominate the landscape with their imposing presence. Steep peaks and rugged terrain form a formidable barrier, shielding the land beyond. Deep valleys and winding streams carve through the slopes, creating a scenic yet treacherous environment. Harsh and unforgiving, the climate alternates between biting cold and temperate calm."
 blackrock.66.option.1:0 "Give it to the [FWC.GetName]"
 blackrock.66.option.1.d:0 "§HAny states§! that we own in §HAlterac§! will be transfered to the §H[FWC.GetNameWithFlag]§!.\n\n"
 blackrock.66.option.2:0 "Give it to the [WSC.GetName]"
 blackrock.66.option.2.d:0 "§HAny states§! that we own in §HAlterac§! will be transfered to the §H[WSC.GetNameWithFlag]§!.\n\n"
 blackrock.66.option.3:0 "Give it to the [RWC.GetName]"
 blackrock.66.option.3.d:0 "§HAny states§! that we own in §HAlterac§! will be transfered to the §H[RWC.GetNameWithFlag]§!.\n\n"
 blackrock.66.option.4:0 "Keep if for ourselves."

 blackrock.67.t:0 "Our Triumph"
 blackrock.67.d.blackhand:0 "    With indomitable will and unyielding determination, the Horde has conquered vast territories in the Eastern Kingdoms, establishing its supremacy from the southern lands of Stormwind to the northern realm of Lordaeron. Our relentless campaign, fueled by the intoxicating and never-ending bloodlust of our orcish warriors, has led us to this moment of unparalleled triumph.\n\n    Guided by the mighty hand of Blackhand, our esteemed warchief, we have united the clans under a single banner, forging an unstoppable force. Through countless battles and hardships, we have proven our mettle, leaving a wake of defeated enemies in our path.\n\n    As the continent lies under our grasp, we stand on the precipice of a new era. The echoes of victory resound across the lands, yet beyond these shores lie uncharted realms, teeming with untapped potential and the promise of even greater conquests. The Horde's thirst for honor and glory knows no bounds, and as our gaze turns to the unexplored lands and the vastness of Azeroth itself, we must ask ourselves: will we rest in our contentment, or shall we seize the opportunity to expand our might across the entire world?\n\n    The future of the Horde beckons, and the choice before us will shape the destiny of our people and echo throughout the annals of history..."
 blackrock.67.d.doomhammer:0 "    After an arduous journey since our exodus from our withering homeworld of Draenor through the Dark Portal, the Horde has emerged triumphant in its conquest of Azeroth. From the sprawling city of Stormwind to the ancestral halls of Lordaeron, our dominion now stretches across these lands.\n\n    We have weathered countless trials, our resolve unwavering in the face of adversity. Our path has been paved with blood, sweat, and sacrifice. The echoes of battle still resound in our ears, but now, we stand as the victors, claiming our place on Azeroth.\n\n   Under the leadership of our indomitable Warchief, Orgrim Doomhammer, the clans have forged a bond stronger than iron. The Horde, now a force to be reckoned with, can finally settle in these newly conquered territories, building a future for our people.\n\n    Yet, as we revel in our well-earned victory, a subtle whisper brushes against our spirits, reminding us of the vast world that lies beyond the waves. Other continents, unexplored realms, and distant lands beckon us with their mysteries and untapped potential! The triumph we now celebrate is but a chapter in the ongoing saga of the Horde's destiny.\n\n    The Horde's journey is far from over. Our victory is but the beginning, and the Horde's destiny knows no bounds..."
 blackrock.67.option.1:0 "Aka'Magosh!"
 blackrock.67.option.1.d:0 "§L'A blessing on you and yours!'§!\n§GThank you for playing the Blackrock Clan!§!\n\n"

