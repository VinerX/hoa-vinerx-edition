 BRC_ask_for_westfall_decision:0 "Demand control over Westfall"
 BRC_ask_for_westfall_decision_desc:0 "Our allies from the [BHC.GetName] have seized the human lands known as Westfall in the wake of Stormwind's downfall. This very agrarian region that has been the main source of food for the human kingdom could be of great use for us to feed the ever-growing Horde."

 BRC_call_the_draenor_clans_to_war:0 "Call the Draenor Clans to War"
 BRC_call_the_draenor_clans_to_war_desc:0 "To bolster the invasion of this world, we shall call upon our brethren who remained on Draenor beyond the Dark Portal. Let us bring the fury of the Horde to this new world and claim it in the name of our people."

 BRC_managing_our_territory_decisions:0 "§HManaging our Territory§!"
 BRC_managing_our_territory_decisions_desc:0 "With our territory now covering vast sways of lands from Stormwind to the south to the human kingdoms of the north, it has become vital for The Horde to focus less on conquest and instead take care of how it manage its territorial possessions."
 BRC_deal_with_overextension_decision:0 "Deal with Overextension"
 BRC_deal_with_overextension_decision_desc:0 "We need to deal with the overstretching of our territory by adapting our administration."

 BRC_fate_of_arathi_decision:0 "Fate of the Arathi Highlands"
 BRC_fate_of_arathi_decision_desc:0 "The Arathi Highlands are rugged lands of rolling hills and expansive plains. Within its borders lies the Circle of Bindings, nexuses of elemental magic channeling the primal forces of the elementals of Azeroth. All of this reminiscent of the serene landscape of Nagrand back on Draenor."

 BRC_fate_of_alterac_decision:0 "Fate of Alterac"
 BRC_fate_of_alterac_decision_desc:0 "The Alterac Mountains dominate the landscape with their imposing presence. Steep peaks and rugged terrain form a formidable barrier, shielding the land beyond. Deep valleys and winding streams carve through the slopes, creating a scenic yet treacherous environment. Harsh and unforgiving, the climate alternates between biting cold and temperate calm."

 BRC_fate_of_hillsbrad_decision:0 "Fate of the Hillsbrad Foothills"
 BRC_fate_of_hillsbrad_decision_desc:0 "The Hillsbrad Foothills, south of the Alterac Mountains, is made up of rolling plans and hills covered with forests, with rivers flowing from the mountains and ending in the Baradin Bay. Its biggest river, the Thondoril, begins its course way up north, in Lordaeron."

 BRC_fate_of_dalaran_decision:0 "Fate of Dalaran"
 BRC_fate_of_dalaran_decision_desc:0 "Dalaran, the once mighty city of mages, now lies conquered under our indomitable Horde. Its grand spires and arcane wonders stand as a testament to the feeble sorceries of humans."

 BRC_fate_of_hearthglen_decision:0 "Fate of the Principality of Hearthglen"
 BRC_fate_of_hearthglen_decision_desc:0 "The Principality of Hearthglen, lodged between the Tirisfal Glades to the west, the Alterac Mountains to the south and Eastweald to the east, is a lush region of forest and farmlands and is the breadbasket of Lordaeron."

 BRC_fate_of_eastweald_decision:0 "Fate of Eastweald"
 BRC_fate_of_eastweald_decision_desc:0 "Just like the Principality of Hearthglen to the west, Eastweald is rich in forest and farmlands, that used to provide the rest of kingdom with precious wood and food. The shining jewel of Eastweald is the grand city of Stratholme, the biggest human settlement in Lordaeron. As also a frontier region of Lordaeron, its northern reaches are still home to elves and trolls."

 BRC_fate_of_northern_lordaeron_decision:0 "Fate of Northern Lordaeron"
 BRC_fate_of_northern_lordaeron_decision_desc:0 "Northern Lordaeron is one of the least populated areas of the entire kingdom of the same name. It is mainly composed of mountains, highlands and valleys covered in pine forest overlooking the sea to the North from impressive cliffs. The only notable location of the region is the high elven port of Dawnstrider Harbor."

 BRC_fate_of_silverpine_decision:0 "Fate of Silverpine Forest"
 BRC_fate_of_silverpine_decision_desc:0 "South of the capital city of Lordaeron lies The Silverpine Forest. This dense woodland, characterized by its towering trees and thick undergrowth is home to many wild creatures and is one of the least developped region of Lordaeron, hosting no big cities. The landscape is a mix of rolling hills and uneven terrain, with occasional clearings where sunlight filters through the canopy in which the humans have often cleared the land for farming."

 BRC_fate_of_gilneas_decision:0 "Fate of Gilneas"
 BRC_fate_of_gilneas_decision_desc:0 "Gilneas is a coastal kingdom known for its rugged and diverse geography. Its northern regions are dominated by mountain ranges, while the central areas consist of rolling hills, dense forest and marshes as well as fertile farmland. The southern coast features steep cliffs and rocky shores, offering both natural beauty and strategic defense."

 BRC_fate_of_kul_tiras_decision:0 "Fate of Kul'Tiras"
 BRC_fate_of_kul_tiras_decision_desc:0 "Kul'Tiras is an archipelago located in the Great Sea. It consists of several large islands, each characterized by rocky cliffs and lush forests. The central island, Tiragarde Sound, is known for its bustling port city and imposing mountains. The surrounding waters are dotted with smaller islands and treacherous reefs. Kul Tiras' geography offers a diverse and rugged landscape, providing both natural resources and strategic advantages for the island nation."

 BRC_human_resistance_decisions:0 "§RHuman Resistance"
 BRC_human_resistance_decisions_desc:0 "In the wake of our triumph, a significant amount of humans driven by an unwavering spirit have coalesced into a §Rresistance movement§! to oppose our rule. Their clandestine operations disrupt the stabilty of our new territories, necessitating vigilance as we secure our rightful place as the masters of these lands. We must act quickly to prevent the situation from worsening further."
 BRC_human_resistance_decisions_map_area_tt:0 "§HStates where §!§thuman resistance§!§H is present:§!"

 BRC_special_training_for_garrisons_decision:0 "Special Training for Garrisons"
 BRC_special_training_for_garrisons_decision_desc:0 "We will ask veterans from our previous wars with the humans to teach our garrisons how to deal with them effectively."

 BRC_deal_with_resistance_decision:0 "Deal with Human Resistance in [FROM.GetName]"
 BRC_deal_with_resistance_decision_desc:0 "[FROM.GetName] is home to resistance cells that must be dealt with."

 BRC_build_internment_camp_decision:0 "Build Internment Camp in [FROM.GetName]"
 BRC_build_internment_camp_decision_desc:0 "In order to quell the resistance in the area, we will build an internment camp in which our opposants will be imprisoned and work for us."

 BRC_increase_garrison_forces_decision:0 "Increase Garrison Forces in [FROM.GetName]"
 BRC_increase_garrison_forces_decision_desc:0 "The resistance in [FROM.GetName] is giving a headache to our grunts in the area. Sending additionnal soldiers to combat the humans should deal with the resistance cells."

