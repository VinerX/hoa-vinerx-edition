 BRC_burning_blade_loyalists:0 "Burning Blade Loyalists"
 BRC_burning_blade_loyalists_desc:0 "The Burning Blade has long been a chaotic mess with no clear leadership, a small band of blademasters have grown tired of their constant infighting."

 BRC_warlords_idea:0 "Blackrock Warlords"
