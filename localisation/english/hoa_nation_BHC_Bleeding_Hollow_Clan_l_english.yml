BHC_the_second_ritual:0 "The Second Ritual"
BHC_the_second_ritual_desc:0 "Kilrogg has had an uncertainty about him for these past weeks, with the Blackrock setting up Interment camps to contain the humans in the north and the Dwarves well under out control his vision of a future where he is slain by the 'Alliance' is now seeming like a fever dream, he has departed back to our homeland, for what reason we know not."

