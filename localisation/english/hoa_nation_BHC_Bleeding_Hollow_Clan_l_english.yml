BHC_our_own_path:0 "Our Own Path"
BHC_our_own_path_desc:0 "The Troll War has taught us something, the Horde will do anything to complete their goal with or without our compliance."
BHC_stay_true_to_our_deal:0 "Stay True to Our Deal"
BHC_stay_true_to_our_deal_desc:0 "We will stay true to our oaths to the Warchief, it would be foolish to turn against the Horde at this time."

BHC_defy_the_warchief:0 "Defy the Warchief"
BHC_defy_the_warchief_desc:0 "The Warchief has demanded that we cease our attack on the Trolls to the south, and instead deal with the Humans, but this is our home now, Gul'dan has robbed us of our honor, but he will not rob us of our new home."
