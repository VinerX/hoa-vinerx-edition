BHC_Tanaan_Survivalists:0 "Tanaan Survivalists" 
BHC_Tanaan_Survivalists_desc:0 "The harsh jungles of Tanaan have proven difficult to manage but beneficial to the clan. Proving the clans strength and making them stronger!"

BHC_jungle_troll_war_1:0 "War in the Jungle"
BHC_jungle_troll_war_1_desc:0 "The land to the south of the Human Kingdom reminds our chieften of his home in Tanaan and has sought to claim it for the Bleeding Hollow."
BHC_jungle_troll_war_2:0 "Burn the Jungles"
BHC_jungle_troll_war_2_desc:0 "The Trolls here are becoming a major hinderance, we may outnumber them but they have lived in these jungles their whole lives. We will burn the Jungles to the ground and remove every Troll who resists us if we must."
BHC_jungle_troll_war_3:0 "Burn the Jungles"
BHC_jungle_troll_war_3_desc:0 "The Trolls here are becoming a major hinderance, we may outnumber them but they have lived in these jungles their whole lives. We will burn the Jungles to the ground and remove every Troll who resists us if we must."
GUR_jungle_troll_war:0 "Jungle War"
GUR_jungle_troll_war_desc:0 ""
BHC_splinter_fist_clan:0 "Splinter Fist Clan"
BHC_splinter_fist_clan_desc:0 "The Splinter Fist Clan is a clan of Ogres residing inside the Bleeding Hollow Clan."
BHC_splinter_fist_clan_2:0 "Splinter Fist Clan"
BHC_splinter_fist_clan_2_desc:0 "The Splinter Fist Clan is a clan of Ogres residing inside the Bleeding Hollow Clan."
