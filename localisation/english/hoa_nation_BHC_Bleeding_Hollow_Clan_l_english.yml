BHC_east_duskwood_desc:0 "We need to decide what to do with the eastern region of the Human lands."

BHC_our_own_hands:0 "Our On Hands"
BHC_our_own_hands_desc:0 "With many of our forces heading North we need to way to manage the Human Population."

BHC_strike_fear:0 "Strike Fear"
BHC_strike_fear_desc:0 "Clansmen have taken to putting Skulls on window ledges in the dead of night to keep the humans in line through Terror."
BHC_run_them_down:0 "Run them Down"
BHC_run_them_down_desc:0 "We have found a number of individuals attempting to flee to Westfall in an Attempt to escape our hold."
BHC_suppress_darkshire:0 "Contain Darkshire"
BHC_suppress_darkshire_desc:0 "Darkshire remains our main foothold in this land, with the Blacktooth trying to gain control of the Swamps we need to ensure an area we can retreat to needed."
BHC_controlled_pillaging:0 "Controlled Pillaging"
BHC_controlled_pillaging_desc:0 "Some of the Other Clans have been causing issues in our lands, taking crates of goods that belong to us, at least the Blackrock Clan has accepted some responsability for this pillaging."
BHC_midnight_raids:0 "Midnight Raids"
BHC_midnight_raids_desc:0 "We Cannot afford a repeat of Stormwind again, with the likelyhood of the Warchief throwing us head first into another protracted siege we need must change our tactics."

BHC_angry_bastards:0 "Angry Bastards"
BHC_angry_bastards_desc:0 "The Blackrock clan have recently subjected a group of very aggressive beastfolk, unlike the Saberons they seem to be able to be reasoned with."
BHC_rituals_of_dominance:0 "Rituals of Dominance"
BHC_rituals_of_dominance:0 "The Gnoll Leader is tenacious bastard, we have managed to track him down and control him with the help of some Twilight Hammer members."
BHC_arming_the_pack:0 "Arming the Pack"
BHC_arming_the_pack_desc:0 "Though they appear smaller then humans their lust for battle far exceeds that of your average human."
BHC_a_disciplined_mind:0 "A Disciplined Mind"
BHC_a_disciplined_mind_desc:0 "Hogger, the leader of the Gnolls seems to be capable of speech, more concernly it would seem that he managed to breakthrough the dominations though sheer force of will."
BHC_a_willing_ally:0 "A Willing Ally"
BHC_a_willing_ally_desc:0 "The Gnolls have expanded their territory beyond what was orginally permitted, however it would seem that they are not attacking other members of the horde, they have instead taken over a chicken farm."
BHC_gorged_and_statisfied:0 "Gorged & Satisfied"
BHC_gorged_and_statisfied_desc:0 "One of our clansmen has noticed the gnolls enjoyment of eggs, and have managed to get their hands on a Rylak from the Dragonmaw. Hogger seems to have taken this egg as some form of alliance, as his enjoyment seems to have put him in a daze for a couple of days."

