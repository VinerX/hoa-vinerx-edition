BHC_jungle_hunters_tooltip:0 "Two groups of Veteran Jungle Hunters will arrive from Draenor to assist us."

BHC_dire_orc_forces_tt:0 "§YGurtogg Bloodboil§! will join us and bring his forces through the Dark Portal."

