BHC_deadwind_clan_desc:0 "The Deadwind Clan is a clan of Ogres residing inside the Bleeding Hollow Clan."
BHC_deadwind_clan_2:0 "Deadwind Clan"
BHC_deadwind_clan_2_desc:0 "The Deadwind Clan is a clan of Ogres residing inside the Bleeding Hollow Clan."
BHC_war_axes_focus:0 "War Axes"
BHC_war_axes_focus_desc:0 "We forge our axes out of whatever materials we can, be it from a tree, or a Bog beast that wanders into our camps."
BHC_blood_soaked_blades:0 "Blood Soaked Blades"
BHC_blood_soaked_blades_desc:0 "The humans are weak in body but strong in will, they know that it will take more then a single blow to kill our warriors so they aim to maim us. We will soak our blades in tainted blood so that any footman who escapes our advance will feel the burning of our hatred with every breath."
BHC_venoms_of_tanaan:0 "Venoms of Tanaan"
BHC_venoms_of_tanaan_desc:0 "These humans seek to show us the strength of their world so we shall respond in kind. The foulest of venoms within the Tanaan jungles of Draenor shall coat our blades, withering this alien world's strength through every weapon plunged into the flesh of our enemies."
BHC_formalized_ritual_grounds:0 "Formalized Ritual Grounds"
BHC_formalized_ritual_grounds_desc:0 "We have garnered strength amongst various footholds in this new world and have witnessed several fonts of power amongst our now conquered lands. We shall forge new ritual grounds driving the strength of this realm and the blood of our homeland to forge a new breed of savage strength far surpassing that of our campaign in the Tanaan Jungles."
BHC_siege_behemoths:0 "Siege Behemoths"
BHC_siege_behemoths_desc:0 "The Horde has thrown us against the walls of great cities again and again, our clan never trained to siege towns, let alone the capitals of humans and dwarves, a few of our clansmen have begun to devise to way to deal with this short coming."
BHC_elemental_axes:0 "Elemental Axes"
BHC_elemental_axes_desc:0 ""
BHC_hollow_brutes:0 "Hollow Survivors"
BHC_hollow_brutes_desc:0 "The Bleeding Hollow found Power in the deep caverns in the Jungles of Tanaan, only the strongest or the most skilled survived its trials."
BHC_stronghold_focus:0 "Ogre Strongholds"
BHC_stronghold_focus_desc:0 "The Ogre clans are in charge of building our strongholds, Their construction methods are questionable the Ogre capital of Highmaul did stand the test of time."
BHC_hold_the_line:0 "Keep Them Back!"
BHC_hold_the_line_desc:0 "We need to keep the Trolls out of our camps, they are causing too much devestation with their ambushes and Magics."
BHC_wisdom_of_our_foes:0 "Knowledge of our Foes"
BHC_wisdom_of_our_foes_desc:0 "Since coming to this world we have fought a number of races with their own cultures and technologies."

BHC_pillaged_kharanos:0 "Pillaged Kharanos"
BHC_pillaged_kharanos_desc:0 "Pillaged Kharanos"
BHC_dwarven_labour:0 "Dwarven Labour"
BHC_dwarven_labour_desc:0 "The Dwarves are fine labourers and are much better at extracting resources from this world then their smaller counterparts, however they are not so easy to contain."
BHC_gnome_labour_idea:0 "Gnome Labour"
BHC_gnome_labour_idea_desc:0 "The Gnomes have weak and frail bodies compared to the Dwarves, but they are very smart and adaptive to their tasks, now if only they didnt keep messing with the Forges."

