BHC_elemental_communion:0 "Elemental Communion"
BHC_elemental_communion_desc:0 "Our Shamans have sought guidance from the Spirits, and have been heard, they did not wish for the power to destroy our foes, but the strength to defend what is left of our home."

BHC_a_feast_to_die_for:0 "A Feast to Die For"
BHC_a_feast_to_die_for_desc:0 "The Bonechewers cannibalistic tendencies are a weakness we can exploit, the Jungle has a Number of Poisons Herbs that can be used to taint our 'Meat'"

BHC_a_flash_in_the_night:0 "Flash in the Night"
