#events
###############################
bleeding_hollow.1.t:0 "Blackhand's Orders"
bleeding_hollow.1.d:0 "Warchief Blackhand has charged us with clearing out and domesticating these swamps, rumors have been reported by some members of our clan that they have seen the swamps come to life and shift shapes. These cowards will be the first sent to the work camps to chop down the swamp."
bleeding_hollow.1.option.1:0 "For the Warchief!"
bleeding_hollow.2.t:0 "Victory over the Bog Beasts"
bleeding_hollow.2.d:0 "Despite the rumors of the swamp being alive, we have triumphed over these so-called bog beasts and claimed the swamp for the clan. We will begin construction of infrastructure and lodgings for the coming war."
bleeding_hollow.2.option.1:0 "Glory to the Bleeding Hollow!"

bleeding_hollow.3.t:0 "Request from the [SRC.GetName]"
bleeding_hollow.3.d:0 "[SRC.GetLeader] from the [SRC.GetName] has asked us to hand over the human islands to the west of Stormwind so that they may better protect the Seas from possible Invasions."
bleeding_hollow.3.option.1:0 "Gul'dan can deal with the islands"
bleeding_hollow.3.option.2:0 "We must decline"

bleeding_hollow.4.t:0 "[BRC.GetName] demand Westfall"
bleeding_hollow.4.d:0 "We have received a demand from the [BRC.GetName] to hand over the lands of Westfall, which we recently captured from the puny humans after their defeat. As fellow members of the Horde, we understand the importance of unity in the face of our enemies. However, this request raises important questions about the distribution of resources and power among ourselves. We must carefully consider our response and weigh the potential consequences of our decision."
bleeding_hollow.4.option.1:0 "The Warchief shall have these lands."
bleeding_hollow.4.option.2:0 "We cannot let go of these lands."
bleeding_hollow.5.t:0 "An Explosion in the Pass"
bleeding_hollow.5.d:0 "Scouts have reported a massive explosion in the pass west of the swamps."
bleeding_hollow.5.option.1:0 "Send the Ogres, we have a war to fight."

bleeding_hollow.7.t:0 "Deadwind Pass Occupation"
bleeding_hollow.7.d:0 "We need to decide what to do with the Passage between Duskwood and the Swamps, the North has very few resources we can use, and the Ogres have staked their claim on the Tower and the South."
bleeding_hollow.7.option.1:0 "Give the pass to the Ogres."
bleeding_hollow.7.option.2:0 "Leave the Ogres to their Mounds."

bleeding_hollow.8.t:0 "West Duskwood Occupation"
bleeding_hollow.8.d:0 "The Splinter Fist Ogres has shown an interest in the South western region of Duskwood, West Duskwood itself has fewer forges and civilian workshops, giving the Splinter Fist a place to build a Mound may be beneficial."
bleeding_hollow.8.option.1:0 "Give them the South West Mine."
bleeding_hollow.8.option.2:0 "They can have the West."
bleeding_hollow.8.option.3:0 "The Land is ours, not the Ogres."

bleeding_hollow.9.t:0 "East Duskwood Occupation"
bleeding_hollow.9.d:0 "As the War Rages in the North we need to considering what we are to do with the Eastern Half of Duskwood."
bleeding_hollow.9.option.1:0 "Give the land to a Close Ally."
bleeding_hollow.9.option.2:0 "Our Clan died for that land."

bleeding_hollow.10.t:0 "Deadwind Pass"
bleeding_hollow.10.d:0 "There a very few humans still alive in the Pass after the explosion, not many of them to be able to cause issue with us."
bleeding_hollow.10.option.1:0 "Shoo them away from our Mound."

bleeding_hollow.11.t:0 "Contain the Dwarves"
bleeding_hollow.11.d:0 "The Warchief has ordered us to hold the lands which the dwarves refer to as the Loch, He wants us to use the Dwarves to expand Oil production in the area as well as expand our encampments as the other clans push north into the Swamp."
bleeding_hollow.11.option.1:0 "As the Warchief Commands."

bleeding_hollow.12.t:0 "The Bleeding Hollow Request"
bleeding_hollow.12.d:0 "The Bleeding Hollow Clan has requested the northen pass in our land."
bleeding_hollow.12.option.1:0 "We are in no position to deny them."

bleeding_hollow.13.t:0 "The Dwarves Held"
bleeding_hollow.13.d:0 "The Dwarves have held on to their city under the mountain, we have been unable to breach their walls and the Warchief has pulled our leash."
bleeding_hollow.13.option.1:0 "Deal with those that remain."

bleeding_hollow.14.t:0 "The Hulking Metal Gates"
bleeding_hollow.14.d:0 "The Gnomes have shut themselves into their tunnels, and we have been unable to overcome their defense, they have weathered any attack we send at them and we are in no position to continue to beat against their Walls."
bleeding_hollow.14.option.1:0 "Let us make use of their Machines."

bleeding_hollow.16.t:0 "The Horrors Below"
bleeding_hollow.16.d:0 "The rumors were not unfounded superstitions. Enormous, skulking beasts, fashioned from the very vegetation of the land, have risen from the depths of the swamp, intent on reclaiming the lands we have taken from them."
bleeding_hollow.16.option.1:0 "Lok'tar brothers!"

bleeding_hollow.17.t:0 "Seek Knowledge from the Clans"
bleeding_hollow.17.d:0 "We have relied on our witts and strength for decades now and they have served us well, but we are no longer fighting Primals, we are fighting Humans, who use whatever tactics they can to try to survive, it may be time to approach one of the other clans of the horde to learn their tactics."
bleeding_hollow.17.option.1:0 "The Twilight Clan"
bleeding_hollow.17.option.2:0 "The Dragonmaw Clan"
bleeding_hollow.17.option.3:0 "The Blackrock Clan"
bleeding_hollow.17.option.4:0 "The Shadow Council"

bleeding_hollow.18.t:0 "Greenskin Demands"
bleeding_hollow.18.d:0 "The Orcs have Demanded we submit to them, they have already obliterated the Bloodscalp, and have enslaved the Gurubashi and Skullsplinter tribes, we must make our choice wisely."
bleeding_hollow.18.option.1:0 "We cannot win against them."
bleeding_hollow.18.option.2:0 "We will flee to the West."
bleeding_hollow.18.option.3:0 "Taz'dingo!"

bleeding_hollow.20.t:0 "Ogres Flee"
bleeding_hollow.20.d:0 "Our Failure in the south has been blamed on the Ogres, specifically the Mosh'Ogg clan, while the Deadwind while the other Ogre clans where helping to push the humans out of their lands, the Mosh'Ogg clan were dragging their feet."
bleeding_hollow.20.option.1:0 "Dispose of the Clan"

bleeding_hollow.21.t:0 "Visionless Chieftain"
bleeding_hollow.21.d:0 "Kilrogg has been too distracted by the Trolls to the south to fulfil out orders given to us by the warchief. Chogall has decided to learn from this failure and has designed a spell to better assist us in the future."
bleeding_hollow.21.option.1:0 "The "Eye" of Kilrogg"

bleeding_hollow.22.t:0 "The Apprentices Return"
bleeding_hollow.22.d:0 "Chogall was sent with his followers to assault the human fortress along with the Bleeding Hollow, but it would seem they have failed in their task, though is would seem that Gul'dans apprentice has not returned empty handed."
bleeding_hollow.22.option.1:0 "The "Eye" of Kilrogg"

bleeding_hollow.23.t:0 "The Pack Leader"
bleeding_hollow.23.d:0 "Having managed to track down and dominate the Beastfolk leader we have gone about dmoninating other members of the packs, they do seem to all be drawn to the small camp in Elwynn forces."
bleeding_hollow.23.option.1:0 "Keep and Eye on them"

bleeding_hollow.28.t:0 "Our own ability"
bleeding_hollow.28.d:0 "Never have we needed to maintain a workforce before, Peons would normally perish soon after birth in Tanaan, but here the Warchief demands warriors for the War, and so we must learn how to best motivate the humans."
bleeding_hollow.28.option.1:0 "They will think us Mad"

bleeding_hollow.33.t:0 "The Warchiefs Demands"
bleeding_hollow.33.d:0 "The Warchief has demanded we cease our attacks on the Trolls of the South."
bleeding_hollow.33.option.1:0 "This is Our War!"
bleeding_hollow.33.option.2:0 "If it keeps the Peace"

bleeding_hollow.34.t:0 "Echoes of Old"
bleeding_hollow.34.d:0 "Chieftain, we have heard news of some of our clansmen being able to call the assistance of the elements once more, a child had wandered too far into a river and was being washed away by the current, only to be saved from drowning by the waters themselves."
bleeding_hollow.34.option.1:0 "Spirits, Heed My Call"

