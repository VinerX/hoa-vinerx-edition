BHC_rolands_doom_desc:0 ""
BHC_desecrate_the_cemetery:0 "Desecration"
BHC_desecrate_the_cemetery_desc:0 "Many of our clan were seared by this so called 'Light' Magic used by the Human Priests, remove the place of worship from our lands and build a shrine to the Ancestors."
