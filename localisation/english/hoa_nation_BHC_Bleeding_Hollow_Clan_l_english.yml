BHC_shaman_landslides:0 "Incite Landslides"
BHC_shaman_landslides_desc:0 "The Dwarves have been sending gryphons and flying metal contraptions over the mountains to attack us, as much as our clan shamans and warlocks hate each other they have combined their forces to cause large landslides to hopefully deal with the issue."
BHC_fresh_supply_lines:0 "Fresh Supplies"
BHC_fresh_supply_lines_desc:0 ""
BHC_warchiefs_command:0 "Contain the Dwarves"
BHC_warchiefs_command_desc:0 ""

BHC_second_jungle_war:0 "The Second Jungle War"
BHC_second_jungle_war_desc:0 "While our first conflict amongst the jungles of stranglethorn proved a step too far amongst our ongoing war with the human kingdom, the Bleeding Hollow are not so easily cowed. We return with a wrath renewed and a strength far surpassing that of our initial invasion force. The time has come to claim our prize upon this world."

