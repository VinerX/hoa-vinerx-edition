BHC_raven_hill_dead_idea_desc:0 "Though many of our clan look down upon using the humans dead to fill our ranks, but they know we are spread thin as is with the war in the north."
BHC_new_home_idea:0 "A New Land"
BHC_new_home_idea_desc:0 "We have fought a long battle against the humans, now the Warchief has sent us North, while our men are fighting the new threat we shall bring though more of our people to settle the Greenfields of Duskwood."

