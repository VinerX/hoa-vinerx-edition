BHC_warchiefs_orders:0 "Warchief's Orders"
BHC_warchiefs_orders_desc:0 "By the decree of Warchief Blackhand, we embarked on a northward journey, tasked with carving out a habitable region amidst the swamplands. This endeavor bears immense significance as it will provide the essential resources to fuel the relentless might of the Horde warmachine."

BHC_clear_out_the_swamp:0 "Clear out the Swamp"
BHC_clear_out_the_swamp_desc:0 "Following Blackhand's command, the peons have been tirelessly ordered to work overtime, while Taskmasters diligently keep an even closer watch on them to ensure the swift clearance of the swamp."

BHC_forward_base_camp:0 "Forward Base Camp"
BHC_forward_base_camp_desc:0 "We need to create a strong base camp from which we can project our power within the swamp."

BHC_the_horrors_below:0 "The Horrors Below"
BHC_the_horrors_below_desc:0 "The rumors were not unfounded superstitions. Enormous, skulking beasts, fashioned from the very vegetation of the land, have risen from the depths of the swamp, intent on reclaiming the lands we have taken from them."

BHC_kilroggs_vision:0 "Kilrogs Vision"
BHC_kilroggs_vision_desc:0 "Our Chieftain Kilrogg Deadeye has led our clan for more than a decade prior to our arrival in this world. It is with his insight gained by ritualistically gouging out his left eye that he has led the Bleeding Hollow Clan from the brink of extinction to the forefront of this invasion. He has seen his own demise and has conquered fear itself."
BHC_the_jungle_fortress:0 "Turn Splinterspear Into A Fortress"
BHC_the_jungle_fortress_desc:0 "These Feeble Beasts shall not rob us of our Foothold! Rally the peons and fortify our Outpost to drive these things from our new lands."
BHC_prepare_for_battle:0 "Prepare for Battle"
BHC_prepare_for_battle_desc:0 "Our Invasion in these lands shall bring with it a battle unlike any this world has seen before, and we shall be prepared for what is to come."
BHC_swamp_mines:0 "Expand the Swamps Mines"
BHC_swamp_mines_desc:0 "With Beasts and Swampland yet to be conquered we are in need of more material. Strike the earth with renewed fury and we shall turn these lands to our benefit."
BHC_pig_farms:0 "Construct Hunting Camps"
BHC_pig_farms_desc:0 "The Wild game of this region while unfamiliar may sustain us all the same. We shall scour these new lands and rob these shambling mounds of their war beasts by encouraging our finest hunters to establish camps throughout our lands."
BHC_harvest_the_jungle:0 "Harvest Timber From The Swamps"
BHC_harvest_the_jungle_desc:0 "Cleave through the foliage of this land and gorge our lumber mills on the fruits of our victory."
BHC_develope_the_jungle:0 "Construct Roads"
BHC_develope_the_jungle_desc:0 "Carving roadways throughout our settlements shall strengthen our supply lines against our shambling foes. With enough support our peons can carve out these new roadways in mere days."
BHC_debark_the_spring:0 "Debark the Spring"
BHC_debark_the_spring_desc:0 "We Shall rend the living flesh of these lands and bleed them of their greater powers! In doing so we will rob these living swamplands of their strength."
BHC_watch_towers:0 "Watch Tower Improvements"
BHC_watch_towers_desc:0 "With greater watchtowers alongside our newly carved roadways the effectiveness of our foe's ambush tactics shall be greatly diminished."
BHC_bleeding_hollow_strongholds:0 "Bleeding Hollow Strongholds"
BHC_bleeding_hollow_strongholds_desc:0 "Our Clan hosts a large number of Ogres who find orc architecture limiting to them due to their size, so we have tasked them to building our holds."
BHC_hidden_no_longer:0 "Hidden No Longer"
BHC_hidden_no_longer_desc:0 "The Creatures of the Swamp have been able to dwell in our lands for too long, they continue to attack our warriors and kill the peons, even the Ogres are afraid to move supplies at night."
BHC_living_bark:0 "Living Bark Bonfires"
BHC_living_bark_desc:0 "Just like the Botani of our home, the swamp beast have been felled by might, soon we will leave this damp hell and venture further into this new world, but tonight we celebrate!"
BHC_research_effort:0 "Wisdom of our Foes"
BHC_research_effort_desc:0 "Our conflict with the Swamp Things and their wild beasts has taught us much of the ways of war and unnatural powers amongst this new world. We shall pursue further insight against our new foes by whatever means necessary."
BHC_weapon_improvements:0 "Improve Weapons"
BHC_weapon_improvements_desc:0 "A new war requires finer weaponry. Now the question is, where shall our focus lie?"
BHC_war_axes:0 "War Axes"
BHC_war_axes_desc:0 "With the excess lumber of these jungles harnessed for our own use we shall assemble an abundance of War Axes with which to cleave apart any who would oppose us."
BHC_improved_catapults:0 "Improved Catapults"
BHC_improved_catapults_desc:0 "If we are to break apart the defenses of these lands, finer siegeworks are required for this new alien world."
BHC_improved_spears:0 "Improved Spears"
BHC_improved_spears_desc:0 "A spear is as deadly a weapon in the hands of a bleeding hollow warrior as any great blade or axe. It is through quick savage strikes and versatility of use that it has proven instrumental amongst the jungles of Draenor. Now we must further improve our weaponry to pierce the hides or shells of any who we shall face in these lands."
BHC_jungle_hunters:0 "Jungle Hunters"
BHC_jungle_hunters_desc:0 "Veteran Hunters from our homeland in the Tanaan jungles have joined our warband in preparation for the wars to come. Their prowess amongst the most hostile of conditions shall prove integral to our success in achieving the Warchief's orders and our own ambitions…"
BHC_expand_west:0 "Expand West"
BHC_expand_west_desc:0 "Do the Humans truly believe this meager pass to be enough to stop us? Our scouts have found it to be devoid of any real defense, if we are to achieve our warchief's orders we should capitalize on this weakness while it yet stands."
BHC_the_duskwood_campaign:0 "The Sunnyglade Campaign"
BHC_the_duskwood_campaign_desc:0 "The people of this 'Sunnyglade' are fat and complacent with their excess, believing themselves safe and secure. We shall deprive them of this notion and lead this invasion ourselves starting with the desolation of this weakness from these lands."
BHC_forward_outpost:0 "Forward Outposts"
BHC_forward_outpost_desc:0 "We have cleaved through the enemy lines and secured a foothold in and around the human settlement of 'Sunnyglade'. To ensure our continued momentum into the heartlands of our enemy we must establish further outposts to discourage any airborne actions in our newly claimed lands."
BHC_fresh_hides:0 "Fresh Hides"
BHC_fresh_hides_desc:0 "The Butchery of these frail humans alongside their beasts of labor and war have provided an abundance of hides in the wake of their failures. We shall harness these supplies to account for the demands of this new world's unruly Elements."
BHC_sacred_rituals:0 "Sacred Rituals"
BHC_sacred_rituals_desc:0 "As we begin to conquer this new world we still hold to the traditions of our clan, remaining deeply connected with our homeland of the Tanaan Jungles and our ritual practices."
BHC_bleeding_hollow_brutes:0 "Hollow Survivors"
BHC_bleeding_hollow_brutes_desc:0 "Many of those who survived Kilrogg's brutal campaign of conquest over the Tanaan Jungles grew to such strength and cunning that no other clan amongst Draenor could match. Now, we call upon their number to join our growing warhost for the war that is to come."
BHC_dire_orc_rituals:0 "Blood Rituals"
BHC_dire_orc_rituals_desc:0 "Our ritual practices of sacrifice and bloodshed have led to the empowerment of many of our most savage warriors. These Dire Brutes have broken countless foes amongst the jungles and fields of Draenor. We would be wise to encourage these rituals to bring about a greater number of these champions of our cause."
BHC_bleeding_hollow_tactics:0 "Bleeding Hollow Tactics"
BHC_bleeding_hollow_tactics_desc:0 "We have carved ourselves an impressive legacy amongst our homeland of Draenor with our brutal campaigns held in the Tanaan Jungles. We adapted to fight off the Botani, the Arakkoa, the Genesaur, and even the Ogres all at once. We shall again adapt to this new world and its many peoples soon to be conquered."
BHC_the_jungles_of_stranglethorn:0 "The Jungles of Stranglethorn"
BHC_the_jungles_of_stranglethorn_desc:0 "In the southern pass of these newly conquered lands our forward scouts have come with news of a massive region of jungles akin to those of our homeland in Draenor. However, It is occupied by a disorganized race of beings called 'Trolls'. The Human lands have fallen before us with ease so we have earned a more personal ambition. We shall carve ourselves a new homeland amongst this 'Stranglethorn'."

BHC_the_path_forward:0 "The Path Forward"
BHC_the_path_forward_desc:0 ""

BHC_stand_with_the_warchief:0 "Stand With The Warchief"
BHC_stand_with_the_warchief_desc:0 "We seek out glory alongside the warchief, our strength shall be derived from our fellow clans who's banners fly alongside ours in the march to conquer this new world."
BHC_frostwolf_riders:0 "Frostwolf Riders"
BHC_frostwolf_riders_desc:0 "No finer bond between a warrior and his companion can be found amongst Draenor than among the frostwolf clan. They are bound by an indelible honor and strength that forges them into not only the finest riders amongst their frostbound homes in the frostfire ridge but the most dangerous raiding force in all of Draenor. Service alongside them shall prove integral in forging our own mounted forces and warbeasts."
BHC_black_tooth_grin_scouts:0 "Black Tooth Grin Scouts"
BHC_black_tooth_grin_scouts_desc:0 "Blackhand's forward scouts amongst the Black Tooth Grin Clan have served competently alongside our own in the jungles of this new world and throughout the nearby settlements of this human kingdom. While we stand by the warchief we shall seek to benefit through this mutual purpose between our clans."
BHC_dragonmaw_rylaks:0 "Dragonmaw Rylaks"
BHC_dragonmaw_rylaks_desc:0 "The Dragonmaw clan alongside their remaining Rylaks understand sky combat more than any other clan Draenor has to offer. The terrifying strength of orc and beast would scourge the skies of their homeland in the outskirts of Gorgrond. Despite the decline of the Rylak population the dragonmaw still have a wealth of experience to provide for our own fledgling riders."
BHC_jungle_warlords:0 "Jungle Warlords"
BHC_jungle_warlords_desc:0 "The Bleeding Hollow clan within a decade's time have risen from the extinction to the true warlords of the Tanaan jungles of Draenor. The boldness and ferocity of our leaders is legendary amongst our people. We shall provide the warchief with some of our own to bolster his own leadership in the wake of this invasion."
BHC_blackrock_forges:0 "Blackrock Forges"
BHC_blackrock_forges_desc:0 "Through our cooperation with the warchief and the clans that make up the bulk of his forces we have learned much of the fundamental strengths of the Blackrock clan. Namely, we have each been driven by their example to create forge complexes to fuel a war unlike any this world or own has seen before. We shall prove our strength, and that of the horde with arms and will."
BHC_ask_for_guldans_help:0 "Ask Guldan for help"
BHC_ask_for_guldans_help_desc:0 "The Strength Gul'dan has promised us has proven insufficient. We shall go to him personally to demand he prove to us that the powers he offers are worthy of our people."
BHC_burning_blade_masters:0 "Burning Blade Masters"
BHC_burning_blade_masters_desc:0 "The Blademasters of the Burning Blade Clan are some of the most awe inspiring warriors to have ever seen the field of battle. With their aid many of our own aspiring warriors may be empowered to terrifying proficiency with the blade."
BHC_shadow_council_warlocks:0 "Shadow Council Warlocks"
BHC_shadow_council_warlocks_desc:0 "Gul'dan and his warlocks have empowered both our forces and our strength to rival the heights any being on Draenor has ever achieved. All he has asked in return is for us to permit their warlocks to find recruits amongst our lands who shall serve under both of our banners. It is a worthy price for the strength promised."
BHC_summon_felguards:0 "Summon Felguards"
BHC_summon_felguards_desc:0 "Gul'dan promised us allies in our conquest of this world and the time has come to collect. With a sickening violent assault upon the frayed seams of this realm he and his warlocks have ripped strange creatures from the vast cosmos to bolster our forces. However, their presence does not sit comfortably with all our kin. "
BHC_twilight_brutes:0 "Twilight Brutes"
BHC_twilight_brutes_desc:0 "The Twilight Hammer empower their already impressive strength to new heights through the use of foul magics. At our behest they have offered to share a portion of these secrets in exchange for further knowledge of our own ritual practices."

BHC_shadow_council_assassins:0 "Shadow Council Assassins"
BHC_shadow_council_assassins_desc:0 "Sometimes strength of a more subtle kind is required to break one's foes. Many great leaders and warriors found themselves with their throat's slit amongst the jungles of Draenor after all. Gul'dan has promised us insight into the methods of his unnatural assassins in exchange for knowledge of our own blades in the dark."
BHC_escalate_the_war:0 "Escalate The War"
BHC_escalate_the_war_desc:0 "In our homeland of the Tanaan Jungles we surpassed the Botani, Arakkoa, Genesaur, and Ogres. We have tested the strength of the Gurubashi and have found them wanting. These 'Troll' tribes disorganized and weak as they are shall fall as yet another enemy of the Bleeding Hollow felled within the jungles."
BHC_reinforce_the_lines:0 "Reinforce The Lines"
BHC_reinforce_the_lines_desc:0 "Too Many of our clan have perished in these wars, we have requested forces from beyond the portal, those who have arrived are unexpected, but welcome all the same."
BHC_troll_allies:0 "Allies of the Jungles"
BHC_troll_allies_desc:0 "By either subjugation or mutual benefit we have found ourselves under the same banner as the Gurubashi Trolls of the southern jungles. If we are unable to conquer their lands for now then we at least may learn much of their style of warfare amongst the jungles of this 'Stranglethorn'."
BHC_pillage_duskwood:0 "Pillage Sunnyglade"
BHC_pillage_duskwood_desc:0 "At last Dusk has come for these pitiful lands. The wretched town of 'Sunnyglade' and its weakness has been crushed before the strength of the Bleeding Hollow and to the victor shall go the spoils. The excess and abundance that made these people weak shall forge our industry and strength anew with the kindling of 'Sunnyglade' and its people."
BHC_zulhollow:0 "Found Zul'Hollow"
BHC_zulhollow_desc:0 "Amongst the towering temple city carved into the great vale of Zul'Gurub shall we carve the heart of our clan in this world. Just as the Gurubashi carve their name into this place shall we christen these temples. The name Zul'Hollow shall ring through the history of this world as we have forged our place within it evermore."
BHC_submit_or_die:0 "Submit or Perish"
BHC_submit_or_die_desc:0 "We will suffer no rivals amongst our new homeland in this world's jungles. While the Darkspear did not turn their shrouded wrath upon us on our path to conquest in the region we will not be so foolish as to assume it was out of loyalty. They will either kneel before us or be thrown to the slavehold."
BHC_bleeding_hollow_spearman:0 "Bleeding Hollow Spearmen"
BHC_bleeding_hollow_spearman_desc:0 "This War has provided a unique challenge to our spearmen who once dominated the Tanaan Jungles against charges of Ogres, Genesaur, and wild beasts alike. It is here amongst the open fields against terribly swift riders with shells of iron and massive lances that rival our spears that we are once again challenged. We shall surpass this challenge and make their riders fear the banners of the Bleeding Hollow."
BHC_adapt_war_plan:0 "Adapt War Plans"
BHC_adapt_war_plan_desc:0 "War has begun and the time for outdated plans and philosophies is dead. We shall reforge ourselves in the flames of conflict and surpass any challenge our foes dare to lay upon us."
BHC_raiders:0 "Train Raiders"
BHC_raiders_desc:0 "The Human's Cavalry tactics upon the open fields in challenging us have only empowered our will to surpass them. Even now we call upon the many packs of great wolves brought from Draenor to ride in ever greater numbers with our veteran warriors upon them. When next we meet their cavalry in the field of battle they shall be trampled under foot and fang."
BHC_double_nights_watch:0 "Double The Nights Watch"
BHC_double_nights_watch_desc:0 "These Trolls cling to the shadow as if it were a second skin launching bold and violent raids into our lands disrupting our supply lines and terrifying our peons. They are much fiercer than many who challenged us in the Tanaan Jungles. We will need to double the watch and ensure our supply lines have greater escorts. Any further attempted raids are to be met with the wrath of our clan."
BHC_counter_hexxers:0 "Counter Hexxers"
BHC_counter_hexxers_desc:0 "The Magics of the trolls to the south are unusual and chaotic in nature leaving many of our warriors as gibbering madmen with shrunken heads while reducing our peons to toads and frogs. We have learned much through ripping apart these hexes and turning their cruelty upon the Trolls themselves."
BHC_besiege_stormwind:0 "Besiege Stormwind City"
BHC_besiege_stormwind_desc:0 "At the Warchief Blackhand's Command we march upon the capital of this pitiful kingdom. We shall show no mercy to any and all who choose to cower behind the city's walls. Our momentum is absolute and our frenzy unmatched. “BLOOD AND THUNDER! FOR THE HORDE!”"
BHC_demoralize_the_humans:0 "Demoralize the Humans"
BHC_demoralize_the_humans_desc:0 "The Human Kingdom has fallen to our might, and these humans in the now darkened land of Duskwood will understand that they are not our equals."
BHC_dismantle_equipment:0 "Dismantle Human Equipment"
BHC_dismantle_equipment_desc:0 "“RIP APART EVERY INSTRUMENT OF WAR AND LABOR THEY CARRY ALONGSIDE THE FOUNDATIONS OF THEIR VERY PEOPLE. ALL SHALL BE FUEL TO OUR EMPOWERED WARBAND'S STRENGTH!”"
BHC_fel_fragments:0 "Felstone Fragments"
BHC_fel_fragments_desc:0 "The Deadwind Clan have begun unloading carts of green tinted rocks into the areas above the Vice, they have begun to complain that it has been making them sick, however our warlocks have been able to confirm that they hold fragments of power form a powerful being."
BHC_keep_the_jungle_at_bay:0 "Keep the Jungle at Bay"
BHC_keep_the_jungle_at_bay_desc:0 "We can no longer afford to assault the jungles to the south blindly expecting a simple victory through savagery and boldness alone The trolls have shown us a foe strong enough to rival ourselves amongst the jungles of this world. We need to refocus our efforts and prepare a final decisive blow upon their peoples."
BHC_enslave_the_gurubashi:0 "Enslave The Gurubashi"
BHC_enslave_the_gurubashi_desc:0 "The Gurubashi have fought well with an savage strength and fervor to match the full onslaught of our foes in draenor. However, their continued resistance is to be brought to a final end any remaining warriors, priests, and craftsmen are to be chained and used as labor and enslaved fodder. Warriors from our clan shall rule as wardens from their ancient arena where the defiant shall flay one another before us."
BHC_human_agriculture:0 "Study Human Agriculture"
BHC_human_agriculture_desc:0 "The Humans have an entire class of people who live just to produce grain for their population, not grow, hunt and forage, but only farm the land."
BHC_study_human_armor:0 "Study Human Armor"
BHC_study_human_armor_desc:0 "The Humans that infest much of this world are feeble and soft beings at their core. It is clear they compensated for this lack through creating finer armored shells then those our kin had forged in Draenor. As such, we shall rip their precious work off their corpses and make with it finer armor than they ever could."
BHC_study_human_fortifications:0 "Study Human Fortifications"
BHC_study_human_fortifications_desc:0 "'Sentinel Hill' the human's stronghold of power in this western reach of their lands. A contrast to the weakness of the landscape surrounding it this place held firm against our onslaught to the last. We can use this fine example of defiance as a boon to our future fortifications."
BHC_a_daughters_betrayal:0 "A Daughters Betrayal"
BHC_a_daughters_betrayal_desc:0 "We have been ordered to escort a warband of Blackhands men to the Deadmines, our scouts have informed us that they had spotted a band of ogres enter the mine a few days ago."
BHC_loyalty_rewarded:0 "Loyal Ogre Clans"
BHC_loyalty_rewarded_desc:0 "The Ogres assigned to our clan have proven their loyalty to their betters and have earned new duties amongst the ruins of this human Kingdom. They shall continue to serve as wardens and occupiers of these untamed ruins and shall earn their freedom through subservience to our banner."
BHC_study_the_deepmines:0 "Study the Deepmines"
BHC_study_the_deepmines_desc:0 "Within this western region of the human kingdom we have found a major source of material that allowed these feeble humans to forge such a quantity and quality of armor. The multi layered complex is unlike any great mining pit or caving operation our people have undertaken. We shall understand this place and overcome this obstacle to our prosperity with these spoils of war."
BHC_iron_tracks:0 "Lay Iron Tracks"
BHC_iron_tracks_desc:0 "The Iron Tracks in particular alongside the carts they ferry provide a vastly greater rate of movement for the materials ripped from the earth at this site. If similar constructions were applied throughout our own mines with our mine layouts adjusted accordingly we can improve upon both Orcish and Human mining styles."
BHC_take_what_is_ours:0 "Take what is Ours"
BHC_take_what_is_ours_desc:0 "The Warchief has demanded we give the land in Westfall to this new clan, we fought tooth and nail for it, we will take what we are owed."
BHC_adapt_to_trolls:0 "Adapt to Troll Tactics"
BHC_adapt_to_trolls_desc:0 "As with the Humans and our many enemies amongst our homeland we must adapt our tactics to match the unique strengths of our foes in these southern jungles. As before we will not be found wanting, for we fear nothing, not even death."
BHC_jungle_warfare:0 "Bleeding Hollow Hunters"
BHC_jungle_warfare_desc:0 "Once we were reborn amongst the Tanaan jungles, driven onward with reckless abandon by the visions of Kilrogg. We were forged into the greatest force those jungles had ever known. Now, we have been reborn once again through the brutality of our conflict in stranglethorn and this world shall feel the wrath of the Bleeding Hollow."
BHC_loa_gods:0 "What are these Loa?"
BHC_loa_gods_desc:0 "Amongst the Trolls we have slain and captured many hold the names of strange spirits on their tongues. Loa they call them. Bwonsamdi, Shirvallah, and Hir'eek are the most prominent. Each has been seen to empower their servants in different fashions.  We would be wise to understand the strength behind these natural spirits so we may either fight against them or harness their powers to our own ends."
BHC_the_new_warchief:0 "The New Warchief"
BHC_the_new_warchief_desc:0 "While we were preparing ourselves for the next stage of the invasion of this world a struggle for leadership took place within the Blackrock clan. A new era has come for the Horde and we shall be ready for whatever shall follow."

BHC_unexpected_ally:0 "Unexpected Ally"
BHC_unexpected_ally_desc:0 "For Decades we fought tooth a nail in the Jungles of Tanaan for survival, only ever interacting with the Bonechewers when they Interfered with our hunts. When Blackhand Ordered us to lay siege to Stormwind we expected to need to face this trial alone, as we did with the bog creatures, we never expected another clan would be sent with us"
BHC_learn_from_the_clans:0 "Learn from the Clans"
BHC_learn_from_the_clans_desc:0 "We have come to learn a great deal from our cooperation with the other clans amongst this invasion. It has with time had an impact on the heart of our clan and it is up to us to decide how this horde shall redefine us."

BHC_our_own_ambitions:0 "Our Own Ambitions"
BHC_our_own_ambitions_desc:0 "We do not march beneath the banner of this horde merely for the benefit of the other clans and the warchief. We have ambitions to find ourselves a new homelands amongst this verdant world from which our clan may be made ascendant beyond anything our ancestors could have dreamed of."
BHC_make_examples:0 "Make Examples"
BHC_make_examples_desc:0 "We shall carve this new heartland of ours with the blood of the defiant and foolish. We do not need the strength of others to prove our supremacy over this land. The bloodscalp tribe shall have its lands and warriors butchered as an example before their kinsmen."
BHC_the_laughing_skull:0 "The Laughing Skull"
BHC_the_laughing_skull_desc:0 "In our campaign against the draenei upon our homeworld the Laughing skull once tied themselves to our banner and our combined forces crushed the Draenei without hesitation. A collection of their clan free of the madness that colors most of their kin still serve the horde. We will offer Kraga and his people the troll city of Zul'Kunda to rule and in time they may prove themselves invaluable once again."
BHC_stranglehold:0 "Stranglehold"
BHC_stranglehold_desc:0 "Our stronghold of power within the region shall be ensured through the examples of our strength within the region. Any found or suspected of defiance against our rule in these lands shall be butchered and burned before their kinsmen beyond what even their regeneration can reform. The constant streams of smoke behind us stand as a sign of our supremacy over 'Stranglethorn'."
BHC_home_among_the_horde:0 "A Home Among the Horde"
BHC_home_among_the_horde_desc:0 "We have made a home for ourselves alongside the banners of many clans in this world and draenor. It is in our greatest triumph that we are able to pay what is due to our brothers and sisters of the Laughing skull. So long as they serve us and not that ogre Morgor they will have a place in these jungles with our banners together a sign of strength on Draenor and strength in this new world."

