BHC_gather_the_warriors:0 "Gather The Warriors"
BHC_gather_the_warriors_desc:0 "The Humans have told us of the stubbon dwarves in the north, they seem to be a land for actual warriors and not a rabble of farmers, this may be an actual fight."
BHC_malformed_brutes:0 "Malformed Brutes"
BHC_malformed_brutes_desc:0 "When we pushed onto the islands of the dwarven land we found dwarves fighting crude looking creatures wielding bones as weapons."
BHC_ambush_the_north_gate:0 "Ambush The North Gate"
BHC_ambush_the_north_gate_desc:0 ""
BHC_eastern_ruins:0 "The Eastern Ruins"
BHC_eastern_ruins_desc:0 "When the Mo'grosh Clan stormed through the dwarven lands they came upon a ruin that the dwarves seem to be investigating, after dispatching the combatants the Clan has made it their new home much like the Deadwind Clan."
