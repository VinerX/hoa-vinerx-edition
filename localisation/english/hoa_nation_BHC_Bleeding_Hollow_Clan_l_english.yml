BHC_withdraw_from_the_highlands_desc:0 "With the War Over we have no reason to guard the Oil extraction efforts for the Warchief and we can leave them to the Dragonmaw to do with them as they wish."
BHC_reinforce_the_highlands:0 "Reinforce the Highlands"
BHC_reinforce_the_highlands_desc:0 "The Dragonmaw Clan will not take kindly to our fortification of the oil refineries, they stake a claim the Highlands as their right in the new world, but we have our orders."
