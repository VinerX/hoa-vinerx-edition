#events
###############################

kultiras.1.t:0 "Meeting of the Seven Kingdoms."
kultiras.1.d:0 "The Kingdom of Lordearon has called a Meeting of the Seven Kingdoms, something that has not been done for a millennia, it would seem as though they are taking the threat from the Orcs to the south seriously."
kultiras.1.option.1:0 "We shall attend"
kultiras.1.option.2:0 "We have our own matters to attend to."

kultiras.2.t:0 "Secure the Seas"
kultiras.2.d:0 "Lordaeron has requested that we align ourselves more closly with their politics to better serve the realms."
kultiras.2.option.1:0 "We shall enter the fold."
kultiras.2.option.2:0 "I tire of this Nagging."

kultiras.3.t:0 "Meeting of the Seven Kingdoms."
kultiras.3.d:0 "The Kingdom of Lordearon has called a Meeting of the Seven Kingdoms, something that has not been done for a millennia, though it would seem they are more worried about internal threats then that of the Orcs to the south."
kultiras.3.option.1:0 "We shall attend"
kultiras.3.option.2:0 "We have our own matters to attend to."


kultiras_third_war.1.t:0 "Crews Mutiny"
kultiras_third_war.1.d:0 "Some of our crews, shaken by the horrors of the Undead, have turned their blades against us. A faction of mutineers has declared themselves the Bloodsail Buccaneers, setting sail for the lawless shores of Stranglethorn Vale. Meanwhile, another band of deserters, styling themselves the Southsea Freebooters, has vanished into the western seas, their destination unknown."
kultiras_third_war.1.option.1:0 "Stay Loyal to the Admirality"
kultiras_third_war.1.option.2:0 "Join the Bloodsail Buccaneers"
kultiras_third_war.1.option.3:0 "Join the Southsea Freebooters"

kultiras_third_war.2.t:0 "Mustering a response."
kultiras_third_war.2.d:0 "Under normal circumstances, we would hunt down and execute mutineers without hesitation. But with the war raging in Lordaeron and the Undead scourge spreading like wildfire, every blade and cannon is precious to the cause. Will we divert our forces to hunt down these rogue crews risking precious time and resources, or let them be for now, hoping they don't return to haunt us later?"
kultiras_third_war.2.option.1:0 "The price for treason is death."
kultiras_third_war.2.option.2:0 "Leave them be."

