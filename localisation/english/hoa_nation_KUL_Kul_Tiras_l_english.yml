KUL_lord_admiral_daelin_proudmoore:0 "Lord Admiral Daelin Proudmoore"
POLITICS_DAELIN_PROUDMOORE_DESC:0 "Lord Admiral of the island nation of Kul Tiras. Since youth Daelin has sailed the high seas of Azeroth battling Sea Giants, Krakens, and pirates alike securing him the reputation as the most capable naval commander on Azeroth. From his capital of Boralus, he commands the largest and most modern navy ever built."

