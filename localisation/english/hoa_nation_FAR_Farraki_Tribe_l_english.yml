FAR_sandfury_tribe:0 "Sandfury Tribe"
FAR_sandfury_tribe_desc:0 "The Sandfury Tribe is in a union with the Farraki."
FAR_gahzrilla_our_god:0 "Gahz'rilla, Our Savior" 
FAR_gahzrilla_our_god_desc:0 "Gahz'rilla is the Hydra Demigod of the Farraki Clan. He beckons the Farraki's calls whenever they need the beast."

FAR_isolated:0 "Isolated"
FAR_isolated_desc:0 "The Farraki tribe is alone in Tanaris with no support. This has led to an isolationist mindset as they are beset on all sides by enemies."

FAR_desert_logistics_1:0 "Desert Logistics"
FAR_desert_logistics_1_desc:0 "The harsh Tanaris suns beats down on everything with little to no water available. This coupled with the fiendish wildlife breaks down the strongest souls."
FAR_desert_logistics_2:0 "Desert Logistics"
FAR_desert_logistics_2_desc:0 "The harsh Tanaris suns beats down on everything with little to no water available. This coupled with the fiendish wildlife breaks down the strongest souls."
FAR_desert_logistics_3:0 "Desert Logistics"
FAR_desert_logistics_3_desc:0 "The harsh Tanaris suns beats down on everything with little to no water available. This coupled with the fiendish wildlife breaks down the strongest souls."
