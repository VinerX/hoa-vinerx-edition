farraki_classic.7.option.2:0 "Farraki Weaponsmiths"
farraki_classic.7.option.3:0 "Drakkari Peddlers"
farraki_classic.7.option.4:0 "Darkspear Fishermen"

farraki_classic.8.t:0 "The Rising Peak"
farraki_classic.8.d:0 "Our temple city is home to many towering pyramids that stretch toward the heavens, and we have now completed another great pyramid in honor of the Wild Gods. The time has come to dedicate this grand structure to one of the Loa. The priests seek Chief Ukorz’s blessing in this matter and await his decision."
farraki_classic.8.option.1:0 "Eternal Night for Mueh'zala"
farraki_classic.8.option.2:0 "Glory to Kimbul"
farraki_classic.8.option.3:0 "Whispers of Shadra"
farraki_classic.8.option.4:0 "Give Rise to Gahz'rilla"

farraki_classic.9.t:0 "Dedicated to Ourselves"
farraki_classic.9.d:0 "The desert sands show no mercy. Tanaris has left its mark on us for all to see—our skin, cracked and brownish-gold, our deep blue eyes, and dark tusks set us apart as much as the distance from our kin ever has. This isolation has forced us to rely on no one but ourselves, to endure and persist through the most unimaginable hardships."
farraki_classic.9.option.1:0 "Resolute through Change"
farraki_classic.9.option.2:0 "Devout through Faith"

farraki_classic.10.t:0 "Cauldron of Mad Mojo"
farraki_classic.10.d:0 "“What ya be seekin’ is a path foward for our people” said Witch Doctor Zum’rah as Chief Ukorz arrived at his hut.\n\n“Da spirits, dey bring me da answer to all de troubles, my Chief.” A gnarled hand broke through the soil at their feet, exposing a wan troll wrapped in bandages pulling itself free. The corpse stood before Zum’rah, staring ahead with vacant eyes, sand falling from its decayed, rotting form.\n\n“What madness be dis, Zum’rah? What strings ya be tyin’ to our people?” Ukorz demanded.\n\n"Ya need bodies for da war. Why not use da dead? Bwonsamdi don’t guide de people to Da Other Side. Dese tortured souls be sufferin’ in death, waitin’ for purpose. Why not give ‘em one?""
farraki_classic.10.option.1:0 "This is wrong"
farraki_classic.10.option.2:0 "We do what we must"

farraki_classic.11.t:0 "Implements for Success"
farraki_classic.11.d:0 ""Dis harsh land taught our people plenty, but da enemies we face be ready for plenty more. Da tribe gotta approach war different now. We can't be scrapin' by on da little we got no more. We gotta know war like our ancestors did in da Empire of old. Our powa must grow.” Ruuzlu urged Chief Ukorz on.\n\n"More forges for da blacksmiths, an’ get more beast tamers to join da cause. We gotta tink carefully 'bout who getting da better end of de stick.. Give betta gear to da blood-drinkers, or da witch doctors. Da Raptor Riders be needin' new pens too." Ukorz replied contemplatively."
farraki_classic.11.option.1:0 "Favor the Blood-Drinkers"
farraki_classic.11.option.2:0 "New Mojo Cauldrons"
farraki_classic.11.option.3:0 "Care for the Raptors"
# I should really consider re-doing sand trolls to have basilisk riders at some point. ##_## Mahael thoughts.

farraki_classic.12.t:0 "Chief Ukorz Dream"
farraki_classic.12.d:0 "Chief Ukorz Sandscalp envisions a future where his people stand unchallenged, free from the encroachment of both Horde and Alliance. He vows to drive the Goblins back into the sea and eradicate the Silithid scourge, avenging their transgressions against the Sandfury. The desert, long overlooked, will be restored to its rightful owners. We shall no longer be a forgotten footnote in the proud history of the Gurubashi Empire.\n\nNow, the time has come for the Sandfury to rise. Our name will echo across the land, a show of strength to any who dare oppose them. The interlopers will be cast into the sea, and those who remain will be buried beneath the sands.\n\nShall we turn our gaze to the desert and reclaim it for our people, or shall we focus on building the foundations of a new Sandfury Empire?"
farraki_classic.12.option.1:0 "Settle the Sands"
farraki_classic.12.option.2:0 "Bedrock of an Empire"

farraki_classic.13.t:0 "Rise of the Sandfury"
farraki_classic.13.d:0 "Ukorz gazes out over the city from the Sandfury Hold, overwhelmed by a sense of reverent awe. Fresh stonework adorns the walkways, punctuated by small pools nestled in shaded alcoves. The city's energy is palpable, with the vibrant sounds of hawkers in the market calling out goods from distant lands, the rhythmic clang of hammers on anvils from the blacksmiths, and the mingling scents of leather workers' tanning vats and freshly prepared food. Life has returned to these once-desolate wastes, bringing vitality and renewal.\n\nThe Sandfury now thrive around their rebuilt oasis in the sands. Yet, with this newfound prosperity, enemies are sure to gather like flies to a midden heap."
farraki_classic.13.option.1:0 "Let them come."

##_##
farraki_classic.14.t:0 "The War Table"
farraki_classic.14.d:0 "Insert Flavor Text about going to war with the Silithid, and every other group in Tanaris. This desert ain't big enough for all of us. How fighting the silithid prepares us for future fights against their kind."
farraki_classic.14.option.1:0 "Our Wrath will be Swift"

##_##
farraki_classic.15.t:0 "Beseech the Loa"
farraki_classic.15.d:0 "As the winds stirred the desert sands, the elders gathered beneath the towering effigies, calling out to the Loa for their wisdom. The Loa had fought battles eternal and stood with their people through countless trials. Now, their guidance was needed once more.\n\nPerhaps Kimbul, fierce and unrelenting, would lend his ferocity to the warriors, driving them forward with the strength of a predator on the hunt. Or Shadra, ever cunning, might weave her webs of deceit, poisoning the minds and bodies of their enemies. And there, looming like a shadow over all, was Mueh'zala—death eternal. The time had come to act as his hands, to guide these wretched souls to their inevitable end beyond.\n\nThe people would not stand alone in this fight. With the Loa at their side, their enemies would fall."
farraki_classic.15.option.1:0 "Ueetay No Mueh'zala"
farraki_classic.15.option.2:0 "Eraka No Kimbul"
farraki_classic.15.option.3:0 "Elortha No Shadra"

farraki_classic.16.t:0 "Gadgetzan Prisoners"
farraki_classic.16.d:0 "Insert Flavor Text about getting some goblins as prisoners. They are certainly tame and will not make hazardous explosives to escape slavery.. Right? Or Blood for the Blood God."
farraki_classic.16.option.1:0 "Dangerous Transgressors"
farraki_classic.16.option.2:0 "Put them to work"

farraki_classic.17.t:0 "What once was, can be again"
farraki_classic.17.d:0 "The trolls once stood united under the mighty Empire of Zul—a powerful coalition of our tribes forged to confront a singular, devastating threat: the Aqir of the Black Empire. We waged war across vast lands, battling the fiendish servants of the Old Gods. United under the banners of our four great tribes—the Zandalari, Amani, Drakkari, and Gurubashi—we pushed back the oppressors and ushered in a new age for trollkind. For a thousand years, this empire endured, until the Night Elves brought down the withered remnants of the Empire of Zul.\n\nYet through it all, our people have survived: wars, famine, the Shattering. Now, the time has come for us to rekindle our bonds of kinship and raise a new Empire of Zul from the ashes of the old."
farraki_classic.17.option.1:0 "For Trollkind!"

farraki_classic.18.t:0 "Envoys of the Gurubashi"
farraki_classic.18.d:0 "An envoy from the Gurubashi has arrived from across the sea, greeting us with a friendly demeanor, though his wariness betrays a hint of doubt about recent events. The Gurubashi are pleased to learn we’ve endured in this sand-blasted domain, but their true interests lie in the exotic reagents we can provide for their voodoo rituals and future access to Un'goro for their beast tamers.\n\nIn return, they offer the resources of the jungle and willing hands to aid us in the wars to come."
farraki_classic.18.option.1:0 "More Resources"
farraki_classic.18.option.2:0 "Some Resources and Helping Hands"

farraki_classic.19.t:0 "Envoy from Zuldazar"
farraki_classic.19.d:0 "A city of gold on sacred ground—Zuldazar embodies the splendor of what was, and what could be once more. Their envoy arrives, draped in gold and brimming with pride, welcoming us back into the fold with an air of arrogant confidence. God King Rastakhan and the wise prophet Zul send their blessings, offering aid in countless forms.\n\nThey propose pilgrimages for our priests and theirs, to grace each other's shores. Artisans could be sent to teach us the ancient ways of crafting with precious metals and grand architecture. Rich caravans, heavy with the resources we so desperately need, are offered. Also offered are leased architects and laborers to help restore the majesty of Zul’Farrak, so that we too may rise into the skies, as Zuldazar does"
farraki_classic.19.option.1:0 "Priests from the Zandalari"
farraki_classic.19.option.2:0 "Artisans arrive from Zuldazar"
farraki_classic.19.option.3:0 "Resource Caravans"
farraki_classic.19.option.4:0 "Architects and Laborers"

##_##This needs re-writing. It's weak.
farraki_classic.20.t:0 "Glorious Purpose."
farraki_classic.20.d:0 "In the unforgiving deserts of Tanaris, the world believes us broken... beaten down by time, by enemies, by the very sands we walk. But we are not broken—we are the Sandfury. We are the storm that rises when the desert heat scorches all others.\n\nFrom the ruins of Zul'Farrak, we have risen—stronger, fiercer, unyielding. For too long, the Horde and the Alliance have believed this land is theirs to take, to shape in their image. But this desert bends to no one but the Sandfury.\n\nOur enemies are many, our rivals countless. But they will fall—under spear and stone, under claw and beneath the Loa. From the broken sands, an empire will rise once more. The blood of our forebears cries for vengeance, and we shall answer. Zul’Farrak will be reborn... and with it, our dominion will stretch across the desert, across the world."
farraki_classic.20.option.1:0 "Long Live the Sandfury"
farraki_classic.20.option.2:0 "For Chief Ukorz Sandscalp!"

farraki_classic.21.t:0 "The Needs of our People"
farraki_classic.21.d:0 "The winding avenues of Zul'Farrak lie in disrepair, remnants of our long decline into obscurity. Once-proud trolls now wither in crumbling huts that offer little relief from the scorching sun, yearning for what was, while neglecting what could be. We are the Sandfury—broken by time, surrounded by enemies who circle us like vultures over a dying corpse. For too long, Zul'Farrak has been left to rot in decay and abandonment. We have endured when we should have thrived.\n\nThe time for endurance alone is over. Let us give the orders to clear the rubble, remove the refuse, and cleanse our gathering places. The paths we clear today will shape the roads we walk tomorrow."
farraki_classic.21.option.1:0 "Bar the gates"
farraki_classic.21.option.2:0 "Strengthen Sandsorrow"
farraki_classic.21.option.3:0 "Rally to the Pillar"

