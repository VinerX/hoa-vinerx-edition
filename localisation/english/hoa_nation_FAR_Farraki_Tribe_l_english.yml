farraki_classic.26.t:0 "The War of the Shifting Sands Renewed"
farraki_classic.26.d:0 "As our warriors clamber out of the lush bowl of Un'goro and reach the rise ahead, the landscape shifts dramatically. The air grows heavy with the sound of beating wings and skittering feet—a deafening symphony as the swarms of the hives blanket the horizon, drowning out all other noise. For as far as the eye can see, waves of silithid rise and fall across the dunes, an endless sea of chitinous bodies that darken the sands beneath them.\n\nBut these are no ordinary swarms. Their numbers dwarf any hive we’ve encountered before, stretching out in a living tide of relentless hunger. Among them, other shapes loom—goliath insectoid beasts, their massive limbs carving through the earth as they lumber forward. And towering over even these are hulking obsidian statues, monstrous guardians wielding weapons larger than any troll, their lifeless stone eyes betraying no emotion, only the cold, calculated malice of their creators.\n\nOur warriors stand in stunned silence as realization dawns: this is no mere hive—it is the return of the Aqir, a threat we believed vanquished, a nightmare reborn from the sands of time. The challenge before us is the greatest we have ever faced. How will we stand against such ancient horrors? How will we fight when even the earth trembles beneath the weight of our enemy? The silence stretches, thick with the gravity of the moment, as we prepare to face the trial of our lives."
farraki_classic.26.option.1:0 "Contain this Threat"
farraki_classic.26.option.2:0 "Into their Mandibles" 

