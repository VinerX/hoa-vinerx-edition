#Historical Focuses Below.
##_## Entirely Untouched Descs.
FAR_alone_in_the_desert:0 "Alone in the Desert"
FAR_alone_in_the_desert_desc:0 "The Sandfury stand apart from the other troll tribes, cast far from their Gurubashi origins after the Shattering of the world. The unforgiving sands of Tanaris have shaped a hardened people—warriors who drink the blood of their enemies for strength and relentlessly defend their lands against foes who press in from all sides."

FAR_strengthen_sandsorrow:0 "Strengthen Sandsorrow"
FAR_strengthen_sandsorrow_desc:0 "We must leave our fortress home if we are ever to regain control over the sands. That starts with Sandsorrow Watch at our gates."

FAR_ideas_of_grandeur:0 "Ideas of Grandeur"
FAR_ideas_of_grandeur_desc:0 "Dreams of the future, representing what could be for our people have wracked our chief with sleepless nights. What lies in store for us?"

FAR_a_broken_land:0 "A Broken Land"
FAR_a_broken_land_desc:0 "Tanaris holds no splendor to the eyes of the uninitiated. It is a harsh, desolate landscape filled with the corpses of interlopers, and crawling with the Silithid. Only we have tamed this place."

FAR_towering_over_the_land:0 "Towering over the Land"
FAR_towering_over_the_land_desc:0 "The dunes obscure our vision at the grounds height. We must construct watchtowers to warn of invaders, and to safeguard our people who live outside the walls."

FAR_sullithuz_breeding:0 "Sul'lithuz Breeding"
FAR_sullithuz_breeding_desc:0 "The basilisks of our people have been integral to our success in the past, and will do so again in the future."

FAR_dew_catchers:0 "Dew Catchers"
FAR_dew_catchers_desc:0 "The scorching heat of this place drives moisture from the very air. We have figured out ways to collect what moisture may be found in secret locations. They give us life in this forsaken landscape."

FAR_scarab_taming:0 "Scarab Taming"
FAR_scarab_taming_desc:0 "The aqir of our past represented a near insurmountable threat but with their fall we have taken to taming their lesser creations."

FAR_sandscalp_dream:0 "Sandscalp's Dream"
FAR_sandscalp_dream_desc:0 "Ukorz lies awake at night dreaming of the glory that could be his. An empire in the sands. A rising dynasty. For what are dreams, if not prophecies to be fulfilled."

FAR_shrouded_walkways:0 "Shrouded Walkways"
FAR_shrouded_walkways_desc:0 "The blazing sun takes it's toll on all who walk under it. Let us shroud our walkways to find shade for our people. May we find water and shade."

FAR_requests_of_the_priests:0 "Requests of the Priests"
FAR_requests_of_the_priests_desc:0 "Our priests beseech facilities to engage their followers within. They also bring tablets for adminstration needs throughout Zul'Farrak, and the minor holdings."

FAR_needs_of_our_warriors:0 "Needs of our Warriors"
FAR_needs_of_our_warriors_desc:0 "Sandfury Warriors sought our Ukorz to inquire after space for Artisans to forge their weapons. An axe in hand is another scum from the Alliance who waters the sands with their blood."

FAR_gahzridian_baubles:0 "Gahz'ridian Baubles"
FAR_gahzridian_baubles_desc:0 "The Hydromancer has taken to giving praise to Gahz'rilla in the streets. The people have taken to wearing baubles in the shape of our Hydra benefactor."

FAR_darkest_mojo:0 "Darkest Mojo"
FAR_darkest_mojo_desc:0 "The Witchdoctor's cauldron has some mad mojo cooking. Even the spirits seem restless near his wicked bubbling cauldron."

FAR_ruuzlu_wish:0 "Ruuzlu's Wish"
FAR_ruuzlu_wish_desc:0 "To give rise to Ukorz Dream, Ruuzlu would burn the world. After all, it's easier to make a fresh start from ashes."

FAR_sandfury_reign_supreme:0 "Sandfury Reign Supreme"
FAR_sandfury_reign_supreme_desc:0 "Tanaris lies within our clutches. The Sandfury Empire claims dominion of Tanaris."

FAR_curate_knowledge:0 "Curate Knowledge"
FAR_curate_knowledge_desc:0 "Let us reclaim the knowledge of days past when we stood as the Empire of Zul. Stone is not so forgettable as the parchment those goblins scribble on."

FAR_tablets_of_truth:0 "Tablets of Truth"
FAR_tablets_of_truth_desc:0 "Our past was an empire spanning the entire world. Surely they contain knowledge for managing the most valuable resource of all.\n\n Our People."

FAR_incite_witchdoctors:0 "Incite Witchdoctors"
FAR_incite_witchdoctors_desc:0 "Cauldrons have been yearning for new ingredients to work with. Let us procure something to aid our Witchdoctors in their quest for mojo."

FAR_blood_drinkers:0 "Blood Drinkers"
FAR_blood_drinkers_desc:0 "Blood feeds blood. Blood calls blood. Blood is, and blood was, and blood shall ever be."

FAR_loa_and_the_past:0 "Loa, and the Past"
FAR_loa_and_the_past_desc:0 "Our people esteem Kimbul, Mueh'zala and Shadra. Secret sects hold Gahz'rilla to that level of praise, but the others are Loa in the eyes of all trolls."

FAR_knowledge_is_power:0 "Knowledge is Power"
FAR_knowledge_is_power_desc:0 "What power can word have, that iron and magic can not?"

FAR_seething_hatred:0 "Seething Hatred"
FAR_seething_hatred_desc:0 "Jakre'zet hates the Horde.\n\nJakre'zet hates the Alliance.\n\nJakre'zet will see their bodies broken, and drink their blood amongst their fallen."

FAR_hydromancers_interest:0 "Hydromancer's Interest"
FAR_hydromancers_interest_desc:0  "Praise the rise of Gahz'rilla, and the vaunted Hydromancer who calls to the Hydra in the waves."

FAR_shadows_ire:0 "Shadow's Ire"
FAR_shadows_ire_desc:0 "To uphold the Sandfury's honor, Sezz'ziz would do anything."

FAR_wreathed_in_lightning:0 "Wreathed In Lightning"
FAR_wreathed_in_lightning_desc:0 "Scales crackle with lightning, signs of the power that lay within the hidden hydra. A deity of water amidst dunes of an endless desert."

FAR_mythos_of_gahzrilla:0 "Mythos of Gahz'rilla"
FAR_mythos_of_gahzrilla_desc:0 "What lies written in stone is for us to study. To give rise to divinity is to seek knowledge."

FAR_preparations_for_divinity:0 "Preparations for Divinity"
FAR_preparations_for_divinity_desc:0 "We pave the way for the divine wrath of the Hydra. Let all who stand before us quake amidst the sands of Tanaris."

FAR_mallet_collection:0 "Mallet Collection"
FAR_mallet_collection_desc:0 "Word has reached of us of the mallet in Jintha'Alor. We must make haste to acquire it."

FAR_infusion_of_power:0 "Infusion of Power"
FAR_infusion_of_power_desc:0 "Atop the hill, we must infuse the Mallet to bring forth the Hydra. Hail the Hydra!"

FAR_give_rise_to_gahzrilla:0 "Give Rise to Gahz'rilla"
FAR_give_rise_to_gahzrilla_desc:0 "A scaly mass ascends from the depths of the sacred pool. None may stand before Gahz'rilla's might."

FAR_collection_time:0 "Collection Time"
FAR_collection_time_desc:0 "Our raiders pillage the interlopers for resources, and slaves. Both are necessary for our survival."

FAR_scarab_shells:0 "Scarab Shells"
FAR_scarab_shells_desc:0 "Tamed scarabs represent a triumph over the Silithid scum. The beasts to our south represent the threat that persists. We must scourge them from the watering hole, and purify the sands of Tanaris."

FAR_prey_on_travelers:0 "Prey on Travelers"
FAR_prey_on_travelers_desc:0 "Seize wanderers who impose on our lands. The Loa enjoy sacrifices of blood on their altars."

FAR_war_with_thistles:0 "War with Thistles"
FAR_war_with_thistles_desc:0 "These bramble beasts block the way to Un'goro. The desert air drives the moisture from their limbs, and leaves them weak to fire."

FAR_sacrifices_for_loa:0 "Sacrifices for the Loa"
FAR_sacrifices_for_loa_desc:0 "Praise be the Loa.\nPraise to Kimbul!\nPraise to Mueh'zala!\nPraise to Shadra!\n\nHail Gahz'rilla!"

FAR_fortress_from_despair:0 "Fortress from Despair"
FAR_fortress_from_despair_desc:0 "A fortress sheltered in the rocky mountains of Tanaris. Our vaunted sanctuary free of the dangers of the desert. This place has given rise to a strong people who have bent the desert to their whims."

FAR_tribal_needs:0 "Tribal Needs"
FAR_tribal_needs_desc:0 "We must look outwards if we are to reclaim our lands from the invaders. We should consider our steps forward carefully."

FAR_mazogas_quest:0 "Mazoga's Quest"
FAR_mazogas_quest_desc:0 "Chief Ukorz has dispatched Mazoga on a quest of great importance, but of a secretive nature. What shall he uncover?"

FAR_the_protector:0 "The Protector"
FAR_the_protector_desc:0 "Mazoga has found the Jang'thraze the Protector - one half of the sacred blade of the Sandfury."

FAR_the_deflector:0 "The Deflector"
FAR_the_deflector_desc:0 "Mazoga has found the Sang'thraze the Deflector - one half of the sacred blade of the Sandfury."

FAR_homecoming:0 "Homecoming"
FAR_homecoming_desc:0 "Both pieces in hand - Mazoga returns to Zul'Farrak having escaped his accomplices.\nWhat riches and rewards await him?"


