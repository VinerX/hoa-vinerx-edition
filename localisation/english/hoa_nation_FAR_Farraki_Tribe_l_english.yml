farraki_classic.46.t:0 "Sandstorm Raiders"
farraki_classic.46.d:0 "Winds in the desert cut like none other. Afterwards you may find your purse lighter, your supplies missing, or perhaps a missing companion? The desert is an unforgiving place."
farraki_classic.46.option.1:0 "Scum of the sea"
farraki_classic.46.option.2:0 "Greed is good"

farraki_classic.47.t:0 "Unbowed, Unbent, Unbroken"
farraki_classic.47.d:0 "This desert we call home may seem shattered and broken—but it is ours. Our land. Only the Sandfury have tamed this harsh and unforgiving landscape, and only we can claim its strength as our own."
farraki_classic.47.option.1:0 "Wisdom of Ages past"
farraki_classic.47.option.2:0 "Dew catchers hidden away"

farraki_classic.48.t:0 "Fortress of the Sandsfury"
farraki_classic.48.d:0 "Zul'Farrak sits nestled among the mountains, shielded from both intruders and the storms that sweep in from the Great Sea, driving sands into the air like biting locusts. This fortress stands as the ark of our people's hope and survival—a bastion to carry us through the many threats we face. It is more than just stone and walls; it represents the future of the Sandfury, a place where our legacy endures. We must safeguard this sacred stronghold, for in its strength lies the survival of our people, and the promise of what is yet to come."
farraki_classic.48.option.1:0 "Focus on our people"
farraki_classic.48.option.2:0 "Expansion is survival"

farraki_classic.49.t:0 "Tribal Interests"
farraki_classic.49.d:0 "We must carefully consider how best to expand the tribe's influence across Tanaris. Our options are clear: we can either strengthen our current holdings or extend our reach further into the desert.\n\nSandsorrow Watch lies just beyond our gates, serving as our chief outpost outside Zul'Farrak. Expanding it could solidify our foothold. We might enlarge the basilisk pens, dig wells to sustain our people, and erect more tents to accommodate future growth. Constructing walls would provide much-needed protection against the relentless desert winds and solidify its defense.\n\nAlternatively, we could turn our gaze toward the Broken Pillar. Once a site of reverence to the Loa, it deserves restoration to its former glory. Its strategic position could serve as a forward base for our wars against the pirates, the brutish ogres, and even the goblins of Gadgetzan. Establishing a second front there would give us a critical advantage in any future conflicts we may choose to ignite."
farraki_classic.49.option.1:0 "Invest in Sandsorrow"
farraki_classic.49.option.2:0 "Repair Broken Pillar"

farraki_classic.50.t:0 "Quest's End"
farraki_classic.50.d:0 "Mazoga returned to Zul'Farrak, carrying a shrouded package with the mended pieces of Sul'thraze—our people's legendary birthright, restored at last. The weapon, a symbol of our tribe’s strength, was to be returned to the chief, while Mazoga himself would be granted a place of honor within the tribe as a reward. As he strode beneath the arched entrance of the city, he approached the chief and knelt, bowing in obeisance.\n\n“The blade be restored, an’ our people’s future be secured, my chief.”\n\n“Good. Many t’anks, Mazoga.”\n\nEverything went black."
farraki_classic.50.option.1:0  "Rewarded"





