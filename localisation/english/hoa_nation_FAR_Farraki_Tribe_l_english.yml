FAR_desert_logistics_5:0 "Desert Logistics"
FAR_desert_logistics_5_desc:0 "The harsh Tanaris suns beats down on everything with little to no water available. This coupled with the fiendish wildlife breaks down the strongest souls."
FAR_desert_logistics_6:0 "Desert Logistics"
FAR_desert_logistics_6_desc:0 "We stand well supplied, and well prepared."

FAR_farraki_fighting_experience_1:0 "Farraki Fighting Experience"
FAR_farraki_fighting_experience_1_desc:0 "Our warriors doubt themselves against the Silithid menace."
FAR_farraki_fighting_experience_2:0 "Farraki Fighting Experience"
FAR_farraki_fighting_experience_2_desc:0 "Our warriors are learning to fight their fears."
FAR_farraki_fighting_experience_3:0 "Farraki Fighting Experience"
FAR_farraki_fighting_experience_3_desc:0 "The sands betray the Silithid because they belong to us."
FAR_farraki_fighting_experience_4:0 "Farraki Fighting Experience"
FAR_farraki_fighting_experience_4_desc:0 "Skittering foes are eager hunts for children now. Pitiful bugs."
FAR_farraki_fighting_experience_5:0 "Farraki Fighting Experience"
FAR_farraki_fighting_experience_5_desc:0 "The Farraki stand well prepared against Silithid incursions, and treat the beasts like gnats to be swatted."

FAR_witchdoctor_mojo:0 "Witchdoctor Mojo"
FAR_witchdoctor_mojo_desc:0 "Give our warriors some of the mojo from the witchdoctor's cauldron. Let it fire their veins"
FAR_witchdoctor_mojo_2:0 "Witchdoctor Dark Mojo"
FAR_witchdoctor_mojo_2_desc:0 "Bwomsamdi isn't here. Raise the dead and let them occupy our foes. Every fallen we collect may serve our purposes in the afterlife."

FAR_gaudy_idols:0 "Idols of Gahz'rilla"
FAR_gaudy_idols_desc:0 "Wonderous aspects of our patron deity. Let these ornaments remind our people of the glory of Gahz'rilla!"

FAR_ground_breaking:0 "Breaking Ground"
FAR_ground_breaking_desc:0 "Supply lines must be re-established to provide for our warriors for battles to come."
FAR_ground_breaking_2:0 "Ground Breaking"
FAR_ground_breaking_2_desc:0 "Our capacity to wage war is limited by our ability to produce goods. Let us make progress on that."

FAR_trading_costs:0 "Trading Costs"
FAR_trading_costs_desc:0 "We've stretched ourselves thin with this trade. Let the market cooldown."
FAR_zandalari_resource_rights:0 "Zandalari Resource Rights"
FAR_zandalari_resource_rights_desc:0 "Zuldazar sends rich caravans to supplement our needs."
FAR_zandalari_architects:0 "Zandalari Architects"
FAR_zandalari_architects_desc:0 "Architects arrive alongside scores of laborers to help us reach the skies above with new temples, and rising citadels."

FAR_stolen_resources:0 "Stolen Resources"
FAR_stolen_resources_desc:0 "Our raids on Gadgetzan were successful. Their supplies will serve us well in the coming days."
FAR_goblin_laborers:0 "Goblin Laborers"
FAR_goblin_laborers_desc:0 "Goblins are marvelous at finding more effecient ways to complete tasks. Especially when they hear the crack of the whip."
FAR_goblin_escapees:0 "Goblin Escapees"
FAR_goblin_escapees_desc:0 "Those blasted goblins used basilisk guano to make a blasting charge to escape! This will put us behind on several projects as we are forced to use drudges and laborers."

