farraki.1.t:0 "Goblins on our Shores"
farraki.1.d:0 "Chieftain, we have received news of a race called Goblins setting up a small port city in northeastern Tanaris. While this region of the Desert has very little value to the Farraki Empire the lands undoubtedly belong to us. Ignoring this insult could be seen as a sign of weakness in your leadership we should send an envoy to deal with these Goblins before they become a larger issue."
farraki.1.option.1:0 "Send an Envoy"

farraki.2.t:0 "Offer to purchase lands"
farraki.2.d:0 "The Goblins have come to Kalimdor with the intention of establishing a trade network and have larger ambitions for Tanaris beyond their current settlement. They’ve explained that they believed the desert to be abandoned, with no inhabitants in the region, and have offered to pay a hefty sum for the land that they wish to acquire. We face a choice: to consider selling the vast deserts to the northeast or to remove them from our lands."
farraki.2.option.1:0 "Send an Envoy"
farraki.2.option.2:0 "Remove them from our lands"
farraki.3.t:0 "Envoy Slain"
farraki.3.d:0 "The Steamwheedle Goblins have revealed their true intentions; our envoy, sent in good faith, has been treacherously slain during negotiations. We have summoned our tribe's warriors, preparing for war."
farraki.3.option.1:0 "They will regret coming to Tanaris"

#Classic Farraki Events
farraki_classic.1.t:0 "Razorbranch Isolation"
farraki_classic.1.d:0 "Our world was shattered and broken, scattering our people across distant lands. Once proud members of the Razorbranch tribe of the Gurubashi Empire, we now stand alone, far from the jungles that gave us life.\n\nAs the world has changed, so too have we. Under the relentless sun and amidst the unforgiving sands, we fight to preserve what little remains of our legacy.\n\nWe have endured many enemies - the Silithid of Kalimdor, adventurers from the Horde and Alliance, and the treacherous fiends of Gadgetzan. Yet our one refuge, our one sanctuary, is the city of Zul’Farrak, where the sacred pool conceals our deity, Gahz’rilla. Though our tribe has faced hardship, Chief Ukorz Sandscalp remains steadfast, believing that a path to victory lies ahead.\n\nHe envisions the rise of a new Sandfury Empire, one that will restore our former glory."
farraki_classic.1.option.1:0 "Survival is our way."

farraki_classic.2.t:0 "Rites of Blood"
farraki_classic.2.d:0 "Blood magic has been a pillar of troll culture for over a thousand years, passed down from Hakkar the Soulflayer to the Gurubashi Empire. Its gifts have sustained our people in this harsh land which allowed us to overcome countless challenges. It empowers our warriors and serves as a cornerstone of our society. Yet, its power comes at a cost—blood for life, life for blood.\n\nIf we delve deeper into these dark arts, we could unlock unimaginable power. But with it comes the risk of drawing the attention of malevolent forces who would enslave our people to this twisted magic.\n\nThe choice is yours, Chief.\n\n§R"We must change our ways" will PERMANENTLY disable Blood Magic for this playthrough.§"
farraki_classic.2.option.1:0 "Let blood be spilt"
farraki_classic.2.option.2:0 "We must change our ways"
#farraki_classic.2.option.3:0 "Caution must be taken"
#farraki_classic.2.option.4:0 "Peril befalls even the cautious."
##_## Future options to consider a balance of power mechanic between Hakkar, and Ghuun. Neutral Alignment Vs Old God Alignment with dilemmas.

farraki_classic.3.t:0 "The Scorching Sands of Tanaris"
farraki_classic.3.d:0 "The rugged landscape we call home is unforgiving, crippling the weak and the unprepared. Our ability to gather supplies in this desert is hindered by a lack of infrastructure, dangerous wildlife, roaming adventurers, and the relentless heat of the sun. There are ways to overcome these challenges, but they would require aid from our distant brethren. Perhaps we could unite once more, becoming one people instead of many.\n\nAlternatively, we may choose to brave these wilds alone. There is strength in self-reliance, in standing on our own without outside support.\n\nThe choice is yours, Chief.\n\n§RGoing alone will be closer to history, while seeking aid will branch from the Farraki's Destined Fate. This decision is PERMANENT for this playthrough.§"
farraki_classic.3.option.1:0 "Seek Aid"
farraki_classic.3.option.2:0 "Sandfury stand alone"

farraki_classic.4.t:0 "Conditions of the Sandfury"
farraki_classic.4.d:0 "The Chief’s war table is laid out before you, marked with a variety of concerns. Enemy positions are reported throughout our lands—our ancient foes, the Silithid, as well as ogres, goblins, living plants, and pirates. Some advisors have presented strategies for dealing with the Silithid, while others urge a war against the goblins of Gadgetzan to reclaim our northern territories. However, launching a war against the cartel before we are fully prepared could prove disastrous, so it must be postponed.\n\nBeside the war table lie tablets outlining pressing issues within Zul’Farrak itself: scarab droppings clogging the causeways, basilisks escaping the holding pens and devouring voodoo ornaments, and a new temple project dedicated to the Loa. With our limited supplies, these problems must be addressed before we face a true crisis and our people begin to starve.\n\nThere is much that could be done to restore prosperity to our people."
farraki_classic.4.option.1:0 "Let us focus on the task at hand."

farraki_classic.5.t:0 "To Look Inward"
farraki_classic.5.d:0 "Stone tablets in hand outline the growing concerns of our people throughout the city. As more of our kin return to the cloistered walls of our temple city, civic needs have emerged. There are calls for a marketplace and additional water sources to sustain the population. The priests, too, seek guidance on the level of dedication we should offer the Loa.\n\nRuuzlu clears his throat as drudges bring forth more tablets from the priests, requesting additional sacrifices. He hands Ukorz another tablet, detailing troop numbers, provisions, and reports of incursions from a group known as the "Mithril Order." Perhaps it is time to shift our focus to addressing the problems troubling our forces."
farraki_classic.5.option.1:0 "The Loa will be uplifted"
farraki_classic.5.option.2:0 "Might is Right."

farraki_classic.6.t:0 "Uproar in the Bazaar"
farraki_classic.6.d:0 "As space within Zul'Farrak becomes usable once more, the people’s needs and ambitions rise to the surface. The cries of merchants hawking their goods now fill the air, drawing crowds to the few stalls we've set up to meet those needs. Recently, a terraced courtyard—shaded and cleared of the crumbling remnants of the past—has been restored and would make an ideal bazaar for even more merchants.\n\nThe question now is whether we invite traders from other tribes or reserve the best spots for our own merchants, limited as their wares may be. Amani, Zandalari, and Gurubashi merchants would likely respond if called, but the question remains—who should we seek first?"
farraki_classic.6.option.1:0 "Our Merchants First"
farraki_classic.6.option.2:0 "Amani Traders"
farraki_classic.6.option.3:0 "Zandalari Packtenders"
farraki_classic.6.option.4:0 "Gurubashi Dealers"

##_## Flavor Text Needed
