farraki_classic.35.t:0 "Aspirant Captain"
farraki_classic.35.d:0 "Jakrazet had risen through the ranks, hardened by countless skirmishes with Alliance and Horde adventurers. His hatred for both factions simmers just beneath the surface, barely contained as he spits venomous words about their corruption. Eager for confrontation, he has proposed an ambitious campaign through Thousand Needles, Dustwallow Marsh, and the Barrens—an initiative that, while cloaked in strategic goals, is little more than a thinly veiled attempt to provoke the Horde and ignite a conflict that could engulf our people."
farraki_classic.35.option.1:0 "Let us hear this plan"

farraki_classic.36.t:0 "The Northern Campaign"
farraki_classic.36.d:0 "Rallying cries echoed within the war tent as plans were laid out. Figurines were placed on the map, detailing the rugged terrain of Thousand Needles, the swamps of Dustwallow Marsh, and the Barrens. Troop counts, supply lines, potential depots, and terrain advantages were all carefully assessed by scouts who had traveled ahead of the campaign. The strategy took shape, addressing the immediate threats before turning to the true danger looming to the north: the Horde and the Alliance.\n\nThe Horde represents the most pressing threat. Their grip on Mulgore, the Barrens, and Durotar makes them a formidable foe of untold danger, their numbers far surpassing ours. Hardened by endless wars, their ranks are bolstered by fierce fighters and seasoned veterans - an opponent we cannot underestimate.\n\nOn the other hand, the Alliance lurks from Theramore, their eyes set upon the western continent with undisguised ambition. Their intentions were made clear when the Kul Tiran navy arrived years ago, before being repelled by the Horde. While they may seem a more manageable threat for now, their allies across the sea remain a powerful force we would struggle to match on open battlefields. We must tread carefully before attempting to weaken these great powers.\n\nStill, many lesser foes stand in the way—minor enemies that must be swept aside before the larger forces can be challenged. Strategic patience and caution will guide us as we prepare to strike."
farraki_classic.36.option.1:0 "We look northward"

