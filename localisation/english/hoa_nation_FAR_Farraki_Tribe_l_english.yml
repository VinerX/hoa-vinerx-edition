#focus tree
###############################
#Stormwind_Focus:0 "Stormwind National Focus" - I need to ask - What does this do? Is this just the template for how it should look?
FAR_razorbranch_isolation:0 "Razorbranch Isolation"
FAR_razorbranch_isolation_desc:0  "We were once mighty. We were once unified under the Gurubashi Empire until the world was rent asunder in the Shattering.\n\nWe are alone."

FAR_relentless_sun:0 "Relentless Sun"
FAR_relentless_sun_desc:0 "Tanaris is a land of scorching heat with little shade. It's a hard land, and the tribe has suffered under it's ruthless glare. The battered people are weathered, but we are resilient, and endure."

FAR_secrets_of_blood_magic:0 "Secrets of Blood Magic"
FAR_secrets_of_blood_magic_desc:0 "The Sundering cast us out into the world, and we are forced to make do with the tools that we were given."

FAR_the_sandfury:0 "The Sandfury"
FAR_the_sandfury_desc:0 "Our tribe has adapted to this harsh land without our jungles. We are no longer the Razorbranch. Let us be the Sandfury"

#Jangthraze
FAR_jangthraze_the_protector:0 "Jang'thraze the Protector"
FAR_jangthraze_the_protector_desc:0 "Let us look to the concerns that lie within our borders."

FAR_temple_fortress:0 "Temple Fortress"
FAR_temple_fortress_desc:0 "Zul'Farrak is nestled into the mountains providing a defensible home that is protected from the elements of the desert. Meandering streets that echo the splendor of our past, and the hopes of a future yet to come."

FAR_desert_home:0 "Desert Home"
FAR_desert_home_desc:0 "Our home lies in the desert all the same, with sand collecting in the streets from the daily sandstorms. Even in these harrowing times, we remain firm as a tribe, and thrive within these struggles. It is time we consider providing additional comforts to our people, and encourage development of amenities long desired."

FAR_establish_bazaar:0 "Establish the Bazaar"
FAR_establish_bazaar_desc:0 "A bazaar would do well to cultivate our culture, and provides a unique opportunity to invite traders from our far-flung brethren. That space may also serve our own merchants, limited as they are in these times."

FAR_bazaar_conundrum:0 "Bazaar Conundrum"
FAR_bazaar_conundrum_desc:0 "The bazaar has been a success! We have been able to clear more ground, and once again must consider what we must do for our people."

FAR_unbroken_peace:0 "Unbroken Peace"
FAR_unbroken_peace_desc:0 "Zul'Farrak has been beset by many scum from the Alliance and Horde, but never our own people. We stand resolute, and suffer no betrayals from within."

FAR_gahzridian_gifts:0 "Gahzridian Gifts"
FAR_gahzridian_gifts_desc:0 "Let us spread amongst the people icons of our deity. Let the icons grant us the favor of Gahz'rilla, and honor his place in our society."

FAR_the_pinnacle:0 "The Pinnacle"
FAR_the_pinnacle_desc:0 "At the heart of our great city lies a great pyramid. We commit sacrifices to the Loa here, and are given fruits from this labor. As we rise, we may consider dedicating ourselves more to one of our Loa."

FAR_sandfury_hold:0 "Sandfury Hold"
FAR_sandfury_hold_desc:0 "Sandfury Hold rises above Zul'Farrak overseeing our people. Chief Ukorz reigns from this lofty seat, and guides our tribe to a better future. A future rife with war if he follows his dreams."

FAR_self_sufficient:0 "Self Sufficient"
FAR_self_sufficient_desc:0 "The Sandfury have been alone since the Shattering. Far flung out of reach from our brethren, the tribe stands alone. Trust yourself when you are alone, and the desert night is closing in around you."

FAR_encourage_witchdoctors:0 "Encourage Witchdoctors"
FAR_encourage_witchdoctors_desc:0 "The local witchdoctor has been collecting our dead. He said he can breath life into their dessicated corpses. This rings of disrespect for our fallen... But we are wounded from fighting the greedy goblins, the lapdogs of the Alliance, and the bedragled members of this Horde. Maybe we should hear his idea out.."

FAR_thekas_ward:0 "Theka's Ward"
FAR_thekas_ward_desc:0 "Glorious Theka laid down his life agains the Qiraji menace. His martyrdom ensured our survival, and even in death he keeps watch over our city."

FAR_survival_of_the_fittest:0 "Survival of the Fittest"
FAR_survival_of_the_fittest_desc:0 "A snakebite can kill as easily as a spear. This inhospitable land has left no succor for those who can not seize their fate. The desert claims the weak, and leaves only the strongest."

FAR_ukorz_dream:0 "Ukorz Dream"
FAR_ukorz_dream_desc:0 "Chief Ukorz Sandscalp stands within Sandfury Hold reminating on the future he seeks for his people. The way forward will be bloody. There will be losses, but he will let none stand in the way of his Farraki Empire. Let them all feel the Sands' fury."

FAR_sandfury_empire:0 "Sandfury Empire"
FAR_sandfury_empire_desc:0 "Zul'Farrak stands revitalized amidst shaded corridors, and alcoves contain enshrouded fountains that provide water for the inhabitants. The ring of hammers, the fragrances of herbs, and the buzz of the city delight the people as they find their culture thriving. No longer will our people worry for their future. It is secure as long as the tribe yet remains."

#Sangthraze
FAR_sangthraze_the_deflector:0 "Sang'thraze the Deflector"
FAR_sangthraze_the_deflector_desc:0 "The desert is ours. How dare these mongrels lay claim to our homeland?! This outrage will not go unchallenged. The altars of Zul'Farrak stand ready to receive the blood of the weak."

FAR_ancient_foes:0 "Ancient Foes"
FAR_ancient_foes_desc:0 "The Qiraji still plague us. Though they are no longer the skittering menace we once faced with spear and tusk, they remain a threat. We must not forget the suffering they have inflicted upon our people in times past, and the fallen who still cry out for vengeance across the sands."

FAR_sandstorm_raids:0 "Sandstorm Raids"
FAR_sandstorm_raids_desc:0 "A powerful sandstorm has swept across the desert. This is the perfect opportunity to transport supplies away from those accursed, greedy Goblins. Let us move in under the storm’s cover and seize what we can."

FAR_ruins_of_the_past:0 "Ruins of the Past"
FAR_ruins_of_the_past_desc:0 "Our forebears once spanned the world, claiming vast and varied lands. The ruins scattered across the desert endure, much like our people—standing the test of time. Let us reclaim what is rightfully ours and restore it to its rightful purpose."

FAR_the_endless_swarms:0 "Endless Swarms"
FAR_the_endless_swarms_desc:0 "These ceaseless pests, ever skittering and swarming, cannot be allowed to persist unchecked. We must address this threat, not only to appease our ancestors from the afterlife but also to secure our future. If anyone must fall, let it be them."

FAR_the_loas_guidance:0 "The Loa's Guidance"
FAR_the_loas_guidance_desc:0 "Let us call upon the Loa for guidance. They have fought eternal battles and stood with us against these threats before. Perhaps Kimbul will lend his ferocity to our warriors, or Shadra will ensnare our enemies with her poisonous deceit. And Mueh'Zala, the embodiment of death itself—let us be his hands, delivering these cretins to the beyond."

FAR_dangerous_prisoners:0 "Dangerous Prisoners"
FAR_dangerous_prisoners_desc:0 "The Goblins are ingenious people - that is undeniable. Their city contains many strange creations that move on their own, and produce weapons of death like none others. Let us put their minds to work solving problems for our people. Or we may walk them up the countless steps of the Zigguraut and let their blood water the sands."

FAR_trouble_at_the_chasm:0 "Trouble at the Chasm"
FAR_trouble_at_the_chasm_desc:0 "The Qiraji in the Gaping Chasm have been seen massing in the dunes. We must counter this threat immediately before they spill forth. Let us meet them with steel, and send them writhing back into their holes."

FAR_riders_in_the_sands:0 "Riders in the Sands"
FAR_riders_in_the_sands_desc:0 "Our people have grown adept at conquering beasts of this place. A kindred spirit can be found within animals.. particularly if you feed them 3 times a day."

FAR_surround_the_glade:0 "Surround the Glade"
FAR_surround_the_glade_desc:0 "The Noxious Glade seeps with horrid despair, and lies close to our home. This threat must be burnt out and rent from this place. These Silithid will threaten our people no more."

FAR_creatures_of_the_desert:0 "Creatures of the Desert"
FAR_creatures_of_the_desert_desc:0 "As we stake our claim in this place, so must we consider the place of our beasts. These animals support us, and our home. Let us seek solutions for them to ensure the good fortune that graces our budding Empire."

FAR_settle_the_chasm:0 "Settle the Chasm"
FAR_settle_the_chasm_desc:0 "The Chasm stands clear, and the depths contain only fractured tunnels. It is time we settle this place and give rise to a new settlement. This land is ours to conquer, and this position only strengthens our grip on these sands."

FAR_driven_into_the_sea:0 "Driven into the Sea"
FAR_driven_into_the_sea_desc:0 "These pirates are a plague. They stand in the way of our future, and prey upon our brethren who seek to reconnect our far flung societies. Rumors of the treasures on their island to south reach even our people's ears. Perhaps there is something to be gained that the Goblins have not yet plundered."

FAR_pacify_the_glade:0 "Pacify the Glade"
FAR_pacify_the_glade_desc:0 "The Noxious glade stands clear of the Silithid. Let us extend our reach into the sands, and secure the valuable water within. Perhaps with the help of the Loa we can return the water to the oasis that was here."

FAR_seize_the_compound:0 "Seize the Compound"
FAR_seize_the_compound_desc:0 "Ogres in the Desert? These fat oafs will consume far more than this place can provide. Let us slaughter the ones we can, and any leftover can be sacrified to the Loa. There is much blood to be spent in these sands."

FAR_murmurs_of_twilight:0 "Murmurs of Twilight"
FAR_murmurs_of_twilight_desc:0 "These ogres speak of Cho'Gall. A visionary in their uncouth words.. Perhaps he has information that may benefit us?"

FAR_punish_their_greed:0 "Punish their Greed"
FAR_punish_their_greed_desc:0 "The Goblins of Gadgetzan have been suffered long enough. They must return to their home, or face the wrath of the Sand. No longer will their grubby little hands plunge the depths for our water, and send the unenlightened into our peaceful home searching for relics that do not belong to them."

#Troll Diplomacy 
FAR_fractured_societies:0 "Fractured Societies"
FAR_fractured_societies_desc:0 "The trolls were once the mightiest empire this world had seen. Our lands stretched far, but this distance fractured our unified people. It is time we stand together again as the threats of this world seek our downfall. Perhaps we can make progress towards restoring the Empire of Zul."

FAR_fight_to_the_sea:0 "Fight to the Sea"
FAR_fight_to_the_sea_desc:0 "Re-establishing contact begins with speaking to our scattered tribes. These Wastewander Bandits block our way. Their blood will water our sands."

FAR_a_new_beginning:0 "A New Beginning"
FAR_a_new_beginning_desc:0 "We were once Gurubashi. Let us seek our old cohorts, and restablish the lines of kinship."

FAR_trade_by_sea:0 "Trade by Sea"
FAR_trade_by_sea_desc:0 "The sea is daunting for a people nearly consumed by the desert. We must conquer this new foe so that we may be respected in these coming days. May Gral see us safe from the pirates and other dangers of the sea."

FAR_the_road_home:0 "The Road Home"
FAR_the_road_home_desc:0 "The sands shift, hiding the routes we take. These shifting tides make it difficult to maintain supplies between this new port, and our secluded home. We must lay a permanent path for beasts of burden to travel."

FAR_call_for_aid:0 "Call for Aid"
FAR_call_for_aid_desc:0 "The Zandalar Mountains stood as a holy place in our past, and their aid has been loa-sent. Let us entreat them for further aid so that we may return the good grace in the future."

FAR_gurubashi_roots:0 "Gurubashi Roots"
FAR_gurubashi_roots_desc:0 "Our communications with the Gurubashi have revealed struggles not unlike ours. They retain their jungle home and thrive in Strangethorn. Let us break flatbread with them, and become closer with our ancient people."

FAR_drakkari_knowledge:0 "Drakkari Knowledge"
FAR_drakkari_knowledge_desc:0 "The Drakkari have tamed the frozen north. They struggle to the opposite of our people, and the traders do not like lingering in our home. Something about being inside a kiln? Strange thoughts from those northerners. Their knowledge is useful all the same."

FAR_strength_of_the_amani:0 "Strength of the Amani"
FAR_strength_of_the_amani_desc:0 "Our forest brethren stand in the realm eternal, eternally at war with Elves of our past. Let us seek their strength, and perhaps in time we can help them reclaim their lost home. However, we must choose between them and the Darkspear Tribe. Their emnity has not ebbed in these thousands of years."

FAR_darkspear_influence:0 "Darkspear Influence"
FAR_darkspear_influence_desc:0 "The Darkspear have found their way to this land once more, but sit at the Horde's table. They are not allowed to enter Zul'Farrak, but we may trade with them if needed. Traiterous rats. However, we must choose between them and the Amani Tribe. Their emnity has not ebbed in these thousands of years"

FAR_zandalar_reigns_forever:0 "Zandalar Reigns Forever"
FAR_zandalar_reigns_forever_desc:0 "The Zandalari represent our spiritual core. They led our people in the days past, and even in their faded glory - they still have a city made of gold. It would not hurt to garner some of their favor for the times ahead."

FAR_sandfury_aid:0 "Sandfury Aid"
FAR_sandfury_aid_desc:0 "We have reached out, and found our people where we can. They have helped us prosper and grow in these trying times."

#Sulthraze the Lasher
FAR_sulthraze_the_lasher:0 "Sul'thraze the Lasher"
FAR_sulthraze_the_lasher_desc:0 "We stand united in these sand, and our people thrive! With our lands tamed, we may look outward for new horizons. Ungoro Crater has lain our of reach for our people for ages now. It provides a fruitful opportunity that we should seize."

FAR_the_sacred_pool:0 "The Sacred Pool"
FAR_the_sacred_pool_desc:0 "The pool lies near the heart of Zul'Farrak, and represents the home of our deity - Gahz'rilla. This is a deeply spiritual place for our people. It is also strangely the only pool of water in all of Tanaris."

FAR_rise_of_a_deity:0 "Rise of a Deity"
FAR_rise_of_a_deity_desc:0 "Let us give rise to Gazh'rilla as a new god for our people. We must elevate the Hydra."

FAR_protestations_of_divinity:0 "Protestrations of Divinity"
FAR_protestations_of_divinity_desc:0 "The time has come to proclaim our new god. A grand temple be erected in Gahz'rilla's honor. There were items found in possession of the Dunemaul Ogres regarding our sacred idol. Truly nefarious words."

FAR_wreathed_in_lightning:0 "Wreathed in Lightning"
FAR_wreathed_in_lightning_desc:0 "Gahz'rilla's scales crackle with energy. Truly a god amongst us mortal. Let his rise be memorable."

FAR_collect_the_tablets:0 "Collect the Tablets"
FAR_collect_the_tablets_desc:0 "We must gather the tablets from our people and study the sacred writings. It is time we bring our Demigod into the fold. We must be prepared for Gahz'rilla's return."

FAR_broker_for_the_mallet:0 "Broker for the Mallet"
FAR_broker_for_the_mallet_desc:0 "The Sacred Mallet is across the sea in the Hinterlands. We must send envoys to secure it and return it to our people. The time is quickly coming where we will summon our Demigod to the Sacred Pool."

FAR_ring_the_gong:0 "Ring the Gong"
FAR_ring_the_gong_desc:0 "It is time. Ring the gong with the mallet and let us give rise to a new age. The time of the Hydra is upon us."

FAR_sands_of_time:0 "Sands of Time"
FAR_sands_of_time_desc:0 "A lone mountain rises to the east, ever watched by Bronze Dragons. We have not had interactions with the scaled ones, but with Tanaris falling under our sway perhaps it is time we broker a future with them."

FAR_honor_the_bronze:0 "Honor the Bronze"
FAR_honor_the_bronze_desc:0 "These dragons claim to steward the timeways. This is a noble cause that we dare not interupt, especially if they do not pursue war with us. Surely we can come to an amicable agreement."

FAR_gifts_of_time:0 "Gifts of Time"
FAR_gifts_of_time_desc:0 "The Bronze Dragonflight has sent an envoy bearing gifts from futures not ours. Marvelous things that hint at possibilities not possible for our people."

FAR_caverns_of_time:0 "Caverns of Time"
FAR_caverns_of_time_desc:0 "The Bronze called for aid with a matter. I wonder what they might need in their mountain home?"

FAR_lost_in_time:0 "Lost in Time"
FAR_lost_in_time_desc:0 "The dragons harbor dark secrets in their mountain home. Their presence offends the balance, and our people do not feel safe with Dragons lurking overhead. Strange trolls have arrived and spoken to us of Infinite possibilities in time, and how the dragons seek to head us off from our glorious destiny."

FAR_dragons_fire:0 "Dragon's Fire"
FAR_dragons_fire_desc:0 "We moved through a Sandstorm, scouting the entrance to the caverns. Before we could get any closer the Bronze Dragons lashed out and scorched the party. They took off flying across the desert scorching our tents. We've roused the dragons.. Now we must protect our people, and end these rampaging beasts."

FAR_quaking_earth:0 "Quaking Earth"
FAR_quaking_earth_desc:0 "The groan of the earth startled everyone for miles as the upheavel began. The scattered ruins outside the cavern entrance collapsed into myriad fragments of times past. The entrance is gone - swallowed by the land."

FAR_sundered_earth:0 "Sundered Earth"
FAR_sundered_earth_desc:0 "The quaking land has ceased, and left destruction in it's wake. The scouts report the mountains to the south have been rent asunder in the wake of this disasterous event."

FAR_the_fertile_valley:0 "The Fertile Valley"
FAR_the_fertile_valley_desc:0 "Un'Goro has a vibrancy matched in few places of our world. The creatures that roam these fertile grounds grow large, and grow quickly. The possibilities for our people seem endless."

FAR_pruning_the_lashers:0 "Pruning the Lashers"
FAR_pruning_the_lashers_desc:0 "These accrused weeds grasp at every step ravaging our people. We must cut back the overgrowth, and cull these growths."

FAR_scour_the_pits:0 "Scour the Pits"
FAR_scour_the_pits_desc:0 "Wandering beasts of vile tar wander this valley. Let us set them ablaze, and figure out more later. "

FAR_enemies_below:0 "Enemies Below"
FAR_enemies_below_desc:0 "These Silithid fight twice as violently as the ones we encountered in Tanaris. Peace was never an option for this vile monsters."

FAR_fighting_fire:0 "Fighting Fire"
FAR_fighting_fire_desc:0 "We've surrounded the volcano rising in the middle of this fertile land. The fire elementals must not spread any further. Let us extinguish their flame."

FAR_a_valley_of_many_gifts:0 "A Valley of Many Gifts"
FAR_a_valley_of_many_gifts_desc:0 "Beasts roam this wonderous crater. We may lack the finesse of our Zandalari relatives, but learn we shall."

FAR_the_east_wall:0 "The East Wall"
FAR_the_east_wall_desc:0 "A structure looms over the East Wall. We must investigate."

FAR_a_higher_purpose:0 "A Higher Purpose"
FAR_a_higher_purpose_desc:0 "Un'Goro represents our past, and our future. We were once Jungle Trolls. This place would allow us to be so again."

FAR_the_monsters_of_our_past:0 "The Monsters of our Past"
FAR_the_monsters_of_our_past_desc:0 "The scouts come with tidings of doom. The Silithid mass to the west in numbers unseen since the Empire of Zul. We must consider how we wish to move forward."

FAR_answers_in_the_past:0 "Answers in the Past"
FAR_answers_in_the_past_desc:0 "We must barricade ourselves away from these hateful pests. Erect a solid fortification, and we will hold them in the West while we rally support to the cause."

FAR_call_upon_the_people:0 "Call upon the people"
FAR_call_upon_the_people_desc:0 "Let us send envoys to the Gurubashi and Zandalari. We stood united against the Aqir in the past, and this is no different."

FAR_scales_of_bronze:0 "Scales of Bronze"
FAR_scales_of_bronze_desc:0 "Seek the aid of the Bronze. Surely they have seen some future where these pests have been eradicated. Perhaps they can provide aid."

FAR_call_our_loa:0 "Call our Loa"
FAR_call_our_loa_desc:0 "Beseech the Loa for aid. They stood with us in the Empire of Zul, and they will stand with us again."

FAR_mandibles_of_the_beast:0 "Mandibles of the Beast"
FAR_mandibles_of_the_beast_desc:0 "Into the mandibles of the Qiraji. We will make this place bloom with their black blood."

FAR_what_we_must_do:0 "What We Must Do"
FAR_what_we_must_do_desc:0 "The priests have brought forth frightening ideas that may help us win this war.. but at what cost?"

FAR_rally_support:0 "Rally Support"
FAR_rally_support_desc:0 "Let us send envoys to the Gurubashi and Zandalari. We stood united against the Aqir in the past, and this is no different."

FAR_drenched_in_blood:0 "Drenched in Blood"
FAR_drenched_in_blood_desc:0 "Sacrifice anyone who does not support our cause. Let our blood god drink deeply and feast on their souls so that we may yet see another day."

FAR_a_new_campaign:0 "A New Campaign"
FAR_a_new_campaign_desc:0 "Placeholder Text about the wild lands through the mountains. Pygmies, and Man-Bear-Cat things."

FAR_halls_of_origination:0 "Halls of Origination"
FAR_halls_of_origination_desc:0 "Placeholder"

FAR_titanic_watchers:0 "Titanic Watchers"
FAR_titanic_watchers_desc:0 "Placeholder"

