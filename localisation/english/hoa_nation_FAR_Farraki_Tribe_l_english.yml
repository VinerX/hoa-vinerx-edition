FAR_desert_mongrels_desc:0 "Placeholder"

FAR_the_tolvir:0 "The Tol'vir"
FAR_the_tolvir_desc:0 "Placeholder"

FAR_broken_pieces:0 "Broken Pieces"
FAR_broken_pieces_desc:0 "Placeholder"

FAR_informing_the_masses:0 "Informing the Masses"
FAR_informing_the_masses_desc:0 "Placeholder"

FAR_uldum_renewed:0 "Uldum Renewed."
FAR_uldum_renewed_desc:0 "Placeholder"

FAR_loa_and_trolls:0 "Loa and Trolls"
FAR_loa_and_trolls_desc:0 "Trollkind has always been keen of our connection to the Loa. Honor them, and bring honor to the tribe."

FAR_jakrazets_rise:0 "Jakrazet's Rise"
FAR_jakrazets_rise_desc:0 "A promising young recruit has shown success in his plans against the maruading forces we face. Perhaps we should lend him an ear?"

FAR_the_campaign_ahead:0 "The Campaign Ahead"
FAR_the_campaign_ahead_desc:0 "Jakrazet has laid out a plan to strike at our foes, and encourages us to lend him our full focus towards this campaign he has planned."

FAR_eraka_no_kimbul:0 "Eraka No Kimbul"
FAR_eraka_no_kimbul_desc:0 "God of Tigers, Lord of Beasts, The Prey's Doom /n This wild god grants fervor to our warriors."

FAR_lord_of_beasts:0 "Lord of Beasts"
FAR_lord_of_beasts_desc:0 "Further exultations for Kimbul - Let him hear us sing his praise, and drink deeply of our sacrifices."

FAR_predator_not_prey:0 "Predator, not Prey"
FAR_predator_not_prey_desc:0 "We must be like the mighty Tiger. Fear nothing, and rule these lands with a ferocity unmatched."

FAR_shadows_beckon:0 "Shadows Beckon"
FAR_shadows_beckon_desc:0 "The shadows bear many allies for our people, and whisper of ways to conquer our foes. Surely these whispers mean us no harm."

FAR_priest_duties:0 "Priest Duties"
FAR_priest_duties_desc:0 "Our priests tend our wounded, bless our sacrifices, beseech the gods and cleanse our demons. Respect is due."

FAR_ueetay_no_muehzala:0 "Ueetay No Mueh'zala"
FAR_ueetay_no_muehzala_desc:0 "Placeholder"

FAR_dreamless_sleep:0 "Dreamless Sleep"
FAR_dreamless_sleep_desc:0 "Placeholder"

