##_##
farraki_classic.23.t:0 "A Cataclysmic Event"
farraki_classic.23.d:0 "The blistering heat of the desert felt like a warm stove compared to the searing fury of dragonfire. Above the sands of Tanaris, the Bronze Dragonflight soared, their flames turning swaths of desert to glass as the Sandfury trolls launched their assault on the Caverns of Time. Dragonkin soldiers clashed with trolls among the dunes, falling one by one as they were surrounded and overwhelmed. A massive dune shifted as a dragon crashed from the sky, its great form impaled by a dozen troll spears, its lifeblood soaking into the ravenous sands. Another dragon scorched the remains of its fallen kin, but the blood-drinkers descended swiftly, eager to bottle the precious essence leaking from the corpse.\n\nThe night blazed with the fallen bodies of dragons, their numbers matched by the countless slain trolls. The sands began to shift, the earth itself trembling as upheaval struck the Tanaris desert. The ground rippled like water, and the entrance to the Caverns of Time crumbled inward as trolls struggled to stay atop the ever-quaking sands. A thunderous crack echoed from the south, where the mountains split asunder, torn apart by the earthquake."
farraki_classic.23.option.1:0 "What was that" #Maybe Placeholder

##_##
farraki_classic.24.t:0 "A Sundered Rift"
farraki_classic.24.d:0 "The mountains to our south have shifted and changed. Where once there stood an impenetrable range of peaks, two new passageways now open into ruin-filled corridors, crawling with creatures of an unknown species. To the southwest, a rift leads through statues of humanoid figures with animal features. Farther south lies a passageway through ancient ruins long untouched by our kind, avoided out of fear of the machines within. Titan markings line the corridor, though the guardian once stationed there now lies buried beneath rubble, while the light of the sun gleams from the other end of the passage.\n\nAn unfamiliar landscape stretches as far as the eye can see, yet no one can deny the mastery of stonework displayed. Towering buildings and statues stand untouched by the desert sands, casting an imposing presence in the distance.\n\n\n §RNew Focuses are available.§!"
farraki_classic.24.option.1:0 "What is this place?" #10000% placeholder text.

