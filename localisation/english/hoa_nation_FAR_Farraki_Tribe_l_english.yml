FAR_slain_loa:0 "A Dead God"
FAR_slain_loa_desc:0 "Our Loa's sacrifice must not be in vain."
FAR_united_loa:0 "The Loa United with Us"
FAR_united_loa_desc:0 "The Wild Gods stand united with us. We must push the Qiraji back!"
FAR_a_loas_sacrifice:0 "Sacrificed Loa"
FAR_a_loas_sacrifice_desc:0 "We have borrowed our Loa's strength as we desperately fight back the Qiraji tide."
FAR_appeased_loa:0 "Appeased Loa"
FAR_appeased_loa_desc:0 "The gods are pleased with these developments."

FAR_pygmy_packmules:0 "Pygmy Packmules"
FAR_pygmy_packmules_desc:0 "Well paid in coconuts."

FAR_witchdoctor_mojo_3:0 "Witchdoctor's Dark Mojo"
FAR_witchdoctor_mojo_3_desc:0 "The Fakkari use the darkest of mojos to bring their dead back to this plane. Their unblinking eyes will serve to ward away our enemies."

FAR_written_in_stone:0 "Written in Stone"
FAR_written_in_stone_desc:0 "Our people, our history is recorded in stone. Let these lessons help us reclaim what is lost to us."

FAR_abducted_adventurers:0 "Abducted Adventurers"
FAR_abducted_adventurers_desc:0 "Adventurers of the Horde & the Alliance work well at breaking rocks. The hope of escape"

FAR_rulers_of_tanaris:0 "Rulers of Tanaris"
FAR_rulers_of_tanaris_desc:0 "The Sandfury have driven out the invaders, and seized the sands of their destiny."

FAR_southsea_looted:0 "Southsea Looted"
FAR_southsea_looted_desc:0 "Our raiders plundered the pirates in a Sandstorm."

FAR_pinched_pennies:0 "Pinched Pennies"
FAR_pinched_pennies_desc:0 "Greed is it's own reward."

FAR_mazogas_quest_1:0 "Mazoga's Quest"
FAR_mazogas_quest_1_desc:0 "Mazoga has been dispatched to find the legendary weapon of our people: Sul'thraze the Lasher"
FAR_mazogas_quest_2:0 "Mazoga's Quest"
FAR_mazogas_quest_2_desc:0 "Mazoga has uncovered the location of the first half of the broken weapon."
FAR_mazogas_quest_3:0 "Mazoga's Quest"
FAR_mazogas_quest_3_desc:0 "Mazoga has determined the location of another part."
FAR_mazogas_quest_4:0 "Sul'thraze the Lasher"
FAR_mazogas_quest_4_desc:0 "Mazoga has returned with the pieces and our birthright has been restored."

FAR_captured_adventurers:0 "Captured Adventurers"
FAR_captured_adventurers_desc:0 "Adventurers make decent laborers, and if they fall behind schedule... The pyramid awaits."

FAR_flight_from_pyramid:0 "Flight from the Pyramid"
FAR_flight_from_pyramid_desc:0 "The adventurers have sprung an escape! Their labor is missed."

