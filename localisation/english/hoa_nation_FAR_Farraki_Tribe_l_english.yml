FAR_bronze_aggression_1:0 "Bronze Aggression"
FAR_bronze_aggression_1_desc:0 "Bronze Dragons fly over the desert leaving streaks of glassed sand. It is dangerous to tread the sands unprepared."
FAR_bronze_aggression_2:0 "Bronze Aggression"
FAR_bronze_aggression_2_desc:0 "The Dragonkin amidst the dunes have been ambushed when possible, cutting their numbers down ahead of our eventual conflict."
FAR_bronze_aggression_3:0 "Bronze Aggression"
FAR_bronze_aggression_3_desc:0 "Snatching a dragon from the sky is no small feat. We must proceed carefully."
FAR_bronze_aggression_4:0 "Bronze Aggression"
FAR_bronze_aggression_4_desc:0 "The way to the caverns lies open - Let us advance!"

