BWC_bladewind_chieftan:0 "Bladewind Chieftan"
POLITICS_CHIEF_BLADEWIND_DESC:0 "As Chieftan of the Bladewind Clan he was one of the first to learn about the Draenei's betrayal and butchering of many of his clan members. Eager to join the Horde for protection he led several chargers to avenge his clan and now is charged with occupying the Draenei's former capital he looks for clues to find if any remain in hiding on Draenor."
