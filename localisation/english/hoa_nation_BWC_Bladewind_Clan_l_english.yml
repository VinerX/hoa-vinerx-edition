BWC_red_pox_infections:0 "Red Pox Infections"
BWC_red_pox_infections_desc:0 "Red Pox infections have sprung up inside the Bladewind Clan, those infected either go into exile or are quarantined."
BWC_Red_Pox_Outbreak:0 "Red Pox Outbreak"
BWC_Red_Pox_Outbreak_desc:0 "The Red Pox Outbreak in the Bladewind Clan is especially terrible. It is believed that near seventy-percent of the Clan has been wiped out."
BWC_Draenei_Blues:0 "The Draenei Ordeal"
BWC_Draenei_Blues_desc:0 "Gul'dan promised the Bladewind Clan that killing the Draenei would solve the dispute with the Elementals and end the era of Turmoil."
