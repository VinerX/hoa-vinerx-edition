bladewind.1.t:0 "A Growing Outbreak"
bladewind.1.d:0 "We have been able to manage the infected up till now, but something has tipped the balance, the number of clansmen infected with the Red Pox has begun to grow, without knowing the cause we cant combat it, as we are left trying to stop the clans complete collapse."
bladewind.1.option.1:0 "With Haste!"

