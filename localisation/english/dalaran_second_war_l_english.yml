l_english:

###############################
# Dalaran Second War Focus Tree
###############################

DAL_sw_kirin_tor_rises:0 "The Kirin Tor Rises"
DAL_sw_kirin_tor_rises_desc:0 "The Horde marches upon the kingdoms of men. Archmage Antonidas has called the Council of Six to weigh the stark choice before them — remain in the spires and study, or bring the full might of the Kirin Tor to bear. Only in war can the arcane be weaponised, and only with the Alliance can we preserve civilisation itself."

DAL_sw_council_of_six:0 "Council of Six Mobilized"
DAL_sw_council_of_six_desc:0 "The six archmages of the Kirin Tor must set aside their scholarly disputes and act as one. Antonidas, Modera, and the others gather to marshal every resource the magocracy possesses. Dalaran's libraries and laboratories become engines of war."

DAL_sw_krasus_investigation:0 "Krasus's Investigation"
DAL_sw_krasus_investigation_desc:0 "Krasus — known to the Council as an eloquent elder mage, secretly the red dragon Korialstrasz — has grown deeply concerned by reports from the northern wilds. He suspects the Horde holds something far more dire than mere orcish fury: the Demon Soul, the ancient artifact that could enslave his entire flight."

DAL_sw_scrying_the_horde:0 "Scrying the Horde"
DAL_sw_scrying_the_horde_desc:0 "The arcane eye pierces where spies cannot reach. By establishing scrying chambers across the city, the Kirin Tor can monitor Horde troop movements, supply convoys, and warlock gatherings from the safety of the Violet Citadel."

DAL_sw_arcane_arsenal:0 "Arcane Arsenal"
DAL_sw_arcane_arsenal_desc:0 "The forge-fires of war demand new weaponry. The Kirin Tor are not soldiers, but a staff enchanted with arcane energies can lay low entire formations. We shall arm our mages with the tools of magical warfare."

DAL_sw_teleportation_research:0 "Teleportation Research"
DAL_sw_teleportation_research_desc:0 "Distance has always been the mage's greatest obstacle and greatest domain. If we can perfect mass teleportation, the Kirin Tor can deploy its forces anywhere the Alliance needs them — and retreat before any counter-strike can land."

DAL_sw_kelthuzad_ambition:0 "Kel'Thuzad's Ambition"
DAL_sw_kelthuzad_ambition_desc:0 "While the Council debates strategy, Archmage Kel'Thuzad grows restless. His proposals are increasingly experimental — he speaks of powers 'beyond the arcane,' of forces that can raise armies faster than any living soldier. His other council members dismiss him, but his ambition will not be ignored."

DAL_sw_red_dragonflight_ties:0 "Ties to the Red Flight"
DAL_sw_red_dragonflight_ties_desc:0 "Krasus has quietly revealed his true identity to the Council. Alarm replaces surprise: if the red flight is truly in peril, we must open formal channels with the Dragonqueen's servants before it is too late."

DAL_sw_counter_warlocks:0 "Counter-Warlock Defenses"
DAL_sw_counter_warlocks_desc:0 "The Horde brings fel magic with it — warlocks who twist the arcane into something corrupt. The Kirin Tor must harden its defenses against fel energies, shielding the minds of its mages and the walls of its city from corruption."

DAL_sw_battle_mages:0 "Train Battle-Mages"
DAL_sw_battle_mages_desc:0 "A scholar cannot win a war alone. We must train a new generation of battle-mages: spellcasters armoured, drilled, and ready to stand shoulder-to-shoulder with the Alliance footmen. The laboratory becomes the barracks."

DAL_sw_kaelthas_council:0 "Kael'thas Sunstrider"
DAL_sw_kaelthas_council_desc:0 "Prince Kael'thas of Quel'Thalas sits on the Council of Six — a living bridge between Dalaran's arcane mastery and the ancient magic of the high elves. His dual loyalty is not a weakness but a strength: through him, the Kirin Tor and Silvermoon can coordinate as never before. The elven prince argues passionately for a united arcane front against the Horde."

DAL_sw_forbidden_texts:0 "Forbidden Texts"
DAL_sw_forbidden_texts_desc:0 "Deep within the Violet Citadel archives, Kel'Thuzad has found what he was looking for — ancient volumes sealed by the Council of Tirisfal itself. Tomes on necromancy, spirit-binding, and arts forbidden since the Sundering. The knowledge calls to him... and he answers."

DAL_sw_demon_soul_discovery:0 "The Demon Soul Revealed"
DAL_sw_demon_soul_discovery_desc:0 "Krasus's worst fears are confirmed. The Horde wields the Demon Soul — the artifact created by Deathwing to enslave the other dragonflights. If the orcs control this weapon, the red flight is already doomed unless we act. The implications shatter the Council's complacency."

DAL_sw_shadow_council_detected:0 "Shadow Council Detected"
DAL_sw_shadow_council_detected_desc:0 "The scrying nets have caught something — faint fel-tainted whispers threading through the Horde command structure. A cabal of warlocks, hidden beneath the veneer of orcish warchiefs. The Shadow Council does more than advise; it directs. Exposing them may fracture the Horde from within."

DAL_sw_arcane_defenses:0 "Arcane Defenses"
DAL_sw_arcane_defenses_desc:0 "The old wards around Dalaran were built for scholarly paranoia, not war. We must raise new barriers — shield domes capable of turning siege engines, enchantments that drain the strength of invaders. Our city shall become the Alliance's most impregnable bastion."

DAL_sw_arcane_ally:0 "Arcane Ally"
DAL_sw_arcane_ally_desc:0 "Dalaran's isolation is no longer tenable. The Council dispatches envoys to Lordaeron bearing gifts of enchanted arms and the promise of mage support. The Alliance must know that the Kirin Tor stands with them — not merely in word, but in fire and ice."

DAL_sw_necromancy_experiments:0 "Necromancy Experiments"
DAL_sw_necromancy_experiments_desc:0 "Hidden beneath the city, Kel'Thuzad has begun his work in earnest. Corpses stolen from battlefields south of Lordaeron serve as subjects. The dead answer him now — slowly, imperfectly, but they answer. The path is open, and he does not look back."

DAL_sw_warn_the_reds:0 "Warn the Red Flight"
DAL_sw_warn_the_reds_desc:0 "The Dragonqueen Alexstrasza must know what transpires. Through Krasus and his few remaining free kin, the Kirin Tor dispatches urgent word: the Demon Soul has been found, and it is in orcish hands. The warning may come too late — but silence guarantees extinction."

DAL_sw_wards_of_protection:0 "Wards of Protection"
DAL_sw_wards_of_protection_desc:0 "The new arcane wards can be extended beyond Dalaran's walls. By dispatching teams of warders to Alliance cities — Lordaeron, Stromgarde, even the Stormwind refugee camps — we can shield our allies from magical attacks and Horde warlock incursions."

DAL_sw_mages_to_front:0 "Mages to the Front"
DAL_sw_mages_to_front_desc:0 "The time for study has passed. Archmages, battle-mages, and apprentices alike are dispatched to the front lines. Every Alliance army corps gains a detachment of Kirin Tor spellcasters. Let the Horde taste what true arcane mastery means."

DAL_sw_kelthuzad_discovered:0 "Kel'Thuzad's Betrayal"
DAL_sw_kelthuzad_discovered_desc:0 "The stench of undeath could not be hidden forever. Modera's warders have uncovered Kel'Thuzad's hidden laboratory — and the horrors within. Rotting flesh, reanimated corpses, volumes of necromantic scripture. The Council of Six is shaken to its core. One of their own has fallen."

DAL_sw_kirin_tor_war_council:0 "Kirin Tor War Council"
DAL_sw_kirin_tor_war_council_desc:0 "With the wards raised and the mages deployed, Antonidas convenes the grandest war council in Dalaran's history. Every archmage, every senior battle-mage, every resource the magocracy commands is now bent toward a single purpose: victory over the Horde."

DAL_sw_dalaran_arcane_crystal:0 "The Arcane Crystal"
DAL_sw_dalaran_arcane_crystal_desc:0 "At the heart of the Violet Citadel lies a secret older than the city itself — a crystalline matrix of pure arcane energy, slowly cultivated by generations of archmages. Tapping this reservoir could supercharge every mage and ward across the continent."

DAL_sw_kelthuzad_exile:0 "Exile the Traitor"
DAL_sw_kelthuzad_exile_desc:0 "The verdict is unanimous: Kel'Thuzad is stripped of his rank, his possessions, and his place in the Kirin Tor. Driven from the city in disgrace, the former archmage vanishes into the northern wilds. Antonidas hopes this is the end of the matter."

DAL_sw_lich_king_calling:0 "A Voice in the Cold"
DAL_sw_lich_king_calling_desc:0 "From the frozen wastes of Northrend, a whisper reaches the exiled mage. The voice is ancient, patient, and impossibly powerful. It speaks of a new order, a death that transcends the pettiness of mortal kingdoms. Kel'Thuzad kneels before the darkness — and the Cult of the Damned is born."

DAL_sw_alliance_magic_treaty:0 "Alliance Magic Treaty"
DAL_sw_alliance_magic_treaty_desc:0 "Dalaran's contribution to the war has proven decisive. The Alliance kingdoms formally recognise the Kirin Tor as the supreme authority on all arcane matters. In exchange, Dalaran pledges permanent magical protection to every member state of the Alliance."

DAL_sw_kirin_tor_victory:0 "The Kirin Tor Triumphant"
DAL_sw_kirin_tor_victory_desc:0 "The Second War is won, and the Kirin Tor's arcane mastery was a decisive factor. From the scrying chambers that predicted Horde movements to the battle-mages who broke enemy lines, Dalaran earned its place as the magical heart of the Alliance. Antonidas gazes from the Violet Citadel and knows: civilisation has been preserved, for now."

###############################
# Timed Ideas
###############################

DAL_sw_council_mobilized:0 "Council of Six Mobilized"
DAL_sw_council_mobilized_desc:0 "The Council of Six is fully committed to the war effort, coordinating arcane research and military doctrine from the Violet Citadel."

DAL_sw_anti_fel_wards:0 "Anti-Fel Wards"
DAL_sw_anti_fel_wards_desc:0 "Specialized wards have been erected throughout Dalaran and key Alliance positions to detect and deflect fel-based magic."

DAL_sw_arcane_support_received:0 "Kirin Tor Arcane Support"
DAL_sw_arcane_support_received_desc:0 "A detachment of Kirin Tor battle-mages and warders has been assigned to support this nation's war effort."

DAL_sw_whispers_of_northrend:0 "Whispers of Northrend"
DAL_sw_whispers_of_northrend_desc:0 "The exiled mage hears a voice from the frozen north, promising power beyond mortal comprehension. Something stirs in the Icecrown Glacier."

###############################
# Events
###############################

dalaran_second_war.1.t:0 "The Kirin Tor War Council"
dalaran_second_war.1.d:0 "The Violet Citadel has not seen such a gathering in centuries. Every archmage of the Council of Six is present, their robes freshly pressed, their staffs glowing with contained power. Antonidas rises to speak, and the weight of his words hangs in the air like a gathering storm. 'The Horde is not a distant threat,' he declares, his voice carrying through the domed chamber. 'They will reach our gates if the kingdoms fall. The Kirin Tor has hidden behind its wards for too long. It is time to stand with the Alliance — not as advisors, but as warriors of the arcane.' Murmurs ripple through the chamber. Some archmages nod grimly; others exchange uneasy glances. But none dissent."

dalaran_second_war.1.option.1:0 "For the Alliance, with measured caution."
dalaran_second_war.1.option.2:0 "Commit everything — war demands total sacrifice."

dalaran_second_war.2.t:0 "Krasus Discovers the Truth"
dalaran_second_war.2.d:0 "Krasus returns to the Council chambers visibly shaken — a rare sight for one who has lived for millennia. He lays an ancient text before Antonidas, its pages charred and barely legible. 'The Demon Soul,' he says quietly. 'I have confirmed it. The orcs possess the artifact — and they are using it to dominate the red dragonflight.' He explains that Alexstrasza, the Dragonqueen, has been captured and is being forced to breed dragons for the Horde's war machine. The Kirin Tor now faces not merely orcs with fel magic, but a weapon forged by Deathwing himself — capable of enslaving the most powerful beings on Azeroth."

dalaran_second_war.2.option.1:0 "This changes everything. We must warn the others."

dalaran_second_war.3.t:0 "Kel'Thuzad's Forbidden Experiments"
dalaran_second_war.3.d:0 "Archmage Modera stands in the subterranean chamber and feels a cold that has nothing to do with temperature. The room is lined with cages — and within them, things that should not walk. Corpses, stitched together with crude thread and reeking of embalming fluid, shuffle against their bars. Ancient tomes of necromancy are scattered across a desk, alongside meticulous notes in Kel'Thuzad's precise handwriting. 'Light preserve us,' Modera whispers. When the guards drag Kel'Thuzad before the Council of Six, his expression is not one of shame but of contempt. 'You cling to your safe little spells while the Horde burns kingdoms to ash,' he says. 'I sought what none of you dared — the power to win.'"

dalaran_second_war.3.option.1:0 "Strip him of his rank. This cannot be forgiven."

dalaran_second_war.4.t:0 "Arcane Aid Reaches the Front"
dalaran_second_war.4.d:0 "The first reports from the front confirm what the Council had hoped: Kirin Tor battle-mages are turning the tide. At every engagement where Alliance forces have been reinforced by Dalaran's spellcasters, casualties have plummeted. Arcane shields absorb incoming fire, teleportation spells allow rapid redeployment, and the sheer psychological impact of a phalanx of mages unleashing fire and frost upon Horde formations breaks even the most disciplined orc warriors. Antonidas reads the reports with quiet satisfaction and allows himself a rare moment of hope. The Kirin Tor is no longer a city of scholars alone — it is a weapon. And it has been unleashed."

dalaran_second_war.4.option.1:0 "For Dalaran, for the Alliance."

###############################
# Council Faction Focuses
###############################

DAL_sw_antonidas_path:0 "Antonidas' Measured Path"
DAL_sw_antonidas_path_desc:0 "Archmage Antonidas believes in wisdom before fury. The Kirin Tor must commit to the war, but not recklessly — Dalaran's true strength lies in its accumulated knowledge and its ability to support every kingdom of the Alliance with careful, strategic precision."
DAL_sw_antonidas_path_tt:0 "Unlocks the Antonidas sub-branch: diplomatic and research-focused path."

DAL_sw_krasus_path:0 "Krasus' Dragonflight Alliance"
DAL_sw_krasus_path_desc:0 "Krasus — in truth the red dragon Korialstrasz — argues that the Horde's enslavement of his flight is the gravest danger the Alliance faces. He urges the Council to prioritize an alliance with what remains of the free red dragons, combining mortal magic with the power of the ancient flights."
DAL_sw_krasus_path_tt:0 "Unlocks the Krasus sub-branch: red dragonflight alliance path."

DAL_sw_modera_path:0 "Modera's Arcane Purity"
DAL_sw_modera_path_desc:0 "Archmage Modera has seen what happens when magic is corrupted — the fel-wielding warlocks of the Horde are proof enough. She advocates for absolute arcane purity: ward every city, shield every mage, and ensure that Dalaran's magic remains untouchable by the Horde's dark sorceries."
DAL_sw_modera_path_tt:0 "Unlocks the Modera sub-branch: arcane purity and defense path."

DAL_sw_kelthuzad_path:0 "Kel'Thuzad's Dark Vision"
DAL_sw_kelthuzad_path_desc:0 "Kel'Thuzad speaks with unsettling conviction. He argues that the Council has grown complacent, that the old texts sealed in the Violet Citadel vaults contain the only power capable of matching the Horde. The others call it necromancy. He calls it necessity."
DAL_sw_kelthuzad_path_tt:0 "Unlocks the Kel'Thuzad sub-branch: forbidden research path."

###############################
# Antonidas Sub-Branch
###############################

DAL_sw_diplomatic_corps:0 "Dalaran Diplomatic Corps"
DAL_sw_diplomatic_corps_desc:0 "Antonidas dispatches senior archmages to the courts of Lordaeron, Stromgarde, and the Stormwind refugees. Clad not in battle-robes but in diplomatic finery, they carry offers of arcane support, research sharing, and the full weight of the Kirin Tor's knowledge behind them."

DAL_sw_arcane_conservation:0 "Arcane Conservation"
DAL_sw_arcane_conservation_desc:0 "War strains even the deepest reservoirs of magical energy. Antonidas mandates a program of arcane conservation — refining spell efficiency, recycling ambient ley energy, and ensuring that every mote of arcane power is used precisely where it matters most."

DAL_sw_dalaran_mentors:0 "Mentors to the Alliance"
DAL_sw_dalaran_mentors_desc:0 "Antonidas offers the Kirin Tor's greatest gift: knowledge. Senior mages are dispatched to train Alliance commanders in arcane tactics, to teach battle-mages in Lordaeron's academies, and to ensure that every kingdom benefits from two thousand years of Dalaran's magical expertise."

###############################
# Krasus Sub-Branch
###############################

DAL_sw_dragonflight_embassy:0 "Dragonflight Embassy"
DAL_sw_dragonflight_embassy_desc:0 "For the first time in Dalaran's history, the Kirin Tor formally opens its gates to the red dragonflight. Free dragons who have evaded the Horde's enslavement are offered sanctuary within the city's wards, and in return, they share knowledge of the ancient world that predates mortal civilization."

DAL_sw_dragon_riders:0 "Dragon Riders of Dalaran"
DAL_sw_dragon_riders_desc:0 "A pact is struck between the Kirin Tor and the free red dragons: in exchange for Dalaran's protection and assistance against the Demon Soul, young dragons agree to bear Kirin Tor battle-mages into the skies. For the first time, the Alliance has a counter to the Horde's enslaved dragon riders."

DAL_sw_red_flight_war:0 "War of the Red Flight"
DAL_sw_red_flight_war_desc:0 "Krasus demands more than sanctuary — he demands retribution. The red dragonflight, with Dalaran's arcane backing, declares open war against the Dragonmaw clan and their orcish masters. Alexstrasza must be freed, and every Horde dragon rider must be struck from the skies."

###############################
# Modera Sub-Branch
###############################

DAL_sw_arcane_purity_doctrine:0 "Doctrine of Purity"
DAL_sw_arcane_purity_doctrine_desc:0 "Modera codifies her philosophy into law: no Kirin Tor mage shall touch fel energy, no forbidden tome shall leave the vault without her personal approval, and every spell cast must be shadow-tested for corruption. The Kirin Tor's magic will remain untainted, no matter the cost."

DAL_sw_forbidden_knowledge_vault:0 "Seal the Forbidden Vaults"
DAL_sw_forbidden_knowledge_vault_desc:0 "The deepest chambers of the Violet Citadel contain artifacts and texts sealed by the Council of Tirisfal itself. Modera orders these vaults reinforced with additional wards and guarded around the clock — not to destroy the knowledge within, but to ensure it is never used without the Council's consent."

DAL_sw_arcane_vault_guardians:0 "Vault Guardians"
DAL_sw_arcane_vault_guardians_desc:0 "A new order is established within the Kirin Tor: the Vault Guardians. These elite mages are trained not just in combat magic but in encryption, ward-casting, and counter-espionage. They protect Dalaran's most dangerous secrets from both external enemies and internal corruption."

###############################
# Kel'Thuzad Sub-Branch (Expanded)
###############################

DAL_sw_dark_bargain:0 "The Dark Bargain"
DAL_sw_dark_bargain_desc:0 "Kel'Thuzad's research has drawn whispers from beyond the grave. He proposes a direct bargain — forbidden knowledge in exchange for the power to save Dalaran. The Council is uneasy, but in wartime, even dark allies seem preferable to defeat."

DAL_sw_secret_coven:0 "The Secret Coven"
DAL_sw_secret_coven_desc:0 "Beneath Dalaran's glittering spires, in chambers known only to Kel'Thuzad and his most trusted acolytes, a coven takes shape. They wear no marks of allegiance and speak in coded phrases, but each has sworn to follow their master beyond the boundaries of sanctioned arcane practice — and perhaps beyond life itself."

DAL_sw_undead_legions:0 "Undead Legions"
DAL_sw_undead_legions_desc:0 "The dead no longer rest quietly beneath Lordaeron. Kel'Thuzad's coven has learned to raise fallen soldiers — human and orc alike — binding them to his will. The Kirin Tor now commands a second army, one that requires no food, no sleep, and knows no fear. Antonidas would be horrified."

DAL_sw_service_of_death:0 "In Service of Death"
DAL_sw_service_of_death_desc:0 "The coven's master has received a direct command from the frozen north. The Lich King speaks, and Kel'Thuzad answers. Dalaran shall become the beachhead for an invasion of the living — a citadel of undeath at the heart of the Alliance. The Council of Six is blind to what walks beneath their feet."

###############################
# Military Expansion
###############################

DAL_sw_arcane_golems:0 "Arcane Golems"
DAL_sw_arcane_golems_desc:0 "The Kirin Tor's engineers have long theorized about golems — constructs of stone and steel animated by bound arcane energy. With war upon them, theory becomes necessity. The first prototypes rise from the foundries beneath Dalaran, towering automatons that require no rider and feel no pain."

DAL_sw_war_golems:0 "War Golems"
DAL_sw_war_golems_desc:0 "The golems grow from prototypes to engines of destruction. Twice the height of a mounted knight and wreathed in crackling arcane shields, Dalaran's war golems are deployed to the front lines. Orcish axes shatter against their stone hides; even Horde siege engines struggle to bring them down."

DAL_sw_spellbreakers:0 "Spellbreakers"
DAL_sw_spellbreakers_desc:0 "Not all magical threats come from the Horde's warlocks. The Kirin Tor trains a new breed of warrior: spellbreakers, armored in enchanted plate and wielding blades that feed on the arcane. Against enemy mages, they are the ultimate counter — every spell cast against them only strengthens their resolve."

DAL_sw_kirin_tor_guard:0 "Kirin Tor Guard"
DAL_sw_kirin_tor_guard_desc:0 "The Violet Citadel has always had guardians, but wartime demands more than ceremonial sentinels. The Kirin Tor Guard is forged from the finest battle-mages and spellbreakers, equipped with the best enchanted arms Dalaran can produce. They are the tip of the arcane spear."

DAL_sw_portal_logistics:0 "Portal Logistics"
DAL_sw_portal_logistics_desc:0 "Mass teleportation has been perfected. Kirin Tor portal-masters can now open stable corridors between any two Alliance-held cities, moving troops, supplies, and refugees in hours rather than weeks. The Horde's numerical advantage evaporates when Dalaran can concentrate its forces anywhere at will."

DAL_sw_arcane_cannons:0 "Arcane Cannons"
DAL_sw_arcane_cannons_desc:0 "The fundamental principle of magical warfare is simple: concentrate and release. Dalaran's artificers have weaponized this principle into arcane cannons — siege weapons that hurl spheres of concentrated destruction across battlefields. No wall can withstand sustained bombardment from these fearsome devices."

###############################
# Intelligence & Scrying
###############################

DAL_sw_scrying_network:0 "Scrying Network"
DAL_sw_scrying_network_desc:0 "The scrying chambers of Dalaran are linked into a single great network. From the Violet Citadel, Kirin Tor diviners can monitor troop movements across the entire continent. No Horde army can march unobserved; no ambush can be laid without warning."

DAL_sw_blackrock_surveillance:0 "Blackrock Surveillance"
DAL_sw_blackrock_surveillance_desc:0 "The scrying network focuses its gaze on the Blackrock clan — the iron fist of the Horde. Their supply convoys, their troop concentrations, even their internal disputes are laid bare before the Kirin Tor's arcane eyes. Doomhammer cannot sneeze without Dalaran knowing."

DAL_sw_alterac_suspicion:0 "Eyes on Alterac"
DAL_sw_alterac_suspicion_desc:0 "Not all threats come from the Horde. Whispers reach the Kirin Tor of strange movements in Alterac — supply caravans vanishing, border patrols turning a blind eye. Modera quietly expands the scrying network over the Alterac Mountains, watching for the betrayal she suspects is coming."

DAL_sw_warlock_infiltration:0 "Warlock Infiltration"
DAL_sw_warlock_infiltration_desc:0 "The Shadow Council believes itself hidden behind a wall of fel magic and fear. They are wrong. Kirin Tor agents, protected by anti-fel wards, infiltrate the Horde's warlock circles. Every ritual, every summoning, every whispered plot between Gul'dan and his acolytes is recorded and relayed to the Violet Citadel."

###############################
# Diplomacy & Quel'Thalas
###############################

DAL_sw_kaelthas_council:0 "Kael'thas Sunstrider"
DAL_sw_kaelthas_council_desc:0 "Prince Kael'thas of Quel'Thalas sits on the Council of Six — a living bridge between Dalaran's arcane mastery and the ancient magic of the high elves. His dual loyalty is not a weakness but a strength: through him, the Kirin Tor and Silvermoon can coordinate as never before. The elven prince argues passionately for a united arcane front against the Horde."

DAL_sw_quelthalas_treaty:0 "Dalaran-Quel'Thalas Concord"
DAL_sw_quelthalas_treaty_desc:0 "Negotiated personally by Kael'thas, the Arcane Concord binds Dalaran and Quel'Thalas in a mutual defense pact and research-sharing agreement. The two greatest repositories of arcane knowledge in the world are now allies, their combined libraries and laboratories dwarfing anything the Horde can muster."

DAL_sw_united_arcane_front:0 "United Arcane Front"
DAL_sw_united_arcane_front_desc:0 "Kael'thas's vision is realized. Kirin Tor battle-mages stand alongside elven magisters on the battlefield, their spells woven together in patterns perfected over centuries. The Horde has never faced a coordinated magical assault of this magnitude — and it shows."

DAL_sw_lordaeron_mages:0 "Lordaeron Mage Corps"
DAL_sw_lordaeron_mages_desc:0 "Lordaeron commands the largest conventional army in the Alliance, but its magical capabilities are limited. Dalaran addresses this by embedding battle-mage detachments directly into Lordaeron's military command structure, giving the Alliance's backbone an arcane spine."

###############################
# Economy & Ley Lines
###############################

DAL_sw_ley_line_network:0 "Ley Line Network"
DAL_sw_ley_line_network_desc:0 "Beneath Dalaran, a network of ley lines pulses with raw arcane energy — the lifeblood of the magocracy. For millennia the Kirin Tor has drawn upon these lines passively. Now, with war demanding unprecedented magical output, Antonidas orders their active exploitation."

DAL_sw_enchantment_workshops:0 "Enchantment Workshops"
DAL_sw_enchantment_workshops_desc:0 "Every blade, every shield, every suit of armor produced in Dalaran emerges from the forges bearing arcane enhancements. Mass-enchantment techniques, perfected over decades of peace, now fuel a magical military-industrial complex."

DAL_sw_arcane_battery:0 "Arcane Batteries"
DAL_sw_arcane_battery_desc:0 "The ley lines' energy is not infinite — but it can be stored. Massive arcane batteries are constructed beneath the Violet Citadel: crystalline capacitors that accumulate magical energy during lulls and release it in devastating surges when battle demands."

DAL_sw_arcane_sanctum:0 "The Arcane Sanctum"
DAL_sw_arcane_sanctum_desc:0 "A grand new wing of the Violet Citadel rises — the Arcane Sanctum, a cathedral of magical research unmatched since the Sundering. Here, the brightest minds of Dalaran and Quel'Thalas work side by side, pushing the boundaries of arcane theory in service of the war effort."

DAL_sw_eye_of_dalaran:0 "The Eye of Dalaran"
DAL_sw_eye_of_dalaran_desc:0 "At the heart of the Arcane Sanctum, a crystalline orb pulses with gathered ley energy — the Eye of Dalaran. This artifact allows a skilled archmage to observe any location on the continent and, in theory, to project arcane force across vast distances. The ultimate tool of magical intelligence, it also draws the attention of forces the Kirin Tor cannot yet comprehend..."

###############################
# Northern Flank
###############################

DAL_sw_northern_vigil:0 "Northern Vigil"
DAL_sw_northern_vigil_desc:0 "The northern borderlands of Lordaeron are wild, sparsely populated, and dangerously close to the Amani heartlands. Dalaran cannot afford to ignore the troll threat on its flank. Watchtowers and scrying posts are established along the northern passes."

DAL_sw_anti_troll_wards:0 "Anti-Troll Wards"
DAL_sw_anti_troll_wards_desc:0 "Troll magic is primal, rooted in voodoo and blood sacrifice — fundamentally different from the arcane. The Kirin Tor's warders develop specialized defenses calibrated specifically against troll spellcraft, protecting Alliance positions from Amani hexes and curses."

DAL_sw_aid_quelthalas:0 "Aid to Quel'Thalas"
DAL_sw_aid_quelthalas_desc:0 "The Amani have not forgotten their ancient war against the high elves. With the Horde's backing, Zul'jin's forces now threaten the borders of Quel'Thalas itself. Kael'thas's homeland calls for aid, and Dalaran answers — battle-mages and warders are dispatched north to reinforce the elven defenses."

DAL_sw_northern_bastion:0 "Northern Bastion"
DAL_sw_northern_bastion_desc:0 "The northern approach to Lordaeron becomes a fortress of magic. Layered wards, scrying beacons, and Kirin Tor garrison forces transform the borderlands into a killing ground for any Amani raiding party. Even Zul'jin's most fanatical berserkers learn to fear the violet glow on the horizon."

###############################
# Active War
###############################

DAL_sw_mobilize_mages:0 "Mass Mobilization of Mages"
DAL_sw_mobilize_mages_desc:0 "The time for half-measures has passed. Every Kirin Tor mage capable of combat — from senior archmages to newly graduated apprentices — is conscripted into the war effort. The Violet Citadel empties as its scholars march to battle."

DAL_sw_war_of_mages:0 "War of the Mages"
DAL_sw_war_of_mages_desc:0 "Dalaran's full arcane might is unleashed. The Alliance front becomes a storm of fire, frost, and arcane fury. Horde formations that once broke human lines now shatter against walls of conjured flame. Orcish warlords who laughed at 'book-readers' learn terror as their warriors are incinerated from half a league away."

DAL_sw_siege_breakers:0 "Siege Breakers"
DAL_sw_siege_breakers_desc:0 "Fortified Horde positions that withstood conventional siege for months fall in days. Kirin Tor siege-mages specialize in structural collapse — their spells find the weak points in stone walls and exploit them with surgical precision. No citadel is safe."

DAL_sw_scorched_wards:0 "Scorched Earth Wards"
DAL_sw_scorched_wards_desc:0 "As the Horde pushes deeper into Alliance territory, Dalaran's warders establish defensive perimeters around civilian evacuation routes. These wards do not merely repel — they destroy. Orcs who cross the wardline are incinerated where they stand."

###############################
# Post-War
###############################

DAL_sw_rebuild_dalaran:0 "Rebuild Dalaran"
DAL_sw_rebuild_dalaran_desc:0 "The war has left scars even on the City of Magic. Damaged spires, depleted ley lines, and exhausted mages must all be restored. The reconstruction effort is led by the Council of Six, who oversee the painstaking work of magically raising fallen towers and replenishing the city's arcane reserves."

DAL_sw_internment_camps:0 "The Internment Camps"
DAL_sw_internment_camps_desc:0 "With the Horde shattered, the question of the survivors arises. Dalaran lobbies the Alliance for the captured orcs to be placed in internment camps rather than summarily executed — not purely out of mercy, but because the Kirin Tor wishes to study the orcs' strange connection to fel magic. Knowledge, even from defeated enemies, is power."

DAL_sw_study_the_orcs:0 "Study the Orcish Condition"
DAL_sw_study_the_orcs_desc:0 "Teams of Kirin Tor researchers descend upon the internment camps with notebooks and scrying crystals. They study the orcs' physiology, their language, their culture — but most of all, the lingering fel corruption in their blood. Understanding the enemy today may prevent another war tomorrow."

DAL_sw_nethergarde_keep:0 "Nethergarde Keep"
DAL_sw_nethergarde_keep_desc:0 "Though the Dark Portal was destroyed, the Kirin Tor's instruments detect a lingering rift — a weakness in reality where Draenor once connected to Azeroth. Dalaran proposes the construction of Nethergarde Keep, a fortress-mage tower to watch over the rift and warn of any attempt to reopen it."

DAL_sw_dark_portal_vigil:0 "Dark Portal Vigil"
DAL_sw_dark_portal_vigil_desc:0 "Nethergarde Keep is completed and garrisoned with some of the Kirin Tor's finest mages. Their vigil is eternal: twenty-four hours a day, every day, someone watches the rift. Should anything emerge from the gap between worlds, Dalaran will know before any other kingdom."

DAL_sw_shadows_of_northrend:0 "Shadows of Northrend"
DAL_sw_shadows_of_northrend_desc:0 "The exiled Kel'Thuzad has not been idle. Reports reach the Council of strange activity in the frozen north — lights in the sky above Icecrown, ships setting sail with no declared destination, and most disturbing, a voice that some Kirin Tor seers claim to hear in their dreams. Something ancient and patient stirs in the ice."

DAL_sw_detect_the_plague:0 "The Plague Investigation"
DAL_sw_detect_the_plague_desc:0 "Villages in northern Lordaeron report a strange sickness — not natural disease, but something tainted with necromantic energy. Dalaran's disease-mages are dispatched to investigate. What they find chills even the most hardened archmages: the Plague of Undeath, a weapon of Kel'Thuzad's design."

DAL_sw_prepare_for_darkness:0 "Prepare for the Darkness"
DAL_sw_prepare_for_darkness_desc:0 "Antonidas reads the reports with growing dread. The Cult of the Damned, Kel'Thuzad's exile, the whispers from Northrend, the plague — they are not separate threats. They are pieces of a single, terrible design. The Archmage orders a complete overhaul of Dalaran's defenses, preparing the city for a war that has not yet been declared."

###############################
# New Timed Ideas
###############################

DAL_sw_dragon_riders:0 "Dragon Riders of Dalaran"
DAL_sw_dragon_riders_desc:0 "Free red dragons have agreed to bear Kirin Tor battle-mages into battle, providing the Alliance with a desperately needed counter to Horde air superiority."

DAL_sw_vault_guardians:0 "Vault Guardians Active"
DAL_sw_vault_guardians_desc:0 "The elite Vault Guardians are actively patrolling Dalaran's arcane vaults, providing enhanced encryption and counter-espionage capabilities."

DAL_sw_anti_troll_wards:0 "Anti-Troll Wards"
DAL_sw_anti_troll_wards_desc:0 "Specialized arcane wards calibrated against troll voodoo magic have been deployed along the northern front."

###############################
# New Events
###############################

dalaran_second_war.10.t:0 "Mentors Across the Alliance"
dalaran_second_war.10.d:0 "The Kirin Tor's mage-mentors have arrived at the courts of Lordaeron, Stromgarde, and the Stormwind government-in-exile. In each kingdom, the reaction is the same: initial skepticism giving way to cautious hope as the mages demonstrate their abilities. 'We do not seek to lead your armies,' the Kirin Tor envoys explain. 'We seek to make them stronger.' War councils that once relied on mundane scouts and carrier pigeons now have access to scrying, teleportation, and arcane intelligence. The Alliance fights smarter — and it is Antonidas who gave them the tools."
dalaran_second_war.10.option.1:0 "The Kirin Tor's wisdom serves the Alliance."

dalaran_second_war.11.t:0 "The Secret Coven"
dalaran_second_war.11.d:0 "In a chamber beneath the city, lit only by necromantic candles that cast no shadows, Kel'Thuzad addresses his followers. There are barely a dozen — junior mages passed over for promotion, researchers whose 'unorthodox' interests drew suspicion, and a handful of desperate souls who see no future in the Alliance's rigid morality. 'The Council fears the dark,' Kel'Thuzad tells them, his voice a silken whisper. 'We shall embrace it. When the Horde is at the gates, they will beg for what we can provide. And we... shall name our price.' The first coven of the Cult of the Damned has taken root in Dalaran's heart."
dalaran_second_war.11.option.1:0 "Beneath the city, darkness stirs."

dalaran_second_war.12.t:0 "Dalaran's Damnation"
dalaran_second_war.12.d:0 "The Violet Citadel wakes to horror. Kel'Thuzad's coven has seized control of the Arcane Vaults, and undead constructs pour through the streets. Archmage Antonidas rallies the loyalist mages, but the coup is swift, brutal, and well-planned. When the sun rises over Dalaran, the purple banners of the Kirin Tor have been replaced with the death's-head sigil of the Cult of the Damned. Kel'Thuzad ascends the steps of the Violet Citadel as Archmage no longer — now he is the Lich King's herald, and Dalaran is his to command."
dalaran_second_war.12.option.1:0 "The Kirin Tor is dead. Long live the Lich King."

dalaran_second_war.13.t:0 "Infiltration of the Shadow Council"
dalaran_second_war.13.d:0 "The Kirin Tor's warlock-infiltrators have returned with intelligence of staggering value. Gul'dan's Shadow Council is fractured, the warlock's obsession with the Tomb of Sargeras creating a rift between him and the Horde's warchief. More importantly, the scouts have identified the locations of every major Shadow Council ritual site from Khaz Modan to the Alterac Mountains. 'We know where they gather,' the chief infiltrator reports to Antonidas. 'We know when they summon. And we know that Gul'dan's loyalty to Doomhammer is... conditional.' The information could prove decisive."
dalaran_second_war.13.option.1:0 "Exploit every weakness."

dalaran_second_war.14.t:0 "The Arcane Concord"
dalaran_second_war.14.d:0 "Prince Kael'thas Sunstrider addresses both the Council of Six and, via enchanted mirror, the Convocation of Silvermoon. 'For two thousand years, Dalaran and Quel'Thalas have shared knowledge, students, and friendship. Today, we share a common enemy.' He gestures to scrying images of Horde armies massing in the Hinterlands, uncomfortably close to the elven borders. 'The Amani march with the orcs. The Dragonmaw's enslaved red dragons darken our skies. Neither of our nations can face this alone — but together, our combined arcane mastery can shatter any assault.' The Arcane Concord is signed as dawn breaks, and for the first time in millennia, the two magical superpowers of the Eastern Kingdoms stand as one."
dalaran_second_war.14.option.1:0 "Magic united shall not fall."

dalaran_second_war.15.t:0 "Mages March North"
dalaran_second_war.15.d:0 "The first columns of Kirin Tor battle-mages cross into Quel'Thalas through portals opened by Kael'thas himself. The sight of violet-robed mages filing past the ancient Runestones of the elven kingdom stirs something in both peoples: for the humans, awe at the beauty and antiquity of Silvermoon; for the elves, a grudging respect for the short-lived race that has come so far in so little time. 'The Amani will not expect mages on this front,' Kael'thas tells his commanders. 'They believe Quel'Thalas fights alone. Let us disabuse them of that notion.'"
dalaran_second_war.15.option.1:0 "Let the trolls learn what united magic can do."

dalaran_second_war.20.t:0 "The Whispers Grow Louder"
dalaran_second_war.20.d:0 "Kirin Tor seers report the same dream: a frozen throne, a voice like cracking ice, and the impossible sensation of being watched from beyond the veil of death. Kel'Thuzad is in Northrend — that much is certain — but what he serves there is something far more ancient and terrible than any mere necromancer. 'The whispers speak of a crown,' one seer reports, trembling. 'A helm of dominion. And a sword... a sword that drinks souls.' Antonidas listens in grim silence. He exiled Kel'Thuzad to end Dalaran's brush with darkness. The darkness, it seems, was only beginning."
dalaran_second_war.20.option.1:0 "We must prepare, quietly and carefully."
dalaran_second_war.20.option.2:0 "Investigate every rumor — no matter the cost."

