twilights_hammer_rise.1.t:0 "The Era of Twilight?"
twilights_hammer_rise.1.d:0 ""
twilights_hammer_rise.1.option.1:0 "What is this Philosophy?"

twilights_hammer_rise.2.t:0 "Power through Destruction"
twilights_hammer_rise.2.d:0 ""
twilights_hammer_rise.2.option.1:0 "This goes far beyond the Arcane"

twilights_hammer_rise.3.t:0 "The Emissary of Twilight"
twilights_hammer_rise.3.d:0 ""
twilights_hammer_rise.3.option.1:0 "The Pale have dwelled for too long"

twilights_hammer_rise.4.t:0 "The Twilights Hammer is Forged"
twilights_hammer_rise.4.d:0 ""
twilights_hammer_rise.4.option.1:0 "None Will stand in the Path of Twilight"

twilights_hammer.1.t:0 "A Gift from Gul’dan"
twilights_hammer.1.d:0 "Cho'galls deal with the Dark Iron Clan has proven successful. They have vacated vast territories in the Burning Steppes and cleared out Blackrock Spire, paving the way for Gul'dan and the Shadow Council to take control. In recognition of our service, Gul'dan has granted us some of his former lands in the Blasted Lands."
twilights_hammer.1.option.1:0 "We shall use the land well."
twilights_hammer.2.t:0 "Orders from the Warchief"
twilights_hammer.2.d:0 "The Warchief has tasked us with extended training of the Pale Orcs in order to make sure there combat ready to fight the Alliance. This is likely a way to prevent us from seeking other goals while the Warchief bogs us down with this mundane task."
twilights_hammer.2.option.1:0 "Let's get this over with."

twilights_hammer.3.t:0 "Whispers from the void"
twilights_hammer.3.d:0 "From the very moment Cho'gall stepped through the Dark Portal, whispers of the Void began to infiltrate his mind. Although Cho'gall had always been aware of the Void's presence on Draenor, he had never experienced its call with such overwhelming intensity. The insidious whispers stirred the Pale Orcs into a frenzy, indicating that these beckonings originated from incredibly powerful entities."
twilights_hammer.3.option.1:0 "Perhaps we can master this power."
twilights_hammer.4.t:0 "Warchiefs Orders"
twilights_hammer.4.d:0 "Warchief Blackhand has observed a troubling decline in discipline among the Pale Orcs since their arrival on Azeroth. Frustrated by their erratic behavior, he has issued a stern ultimatum to Cho'gall: impose order and control over his clan, or be prepared to be replaced by someone who can."
twilights_hammer.4.option.1:0 "The Warchief must be appeased."
twilights_hammer.5.t:0 "The Call of C'thun"
twilights_hammer.5.d:0 "The void whispers originate from ancient beings known as the Old Gods, with the most prominent voice emanating from the far west, belonging to an entity named C’Thun. C’Thun has revealed much about this world and the formidable powers of the Void. He has commanded Cho’gall to remain with the Horde and decimate the local populaces, paving the way for C’Thun’s own armies to effortlessly conquer all of Azeroth."
twilights_hammer.5.option.1:0 "The Call rallys us."
twilights_hammer.6.t:0 "Yogg-Saron's Blessing"
twilights_hammer.6.d:0 "C’Thun has revealed the name of another Old God, Yogg-Saron, who is imprisoned in a Titan facility in the far north. Though Yogg-Saron cannot project his full power while locked away, he has offered his blessing to enhance our warriors in combat."
twilights_hammer.6.option.1:0 "We welcome his blessing."
twilights_hammer.7.t:0 "Visions of N'zoth"
twilights_hammer.7.d:0 "Cho’gall had always heard a voice lurking among the whispers of the other Old Gods. After some time, he identified this voice as a third Old God known as N’Zoth the Deceiver, who, like Yogg-Saron, is imprisoned in a Titan facility, though his lies beneath the ocean. Unlike the others, N’Zoth has neither granted power nor pleaded for freedom. Instead, he has revealed a vision of Ny’alotha, an ancient empire he once ruled. N’Zoth has promised that his empire will rise again and that the Twilight’s Hammer will be the ones responsible."
twilights_hammer.7.option.1:0 "We welcome his visions."
twilights_hammer.8.t:0 "Faint Whispers from the South East"
twilights_hammer.8.d:0 "Almost drowned out by the Old Gods calls there is a faint call coming from the southwest of this world but not from a single entity. Simply calling themselves the Sha each one offers different insight into every situation becoming trustworthy advisors. While not Old Gods themselves whatever these creatures are they are still powerful agents of the void.""
twilights_hammer.8.option.1:0 "A useful ally"
twilights_hammer.9.t:0 "The Twilight Canticle"
twilights_hammer.9.d:0 "With all the Old Gods and Sha as his benefactors, Cho’gall has penned a tome he calls "The Twilight Canticle." This book details the teachings of the agents of the Void that Cho’gall has communed with and prophesizes the Hour of Twilight, when all the Old Gods will be free and rule over Azeroth. Upon reading the book, the Pale Orcs have regained their discipline and renewed their loyalty to Cho’gall, and by extension, to the Horde. In truth, the Twilight’s Hammer is merely exploiting the Horde's wars to further the ambitions of the Old Gods. Nonetheless, the Warchief will be pleased to see the clan restored to order."
twilights_hammer.9.option.1:0 "The Hour of Twilight approaches."

