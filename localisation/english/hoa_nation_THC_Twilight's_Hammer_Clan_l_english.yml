THC_highmaul_exiles:0 "Highmaul Exiles"
THC_highmaul_exiles_desc:0 "After an attempted assasination Cho'Gall led a small band of loyal followers to the fringes of Highmaul society to plot his revenge."
THC_twilight_clan:0 "Twilight's Hammer Clan"
THC_twilight_clan_desc:0 "The Twilight's Hammer Clan is one of the leading Ogre clans that took charge into the New World."
THC_dunemaul_clan:0 "Dunemaul Clan"
THC_dunemaul_clan_desc:0 "The Dunemaul Clan is a clan of Ogres residing inside the Twilight's Hammer Clan."
THC_dunemaul_clan_2:0 "Dunemaul Clan"
THC_dunemaul_clan_2_desc:0 "The Dunemaul Clan is a clan of Ogres residing inside the Twilight's Hammer Clan."
THC_bloodeye_clan:0 "Bloodeye Clan"
THC_bloodeye_clan_desc:0 "The Bloodeye Clan is a clan of Ogres residing inside the Twilight's Hammer Clan."

THC_understand_the_void:0 "To Understand the Void"
THC_understand_the_void_desc:0 ""

THC_the_pale_idea:0 "The Pale"
THC_the_pale_idea_desc:0 "The Pale orcs that make up the bulk of this clan are prone to disobey orders that do not forward their own desires and too many wandered off, never to be seen again."
THC_the_pale_idea_2:0 "The Pale"
THC_the_pale_idea_2_desc:0 "Since the clan's arrival in Azeroth through the Dark Portal, the Pale have been overwhelmed by the voices of the Void, plunging them into a chaotic frenzy and causing many to wander off, never to be seen again."
THC_the_pale_idea_3:0 "The Pale"
THC_the_pale_idea_3_desc:0 "Following the creation of the Twilight Canticle and the assurance that the Horde's war effort is the quickest path to the Hour of Twilight, the Pale Orcs have become significantly more organized."

THC_the_call_of_cthun_idea:0 "The Call of C'thun"
THC_the_call_of_cthun_idea_desc:0 "From his ancient prison within Ahn’Qiraj, C’Thun's voice resonates, reaching out to the followers of the Twilight’s Hammer."
THC_blessings_of_yogg_saron_idea:0 "Yogg-Saron's Blessing"
THC_blessings_of_yogg_saron_idea_desc:0 "Yogg-Saron has bestowed his blessing upon the Twilight’s Hammer clan, enhancing their fortitude in battle."
THC_visions_of_nzoth_idea:0 "Visions of N'zoth"
THC_visions_of_nzoth_idea_desc:0 "N’Zoth frequently grants Cho’gall visions of impending battles, empowering him to make informed decisions on when and where to engage in combat."
THC_whispers_of_the_sha_idea:0 "Whispers of the Sha"
THC_whispers_of_the_sha_idea_desc:0 "The Sha have proven to be masterful advisors to Cho’gall, each entity possessing a unique prowess over various emotions and teaching him how to expertly manipulate them."
THC_the_twilight_canticle_idea:0 "The Twilight Canticle"
THC_the_twilight_canticle_idea_desc:0 "Created by Cho’gall, the "Twilight Canticle" preaches the teachings of the Void and prophesizes the Hour of Twilight, a time when all the Old Gods will be free and rule over Azeroth."

THC_a_higher_purpose:0 "A Higher Purpose"
THC_a_higher_purpose_desc:0 "The Pale Orcs worship the powers of the Void, upon arrival on Azeroth they felt the Void call out louder and clearer than they ever had before."

THC_keep_chogall_busy_idea:0 "Keep Cho'gal Busy"
THC_keep_chogall_busy_idea_desc:0 ""

THC_exile_war:0 "War of Exiles"
THC_exile_war_desc:0 ""
