### First War
quelthalas.1.t:0 "End the Incursions"
quelthalas.1.d:0 "The Trolls of the East have been a thorn in our side for some time, they have been interfering with our garrisons as well as killing our citizens, but they always manage to scurry away into their hovels."
quelthalas.1.option.1:0 "Push them Back."

quelthalas.20.t:0 "A Bloody Task"
quelthalas.20.d:0 "We have managed to push the Forest Trolls back, but we have a feeling they will try to reclaim the area in time."
quelthalas.20.option.1:0 "Deal with any Traps."

quelthalas.21.t:0 "Bloody Defeat"
quelthalas.21.d:0 "The Ranger General has failed us, how are we meant to trust their organization if they are unable to defend our borders?"
quelthalas.21.option.1:0 "Limit the Damage."

quelthalas.22.t:0 "Recovered Totems"
quelthalas.22.d:0 "De Elves took items of power from us long ago dey left them in a box on the floor, we ave reclaimed dem at last."
quelthalas.22.option.1:0 "Da Loa be pleased mon."

quelthalas.23.t:0 "Bloody Defeat"
quelthalas.23.d:0 "De Elves ave burned our homes to de ground, dey with rue da day they messed with da Smolderthorn."
quelthalas.23.option.1:0 "Get wat we can."

### Third War
quelthalas_third_war.1.t:0 "Our place within the Alliance"
quelthalas_third_war.1.d:0 "Ever since the Second War we have been part of the human Alliance. While during the turmoil of the war this seemed like a good idea, ever since the end of the conflict we have grown disatisfied with it. The poor leadership of the humans of Lordaeron has shown itself many times since then, and it all started right at the beginning, during the war, where their incompentence led to the devastation of our precious forests by the orcs.\n\n   Speaking of, the recent events regarding the orcish internment camps established by the humans after the war is yet another proof that the humans are weak allies. With our nation seemingly gaining no benefit from this Alliance, maybe it is time we reconsider our membership."
quelthalas_third_war.1.option.1:0 "We are better off without them."
quelthalas_third_war.1.option.2:0 "No, the Alliance guarantees our security."

quelthalas_third_war.2.t.1:0 "Quel’thalas reaffirms its support for the Alliance."
quelthalas_third_war.2.t.2:0 "Quel'thalas withrdraws from the Alliance"
quelthalas_third_war.2.d.1:0 "In the wake of the Siege of Durnholde and the looming failure of the Orc Interment Act, Quel’thalas has opted to reassert its commitment to the Alliance. Despite recent setbacks, the High Elves recognize the emergence of a new Horde as an undeniable threat. Understanding that only through collective strength can the nations of the Alliance avert further devastation to their lands."
quelthalas_third_war.2.d.2:0 "Following the Siege of Durnholde and the impending failure of the Orc Interment Act, Quel’thalas has made the resolute decision to withdraw from the Alliance. Citing the Alliance's perceived inability to safeguard their forests during the Second War and the considerable resources squandered on the Internment camps. The High Elves of Quel’thalas have chosen to find their own path forward."
quelthalas_third_war.2.option.1:0 "We are stronger together."
quelthalas_third_war.2.option.2:0 "Troubling news."

quelthalas_third_war.3.t:0 "The Undead Encroachment"
quelthalas_third_war.3.d:0 "The Undead have begun to emerge from the Marshes and Pinewood, some of our forces have chosen to stay and hold the line while the citizens are evacuated back to Eversong Woods."
quelthalas_third_war.3.option.1:0 "Captain, evacuate the citizens."

quelthalas_third_war.4.t:0 "Their Safe Return"
quelthalas_third_war.4.d:0 "The Citizens of Dawnstrider Harbour have safely arrived at Goldenmist Village, however a number of our swordsmen have remained to try to assist the humans evacuate too, pray their sacrifice is not in vein."
quelthalas_third_war.4.option.1:0 "They were the best of us."

quelthalas_third_war.5.t:0 "High Elf Remnants"
quelthalas_third_war.5.d:0 "One of the refugee ships from the east has arrived with unexpected guests. A Group of High Elf Swordsmen have helped in evacuating citizens through Dawnstrider Harbour, they had decided to help us push back the Scourge.."
quelthalas_third_war.5.option.1:0 "They are more then welcome."

quelthalas_capitulation.1.t:0 "Scourging of Quel'Thalas"
quelthalas_capitulation.1.d:0 "The Murder of our people, our king, by that human monster was only the beginning of our suffering. The Bastard used the Sunwells power bring back some Necromancer from the dead and in the process tainted the Sunwell beyond our ability to clense, but we still have hope, the Prince was in Dalaran during the attack, word will reach him and the Sunstriders blood will bring us back from the brink, and then we will kill that human mongrel and his army of undead."
quelthalas_capitulation.1.option.1:0 "We will endure!"

quelthalas_capitulation.2.t:0 "The Thirst"
quelthalas_capitulation.2.d:0 "Some of the citizens have begun suffering from minor ailments that do not seem to be linked to the Undead, some of the remaining magisters believe it to be a form of withdrawal or a side effect of the Sunwells taint."
quelthalas_capitulation.2.option.1:0 "We still have plenty of reserves"

quelthalas_capitulation.3.t:0 "The Princes Return!"
quelthalas_capitulation.3.d:0 "The Prince and his retinue have returned to us, unfortunatly there is no good news on the horizon. The Prince and the Magisters have agreed that the Sunwell must be destroyed, its tainted essence is burning a hole in the land and its pressence only tempts those suffering from withdrawl to sipon mana from it. He has named Lor'themar Theron as Regent as the prince plans to take our healthiest warriors to the west of Lordaeron to help them retake the Kingdom, in time he hopes they will come to our aid."
quelthalas_capitulation.3.option.1:0 "You are looking a bit pale there."

quelthalas_remnants.1.t:0 "Retake the Harbour"
quelthalas_remnants.1.d:0 "In Order to better support the prince the Regent has commander the recapturing of the Dawnstrider Harbour, though the number of undead in the area is less then some of the other regions we still need to stay vigilant."
quelthalas_remnants.1.option.1:0 "Those are not Silverhand Knights."

quelthalas_remnants.2.t:0 "Damage Report"
quelthalas_remnants.2.d:0 "Regent, i am sorry to report but the outlook of the kingdom is grim, while the rebuilding of the Farstriders has given some of us hope their first expedition has revealed more heartache, the Farstrider retreat in the East has been barely retaken from the undead, but it would seem everyone there has enough been slaughtered or raised."
quelthalas_remnants.2.option.1:0 "Undead Bastards."

