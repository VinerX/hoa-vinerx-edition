SET_Curse_Of_Sethe:0 "The Curse of Sethe"
SET_Curse_Of_Sethe_desc:0 "The Curse of Sethe is a deathly reminder of the God Sethe. It curses Arrakoans who come near it, losing their ability to fly and becoming wretched forms of their prior selves."
SET_Cursed_Arrakoa:0 "The Cursed Ones"
SET_Cursed_Arrakoa_desc:0 "The Arrakoa who have been banished from Skyreach and corrupted by the Curse of Sethe"
