SET_talon_king_ikiss:0 "Talon King Ikiss"
POLITICS_TALON_KING_IKISS_DESC:0 "Once a respected sage of the Adherents of Rukhmar, he began research into the downfall of Terokk, which was covered up by the Adherents he served. He discovered the truth and was banished by the Adherents, thrown from the sky and lost his wings. He believed himself to be the reincarnation of Terokk, and now worships the God, Sethe."
