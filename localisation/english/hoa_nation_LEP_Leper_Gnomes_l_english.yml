LEP_Radiation_Sickness:0 "Radiation Sickness"
LEP_Radiation_Sickness_desc:0 "The radiation exposed from Gnomeregan's depths, caused by Sicco Thermaplugg, has mutated all the remaining Gnomes into their new form known as Leper Gnomes."
LEP_Legacy_Of_Sicco:0 "Legacy of Thermaplugg's Betrayal"
LEP_Legacy_Of_Sicco_desc:0 "Sicco Thermaplugg is the biggest threat that had faced Gnomeregan, even greater than the Troggs themelves. Sicco is the reason Gnomeregan is inhabitable and is behind the genocide of nearly all of Gnome-kind."
LEP_Steam_Tanks:0 "Damaged Machine Factories"
LEP_Steam_Tanks_desc:0 "Within the halls of Gnomeregan the factories whir and the gears turn. Producing more parts and chassis' for the mighty war machines."
