l_english:
 second_war.51.t:0 "The Second War Has Begun!"
 second_war.51.d:0 "    The drums of war thunder across the Eastern Kingdoms. The Orcish Horde, led by Warchief [BRC.GetLeader], has marched north from the burning ruins of Stormwind and now stands at the gates of Lordaeron.\n\n    King [LOR.GetLeader] has rallied the human kingdoms and their allies into the Alliance of Lordaeron. The fate of the entire continent hangs in the balance as the two great factions collide in a conflict that will forever be remembered as the Second War."
 second_war.51.option.1:0 "Lok'tar Ogar! Victory for the Horde!"
 second_war.51.option.2:0 "We shall answer the call. For the Alliance!"
 second_war.51.option.3:0 "Let them tear each other apart..."
