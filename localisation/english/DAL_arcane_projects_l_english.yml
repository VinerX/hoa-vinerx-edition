l_english:
 # ============================================================
 # Decision category
 # ============================================================
 DAL_arcane_projects:0 "Arcane Projects of the Kirin Tor"

 # ============================================================
 # Decorative вЂ” slot status
 # ============================================================
 DAL_ap_decoration_free:0 "All Project Slots Available"
 DAL_ap_decoration_free_desc:0 "The Kirin Tor is ready to undertake two major arcane projects simultaneously."
 DAL_ap_decoration_one:0 "One Active Project"
 DAL_ap_decoration_one_desc:0 "One major arcane project is currently occupying the attention of the Kirin Tor."
 DAL_ap_decoration_two:0 "Both Slots Occupied"
 DAL_ap_decoration_two_desc:0 "The Kirin Tor is fully committed with two concurrent arcane projects."
 DAL_ap_decoration_cooldown:0 "Arcane Recovery Period"
 DAL_ap_decoration_cooldown_desc:0 "The Kirin Tor requires a brief period of magical realignment before initiating new projects."

 # ============================================================
 # Decorative вЂ” strain levels
 # ============================================================
 DAL_ap_strain_stable_display:0 "Magical Strain: Stable"
 DAL_ap_strain_stable_display_desc:0 "The arcane infrastructure of Dalaran is operating within normal parameters."
 DAL_ap_strain_stretched_display:0 "Magical Strain: Stretched"
 DAL_ap_strain_stretched_display_desc:0 "Minor arcane fatigue is beginning to affect Dalaran's ley line systems."
 DAL_ap_strain_overload_display:0 "Magical Strain: Overloaded"
 DAL_ap_strain_overload_display_desc:0 "Significant arcane instability is disrupting Kirin Tor operations across multiple fronts."
 DAL_ap_strain_critical_display:0 "Magical Strain: Critical Instability"
 DAL_ap_strain_critical_display_desc:0 "Dalaran's arcane foundations are dangerously unstable. Catastrophic failure is a real possibility."

 # ============================================================
 # Stabilization
 # ============================================================
 DAL_ap_stabilize:0 "Stabilize Arcane Infrastructure"
 DAL_ap_stabilize_desc:0 "Devote the Kirin Tor's efforts to calming ley line fluctuations and restoring magical equilibrium. This will reduce arcane strain but occupies institutional attention."

 # ============================================================
 # FAMILY 1: Battlefield Magic
 # ============================================================

 DAL_ap_battlefield_portals:0 "Battlefield Portal Network"
 DAL_ap_battlefield_portals_desc:0 "Establish a coordinated network of arcane portals linking Alliance command centers and supply depots. Will dramatically improve reinforcement speed and reduce supply strain on the front lines."

 DAL_ap_arcane_artillery:0 "Arcane Artillery Coordination"
 DAL_ap_arcane_artillery_desc:0 "Embed Kirin Tor battle mages directly with Alliance artillery batteries. Their precise arcane calculations and magical augmentation will enhance breakthrough capabilities and offensive planning."

 DAL_ap_emergency_teleportation:0 "Emergency Teleportation"
 DAL_ap_emergency_teleportation_desc:0 "Activate the Kirin Tor's emergency translocation protocols. Reserve portal teams will provide rapid reinforcement to threatened allied positions, but this level of magical exertion carries significant strain."

 # ============================================================
 # FAMILY 2: Defensive Magic
 # ============================================================

 DAL_ap_strengthen_wards:0 "Strengthen the City Wards"
 DAL_ap_strengthen_wards_desc:0 "Devote the Kirin Tor's ward-crafters to reinforcing Dalaran's defensive enchantments. Enhanced barriers will provide greater protection against aerial assault and magical attack."

 DAL_ap_shield_strongholds:0 "Shield Allied Strongholds"
 DAL_ap_shield_strongholds_desc:0 "Dispatch ward teams to reinforce the magical defenses of major Alliance strongholds. Arcane barriers and detection wards will provide additional protection to allied cities under threat."

 DAL_ap_warning_network:0 "Arcane Warning Network"
 DAL_ap_warning_network_desc:0 "Weave a network of scrying sensors across the Alliance's defensive perimeter. These arcane detection matrices will provide advance warning of enemy movements and enhance counter-intelligence capabilities."

 # ============================================================
 # FAMILY 3: Intelligence & Scrying
 # ============================================================

 DAL_ap_scry_horde:0 "Scry the Horde Command"
 DAL_ap_scry_horde_desc:0 "Focus the Kirin Tor's most accomplished diviners on penetrating the Horde's strategic communications. Detailed intelligence on orcish troop dispositions and command intentions will be gathered."

 DAL_ap_locate_warlocks:0 "Locate Hidden Warlock Activity"
 DAL_ap_locate_warlocks_desc:0 "There are persistent reports of rogue warlocks operating behind the lines. The Kirin Tor will conduct a systematic search for clandestine fel activity, particularly related to the Stormreaver clan."

 DAL_ap_watch_sea:0 "Watch the Great Sea"
 DAL_ap_watch_sea_desc:0 "Deploy scrying orbs and arcane observers across the Great Sea to monitor Horde naval movements. Of particular interest are reports of dragon activity above the waters."

 # ============================================================
 # FAMILY 4: Dragon Research
 # ============================================================

 DAL_ap_study_dragons:0 "Study the Dragon Attacks"
 DAL_ap_study_dragons_desc:0 "The appearance of enslaved red dragons in Horde service is deeply alarming. The Kirin Tor will analyze attack patterns, dragon behaviour, and aerial combat data to develop countermeasures."

 DAL_ap_analyze_binding:0 "Analyze the Binding Magic"
 DAL_ap_analyze_binding_desc:0 "Having catalogued the dragons' behaviour, the Kirin Tor must now investigate the nature of the magic controlling them. This is dangerous work вЂ” the power to bind a Dragon Aspect is ancient and terrible."

 DAL_ap_trace_source:0 "Trace the Source"
 DAL_ap_trace_source_desc:0 "With the binding magic partially understood, the Kirin Tor can attempt to trace its origin. This investigation may reveal the location where the dragons are being held вЂ” and who controls the ancient artifact responsible."

 # ============================================================
 # FAMILY 5: Forbidden Research
 # ============================================================

 DAL_ap_study_necromancy:0 "Study Orcish Necromancy"
 DAL_ap_study_necromancy_desc:0 "Reports of orcish death knights wielding necromantic power are troubling. Some members of the Kirin Tor argue that understanding this dark art is essential for developing effective countermeasures. Others call it a dangerous path."

 DAL_ap_examine_fel:0 "Examine Captured Fel Artifacts"
 DAL_ap_examine_fel_desc:0 "Horde equipment and artifacts captured in battle show clear signs of fel corruption. A careful examination could yield valuable insights into the enemy's dark power вЂ” but handling such items carries inherent risk."

 DAL_ap_soul_research:0 "Experimental Soul Research"
 DAL_ap_soul_research_desc:0 "Archmage Kel'Thuzad has proposed a classified research program into the nature of the soul and its relationship to arcane energy. The potential knowledge is extraordinary вЂ” but so are the risks. The other members of the Council of Six would be horrified."

 # ============================================================
 # Strain spirit descriptions
 # ============================================================
 DAL_arcane_strain_mild:0 "Minor Arcane Fatigue"
 DAL_arcane_strain_mild_desc:0 "The Kirin Tor's ley line systems are showing signs of strain from intensive magical operations."

 DAL_arcane_strain_severe:0 "Significant Arcane Instability"
 DAL_arcane_strain_severe_desc:0 "Dangerous fluctuations in Dalaran's arcane infrastructure are impairing research and governance."

 DAL_arcane_strain_critical:0 "Critical Arcane Overload"
 DAL_arcane_strain_critical_desc:0 "Dalaran's magical foundations are at the breaking point. Arcane accidents, ley line ruptures, and catastrophic feedback are imminent."

 # ============================================================
 # Project spirit descriptions
 # ============================================================
 DAL_ap_portal_network:0 "Battlefield Portal Network"
 DAL_ap_portal_network_desc:0 "Arcane portals are providing rapid reinforcement and supply across Alliance lines."

 DAL_ap_arcane_artillery:0 "Arcane Artillery Support"
 DAL_ap_arcane_artillery_desc:0 "Battle mages are augmenting Alliance artillery with precise arcane calculations."

 DAL_ap_emergency_portals:0 "Emergency Teleportation Active"
 DAL_ap_emergency_portals_desc:0 "Reserve portal teams are providing emergency reinforcement to threatened positions."

 DAL_ap_city_wards:0 "Reinforced City Wards"
 DAL_ap_city_wards_desc:0 "Dalaran's defensive enchantments have been strengthened by the Kirin Tor's ward-crafters."

 DAL_ap_shield_allies:0 "Allied Stronghold Protection"
 DAL_ap_shield_allies_desc:0 "Kirin Tor ward teams are protecting major Alliance strongholds with arcane barriers."

 DAL_ap_warning_network:0 "Arcane Warning Network"
 DAL_ap_warning_network_desc:0 "A network of scrying sensors provides advance warning across Alliance territory."

 DAL_ap_scry_horde:0 "Scrying the Horde"
 DAL_ap_scry_horde_desc:0 "Kirin Tor diviners are actively penetrating Horde strategic communications."

 DAL_ap_watch_sea:0 "Watching the Great Sea"
 DAL_ap_watch_sea_desc:0 "Arcane observers monitor Horde naval and dragon movements across the Great Sea."

 DAL_ap_dragon_observations:0 "Dragon Attack Analysis"
 DAL_ap_dragon_observations_desc:0 "The Kirin Tor is systematically cataloguing red dragon attack patterns."

 DAL_ap_binding_analysis:0 "Binding Magic Investigation"
 DAL_ap_binding_analysis_desc:0 "The Kirin Tor is analyzing the ancient magic used to enslave the red dragonflight."

 DAL_ap_orc_necromancy:0 "Orcish Necromancy Study"
 DAL_ap_orc_necromancy_desc:0 "Classified research into the necromantic arts employed by the Horde's death knights."

 DAL_ap_fel_artifacts:0 "Fel Artifact Examination"
 DAL_ap_fel_artifacts_desc:0 "Captured Horde artifacts are being examined for fel corruption and dark enchantments."

 DAL_ap_soul_research:0 "Soul Research Program"
 DAL_ap_soul_research_desc:0 "Highly classified experimental research into the arcane properties of the soul."

 # ============================================================
 # Event titles
 # ============================================================
 arcane_projects.1.t:0 "Arcane Support Arrives"
 arcane_projects.1.d:0 "The Kirin Tor of Dalaran has dispatched emergency portal teams to aid our defense. Their mages bring critical magical support to our strained forces.\n\nWe must make the most of this assistance вЂ” Dalaran's resources are finite, and their attention is divided across multiple fronts."
 arcane_projects.1.option.1:0 "Their aid is most welcome."

 arcane_projects.2.t:0 "Dalaran Reinforcements Arrive"
 arcane_projects.2.d:0 "Kirin Tor mages have teleported critical supplies and arcane support to Khaz Modan. Their portal network brings much-needed magical reinforcement to our besieged defenders.\n\nThough Dalaran's resources are limited, this support may prove decisive in holding the mountain."
 arcane_projects.2.option.1:0 "Welcome reinforcements from the north."

 arcane_projects.3.t:0 "Ward Teams Dispatched"
 arcane_projects.3.d:0 "The Kirin Tor has dispatched ward-crafting teams to reinforce the magical defenses of every Alliance stronghold engaged with the Horde. Arcane barriers and detection enchantments will provide additional protection wherever our allies hold the line."
 arcane_projects.3.option.1:0 "The Alliance will feel our protection."

 arcane_projects.4.t:0 "Stronghold Wards Complete"
 arcane_projects.4.d:0 "The ward reinforcement project has concluded successfully. Alliance commanders report significant improvement in magical defenses across all major strongholds.\n\nOur contribution to the Alliance's defensive posture has not gone unnoticed."
 arcane_projects.4.option.1:0 "The wards will hold."

 arcane_projects.5.t:0 "Krasus Provides Critical Intelligence"
 arcane_projects.5.d:0 "Archmage Krasus has supplemented our Arcane Warning Network with insights that go well beyond standard scrying data. His observations of orcish troop movements show patterns no ordinary diviner would have detected.\n\nWhen asked how he obtained this information, Krasus simply noted that he has 'sources familiar with the orcs and their allies.'"
 arcane_projects.5.option.1:0 "Krasus's methods remain his own."

 arcane_projects.6.t:0 "Warlock Investigation Begins"
 arcane_projects.6.d:0 "Kirin Tor agents have begun a systematic search for hidden warlock activity. Initial scrying suggests shadowy magical signatures concentrated near orcish-held territories.\n\nThe Stormreaver clan continues to be the prime focus of our investigation."
 arcane_projects.6.option.1:0 "Follow every lead."

 arcane_projects.7.t:0 "Warlock Activity Confirmed"
 arcane_projects.7.d:0 "The investigation has confirmed significant clandestine warlock activity within the Horde. Multiple fel signatures correspond to known Stormreaver operations вЂ” but more troublingly, our diviners have detected signs of internal Horde tension.\n\nGul'dan and his warlocks appear to be pursuing objectives independent of Doomhammer's command."
 arcane_projects.7.option.1:0 "This is valuable intelligence."

 arcane_projects.8.t:0 "Dragon Movements Detected"
 arcane_projects.8.d:0 "Our observation of the Great Sea has yielded disturbing results. The Kirin Tor's scrying network has confirmed extensive red dragon deployments across the Horde's naval operations.\n\nThe dragons are not fighting willingly вЂ” their movements show signs of coercion. Something is very wrong with the red dragonflight."
 arcane_projects.8.option.1:0 "Investigate further."

 arcane_projects.9.t:0 "Dragon Attack Study Complete"
 arcane_projects.9.d:0 "The Kirin Tor has completed its analysis of red dragon attack patterns. The data reveals a systematic deployment strategy вЂ” the dragons are being used as weapons of terror and aerial dominance, but with no consideration for their survival.\n\nWhoever controls them treats the dragons as expendable assets, not living beings."
 arcane_projects.9.option.1:0 "We must understand how they are controlled."

 arcane_projects.10.t:0 "Binding Magic Analysis Complete"
 arcane_projects.10.d:0 "The Kirin Tor's investigation into the dragon binding magic has yielded both answers and deeper questions. The power controlling the red dragons stems from an artifact of immense antiquity вЂ” something pre-dating the Horde's arrival on Azeroth.\n\nThe artifact appears to resonate with the essence of the red dragonflight itself. Whoever holds it commands absolute obedience from any red dragon in its presence."
 arcane_projects.10.option.1:0 "Trace the artifact to its source."

 arcane_projects.11.t:0 "Grim Batol Revealed"
 arcane_projects.11.d:0 "The source of the dragon controlling magic has been traced to Grim Batol вЂ” the ancient Wildhammer fortress in the Twilight Highlands. The Dragonmaw clan has occupied the fortress and is using an artifact called the Demon Soul to enslave the entire red dragonflight.\n\nThe Dragon Queen, Alexstrasza, is held in chains within Grim Batol's depths. Her captivity is the key to the Horde's dragon army."
 arcane_projects.11.option.1:0 "This changes everything."

 arcane_projects.12.t:0 "Council Debates Necromantic Research"
 arcane_projects.12.d:0 "Word of the Kirin Tor's investigation into orcish necromancy has reached the Council of Six. The debate is heated.\n\nArchmage Antonidas expresses deep concern about even studying such dark arts, while other members argue that the Horde's death knights represent a threat that cannot be countered through conventional means."
 arcane_projects.12.option.1:0 "This research stays controlled."
 arcane_projects.12.option.2:0 "The ends justify the means."

 arcane_projects.13.t:0 "Fel Artifact Controversy"
 arcane_projects.13.d:0 "The examination of captured fel artifacts has produced useful intelligence вЂ” but not without cost. Several researchers have reported disturbing dreams and unnatural fatigue. The Council is divided on whether to continue this line of investigation.\n\nAntonidas argues for caution. Kel'Thuzad dismisses such concerns as 'sentimental weakness.'"
 arcane_projects.13.option.1:0 "Acknowledge the risks and proceed carefully."
 arcane_projects.13.option.2:0 "Antonidas is right вЂ” seal the artifacts."

 arcane_projects.14.t:0 "Soul Research Crisis"
 arcane_projects.14.d:0 "Kel'Thuzad's experimental soul research has produced a crisis within the Kirin Tor. Several members of the Council of Six have demanded the program be terminated immediately вЂ” but Kel'Thuzad argues that the knowledge gained is essential to the war effort.\n\nThe atmosphere in the Violet Citadel has never been more tense."
 arcane_projects.14.option.1:0 "Shut it down before it destroys us."
 arcane_projects.14.option.2:0 "Kel'Thuzad is correct вЂ” sacrifice is necessary."

 arcane_projects.20.t:0 "Krasus's Hidden Knowledge"
 arcane_projects.20.d:0 "As the Kirin Tor's dragon investigation progresses, Archmage Krasus has revealed knowledge that goes far beyond what any human wizard could know.\n\nHe speaks of the red dragonflight's internal structure, the relationship between Alexstrasza and her consorts, and the nature of the Demon Soul вЂ” an artifact whose existence was supposedly lost to history.\n\nThe other Council members exchange glances. Who вЂ” or what вЂ” is Krasus, really?"
 arcane_projects.20.option.1:0 "His secrets can wait. His information cannot."

 arcane_projects.21.t:0 "Krasus Speaks of Grim Batol"
 arcane_projects.21.d:0 "When the Council of Six discusses the Grim Batol findings, Krasus's composure finally cracks. His voice trembles with barely contained fury as he describes what the Dragonmaw are doing to the red dragonflight.\n\n'You must understand,' he says, 'the suffering in that fortress is beyond anything you can imagine. The Dragonmaw are torturing a being of pure life and compassion вЂ” and every dragon that dies under their control is a death I feel personally.'\n\nHe does not explain that last statement."
 arcane_projects.21.option.1:0 "Krasus is more than he appears."

 arcane_projects.22.t:0 "Military Demands More Support"
 arcane_projects.22.d:0 "The Alliance high command has sent an urgent request for increased magical support. Commanders on the front lines report that Horde shamans and death knights are overwhelming conventional forces.\n\nThe Kirin Tor is already stretched thin. Committing additional resources to direct combat support will accelerate our magical strain, but refusing the request could undermine Alliance morale."
 arcane_projects.22.option.1:0 "Send everything we can spare."
 arcane_projects.22.option.2:0 "We cannot risk overextension."

 arcane_projects.23.t:0 "Dangerous Research Debate"
 arcane_projects.23.d:0 "The Kirin Tor's increasing involvement in classified and controversial research has triggered a formal debate within the Council of Six.\n\nThe question before the Council is stark: how far should Dalaran go in pursuing dangerous knowledge for the sake of victory? The Horde fields death knights, fel magic, and enslaved dragons. Can we afford to fight with one hand tied behind our backs?"
 arcane_projects.23.option.1:0 "Dalaran's principles must not be compromised."
 arcane_projects.23.option.2:0 "We must adapt to survive."
 arcane_projects.23.option.3:0 "Conventional morality is a luxury we cannot afford."

 arcane_projects.24.t:0 "Quel'Thalas Requests Magical Support"
 arcane_projects.24.d:0 "An urgent missive from Silvermoon has arrived. The Amani offensive against Quel'Thalas continues to escalate, and the elven magisters request additional Kirin Tor support вЂ” specifically, ward-crafters to reinforce their defensive barriers and diviners to counter Amani shadow magic.\n\nThe ancient pact between Dalaran and Quel'Thalas compels us to respond. But the Kirin Tor's resources are finite."
 arcane_projects.24.option.1:0 "Honor the ancient pact."
 arcane_projects.24.option.2:0 "We have our own battles to fight."

 arcane_projects.25.t:0 "Critical Arcane Instability"
 arcane_projects.25.d:0 "The situation has deteriorated beyond what anyone expected. Ley line fluctuations across Dalaran are causing random arcane discharges вЂ” several research chambers have been evacuated, and two junior mages are in the infirmary with severe mana burns.\n\nThe Kirin Tor's infrastructure is at the breaking point. If we do not stabilize immediately, a catastrophic arcane cascade could cripple Dalaran's magical capabilities for months."
 arcane_projects.25.option.1:0 "Divert all non-essential magic to stabilization."

 arcane_projects.26.t:0 "Modera Demands Action"
 arcane_projects.26.d:0 "Archmage Modera has addressed the Council with characteristic directness. 'We are the most powerful magical institution on the continent,' she declares, 'and yet our battle mages are being held back from the front lines while Alliance soldiers die.'\n\nShe demands an immediate redirection of research resources toward battlefield applications. 'The war will not wait for our academic curiosity.'"
 arcane_projects.26.option.1:0 "She is right. Deploy the battle mages."
 arcane_projects.26.option.2:0 "Our research cannot be rushed for political reasons."

 arcane_projects.27.t:0 "Kel'Thuzad's Challenge"
 arcane_projects.27.d:0 "In a tense session of the Council of Six, Archmage Kel'Thuzad has openly challenged the Kirin Tor's traditional restrictions on magical research.\n\n'The Horde has enslaved a Dragon Aspect,' he argues. 'Their warlocks command demons from beyond the Twisting Nether. Their death knights raise the dead. And we sit here debating ethics while the Alliance burns.'\n\nHe proposes an immediate expansion of all classified research programs вЂ” regardless of their nature."
 arcane_projects.27.option.1:0 "Kel'Thuzad makes a compelling argument."
 arcane_projects.27.option.2:0 "Antonidas is right to oppose this madness."

 arcane_projects.28.t:0 "Antonidas Blocks Reckless Research"
 arcane_projects.28.d:0 "Archmage Antonidas has invoked his authority as leader of the Kirin Tor to halt several classified research programs that he deems unacceptably dangerous.\n\n'We are the guardians of arcane knowledge,' he reminds the Council, 'not its slaves. The moment we abandon our principles for expediency, we become no different from the warlocks we claim to oppose.'\n\nSeveral Council members quietly note that the halted programs were already yielding results."
 arcane_projects.28.option.1:0 "Principles must guide us, not convenience."
 arcane_projects.28.option.2:0 "Antonidas's caution may cost us the war."

 arcane_projects.29.t:0 "Alliance Command Demands Support"
 arcane_projects.29.d:0 "Supreme Commander Lothar's staff has sent a formal request вЂ” some would say demand вЂ” for increased Kirin Tor magical support. The strategic situation has deteriorated, and Alliance forces are stretched dangerously thin.\n\nThe request carries political weight. Refusing could damage Dalaran's standing within the Alliance, but redirecting resources will strain our already-taxed magical capabilities."
 arcane_projects.29.option.1:0 "Commit additional resources to the Alliance."
 arcane_projects.29.option.2:0 "Dalaran must conserve its strength."

 # ============================================================
 # Council debate spirit
 # ============================================================
 DAL_ap_council_debate_active:0 "Council Debate in Progress"
 DAL_ap_council_debate_active_desc:0 "The Council of Six is engaged in heated debate, consuming political capital."
