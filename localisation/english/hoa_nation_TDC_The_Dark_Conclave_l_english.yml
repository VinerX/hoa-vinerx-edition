POLITICS_ASHGAR_DESC:0 ""
POLITICS_ASHGAR_DESC_POST_SHATTERING:0 "An extremely powerful member of the Dark Conclave, he was aligned against Gul’dan during the Shattering of Draenor when the Arakkoa fell against the Orcs. Asghar was destroyed by the magicks of Kil’jaeden, and then Gul’dan’s magic brought the doomed Arakkoa back to life as ghosts. \nNow, the Dark Conclave, led by Asghar, seek to summon a great and powerful evil to destroy the Old Horde."

