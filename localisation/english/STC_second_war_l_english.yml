l_english:
 #############################################
 # STC Second War — Focus Tree
 #############################################

 # --- ACT I — The Deal ---
 STC_the_horde_contract:0 "The Horde Contract"
 STC_the_horde_contract_desc:0 "The Horde has conquered Stormwind and suddenly possesses vast wealth. They lack the maritime and industrial infrastructure to capitalize on their victory. The Steamwheedle Cartel sees an opportunity."
 STC_the_horde_contract_tt:0 "Opens Stormwind Gold contract system.\nInitiates Stormwind Gold reserves.\nGrants access to Stormwind's plundered treasury."

 STC_inspect_stormwind_coffers:0 "Inspect the Stormwind Coffers"
 STC_inspect_stormwind_coffers_desc:0 "Our agents must assess the true scale of Stormwind's captured wealth before we commit to any industrial mobilization. The books don't balance themselves."

 STC_contract_written_in_gold:0 "A Contract Written in Gold"
 STC_contract_written_in_gold_desc:0 "Sign the largest commercial agreement in Cartel history. The Horde pays in conquered gold; we deliver in warships, zeppelins, and explosives. A simple exchange — on paper."

 STC_advance_payment_required:0 "Advance Payment Required"
 STC_advance_payment_required_desc:0 "Standard business practice: no work begins until we see the gold. The Horde understands this. Let them show they're serious customers."

 STC_no_refunds_after_delivery:0 "No Refunds After Delivery"
 STC_no_refunds_after_delivery_desc:0 "Finalize the contract terms. Ships sink, zeppelins crash, sappers... have accidents. The Cartel is not responsible for battlefield outcomes. Payment is final."
 STC_no_refunds_after_delivery_tt:0 "Expands Contract Portfolio capacity."

 STC_largest_order_in_history:0 "The Largest Order in Cartel History"
 STC_largest_order_in_history_desc:0 "The Horde wants ships, zeppelins, sappers, explosives, fuel, and logistics support — all at once. This single contract will exceed our annual peacetime output. The shipyards have never seen anything like it."

 STC_hire_every_engineer:0 "Hire Every Engineer Available"
 STC_hire_every_engineer_desc:0 "Send recruitment agents to every neutral port, every independent workshop, every unemployed tinker between Kezan and Booty Bay. If they can weld, rivet, or calculate ballast, hire them."

 STC_open_emergency_credit:0 "Open Emergency Credit Lines"
 STC_open_emergency_credit_desc:0 "The Cartel's credit is good everywhere goblins trade. Expand our borrowing capacity to finance surge production. Interest rates are the Warchief's problem."
 STC_open_emergency_credit_tt:0 "Expands Contract Portfolio capacity."

 STC_import_materials_any_price:0 "Import Materials at Any Price"
 STC_import_materials_any_price_desc:0 "Steel, timber, canvas, alchemical reagents — buy everything, outbid everyone. The Horde is paying, and gold doesn't sink. Triple-shift production begins now."

 # --- The Golden Window ---
 STC_the_golden_window:0 "The Golden Window"
 STC_the_golden_window_desc:0 "As long as Stormwind gold flows, contracts are cheap, production surges, and expansion is easy. The Cartel can build industrial capacity at an unprecedented pace — but this window will not stay open forever."

 STC_reinvest_the_profits:0 "Reinvest the Profits"
 STC_reinvest_the_profits_desc:0 "Pour the contract revenue into permanent industrial expansion. New dockyards, new workshops, new warehouses. When the war ends, the Cartel will be stronger than when it started."

 STC_expand_overseas_warehouses:0 "Expand Overseas Warehouses"
 STC_expand_overseas_warehouses_desc:0 "Establish forward logistics bases across strategic ports. When the Horde needs ships repaired or supplies staged, the Cartel will already be there."

 STC_buy_rival_workshops:0 "Buy Rival Workshops"
 STC_buy_rival_workshops_desc:0 "Acquire competing workshops and shipyards outright. With Horde gold flowing, we can outbid any rival. Every acquisition strengthens our position for the postwar economy."

 STC_pocket_the_difference:0 "Pocket the Difference"
 STC_pocket_the_difference_desc:0 "Not every coin needs to go into production. Take a healthy profit now, build political capital, and keep options open. The Horde doesn't need to know our margins."

 # --- ACT II — Fleet Construction ---
 STC_build_horde_fleet:0 "Build the Horde a Fleet"
 STC_build_horde_fleet_desc:0 "The Horde controls the land but the sea belongs to the Alliance. We will change that. Steamwheedle shipyards will deliver the warships the Warchief needs to contest the waves."

 STC_build_faster_than_sink:0 "Build Faster Than They Can Sink"
 STC_build_faster_than_sink_desc:0 "The Alliance navy is formidable. Our strategy is simple: outbuild their ability to destroy. Every ship they sink, we replace with two more. The dockyards must run at maximum emergency capacity."

 STC_warchief_wants_ships:0 "The Warchief Wants Ships"
 STC_warchief_wants_ships_desc:0 "Orgrim Doomhammer has made his priorities clear: he needs warships, and he needs them yesterday. Triple-shift every dockyard, suspend non-naval contracts, and prove the Cartel delivers."

 STC_contract_shipyards:0 "Contract Shipyards"
 STC_contract_shipyards_desc:0 "Our existing dockyards cannot handle the order volume. Commission new construction: three new shipyards, funded by Stormwind gold, staffed by every shipwright who can hold a hammer."

 STC_horde_naval_logistics:0 "Horde Naval Logistics Office"
 STC_horde_naval_logistics_desc:0 "Establish a permanent logistics bureau to coordinate delivery schedules, maintenance rotations, and supply chains. The Horde fleet will run on goblin efficiency — for a modest service fee."

 STC_great_fleet_order:0 "The Great Fleet Order"
 STC_great_fleet_order_desc:0 "The largest single naval delivery in Cartel history. Battleships, destroyers, frigates — an entire fleet, built in record time, delivered to the Horde. This will be the order that every future trade prince measures themselves against."

 STC_floating_repairs:0 "Floating Repairs"
 STC_floating_repairs_desc:0 "Dispatch repair crews with mobile drydocks to forward naval bases. A damaged Horde warship should not have to sail back to Kezan for repairs. We fix them where they fight."

 STC_emergency_escort_program:0 "Emergency Escort Program"
 STC_emergency_escort_program_desc:0 "Horde convoys are being picked off by Alliance raiders. Rush-produce a class of cheap, fast escort destroyers. They don't need to be pretty — they need to be numerous."

 STC_merchant_hull_conversion:0 "Merchant Hull Conversion"
 STC_merchant_hull_conversion_desc:0 "Convert civilian merchant ships into auxiliary warships. Strip the cargo, bolt on some guns, and send them out. It's not elegant, but it works."

 STC_salvage_the_wrecks:0 "Salvage the Wrecks"
 STC_salvage_the_wrecks_desc:0 "The sea floor is littered with sunken warships. Send salvage teams to recover usable hulls, cannons, and equipment. One nation's naval disaster is another cartel's discount inventory."

 STC_standardized_hulls:0 "Standardized Hull Sections"
 STC_standardized_hulls_desc:0 "Stop building every ship as a unique artisan project. Standardize hull sections, share components across classes, and apply assembly-line logic to naval construction. It's not traditional — it's faster."

 STC_triple_shift_shipyards:0 "Triple-Shift Shipyards"
 STC_triple_shift_shipyards_desc:0 "The shipyards will run day and night, three shifts, no breaks for holidays or accidents. The Warchief pays for production, not worker safety."

 STC_cheap_hulls_big_guns:0 "Cheap Hulls, Big Guns"
 STC_cheap_hulls_big_guns_desc:0 "Skip the frills. Thin armor, minimal crew quarters, but mount the largest cannons we can cast. The Horde likes firepower. Give them what they want."

 STC_sell_victory_fleet:0 "Sell the Warchief a Victory Fleet"
 STC_sell_victory_fleet_desc:0 "A complete battle fleet: battleships as the fist, destroyers as the screen, frigates as the reach. Every ship built, every gun tested, every crew space filled. The Horde will sail into battle on Steamwheedle steel."

 # --- ACT III — Mechanical Aviation ---
 STC_eyes_above_battlefield:0 "Eyes Above the Battlefield"
 STC_eyes_above_battlefield_desc:0 "The Horde advances blindly without aerial reconnaissance. Our zeppelins can see for hundreds of miles, spot enemy formations, track fleet movements, and report back before the enemy knows they've been seen."

 STC_zeppelin_workshops:0 "Zeppelin Workshops"
 STC_zeppelin_workshops_desc:0 "Convert warehouse space into dedicated zeppelin assembly halls. Gas bag fabrication, gondola construction, engine mounting — everything under one roof for maximum output."

 STC_observation_gondolas:0 "Observation Gondolas"
 STC_observation_gondolas_desc:0 "Specialized scout zeppelins with extended-range optics and signal relay systems. These are the Horde's eyes in the sky, reporting fleet positions and army movements from altitudes no Alliance marksman can reach."

 STC_long_range_recon:0 "Long-Range Reconnaissance"
 STC_long_range_recon_desc:0 "Push the scout zeppelin's operational range beyond current limits. Larger gas bags, auxiliary fuel tanks, and two-man observer crews. If the Alliance is moving, we will know."

 STC_naval_spotting_flights:0 "Naval Spotting Flights"
 STC_naval_spotting_flights_desc:0 "Zeppelins stationed at forward bases to provide real-time naval intelligence. Alliance fleet movements, convoy routes, harbor activity — all reported back to Horde naval command within hours."

 STC_mass_produced_airframes:0 "Mass-Produced Airframes"
 STC_mass_produced_airframes_desc:0 "Standardize zeppelin components across all models. Interchangeable gas cells, modular gondolas, and assembly-line construction methods. Every workshop builds the same parts; final assembly happens anywhere."

 STC_bomb_racks:0 "Bomb Racks and Bad Ideas"
 STC_bomb_racks_desc:0 "Zeppelins were never meant to carry bombs. But the engineers have ideas — external racks, improvised fuses, and 'acceptable' structural modifications. The test results were... educational."

 STC_armored_pilot_cabins:0 "Armored Pilot Cabins"
 STC_armored_pilot_cabins_desc:0 "Losing pilots to ground fire is bad for business. Add light armor plating to the gondola, reinforced glass, and emergency gas-release systems. Dead pilots don't sign contracts."

 STC_airborne_supply:0 "Airborne Supply Contracts"
 STC_airborne_supply_desc:0 "Zeppelins can carry cargo over mountains, rivers, and enemy lines. Offer supply delivery contracts to Horde field commanders. If the army can't reach the depot, we bring the depot to the army."

 STC_mech_aviation_bureau:0 "Mechanical Aviation Bureau"
 STC_mech_aviation_bureau_desc:0 "Centralize all zeppelin operations under one authority. Research, production, pilot training, and contract management — everything organized for maximum efficiency. The Cartel now has an air force."

 # --- ACT IV — Sappers & Explosives ---
 STC_explosives_department:0 "Explosives Department"
 STC_explosives_department_desc:0 "Formalize goblin explosives expertise into a proper department. Standardize powder mixtures, test blast radii, and stop storing volatile compounds next to the lunchroom."

 STC_contract_demolition_teams:0 "Contract Demolition Teams"
 STC_contract_demolition_teams_desc:0 "Market goblin explosive expertise to Horde field commanders. Need a bridge dropped? A fort wall breached? A tunnel collapsed? Our teams arrive with the charges already lit."

 STC_sappers_for_horde:0 "Sappers for the Horde"
 STC_sappers_for_horde_desc:0 "Deploy dedicated sapper battalions to the Horde front lines. These goblins specialize in making things disappear — walls, bridges, supply depots, and occasionally themselves."

 STC_breach_human_fortresses:0 "Breach the Human Fortresses"
 STC_breach_human_fortresses_desc:0 "Alliance fortifications are designed to withstand orcish assault. Our sappers will demonstrate why stone walls and iron gates mean nothing to properly placed goblin charges."

 STC_mining_charges:0 "Mining Charges"
 STC_mining_charges_desc:0 "Develop specialized charges for mining operations. Collapse tunnels, destroy underground fortifications, and deny the enemy their subterranean advantages. The mountains will not protect them."

 STC_tunnel_demolition:0 "Tunnel Demolition"
 STC_tunnel_demolition_desc:0 "Ironforge's mountain passes are fortified nightmares. Our solution: don't attack the gates — bring the tunnel down on their heads. Controlled demolition, goblin style."

 STC_siege_engineering_office:0 "Siege Engineering Office"
 STC_siege_engineering_office_desc:0 "Establish a permanent siege engineering corps within the Cartel. Specialized training, standardized charges, and properly calculated blast radii. We're making fortress demolition a respectable profession."

 STC_bridge_destruction:0 "Bridge Destruction Contracts"
 STC_bridge_destruction_contracts_desc:0 "A single well-placed charge can delay an enemy army for weeks. Offer the Horde bridge demolition services at key crossings. The Thandol Span is structurally fascinating — from an engineering perspective."

 STC_replace_the_volunteers:0 "Replace the Volunteers"
 STC_replace_the_volunteers_desc:0 "Sapper casualties have been... higher than projected. Recruitment must keep pace. Every goblin who blows himself up learning the trade is one fewer expert to train the next class of engineers."

 # --- ACT V — Alchemy ---
 STC_industrial_alchemy:0 "Industrial Alchemy"
 STC_industrial_alchemy_desc:0 "Move alchemy from the laboratory to the production line. Standardize formulas, scale up reactions, and produce useful compounds in quantities that matter for a continental war."

 STC_fuel_substitutes:0 "Fuel Substitutes"
 STC_fuel_substitutes_desc:0 "The Horde lacks refined fuel infrastructure. Develop combustible mixtures from available materials — rendered fats, coal distillates, alchemical accelerants. It's not clean, but it burns."

 STC_volatile_compounds:0 "Volatile Compounds"
 STC_volatile_compounds_desc:0 "Push the boundaries of what constitutes a 'stable' mixture. Higher blast yields, faster burn rates, and stronger containers — with only marginally more accidental explosions."

 STC_emergency_medicine:0 "Emergency Medicine Contracts"
 STC_emergency_medicine_desc:0 "Goblin alchemy isn't just for destruction. Develop battlefield coagulants, pain suppressants, and accelerated-healing salves. Wounded Horde soldiers are still paying customers."

 STC_smoke_mixtures:0 "Smoke Mixtures"
 STC_smoke_mixtures_desc:0 "Develop tactical smoke compounds for battlefield screening. Obscure Horde troop movements, blind enemy artillery spotters, and create confusion in Alliance ranks."

 STC_fire_suppression:0 "Fire Suppression Systems"
 STC_fire_suppression_desc:0 "Goblin workshops burn down with alarming frequency. Develop fire suppression compounds that actually work. The secondary benefit is that they also extinguish Alliance incendiary attacks on Horde ships."

 STC_experimental_propellants:0 "Experimental Propellants"
 STC_experimental_propellants_desc:0 "Explore unconventional propellant mixtures for rockets and artillery. Higher velocities, longer ranges, and only occasionally catastrophic barrel failures."

 STC_chemical_workshops:0 "Chemical Workshops"
 STC_chemical_workshops_desc:0 "Establish dedicated chemical production facilities. Separate the volatile from the merely dangerous, and stop storing everything in the same warehouse. The insurance premiums alone will justify the investment."

 # --- Horde Relationship & Leverage ---
 STC_puppet_on_paper:0 "A Puppet on Paper"
 STC_puppet_on_paper_desc:0 "The Horde thinks we serve them. Good. Let them think that. The Cartel serves profit — and the Horde is currently our best customer. But customers change."

 STC_warchief_needs_us:0 "The Warchief Needs Us"
 STC_warchief_needs_us_desc:0 "With every ship delivered and every contract fulfilled, the balance of dependence shifts. The Horde cannot fight this war without Steamwheedle industry. The Warchief may not like it, but he cannot deny it."

 STC_business_before_obedience:0 "Business Before Obedience"
 STC_business_before_obedience_desc:0 "We are contractors, not clan members. The Horde's chain of command ends where our contracts begin. Make this clear, professionally and repeatedly."

 STC_cartel_is_not_clan:0 "A Cartel Is Not a Clan"
 STC_cartel_is_not_clan_desc:0 "The orcs organize by blood and loyalty. We organize by profit and contract. These are fundamentally different structures — and ours is better suited to survive the war."

 STC_demand_commercial_autonomy:0 "Demand Commercial Autonomy"
 STC_demand_commercial_autonomy_desc:0 "Present the Warchief with a simple choice: grant the Cartel commercial independence, or lose his primary source of warships, zeppelins, and sapper support. The math is not complicated."

 STC_our_ships_our_prices:0 "Our Ships, Our Prices"
 STC_our_ships_our_prices_desc:0 "Horde dependence on our naval production is now absolute. We set the prices. We set the terms. We decide which contracts to accept and which to decline. The customer is always right — but we define what 'right' means."

 STC_the_debt_ledger:0 "The Debt Ledger"
 STC_the_debt_ledger_desc:0 "The Horde owes us. Open the books, calculate the total, and present the Warchief with a complete accounting. Every unpaid contract, every deferred payment, every interest charge — all documented, all legitimate."

 STC_exclusive_shipping:0 "Exclusive Shipping Rights"
 STC_exclusive_shipping_desc:0 "Demand exclusive rights to Horde maritime logistics as debt repayment. Every supply run, every troop transport, every equipment delivery — all handled by Steamwheedle ships at Steamwheedle rates."

 STC_renegotiate_contract:0 "Renegotiate the Contract"
 STC_renegotiate_contract_desc:0 "With the Warchief's authority wavering, this is the moment to demand better terms. Higher rates, advance payments, and guaranteed minimum orders. A distracted customer is a profitable customer."

 # --- Cartel Competition ---
 STC_other_princes_watching:0 "The Other Trade Princes Are Watching"
 STC_other_princes_watching_desc:0 "Every cartel from Booty Bay to Gadgetzan is watching our Horde deal. Some are skeptical. Some are jealous. Some are already planning how to steal our contracts. We must prove this alliance is the smartest bet in goblin history."

 STC_prove_contract_profitable:0 "Prove the Horde Contract Profitable"
 STC_prove_contract_profitable_desc:0 "Announce our first-quarter results publicly. The numbers will speak for themselves: Horde gold buys real industrial growth. The other trade princes will see what they're missing."

 STC_recruit_independent_engineers:0 "Recruit Independent Engineers"
 STC_recruit_independent_engineers_desc:0 "Open recruitment offices in every goblin settlement. Steamwheedle offers better pay, bigger projects, and actual job security — relatively speaking. The best engineers in the trade will be ours."

 STC_buy_out_smaller_workshops:0 "Buy Out Smaller Workshops"
 STC_buy_out_smaller_workshops_desc:0 "Approach independent workshops with cash offers they can't refuse. Join the Steamwheedle Cartel or compete against it — and right now, competing means going out of business."

 STC_poach_rival_specialists:0 "Poach Rival Specialists"
 STC_poach_rival_specialists_desc:0 "Target the best engineers, alchemists, and shipwrights currently working for competing cartels. Offer triple their current salary, hazard pay, and a promise that Steamwheedle will still exist after the war."

 STC_steamwheedle_standard:0 "The Steamwheedle Standard"
 STC_steamwheedle_standard_desc:0 "Define the industry standard for goblin engineering. Every quality metric, every safety protocol, every production benchmark — set by us, enforced by us. Competing cartels will have to meet our standards just to bid on contracts."

 STC_corner_shipbuilding:0 "Corner the Shipbuilding Market"
 STC_corner_shipbuilding_desc:0 "Aggressively expand our dockyard capacity while Horde gold flows. By the time the war ends, Steamwheedle will own more shipbuilding capacity than every other cartel combined."

 STC_control_shipping_lanes:0 "Control the Shipping Lanes"
 STC_control_shipping_lanes_desc:0 "Shipbuilding is production. Shipping is control. Establish routes, port rights, and exclusive contracts that make every maritime trade route a Steamwheedle toll road."

 STC_undercut_other_princes:0 "Undercut the Other Princes"
 STC_undercut_other_princes_desc:0 "Use our war profits to offer below-market rates on peacetime contracts. Competing cartels cannot match our prices because they didn't have the Horde financing our expansion."

 STC_sell_success_story:0 "Sell the Success Story"
 STC_sell_success_story_desc:0 "Publish the Cartel's war earnings publicly. Every goblin from Ratchet to Kezan will see that backing the Horde was the most profitable decision in modern goblin history. Reputation is free advertising."

 # --- End-of-War Outcomes ---
 STC_coffers_are_empty:0 "The Coffers Are Empty"
 STC_coffers_are_empty_desc:0 "Stormwind's gold is gone. The captured treasury that financed our war boom has been spent — on ships, zeppelins, sappers, and industrial expansion. The question now is: what comes next?"

 STC_reduce_production:0 "Reduce Production"
 STC_reduce_production_desc:0 "Scale back the war economy. Cancel emergency shifts, mothball surplus capacity, and return to sustainable production levels. The war boom was profitable while it lasted, but forever-growth is a fantasy."

 STC_find_new_customers:0 "Find New Customers"
 STC_find_new_customers_desc:0 "The Horde was an excellent customer, but war customers are temporary. Begin cultivating peacetime trade relationships. There are always kingdoms that need ships, weapons, and goblin engineering."

 STC_separate_business_politics:0 "Separate Business from Politics"
 STC_separate_business_politics_desc:0 "Our Horde contracts were business decisions, not political alliances. Begin the process of disentangling the Cartel from Horde politics. We sell to customers — we don't join their wars."

 STC_prepare_neutrality_declaration:0 "Prepare the Neutrality Declaration"
 STC_prepare_neutrality_declaration_desc:0 "Draft a formal declaration of Cartel neutrality. We will trade with all factions, ally with none, and let the world know that Steamwheedle serves commerce, not causes."

 STC_business_with_everyone:0 "Business with Everyone"
 STC_business_with_everyone_desc:0 "The Alliance needs ships to rebuild. The Horde needs supplies to recover. Independent kingdoms need everything. The Cartel sells to all of them. War is profitable, but peace is a much larger market."

 STC_extend_credit_horde:0 "Extend Credit to the Horde"
 STC_extend_credit_horde_desc:0 "The Horde still needs ships, even if the gold has run out. Extend them credit — at profitable interest rates. Every borrowed coin becomes a future claim on Horde resources."

 STC_demand_mines_payment:0 "Demand Payment in Mines"
 STC_demand_mines_payment_desc:0 "The Horde cannot pay in gold, but they control resource-rich territories. Demand mining rights, resource concessions, and land leases as debt repayment."

 STC_debt_into_autonomy:0 "Convert Debt into Political Autonomy"
 STC_debt_into_autonomy_desc:0 "Present the Warchief with a final accounting. The Horde's debt to the Cartel has grown to a level that can only be settled one way: complete commercial independence."

 STC_bet_on_warchief:0 "Bet on the Warchief"
 STC_bet_on_warchief_desc:0 "Double down. The Cartel's future is tied to Horde victory. Commit more resources, extend more credit, and prove that Steamwheedle is the Horde's most valuable ally — not just another supplier."

 STC_permanent_horde_contracts:0 "Permanent Horde Contracts"
 STC_permanent_horde_contracts_desc:0 "Negotiate a permanent industrial partnership with the Horde. Exclusive manufacturing rights, guaranteed minimum orders, and priority access to Horde-controlled resources. We're not just contractors — we're partners."

 STC_place_at_war_council:0 "A Place at the War Council"
 STC_place_at_war_council_desc:0 "Demand a formal seat at the Horde's strategic planning table. The Cartel provides the fleet, the air support, and the logistics — we deserve a voice in how they're used."

 STC_first_among_trade_princes:0 "First Among Trade Princes"
 STC_first_among_trade_princes_desc:0 "Use our war profits, expanded shipyards, and industrial capacity to establish Steamwheedle as the dominant cartel. When goblins think of trade, they think of us. When kingdoms need ships, they call us. First among equals is still first."

 #############################################
 # STC Second War — Gold Tier Ideas
 #############################################

 STC_gold_coffers_full:0 "The Coffers Are Full"
 STC_gold_coffers_full_desc:0 "Stormwind's captured treasury is financing our entire war economy. Contracts are generous, production is surging, and the Cartel has never been richer."

 STC_gold_heavy_spending:0 "Heavy Contract Spending"
 STC_gold_heavy_spending_desc:0 "Gold is flowing out as fast as it flows in. Wartime production consumes staggering amounts of funding, but the Cartel's books remain healthy."

 STC_gold_declining:0 "Gold Reserves Declining"
 STC_gold_declining_desc:0 "The treasury is noticeably thinner than it was six months ago. Contracts are still active, but the easy spending is over. Every order must now be justified."

 STC_gold_running_dry:0 "The Contract Is Running Dry"
 STC_gold_running_dry_desc:0 "Stormwind's gold is nearly exhausted. Emergency production is increasingly difficult to finance. The Cartel faces hard choices about which contracts to maintain."

 STC_gold_payment_crisis:0 "Payment Crisis"
 STC_gold_payment_crisis_desc:0 "The gold is gone. Stormwind's treasury has been fully consumed by our war production. Without new funding, the Cartel's war economy will grind to a halt."

 #############################################
 # STC Second War — Leverage Tier Ideas
 #############################################

 STC_leverage_dominant:0 "Commercial Dominance"
 STC_leverage_dominant_desc:0 "The Cartel's position is unassailable. The Horde depends on us for ships, zeppelins, sappers, and logistics. We can demand almost anything — and get it."

 STC_leverage_growing:0 "Growing Commercial Leverage"
 STC_leverage_growing_desc:0 "The Horde increasingly relies on Steamwheedle industry. Our bargaining position strengthens with every contract delivered and every ship launched."

 STC_leverage_moderate:0 "Moderate Commercial Position"
 STC_leverage_moderate_desc:0 "The Cartel provides valuable services to the Horde, but our negotiating position remains balanced. We can push for better terms, but not dictate them."

 STC_leverage_minimal:0 "Contractor Status"
 STC_leverage_minimal_desc:0 "We are a supplier — nothing more. The Horde values our services but does not depend on them. Our political influence over the Warchief is limited."

 #############################################
 # STC Second War — New Contract Ideas
 #############################################

 STC_emergency_fleet_contract:0 "Emergency Fleet Contract"
 STC_emergency_fleet_contract_desc:0 "Dockyards running at maximum emergency output. Triple shifts, prioritized materials, and suspended civilian production. The Horde will have its fleet."

 STC_zeppelin_procurement:0 "Zeppelin Procurement Program"
 STC_zeppelin_procurement_desc:0 "Mass production of reconnaissance and transport zeppelins. Assembly lines running continuously, gas bag fabrication at peak output."

 STC_sapper_mobilization:0 "Sapper Mobilization"
 STC_sapper_mobilization_desc:0 "Full deployment of goblin sapper and demolition battalions. Fortifications, bridges, and defensive positions are targets; goblin explosives are the answer."

 STC_alchemical_procurement:0 "Alchemical Procurement"
 STC_alchemical_procurement_desc:0 "Industrial-scale production of alchemical compounds for military use. Fuels, medicines, tactical mixtures, and propellants — all manufactured in bulk."

 STC_repair_contract:0 "Emergency Drydock Repairs"
 STC_repair_contract_desc:0 "Forward repair crews and mobile drydocks dispatched to Horde naval bases. Damaged warships return to combat in record time."

 STC_logistics_contract:0 "Contract Logistics"
 STC_logistics_contract_desc:0 "The Cartel handles supply chains, convoy routing, and transport scheduling. Horde commanders can focus on fighting; we handle everything else."

 #############################################
 # STC Second War — Horde Benefit Ideas
 #############################################

 horde_goblin_sappers:0 "Goblin Sapper Support"
 horde_goblin_sappers_desc:0 "Steamwheedle sapper battalions are deployed alongside Horde forces, providing demolition expertise, fort assault capability, and a truly alarming enthusiasm for explosives."

 horde_goblin_alchemy:0 "Goblin Alchemical Support"
 horde_goblin_alchemy_desc:0 "Cartel alchemists are supplying the Horde with battlefield medicines, fuel substitutes, tactical smoke compounds, and specialty mixtures for every military situation."

 #############################################
 # STC Second War — Industrial Ideas
 #############################################

 STC_war_boom_shipyards:0 "War Boom: Shipyards"
 STC_war_boom_shipyards_desc:0 "The Cartel's dockyard capacity has been massively expanded to meet wartime demand. Ships are being constructed at a pace unprecedented in goblin history."

 STC_war_boom_aviation:0 "War Boom: Aviation"
 STC_war_boom_aviation_desc:0 "Zeppelin production has reached industrial scale. Airframes are being assembled faster than pilots can be trained to fly them."

 STC_war_boom_explosives:0 "War Boom: Explosives"
 STC_war_boom_explosives_desc:0 "Goblin explosives manufacturing has been expanded to meet Horde demand. Production is up, and accidental detonations are only slightly above projections."

 STC_triple_shift:0 "Triple-Shift Production"
 STC_triple_shift_desc:0 "All workshops and dockyards running three shifts around the clock. Output is maximized, worker safety is minimized, and maintenance is... deferred."

 STC_golden_window:0 "The Golden Window"
 STC_golden_window_desc:0 "Stormwind gold is financing production at a rate that cannot be sustained permanently. For now, the Cartel can outbuild any competitor. This era will end — but not yet."

 STC_post_boom_adjustment:0 "Post-Boom Adjustment"
 STC_post_boom_adjustment_desc:0 "The war economy is winding down. Workers are being shifted to peacetime production, emergency shifts are ending, and the Cartel is finding its new normal."

 STC_reinvested_profits:0 "Reinvested Profits"
 STC_reinvested_profits_desc:0 "A significant portion of war profits has been channeled into permanent industrial infrastructure. The Cartel's productive capacity will outlast the war."

 STC_war_emergency_demand:0 "War Emergency Demand"
 STC_war_emergency_demand_desc:0 "The Horde is losing at sea and demanding emergency production. The Cartel is responding with maximum effort — at maximum prices."

 STC_cartel_recruitment_drive:0 "Cartel Recruitment Drive"
 STC_cartel_recruitment_drive_desc:0 "Aggressive hiring across all goblin settlements has brought the best engineers, shipwrights, and alchemists into the Steamwheedle fold."

 STC_dominant_cartel:0 "The Dominant Cartel"
 STC_dominant_cartel_desc:0 "Steamwheedle has emerged from the war as the preeminent commercial power among goblin cartels. Our competitors acknowledge our supremacy — however grudgingly."

 STC_preparing_neutrality:0 "Preparing for Neutrality"
 STC_preparing_neutrality_desc:0 "The Cartel is disentangling itself from Horde political obligations. Contracts are being renegotiated, military commitments are being phased out, and a neutral commercial posture is being prepared."

 STC_declared_neutrality:0 "Declared Neutrality"
 STC_declared_neutrality_desc:0 "The Steamwheedle Cartel has formally declared commercial neutrality. We trade with all, ally with none, and let the world know that profit knows no faction."

 STC_horde_industrial_partner:0 "Horde Industrial Partner"
 STC_horde_industrial_partner_desc:0 "The Cartel is a permanent industrial partner of the Horde, with exclusive manufacturing rights, guaranteed contracts, and a voice in strategic planning."

 STC_horde_dependency_light:0 "Cartel Shipbuilding Dependency"
 STC_horde_dependency_light_desc:0 "The Horde's naval capability depends significantly on Steamwheedle shipyards. This arrangement benefits both parties — for now."

 STC_horde_dependency_heavy:0 "Deep Cartel Industrial Dependency"
 STC_horde_dependency_heavy_desc:0 "The Horde's military-industrial base is deeply integrated with Steamwheedle Cartel production capacity. Ships, zeppelins, and munitions all flow through goblin workshops. The dependency is now structural."

 #############################################
 # STC Second War — Decision Localisations
 #############################################

 STC_zeppelin_contract:0 "Zeppelin Procurement Program"
 STC_zeppelin_contract_desc:0 "Commission mass zeppelin production. Boosts our arms factory output and provides the Horde with aerial reconnaissance and transport capability."

 STC_alchemy_contract:0 "Alchemical Procurement"
 STC_alchemy_contract_desc:0 "Commission industrial-scale alchemical production. Improves supply efficiency, medical recovery, and provides tactical compounds to Horde forces."

 STC_repair_contract:0 "Emergency Drydock Repairs"
 STC_repair_contract_desc:0 "Dispatch forward repair crews and mobile drydocks. Greatly accelerates naval repair and refit speeds for the duration of the contract."

 STC_logistics_contract:0 "Contract Logistics Package"
 STC_logistics_contract_desc:0 "Handle Horde supply chains and convoy routing. Improves supply efficiency and maritime logistics."

 STC_deliver_zeppelins:0 "Deliver Zeppelin Squadron"
 STC_deliver_zeppelins_desc:0 "Transfer a squadron of completed zeppelins to the Horde. Includes bomber and scout configurations."

 STC_deliver_sappers:0 "Send Sapper Teams"
 STC_deliver_sappers_desc:0 "Deploy goblin sapper battalions to support Horde offensive operations. Fortifications will not survive their attention."

 #############################################
 # STC Second War — Event Localisations
 #############################################

 stc_contract.1.t:0 "Gold Reserves Running Low"
 stc_contract.1.d:0 "Stormwind's captured treasury is visibly thinning. Our accountants estimate that at current spending rates, the gold will not last much longer. The Trade Prince has been informed — and is already calculating what comes next."
 stc_contract.1.option.1:0 "Prepare for leaner times."

 stc_contract.2.t:0 "The Coffers Are Empty"
 stc_contract.2.d:0 "Stormwind's gold is gone. The captured treasury that financed our entire war economy has been spent — on ships, zeppelins, sappers, and industrial expansion. The Cartel now faces a critical decision: extend credit to the Horde, or wind down production and seek new customers."
 stc_contract.2.option.1:0 "Reduce production and preserve Cartel finances."
 stc_contract.2.option.2:0 "Extend credit to the Horde. They will pay — eventually."

 stc_contract.3.t:0 "The Horde Defaults"
 stc_contract.3.d:0 "The Horde has failed to meet its debt obligations. Our loans, our credit extensions, our good-faith shipments — all unpaid. The Trade Prince is furious. The question is what to do about it."
 stc_contract.3.option.1:0 "Negotiate new terms. A defaulting customer is better than no customer."
 stc_contract.3.option.2:0 "Demand immediate repayment. The Cartel does not accept excuses."

 stc_contract.4.t:0 "Naval Emergency: Horde Losing at Sea"
 stc_contract.4.d:0 "The Sea of Blood is turning against the Horde. Alliance naval superiority threatens to cut supply lines and isolate Horde forces. The Warchief is demanding emergency naval production — and is willing to pay premium rates."
 stc_contract.4.option.1:0 "Accept the emergency contract. Triple the price."
 stc_contract.4.option.2:0 "Negotiate cautiously. We profit, but not at the expense of our credibility."

 stc_contract.5.t:0 "Rival Cartel Poaching"
 stc_contract.5.d:0 "A competing cartel has approached Horde representatives with a lower bid for naval construction. They claim they can undercut our prices and match our quality. The Trade Prince knows this for the lie it is — but the Warchief may not."
 stc_contract.5.option.1:0 "Match their bid. We will not lose this contract."
 stc_contract.5.option.2:0 "Let them try. Our reputation speaks for itself."

 stc_contract.6.t:0 "The Warchief Demands Priority"
 stc_contract.6.d:0 "Orgrim Doomhammer has personally demanded that the Cartel prioritize Horde naval production above all other contracts. His authority is high, and refusal would be politically dangerous. The terms are... not negotiable."
 stc_contract.6.option.1:0 "Accept the Warchief's demands. His authority cannot be questioned."
 stc_contract.6.option.2:0 "Push back. Even the Warchief must respect the Cartel's commercial independence."

 stc_contract.7.t:0 "Warchief's Authority Wavers"
 stc_contract.7.d:0 "The Warchief's hold over the Horde is weakening. Clans question his decisions, chiefs challenge his orders, and the iron grip that once demanded our obedience is slipping. This is an opportunity to renegotiate every contract on more favorable terms."
 stc_contract.7.option.1:0 "Renegotiate from a position of strength."
 stc_contract.7.option.2:0 "Push aggressively. Demand concessions while the Warchief is vulnerable."

 stc_contract.8.t:0 "Commercial Leverage Milestone"
 stc_contract.8.d:0 "The Cartel's position within the Horde has strengthened considerably. Our ships patrol the seas, our zeppelins fill the skies, and our sappers support every major offensive. The Warchief can no longer afford to ignore us."
 stc_contract.8.option.1:0 "Excellent. Note this in the next quarterly report."

 stc_contract.9.t:0 "Industrial Accident"
 stc_contract.9.d:0 "A catastrophic accident at one of our dockyards has destroyed a nearly-completed warship and killed two dozen workers. Investigations suggest the triple-shift schedule and deferred maintenance contributed. Production will be disrupted."
 stc_contract.9.option.1:0 "Accept the losses. War production has costs."
 stc_contract.9.option.2:0 "Pay compensation to the families. Reputation matters."

 stc_contract.10.t:0 "The Cartel Declares Neutrality"
 stc_contract.10.d:0 "The Steamwheedle Cartel formally announces its return to commercial neutrality. We will trade with all nations, ally with none, and let the world know that profit, not politics, has always been our guiding principle."
 stc_contract.10.option.1:0 "Business, as always, continues."

 stc_contract.11.t:0 "The War Accounts Are Settled"
 stc_contract.11.d:0 "The Second War has ended. The Cartel's books have been balanced — the profits calculated, the losses written off, the debts recorded. History will remember this war for its battles and betrayals. Steamwheedle will remember it as our most profitable quarter."
 stc_contract.11.option.1:0 "Close the books."

