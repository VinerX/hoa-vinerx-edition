 STC_gold_contract_renew_tt:0 "Consumes 10 Stormwind Gold\nRenews all expired contracts"
 STC_contracts_completed:0 "Contracts Completed"
 STC_contracts_completed_desc:0 "Our previous war contracts have expired. They can be renewed."

