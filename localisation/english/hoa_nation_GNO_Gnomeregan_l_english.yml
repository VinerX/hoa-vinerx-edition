gnomeregan.1.t:0 "Gnomeregan City Threatened!"
gnomeregan.1.d:0 "The Orcs have taken Tinker Town, we must close the gates."
gnomeregan.1.a:0 "Close the Gates for the Greater Good."

### Third War events
gnomeregan_third_war.1.t:0 "The Great city of Gnomeregan"
gnomeregan_third_war.1.d:0 "    Across the enterity of Azeroth, the gnomish city of Gnomeregan might be one of the most technologically advanced place on the planet. The fruit of years of gnomish intelligence an ingenuity, the underground city spanning under the eastern mountains of Dun Morough is filled with machines and contraptions than any outsider can only witness with awe.\n\n   It's inhabitants, the gnomes, are as fascinating and excentric as their city, after all they made it in their image. That spark of knowledge within each of them and their unrelenting optimism in the face of adversity might be what saved the city when it was assieged by the Horde following the events of the First War. Despites the never-ending assaults, the orcs never made it past the gates.   \n\nSome of that success and prosperity could be also attributed to Gelbin Mekkatorque, who even among the gnomes, is considered to be greatest inventor on Azeroth and one of its brightest minds. Rising swiftly through the merocratic system of Gnomeregan thanks to his creativity and innovative solutions, he was elected as its leader and has been guiding the gnome ever since.\n\n   With their dwarven kin and allies to the west, the gnomes look brightly towards the future and hope that peace and prosperity will remain the status quo."
gnomeregan_third_war.1.option.1:0 "For Gnomeregan!"

gnomeregan_third_war.2.t:0 "Odd Activities"
gnomeregan_third_war.2.d:0 "    Lower levels engineers report higher amount of machineries breaking down than usual. They say that they would woke up in the morning only to find pipes and gears broken down, mostly in the maintenance tunnels.\n\n   More worrying, these damage seems like they cannot be attributed to normal wear down of the materials or mechanism and latest reports indicate that only blunt force could have caused them.\n\n    Guards have already been sent down there to investigate and hopefully find who is responsible for such happenings.\n\n    On another unrelated topic, the engineering team has noticed increasing sismic activity around Khaz Modan. They are reassuring and indicate that it is either of natural cause or the result of building projects in the dwarven cities of Ironforge or Shadowforge. Nothing to worry about."
gnomeregan_third_war.2.option.1:0 "Strange..."

gnomeregan_third_war.3.t:0 "Strange Creatures in Lower Levels"
gnomeregan_third_war.3.d:0 "    Panic has overwhelmed the lower levels! The source of the recent machine breakdowns have been found and are strange disgusting and malformed creatures, they are already numerous and have started attacking our citizens!\n\n   After careful examination it turns out these creatures are the 'troggs' that have been discovered by our dwarven cousins in the titan facility of Uldaman. It seems like they dug all the way from there to Gnomeregan as we have found multiple tunnels and witnessed them digging into the walls.\n\n Something must be done and quick, the creatures are growing in numbers and it is only a matter of time before they wreck complete havoc in the lower levels."
gnomeregan_third_war.3.option.1:0 "Evacuate the lower levels!"

gnomeregan_third_war.4.t:0 "Troggs Overrun Lower Levels"
gnomeregan_third_war.4.d:0 "     We tried our best but the lower levels are now completely infested with these troggs, they keep breaking and munching on machineries and with every day passing, more seems to be pouring from new tunnels. We don't know how much more there are but it is a complete catastrophy, it is time we take proper measure lest they will invade the rest of the city!"
gnomeregan_third_war.4.option.1:0 "How could this happen in the first place!"
gnomeregan_third_war.4.option.2:0 "Death to Gnomeregan!"

gnomeregan_third_war.5.t:0 "Dealing with the Troggs"
gnomeregan_third_war.5.d:0 "     With the monstruous troggs taking control over the lower level of Gnomeregan, the situation is becoming more dire everyday. For now we have managed to contain them in these areas but the task at hand is to completely expel or wipe them out from the city entirely. We can probably do that alone, of course, but we could seek the help of our dwarven cousins and maybe the rest of the Alliance.\n\n    [GNO.GetLeader], as humble as ever, as stated that we should not bother our allies with problems like that, that we gnome can handle it ourselves and that they have already dealing with issues in their own land. Asking them to help us would only draw their troops away from bigger threats, like the current whereabouts of a plague in Lordaeron.\n\n   In the end, the decision remains within the hands of the council."
gnomeregan_third_war.5.option.1:0 "We will do it alone!"
gnomeregan_third_war.5.option.1.d:0 "§RYou won't be able to call your allies for help!§!"
gnomeregan_third_war.5.option.2:0 "Let's not take any risk, let our allies join us."

gnomeregan_third_war.6.t:0 "Sicco's Plan"
gnomeregan_third_war.6.d:0 "     [GNO.GetLeader] has today met up with his council of advisors to work on a plan to deal with the troggs that are now becoming a threat to even the upper levels of the city.\n\n   During this meeting, his chief advisor and best friend, Sicco Thermaplugg has proposed a quite innovative plan. The mekgineer propose that we abandon the lower levels completely then flood them with a toxic gas of his conception that would kill all the troggs in the area with radiations emitted by the gas.\n\n    Other council members have voiced their concern about this toxic gas and that it might go through the aeration system and seep into the rest of the city, contaminating it as well. But Thermaplugg has thought about everything and explained to them that the gas would be made heavier than normal air and that special filters would be installed to keep the upper levels safe.\n\n   Gelbin, examining the schematics and plans that Sicco has presented to the council, declared that this plan might just work, althought he warned that there is always the possibility of things not working out properly, especially in these dire times."
gnomeregan_third_war.6.option.1:0 "Go on with the plan."
gnomeregan_third_war.6.option.2:0 "We cannot take the risk of irradiating the entire city."

gnomeregan_third_war.7.t:0 "Sicco's Plan - Part 2"
gnomeregan_third_war.7.d:0 "    At everyone's surprise, Sicco had already prepared everything, his personnal warehouse already full with air-tight sealed barrels of toxic gas as well as multiple crates of air filters of his making. Gelbin noted to himself that this kind of dangerous chemicals should have not been produced without the prior authorization of the council, but he kept that comment to himself.\n\n    The gnome engineers quickly got to work and a few hours later the filters were installed in all the air ducts linking the upper and lower sections of the city. In the meantime, Sicco was preparing the drones that would be used to bomb the lower levels with the toxic gas and only an hour after the filters were installed, the armed contraptions were sent straight to the lower levels.\n\n    All waited anxiously for the mechanism to fire and soon agonizing cries of trolls could be heard echoing down the corridors. Shock troops in air-tight hazmat suits were then sent to assess the situation."
gnomeregan_third_war.7.option.1:0 "Another success for Gnomeregan?"

gnomeregan_third_war.8.t:0 "Backfire"
gnomeregan_third_war.8.d:0 "    The shock troops sent to confirm the death of all the troggs all came back with horror on their face. After calming down, they explained that the toxic gas did not kill the troggs but worse, it made them into more furious and violent creatures, killing half of the troops sent down there! The cries that had been heard earlier were not of suffering, but of anger and bloodthirsty frenzy!"
gnomeregan_third_war.8.option.1:0 "Oh no..."

gnomeregan_third_war.9.t:0 "The Evacuation"
gnomeregan_third_war.9.d:0 "    If only the troggs turning into even more unhinged beasts was our only problem. In the course of the past few days, we have noticed the air filters slowly deteriorating and gas seeping into the upper levels.\n\n    At first the effects were mild, affected citizens only had a small cough, but their condition quickly devolved has they became more and more exposed to the gas that were increasingly leaking. Their skin started to blister and dry up as they slowly fell into madness, attacking their fellow citizens, thinking their were troggs.What was only a few isolated accident at first became generalized when the filters apparently all stopped working and the gas started to contaminate the higher levels. Now the whole city was a battlefield, sane and healthy gnomes battling against troggs alongside their crazed brethren in a total chaos.\n\n    Seeing the situation worsening, [GNO.GetLeader] declared the order of evacuation and fled outside the gates of the city with the survivors. The High Tinkerer tried to see if everyone was okay but was sad to learn that his friend Sicco was nowhere to be found..."
gnomeregan_third_war.9.option.1:0 "How could this happen?!"

gnomeregan_third_war.10.t:0 "The Fate of Sicco"
gnomeregan_third_war.10.d:0 "    [GNO.GetLeader]'s heart was heavy this morning, not because his friend Sicco was dead, in fact it was much more than that. After sending a small contingent of shock troops into the now irradiated city to retrieve important blueprints, the High Tinkerer learned the fate of his friend. Sicco Thermaplugg had not only survived the irradiation of Gnomeregan, but had also turned into a leper gnome.\n\n    It is unclear yet if the mekgineer has became completely crazy by the toxic fumes or if everything he has done thus far has been meticulously planned in some sort of evil plan, but he has proclaimed himself to be 'King of Gnomeregan' and now lead the crazed leper gnomes. Attacking everyone on sight, it is clear that the leper gnomes don't want us back into the city, either from madness or maybe orders..."
gnomeregan_third_war.10.option.1:0 "How could Sicco do this?!"
gnomeregan_third_war.10.option.2:0 "Gnomeregan is now his..."

