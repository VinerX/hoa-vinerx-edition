###############################
RPP_hogger:0 "Hogger"
POLITICS_HOGGER_DESC:0 "The Chieftain of the Riverpaw Pack. He is as ruthless as they come - as a Gnoll, he remembers the Gnoll Wars when the Gnolls nearly overran Azeroth. If Hogger has his way, it will happen again. The Scourge of Elwynn is a threat to the stability of the Kingdom of Stormwind - and if left unchecked, will see the Kingdom burnt to ashes around him. As the Riverpaw Pack prepares for war, Hogger knows that his time is coming soon. He simply needs to wait for Stormwind to make the first move."

RPP_fedfennel:0 "Fedfennel"
RPP_gruff_swiftbite:0 "Gruff Swiftbite"
RPP_sergeant_brashclaw:0 "Sergeant Brashclaw"
POLITICS_BRASHCLAW_DESC:0 "With Hogger dead, Brashclaw turned his attention to Fedfennel and established dominance over the pack, his interactions with the Defias led him to seeking out a partial alliance with them in hopes that they may assist them with caravan raids."

RHU_UNDEAD_HOGGER_DESC:0 "After being betrayed by his Sergeants, Hogger was returned to life by the madman Morbent Fel, before crushing the fools head in with a gravestone.\nHis now undead form only craving the warmth of living, and of course...revenge."
