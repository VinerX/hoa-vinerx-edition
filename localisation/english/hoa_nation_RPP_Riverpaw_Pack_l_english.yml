RPP_bloodied_nose:0 "Bloodied Nose"
RPP_bloodied_nose_desc:0 "Fedfennel has been unable to deal with the murlocs, even without human patrols he has still be unable to take the stones of the island, Hogger smashed his nose for this."
RPP_hoggers_hill_brutality:0 "Hoggers Hill Brutality"
RPP_hoggers_hill_brutality_desc:0 "Hogger has refused to side with the red bandannas, he is right to not trust the humans no matter what they wear, Brashclaw thinks otherwise, so does Fedfennel."
RPP_down_by_the_river:0 "Down by the River"
RPP_down_by_the_river_desc:0 "Those who still stand for Hogger will die like Hogger, kill them and throw them in the river, those who live, attach rocks to their legs."
RPP_a_threat_reborn:0 "A Threat Reborn"
RPP_a_threat_reborn_desc:0 "The Dead have fished the bodies out of the river, they can mount their heads as trophies, we have plans with red bandannas."

RPP_nuisance_gnolls:0 "Nuisance Gnolls"
RPP_nuisance_gnolls_desc:0 "Entry 14 - I have raised a Number of Gnolls that the ghouls pulled out of the River, may of the wounds seem to have been inflicted by their own kind."
RPP_the_gated_grave:0 "The Gated Grave"
RPP_the_gated_grave_desc:0 "Entry 19 - Work has begun on repairing of the Main mausoleum, though it serves as nothing more then a storage pit for the dead the risen gnolls have proven their vitality even in an undead state."
RPP_beyond_the_walls:0 "Beyond The Walls"
RPP_beyond_the_walls_desc:0 "Entry 23 - I have tasked the gnolls with destroying a number of skeletons which have decayed beyond use, the savagry they showed amazes me, even though they lack the instincts from when they were alive they still chewed the bones."
RPP_grave_diggers:0 "Grave Diggers"
RPP_grave_diggers_desc:0 "Entry 24 - The Gnolls were given shovels taken from the Vineyard across the river and i ordered them to dig up more bodies from my experiments, it would seem i had underestimated them as not only did they dig up more bodies then i could use at this time, but they also managed to find an Ore Vein beyond one of the damaged walls."
RPP_worked_to_the_bone:0 "Worked to the Bone"
RPP_worked_to_the_bone_desc:0 ""
RPP_unusual_brutality:0 "Unusual Brutality"
RPP_unusual_brutality_desc:0 "Entry 36 - I have never seen Gnolls fight up close before their little civil war gave me specimens, they normally eat those who have fallen in battle, be that as it may, they do seem to not understand they are still bound by the limitations of their flesh."
RPP_bearers_of_burdens:0 "Bearers of Burdens"
RPP_bearers_of_burdens_desc:0 ""
RPP_architecture_supplies:0 "Architecture Supplies"
RPP_architecture_supplies_desc:0 "Entry 30 - The Gnolls have returned from a scavenging run over to the old township of Raven Hill, they were tasked with collecting wood, the largest of them seems to have gone missing, more then likely killed by the Nightwatch or ventured into the Ogre Mound."
RPP_unmarked_crates:0 "Unmarked Crate"
RPP_unmarked_crates_desc:0 "Entry 38 - The Gnoll i had thought went missing has turned up more then 4 weeks later, the beast has returned with a waterlogged crate, the crate is beyond use, but contains a number of vials containing a potion of some sort, further study is needed.."
