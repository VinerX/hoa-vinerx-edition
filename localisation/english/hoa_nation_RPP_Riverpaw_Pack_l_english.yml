RPP_caravan_raids:0 "Caravan Raids"
RPP_caravan_raids_desc:0 "Lacking the ability to make many goods of their own the Riverpaw pack has set their eyes on Stormwinds caravans in Elwynn."
RPP_caravan_raids_DFB:0 "Targeted Caravan Raids"
RPP_caravan_raids_DFB_desc:0 "Red Bandannas have show us targets with things we should take, no more digging through wagons for trinkets."
