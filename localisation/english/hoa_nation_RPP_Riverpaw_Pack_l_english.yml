riverpaw_third.1.t:0 "The Human War"
riverpaw_third.1.d:0 "Humans have begun to fight one another, some are blue, some are red, we know that blue has hole in defense, should we raid?"
riverpaw_third.1.option.1:0 "Break them as they broke us"
riverpaw_third.1.option.2:0 "Still weak, let them weaken too"

riverpaw_classic.1.t:0 "The Red Bandannas"
riverpaw_classic.1.d:0 "Few years ago the humans began to fight one another, many ran into camp while trying to escape footmen, they all met the same fate, we took weapons and meat. When they stopped some humans approached us, they wanted the weapons from footmen, they did not demand but wanted to trade."
riverpaw_classic.1.option.1:0 "'All humans are same, but these ones seem smarter then others'"
riverpaw_classic.1.option.2:0 "'Chop them down, all humans want is to beat us'"

