l_english:
 LOR_the_war_moves_north:0 "The War Moves North"
 LOR_the_war_moves_north_desc:0 "Stormwind has fallen and the Horde grinds northward. Lordaeron can no longer treat this as a distant war — the whole kingdom must be placed on a war footing to meet the orcs before they reach the heartland."
 LOR_hold_hillsbrad:0 "Hold Hillsbrad"
 LOR_hold_hillsbrad_desc:0 "The southern marches are the Alliance's shield. If the line at Hillsbrad holds, the Horde's advance stalls within reach of the mountains — and every day bought is a day the coalition grows stronger."
 LOR_the_alterac_question:0 "The Alterac Question"
 LOR_the_alterac_question_desc:0 "Aiden Perenolde's loyalty has always been for sale. The mountain passes of Alterac are the key to the north; whether Alterac stands with the Alliance or sells the passes to the Horde will shape the entire campaign."
 LOR_relieve_khaz_modan:0 "Relieve Khaz Modan"
 LOR_relieve_khaz_modan_desc:0 "The dwarves of Ironforge and the gnomes of Gnomeregan hold the Horde's southern flank, but they cannot hold forever alone. Breaking the siege of Khaz Modan keeps the coalition's industrial heart beating."
 LOR_the_tide_turns:0 "The Tide Turns"
 LOR_the_tide_turns_desc:0 "The Horde that once seemed unstoppable is faltering — riven by treachery or simply ground down by a war it cannot sustain. The moment has come to seize the initiative and turn defence into attack."
 LOR_the_great_counteroffensive:0 "The Great Counteroffensive"
 LOR_the_great_counteroffensive_desc:0 "No more retreats. Lordaeron marshals the united kingdoms and drives south, hurling the Horde back across the ground it took by fire and blood."
 LOR_liberate_the_south:0 "Liberate the South"
 LOR_liberate_the_south_desc:0 "The exiles of Stormwind march home at last. As the counteroffensive rolls south, the Alliance reclaims the lands the Horde overran and puts arms in the hands of those who lost everything."
 LOR_the_road_to_blackrock:0 "The Road to Blackrock"
 LOR_the_road_to_blackrock_desc:0 "The Horde's heart beats beneath Blackrock Spire. With the enemy reeling, Lordaeron sets the Alliance's sights on the mountain fortress itself — and the reckoning that awaits there."
 LOR_northern_command:0 "Northern Command"
 LOR_northern_command_desc:0 "Lordaeron's court has become a war command. Mobilization orders, marching columns and forward supply keep the army moving and ready to react."
 LOR_the_counteroffensive:0 "The Counteroffensive"
 LOR_the_counteroffensive_desc:0 "The Alliance has wrested the initiative from the Horde. Its armies attack with coordinated fury, breaking through lines the orcs can no longer hold."
