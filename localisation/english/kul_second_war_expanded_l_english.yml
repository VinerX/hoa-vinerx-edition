l_english:
 # ============================================================
 # Land Forces focuses
 # ============================================================
 KUL_sw_mobilize_marines:0 "Mobilize the Marines"
 KUL_sw_mobilize_marines_desc:0 "Kul Tiras is famous for its fleet, but every ship needs soldiers to board enemy vessels and seize hostile shores. The Tiran Marine Corps must be expanded from a ceremonial guard into a true amphibious fighting force."

 KUL_sw_boralus_garrison:0 "Boralus Garrison"
 KUL_sw_boralus_garrison_desc:0 "The capital's defenses have grown lax during decades of peace. A permanent garrison will secure the city against raids and free the fleet for offensive operations."

 KUL_sw_marine_training_grounds:0 "Marine Training Grounds"
 KUL_sw_marine_training_grounds_desc:0 "Establish dedicated training facilities along the coast where recruits learn to fight on ship decks, storm beaches, and operate in the chaos of amphibious assault."

 KUL_sw_drustvar_rangers:0 "Drustvar Rangers"
 KUL_sw_drustvar_rangers_desc:0 "The highlands of Drustvar breed hardy folk who know every mountain pass and hidden trail. Recruiting these mountain men as scouts and sharpshooters will give our marines eyes on any shoreline."

 KUL_sw_marine_officer_school:0 "Marine Officer School"
 KUL_sw_marine_officer_school_desc:0 "A specialized academy for amphibious warfare officers — teaching navigation, beachhead tactics, and the brutal arithmetic of assaulting a defended coast."

 KUL_sw_amphibious_warfare_doctrine:0 "Amphibious Warfare Doctrine"
 KUL_sw_amphibious_warfare_doctrine_desc:0 "Write the book on assaulting from the sea. Develop specialized landing craft, coordinate naval gunfire with infantry advances, and perfect the art of the beachhead."

 KUL_sw_naval_bombardment_corps:0 "Naval Bombardment Corps"
 KUL_sw_naval_bombardment_corps_desc:0 "Train specialized gunnery officers to direct ship cannons against shore targets. A well-placed broadside can break enemy fortifications before the first marine hits the beach."

 KUL_sw_marine_command:0 "Tiran Marine Command"
 KUL_sw_marine_command_desc:0 "Establish a unified command structure for all amphibious forces. The Marines will answer to their own admiral, with authority to plan and execute independent coastal operations."

 KUL_sw_shore_batteries:0 "Shore Batteries"
 KUL_sw_shore_batteries_desc:0 "Cannon emplacements along Kul Tiras's coastline will make any Horde landing attempt a slaughter. Let them come — the fish will feast on greenskin."

 KUL_sw_marine_expeditionary_force:0 "Marine Expeditionary Force"
 KUL_sw_marine_expeditionary_force_desc:0 "The Tiran Marine Expeditionary Force is now a fully independent combat arm, capable of striking anywhere the sea touches. From the Baradin Bay to the shores of Khaz Modan — wherever the Horde hides, we will find them."

 # ============================================================
 # House Politics focuses
 # ============================================================
 KUL_sw_council_of_four_houses:0 "Council of Four Houses"
 KUL_sw_council_of_four_houses_desc:0 "Kul Tiras is ruled by an alliance of four great houses: Proudmoore, Waycrest, Ashvane, and Stormsong. Daelin summons the council to Boralus to bind the houses to the war effort. Their rivalries are legend — but their combined strength is immense."

 KUL_sw_house_waycrest:0 "House Waycrest"
 KUL_sw_house_waycrest_desc:0 "Lord Arthur Waycrest rules Drustvar with an iron hand. His mountain levies are the finest infantry in Kul Tiras, and his family's knowledge of the land runs deeper than most suspect. Secure the Waycrest alliance — but watch the shadows in their halls."

 KUL_sw_house_ashvane:0 "House Ashvane"
 KUL_sw_house_ashvane_desc:0 "Lady James Ashvane controls the largest private fleet in Kul Tiras. Her merchant empire spans the Great Sea, and her shipwrights work faster than any in Boralus. Gold and ships — House Ashvane provides both, for a price."

 KUL_sw_house_stormsong:0 "House Stormsong"
 KUL_sw_house_stormsong_desc:0 "Lord Stormsong and his Tidesages command the faith of the sea. Their blessings guide our ships through storms, their shipyards build our finest vessels, and their devotion to the Tidemother inspires every sailor who sets foot on a Kul Tiran deck."

 KUL_sw_drustvar_militia:0 "Drustvar Militia"
 KUL_sw_drustvar_militia_desc:0 "Every able-bodied man and woman in Drustvar trains with axe and bow from childhood. Formalizing these militias into a proper reserve force will provide a deep well of manpower for the coming war."

 KUL_sw_waycrest_manor:0 "Waycrest Manor"
 KUL_sw_waycrest_manor_desc:0 "Waycrest Manor is both fortress and seat of power in Drustvar. Its ancient cellars hold secrets the current Lord Waycrest would prefer remain buried — but war demands all cards be played."

 KUL_sw_witch_hunters:0 "Witch Hunters of Drustvar"
 KUL_sw_witch_hunters_1_desc:0 "The old ways of Drustvar speak of covens, hexes, and things that move in the mists. Most dismiss this as peasant superstition. The Waycrests know better. With Arthur's blessing, the Witch Hunters emerge from shadow to serve the Admiralty — rooting out enemies both mortal and otherwise."

 KUL_sw_ashvane_shipwrights:0 "Ashvane Shipwrights"
 KUL_sw_ashvane_shipwrights_desc:0 "House Ashvane's private dockyards produce fast, reliable hulls at remarkable speed. A contract with their master shipwrights will accelerate fleet production significantly."

 KUL_sw_privateer_contracts:0 "Privateer Contracts"
 KUL_sw_privateer_contracts_desc:0 "Why risk Kul Tiran lives and ships when private captains will do it for prize money? Issue letters of marque to independent captains — let them hunt Horde shipping and keep a share of the spoils."

 KUL_sw_ashvane_monopoly:0 "Ashvane Trade Monopoly"
 KUL_sw_ashvane_monopoly_desc:0 "Grant House Ashvane exclusive rights to wartime shipping contracts. Their efficiency is unmatched, and the Admiralty's coffers will swell — but the other houses will not forget this favoritism."

 KUL_sw_tidesage_conclave:0 "Tidesage Conclave"
 KUL_sw_tidesage_conclave_desc:0 "The Tidesages gather at the Shrine of the Storm to commune with the Tidemother. Their collective power can turn the sea itself into an ally — calming storms around our fleet while sending tempests against the Horde."

 KUL_sw_blessed_ship_hulls:0 "Blessed Ship Hulls"
 KUL_sw_blessed_ship_hulls_desc:0 "Tidesage enchantments laid into ship timbers during construction make hulls stronger against cannon fire and resistant to the rot of long voyages. A blessed ship sails faster, fights harder, and returns home."

 KUL_sw_tidesage_ascendancy:0 "Tidesage Ascendancy"
 KUL_sw_tidesage_ascendancy_desc:0 "With House Stormsong fully committed to the war, the Tidesages take a central role in fleet operations. Their mastery of wind and wave gives our armada an edge no enemy can match."

 KUL_sw_united_admiralty:0 "United Admiralty"
 KUL_sw_united_admiralty_desc:0 "The four houses have set aside their rivalries. Waycrest steel, Ashvane gold, Stormsong blessings, and Proudmoore leadership — united at last under the Admiralty. The House of Proudmoore does not merely command Kul Tiras. It IS Kul Tiras."

 # ============================================================
 # Trade & Commerce focuses
 # ============================================================
 KUL_sw_sea_trade_routes:0 "Sea Trade Routes"
 KUL_sw_sea_trade_routes_desc:0 "War may rage on the continent, but Kul Tiras thrives on trade. Securing our merchant routes through contested waters will keep supplies flowing to Alliance ports and gold flowing into Boralus."

 KUL_sw_merchant_guild:0 "Merchant Guild Charter"
 KUL_sw_merchant_guild_desc:0 "Grant the Boralus Merchant Guild expanded rights to coordinate wartime trade. Their network of factors and warehouses spans every major port from Lordaeron to Booty Bay."

 KUL_sw_convoy_protection:0 "Convoy Protection Fleet"
 KUL_sw_convoy_protection_desc:0 "Detach light warships to escort merchant convoys through dangerous waters. A sunk freighter is a gift to the enemy — every convoy that reaches port strengthens the Alliance."

 KUL_sw_ironforge_trade:0 "Ironforge Trade Compact"
 KUL_sw_ironforge_trade_desc:0 "The dwarves of Ironforge produce the finest steel and gunpowder in the Eastern Kingdoms. A trade agreement exchanging Kul Tiran ships for dwarven cannons benefits both realms immensely."

 KUL_sw_gilnean_agreement:0 "Gilnean Trade Agreement"
 KUL_sw_gilnean_agreement_desc:0 "Gilneas may be reclusive, but their merchants cannot resist the profits of a secure sea lane. Open formal trade with the worgen-fearing kingdom — their timber and grain will feed our war machine."

 KUL_sw_export_monopolies:0 "Kul Tiran Export Monopolies"
 KUL_sw_export_monopolies_desc:0 "Consolidate all major exports — ships, salted fish, enchanted timber — under Admiralty control. The trading nations of the Alliance will pay whatever we ask, because they have no other choice."

 # ============================================================
 # Alliance Diplomacy focuses
 # ============================================================
 KUL_sw_fleet_for_lordaeron:0 "A Fleet for Lordaeron"
 KUL_sw_fleet_for_lordaeron_desc:0 "Lordaeron fields the largest army in the Alliance but lacks a serious navy. Build and transfer a squadron of frigates to King Terenas — a gift that binds the two kingdoms closer than any treaty."

 KUL_sw_stromgarde_steel:0 "Stromgarde Steel Exchange"
 KUL_sw_stromgarde_steel_desc:0 "Stromgarde's forges produce exceptional weapons. Offer naval transport for their troops in exchange for a steady supply of swords, shields, and armor plate for our marines."

 KUL_sw_elven_shipwrights:0 "Elven Shipwrights"
 KUL_sw_elven_shipwrights_desc:0 "Quel'Thalas' shipwrights work wood with an artistry unknown to human hands. An exchange program will teach our builders elven techniques while providing the high elves with larger hull designs for ocean warfare."

 KUL_sw_grand_fleet_coordination:0 "Grand Fleet Coordination"
 KUL_sw_grand_fleet_coordination_desc:0 "The combined fleets of the Alliance — Kul Tiran battleships, Lordaeronian frigates, elven swift-ships — must operate as one. Establish a unified command protocol so every captain knows their role in the coming battles."

 KUL_sw_support_stormwind_refugees:0 "Support Stormwind's Refugees"
 KUL_sw_support_stormwind_refugees_desc:0 "The survivors of Stormwind's fall have found shelter in Lordaeron, but they lack everything. Kul Tiran ships can transport supplies and volunteers to the refugee camps at Southshore. The Kingdom of Stormwind will remember its friends."

 KUL_sw_alliance_naval_dominance:0 "Alliance Naval Dominance"
 KUL_sw_alliance_naval_dominance_desc:0 "The combined naval might of the Alliance is now an unstoppable force. From the Frozen Sea to the South Seas, no enemy ship sails without our permission. The waves belong to the Alliance — and the Alliance fleet answers to Kul Tiras."

 # ============================================================
 # Derek's Arc focuses
 # ============================================================
 KUL_sw_dereks_first_command:0 "Derek's First Command"
 KUL_sw_dereks_first_command_desc:0 "Daelin's eldest son has completed his naval training. Young Derek burns with the desire to prove himself worthy of the Proudmoore name. The Lord Admiral gives him command of a patrol squadron — a safe assignment to gain experience before the real fighting begins."

 # ============================================================
 # Air Forces focuses
 # ============================================================
 KUL_sw_wild_gryphons:0 "Wild Gryphons of Drustvar"
 KUL_sw_wild_gryphons_desc:0 "The mountain peaks of Drustvar are home to wild gryphon flocks, fiercer and larger than their Hinterlands cousins. Tame these beasts and train them for aerial combat — they may prove our best answer to dragon fire."

 KUL_sw_aerial_reconnaissance:0 "Aerial Reconnaissance"
 KUL_sw_aerial_reconnaissance_desc:0 "Gryphon riders can scout enemy fleet movements from miles away, relaying positions before the Horde even knows we are watching. Knowledge is the first weapon in any naval engagement."

 KUL_sw_fleet_air_cover:0 "Fleet Air Cover"
 KUL_sw_fleet_air_cover_desc:0 "Station gryphon squadrons aboard our largest warships. When red dragons next darken our skies, they will find not helpless sailors but talon and beak waiting for them."

 # ============================================================
 # Regional Development focuses
 # ============================================================
 KUL_sw_develop_boralus:0 "Develop Boralus"
 KUL_sw_develop_boralus_desc:0 "Boralus is the greatest port city in the known world, but war demands expansion. New roads, expanded warehouses, and improved harbor facilities will turn the capital into an unbreakable logistical hub."

 KUL_sw_boralus_trade_port:0 "Boralus Trade Port"
 KUL_sw_boralus_trade_port_desc:0 "The trade port of Boralus handles more cargo than any other harbor on the Great Sea. Expanding its capacity and streamlining customs will pay for the war in tariffs alone."

 KUL_sw_admiralty_docks:0 "Admiralty Docks"
 KUL_sw_admiralty_docks_desc:0 "The Admiralty's military docks must be expanded to service the growing fleet. New drydocks, repair basins, and ammunition stores will keep our warships at sea longer."

 KUL_sw_boralus_lighthouse:0 "Boralus Lighthouse"
 KUL_sw_boralus_lighthouse_desc:0 "The great lighthouse of Boralus has guided ships home for centuries. Upgrade it with signal flags and watch posts — it will become the nerve center of our coastal defense network."

 KUL_sw_drustvar_lumber_camps:0 "Drustvar Lumber Camps"
 KUL_sw_drustvar_lumber_camps_desc:0 "The ancient forests of Drustvar provide the finest ship timber in Kul Tiras. Establish new lumber camps to feed the shipyards' endless hunger for hardwood."

 KUL_sw_stormsong_farms:0 "Stormsong Farms"
 KUL_sw_stormsong_farms_desc:0 "The fertile valleys of Stormsong produce grain, vegetables, and livestock that feed the entire nation. War means more mouths to feed — expand the farmlands to prevent hunger from undermining the war effort."

 KUL_sw_coastal_watchtowers:0 "Coastal Watchtowers"
 KUL_sw_coastal_watchtowers_desc:0 "A network of watchtowers along Kul Tiras's rocky shores will provide early warning of Horde raids. Signal fires can alert the fleet within minutes of an enemy sighting."

 KUL_sw_ship_timber_plantations:0 "Ship Timber Plantations"
 KUL_sw_ship_timber_plantations_desc:0 "Wild forests cannot sustain fleet production indefinitely. Establish managed timber plantations in Drustvar — the trees planted today will be the battleships of tomorrow."

 KUL_sw_mountain_supply_routes:0 "Mountain Supply Routes"
 KUL_sw_mountain_supply_routes_desc:0 "The mountain passes between Drustvar and Stormsong Valley are treacherous but vital. Improve the roads to keep supplies flowing between the highland lumber camps and the coastal shipyards."

 KUL_sw_stormsong_shrine:0 "Shrine of the Storm"
 KUL_sw_stormsong_shrine_desc:0 "Expand the Shrine of the Storm — the holiest site of the Tidesage faith. Pilgrims from across Kul Tiras will bring offerings, and the Tidemother's blessings will grow stronger with every prayer."

 KUL_sw_drustvar_mines:0 "Drustvar Mountain Mines"
 KUL_sw_drustvar_mines_desc:0 "The high peaks of Drustvar hold rich veins of iron and coal — the lifeblood of any war industry. Open new mines to feed the forges of Boralus with raw material for cannons, armor, and shot."

 # ============================================================
 # New ideas
 # ============================================================
 KUL_sw_boralus_garrison_idea:0 "Boralus Garrison"
 KUL_sw_boralus_garrison_idea_desc:0 "A permanent military garrison now protects the capital, freeing the fleet for offensive operations."

 KUL_sw_drustvar_rangers_idea:0 "Drustvar Rangers"
 KUL_sw_drustvar_rangers_idea_desc:0 "Hardy mountain folk serve as scouts and sharpshooters for the Tiran military, their knowledge of coastal terrain proving invaluable."

 KUL_sw_marine_command_idea:0 "Tiran Marine Command"
 KUL_sw_marine_command_idea_desc:0 "A unified amphibious warfare command with authority to plan and execute independent coastal operations."

 KUL_sw_marine_expeditionary_idea:0 "Tiran Marine Expeditionary Force"
 KUL_sw_marine_expeditionary_idea_desc:0 "The Tiran Marines are now an elite expeditionary force, ready to strike anywhere the sea touches. Their motto: 'First ashore, last to leave.'"

 KUL_sw_house_waycrest_idea:0 "House Waycrest's Levies"
 KUL_sw_house_waycrest_idea_desc:0 "The mountain warriors of Drustvar fight with grim determination, defending their homeland with axe and bow."

 KUL_sw_house_ashvane_idea:0 "House Ashvane's Coin"
 KUL_sw_house_ashvane_idea_desc:0 "Ashvane gold greases the wheels of industry and trade, ensuring Kul Tiras's war economy runs smoothly."

 KUL_sw_house_stormsong_idea:0 "House Stormsong's Blessing"
 KUL_sw_house_stormsong_idea_desc:0 "The Tidesages of House Stormsong guide our fleet with ancient knowledge of wind and wave."

 KUL_sw_witch_hunters_idea:0 "Witch Hunters of Drustvar"
 KUL_sw_witch_hunters_idea_desc:0 "Specialists in rooting out hidden threats — whether mortal spies or darker things. Their methods are unsettling, but their results are effective."

 KUL_sw_ashvane_monopoly_idea:0 "Ashvane Trade Monopoly"
 KUL_sw_ashvane_monopoly_idea_desc:0 "House Ashvane controls wartime shipping contracts, their efficiency driving unprecedented productivity in the dockyards."

 KUL_sw_tidesage_conclave_idea:0 "Tidesage Conclave"
 KUL_sw_tidesage_conclave_idea_desc:0 "The united Tidesages channel the Tidemother's power, granting our fleet supernatural speed and precision."

 KUL_sw_united_admiralty_idea:0 "United Admiralty"
 KUL_sw_united_admiralty_idea_desc:0 "The four great houses stand united behind Lord Admiral Proudmoore. Kul Tiras speaks with one voice — and that voice commands the sea."

 KUL_sw_boralus_port_idea:0 "Boralus Trade Port"
 KUL_sw_boralus_port_idea_desc:0 "The expanded trade port of Boralus channels the wealth of the seas into the Admiralty's coffers."

 KUL_sw_drustvar_mines_idea:0 "Drustvar Mountain Mines"
 KUL_sw_drustvar_mines_idea_desc:0 "Rich veins of iron and coal fuel the forges of Boralus day and night."

 KUL_sw_stormsong_shrine_idea:0 "Shrine of the Storm"
 KUL_sw_stormsong_shrine_idea_desc:0 "The expanded shrine draws pilgrims from across Kul Tiras, their devotion empowering the Tidesages' blessings."

 KUL_sw_merchant_guild_idea:0 "Boralus Merchant Guild"
 KUL_sw_merchant_guild_idea_desc:0 "The chartered Merchant Guild coordinates wartime trade across every major port of the Great Sea."

 KUL_sw_export_monopoly_idea:0 "Kul Tiran Export Monopolies"
 KUL_sw_export_monopoly_idea_desc:0 "Admiralty control over all major exports ensures a steady flow of gold into the war chest."

 KUL_sw_coastal_defense_idea:0 "Coastal Defense Network"
 KUL_sw_coastal_defense_idea_desc:0 "Shore batteries and watchtowers ring the Kul Tiran coastline, making any enemy landing a costly gamble."

 # ============================================================
 # New events
 # ============================================================
 kul_sw_exp.1.t:0 "The Council of Four Houses"
 kul_sw_exp.1.d:0 "The great hall of Boralus fills with the banners of four houses. Lord Waycrest arrives with his mountain guard, their axes gleaming. Lady Ashvane sweeps in draped in gold and confidence, her private fleet at anchor in the bay. Lord Stormsong enters with the Tidesages, the smell of sea salt and incense trailing in their wake. Daelin Proudmoore rises from the Admiral's Throne, his voice carrying the weight of centuries. 'The Horde burns Stormwind. Tomorrow it will be Lordaeron. The day after — our shores. The four houses must stand together, or we will fall separately.' One by one, the lords of Kul Tiras swear their fealty to the Admiralty's cause."
 kul_sw_exp.1.option.a:0 "For Kul Tiras. For the Admiralty."

 kul_sw_exp.2.t:0 "Derek's First Command"
 kul_sw_exp.2.d:0 "Derek Proudmoore stands on the quarterdeck of his first command — the frigate Tides' Fortune — as it sails out of Boralus harbor. The sea wind whips his dark hair, and his mother Katherine watches from the Admiralty balcony with a mix of pride and fear. Daelin claps his son on the shoulder before disembarking. 'Bring her home, son.' Derek's squadron is tasked with patrolling the Baradin Bay, hunting for Horde scouts. It should be a routine mission — safe enough for a young captain to learn. The sea is calm. The sky is clear. Derek Proudmoore has his whole life ahead of him."
 kul_sw_exp.2.option.a:0 "Make your father proud, Derek."

 kul_sw_exp.3.t:0 "The Witch Hunters"
 kul_sw_exp.3.d:0 "Lord Waycrest leads Daelin through a hidden passage beneath Waycrest Manor. Torches gutter in the damp air. At the passage's end, a hall filled with grim-faced men and women in dark leathers — the Witch Hunters. 'My family has kept this order for generations,' Arthur explains, his voice low. 'They hunt things that the Light cannot touch.' On the wall hangs a tapestry depicting twisted figures — witches of Drustvar legend, bound in chains of silver. 'The Horde is not the only enemy,' Waycrest says. 'When you need shadows to fight shadows — call us.'"
 kul_sw_exp.3.option.a:0 "Some secrets are best kept in the dark."

 kul_sw_exp.4.t:0 "The United Admiralty"
 kul_sw_exp.4.d:0 "A year has passed since the Council of Four Houses first convened. In that time, House Waycrest has bled its mountain levies white in the island campaigns. House Ashvane has poured rivers of gold into the fleet, their merchant empire now indistinguishable from the Admiralty's supply chain. House Stormsong has lost Tidesages to dragon fire and enemy cannon, yet they still bless every hull that leaves the shipyards. Daelin Proudmoore stands before the assembled lords, Derek's admiralty pin gleaming on his chest. 'You have given everything,' he says. 'Your soldiers, your gold, your sons and daughters. The four houses are no longer separate — we are Kul Tiras. We are the Admiralty. And we will never break.' The lords kneel. The banners merge. A single anchor rises above Boralus."
 kul_sw_exp.4.option.a:0 "United we stand. United we sail."

 kul_sw_exp.5.t:0 "The Port of Boralus"
 kul_sw_exp.5.d:0 "Boralus is already the greatest port on the Great Sea, but war demands more. Engineers dredge the harbor to accommodate larger warships. New warehouses rise along the waterfront, stacked with naval stores, provisions, and ammunition. The Merchant Guild moves into expanded offices, their clerks working through the night to manage the flood of wartime contracts. Ships arrive from every Alliance port — Lordaeronian grain, Stromgarde steel, elven enchanted timber — all flowing through the docks of Boralus. The city hums with the energy of a nation at war, and in the Admiralty tower, Daelin Proudmoore watches the horizon and smiles."
 kul_sw_exp.5.option.a:0 "The sea provides."
