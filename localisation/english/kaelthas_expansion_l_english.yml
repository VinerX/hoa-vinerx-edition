l_english:

###############################
# Kael'thas Expansion вЂ” Focus Tree
###############################

QUE_sw_prince_of_the_sun:0 "Prince of the Sun"
QUE_sw_prince_of_the_sun_desc:0 "Prince Kael'thas Sunstrider has spent centuries in Dalaran, mastering the arcane arts and building a network of contacts across the Eastern Kingdoms. Now he returns to Silvermoon with a vision for Quel'Thalas that differs sharply from his father's cautious isolation. Anasterian, weary of endless debate, grants his son a formal position in the war council вЂ” a small concession that may have far-reaching consequences."

QUE_sw_princes_reform:0 "The Prince's Reform"
QUE_sw_princes_reform_desc:0 "Kael'thas has secured his father's reluctant blessing to address the dysfunction of the Convocation of Silvermoon. The magisters have grown complacent, their debates circular, their resistance to change a millstone around the kingdom's neck. The prince proposes a sweeping reorganisation of elven governance вЂ” but the Convocation will not yield its ancient privileges without a fight."

QUE_sw_kaelthas_dalaran_ties:0 "Ties to Dalaran"
QUE_sw_kaelthas_dalaran_ties_desc:0 "Kael'thas's decades of study in Dalaran were not merely academic вЂ” they were a bridge between the two greatest arcane civilisations on Azeroth. The prince calls upon his contacts in the Kirin Tor, proposing a formal exchange of knowledge, resources, and personnel. The mages of Dalaran have as much to learn from the Sunwell as the elves have to learn from the Kirin Tor's pragmatic battle-magic."

QUE_sw_modernize_convocation:0 "Modernize the Convocation"
QUE_sw_modernize_convocation_desc:0 "The Convocation of Silvermoon is an institution frozen in time вЂ” its procedures unchanged since the Troll Wars, its magisters more concerned with ritual and precedence than the survival of the realm. Kael'thas forces through a series of reforms: streamlined voting, military representation on the war council, and an end to the drift that has paralysed elven foreign policy for millennia."

QUE_sw_sunwell_guardianship:0 "Sunwell Guardianship"
QUE_sw_sunwell_guardianship_desc:0 "The Sunwell has always been protected by the magisters вЂ” but the magisters have proven indecisive in the face of existential threat. Kael'thas transfers guardianship of the Sunwell to a joint command of the Farstriders and the Royal Guard. The magisters howl in protest, but the prince is uncompromising: the heart of elven civilisation will be defended by those willing to shed blood for it."

QUE_sw_sideline_magisters:0 "Sideline the Magisters"
QUE_sw_sideline_magisters_desc:0 "Kael'thas's patience with the Convocation runs out. In a dramatic session of the Sunfury Spire, the prince invokes ancient royal prerogatives to strip the magisters of their veto over military deployments. The chamber erupts вЂ” Grand Magister Belo'vir threatens resignation, several noble houses walk out вЂ” but the prince has the backing of the army and the rangers. The age of magisterial obstruction is over."

QUE_sw_princes_regency:0 "The Prince's Regency"
QUE_sw_princes_regency_desc:0 "With the magisters neutralised and the army firmly behind him, Kael'thas assumes de facto control of Quel'Thalas's war effort. Anasterian remains on the Phoenix Throne, but his authority is now ceremonial вЂ” the real power has shifted to his son. The prince's supporters call it the renaissance of elven strength. His enemies call it a coup. All agree that Quel'Thalas will never be the same."

QUE_sw_kirin_tor_exchange:0 "Kirin Tor Exchange"
QUE_sw_kirin_tor_exchange_desc:0 "The exchange program Kael'thas envisioned becomes reality. Elven magisters travel to Dalaran to learn battle-magic honed against the Horde's warlocks, while Kirin Tor scholars arrive in Silvermoon to study the Sunwell's unique properties. The flow of knowledge strengthens both nations вЂ” and binds them together in a partnership that transcends the formal structures of the Alliance."

QUE_sw_arcane_innovation:0 "Arcane Innovation"
QUE_sw_arcane_innovation_desc:0 "The collaboration between Silvermoon and Dalaran bears spectacular fruit. Elven arcane theory, refined over ten thousand years, merges with the Kirin Tor's practical innovations in combat magic. New spells are devised вЂ” barriers that drain fel energy, enchantments that turn orcish steel brittle, and innovations in dragonhawk-mounted combat that give Quel'Thalas a new dimension of aerial warfare."

QUE_sw_dalaran_magisters:0 "Dalaran Magisters"
QUE_sw_dalaran_magisters_desc:0 "The Council of Six dispatches a contingent of Kirin Tor battle-mages to Quel'Thalas. These are not scholars but warriors вЂ” mages who have already faced the Horde's warlocks on the battlefields of Lordaeron. Their experience is invaluable, and their presence sends an unmistakable message: Dalaran stands with Quel'Thalas, whatever the Convocation's traditionalists may think."

QUE_sw_silver_covenant:0 "The Silver Covenant"
QUE_sw_silver_covenant_desc:0 "Kael'thas establishes a formal order spanning the arcane practitioners of Quel'Thalas and those high elves serving in Dalaran and the other Alliance kingdoms. The Silver Covenant binds the scattered children of the Sunwell into a single arcane community, sharing knowledge and coordinating magical defense across national borders. It is a network of loyalty to Quel'Thalas вЂ” wherever its members may live."

QUE_sw_dragonhawk_riders:0 "Dragonhawk Riders"
QUE_sw_dragonhawk_riders_desc:0 "The dragonhawks of Quel'Thalas have long served as mounts for elven nobility вЂ” symbols of status rather than weapons of war. Kael'thas sees their potential as combat platforms: swift, manoeuvrable, and capable of carrying a mage or archer above the battlefield. A dedicated corps of dragonhawk riders is established, trained in aerial combat tactics adapted from the Kirin Tor's gryphon riders."

QUE_sw_aerial_superiority:0 "Aerial Superiority"
QUE_sw_aerial_superiority_desc:0 "The dragonhawk corps proves devastatingly effective. Horde formations have no answer to mages raining fire from above, and ranger sharpshooters on dragonhawk-back can eliminate enemy commanders before the ground battle begins. Quel'Thalas achieves air superiority over the Thalassian front вЂ” a decisive advantage that turns the tide against the numerically superior Amani and Horde forces."

QUE_sw_elven_heavy_infantry:0 "Elven Heavy Infantry"
QUE_sw_elven_heavy_infantry_desc:0 "For millennia, elven warfare has emphasised mobility and precision вЂ” ranger patrols, mage duels, and lightning strikes. But the Horde fields heavy infantry in numbers that cannot be countered by rangers alone. Kael'thas orders the creation of a new elven heavy infantry corps: footmen trained in shield-wall tactics, equipped with enchanted plate armour forged in the arcane forges of Silvermoon."

QUE_sw_silvermoon_armories:0 "Silvermoon Armories"
QUE_sw_silvermoon_armories_desc:0 "The industrialisation of elven warfare begins. Silvermoon's arcane forges, once dedicated to crafting art and jewellery, are repurposed for mass production of enchanted arms and armour. The ancient guilds protest the desecration of their sacred workshops, but the prince is unmoved. Every sword that does not reach the front line is a sword that could have saved an elven life."

QUE_sw_houses_of_silvermoon:0 "Houses of Silvermoon"
QUE_sw_houses_of_silvermoon_desc:0 "The noble houses of Quel'Thalas вЂ” Sunstrider, Dawnstar, Emberbirth, and a dozen others вЂ” represent centuries of accumulated power and privilege. Their loyalty, or lack thereof, will determine the kingdom's ability to wage war. The Convocation must address the house rivalries that have paralysed elven politics since the founding of Silvermoon. Unity, or the illusion of it, must be forged."

QUE_sw_sunstrider_ascendancy:0 "Sunstrider Ascendancy"
QUE_sw_sunstrider_ascendancy_desc:0 "The royal house is not merely first among equals вЂ” it is the keystone of the elven arch. Kael'thas asserts the primacy of House Sunstrider over all rival noble houses, centralising authority in the Phoenix Throne. Dissent is silenced not by force but by the sheer political weight of the Sunstrider legacy. When the King вЂ” or the Prince вЂ” speaks, the houses will listen."

QUE_sw_balance_of_houses:0 "Balance of Houses"
QUE_sw_balance_of_houses_desc:0 "Rather than crushing the nobility, Kael'thas seeks to win them to his cause. He offers concessions вЂ” positions on the war council, trade monopolies, marriage alliances вЂ” in exchange for loyalty. It is a more expensive path than outright domination, but it avoids the civil strife that could tear Quel'Thalas apart at the moment of its greatest peril."

QUE_sw_runestone_debate:0 "The Runestone Debate"
QUE_sw_runestone_debate_desc:0 "For millennia, the Ban'dinoriel вЂ” the great barrier powered by the Runestones вЂ” has been Quel'Thalas's ultimate defense. The magisters propose channelling enormous resources into reinforcing it, turning the barrier into an impenetrable shield. The military faction argues that no barrier can hold forever, and that the resources would be better spent on a modern army. The debate threatens to split the kingdom."

QUE_sw_power_ban_dinoriel:0 "Power the Ban'dinoriel"
QUE_sw_power_ban_dinoriel_desc:0 "The magisters win the day. Vast quantities of arcane energy are channelled into the Runestones, strengthening the Ban'dinoriel to levels not seen since the Troll Wars. The barrier becomes a wall of light visible for miles вЂ” an intimidating display of elven power that makes any invader think twice. Quel'Thalas may not project power outward, but nothing will breach its walls."

QUE_sw_shatter_isolation:0 "Shatter Isolation"
QUE_sw_shatter_isolation_desc:0 "Kael'thas makes his most radical argument yet: Quel'Thalas's isolation is not a strategy but a slow suicide. The Ban'dinoriel cannot protect the elven economy from the collapse of human trade, or elven lives from the inexorable advance of the Horde. The prince forces the Convocation to acknowledge reality вЂ” Quel'Thalas must be a participant in the world, not a spectator."

QUE_sw_shipyards_of_queldanas:0 "Shipyards of Quel'Danas"
QUE_sw_shipyards_of_queldanas_desc:0 "The Isle of Quel'Danas has always been a trading port, but never a military shipyard. With the Alliance at war and elven commitment finally formalised, the Crown orders the construction of proper naval facilities on the sacred isle. The move is controversial вЂ” the magisters argue that industrial activity desecrates the Sunwell's sanctuary вЂ” but Kael'thas insists that the Sunwell's children must be defended by sea as well as by land."

QUE_sw_elven_battlefleet:0 "Elven Battlefleet"
QUE_sw_elven_battlefleet_desc:0 "Quel'Thalas commissions its first true battlefleet since the Sundering. Ships of elven design вЂ” swift, elegant, armed with arcane ballistae and crewed by the finest mariners the high elves have ever trained вЂ” take to the seas. The fleet is small by Alliance standards, but what it lacks in numbers it makes up for in magical firepower. The Horde's crude transports will find the northern seas far more dangerous than they expected."

QUE_sw_thalassian_marines:0 "Thalassian Marines"
QUE_sw_thalassian_marines_desc:0 "Elven warriors trained for amphibious assault вЂ” a concept alien to a people who have fought only forest and mountain wars for ten thousand years. But the Second War is global in scope, and Quel'Thalas's enemies operate across oceans. The Thalassian Marines are drawn from the Farstriders' most adaptable veterans, trained to fight on beaches, aboard ships, and in coastal fortifications."

QUE_sw_counter_raid_zul_aman:0 "Counter-Raid into Zul'Aman"
QUE_sw_counter_raid_zul_aman_desc:0 "For the first time since the Troll Wars, elven boots march into the heart of Zul'Aman. The Amani expected to be the aggressors вЂ” they are not prepared to fight on their own soil. Farstrider strike teams slip past crumbling Amani fortifications, burning supply caches, poisoning Loa shrines, and spreading terror among the troll civilians. The hunters have become the hunted."

QUE_sw_purge_forest_trolls:0 "Purge the Forest Trolls"
QUE_sw_purge_forest_trolls_desc:0 "The counter-raid becomes a campaign of annihilation. Elven forces sweep through Zul'Aman systematically, rooting out every Amani encampment, destroying every Loa temple, and ensuring that the forest trolls will not threaten Quel'Thalas again for a generation вЂ” or perhaps forever. It is brutal work, unworthy of a people who claim to value beauty and life. But as Kael'thas coldly observes: 'The trolls chose this war. We will choose its ending.'"

QUE_sw_loa_hunting:0 "Loa Hunting"
QUE_sw_loa_hunting_desc:0 "The Amani draw their power from the Loa вЂ” ancient spirits that grant their champions unnatural strength and resilience. Kael'thas assembles a task force of magisters, Farstriders, and Kirin Tor specialists with a single mission: identify, isolate, and destroy the Amani's spiritual patrons. It is a campaign not of swords and arrows but of counter-ritual and spiritual warfare вЂ” magic against faith, arcane against primal."

QUE_sw_end_of_zul_aman:0 "The End of Zul'Aman"
QUE_sw_end_of_zul_aman_desc:0 "With their Loa broken and their armies shattered, the Amani face extinction. Zul'jin's fortress-city lies exposed, its defenders demoralised and its spiritual power spent. The final assault on Zul'Aman is not a battle вЂ” it is an execution. When the last Amani warchief falls and the forest trolls surrender unconditionally, Quel'Thalas has achieved what it could not accomplish in three thousand years: the annihilation of its most ancient enemy."

QUE_sw_scars_of_the_war:0 "Scars of the War"
QUE_sw_scars_of_the_war_desc:0 "The war is over вЂ” or at least, the fighting has moved elsewhere. Quel'Thalas counts its dead and surveys the damage. Villages lie in ash, ranger lodges stand empty, and the Borderlands will take decades to recover from the Amani's burning. But the elven people have endured. The kingdom begins the long process of healing вЂ” mourning its losses while rebuilding its strength for whatever the future may bring."

QUE_sw_rebuild_the_guard:0 "Rebuild the Guard"
QUE_sw_rebuild_the_guard_desc:0 "The military has paid the heaviest price for victory. Regiments are depleted, ranger companies reduced to a handful of survivors, and the officer corps has lost some of its finest commanders. A new generation of elven soldiers must be raised and trained вЂ” not to continue the war, but to ensure that Quel'Thalas is never again caught unprepared. The Farstriders recruit, the spellbreakers induct, and the armories hum with renewed purpose."

QUE_sw_place_in_the_alliance:0 "A Place in the Alliance"
QUE_sw_place_in_the_alliance_desc:0 "Quel'Thalas has bled alongside the humans, the dwarves, and the gnomes. The shared sacrifice of the Second War has forged bonds that no Convocation debate can sever. The high elves, once aloof and distant, now have a place at the Alliance table вЂ” not as reluctant allies but as full and equal partners. It is a transformation that would have been unthinkable a generation ago, but war changes everything."

QUE_sw_guarantor_of_lordaeron:0 "Guarantor of Lordaeron"
QUE_sw_guarantor_of_lordaeron_desc:0 "The debt of Arathor is not merely honoured вЂ” it is surpassed. Quel'Thalas extends a formal guarantee of independence to Lordaeron, pledging elven steel and elven magic to the defense of the human kingdom that first reached out to the Sunstriders. Terenas Menethil accepts the pledge with tears in his eyes. The ancient pact between human and elf, born in the fires of the Troll Wars and reborn in the fires of the Second, is now unbreakable."

QUE_sw_kaelthas_destiny:0 "Kael'thas's Destiny"
QUE_sw_kaelthas_destiny_desc:0 "The war has changed Kael'thas Sunstrider as surely as it has changed Quel'Thalas. He is no longer merely the impatient prince pacing behind his father's throne вЂ” he is a proven leader, a military reformer, and a diplomat of the first rank. But his future remains unwritten. Will he return to Silvermoon and claim the authority his achievements have earned? Will he remain at his father's side as the kingdom's guiding hand? Or will he honour his commitment to the Kirin Tor and continue his work in Dalaran? Three paths lie before the Prince of the Sun. Only one can be taken."

QUE_sw_the_phoenix_prince:0 "The Phoenix Prince"
QUE_sw_the_phoenix_prince_desc:0 "Anasterian Sunstrider, King of Quel'Thalas for over three thousand years, formally abdicates the Phoenix Throne. In a ceremony witnessed by the Convocation and the leaders of the Alliance, the ancient crown passes from father to son. Kael'thas Sunstrider rises as the new King of Quel'Thalas вЂ” a monarch forged in war, tempered by diplomacy, and committed to leading the high elves into a new era of engagement with the world. The old king watches from the shadows, his expression unreadable."

QUE_sw_sunwell_warning:0 "The Sunwell's Warning"
QUE_sw_sunwell_warning_desc:0 "In the sacred chamber beneath the Sunwell Plateau, the new king performs the Rite of Communion вЂ” the ancient ritual by which the Sunstrider line attunes itself to the Sunwell's power. But what Kael'thas finds disturbs him deeply. The Sunwell's song has changed вЂ” a discordant note beneath the familiar harmony, a cold presence at the edge of perception. The magisters dismiss it as the prince's imagination. Kael'thas knows better. Something is coming. Something that makes the Horde look like a skirmish."

QUE_sw_the_princes_council:0 "The Prince's Council"
QUE_sw_the_princes_council_desc:0 "Kael'thas chooses not to claim the throne but to serve beside it. He establishes the Prince's Council вЂ” a permanent advisory body of military commanders, reformist magisters, and Alliance diplomats вЂ” that effectively governs Quel'Thalas while Anasterian remains the ceremonial sovereign. It is an elegant solution: the kingdom gets the modern leadership it needs without the trauma of a formal abdication."

QUE_sw_united_leadership:0 "United Leadership"
QUE_sw_united_leadership_desc:0 "The Prince's Council proves to be Quel'Thalas's most effective government in generations. With Kael'thas managing military and foreign affairs and Anasterian lending the weight of tradition to domestic matters, the kingdom achieves a balance between change and continuity. The high elves look to the future with confidence, and the Alliance regards Quel'Thalas as a pillar of its Eastern front."

QUE_sw_scholar_of_dalaran:0 "Scholar of Dalaran"
QUE_sw_scholar_of_dalaran_desc:0 "Kael'thas makes the most unexpected choice of all: he returns to Dalaran. Not as a permanent exile, but as Quel'Thalas's permanent ambassador to the Kirin Tor вЂ” a living bridge between the two greatest arcane civilisations. Anasterian keeps his throne, the Convocation keeps its traditions, and the prince keeps his distance. But Kael'thas's influence is undiminished: every mage who passes between Dalaran and Silvermoon carries his vision with them."

QUE_sw_kirin_tor_path:0 "The Kirin Tor Path"
QUE_sw_kirin_tor_path_desc:0 "Kael'thas deepens his commitment to the Kirin Tor, taking on greater responsibilities within the Council of Six. His work in Dalaran produces breakthroughs in defensive magic that benefit the entire Alliance вЂ” barriers that detect fel corruption, enchantments that shield against necromantic magic, and theoretical frameworks that will prove vital in the dark years to come. Quel'Thalas may have lost its prince to Dalaran, but it gains influence that extends far beyond its borders."

QUE_sw_stromgardes_legacy:0 "Stromgarde's Legacy"
QUE_sw_stromgardes_legacy_desc:0 "Stromgarde is the last surviving kingdom of the original Empire of Arathor вЂ” the human nation to whom the high elves swore their original oath. Kael'thas dispatches envoys to Stromgarde Keep with a message of friendship and a proposal for mutual defense. The descendants of Thoradin, proud and martial, receive the elven delegation with cautious warmth. The ancient bond between elf and Arathor, dormant but never broken, stirs again."

QUE_sw_dwarven_engineering:0 "Dwarven Engineering"
QUE_sw_dwarven_engineering_desc:0 "Ironforge's engineers are the finest craftsmen of steel and gunpowder on the continent. Kael'thas proposes a radical exchange: elven enchantments for dwarven gunsmithing. The dwarves, initially sceptical of 'elf magic,' are won over when an enchanted rifle prototype achieves accuracy and range that dwarven engineering alone cannot match. The partnership produces hybrid weapons that combine dwarven durability with elven arcane precision."

QUE_sw_gnomish_technology:0 "Gnomish Technology"
QUE_sw_gnomish_technology_desc:0 "The gnomes of Gnomeregan bring a third dimension to the Alliance's technical collaboration. Where dwarves excel at heavy engineering and elves at arcane theory, gnomes provide innovation вЂ” gadgets, automatons, and inventions that no one else could imagine. Gnomish engineers arrive in Silvermoon with crates of strange devices, and the elven magisters, for the first time in millennia, find themselves genuinely surprised by the ingenuity of a younger race."

###############################
# Kael'thas Expansion вЂ” Events
###############################

kaelthas_expansion.1.t:0 "The Prince of the Sun"
kaelthas_expansion.1.d:0 "Prince Kael'thas Sunstrider strides into the war council chamber, his robes still bearing the dust of the road from Dalaran. 'Father,' he says, bowing before the Phoenix Throne with perfect courtesy вЂ” but his eyes are not those of a supplicant. Anasterian studies his son for a long moment. The boy he sent to Dalaran has returned a man, and a dangerous one at that. 'The Convocation tells me you wish to modernise our military,' Anasterian says flatly. 'I wish to save our kingdom,' Kael'thas replies. 'The distinction, I suspect, will be lost on the magisters.' A flicker of something вЂ” pride? fear? вЂ” crosses the old king's face. He nods. 'Then you shall have your authority. Do not make me regret it.'"
kaelthas_expansion.1.option.1:0 "The prince has his mandate. Let us see what he does with it."

kaelthas_expansion.2.t:0 "The Dalaran Connection"
kaelthas_expansion.2.d:0 "Kael'thas returns to Dalaran not as a student but as an emissary of the Crown. He meets with the Council of Six in the Violet Citadel, where his former mentors now receive him as an equal. The proposal is ambitious: a formal exchange of arcane knowledge, military intelligence, and personnel between Dalaran and Quel'Thalas. Archmage Antonidas, who taught Kael'thas as a young prince, studies the treaty with keen interest. 'You have grown, young Sunstrider,' he observes. 'The question is whether your kingdom has grown with you.' Kael'thas smiles. 'That is precisely what I mean to find out.'"
kaelthas_expansion.2.option.1:0 "The bridge between Dalaran and Silvermoon is strengthened."

kaelthas_expansion.3.t:0 "Kirin Tor Reinforcements"
kaelthas_expansion.3.d:0 "A company of Kirin Tor battle-mages arrives in Silvermoon under the command of Archmage Rhonin, a human mage of considerable power and even more considerable informality. The elves are taken aback by the humans' casual approach to arcane protocol, but they cannot deny the effectiveness of Kirin Tor combat magic. Rhonin bows before Anasterian with a grin. 'Your Majesty, the Council of Six sends its regards вЂ” and a few fireballs.' The Convocation is scandalised. Kael'thas is delighted."
kaelthas_expansion.3.option.1:0 "Welcome the Kirin Tor mages. Their expertise will save elven lives."

kaelthas_expansion.4.t:0 "The Silver Covenant"
kaelthas_expansion.4.d:0 "In a ceremony beneath the Sunwell itself, Kael'thas founds the Silver Covenant вЂ” an order of high elf mages that spans the borders of Quel'Thalas, Dalaran, and every Alliance kingdom where the children of the Sunwell have made their homes. The Covenant's charter is simple: to defend the elven people through shared knowledge and arcane coordination, regardless of which flag flies over their heads. Even Anasterian, sceptical of his son's foreign entanglements, bows his head as the Covenant's first rune is inscribed in the sacred waters."
kaelthas_expansion.4.option.1:0 "The children of the Sunwell are united once more."

kaelthas_expansion.5.t:0 "Wings of Silvermoon"
kaelthas_expansion.5.d:0 "The dragonhawk stables of Eversong Woods have always been places of beauty вЂ” golden beasts gliding between sunlit trees, their riders noble elves in ceremonial armour. Kael'thas replaces ceremony with combat doctrine. The dragonhawk riders are issued enchanted lances, their mounts fitted with lightweight arcane armour, and their training regimen transformed from aerial pageantry to aerial warfare. The first combat exercises are chaotic вЂ” dragonhawks are not gryphons, and elves are not dwarven gryphon-riders вЂ” but within months, the corps is battle-ready."
kaelthas_expansion.5.option.1:0 "The skies of Quel'Thalas now belong to the dragonhawk riders."

kaelthas_expansion.10.t:0 "The Houses Convene"
kaelthas_expansion.10.d:0 "The great houses of Quel'Thalas gather in the Sunfury Spire вЂ” Sunstrider, Dawnstar, Emberbirth, and a dozen others, each with centuries of pride and generations of grievances. The agenda is war, but the subtext is power. House Dawnstar's matriarch demands expanded trade rights in exchange for military levies. House Emberbirth's young lord insists on a command position for his inexperienced son. Through it all, Kael'thas watches with the patience of a mage who has spent decades in Dalaran's political labyrinth. He learned from the best. Now he will teach the Convocation what real power looks like."
kaelthas_expansion.10.option.1:0 "The traditional houses must be placated. Stability demands it."
kaelthas_expansion.10.option.2:0 "This is not a negotiation. The houses serve the Crown, not the reverse."

kaelthas_expansion.11.t:0 "The Convocation Divided"
kaelthas_expansion.11.d:0 "Magister Belo'vir Salonar, Grand Magister of the Convocation, presents the traditionalist case with eloquence born of three thousand years of practice. 'The Ban'dinoriel has protected Quel'Thalas since the Troll Wars. It is impenetrable. Pour our resources into the Runestones, and no orc or troll will ever set foot in Silvermoon.' Across the chamber, Ranger-General Sylvanas Windrunner rises. Her words are fewer but sharper: 'No wall has ever held forever. Armies hold walls. Armies break sieges. Armies win wars.' The Convocation holds its breath."
kaelthas_expansion.11.option.1:0 "Sylvanas is right. Invest in the army."
kaelthas_expansion.11.option.2:0 "Belo'vir is right. Reinforce the barrier at all costs."

kaelthas_expansion.12.t:0 "The Convocation Reforged"
kaelthas_expansion.12.d:0 "Kael'thas Sunstrider stands before the assembled magisters of Silvermoon and delivers the speech his father could never give. 'For three thousand years, the Convocation has been Quel'Thalas's greatest strength вЂ” and its greatest weakness. You have preserved our traditions. You have also been preserved BY them. The world outside our Runestones does not care about precedence or ritual. It cares about power. We will have power, or we will have extinction.' The vote is razor-thin. The reforms pass. The Convocation, for the first time in living memory, changes."
kaelthas_expansion.12.option.1:0 "The old ways bend вЂ” or break. Either way, Quel'Thalas moves forward."

kaelthas_expansion.13.t:0 "The Magisters Defied"
kaelthas_expansion.13.d:0 "Grand Magister Belo'vir's face is ashen as Kael'thas reads the royal decree: the Convocation's veto over military deployments is revoked. Henceforth, the Crown вЂ” and the Crown alone вЂ” commands the armed forces of Quel'Thalas. Several magisters walk out. One threatens to dissolve the Convocation entirely. Kael'thas watches them go with the cold expression of a man who has calculated every consequence. 'Let them walk,' he tells Sylvanas quietly. 'They will walk back when the Amani are at the gates and they have no one else to protect them.'"
kaelthas_expansion.13.option.1:0 "The age of magisterial obstruction is over."

kaelthas_expansion.20.t:0 "The Fall of the Loa"
kaelthas_expansion.20.d:0 "Deep in the haunted forests north of Zul'Aman, elven strike teams locate the first Loa shrine вЂ” a grotesque edifice of bone and feather dedicated to a spirit of predation. The magisters perform a ritual of unbinding, severing the Loa's connection to its worshippers. The shrine collapses, and across the Amani lines, troll berserkers suddenly find their Loa-granted strength draining away. Panic spreads. The Amani's spiritual foundations, unassailable for ten thousand years, are crumbling. Zul'jin's war priests scream into the void, but the void no longer answers."
kaelthas_expansion.20.option.1:0 "Without their gods, the trolls are merely flesh and bone."

kaelthas_expansion.21.t:0 "Guardians of the Sunwell"
kaelthas_expansion.21.d:0 "The magisters are stripped of their exclusive guardianship over the Sunwell. In their place, Kael'thas establishes a Joint Guardianship вЂ” Farstriders providing physical security, Royal Guard maintaining the perimeter, and magisters reduced to an advisory role on arcane matters. The symbolism is devastating to the traditionalists: the heart of elven civilisation is no longer in the hands of scholars but of soldiers. Grand Magister Belo'vir protests with such vehemence that Kael'thas calmly asks whether the Grand Magister would prefer to defend the Sunwell personally when the Horde arrives. Belo'vir falls silent."
kaelthas_expansion.21.option.1:0 "The Sunwell will be defended by those willing to die for it."

kaelthas_expansion.30.t:0 "The Fate of the Prince"
kaelthas_expansion.30.d:0 "The war has transformed Prince Kael'thas Sunstrider from an impatient heir into a proven statesman. Now, in the quiet after the storm, he faces the most personal decision of his life. The Phoenix Throne could be his вЂ” Anasterian is old, weary, and privately has offered to step aside. Or Kael'thas could remain at his father's side, the power behind the throne rather than upon it, guiding Quel'Thalas without breaking the ancient line of succession. Or he could return to Dalaran, to the Kirin Tor, to the life of scholarship and arcane discovery that first captured his heart as a young prince. Three paths. One choice. The future of a kingdom вЂ” and a man вЂ” hangs in the balance."
kaelthas_expansion.30.option.1:0 "Take the crown. Quel'Thalas needs new leadership for a new age."
kaelthas_expansion.30.option.2:0 "Serve beside the King. Kael'thas can guide the kingdom without replacing his father."
kaelthas_expansion.30.option.3:0 "Return to Dalaran. Quel'Thalas has its king вЂ” the Kirin Tor needs its prince."

kaelthas_expansion.31.t:0 "The Phoenix Crown"
kaelthas_expansion.31.d:0 "The coronation of Kael'thas Sunstrider is the most magnificent event Quel'Thalas has witnessed since the founding of Silvermoon. Delegations from every Alliance kingdom fill the Sunfury Spire вЂ” humans, dwarves, gnomes, and high elves shoulder to shoulder in a display of unity that would have been unthinkable a generation ago. Anasterian, his face unreadable, places the ancient crown upon his son's brow with hands that tremble only slightly. 'The Sunwell's light upon you, my son,' the old king whispers. 'You will need it.' Kael'thas rises, the Phoenix Crown blazing with inner fire, and turns to face his people вЂ” and his allies. His first act as king is to reaffirm Quel'Thalas's place in the Alliance. His second is to order the military to full readiness. The prince who always feared war now reigns in an age that demands nothing less."
kaelthas_expansion.31.option.1:0 "Long live King Kael'thas Sunstrider!"

kaelthas_expansion.32.t:0 "The Crown Council"
kaelthas_expansion.32.d:0 "Kael'thas formally declines his father's offer of abdication. Instead, he creates the Crown Council вЂ” a permanent war cabinet composed of the Ranger-General, the Grand Magister, the commander of the Royal Guard, and Kael'thas himself as First Councillor. Anasterian retains the crown but delegates all military and foreign policy to the Council. It is a compromise that satisfies no one completely вЂ” the traditionalists resent Kael'thas's power, and the reformers wish he had taken the crown outright вЂ” but it works. Quel'Thalas gets modern leadership without the instability of a sudden succession."
kaelthas_expansion.32.option.1:0 "A compromise that preserves tradition while embracing necessary change."

kaelthas_expansion.33.t:0 "The Violet Road"
kaelthas_expansion.33.d:0 "Kael'thas Sunstrider packs his belongings and returns to Dalaran. It is not a retreat but a strategic repositioning. As Quel'Thalas's permanent representative on the Council of Six, Kael'thas wields influence that reaches far beyond Silvermoon's walls. Every arcane discovery made in Dalaran flows to Quel'Thalas. Every Alliance decision passes through the prince's hands. Anasterian keeps his crown, the Convocation keeps its dignity, and Kael'thas keeps his freedom. 'Sometimes,' he tells Archmage Antonidas, 'the most powerful position is the one that doesn't look powerful at all.'"
kaelthas_expansion.33.option.1:0 "The prince serves Quel'Thalas best from the Violet Citadel."

kaelthas_expansion.40.t:0 "Forging Bonds of Steel"
kaelthas_expansion.40.d:0 "The first joint elven-dwarven workshop opens in the industrial quarter of Silvermoon вЂ” an unlikely pairing of elven arcane finesse and dwarven metallurgical mastery. Foreman Thalgas Ironmantle, a gruff dwarf with a beard that has seen the inside of a dozen forges, examines an elven spellblade with professional scepticism. 'Pretty,' he admits grudgingly. 'But can it hold an edge against orcish plate?' The elven smiths take the challenge personally. Within a month, the workshop is producing hybrid weapons вЂ” dwarven-forged steel, elven-enchanted edge вЂ” that represent the finest military craftsmanship on the continent."
kaelthas_expansion.40.option.1:0 "The finest steel of Ironforge meets the finest magic of Silvermoon."

kaelthas_expansion.41.t:0 "The Blood of Thoradin"
kaelthas_expansion.41.d:0 "Lord Danath Trollbane of Stromgarde receives the elven delegation in the great hall of Stromgarde Keep, beneath the tattered banners of a dozen Troll Wars campaigns. He is a warrior king in the mould of his ancestors вЂ” blunt, proud, and unimpressed by elven ceremony. 'You want our friendship?' Danath asks, his voice echoing off the ancient stone. 'My great-great-grandfather fought beside your great-great-grandfather at the Battle of the Alterac Mountains. Honor that sacrifice, and we have our friendship.' The envoy bows. 'We remember, Lord Trollbane. The blood of Thoradin has never been forgotten in Silvermoon.'"
kaelthas_expansion.41.option.1:0 "The ancient pact is renewed. Stromgarde and Quel'Thalas stand together."

kaelthas_expansion.50.t:0 "The Sea Wolves of Quel'Danas"
kaelthas_expansion.50.d:0 "The first company of Thalassian Marines completes its training on the shores of the Isle of Quel'Danas. These are not traditional elven warriors вЂ” they are Farstriders retrained for amphibious operations, sailors taught to fight with sword and spell on rolling decks, and magisters specialising in naval combat magic. Their commander, a grizzled Farstrider veteran named Captain Sunstriker, surveys his troops with grim satisfaction. 'We look ridiculous in these boats,' he admits. 'But wait until the Horde sees what an elf can do with a cutlass and a fireball.'"
kaelthas_expansion.50.option.1:0 "The Thalassian Marines are ready for deployment."

kaelthas_expansion.51.t:0 "The Sunstrider Fleet"
kaelthas_expansion.51.d:0 "The flagship of the new elven battlefleet вЂ” the Sunstrider's Vengeance вЂ” slides into the waters of Quel'Danas under the gaze of the entire Convocation. She is a vessel unlike any Azeroth has seen: elven lines married to naval architecture, arcane ballistae mounted where human ships would carry cannons, and a crew of elven mariners trained by the finest captains the Alliance could spare. Anasterian, standing at the pier, watches the ship with an expression few can read. 'In three thousand years,' he murmurs to Kael'thas, 'I never thought I would see a Sunstrider warfleet.' Kael'thas's reply is soft: 'In three thousand years, Father, we never needed one.'"
kaelthas_expansion.51.option.1:0 "The elven fleet sails. Let the Horde tremble."

kaelthas_expansion.60.t:0 "Into the Heart of Darkness"
kaelthas_expansion.60.d:0 "The first elven raiders slip past the outer defenses of Zul'Aman under cover of darkness. Their mission is not conquest вЂ” it is terror. Amani supply caches go up in arcane flames. Troll sentries are found dead, their throats cut with elven precision. Loa shrines are desecrated with counterspells that leave the attending priests howling in spiritual agony. By dawn, the Amani warchiefs are demanding to know how the elves breached their defenses. Zul'jin, the great warlord, offers no answers. For the first time in his long life, he is afraid."
kaelthas_expansion.60.option.1:0 "Zul'jin's fortress is no longer a sanctuary. It is a trap."

kaelthas_expansion.70.t:0 "Counting the Cost"
kaelthas_expansion.70.d:0 "The lists of the dead are read aloud in the Sunfury Spire вЂ” names of rangers, soldiers, magisters, and civilians who will never see the golden spires of Silvermoon again. The Convocation sits in silence. Anasterian's face is a mask of grief. But amidst the mourning, there is something else: pride. Quel'Thalas stood. Quel'Thalas fought. Quel'Thalas survived. The kingdom is battered but unbroken, and the experience of war has transformed the high elves from a reclusive people into a hardened nation. The dead are honoured. The living rebuild."
kaelthas_expansion.70.option.1:0 "We mourn our losses. Then we rise again."

kaelthas_expansion.71.t:0 "The Alliance Victorious"
kaelthas_expansion.71.d:0 "In the throne room of Lordaeron, the leaders of the Grand Alliance gather to celebrate their hard-won victory. King Terenas embraces Kael'thas as an equal. King Magni Bronzebeard raises a tankard of dwarven ale in toast to 'the pointy-eared lads who saved our flank at the Thandol Span.' Even the notoriously dour Genn Greymane of Gilneas offers a grudging nod of respect. Quel'Thalas has earned its place among the great powers of the Eastern Kingdoms. The isolation of the high elves is over вЂ” forever."
kaelthas_expansion.71.option.1:0 "Quel'Thalas's future lies with the Alliance."

kaelthas_expansion.72.t:0 "A Shadow in the Light"
kaelthas_expansion.72.d:0 "In the sacred chamber beneath the Sunwell, Kael'thas performs the ancient Rite of Communion alone. The golden waters ripple as the Sunwell's power flows through him вЂ” familiar, warm, eternal. But then he senses it. A cold current beneath the warmth. A darkness at the edge of the light. The Sunwell is aware of something вЂ” a presence, a threat, a future that it cannot quite articulate but cannot ignore. Kael'thas opens his eyes, his face pale. 'Something is coming,' he whispers. 'Something that makes the Horde look like a prelude.' The Sunwell has given its warning. Whether anyone will listen is another matter entirely."
kaelthas_expansion.72.option.1:0 "The Sunwell knows. We must prepare."
