###############################
# Alterac Second War Focus Tree
###############################

 ALT_sw_perenoldes_fear:0 "Perenolde's Fear"
 ALT_sw_perenoldes_fear_desc:0 "King Aiden Perenolde watches from the mountain spires of Alterac City as the Horde rolls across the southern kingdoms. Stormwind has fallen. Khaz Modan burns. The orcish war machine, once a distant rumor, is now a reality that shakes the very foundations of the north. Perenolde is not a warrior king — he is a survivor, a man who understands that Alterac's mountain passes may be the only thing standing between his small kingdom and annihilation. Fear is not cowardice when the enemy outnumbers you ten to one. Fear is clarity."

 ALT_sw_alteracs_guardians:0 "Alterac's Guardians"
 ALT_sw_alteracs_guardians_desc:0 "The mountain passes of Alterac have always been defended by a small but determined corps of hill warriors — men who know every crevice, every rockfall, every hidden path through the peaks. With proper leadership and equipment, these guardians could make a Horde advance through Alterac a bloody nightmare. The question is not whether they can fight. The question is whether Perenolde will let them."

 ALT_sw_open_to_horde_debate:0 "A Kingdom's Choice"
 ALT_sw_open_to_horde_debate_desc:0 "The royal council is divided. Some nobles argue for fortifying the passes and standing with the Alliance of Lordaeron. Others whisper that Alterac's only hope of survival is to negotiate with the Horde — to open the mountain passes and buy peace with Orgrim Doomhammer's gratitude. Perenolde sits on his throne, outwardly calm, inwardly tormented. The decision he makes now will define Alterac's future — and perhaps all of Lordaeron's."

 ALT_sw_alterac_secret_council:0 "The Secret Council"
 ALT_sw_alterac_secret_council_desc:0 "The king summons his most trusted advisors to a private chamber deep within the castle. No scribes are present. No records are kept. The men who emerge from that room will carry with them the kingdom's most dangerous secret: whether Perenolde intends to honor his alliance with Lordaeron or pursue a separate peace with the Horde. The walls of Alterac City have never held a heavier silence than tonight."

 ALT_sw_fortify_the_passes:0 "Fortify the Passes"
 ALT_sw_fortify_the_passes_desc:0 "The decision is made: Alterac will not open its passes to the Horde. Instead, every mountain path, every stone bridge, every narrow defile will be fortified until it becomes a deathtrap for any advancing orc army. The kingdom's small but motivated army begins constructing bunkers, laying traps, and preparing for the worst. Let the Horde come. The mountains of Alterac have been a fortress since before humans learned to build walls — they will not fail us now."

 ALT_sw_secret_negotiations:0 "Secret Negotiations"
 ALT_sw_secret_negotiations_desc:0 "Under cover of darkness, a small delegation slips out of Alterac City toward the Horde lines. They carry a simple message from King Perenolde to Orgrim Doomhammer: Alterac is willing to discuss terms. The passes could be open to the Horde — for a price. It is treason of the highest order, but Perenolde has convinced himself that surrender is the only form of survival left. History will not be kind, but a living traitor is still alive."

 ALT_sw_general_hath:0 "General Hath"
 ALT_sw_general_hath_desc:0 "General Hath, Commander of the Alterac Guard, is everything Perenolde is not: bold, uncompromising, and fiercely loyal to the human kingdoms. He has trained Alterac's mountain troops for years and knows the terrain better than any living officer. Hath argues passionately against any surrender to the Horde, and his voice carries weight with both the army and the common people. The king may consult his secret council — but General Hath speaks for the spirit of Alterac itself."

 ALT_sw_warn_the_alliance:0 "Warn the Alliance"
 ALT_sw_warn_the_alliance_desc:0 "Riders are dispatched to Lordaeron and Stromgarde carrying detailed intelligence on Horde movements near the Alterac front. King Perenolde publicly reaffirms his commitment to the Alliance, and offers Alterac's mountain fortifications as the anchor point of the northern defensive line. Terenas Menethil receives the news with cautious relief — an ally in the mountains is worth ten on the plains."

 ALT_sw_open_the_passes:0 "Open the Passes"
 ALT_sw_open_the_passes_desc:0 "The die is cast. Alterac's mountain passes, guarded for centuries against invaders from any direction, are quietly opened to the Horde. Orcish columns begin streaming through the narrow defiles under cover of night, bypassing the heavily fortified Alliance positions to the south. The kingdom's betrayal is complete. Perenolde watches from his castle window, telling himself that this is necessary — that Alterac will survive when others fall."

 ALT_sw_mountain_defense_tactics:0 "Mountain Defense Tactics"
 ALT_sw_mountain_defense_tactics_desc:0 "General Hath has spent his entire military career preparing for a war in the mountains. His doctrine of fighting retreats, high-ground ambushes, and avalanche traps transforms the defensible into the unassailable. His officers train relentlessly in altitude combat, and the Alterac Guard becomes perhaps the most dangerous mountain-fighting force on the continent — if given the chance to prove it."

 ALT_sw_alliance_military_aid:0 "Alliance Military Aid"
 ALT_sw_alliance_military_aid_desc:0 "Lordaeron and Stromgarde, grateful for Alterac's cooperation, begin shipping armaments, supplies, and military advisors to reinforce the mountain kingdom's defenses. Convoys of steel-tipped arrows, fresh horses, and banded armor wind their way up the mountain roads. The Alliance understands that a strong Alterac is a shield for the entire north. Perenolde accepts the aid with gracious words, even as part of him wonders what might have been."

 ALT_sw_hide_evidence:0 "Hide the Evidence"
 ALT_sw_hide_evidence_desc:0 "The Horde's passage through the mountains cannot be completely concealed — scouts have seen strange fires, farmers have heard movements in the night. Perenolde's agents work feverishly to suppress the rumors, bribe witnesses, and 'disappear' inconvenient evidence. The king's informant network, long used to spy on his own nobles, now turns its attention to keeping the kingdom's darkest secret buried. For now, the secret holds."

 ALT_sw_honor_among_enemies:0 "Honor Among Enemies"
 ALT_sw_honor_among_enemies_desc:0 "Perenolde sends envoys to Orgrim Doomhammer bearing tribute — gold from the mountain mines, supplies for the Horde armies, and a formal expression of 'respect between warriors.' The Doomhammer, for all his ruthlessness, understands the value of a cooperative ally. The Horde honors its side of the bargain more than Perenolde expected. For now, Alterac is safe — and the mountains are eerily quiet as the orc legions march through toward Lordaeron's heartland."

 ALT_sw_alterac_intrigue:0 "Spymaster Isiden"
 ALT_sw_alterac_intrigue_desc:0 "Isiden Perenolde, the king's cousin, runs Alterac's intelligence network with quiet efficiency. His informants are everywhere — in the courts of Lordaeron, in the taverns of Hillsbrad, even in the Horde camps. Isiden knows the secrets of every noble house in the north and has developed a talent for using information as a weapon. General Hath might command the army, but Isiden commands the shadows."

 ALT_sw_mountain_fortress:0 "The Mountain Fortress"
 ALT_sw_mountain_fortress_desc:0 "Alterac transforms itself into a fortress the likes of which the north has never seen. Bunkers are carved into living rock. Passes are rigged to collapse on any invader. Watchtowers on every peak relay signals faster than any rider. The kingdom that was once considered the weakest of the human realms becomes, through sheer determination and strategic genius, the hardest nut the Horde could ever try to crack. The mountains are no longer just geography — they are a weapon."

 ALT_sw_horde_moves_through:0 "The Horde Moves Through"
 ALT_sw_horde_moves_through_desc:0 "It happens exactly as planned — and yet more terribly than anyone imagined. Tens of thousands of orcs pour through the Alterac passes, a river of green skin and iron that seems to flow forever. The sound of their drums echoes through the valleys. The smoke of their campfires stains the peak snows gray. Perenolde watches from his castle window as the army that could have destroyed his kingdom instead becomes, for a terrible moment, its uninvited guests. The price of survival has never looked so monstrous."

 ALT_sw_spymaster_isiden:0 "Spymaster Isiden"
 ALT_sw_spymaster_isiden_desc:0 "Isiden Perenolde expands his intelligence network into a shadow government within the kingdom. His informants monitor not only foreign enemies but domestic dissent — nobles who whisper about the king's cowardice, generals who advocate for joining the Alliance, merchants who trade too freely with Lordaeron. Isiden's reports end up on the king's desk each morning, a catalog of suspicion that keeps Perenolde informed, if not safe."

 ALT_sw_alteracs_redemption:0 "Alterac's Redemption"
 ALT_sw_alteracs_redemption_desc:0 "The Alliance holds. The Horde breaks against fortified lines that Alterac helped anchor. King Perenolde, once suspected of wavering, is hailed as the steadfast defender of the mountain passes — the king who held the line when others faltered. The rehabilitation of Alterac's reputation among the human kingdoms is complete. Perenolde, a man who nearly chose betrayal, is remembered as a man who chose honor."

 ALT_sw_alliance_discovers:0 "The Truth Revealed"
 ALT_sw_alliance_discovers_desc:0 "The secret unravels. A captured orc reveals the truth under interrogation. A scout reports seeing Horde banners in a valley that should have been guarded. A noble, long suspicious of Perenolde's motives, finds proof and dispatches riders to Lordaeron. The Alliance learns that Alterac opened its mountain passes to the enemy — that the near-loss of Capital City can be laid at the feet of King Aiden Perenolde. The reaction is swift, furious, and devastating."

 ALT_sw_perenoldes_legacy:0 "Perenolde's Legacy"
 ALT_sw_perenoldes_legacy_desc:0 "The king looks out over his kingdom and sees not the glorious future he once imagined, but the reality of what Alterac has become — a mountain fortress, guarded by shadows and secrets, protected by a network of spies and informants. This is Perenolde's legacy: not glory, not expansion, but survival at any cost. The kingdom endures, guarded by Hath's soldiers and Isiden's spies. Whether that endurance is a victory or merely a long, slow defeat is a question for another age."

 ALT_sw_legacy_of_alterac:0 "Legacy of Alterac"
 ALT_sw_legacy_of_alterac_desc:0 "The war ends, and Alterac stands — bloodied but unbowed, small but respected. The mountain kingdom that was once considered the weakest link in the Alliance emerged as one of its most steadfast members. Perenolde's name is spoken with respect in the halls of Lordaeron. Alterac's soldiers march in victory parades. The kingdom may never be the richest or the grandest, but it has earned something rarer: the unshakeable respect of its peers and the survival of its people."

 ALT_sw_kingdom_occupied:0 "Kingdom Occupied"
 ALT_sw_kingdom_occupied_desc:0 "Lordaeronian troops march into Alterac City not as liberators but as occupiers. Perenolde is seized in his own throne room. The Alliance of Lordaeron places Alterac under direct military governance, stripping the kingdom of its sovereignty and its king of his crown. The mountain passes that served the Horde so well now serve their new masters. The kingdom of Alterac, as a political entity, effectively ceases to exist."

 ALT_sw_syndicate_forms:0 "The Syndicate Forms"
 ALT_sw_syndicate_forms_desc:0 "From the ashes of occupation, a new force rises. Perenolde loyalists, dispossessed nobles, and the king's shadow network coalesce into the Syndicate — a criminal organization that will plague the Alterac Mountains for years to come. They operate from hidden camps, striking at Alliance patrols and carving out a domain in the lawless highlands. The kingdom may be gone, but the king's influence endures in the most criminal of forms."

 ALT_sw_traitors_spoils:0 "The Traitor's Spoils"
 ALT_sw_traitors_spoils_desc:0 "Before the Alliance can seize everything, Perenolde's agents move the kingdom's portable wealth — gold, artifacts, and sensitive documents — to hidden locations throughout the mountains. The king, even in defeat, ensures that his family and his loyalists will have resources. It is a final act of cunning from a man who was always better at survival than at honor. The Syndicate will be well-funded, whatever else it lacks."

###############################
# Alterac Second War Events
###############################

 alterac_second_war.1.t:0 "The Horde Envoy"
 alterac_second_war.1.d:0 "A hooded figure arrives at the castle gates under cover of darkness, carrying a message sealed with the crude but unmistakable mark of Orgrim Doomhammer. The envoy's offer is simple and devastating: open Alterac's mountain passes to the Horde, and the kingdom will be spared. Refuse, and Alterac will be crushed like Stormwind. The council chambers grow cold as King Perenolde reads the letter. Every eye is on the king. Every breath is held. The fate of Alterac rests on a single decision — and Perenolde must make it now."

 alterac_second_war.1.option.1:0 "Accept the offer. We will deal with the Horde."
 alterac_second_war.1.option.1.tt:0 "Alterac will enter secret negotiations with the Horde."

 alterac_second_war.1.option.2:0 "Refuse. We will not betray our allies."
 alterac_second_war.1.option.2.tt:0 "Alterac will honor its commitment to the Alliance."

 alterac_second_war.2.t:0 "The Betrayal Revealed"
 alterac_second_war.2.d:0 "The truth is out. The Alliance of Lordaeron has discovered that King Aiden Perenolde secretly opened Alterac's mountain passes to the Horde, allowing Orgrim Doomhammer's legions to bypass the Alliance defensive lines and nearly reach Capital City. The scale of the betrayal staggers the human kingdoms. Soldiers who died holding the front lines were stabbed in the back by the very king they were supposed to protect. In Alterac, the news spreads like wildfire — half the kingdom burns with shame, while the other half braces for what comes next."

 alterac_second_war.2.option.1:0 "There is no hiding it now."

 alterac_second_war.3.t:0 "The Occupation of Alterac"
 alterac_second_war.3.d:0 "Lordaeronian troops march through the streets of Alterac City. King Aiden Perenolde is seized by Alliance soldiers in his own throne room, his crown stripped from his head, his guards disarmed without a fight. The Alliance of Lordaeron places Alterac under direct military occupation, dissolving the kingdom's government and reducing Perenolde to a prisoner and a traitor. The mountain kingdom, which survived centuries of war and strife, falls not to the Horde but to the consequences of its own king's treachery. The occupation has begun — and from the shadows of the fallen kingdom, new and darker things will emerge."

 alterac_second_war.3.option.1:0 "The king is deposed. The kingdom is lost."

