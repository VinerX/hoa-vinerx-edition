HWT_chief_hawkwind:0 "Chief Hawkwind"
POLITICS_CHIEF_HAWKWIND_DESC:0 "Noble Chief Hawkwind is the wise son of Greatmother Hawkwind, a principled Tauren entasked with the stewardship of Camp Narache and her surrounding lands. He is a kind-hearted patriarch, but his goodly aspect belies his strength of will. He will brook no incursion upon either his tribe's territory, nor threat to his people, and he has maintained a working alliance with Bloodhoof Village to ensure there are Braves enough to ensure the tribe's safety. \n The Hawkwind Tribe, under his leadership, has ever lived by the traditions of the Tauren, hunting only for necessity and sport. In accordance with the will of the Earthmother, theirs is a wholesome life centered about the pillars of integrity, honor and courage, and from Camp Narache many wise and strong Tauren have risen to prominence. Unfortunately, their peaceable lands suffer constant territorial friction with the aggressive Quillboar of the Bristleback... But far darker clouds loom on the horizon and soon, Chief Hawkwind and, indeed, all the good-hearted Tauren of Mulgore may find themselves locked in a battle for the future of Kalimdor itself."

