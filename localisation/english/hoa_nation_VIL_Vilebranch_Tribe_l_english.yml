VIL_vile_priestess_hexx:0 "Vile Priestess Hexx"
POLITICS_VILE_PRIESTESS_HEXX_DESC:0 "Leader of the Vilebranch, a splinter tribe of the once great Hakkari, Vile Priestess Hexx seeks to unify the forest trolls in the Hinterlands and convert them to worship the great loa of blood, Hakkar the Soul Flayer. Possessing one of the last eggs of Hakkar, Hexx is ever seeking for answers and ways to restore her master to life."

