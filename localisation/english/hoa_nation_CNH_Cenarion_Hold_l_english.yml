CNH_the_captains_report:0 "The Captains Report"
CNH_the_captains_report_desc:0 "The Captains Scouting Reports have once again show no unusual activity, Though he has mentioned it would seem a few members from the Talon Den have traveled to the Hold for a sabbatical from the constant activiy in Nighthaven."

CNH_the_missing_mistress:0 "The Missing Mistress"
CNH_the_missing_mistress_desc:0 "The Commanders Wife Natalia has gone missing, no guards have reported her leaving the camp and there have been no attacks, the Commander has ordered us to find her as quickly as possible."

CNH_the_commanders_charge:0 "The Commanders Charge"
CNH_the_commanders_charge_desc:0 "The Commander is gone, while reviewing the captains reports he looked up from the table, Looked directly at Hive'Ashi, Grabbed his Spear and bolted towards the Hive, a few of the guards joined him in his mad dash, but we are stretched too thin."
CNH_reunited_at_last:0 "Reunited At Last"
CNH_reunited_at_last_desc:0 "The Commander has returned, the guards saw him and two of his men making a fighting retreat from the hive. Though we are all happy to see him return Natalia is not in good shape, she was missing for weeks and looks sickly, she barely speaks, and only in whispers."

CNH_search_the_hives:0 "Search The Hives"
CNH_search_the_hives_desc:0 "Trackers have been deployed to search for clues as to Natalia's location, unfortunatly signs point towards a possible abdution by the Silithids."
CNH_restrain_the_commander:0 "Restrain The Commander"
CNH_restrain_the_commander_desc:0 "Natalia's Remains have been discovered in Hive'Ashi, upon recieving the news the commander seemed quite stoic, however moments later he had to be restrained as he ordered an all out assault on the Hive."
