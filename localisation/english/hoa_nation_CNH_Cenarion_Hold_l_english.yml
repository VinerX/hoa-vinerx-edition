#events
###############################

cenarion_hold.1.t:0 "The Sands Rise"
cenarion_hold.1.d:0 "Reports from Silithus have come through too late, the three Hives have begun a full scale assault on the Hold, we are on a war on two fronts and what is worse is it seems a large group of druids have just left to return to Moonglade."
cenarion_hold.1.option.1:0 "Vish, see to the East"

cenarion_hold.2.t:0 "Drudic Apprentices"
cenarion_hold.2.d:0 "Moonglade has seen fit to send a large number of Apprentices to our hold, though it would seem that though we have a choice in the matter of who we take in, their skills seem to be quite limited to one aspect."
cenarion_hold.2.option.1:0 "Balance in All Things"
cenarion_hold.2.option.2:0 "As Nimble as a Cat"
cenarion_hold.2.option.3:0 "Stoic like a Bear"

cenarion_hold.3.t:0 "One Final Act"
cenarion_hold.3.d:0 "As the horde of Silithid continue to overrun us, Mar'alith and the remaining forces prepare for a last stand, only to discover the rest of the coward druids have already began to flee north. Kairozdormu had used his foresight to try to save as many of us as he could, but he had ran out of options and had decided to stand with us till the end. As the forces stood at the edge of the crater Kairozdormu released a cloud from his very being, covering the defenders in a thick sand as his scales shifted from Bronze to dark blue, and in an instant...everything that had touched the sands of Silithus had been frozen in time."
cenarion_hold.3.option.1:0 "We live...but for how long."

cenarion_hold.4.t:0 "Retreat to the Dream"
cenarion_hold.4.d:0 "Knowing full well that the Bronze Dragons magic could fail at any moment, those who could seeked shelter in the caves to the north, with hopes that they may find piece in the dream before the end. However before Plans could be finalized the Crater was rocked by sudden Vibrations as the Barriers placed upon the Northern and Western Pylons failed and the Eastern Pylon suddenly activated by itself, we prepared for an attack but instead silence, even the Silithid remnants stop their attacks and became docile, Kairozdormu mentioned the Pylons were designed by the Titans, whoever these beings are they may hold the key to stopping the Silithids once and for all."
cenarion_hold.4.option.1:0 "There is no time to waste!"

cenarion_hold.5.t:0 "Parley with the Trolls"
cenarion_hold.5.d:0 "Knowing full well that the Bronze Dragons magic could fail at any moment, a few of our remaining warriors had gathered supplies to make a trip into the Farraki Territory, in hopes of securing safe passage north. However before Plans could be finalized the Crater was rocked by sudden Vibrations as the Barriers placed upon the Northern and Western Pylons failed and the Eastern Pylon suddenly activated by itself, we prepared for an attack but instead silence, even the Silithid remnants stop their attacks and became docile, Kairozdormu mentioned the Pylons were designed by the Titans, whoever these beings are they may hold the key to stopping the Silithids once and for all."
cenarion_hold.5.option.1:0 "There is no time to waste!"

cenarion_hold.6.t:0 "Primal Animal Forms"
cenarion_hold.6.d:0 "With limited access to the teaches of the circle of the claw, a few individuals have begun to seek other ways to commune with nature"
cenarion_hold.6.option.1:0 "Bark Skinned Hunters"
cenarion_hold.6.option.2:0 "A Roaring Stone"

cenarion_hold.10.t:0 "Naga Incursion"
cenarion_hold.10.d:0 "Commander, the dig site is full of Naga, we have sent whoever is avaliable to put a stop to their scheme and save the site workers."
cenarion_hold.10.option.1:0 "Scaled Bastards!"

cenarion_hold.11.t:0 "The Slaughter"
cenarion_hold.11.d:0 "They were our people, what foul arcane bullshit was this? The Workers found old bones, and that when someone touched them turned them, and everyone near them into naga, the screams we heard were the pain of the transfomation, not them being attacked."
cenarion_hold.11.option.1:0 "The Arcane should never have been used."

