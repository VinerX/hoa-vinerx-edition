CNH_for_all_that_was_lost_desc:0 ""

CNH_safety_first_apologies_later:0 "Safety First, Apologies Later"
CNH_safety_first_apologies_later_desc:0 "Many of the Apprentices are young, they fear there will be repercussions for them continuing to assist us after their Masters have left."
CNH_first_lessons_of_the_wild:0 "First Lessons of the Wild"
CNH_first_lessons_of_the_wild_desc:0 "Though the Cenarion Circle teaches a more nuanced stance towards combat, staying alive is our main priority. The Apprentices will need to be soldiers first, preservers of nature second."

