CNH_missing_guards_desc:0 "A Patrol to the North east has gone missing, though it is too early to worry it would be practical to send our scouts to at least confirm if they have been taken."
CNH_quiet_investigations:0 "Quiet Investigations"
CNH_quiet_investigations_desc:0 "We must ensure we do not interfere with the hives to the best of our ability, as such druids who can shift into small creatures shall be used to find information."
CNH_memorials_and_mourning:0 "Memorials & Mourning"
CNH_memorials_and_mourning_desc:0 "Unfortunatly we have found the missing Guards, it would see they were abducted by a new strain of Silithid that pulled them under the sands faster then they could alert the other sentries."
CNH_vigil_over_the_sands:0 "Vigil Over the Sands"
CNH_vigil_over_the_sands_desc:0 ""
CNH_recovered_from_the_sands:0 "Recovered From the Sands"
CNH_recovered_from_the_sands_desc:0 "The Silithid have withdrawn slightly from the west, it would seem whatever digging they had done there no longer interests them, however the Scouts have recovered a few relics from the war of the shifting sands, few belong to the circle, but the sentinels would be happy to recive them."
CNH_feathermoon_stronghold:0 "Feathermoon Stronghold"
CNH_feathermoon_stronghold_desc:0 "Feathermoon Stronghold is the closet safe port in the south, the sister of elune stand guard there keeping the tides safe for any supplies the circle may send us."
