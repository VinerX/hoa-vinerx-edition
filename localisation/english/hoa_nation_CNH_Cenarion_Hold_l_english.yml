CNH_archival_access:0 "Archival Access"
CNH_archival_access_desc:0 "Due to unprecidented circumstances the Titan Watcher has granted us access to all knowledge relating to the craters ecosystem...and the titans Interference with it"
CNH_sapling_spring:0 "Sapling Spring"
CNH_sapling_spring_desc:0 ""
CNH_eonars_charge:0 "Eonars Charge"
CNH_eonars_charge_desc:0 "The Watchers Records list Eonar as the patron of all life and nature, she is the one responsible for G'Hanir or what the druids have called the Great Bough in the Emerald dream...if only their short sightedness had not cause them to leave so early."

CNH_thistleshrub_awakening:0 "Thistleshrub Awakening"
CNH_thistleshrub_awakening_desc:0 "The Bog Beasts of Tanaris seem to be much calmer then those we have encountered before, they are actively seeking out or people to render assistance, it is though they understand the threat posed by the Silithid"
CNH_a_new_grove:0 "A New Grove"
