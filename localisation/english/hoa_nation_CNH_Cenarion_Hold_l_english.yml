CNH_the_northern_hive_desc:0 "Finding any way to contain the Commanders anger has led to an unexpected result, scouts to the north have found that the Zukk'ash Silithid dont seem to have the same type of Hive mentality that the other Silithid Share in Silithus, it would seem our fear of stiring up a swarm has blinded us to the limits of C'Thun's reach."
