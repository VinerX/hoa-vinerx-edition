CNH_send_a_messenger:0 "Send a Messenger"
CNH_send_a_messenger_desc:0 "The Sea is within our grasp, but this is not a suitable area to build a port, we must first deal with the Sea Giants, but before that, we shall send a messenger to the Commander of Feathermoon Hold so she may understand our intent."
