CNH_the_bronze_messenger:0 "The Bronze Messenger"
CNH_the_bronze_messenger_desc:0 "At first we had thought we were under attack by a new strain of monstrous Silithid, many of the men were almost blown away by the heavy beats of the dragons wings. It would seem we had activated a machine of 'Titan' Design and the Dragon Kairozdormu was interested in who had done such a thing."
CNH_temporal_barrier:0 "Temporal Barrier"
CNH_temporal_barrier_desc:0 "Kairozdormu has projected a form of time barrier over the pylon in an attempt to reduce possible damage to the structure."
CNH_concerning_news:0 "Concerning News"
CNH_concerning_news_desc:0 "Our Bronze Dragon Ally has reported that the Elementals in the center of the crater have become more and more agitated, it would seem they have been effected by the Pylons activation in some way."

