CNH_bog_beast_proliferation:0 "Floral Proliferation"
CNH_bog_beast_proliferation_desc:0 "It would seem that a large portion of the Thistleshrub have decended into the Crater to assist us, that or they have finally gotten tired of singeing their roots in the desert."
CNH_crystal_pylon_research:0 "Pylon Research Notes"
CNH_crystal_pylon_research_desc:0 ""
CNH_stand_on_principles:0 "Stand on Principles"
CNH_stand_on_principles_desc:0 "When the Bulk of the Druids left the hold due to their objections to our methods or complete cowardice they left a number of their apprentices behind, though not as well trained as their masters they have stood with us against the chitin tide."

