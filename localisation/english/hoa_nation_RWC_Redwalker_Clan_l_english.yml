###############################

###############################
#ideas
###############################

RWC_predation_and_infighting:0 "Predation & Infighting"
RWC_predation_and_infighting_desc:0 "The Redwalkers refused to follow Kil'jaedens commands, and refused the offer to join the horde, they now attempt to live while beset by foes on all sides while their world decays."
RWC_Band_Of_Misfits:0 "Band of Misfits"
RWC_Band_Of_Misfits_desc:0 "The Redwalker Clan consists of orcs who don't wish to follow Gul'dan and Ner'zhul into the New World."
