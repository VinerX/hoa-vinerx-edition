###############################
#events
###############################

red_walker.1.t:0 "A Probing Raid"
red_walker.1.d:0 "Chieftan, we have been attacked, they killed many of our warriors and fled with treasures."
red_walker.1.option.1:0 "Fortify our defenses!"

red_walker.2.t:0 "Return From the Brink"
red_walker.2.d:0 "Chieftan, we have recieved news from the rest of the clan, raids within our lands have decreased greatly and in some areas have stopped completely."
red_walker.2.option.1:0 "Now to Kill the Madman!"

red_walker.3.t:0 "Devastation"
red_walker.3.d:0 "We have done what we could, but the land has become barren and the hounds are at the door."
red_walker.3.option.1:0 "By Tooth and Nail!"

red_walker.4.t:0 "The Time to Strike"
red_walker.4.d:0 "The Redwalkers have become weak over the last few years, now would be the best time to wipe them out."
red_walker.4.option.1:0 "Burn the 'Clan'"

red_walker.6.t:0 "Clan Outcasts"
red_walker.6.d:0 "Some outcasts from other Orc Clans have come to us seeking shelter in this dying world."
red_walker.6.option.1:0 "All are welcome."
red_walker.6.option.1:0 "To the Wastes!"

red_walker.7.t:0 "Exiles and Wanderers"
red_walker.7.d:0 "Exiles have arrived at our encampment, they have no where left to go."
red_walker.7.option.1:0 "All are welcome."
red_walker.7.option.1:0 "To the Wastes!"

red_walker.8.t:0 "Mad Ones"
red_walker.8.d:0 "Those who smell of demon taint has come seeking salvation."
red_walker.8.option.1:0 "All are welcome."
red_walker.8.option.1:0 "To the Wastes!"

red_walker.9.t:0 "Feathered Ones"
red_walker.9.d:0 "Some malformed Arakkoa have treked from the east, they seek a place to study and suffer in peace."
red_walker.9.option.1:0 "All are welcome."
red_walker.9.option.1:0 "To the Wastes!"

