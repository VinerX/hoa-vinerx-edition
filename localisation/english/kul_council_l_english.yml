l_english:
 # Decision category
 kul_council_category:0 "The Council of the Great Houses"
 kul_council_category_desc:0 "The Lord Admiral governs with the counsel of Kul Tiras's four Great Houses. The balance of influence between House Proudmoore, House Waycrest, House Ashvane, and House Stormsong shapes every aspect of the maritime war effort.\n\nEach decision here addresses a real military, economic, or diplomatic need — but always at the political cost of shifting the balance of power within the Admiralty."

 # Council Balance idea
 kul_council_balance_idea:0 "Council of the Great Houses"
 kul_council_balance_idea_desc:0 "The four Great Houses of Kul Tiras advise the Lord Admiral on matters of war, trade, and the fleet. Their cooperation is essential to the kingdom's survival."

 # Admiralty Stance ideas
 kul_admiralty_stance_protect_idea:0 "Protect the Sea Lanes"
 kul_admiralty_stance_protect_idea_desc:0 "The fleet is dispersed along critical convoy routes, prioritising escort and reconnaissance over concentrated offensive action."

 kul_admiralty_stance_battle_idea:0 "Seek Decisive Battle"
 kul_admiralty_stance_battle_idea_desc:0 "The Admiralty concentrates the fleet to hunt the Horde navy wherever it sails. Decisive engagement is demanded — but convoy protection suffers."

 kul_admiralty_stance_amphibious_idea:0 "Amphibious Warfare"
 kul_admiralty_stance_amphibious_idea_desc:0 "The fleet supports landing operations against enemy-held shores. Invasion planning and marine coordination are prioritised above routine fleet duties."

 # Dominance consequence ideas
 kul_dominant_proudmoore_idea:0 "Proudmoore Dominance"
 kul_dominant_proudmoore_idea_desc:0 "The Admiralty under House Proudmoore has concentrated unprecedented authority. The fleet fights with singular purpose — but the cost of maintaining offensive commitments strains the treasury and alienates the other Houses."

 kul_dominant_waycrest_idea:0 "Waycrest Dominance"
 kul_dominant_waycrest_idea_desc:0 "House Waycrest's military influence has grown to dominate the Council. The army and coastal defences are well-prepared — but dockyard resources are diverted to land fortifications, slowing fleet modernisation."

 kul_dominant_ashvane_idea:0 "Ashvane Dominance"
 kul_dominant_ashvane_idea_desc:0 "House Ashvane's commercial interests have come to dictate Admiralty procurement. Dockyards surge with activity — but the contracts come at a political price, and long-term strategic independence is eroded by the House's growing leverage."

 kul_dominant_stormsong_idea:0 "Stormsong Dominance"
 kul_dominant_stormsong_idea_desc:0 "The Tidesages' counsel now carries greater weight in the Council than operational necessity alone would demand. The fleet enjoys superb navigation, detection, and spiritual protection — but the ritual caution of the Tidesages constrains decisive offensive action."

 # Temporary idea descriptions
 kul_emergency_ashvane_contracts_idea:0 "Emergency Ashvane Contracts"
 kul_emergency_ashvane_contracts_idea_desc:0 "House Ashvane has been granted emergency authority to procure and supply the fleet at speed. Dockyard throughput surges — but the emergency premiums inflate costs and strengthen Ashvane's hold on naval procurement."

 kul_tidesage_campaign_idea:0 "Tidesage Reconnaissance Campaign"
 kul_tidesage_campaign_idea_desc:0 "The Tidesages have been asked to extend their blessing rituals and warning networks across the fleet. Enemy movements are harder to conceal — though the spiritual effort strains fleet readiness."

 kul_waycrest_mobilisation_idea:0 "Waycrest Coastal Mobilisation"
 kul_waycrest_mobilisation_idea_desc:0 "House Waycrest has mobilised the Drustvar levies and fortified the anchorages. The homeland is defended — but men and material are being drawn away from the shipyards."

 kul_admiralty_emergency_idea:0 "Admiralty Emergency Powers"
 kul_admiralty_emergency_idea_desc:0 "The Lord Admiral has assumed extraordinary authority over fleet operations. Naval coordination and strike capability are maximised — but convoy escort suffers as the fleet concentrates for battle."

 kul_fleet_dispersed_idea:0 "Fleet Dispersed to Anchorages"
 kul_fleet_dispersed_idea_desc:0 "The fleet has been scattered among fortified anchorages to deny the dragon-riders concentrated targets. Air defence is dramatically improved — but the fleet cannot coordinate large-scale offensive operations."

 kul_fortified_anchorages_idea:0 "Fortified Anchorages"
 kul_fortified_anchorages_idea_desc:0 "Ports and anchorages across Kul Tiras have been reinforced against attack. Ships under repair enjoy better protection — at the cost of dockyard throughput."

 kul_allied_escort_idea:0 "Allied Escort Commitment"
 kul_allied_escort_idea_desc:0 "Kul Tiran escorts are providing convoy protection to Alliance shipping across the Great Sea. The coalition's logistics are more secure — but fleet concentration suffers."

 kul_forward_repair_base_idea:0 "Forward Repair Base"
 kul_forward_repair_base_idea_desc:0 "A forward repair station has been established on a secured island. Damaged ships return to combat faster — but the logistics burden is considerable."

 # House Influence decisions
 kul_council_grant_ashvane_contracts:0 "Grant Ashvane Naval Contracts"
 kul_council_grant_ashvane_contracts_desc:0 "Expand House Ashvane's shipbuilding contracts to accelerate fleet construction and repair. The Ashvane shipwrights are unmatched — but their influence grows with every commission."

 kul_council_consult_tidesages:0 "Consult the Tidesages"
 kul_council_consult_tidesages_desc:0 "Seek the counsel of House Stormsong and the Tidesage Conclave. Their blessings, weather-sense, and warning networks strengthen the fleet — but institutional influence demands deference to their spiritual caution."

 kul_council_call_waycrest_levies:0 "Call the Waycrest Levies"
 kul_council_call_waycrest_levies_desc:0 "Raise additional regiments from House Waycrest's Drustvar domain. The Waycrest levies are among the finest soldiers in Kul Tiras — but each levy call shifts the military balance away from the Admiralty."

 kul_council_expand_admiralty:0 "Expand Admiralty Authority"
 kul_council_expand_admiralty_desc:0 "Concentrate operational authority under the Lord Admiral and House Proudmoore. This enables decisive naval action — but centralisation strains relations with the other houses and commits Kul Tiras to an ever more aggressive posture."

 kul_council_rebalance:0 "Rebalance the Council"
 kul_council_rebalance_desc:0 "Use political capital to reduce the influence of the dominant house and restore balance to the Council. A necessary expense when one interest begins to distort the war effort."

 # Admiralty Stance decisions
 kul_stance_return:0 "Return to Normal Disposition"
 kul_stance_return_desc:0 "Cancel the current Admiralty strategic stance. The fleet returns to a balanced peacetime posture."

 kul_stance_protect_sea_lanes:0 "Adopt Stance: Protect the Sea Lanes"
 kul_stance_protect_sea_lanes_desc:0 "Disperse the fleet to escort convoys, patrol the island chain, and maintain spotting coverage across the Great Sea. Optimum when the Sea of Blood situation is disadvantageous or convoy losses are severe."

 kul_stance_seek_battle:0 "Adopt Stance: Seek Decisive Battle"
 kul_stance_seek_battle_desc:0 "Concentrate the fleet to hunt and destroy Horde naval forces. High risk, high reward — effective when the Admiralty believes it can win a decisive engagement."

 kul_stance_amphibious:0 "Adopt Stance: Amphibious Warfare"
 kul_stance_amphibious_desc:0 "Configure the fleet for landing operations, invasion preparation, and marine support. Requires Alliance control of at least three islands in the Sea of Blood chain."

 # Emergency decisions
 kul_emergency_convoy_protection:0 "Emergency Convoy Protection"
 kul_emergency_convoy_protection_desc:0 "The convoy routes are under threat. Deploy Tidesage-blessed escorts and warning networks to protect Allied shipping."

 kul_emergency_naval_contracts:0 "Grant Emergency Naval Contracts"
 kul_emergency_naval_contracts_desc:0 "Losses demand immediate replacement. Authorise House Ashvane to procure emergency supplies and accelerate construction — at premium prices."

 kul_emergency_coastal_mobilisation:0 "Emergency Coastal Mobilisation"
 kul_emergency_coastal_mobilisation_desc:0 "Enemy forces threaten Kul Tiran territory. Order House Waycrest to fully mobilise the Drustvar levies for coastal defence."

 kul_demand_contributions:0 "Demand Contributions from the Houses"
 kul_demand_contributions_desc:0 "The treasury is strained. Invoke emergency authority to extract contributions from the Great Houses. This raises immediate funds but breeds resentment in the Council."

 # Alliance Commitment decisions
 kul_prepare_major_landing:0 "Prepare a Major Landing"
 kul_prepare_major_landing_desc:0 "The Sea of Blood is secure. Commit the fleet and marines to prepare a large-scale amphibious operation against Horde-held territory. This requires the Amphibious Warfare stance and Alliance advantage in the island chain."

 kul_escort_allied_shipping:0 "Escort Allied Shipping"
 kul_escort_allied_shipping_desc:0 "Detach escorts to protect Alliance merchant convoys. This strengthens the coalition but reduces fleet concentration for Kul Tiran operations."

 kul_disperse_fleet:0 "Disperse the Fleet"
 kul_disperse_fleet_desc:0 "Scatter the fleet among fortified anchorages to deny dragons concentrated targets. Dramatically improves air defence but cripples offensive naval coordination."

 kul_fortify_anchorages:0 "Fortify the Anchorages"
 kul_fortify_anchorages_desc:0 "Reinforce ports and coastal defences with additional anti-air batteries and bunkers. Essential when dragon raids threaten fleet infrastructure."

 kul_forward_repair_base:0 "Establish Forward Repair Base"
 kul_forward_repair_base_desc:0 "Construct a forward repair station on a secured Sea of Blood island. Damaged Alliance ships return to action faster — a major strategic investment."

 # Tooltip texts
 kul_council_dominant_proudmoore_tt_text:0 "House Proudmoore is becoming Dominant: excellent offensive naval capability, but increasing pressure for aggressive war and expensive commitments."
 kul_council_dominant_waycrest_tt_text:0 "House Waycrest is becoming Dominant: strong homeland and ground forces, but dockyard resources are being diverted to land fortifications."
 kul_council_dominant_ashvane_tt_text:0 "House Ashvane is becoming Dominant: industrial surge and rapid construction, but contract dependency and cost escalation are rising."
 kul_council_dominant_stormsong_tt_text:0 "House Stormsong is becoming Dominant: superb maritime support and resilience, but ritual caution constrains aggressive operations."

 # Event titles and descriptions
 kul_council.1.t:0 "Council Pulse"
 kul_council.1.d:0 "Council monthly update."
 kul_council.1.option.a:0 "OK"

 kul_council.2.t:0 "A House Refuses the Levy"
 kul_council.2.d:0 "The Lord Admiral has requested extraordinary contributions from the Great Houses — and one of them has refused. The refusal embarrasses the Admiralty and exposes the limits of the Lord Admiral's influence over the nobility.\n\nThe question now is how to respond: assert Admiralty authority and impose the levy by decree, call on another house to fill the gap, or accept the terms of the most commercially-minded house."
 kul_council.2.option.a:0 "Assert Admiralty authority."
 kul_council.2.option.b:0 "Call upon the Waycrest levies instead."
 kul_council.2.option.c:0 "Accept Ashvane's commercial terms."

 kul_council.3.t:0 "Blame in the Council"
 kul_council.3.d:0 "The fleet has suffered losses, and the Great Houses are looking for someone to blame. The recriminations threaten to paralyse the Council at a critical moment.\n\nHow should Daelin manage the crisis?"
 kul_council.3.option.a:0 "Rally behind the Lord Admiral. The fleet needs strength, not squabbling."
 kul_council.3.option.b:0 "Blame the shortages. Grant Ashvane the contracts they want."
 kul_council.3.option.c:0 "Consult the Tidesages. The sea warned us — we did not listen."

 kul_council.4.t:0 "The Sea of Blood Campaign Succeeds"
 kul_council.4.d:0 "The Alliance fleet has secured the island chain, and Kul Tiran seamanship has proven decisive. The victory strengthens Daelin Proudmoore's standing in the Council — but success brings its own political dangers.\n\nThe question now is who should claim credit: the Admiralty, which commanded the fleet, or the Tidesages, whose blessings guided it?"
 kul_council.4.option.a:0 "This victory belongs to the Admiralty."
 kul_council.4.option.b:0 "Acknowledge the Tidesages' role in this triumph."

 kul_council.5.t:0 "The Alliance Requests the Fleet"
 kul_council.5.d:0 "Lordaeron has formally requested that the Kul Tiran fleet be deployed to support coalition operations far from home waters. The request is a test of Alliance solidarity — but it would leave the island chain vulnerable.\n\nDaelin must choose between coalition obligation and Kul Tiran security."
 kul_council.5.option.a:0 "Send the fleet. The Alliance must come first."
 kul_council.5.option.b:0 "Keep the fleet home. Waycrest can handle the defence."
 kul_council.5.option.c:0 "Refuse outright. Kul Tiras will not be stripped of her fleet."

 kul_council.6.t:0 "The Tidesages Speak Against the Operation"
 kul_council.6.d:0 "The Tidesage Conclave has delivered an ominous warning: their readings of the sea and sky counsel against the Admiralty's planned operation. Some call it ritual caution, others divine guidance.\n\nShould Daelin heed the Tidesages or trust his own judgement?"
 kul_council.6.option.a:0 "Heed the Tidesages. Postpone the operation."
 kul_council.6.option.b:0 "Trust the Admiralty's judgement and proceed."

 kul_council.7.t:0 "The Landing Succeeds"
 kul_council.7.d:0 "The great amphibious operation has succeeded. Kul Tiran marines have established a beachhead against Horde-held territory, and the Council is alive with political calculation.\n\nThe victory reshapes who holds influence. Will the Admiralty claim the triumph, or will the ground forces who held the beaches take the credit?"
 kul_council.7.option.a:0 "The fleet delivered this victory. Proudmoore prevails."
 kul_council.7.option.b:0 "The marines held the shore. Strengthen Waycrest."

 kul_council.8.t:0 "Dragons Over the Fleet"
 kul_council.8.d:0 "Red dragons are raiding the fleet, and the Council erupts with competing proposals. Each house has a different answer to the dragonfire crisis — and the response chosen will shape Kul Tiras's strategy for years to come."
 kul_council.8.option.a:0 "Concentrate fleet anti-air and strike back. (Proudmoore)"
 kul_council.8.option.b:0 "Establish Tidesage warning networks and blessed routes. (Stormsong)"
 kul_council.8.option.c:0 "Launch an emergency replacement programme. (Ashvane)"
 kul_council.8.option.d:0 "Fortify every port and anchorage. (Waycrest)"

 kul_council.9.t:0 "The Merchants Demand Protection"
 kul_council.9.d:0 "The merchant guilds of Boralus are in uproar. Convoy losses have made every voyage a gamble, and the guild masters demand that the Admiralty provide adequate escort protection.\n\nWho should answer their demands?"
 kul_council.9.option.a:0 "Authorise the Tidesages to establish protected convoy routes."
 kul_council.9.option.b:0 "Let Ashvane build more merchantmen — they can afford the losses."
 kul_council.9.option.c:0 "The Admiralty will provide escorts from the main fleet."

 kul_council.10.t:0 "The Island Chain in Peril"
 kul_council.10.d:0 "The Sea of Blood campaign is faltering. Horde forces are seizing islands, and the chain that protects Kul Tiras from direct assault is crumbling.\n\nThe Council must decide where to commit resources immediately."
 kul_council.10.option.a:0 "Mobilise the Waycrest levies for coastal defence."
 kul_council.10.option.b:0 "Concentrate the fleet — we fight for the islands now."
 kul_council.10.option.c:0 "Give Ashvane emergency procurement authority."

 kul_council.11.t:0 "The Guilds Demand Fewer Restrictions"
 kul_council.11.d:0 "The merchant guilds of Boralus are pressuring the Council to lift wartime restrictions on trade and commerce. They argue that freer trade will bring in the revenue the war effort desperately needs — but the Admiralty fears losing control over strategic shipping."
 kul_council.11.option.a:0 "Ease restrictions. Ashvane and the guilds are right."
 kul_council.11.option.b:0 "Maintain Admiralty control. Wartime demands discipline."
