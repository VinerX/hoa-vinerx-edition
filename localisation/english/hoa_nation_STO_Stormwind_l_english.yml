 STO_wildhammer_skirmishers:0 "Alliance Skirmishers"
 STO_wildhammer_skirmishers_desc:0 "The Wildhammer and ourselves have reached an Impass with our respective foes, the Trolls have begun to counter the wildhammers slayers, as the Orcs have managed to bypass our more armoured forces. Kurdran has suggested we lend each other forces to counter the counter."

