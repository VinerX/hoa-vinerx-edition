 stormwind_third_war.1.t:0 "Stormwind Riots"
 stormwind_third_war.1.d:0 "Emerging from the ruins left by the 1st War, Stormwind has risen anew to reclaim its status as a stalwart bastion of humanity. This impressive revival is a testament to the unrelenting dedication of the Stone Masons Guild, who undertook the monumental task of rebuilding the city from the ground up. As the moment for just compensation draws near, a dark cloud of discontent hovers on the horizon. A number of nobles are openly dissatisfied with the projected costs, some even threatening to withhold payment from the guild entirely. In response to this growing tension, King Varian Wrynn has taken a proactive stance as a mediator. Addressing the concerns of both sides publicly, he endeavors to weave a tapestry of compromise that will quell the unrest and appease the conflicting interests. With his diplomatic finesse and strategic acumen, the king works diligently to chart a course that not only recognizes the unwavering efforts of the Stone Masons Guild but also addresses the apprehensions of the nobility. His goal is to establish a resolution that harmonizes Stormwind's revitalized vigor and sustains the balance between these divergent perspectives."
 stormwind_third_war.1.option.1:0 "A Brawl breaks out."

 stormwind_third_war.2.t:0 "The Aftermath"
 stormwind_third_war.2.d:0 "In the wake of the chaotic riot, a grim truth reveals itself – lives were lost, a mix of both commoners and nobles falling victim to the turmoil. Among the casualties, the tragic loss of Queen Tiffin Wrynn casts a shadow of sorrow over the situation. The days of diplomacy and peaceful discourse are resoundingly over. Driven by a potent blend of anguish and wrath, the Stone Masons guild has hastened their departure from the city, veiling themselves in apprehension of the forthcoming reckoning from King Varian Wrynn."
 stormwind_third_war.2.option.1:0 "Hunt them down."

 stormwind_third_war.3.t:0 "The Defias Brotherhood"
 stormwind_third_war.3.d:0 "Emerging once more in Westfall, the Stone Masons Guild, now under the leadership of Edwin Vancleef, has rebranded themselves as the Defias Brotherhood. With unwavering determination, they pledge to upend the established nobility in Stormwind, resolutely seeking to secure the compensation owed to them through direct and forceful means."
 stormwind_third_war.3.option.1:0 "For the King!"
 stormwind_third_war.3.option.2:0 "The Nobles Shall Pay!"

