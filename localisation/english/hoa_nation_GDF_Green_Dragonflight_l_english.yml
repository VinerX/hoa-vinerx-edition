#events
###############################

greendragonflight.1.t:0 "Whispers in the Dream"
greendragonflight.1.d:0 "The Emerald Dream stirs with unease. Druids and green dragons report unsettling visions, twisted flora, and shadowy whispers emanating from the Rift of Aln. Ysera senses a dark presence beginning to corrupt the Dream. Our kin are struggling to maintain balance, as fear creeps into their hearts"
greendragonflight.1.option.1:0 "We must endure."

greendragonflight.2.t:0 "Corruption of the Guardians"
greendragonflight.2.d:0 "The Nightmare spreads through the Emerald Dream, twisting our kin. Several dragons guarding the Great Trees in Ashenvale, Feralas, Duskwood, and the Hinterlands are showing signs of corruption, blackened scales, red growths, and erratic behavior. All the While our druid companions report weakened magic, and our flight's cohesion is faltering."
greendragonflight.2.option.1:0 "We must act to prevent it from spreading further."

greendragonflight.3.t:0 "Deepening Corruption"
greendragonflight.3.d:0 "The Emerald Nightmare's influence grows stronger, seeping deeper into the hearts of our flight. Many green dragons now exhibit signs of corruption and frenzied behavior, spreading chaos within the Emerald Dream. Our flight's unity is fracturing, and despair threatens to overwhelm our resolve."
greendragonflight.3.option.1:0 "We must Cleanse the Corruption."

greendragonflight.4.t:0 "The Nightmares Emerge"
greendragonflight.4.d:0 "The Nightmare's corruption has birthed a new terror a host of corrupted green dragons, now known as the Dragons of Nightmare. These twisted beings spread madness and decay, summoning vile plagues, spectral horrors, and chaotic energies. The Nightmare's grip tightens, and our flight's resolve crumbles under the weight of this betrayal."
greendragonflight.4.option.1:0 "Where is the Emerald Queen?"

greendragonflight.9.t:0 "Birth of the Nightmare"
greendragonflight.9.d:0 "The Emerald Nightmare has consumed the heart of the Green Dragonflight. Ysera herself, corrupted by the taint, leads our kin into darkness. The World Tree Shaladrassil is tainted, and the Rift of Aln pulses with Old God power. Our scales blacken, our forms twist, and our minds succumb to madness. We are no longer the Green Dragonflight but the Nightmare Dragonflight, agents of destruction under the old gods will."
greendragonflight.9.option.1:0 "Stewards of Nightmares."

greendragonflight.10.t:0 "That Which Made Us!"
greendragonflight.10.d:0 "The Whispers say a name, a name we do not remember, a name we feel, a voice to guide, a voice to serve."
greendragonflight.10.option.1:0 "Return from Beyond!"

greendragonflight.11.t:0 "Our Sisters Folly"
greendragonflight.11.d:0 "The Red Dragons have seen us as abominations, they do not see the world as we do, but they will, they will understand all very soon!."
greendragonflight.11.option.1:0 "Return from Beyond!"
greendragonflight.11.option.2:0 "Too Many Mouths to Feed"

