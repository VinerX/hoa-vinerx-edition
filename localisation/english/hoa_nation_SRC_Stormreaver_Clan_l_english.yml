###############################
#events
###############################
stormreaver.1.t:0 "Dawn of the Stormreavers"
stormreaver.1.d:0 "In order to escape your death, you have been entrusted with the building of a navy for the Horde. We have been warned a more closetful eye will be kept on us and many of the orcs assigned to this new clan will be loyal to Doomhammer. All is not lost however, small amounts of the Shadow Council, and new arrivals from the Shadowmoon and Draenor will make up a good portion of the clan and will prove loyal to you should you ever need them."
stormreaver.1.option.1:0 "For the Stormreavers!"
stormreaver.1.option.1.d:0 "§HThe Warchief§! grants us §Hlands§! within the §Hhuman territories§!."
stormreaver.2.t:0 "A Watchful Eye"
stormreaver.2.d:0 "While we have escaped certain death, Doomhammer has sent some of his most trusted orcs into our clan to ensure loyalty to the Horde."
stormreaver.2.option.1:0 "We must find a way to influence these Orcs to our side."

stormreaver.10.t:0 "The Warlocks Minders"
stormreaver.10.d:0 "Doomhammer has allowed Gul'dan to live, in exchange for this mercy the warlock has promised great weapons to use against the northern kingdoms, but while Gul'dan and his meger following of necrolytes try to stave off their impending demise, we have been tasked to repurpose Stormwinds dockyards to build a grand fleet for the horde."
stormreaver.10.option.1:0 "Were are the damn Ogres?"

stormreaver.20.t:0 "The Time Has Come"
stormreaver.20.d:0 "While Doomhammer and his pathetic underlings fight a war against the kingdoms of the north we will sail to the seat of power in the West, The Dragonmaws Lizards will distract the Kul'Tirans long enough for us to make land fall."
stormreaver.20.option.1:0 "Onwards to Glory"

stormreaver.21.t:0 "Our Plans Discovered"
stormreaver.21.d:0 "The Oaf has discovered our plans, it however matters little, we have already breached the Temples Walls and Soon Gul'Dan will be the most powerful being in this World."
stormreaver.21.option.1:0 "Push Forward!"

stormreaver.22.t:0 "Through Blood and Gore"
stormreaver.22.d:0 "This Temple is a Tomb, a Tomb for us! It is filled to the Brim with Demons, so many demons that many of them have begun to toy with us for fun, even Gul'dans deathknights have begun to retreat from battle with them."
stormreaver.22.option.1:0 "Why did we follow him?"

stormreaver.23.t:0 "Chase the Warlock"
stormreaver.23.d:0 "Gul'dan has showed his true colours yet again, while we battle the armies of the north he has fled like a corward, the Blacktooth have been ordered to chase him and kill him and his collaborators."
stormreaver.23.option.1:0 "Push Forward!"

stormreaver.24.t:0 "False Hope"
stormreaver.24.d:0 "After Gul'dan was torn apart by Demons we fled to the surface, only a few of us from the raid has survived the bloodshed, rushing from the tombs screaming walls we ran to the beach only to find the Blacktooth Clan slaughting our men."
stormreaver.24.option.1:0 "Die with Honor!"

stormreaver.25.t:0 "Defend Yourselves"
stormreaver.25.d:0 "We killed the Stormreavers to the Last orc, we were suprised that we did not face more warlocks, but once again we underestimated the traitor Gul'dan as demons poured forth from the Temple."
stormreaver.25.option.1:0 "Retreat to the Boats!"

stormreaver.26.t:0 "The Lost Fleet, and Humans Return"
stormreaver.26.d:0 "The Fleet we sent to chase down the Stormreaver fleet have not returned, instead the humans have, they sent boats in under the cover of a thick fog, the watchtowers were silent, those who were manning them were found dead."
stormreaver.26.option.1:0 "Cut them down!"

stormreaver.27.t:0 "Broken Orcs, Broken Chains?"
stormreaver.27.d:0 "The orcs are scrambling, something happened, Hollow Orcs are north fighting humans, Ogres are restless and farms are empty."
stormreaver.27.option.1:0 "Strike Now they weak!"
stormreaver.27.option.2:0 "Still better then human"

