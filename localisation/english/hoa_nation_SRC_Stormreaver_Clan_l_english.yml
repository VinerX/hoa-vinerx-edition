SRC_warlocks_keepers:0 "The Warlocks Keepers"
SRC_warlocks_keepers_desc:0 ""

### Horde Path - Build the Damn Fleet
SRC_sieze_the_isle:0 "The Seized Isle"
SRC_sieze_the_isle_desc:0 "Some of the Humans fled to the Isle off the coast of Stormwind, they thought we would not chase them, but their bloodied bodies say other wise. Their Knights did give us a good fight, unlike their mages."
SRC_borrowed_heads:0 "Borrowed Heads"
SRC_borrowed_heads_desc:0 "The Bleeding Hollow have been willing enough to grant us a few of their ogres, but we needed to wrangle them outselves, they may be dumb but they will break ribs like twigs."
SRC_brains_and_brawn:0 "Brains & Brawn"
SRC_brains_and_brawn_desc:0 "And here we thought Ogres were just good for lifting things, turns out almost all of them understand how to make things float and make them watertight."
SRC_raw_strength_raw_materials:0 "Raw Strength, Raw Materials"
SRC_raw_strength_raw_materials_desc:0 "When we asked them to bring us timber from the woods the numb skulls brought an entire tree, as helpful as it was they failed to notice the tree was full of Gnolls."
SRC_account_for_the_counter:0 "Account for the Counter"
SRC_account_for_the_counter_desc:0 "As easy as the Humans fled from our advance they could come back, while the fleet is still under construction the threat of a northern power bombarding us from the sea is a threat we need to account for."
SRC_formalized_partnership:0 "Formal Partnership"
SRC_formalized_partnership_desc:0 "Though there are some among the clan who do not enjoy the idea of working side by side with the Ogres, without them we would have been able to even fathom how to build great war ships"
SRC_slaves_and_nothing_more:0 "Slaves, Nothing more"
SRC_slaves_and_nothing_more_desc:0 "The Ogres know their place in the Horde, once part of a great power in our homeland we see little more then big dumb muscle."
SRC_the_doomhammer_fleet:0 "The Doomhammer Fleet"
SRC_the_doomhammer_fleet_desc:0 "While work had begun on the new horde fleet some of the more subtle members of the clan have managed use small ships to travel north to scout the seas, what we did not expect was for them to return with information of a human seafaring Kingdom, as well as quite a few merchant ships they had managed to hijack"

### Neutral Path - Keep the Humans & Peons in Check
SRC_the_warlocks_word:0 "A Warlocks Word"
SRC_the_warlocks_word_desc:0 "Gul'dan gave us the means to enter this new world, but his methods are beyond treacherous. He has given his word as an Orc that he will do what the warchief commands of him, but even so it would be best we focus on keeping the humans in line."
SRC_warlock_overseers:0 "Warlock Overseers"
SRC_warlock_overseers_desc:0 "While the number of Warlocks were cut down by the Blackrock Clan a number of them remain, we have begun to take one of them with us with every overseer patrol, their methods though limited by doomhammers ban on thier foul magics still manages to instill fear in the humans."

SRC_human_slaves:0 "Open Air Prison"
SRC_human_slaves_desc:0 "Dealing with Peons is one thing, these humans are another, a peon knows that if it disobeys us we will kick it harder then the last time, the humans keep on starting small rebellions. Maybe the Shattered Hand know how to keep them in line."

SRC_the_clans_structure:0 "Clan Command Structure"
SRC_the_clans_structure_desc:0 "Many of us are Warriors, we know the battlefield, we know planning, provisions, battlements...we do not know how to run a manage the peons other then kicking them when they dont work, unfortunatly we have had to use the cowards knowledge."

SRC_the_twilight_concern:0 "The Twilight Concern"
SRC_the_twilight_concern_desc:0 "Cho'Gall may have control over his pale minions, but the humans keep thinking that they are not savages. This is the forth time this week that a group of humans have tried to flee through the East only to be torn apart, and whats worse they keep bringing the bloodlusted bastards back to our camps."

SRC_workcamp_assignments:0 "Workcamp Assignments"
SRC_workcamp_assignments_desc:0 ""

SRC_worked_to_death:0 "Worked to Death"
SRC_worked_to_death_desc:0 "Now the Humans are more docile we can get them to do something other then complain, they no longer demand food or water, and some are even working themselves to death willingly."

SRC_iron_wrought_dominion:0 "Iron Wrought Dominion"
SRC_iron_wrought_dominion_desc:0 "While the clans fight in the north it is out duty to ensure the rear is secure, Westfall has a large coastline and is more then likely the primary target for invasion, as such we will construction a garrison in the Mines to the south."
SRC_weapons_saddles_slaves:0 "Weapons, Saddles, Slaves"
SRC_weapons_saddles_slaves_desc:0 ""

### Fel Path
SRC_seek_the_tomb:0 "Seek the Tomb"
SRC_seek_the_tomb_desc:0 "I was promised Power beyond that which a mortal had ever held, its location was within my grasp when the humans kill the puppet, now i must use other methods to discover its location."
