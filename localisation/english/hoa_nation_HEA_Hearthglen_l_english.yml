hearthglen_third_war.1.t:0 "Tirion Fordrings Trial"
hearthglen_third_war.1.d:0 "Tirion has been brought to Stratholme to stand trial for assaulting Alliance Soldiers as well as aiding an escaped Orc, Tirion told the court exactly what had happened on that day, which aligned directly with the testamony of the Soldiers he attacked. The jury Admiral Daelin Proudmoore, Arch-Mage Antonidas, Archbishop Alonsus Faol, and Prince Arthas Menethil decided that since Tirion had assaulted Alliance soldiers, he could no longer be a member of the Knights of the Silver Hand and was sentenced to exile. Uther the Lightbringer performed a ceremony to strip Tirion of his powers and sent him home to gather some supplies. As the last token of respect to his friend, Uther persuaded the jury to not exile Tirion's family, as they had no such hand in the crime."
hearthglen_third_war.1.option.1:0 "The Family is Innocent, only Tirion is guilty"

