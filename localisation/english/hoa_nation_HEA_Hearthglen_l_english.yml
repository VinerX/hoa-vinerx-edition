hearthglen.11.t:0 "Meeting of the Seven Kingdoms."
hearthglen.11.d:0 "The Kingdom of Lordearon has called a Meeting of the Seven Kingdoms, something that has not been done for a millennia, it would seem as though they are taking the threat from the Orcs to the south seriously."
