l_english:

 # Decision category
 lor_royal_court:0 "The Royal Court of Lordaeron"

 # Court orientation spirits
 LOR_royal_administration:0 "Crown Administration"
 LOR_royal_administration_desc:0 "The crown prioritizes internal administration, refugee settlement, taxation, logistics and the preservation of Lordaeron itself. The Royal Chancery and Treasury are the dominant voices at court."
 LOR_alliance_war_cabinet:0 "Alliance War Cabinet"
 LOR_alliance_war_cabinet_desc:0 "The royal court has become the operational center of coalition warfare. Allied commanders, foreign envoys and military marshals dominate council chambers as Lordaeron directs the unified war effort."
 LOR_church_mobilisation:0 "Mobilised Church Network"
 LOR_church_mobilisation_desc:0 "The crown increasingly relies on the Church of the Holy Light, clergy networks and the growing paladin movement to sustain the war effort. Archbishop Faol's influence at court now rivals that of the nobility."

 # ============================================================
 # DECISIONS
 # ============================================================

 # Convene the Royal Council
 convene_the_royal_council:0 "Convene the Royal Council"
 convene_the_royal_council_desc:0 "King Terenas summons his closest advisors вЂ” the Chancellor, the Marshal of the Alliance, the Archbishop, the Lord Treasurer and the Master of Petitions вЂ” to reassess Lordaeron's governing priorities for the war. A new court orientation will be chosen."

 # Royal Administration decisions
 expand_refugee_administration:0 "Expand the Refugee Administration"
 expand_refugee_administration_desc:0 "Appoint additional commissioners and dedicate Crown resources to settling the tens of thousands of Stormwind refugees now living in Lordaeron's northern provinces. The bureaucratic cost is high, but a stable population is the foundation of a functioning war economy."

 audit_military_requisitions:0 "Audit Military Requisitions"
 audit_military_requisitions_desc:0 "Send royal auditors to every army supply depot to root out waste, inflated contracts and hoarded goods. The generals will protest, but the treasury needs breathing room."

 preserve_the_northern_reserve:0 "Preserve the Northern Reserve"
 preserve_the_northern_reserve_desc:0 "Keep the royal reserve formations close to Capital City rather than committing them abroad. The home provinces must remain defended, even if some allies grumble."

 empower_the_royal_bureaucracy:0 "Empower the Royal Bureaucracy"
 empower_the_royal_bureaucracy_desc:0 "Expand the Royal Chancery with new clerks, scribes and tax assessors. A muscular bureaucracy can manage the kingdom's affairs more effectively, but it consumes resources itself."

 # Alliance War Cabinet decisions
 support_the_southern_front:0 "Support the Southern Front"
 support_the_southern_front_desc:0 "Dispatch reinforcements, supplies and funds to Stromgarde and the southern theatre. Every convoy that reaches Trollbane's lines strengthens the coalition вЂ” and stretches Lordaeron thinner."

 send_engineers_to_khaz_modan:0 "Send Engineers to Khaz Modan"
 send_engineers_to_khaz_modan_desc:0 "Detach royal siege engineers and sapper companies to help Ironforge and Gnomeregan break the Horde's mountain sieges. A liberated Khaz Modan means a secure southern flank."

 emergency_convoys_to_ally:0 "Emergency Convoys to an Ally"
 emergency_convoys_to_ally_desc:0 "Rush food, medicine and ammunition to a pressured coalition member. Every crate delivered is a vote of confidence in the Alliance вЂ” and another demand on Lordaeron's dwindling reserves."

 coordinate_allied_reserves:0 "Coordinate Allied Reserves"
 coordinate_allied_reserves_desc:0 "Convene the Allied Command and synchronize the coalition's strategic reserve formations for a synchronized push. This requires high alliance unity and will temporarily strain it further."

 # Church Mobilisation decisions
 organize_relief_through_parishes:0 "Organize Relief Through the Parishes"
 organize_relief_through_parishes_desc:0 "The Church's parish network reaches every village in Lordaeron. Empower the clergy to manage refugee relief and food distribution through their existing congregations."

 expand_battlefield_chaplaincy:0 "Expand Battlefield Chaplaincy"
 expand_battlefield_chaplaincy_desc:0 "Assign priests and seminarians to every regiment. The Light's presence steadies the men and speeds recovery, but every chaplain on the front lines is another voice for the Church in military affairs."

 support_the_silver_hand:0 "Support the Silver Hand"
 support_the_silver_hand_desc:0 "Provide Archbishop Faol with additional resources to expand the Knights of the Silver Hand. More paladins means more holy warriors on every front вЂ” and a permanent, politically-influential military order."

 appeal_for_sacred_contribution:0 "Appeal for a Sacred Contribution"
 appeal_for_sacred_contribution_desc:0 "In times of desperate need, the Church can call upon the faithful to contribute directly. Every congregation becomes a recruiting station and every sermon a call to arms. This will permanently strengthen the Church's political position."

 # Reactive decisions
 react_to_khaz_modan_siege:0 "Khaz Modan Under Siege"
 react_to_khaz_modan_siege_desc:0 "Reports from the mountain kingdoms are dire вЂ” Ironforge and Gnomeregan are besieged and the Horde controls the passes. The royal court must decide how to respond."

 react_to_queldorei_pressure:0 "Quel'Thalas Under Pressure"
 react_to_queldorei_pressure_desc:0 "The northern elven kingdom faces increasing pressure from the Amani and Horde forces. Though Quel'Thalas has been a reluctant ally, its fall would open Lordaeron's northern flank."

 respond_to_refugee_crisis:0 "Respond to Refugee Crisis"
 respond_to_refugee_crisis_desc:0 "The kingdom's administrative capacity is collapsing under the weight of displaced populations. A decisive response is needed before the situation becomes unmanageable."

 # ============================================================
 # TIMED IDEAS
 # ============================================================

 LOR_refugee_administration:0 "Refugee Administration Active"
 LOR_refugee_administration_desc:0 "Royal commissioners are actively settling refugees, reducing the strain on the kingdom's infrastructure."

 LOR_audited_requisitions:0 "Military Requisitions Audited"
 LOR_audited_requisitions_desc:0 "Royal auditors have uncovered waste in the military supply system, improving production efficiency at the cost of some command flexibility."

 LOR_northern_reserve_ready:0 "Northern Reserve Mustered"
 LOR_northern_reserve_ready_desc:0 "The royal reserve formations are fully prepared and positioned to defend Lordaeron's core provinces."

 LOR_empowered_bureaucracy:0 "Empowered Royal Bureaucracy"
 LOR_empowered_bureaucracy_desc:0 "The Royal Chancery has been expanded with additional clerks and authority, improving administrative throughput."

 LOR_parish_relief:0 "Parish Relief Network Active"
 LOR_parish_relief_desc:0 "The Church's parish network is managing refugee settlement and food distribution across the kingdom."

 LOR_battlefield_chaplains:0 "Battlefield Chaplaincy Expanded"
 LOR_battlefield_chaplains_desc:0 "Priests and seminarians serve with every major formation, bolstering morale and recovery through the Light."

 LOR_silver_hand_strengthened:0 "Silver Hand Strengthened"
 LOR_silver_hand_strengthened_desc:0 "Additional resources have allowed the Knights of the Silver Hand to expand their ranks and influence."

 allied_engineer_support:0 "Lordaeron Engineer Support"
 allied_engineer_support_desc:0 "Royal engineers and sappers from Lordaeron are assisting with construction and fortification."

 allied_emergency_supplies:0 "Lordaeron Emergency Supplies"
 allied_emergency_supplies_desc:0 "Emergency shipments from Lordaeron have arrived, easing supply shortages and reinforcing the front."

 # ============================================================
 # EVENTS
 # ============================================================

 # Event 1: Choose court orientation
 lor_royal_court.1.t:0 "Convene the Royal Council"
 lor_royal_court.1.d:0 "King Terenas II presides over the full Royal Council in the throne room of Capital City. Lordaeron's position demands that the crown choose its governing character for the war ahead.\n\nThe Lord Chancellor argues for focused internal administration вЂ” the kingdom must survive to lead. The Marshal of the Alliance urges a war cabinet posture вЂ” all resources bent toward coalition victory. Archbishop Faol counsels that the Church can mobilize society in ways the crown alone cannot.\n\nAs King, you must set the course."
 lor_royal_court.1.option.1:0 "Prioritize the Crown and Kingdom"
 lor_royal_court.1.option.2:0 "Rule as the Alliance's War Cabinet"
 lor_royal_court.1.option.3:0 "Mobilize Through the Church"

 # Event 2: Nobles object
 lor_royal_court.2.t:0 "Nobles Protest Foreign Commitments"
 lor_royal_court.2.d:0 "A delegation of landed nobles has arrived at court, led by several prominent lords of the Eastweald. They argue that Lordaeron's wealth and manpower are being poured into distant allies while their own estates remain vulnerable to Horde raids and the growing refugee burden.\n\nThey demand that the crown scale back its foreign commitments and redirect resources to the provinces."
 lor_royal_court.2.option.1:0 "They are not wrong вЂ” reduce some commitments"
 lor_royal_court.2.option.2:0 "The Alliance must hold. Appease them with royal patronage"

 # Event 3: Clergy offer relief
 lor_royal_court.3.t:0 "The Church Offers Relief"
 lor_royal_court.3.d:0 "Archbishop Faol presents a proposal: the Church of the Holy Light will take over the administration of refugee settlement and food distribution through its parish network. The clergy have the organizational reach that the royal bureaucracy lacks, and their work would significantly ease the strain on the kingdom.\n\nHowever, accepting this offer would place large segments of Lordaeron's population directly under Church administration вЂ” a political development that would be difficult to reverse."
 lor_royal_court.3.option.1:0 "Accept the Church's offer"
 lor_royal_court.3.option.2:0 "The Crown must retain control"

 # Event 4: Faol requests Silver Hand resources
 lor_royal_court.4.t:0 "Faol Requests Silver Hand Expansion"
 lor_royal_court.4.d:0 "Archbishop Alonsus Faol has presented a formal request to the throne: he wishes to expand the Knights of the Silver Hand with a second wave of paladin recruits. The order has proven invaluable on the battlefield, but its growth would create a permanent armed wing of the Church with significant political weight.\n\nSeveral nobles have privately warned the King that the Silver Hand may become a rival power center within the kingdom."
 lor_royal_court.4.option.1:0 "We need every paladin we can get"
 lor_royal_court.4.option.2:0 "The Church already has enough influence"

 # Event 5: Alliance command requests reinforcements
 lor_royal_court.5.t:0 "Alliance Command Requests Reinforcements"
 lor_royal_court.5.d:0 "A dispatch from the Allied Command arrives with urgent news: the coalition's position on a key front is faltering and Lordaeron is being asked to commit additional reserves to stabilize the line.\n\nThe Royal Council is divided. The Marshal argues that Lordaeron's credibility as coalition leader is at stake. The Lord Treasurer warns that the kingdom is already overextended."
 lor_royal_court.5.option.1:0 "Commit the reserves вЂ” the Alliance must hold"
 lor_royal_court.5.option.2:0 "We cannot afford further commitments"

 # Event 6: Ally praises Lordaeron
 lor_royal_court.6.t:0 "A Grateful Alliance"
 lor_royal_court.6.d:0 "A senior envoy from a coalition partner has arrived in Capital City to publicly thank King Terenas for Lordaeron's leadership. The gesture has boosted morale throughout the Alliance and reinforced the perception that Lordaeron is the indispensable heart of the coalition."
 lor_royal_court.6.option.1:0 "The Alliance stands together"

 # Event 7: Court arguments after defeat
 lor_royal_court.7.t:0 "Arguments in the Royal Court"
 lor_royal_court.7.d:0 "News of a significant military setback has sent shockwaves through the royal court. The nobility blames allied incompetence; the military command blames insufficient resources; the clergy calls for prayer and penance. King Terenas must manage the factions before the government loses coherence entirely."
 lor_royal_court.7.option.1:0 "Calm the court with measured concessions"
 lor_royal_court.7.option.2:0 "Reorganize the government вЂ” at whatever cost"

 # Event 8: React to Khaz Modan siege
 lor_royal_court.8.t:0 "The Siege of Khaz Modan"
 lor_royal_court.8.d:0 "Intelligence reports confirm that Ironforge and Gnomeregan are under severe siege. The mountain passes are controlled by Horde forces, cutting off the dwarven and gnomish kingdoms from the Alliance's direct support. The royal court must decide how to respond."
 lor_royal_court.8.option.1:0 "Send engineers and equipment south"
 lor_royal_court.8.option.2:0 "Send emergency supplies through the passes"
 lor_royal_court.8.option.3:0 "We cannot spare the resources now"

 # Event 9: React to Quel'Thalas pressure
 lor_royal_court.9.t:0 "Quel'Thalas Under Pressure"
 lor_royal_court.9.d:0 "The elven kingdom of Quel'Thalas faces mounting pressure from combined Amani and Horde forces. Though the high elves have been reluctant members of the Alliance, their collapse would threaten Lordaeron's entire northern flank.\n\nThe court debates the appropriate response вЂ” direct military support, magical liaison through Dalaran, or prioritizing Lordaeron's own defenses."
 lor_royal_court.9.option.1:0 "Send reserves north to aid the elves"
 lor_royal_court.9.option.2:0 "Coordinate through Dalaran's mages"
 lor_royal_court.9.option.3:0 "We must defend our own borders first"

 # Event 10: Refugee crisis
 lor_royal_court.10.t:0 "The Refugee Crisis Deepens"
 lor_royal_court.10.d:0 "The kingdom's administrative machinery is groaning under the relentless pressure of displaced populations. Every new wave of refugees stretches Lordaeron's capacity to house, feed and employ them. The Royal Council presents several options."
 lor_royal_court.10.option.1:0 "Expand the royal refugee administration"
 lor_royal_court.10.option.2:0 "Let the Church manage the relief effort"
 lor_royal_court.10.option.3:0 "Conscript the able-bodied вЂ” we need soldiers"
