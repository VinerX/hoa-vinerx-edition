OGR_convert_warsong_labor_desc:0 "Grommash's fall pained the Warsong beyond reason. Their shame at having drank the demon's blood is far more painful. The withdrawal that demon blood now is a greater pain than all others."

OGR_convert_dordanil:0 "Butcher the Dens"
OGR_convert_dordanil_desc:0 "The blood of elves is rich with magic. The demons will feed hungrily from this sacrifice."

OGR_convert_splintertree:0 "Burning Timbers"
OGR_convert_splintertree_desc:0 "Splintertree would be a useful staging ground for scourging the Elves from Ashenvale. Convert them."

