OGR_strange_rumors:0 "Strange Rumors"
OGR_strange_rumors_desc:0 "Whispers of unrest, and insidious plots threaten from within."

OGR_burning_blade_cultists:0 "Burning Blade Cultists"
OGR_burning_blade_cultists_desc:0 "Members of the Burning Blade infilitrate our society."

OGR_adapting_to_our_new_land_1:0 "Adapting to Our New Land"
OGR_adapting_to_our_new_land_1_desc:0 "Kalimdor is a harsh landscape with many threats. We are still foreign to this soil, but are adapting quickly."

OGR_adapting_to_our_new_land_2:0 "Adapted to Our New Land"
OGR_adapting_to_our_new_land_2_desc:0 "This land has been made our own. We will tend this soil for generations to come."

OGR_searing_blade_recruits:0 "Searing Blade Recruits"
OGR_searing_blade_recruits_desc:0 "The Searing Blade cult is mired in Ragefire Chasm in a war of the shadows with the establishment."

OGR_dark_heart:0 "Dark Heart"
OGR_dark_heart_desc:0 "Ragefire Chasm smolders with the fury of our initiates."

OGR_the_demon_seed:0 "The Demon Seed"
OGR_the_demon_seed_desc:0 "A ritual artifact of great importance and seething with fel energy"

OGR_fel_intentions:0 "Fel Intentions"
OGR_fel_intentions_desc:0 "Summoning Demons is time consuming - Try creating Fel Fire instead?"

OGR_fel_infusion:0 "Fel Infusion"
OGR_fel_infusion_desc:0 "§R"I am the rage in your heart. I am the fury of your thoughts"§!"

OGR_unified_bonds:0 "Unified Bonds"
OGR_unified_bonds_desc:0 "§RFor The Horde!§!\n Unity matters most to the members of these far flung races."

OGR_loyalty_to_warchief:0 "Loyalty to Warchief"
OGR_loyalty_to_warchief_desc:0 "A threat to the Warchief, is a threat towards the Horde."

OGR_lessons_learned:0 "Lessons Learned"
OGR_lessons_learned_desc:0 ""We gotta study what was, so we can undastand what be comin’, ya see?" - Old Umbehto "

OGR_friends_in_ratchet:0 "Friends in Ratchet"
OGR_friends_in_ratchet_desc:0 "Gazlowe helped us build this city from the ground up. Business with him has a long history of success."

OGR_blood_thunder_compassion:0 "Blood, Thunder, and Compassion"
OGR_blood_thunder_compassion_desc:0 "The Horde has found it's way through Honor, Glory, and honoring the spirits. Respect the memory of what is, and what will be."

OGR_bones_of_the_destructor:0 "Bones of the Destructor"
OGR_bones_of_the_destructor_desc:0 "The remains of the being who split our people through blood. Let his corpse serve as a reminder of those we've lost to hatred."

OGR_zeppelin_contracts:0 "Zeppelin Contracts"
OGR_zeppelin_contracts_desc:0 "We brokered a deal with the Cartel for some extra Zeppelins. The cost was too great to be permanent however."

OGR_a_journeys_start:0 "A Journeys' Beginning"
OGR_a_journeys_start_desc:0 "Trolls, and Orcs leave these grounds on an adventure that will take them across the world, to far away places... Even alternate realities."

OGR_warsong_gulch:0 "Warsong Gulch"
OGR_warsong_gulch_desc:0 "The drums of the Warsong clan fill the air as battle is joined with the Sentinels who seek to repel the Warsong Outriders."

OGR_deviate_scale_black_market:0 "Deviate Scale Black Market"
OGR_deviate_scale_black_market_desc:0 "These scales are a hot commodity on the Auction House. We decided to corner the market."

OGR_warchiefs_council:0 "Warchief's Council"
OGR_warchiefs_council_desc:0 "A wise orc listens to those who carry "

