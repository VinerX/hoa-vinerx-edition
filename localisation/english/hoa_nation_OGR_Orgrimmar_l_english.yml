OGR_korkron_guard:0 "Kor'kron Guard"
OGR_korkron_guard_desc:0 "The Kor'kron represent the elite bodyguard of the Warchief."

OGR_death_from_above:0 "Death from Above!"
OGR_death_from_above_desc:0 ""Death to all who oppose the Horde!" - Wyverns serve the horde carrying the fearless riders amidst the soaring clouds above."

OGR_fire_falling:0 "Fire Falling"
OGR_fire_falling_desc:0 "It's burning a hole in the bat rider's satchel - let's put it down over there."

OGR_flotilla_of_steel:0 "Flotilla of Steel"
OGR_flotilla_of_steel_desc:0 "It's a miracle these things even float."

OGR_spiritual_support_aboard:0 "Spiritual Support Aboard"
OGR_spiritual_support_aboard_desc:0 "Your emotional support Shaman can be found in the stern of the ship."

OGR_a_new_horde:0 "A New Horde"
OGR_a_new_horde_desc:0 "New blood fills the ranks of the Horde. Eager young adventurers of all kinds seek to make their place in this world."

OGR_helping_hand:0 "Helping Hand"
OGR_helping_hand_desc:0 "Orgrimmar represents the core of the Horde. Aid flows forth from the homeland like a rising tide."

OGR_heroes_board:0 "Heroes Board"
OGR_heroes_board_desc:0 "The Horde Needs You! - Requests for assistance flow in from all over the territories held by the Horde."

OGR_elemental_peace:0 "Elemental Peace"
OGR_elemental_peace_desc:0 "The interference of the Burning, and Searing Blade sects has been resolved. The Elements show their thanks."

OGR_shadows_rise:0 "Shadow's Rise"
OGR_shadows_rise_desc:0 "The Shadow Council held private counsel to conduct the Old Horde. We shall endeavor to do better where they failed."

OGR_converted_warriors:0 "Converted Warriors"
OGR_converted_warriors_desc:0 "§HWho can you trust?§!\nYour warriors doubt their friends, and knew their foes. Who else might fall to the sway of the Legion?"

OGR_violent_thoughts:0 "Violent Thoughts"
OGR_violent_thoughts_desc:0 "What is violence?\nJust a tool to accomplish your goals."

OGR_jergoshs_tutelage_1:0 "Jergosh's Tutelage"
OGR_jergoshs_tutelage_1_desc:0 "Jergosh the Invoker leads our new generation of Warlocks to reclaim our lost glory."

OGR_jergoshs_tutelage_2:0 "Jergosh's Tutelage"
OGR_jergoshs_tutelage_2_desc:0 "Jergosh the Invoker leads our new generation of Warlocks to reclaim our lost glory."

OGR_jergoshs_tutelage_3:0 "Jergosh's Tutelage"
OGR_jergoshs_tutelage_3_desc:0 "Jergosh the Invoker leads our new generation of Warlocks to reclaim our lost glory."

OGR_jergoshs_tutelage_4:0 "Jergosh's Tutelage"
OGR_jergoshs_tutelage_4_desc:0 "Jergosh the Invoker leads our new generation of Warlocks to reclaim our lost glory."

OGR_jergoshs_tutelage_5:0 "Jergosh's Tutelage"
OGR_jergoshs_tutelage_5_desc:0 "Jergosh the Invoker leads our new generation of Warlocks to reclaim our lost glory."

OGR_rathorians_guidance_1:0 "Rathorian's Guidance"
OGR_rathorians_guidance_1_desc:0 "The Demon Rathorian trains our warriors to match the world ending fury that the Burning Legion has mastered."

OGR_rathorians_guidance_2:0 "Rathorian's Guidance"
OGR_rathorians_guidance_2_desc:0 "The Demon Rathorian trains our warriors to match the world ending fury that the Burning Legion has mastered."

OGR_rathorians_guidance_3:0 "Rathorian's Guidance"
OGR_rathorians_guidance_3_desc:0 "The Demon Rathorian trains our warriors to match the world ending fury that the Burning Legion has mastered."

OGR_rathorians_guidance_4:0 "Rathorian's Guidance"
OGR_rathorians_guidance_4_desc:0 "The Demon Rathorian trains our warriors to match the world ending fury that the Burning Legion has mastered."

OGR_rathorians_guidance_5:0 "Rathorian's Guidance"
OGR_rathorians_guidance_5_desc:0 "Blood awaits us. The shattered bones of our foes lie at our feet, and their broken bodies form our Path to Glory."

###############################
#focus tree
###############################
OGR_teachings_of_doomhammer:0 "Teachings of Doomhammer"
OGR_teachings_of_doomhammer_desc:0 "The mythos of an orc who defined our people. Rescued us from the clutches of Gul'dan's betrayal. Let us speak of him."

OGR_legacy_of_hellscream:0 "Legacy of Grom Hellscream"
OGR_legacy_of_hellscream_desc:0 "A fierce warrior, a devoted warrior, and savior of his clan."

OGR_thrall_leadership:0 "Thrall's Leadership"
OGR_thrall_leadership_desc:0 "The new Warchief brought us to this land of barren wastes, and discovered allies aplenty. There is much to be learned from Thrall."

OGR_path_of_darkness:0 "Path of Darkness"
OGR_path_of_darkness_desc:0 "Green Skins. A slur by those pink skinned humans. A badge of honor if you ask Neeru Fireblade."

OGR_dark_proselytism:0 "Dark Proselytism"
OGR_dark_proselytism_desc:0 "A voice here, a sign in the window there, a scratched glyph for the path ahead... Many secrets can be laid bare if you know the right Master."

OGR_infilitrate_the_ranks:0 "Infiltrating the ranks"
OGR_infilitrate_the_ranks_desc:0 "Reinforcing our garrisons is only sensible. Traitors to our mission can be dealt with in due time. Preparations must be made."

OGR_sow_dissent:0 "Sow Dissent"
OGR_sow_dissent_desc:0 ""Each division sews division" We must divide Thrall's dogs so that they can not challenge our rule."

OGR_test_the_searing_blade:0 "Test the Searing Blade"
OGR_test_the_searing_blade_desc:0 "We must begin preparing our initiates for the battle to come. Their blades shall ring true, and their fury blaze with the deepest of fel fire."

OGR_train_new_warlocks:0 "Train New Warlocks"
OGR_train_new_warlocks_desc:0 "Our sects have begun bringing up a healthy collection of new Warlocks. We've begun bringing in new Imps, Voidwalkers, and Succubi."

OGR_seize_power:0 "Seize Power"
OGR_seize_power_desc:0 "The time has come. Thrall will be put to the felflame, and we shall return the Horde to it's former glory!"

OGR_dawn_of_a_new_horde:0 "Dawn of the New Horde"
OGR_dawn_of_a_new_horde_desc:0 "This Burning Horde will right the mistakes of our past. We will rise to new heights.. New Glory."

OGR_stronghold_desolace:0 "Stronghold Desolace"
OGR_stronghold_desolace_desc:0 "A sect has survived these many years out in Desolace, away from scrutinizing eyes. It is time we are made whole."

OGR_dire_magic:0 "Dire Magic"
OGR_dire_magic_desc:0 "We have received information regarding the magic of the Bleeding Hollow. We have theorized how to convert it to Fel Magic instead of Blood Magic, but it will take some trial and error."

OGR_potential_of_ragefire:0 "Potential of Ragefire"
OGR_potential_of_ragefire_desc:0 "The Caverns below held our greatest triump, and the heart of our operations. We've risen to new heights, and can now turn this space into more useful operations."

OGR_found_dreadmist_fortress:0 "Dreadmist Fortress"
OGR_found_dreadmist_fortress_desc:0 "Our stronghold in the Barrens will act as a forward staging point for our future operations in the region. A Dread Fortress to tower over these winding wastelands."

OGR_demon_seed:0 "Demon Seed"
OGR_demon_seed_desc:0 "This artifact represents a supreme power in our arsenal. Our warlocks will study this, and further their abilities to heights never dreamed even by the vaunted Shadow Council."

OGR_hellscreams_return:0 "Hellscream's Return"
OGR_hellscreams_return_desc:0 "Silence stretches in the night as the demons toil to exhume the corpse of the Legendary Grom Hellscream. A furious roar is heard for miles around as Grom rises once more."

OGR_strength_of_demons:0 "Strength of Demons"
OGR_strength_of_demons_desc:0 "The power courses through our veins like the raging felfire we summon from the Twisting Nether. We will never be less than what we make of ourselves."

OGR_path_of_honor:0 "Path of Honor"
OGR_path_of_honor_desc:0 "Thrall has given rise to a Horde of Honor. A Horde of Glory. Brothers of Blood, Battle, and Glory. §R FOR THE HORDE!§! "

OGR_recruitment_waves:0 "Recruitment Waves"
OGR_recruitment_waves_desc:0 "This world is evergrowing, and many young adventurers have risen up to find their way to the wilds."

OGR_strength_in_unity:0 "Strength in Unity"
OGR_strength_in_unity_desc:0 "The Horde has grown, with the Forsaken under the banner of the Banshee Queen, the Tauren under the Wise Cairne Bloodhoof, and the mysterious Darkspear under the enigmatic Vol'jin. We stand united in the world."

OGR_hidden_enemies:0 "Hidden Enemies"
OGR_hidden_enemies_desc:0 "Whispers creep into our peoples' hearts and fill them with poison against our Warchief. We must find the source of these rumors."

OGR_reinforce_distant_expeditions:0 "Reinforce Distant Expeditions"
OGR_reinforce_distant_expeditions_desc:0 "We have many far afield expeditions and villages for our people. We've situated ourselves well in Orgrimmar, but they must be supported if they are to thrive."

OGR_horde_cooperation:0 "Horde Cooperation"
OGR_horde_cooperation_desc:0 "We must be prepared to support our allies in all circumstances. Force of Arms, or strength of spirit."

OGR_dispose_of_neeru:0 "Dispose of Neeru"
OGR_dispose_of_neeru_desc:0 "This weasel has poisoned the water long enough. Let us wrench this corrupt tumor from the depths of Orgrimmar, and deal with his feeble cult."

OGR_victory_over_fel:0 "Victory Over Fel"
OGR_victory_over_fel_desc:0 "We've excised the weak among us who still cling to demon masters. We're left with the pure Horde. Those who fight for themselves, and the future of our people."

OGR_loyalty_to_warchief:0 "Loyalty to Warchief"
OGR_loyalty_to_warchief_desc:0 "Thrall has guided our people to heights unimaginable. We fought off the demons at Hyjal, rallied our forces to throwback"

OGR_learning_from_the_past:0 "Learning from The Past"
OGR_learning_from_the_past_desc:0 "We've transended worlds, and plundered the capitals of many kingdoms. We've got a wealth of knowledge that we must begin exploring if we are to match the others of this world."

OGR_our_friends_in_ratchet:0 "Our Friends in Ratchet"
OGR_our_friends_in_ratchet_desc:0 "Gazlowe was a good friend, and a fantastic foreman for the construction in Orgrimmar. We should pick up relations with him, and his people by extension."

OGR_theramore_accords:0 "Theramore Accords"
OGR_theramore_accords_desc:0 "Jaina Proudmoore is an honorable human, and fought at our side on the steps of Hyjal. We should reach pursue renewed interest in a peaceful solution."

OGR_blood_thunder_honor_compassion:0 "Blood, Thunder, Honor, and Compassion"
OGR_blood_thunder_honor_compassion_desc:0 "Our insidious enemies have been put to rest, and our people - Forsaken, Tauren, Troll, Orc... We all stand together."

OGR_the_ashenvale_dilemma:0 "The Ashenvale Dilemma"
OGR_the_ashenvale_dilemma_desc:0 "A bloody past lies in the Ashenvale Forest but it's resources are necessary for our fledgeling civilization to prosper."

OGR_masters_of_the_forest:0 "Masters of the Forest"
OGR_masters_of_the_forest_desc:0 "Grom was not always right, but he had the right of the fierce Night Elves. We may have stood together in the past but they pose a threat unmatched in it's severity."

OGR_continue_our_path:0 "Continue Our Path"
OGR_continue_our_path_desc:0 "We may need to step lightly, but we will hold the territory we yet claim. We will avoid what confrontation we can with the Night Elves."

OGR_peace_agreement:0 "Peace Agreement"
OGR_peace_agreement_desc:0 "We must pursue peace in Ashenvale. There are other lands we can seek lumber in, and the Elves were staunch defenders against the Legion. It would be bad blood to seek further bloodshed in their trees."

OGR_splintertree_reinforcement:0 "Splintertree Reinforcement"
OGR_splintertree_reinforcement_desc:0 "Splintertree Post is a remnant of the Warsong expansion into the forest. It is time we consolidate our forces and strengthen the garrison in the woods."

OGR_press_silverwing:0 "Press Silverwing"
OGR_press_silverwing_desc:0 "Silverwing Post represents the strongest holding of the Sentinel warriors in Ashenvale. We must strike hard, and strike fast to contain this threat. Lok'tar ogar!"

OGR_expand_lumbering:0 "Expand Lumbering"
OGR_expand_lumbering_desc:0 "Ashenvale is rich in natural resources we require to supply our settlers in these lands. The Warsong still occupy the woods and could extend their reach a little further in our controlled territory."

OGR_fruits_of_labor:0 "Fruits of Labor"
OGR_fruits_of_labor_desc:0 "The rich harvest from Ashenvale will allow for us to improve all of our holdings. We can look forward to some improvements in the general infrastructure."

OGR_barter_for_rights:0 "Barter for Rights"
OGR_barter_for_rights_desc:0 "We should seek some form of reperations for the returned lands. Perhaps we can barter for resource rights - or perhaps some acceptance towards our annexation of the region of Azshara."

OGR_past_holdings:0 "Past Holdings"
OGR_past_holdings_desc:0 "Expeditions were sent to Zoram'gar and Bloodvenom post before the peace deal was broached. We should withdraw those troops or seek to hold them."

OGR_faun_foes:0 "Faun Foes"
OGR_faun_foes_desc:0 "The satyr presence in Ashenvale stinks of demonic taint. In Grom's name we should expel these wretched beasts."

OGR_faun_friends:0 "Faun Friends"
OGR_faun_friends_desc:0 "Our infernal masters bid us to bring these devilish creatures back into the fold. We should greet them as kindred souls."

OGR_demonic_presence:0 "Demonic Presence"
OGR_demonic_presence_desc:0 "A coven was sent to bring Diathorus and his legion into the fold. The Masters decree we shall turn this place into a circle of dark importance."

OGR_demonic_interlopers:0 "Demonic Interlopers"
OGR_demonic_interlopers_desc:0 "Demons tread on sacred ground. It was here that Grom laid his life down for our people. It was here that the Demon Mannoroth was purged from this world\n\nIt was here, that he was laid to rest."

OGR_orgrimmar:0 "Orgrimmar"
OGR_orgrimmar_desc:0 "Named in honor of Orgrim Doomhammer, the city is a testament to the tenacity of the Horde. Constructed in winding canyon passages, it now contains dozens of races, multiple internal factions and a large portion of the Orc clans who settled in Durotar."

OGR_valley_of_wisdom:0 "Valley of Wisdom"
OGR_valley_of_wisdom_desc:0 "The location of Grommash Hold, and the armor of the demon Mannoroth. This place represents the seat of power for the Warchief. The name for this section attributing the trait the Warchief hopes to provide his people in these trying times."

OGR_valley_of_honor:0 "Valley of Honor"
OGR_valley_of_honor_desc:0 "The core of the Orcish Horde - Honor. This portion of the city contains the champions of the Horde, trainers for those seeking to better themselves, the wolf kennels, and many other pivotal parts of our city. "

OGR_valley_of_spirit:0 "Valley of Spirits"
OGR_valley_of_spirit_desc:0 "A place awash with the magic of many cultures. Forsaken Mages practice their arts alongside Orc shamans, Tauren Druids, and Troll Witchdoctors. A frequent stop for those hunting for more rare reagents in the Horde lands."

OGR_cleft_of_shadow:0 "Cleft of Shadow"
OGR_cleft_of_shadow_desc:0 "The underdark of Orgrimmar containing anything that doesn't exactly fit the code of ethics the newly formed Horde tries to live by. Rogues, Warlocks, and some more taboo Arcanists find themselves in these dank, dark corridors perusing goods of a dark nature."

OGR_valley_of_strength:0 "Valley of Strength"
OGR_valley_of_strength_desc:0 "The beating heart of Orgrimmar reached through the front gates. Hawkers for all sorts of goods, the auction house, the goblin bank. All the creature comforts anyone could desire in one place."

OGR_strength_and_honor:0 "Strength and Honor"
OGR_strength_and_honor_desc:0 "Safeguarding our future starts with protecting Orgrimmar against all threats. Improving the work done by the goblins during it's construction will not be simple, but in time could prove pivotal to the survival of our people."

OGR_ragefire_chasm:0 "Ragefire Chasm"
OGR_ragefire_chasm_desc:0 "A broiling pit of elemental fury located beneath the Cleft of Shadow. It is home to many elemental denizens, and recently a group of troggs has taken root in that place. Whispers of demon worshippers filling it's winding paths have trickled out, but surely the others in the Cleft of Shadows would've reported those traitors."

OGR_felfire_chasm:0 "Felfire Chasm"
OGR_felfire_chasm_desc:0 "The fire within Ragefire Chasm was turned against the non-believers who would've stopped our glorious path. Now we can re-purpose this blessed place for even more important matters."

OGR_ring_of_valor:0 "Ring of Valor"
OGR_ring_of_valor_desc:0 "A coliseum in the heart of the Valley of Honor to allow the ritualistic combat that defined our people continue. This is where the true champions are born. Many have spilt blood in the place during Mak'gora. "

OGR_cleared_chasm:0 "Cleared Chasm"
OGR_cleared_chasm_desc:0 "Ragefire stands cleared of obstacles and can now be put to use in other fashions."

OGR_thralls_fortress:0 "Thrall's Fortress"
OGR_thralls_fortress_desc:0 "Grommash Hold - the seat of power for the Orc Warchief. This place represents the strength of our people, the struggles we have faced, and the trials we can overcome by working together with the other members of the Horde. In front of it upon a dead tree lies The skull and armor of the defeated Pit Lord Mannoroth, symbolizing the freedom or the orc race."

OGR_contracts_with_cartel:0 "Contracts with Cartel"
OGR_contracts_with_cartel_desc:0 "Goblins provide a vital transportation service between the centers of power for the Horde. We should pursue additional contracts to levy support in the furthest of our holdings."

OGR_beyond_the_gates:0 "Beyond the Gates"
OGR_beyond_the_gates_desc:0 "We have risen from a past of tents and wooden watchtowers to grand battlements of stone and steel. What is next for our people?"

OGR_featherdusters:0 "Featherdusters"
OGR_featherdusters_desc:0 "The harpies inhabiting the canyon between Razorhill and Orgrimmar have disrupted supplies to the settlement. We should dispatch some warriors to deal with this threat."

OGR_quillboar_threat:0 "Quillboar Threat"
OGR_quillboar_threat_desc:0 "The Razormane Quillboar have been a thorn in our feet. Their brambles disrupt growth in the area, and their maruading activites have harmed the settlers in Durotar, and the Barrens. We should finish what we started with this threat."

OGR_bladefist_bay:0 "Bladefist Bay"
OGR_bladefist_bay_desc:0 "The port for Orgrimmar lies outside the city, but provides a vital connection for our wayward allies across the sea."

OGR_zeppelin_expansion:0 "Zeppelin Expansion"
OGR_zeppelin_expansion_desc:0 "Zeppelins represent the fastest way for us to move many troops between locations. Perhaps there is more to be discovered if we were to ply some gold to our goblin friends on the topic."

OGR_a_new_crossroads:0 "A New Crossroads"
OGR_a_new_crossroads_desc:0 "Razorhill sits between Sen'jin Village, the Den, and Orgrimmar. The growing hold would be worth investing some more resources."

OGR_clear_skull_rock:0 "Clear Skull Rock"
OGR_clear_skull_rock_desc:0 "Skull Rock has been reported to be home to demons - these tales do not inspire confidence for our merchants who arrive from the sea, and the people whisper of incompetence allowing demon worshippers to settle this close to Orgrimmar."

OGR_orc_farming:0 "Orc Farming"
OGR_orc_farming_desc:0 "Farming... An orc of your talents? - Pig farming is an honored role in Orc society from our time on Draenor. Pig's take well to any possible food and serve as a valuable resource for campaigns as they travel reasonable well. Cows were disavowed for obvious reasons after traveling to Kalimdor."

OGR_past_betrayal:0 "Past Betrayal"
OGR_past_betrayal_desc:0 "Kul'tirans represent a dark chapter in our history. Their continued garrison represents a serious threat from the island nation. It is time they return home, or water the soil."

OGR_darkspear_supported:0 "Darkspear Supported"
OGR_darkspear_supported_desc:0 "Assisting the Darkspear is a concern for Thrall as they were instrumental for our people's escape from the Sea Witch. Their support has allowed the Horde to thrive in ways unexpected, and we should return that favor."

OGR_to_tame_the_land:0 "To Tame the Land"
OGR_to_tame_the_land_desc:0 "We've risen above the challenges of Kalimdor, and have learned the ways of these shores with the help of our Allies."

OGR_den_of_beginnings:0 "Den of Beginnings"
OGR_den_of_beginnings_desc:0 "A sheltered valley to give rise to a new age for our people. Young Trolls, and Orcs venture forth from this place to find their way in the world."

OGR_land_of_kodos_and_dust:0 "Land of Kodos and Dust"
OGR_land_of_kodos_and_dust_desc:0 "The Barrens. A name fitting beyond measure as it stands arid, lifeless and filled with hostile creatures. Perfect for settling."

OGR_ventured_too_far:0 "Ventured Too Far"
OGR_ventured_too_far_desc:0 "Venture Company goons have been spotted lurking near our settlements attempting to pilfer the riches from the soil. We shall disabuse them of this notion."

OGR_motherlode_at_boulderlode:0 "Motherlode at Boulder Lode"
OGR_motherlode_at_boulderlode_desc:0 "Boulder Lode mine is a bountiful harvest of the earth, and will supply our blacksmiths with work for years to come. Send for Foreman Thazz'ril"

OGR_gifts_of_fractured_earth:0 "Gifts of Fractured Earth"
OGR_gifts_of_fractured_earth_desc:0 "The earth lies split here, gushing forth a frothy black liquid. The goblins pay a fine bounty for this resource, and some of the shipwrights claim it could be useful for crafting Juggernauts to seize the seas."

OGR_mended_earth:0 "Mended Earth"
OGR_mended_earth_desc:0 "The spirits of the earth lament the earth shattering taking place in this place. They've cast disparities at the Shaman for our vulgar treatment of this place - perhaps we should reconsider. "

OGR_crossroads_caravan_conundrum:0 "Crossroads Caravan Conundrum"
OGR_crossroads_caravan_conundrum_desc:0 "Caravans provide the majority of our resources in the barrens, and opportunities aplenty rest in the Barrens. We should consider establishing new supply lines in this place to encourage it's growth."

OGR_expand_far_watch:0 "Expand Far Watch"
OGR_expand_far_watch_desc:0 "Far Watch sits along the Barren's side of the river to Durotar. It would do well to garrison this place towards potential threats of our heartland."

OGR_groldom_investiture:0 "Grol'dom Investiture"
OGR_groldom_investiture_desc:0 "Grol'dol farms provides a large portion of the foodstuffs for our warriors in these lands. It would do well to expand their operations "

OGR_prune_thornhill:0 "Prune Thornhill"
OGR_prune_thornhill_desc:0 "Thornhill represents the quillboar stronghold in our lands. We should aggressively negotiate their relocation."

OGR_crossroads:0 "Crossroads"
OGR_crossroads_desc:0 "A legendary place situated in the Barrens known for being rife with conflict against marauding Alliance members, or challenges abound in the heat shimmered plains. Conflict seems to find this place welcoming."

OGR_dig_deeper_in_hoofload:0 "Dig Deeper in Hoofload"
OGR_dig_deeper_in_hoofload_desc:0 "Dig, a tunnel, dig, dig a tunnel\nDig a tunnel, dig, dig a tunnel\nQuick, before the hyenas come!"

OGR_razorhill_connections:0 "Razorhill Connections"
OGR_razorhill_connections_desc:0 "Connecting the Barrens to Durotar would prove a wise decisions should we need to reinforce either location rapidly."

OGR_northern_crossing:0 "Northern Crossing"
OGR_northern_crossing_desc:0 "Mor'shan represents the break betweek the Barrens and the Ashenvale woods. The end of our fully owned domain, and the temporarily Orc held lands within the lands of the Night Elves."

OGR_kolkar_menace:0 "Kolkar Menace"
OGR_kolkar_menace_desc:0 "Kolkar Centaur represent a menace for our caravens seeking the peaceful Tauren, and an affront to the Tauren struggle against them. Let us end this threat once and for all."

OGR_warsong_gulch:0 "Warsong Gulch"
OGR_warsong_gulch_desc:0 "A battlefield left from the early days of conflict between the Night Elves, and the Warsong clan. The sounds of violence drift from this place as battle is joined between the Warsong Outriders, and the Silverwing Sentinels."

OGR_clipped_witchwings:0 "Clipped Witchwings"
OGR_clipped_witchwings_desc:0 "The Witchwings inhabit a thicket in the north reaches of the barrens, that wood is needed to fortify our holdings in this area. They have rebuffed our attempts at negotiation by returning battered, broken bodies."

OGR_wailing_caverns:0 "Wailing Caverns"
OGR_wailing_caverns_desc:0 "Caverns holding a dark secret, and veridian growth of unnatural origins. We shall investigate."

OGR_peek_at_dreadmist:0 "Peek at Dreadmist"
OGR_peek_at_dreadmist_desc:0 "Dreadmist represents a conclave of demon worshipping orcs. We should consider our options on how to move forward."

OGR_exploited_northwest:0 "Exploited Northwest"
OGR_exploited_northwest_desc:0 "With the Witchwings relocated, we can begin claiming the resources in that area."

OGR_stonetalon_peak:0 "Stonetalon Peak"
OGR_stonetalon_peak_desc:0 "Stonetalon represents a winding corridor with historic purpose for our people, and the Tauren. We are interested in protecting these wilds from any threat - even if they are ghosts or disgruntled Tauren."

OGR_gold_road:0 "Gold Road"
OGR_gold_road_desc:0 "A path leading to many points across Kalimdor. Referred to as the Gold road for the vast quantities of wealth that cross it's winding paths - perhaps we can improve this so that travel is easier for our people."

OGR_warchiefs_council:0 "Warchief's Council"
OGR_warchiefs_council_desc:0 "The Warchief seeks the council of those more experienced in individual matters than he. He would do well to heed their council."

OGR_nazgrels_battle_plan:0 "Nazgrel's Battle Plan"
OGR_nazgrels_battle_plan_desc:0 "Nazgrel's desired plan is swift, unstoppable violence relying on our fast moving Wolf Riders."

OGR_worg_breeding:0 "Worg Breeding"
OGR_worg_breeding_desc:0 "Worgs are bigger, meaner beasts that could carry Orcs into the fray of battle. We should speak to our Blackrock brothers for assistance."

OGR_frostwolf_interests:0 "Frostwolf Interests"
OGR_frostwolf_interests_desc:0 "Frostwolves have garnered a reputation for their kindred companions. Perhaps there is something to be learned there?"

OGR_pillage_methodology:0 "Pillage Methodology"
OGR_pillage_methodology_desc:0 "Pillaging our enemies reduces the amount of supply we must garner for our men. Denial of those resources to the enemy is pivotal for these lightning strike campaigns Nazgrel wages."

OGR_bloodfeather_memory:0 "Bloodfeather's Memory"
OGR_bloodfeather_memory_desc:0 "Nazgrel once dispatched Rexxar to deal with the fierce Bloodfeather, a harpy matriach who plagued Orgrimmar's origins. Many lessons were learned that day, and the raiders carry nets ever since."

OGR_drekthar_tutelege:0 "Drek'thar's Tutelage"
OGR_drekthar_tutelege_desc:0 "The Farseer Drek'thar represents the last vestiges of our lost homeworld, but also the splendor of this new world. We would do well to consider his tutelage."

OGR_warsong_admiration:0 "Warsong Admiration"
OGR_warsong_admiration_desc:0 "Blademasters are weapons of destruction unmatched on the field of battle. Somehow without armor they turn into maelstroms of swinging death and biting steel. The wind streaming past leaving a haunting tune - a Warsong if you would."

OGR_blood_and_glory:0 "Blood and Glory"
OGR_blood_and_glory_desc:0 "The Horde's success can be measured in the rivers of blood spilt to carve it's place in this world."

OGR_eitriggs_indomitable_spirit:0 "Eitrigg's Indomitable Spirit"
OGR_eitriggs_indomitable_spirit_desc:0 "Eitrigg represents the spirit of our people - an unyielding force of change, fury, and above all - honor."

OGR_old_glory:0 "Old Glory"
OGR_old_glory_desc:0 "Eitrigg is a veteran of the First and Second Wars that the Orcs brought to Azeroth. He has seen triumph, defeat, and learned to navigate the crux between them."

OGR_experienced_campaigner:0 "Experienced Campaigner"
OGR_experienced_campaigner_desc:0 "Eitrigg learned much fighting wars on a large scale that is almost unimaginable for the youths of this age. His experience lends volumes towards the readiness of our warriors."

OGR_honor_bound:0 "Honor Bound"
OGR_honor_bound_desc:0 "Fighting side by side with one's brothers is the greatest honor that a warrior can feel. To know they rely on you, and the weapon in your hands is one of the strongest bonds that can be forged."

OGR_warriors_creed:0 "Warrior's Creed"
OGR_warriors_creed_desc:0 "Eitrigg knew a time when every warrior spoke oaths to their clan and chieftain. A time when warriors would choose death before dishonor on the field of battle. These pups must learn those lessons."

OGR_traditions_way:0 "Tradition's Way"
OGR_traditions_way_desc:0 "Strength of arms is only one aspect of warfare - we must study our enemy, and then devise strategies to counter their movements at large. A blind eye turned now, is a spear in the back later."

OGR_lessons_of_the_past:0 "Lesson of the Past"
OGR_lessons_of_the_past_desc:0 "The thunderous charge of the plate clad humans is a sight to behold, and still sends jolts of fear down Eitrigg's spine these days. It does give him an idea however... An Orc covered in thick plate astride a beast of battle could be a force beyond reckoning."

OGR_honor_brother:0 "Honor-Brother"
OGR_honor_brother_desc:0 "Eitrigg stands as a longtime friend to the Paladin Tirion Fordring and has learned much of the world during his hermit years."

OGR_korkron_foundation:0 "Kor'kron Foundation"
OGR_korkron_foundation_desc:0 "The Kor'kron stand guard over the Warchief and represent the best of our warriors. Blood and Honor - Duty is all"

OGR_lessons_in_blood:0 "Lesson in Blood"
OGR_lessons_in_blood_desc:0 "A price is to be paid for a lack of knowledge when it comes to War. We must endeavor to discover as much as we can."

OGR_staunch_line_of_spears:0 "Staunch Line of Spears"
OGR_staunch_line_of_spears_desc:0 "Every Orc is familier with hunting spears, but few remain who faced the pike walls of Lordaeron. A spear is a useful tool - a thicket of spears can rebuff any enemy."

OGR_warrior_blood:0 "Warrior Blood"
OGR_warrior_blood_desc:0 "Our Grunts represent the bulk of our Horde. They perform many roles within our territory from guards, to soldiers, to peacekeepers. Pivotal to the Orcish society."

OGR_shamanistic_fury:0 "Shamanistic Fury"
OGR_shamanistic_fury_desc:0 "Shamanism has returned to our people as we've reconnected with our roots. We would do well to continue this line of thought."

OGR_dark_witnesses:0 "Dark Witnesses"
OGR_dark_witnesses_desc:0 "Warlocks are responsible for many of the ill's that befell our people, but represent a power unimaginable in battle."

OGR_heavy_equipment:0 "Heavy Equipment"
OGR_heavy_equipment_desc:0 "Our capabilities regarding logistics, siege, and our mounted forces could use some scrutiny. A mobile force serves well for peacekeeping efforts or rapid response measures."

OGR_thunderous_charge:0 "Thunderous Charge"
OGR_thunderous_charge_desc:0 "The last thing our enemies will hear as our riders descend on them is §R"Lok'tar Ogar - FOR THE HORDE!"§!"

OGR_pack_instinct:0 "Pack Instinct"
OGR_pack_instinct_desc:0 "Wolves are fiercely loyal, and represent the bonds we forge between warriors. They are fitting companions, and some of the most loyal mounts. Dismounted they still pose a significant threat to our foes."

OGR_rain_of_fire:0 "Rain of Fire"
OGR_rain_of_fire_desc:0 "The groan of catapults throwing mansized boulders, pitch covered rocks, explosive casks of tar - all of these are deeply demoralizing for our enemies."

OGR_a_logistical_dilemma:0 "A Logistical Dilemma"
OGR_a_logistical_dilemma_desc:0 "A hungry Orc, is a lazy Orc. We must take care to provide the necessary resources for our soldiers to greet battle with a hearty expression."

OGR_champions_creed:0 "Champion's Creed"
OGR_champions_creed_desc:0 "The champions of the Horde have fought countless enemies, and defended our people against threats benign and demonic. They are our heroes."

OGR_blademasters_fury:0 "Blademasters' Fury"
OGR_blademasters_fury_desc:0 ""I hear and obey."\n Masters of the blade who serve the interests of the horde. A maelstrom of death we shall unleash on our enemies."

OGR_warlords_charge:0 "Warlord's Charge"
OGR_warlords_charge_desc:0 "A plate mail charge from the humans has broken the ranks of the Horde twice in their lifetimes. Perhaps those pink-skins are on to something..."

OGR_farseers_wrath:0 "Farseer's Wrath"
OGR_farseers_wrath_desc:0 "Crackling lightning will sear the flesh from bones, or their direwolves will cleave flesh with ethereal claws before the earth swallows their foes up."

OGR_denied_death:0 "Denied Death"
OGR_denied_death_desc:0 "Placeholder : Warlocks of supreme power who seek to defy the call of the grave seek the path the Death Knight. These Knights rise with sinister powers and martial skill that they lacked before the rise."

OGR_windriders_guidance:0 "Windrider's Guidance"
OGR_windriders_guidance_desc:0 "The wyverns have been stalwart companions since their rescue in the Stonetalon Mountains. Their loyalty and companionship has allowed us to rise to new heights."

OGR_where_wyverns_dare:0 "Where Wyverns Dare"
OGR_where_wyverns_dare_desc:0 "Our windriders risk the fury of the skies, and the dangers assorted with it. We should devote some resources towards our windriders and their equipment."

OGR_raining_guano:0 "Raining Guano"
OGR_raining_guano_desc:0 "Batriders carry volatile loads that could burn down an entire forest if dropped in the wrong place. These weapons will serve us well in the coming battles."

OGR_ready_the_roosts:0 "Ready the Roosts"
OGR_ready_the_roosts_desc:0 "Orgrimmar is the seat of power for the new Horde. We should consider additional roosts for our Windriders and for the adventurers who travel to the edges of our burgeoning territory."

OGR_fear_the_skies:0 "Fear the Skies"
OGR_fear_the_skies_desc:0 "Our wyvern riders will contest the skies like never before. The Alliance Gyrocopters and gryphons will meet windlance and claw before plummeting to a messy grave."

OGR_troll_fire_support:0 "Troll Fire Support"
OGR_troll_fire_support_desc:0 "Trolls seem to have a pentient for making things explode, or smolder with unnaturally hot heat. We should work with them on these designs."

OGR_under_the_red_sky:0 "Under the Red Sky"
OGR_under_the_red_sky_desc:0 "Under this sky, so shall we conquer. The Horde shall own the wind and skies, and our arrival shall be like the sound of thunder. "

OGR_tides_fury:0 "Tides' Fury"
OGR_tides_fury_desc:0 "The crashing waves serve as a line of defense against those would harm our people. We must take steps to ensure there is more than just the waves to contend with."

OGR_small_choices:0 "Small Choices"
OGR_small_choices_desc:0 "Small, nimble ships could prove useful for shore fighting or coastal issues."

OGR_juggernaught_hulks:0 "Juggernaught Hulks"
OGR_juggernaught_hulks_desc:0 "The Horde gave birth to nightmarishly large vessels of booming thunder and belching black smoke during the War. Perhaps we can find a middle ground that allows us to once again sail the seas uncontested."

OGR_fleet_of_steel:0 "Fleet of Steel"
OGR_fleet_of_steel_desc:0 "Barding our ships in iron is an expensive endeavor, but it will help us prevent immediate damage when the cannons start pounding our vessles."

OGR_goblin_schematics:0 "Goblin Schematics"
OGR_goblin_schematics_desc:0 "We should reach out to the Cartels and see if we can purchase some schematics from the Goblin Shipwrights. They provided excellent craft during the war, and their zeppelins form a critical part of our infrastructure."

OGR_second_port_of_durotar:0 "Second Port of Durotar"
OGR_second_port_of_durotar_desc:0 "With Tiraguarde cleared out, we can consider opening another port in Durotar. Razorhill already thrives with the trade crossing it's threshhold - it will practically boom once we've created a port to service the growing city."

OGR_elementalist_support_aboard:0 "Elementalist Support Aboard"
OGR_elementalist_support_aboard_desc:0 "Shamans join our fleets to bring good tides, and the blessing of Neptulon. Hail the Tidelord."

OGR_shadow_council_reborn:0 "Shadow Council Reborn"
OGR_shadow_council_reborn_desc:0 "The Shadow Council once ruled the Orcish horde through subtlety. They must understand we are the power now. The Horde will rise once again because of our dedication. Not some blithering Warchief who bleets about honor when hard decisions must be made."

OGR_jergoshs_plan:0 "Jergosh's Plan"
OGR_jergoshs_plan_desc:0 "Jergosh's devotees sit in Ragefire Chasm working towards our glorious return. We must invest more into his scheme."

OGR_coven_initiates:0 "Coven Initiates"
OGR_coven_initiates_desc:0 "We bring new members to our flock daily. Collect them and disperse them amongst the conven so that they may be sifted and found if any are worthy of time or attention."

OGR_demonic_guidance:0 "Demonic Guidance"
OGR_demonic_guidance_desc:0 "Eredar commune with our warlocks and teach new magic to our covens. We shall never fall prey to the paltry Alliance again."

OGR_soulshard_collection:0 "Soulshard Collection"
OGR_soulshard_collection_desc:0 "The actions we take as warlocks burn souls like tinder in a flame. We must endeavor to maintain a large supply of soul shards for the times to come."

OGR_communion_of_the_twisting_nether:0 "Communion of the Twisting Nether"
OGR_communion_of_the_twisting_nether_desc:0 "Our warlocks reach into the nether to divine the secrets of this dark power we use."

OGR_malevolent_champions:0 "Malevolent Champions"
OGR_malevolent_champions_desc:0 "The darkest ambitions come from those who have risen to the top, and found no grandeur to delight their gaze. These people rise to heights of violence unimaginable for others."

OGR_rathorians_charge:0 "Rathorian's Charge"
OGR_rathorians_charge_desc:0 "Rathorian's purpose is to forge the heavy shock troops of our new horde. We can not rely on demons everywhere, and it would be good to stand on our own."

OGR_foulest_blood:0 "Foulest Blood"
OGR_foulest_blood_desc:0 "Blood Magic gave birth to Dire Orcs. Fel Magic, and Fel Blood is only more potent at this process."

OGR_heralds_of_the_horde:0 "Heralds of the Horde"
OGR_heralds_of_the_horde_desc:0 "Those training under Rathorian's eye will be the first sight our enemies see. Titans of hulking orc muscle breaking their lines, and spirits."

OGR_battered_broken_brutalized:0 "Battered, Broken, Brutalized"
OGR_battered_broken_brutalized_desc:0 "The bodies left behind when the Dire Orcs break the enemy ranks is shockingly violent. There is almost nothing left to give to the demons afterwards. Nothing whole that is."

OGR_blasphemous_hearts:0 "Blasphemous Hearts"
OGR_blasphemous_hearts_desc:0 "The Dire Orcs have grown in size, fervor, and sheer carnage. Rathorian's teaching have made them more Demon than Orc."

OGR_written_in_blood:0 "Written in Blood"
OGR_written_in_blood_desc:0 "The lessons of our war will be written in blood, and scribed with broken bones. Let our enemies fear our Burning Crusade."

OGR_fury_of_the_unrestrained:0 "Fury of the Unrestrained"
OGR_fury_of_the_unrestrained_desc:0 "The demonic blood returned, our warriors grow stronger by the day. Their cultivated fury will be useful in the days to come."

OGR_furious_vanguard:0 "Furious Vanguard"
OGR_furious_vanguard_desc:0 "The Vanguard must be prepared to break the weight of the enemy assault. A hedgehog of spears is as persuasive as any when ruining an enemies hope."

OGR_demonic_rituals:0 "Demonic Rituals"
OGR_demonic_rituals_desc:0 "You must construct more ritual circles! Our capabilities are limited by the sacrifices we make, and the souls we trap for our spells."

OGR_bloodthirsty_rage:0 "Bloodthirsty Rage"
OGR_bloodthirsty_rage_desc:0 "Our warlocks have begun looking for ways to conjure the fervor we once thought was bloodlust. This Unholy Fervor they conjure now drives our warriors to inspired depths of carnal fury."

OGR_laden_equipment:0 "Laden Equipment"
OGR_laden_equipment_desc:0 "The demonic servants we conjure carry much weight, but we still must rely on carts to ferry the majority of our supplies across long distances."

OGR_by_fang_and_sword:0 "By Fang and Sword"
OGR_by_fang_and_sword_desc:0 "The tenacity of our raiders is supernatural. The rage stoking them to levels of depravity never imagined."

OGR_where_wolves_howl:0 "Where Wolves Howl"
OGR_where_wolves_howl_desc:0 "Wolves can be driven just like our fellow orcs. The magic is similar, but the Fel will twist their will to our own."

OGR_a_storm_of_hellfire:0 "A Storm of Hellfire"
OGR_a_storm_of_hellfire_desc:0 "The depths of our enemies' fear can be exposed amidst a storm of felfire raining down on their heads. Perhaps we can explore armaments with fel magic trapped in their depths."

OGR_portal_logistics:0 "Portal Logistics"
OGR_portal_logistics_desc:0 "We have contemplating forcing some of the initiates to maintain the portal for our supplies to travel freely, but the cost in blood and souls would be steep."

OGR_highest_among_us:0 "Highest Among Us"
OGR_highest_among_us_desc:0 "Who will rise highest among us. What dark despoiling shall the rise to?"

OGR_blademasters_seething_rage:0 "Blademasters' Seething Rage"
OGR_blademasters_seething_rage_desc:0 "The fury deep in the blademasters' veins crys out the frothing fervor. Let blood be spilt. This whirlwind of steel can not be tamed."

OGR_a_pale_horse:0 "A Pale Horse"
OGR_a_pale_horse_desc:0 "To serve their rider in death, many of the death knight's mounts were culled from life. What need of a beast that does not obey?"

###############################
#events
###############################
orgrimmar_classic.1.t:0 "Legacy of Hellscream"
orgrimmar_classic.1.d:0 "With the curse of bloodlust still darkening their souls, the orcs of Thrall’s new Horde struggled to break free from demonic control. At the heart of this enslavement stood Mannoroth, the pit lord whose blood had bound the orcs to his will years before. Leading the charge to liberate his people, Grommash Hellscream confronted the demon in a fateful battle deep within the forests of Ashenvale.\n\nGrom was no stranger to this curse; he had been the first to drink Mannoroth’s blood, dooming the orcs to servitude. Yet, in his final stand, Hellscream redeemed himself. With a mighty swing of his axe, Gorehowl, he struck down Mannoroth in a fierce clash that ended in a deadly explosion. Though mortally wounded, Grom’s sacrifice shattered the demon’s hold, freeing the orcs from the blood curse once and for all.\n\nAs Thrall knelt by his fallen friend, Grom’s final words reminded him that their people were no longer bound to darkness but were now free to forge their own path. His death marked the orcs’ redemption and ignited a spirit of honor and independence in the Horde, paving the way for a future unchained by demonic corruption."
orgrimmar_classic.1.option.1:0 "And yet the demon blood made us strong..."
orgrimmar_classic.1.option.2:0 "We owe him our freedom."

orgrimmar_classic.2.t:0 "Thrall's Leadership"
orgrimmar_classic.2.d:0 "Years after leading his people to the shores of Kalimdor, Thrall has forged a new future for the Horde in the rugged land of Durotar. Once enslaved by humans and bound by demonic corruption, the orcs now live free under Thrall’s vision of honor and unity. His leadership has brought together orcs, trolls, and tauren in Orgrimmar, the Horde’s capital, creating a coalition built on survival, strength, and independence.\n\nDespite his hopes for peace, tensions with the Alliance remain ever-present. Skirmishes over resources in Ashenvale spark resentment, and the fragile truce with the humans of Stormwind teeters on the brink of collapse. Though Thrall dreams of a peaceful future, he prepares the Horde for war, aware that old hatreds and rivalries are not easily set aside.\n\nAs such the young warchief has been focusing on..."
orgrimmar_classic.2.option.1:0 "...making Durotar feel like home."
orgrimmar_classic.2.option.2:0 "...war preparations."
orgrimmar_classic.2.option.3:0 "...favoring unity between Horde members."

orgrimmar_classic.3.t:0 "Neeru's Crusade"
orgrimmar_classic.3.d:0 "“Damn Thrall... his cowardice stains the Horde. To think he would dare deny the masters’ return.”\n\nNeeru Fireblade’s gaze swept across the shadowed expanse of the Cleft of Shadows, lingering on the outcasts and the forgotten. They were misfits in this so-called “new Horde,” unwanted remnants in a tide of unity forged by weakness. His eyes narrowed as they fell upon the fiery maw of Ragefire Chasm, where the Searing Blade’s cabal worked tirelessly, unraveling the fragile bonds holding this bastardized Horde together. The Darkspear would be cast aside, their kinship shattered. The Tauren would be slaughtered, their wisdom extinguished. And the Forsaken... well, the Forsaken would be buried in their graves once more. There was much to do, but far too few hands to carry the burden.\n\nThe Searing Blade was building their numbers, slowly but surely. Neeru’s coven sought warlocks willing to defy Thrall’s naive vision, practitioners unafraid to embrace their true power. They scoured the dark corners of Orgrimmar and beyond, gathering the loyal, tempting the uncertain, and plotting against the faithful servants of the Warchief. Thrall’s restrictions on demonology were a chokehold, but the time to break free was not yet upon them.\n\nPatience, Neeru reminded himself. The moment to topple the so-called Warchief would come, but only when the groundwork had been laid. For now, their task was clear: bolster their ranks, sow discord, and subvert those clinging to Thrall’s false ideals. Every act of rebellion risked discovery, each passing day a delicate balance between secrecy and survival. The false Warchief’s hounds prowled ever closer, but fear would not still Neeru’s hand. The masters’ will demanded nothing less than absolute devotion, and when that time comes, they would rise and set the Horde ablaze with unholy fury. For now however, he focused on the needs of his cabals."
orgrimmar_classic.3.option.1:0 "Smuggled Food and Materials"
orgrimmar_classic.3.option.2:0 "Soulstones and Weapons"

orgrimmar_classic.4.t:0 "Road of Glory"
orgrimmar_classic.4.d:0 "Thrall stood silently before the gnarled, weatherworn tree, its twisted branches bearing the weight of memories he could never escape. It’s visage a sickly reminder of the demon Manneroth amidst air heavy with the echoes of the past.\n\n“I have freed myself...” Grom’s voice lingered in his mind, filled with both triumph and sorrow.\n\n“No, old friend” Thrall whispered aloud. “You freed us all.”\nGrom’s sacrifice was the salvation of the Warsong Clan and the fledgling Horde, a redemption forged in fire and blood. It marked the end of the New Horde’s darkest chapter. Thrall closed his eyes, letting the bittersweet legacy settle over him. Grom’s final act of courage and honor was the foundation upon which they now stood. It was a reminder that the sins of the past, while never forgotten, would not dictate their future.\n\nThe Horde would not be bound to bloodshed like a cursed inheritance. Instead, they would strive to be a union of honor, a haven for the misunderstood and outcast. The enigmatic Darkspear Trolls, the stalwart Tauren, and even the brooding Forsaken had joined this cause, seeking survival and dignity in a world that had no place for them. Only together could they face the challenges ahead.\n\nThrall turned from the tree and walked toward Grommash Hold. Within its walls, the burdens of leadership awaited. As he entered, Eitrigg and his councilors rose to greet him, their expressions somber.\n\n“Warchief,” Eitrigg began, “we have much to discuss.”\n\nThe reports were grim. Quilboar raids pushed deeper into Horde lands, threatening their fledgling settlements. Centaur bands harried travelers in Durotar and the Barrens, while Ashenvale teetered on the brink of chaos, tensions with the Night Elves flaring like sparks in the night. Worse still, dark rumors of demon-worshipping covens whispered through the Horde’s ranks, a chilling reminder that the darkness of the Shadow Council still lingered. Thrall listened intently, his face a mask of resolve. The Horde was fractured, its people scattered across Kalimdor and the Eastern Kingdoms, searching for purpose and a place to call home. He weighed the council’s advice carefully, each decision a step toward either survival or ruin. Dispatching orders for…"
orgrimmar_classic.4.option.1:0 "Honored Memories"
orgrimmar_classic.4.option.2:0 "Cry of the Warsong"

orgrimmar_classic.5.t:0 "Rally the Horde!"
orgrimmar_classic.5.d:0 "Our wayward allies are in need of our aid. If the Horde is to endure, we must support one another. Orgrimmar, the heart of this coalition, stands as a symbol of unity and strength. It is from here that we can marshal the resources necessary to assist our allies in their struggles, solidifying the bonds of kinship and mutual survival.\n\nThe Forsaken pose the greatest challenge. Their isolation in the shadowed corners of Lordaeron makes any effort to support them a costly and dangerous endeavor. Yet their contribution to the Horde is undeniable; they have given us alchemical wonders and a foothold in the Eastern Kingdoms. To neglect them would be to risk alienating Sylvanas and her people, a fracture the Horde cannot afford. We must find ways to alleviate their plight—be it through covert supply lines, the bolstering of their defenses, or diplomatic overtures to neighboring factions that might allow for less perilous trade routes.\n\nThe Darkspear dwell close to Orgrimmar, their small but resilient tribe thriving in the Senjin Village. Yet, their position is precarious with Zalazane’s Betrayal. If we aid them in securing their territory, the Darkspear will flourish as a vital part of the Horde’s future.\n\nThe Tauren of Mulgore stand on more stable ground. Cairne’s leadership has brought his people a measure of peace and security, but even the vast plains of their homeland are not without strife. Quilboar encroach on their lands, threatening their settlements, and Cairne himself seeks to address lingering disputes and challenges to their way of life. He speaks often of leaving behind a legacy of peace and wisdom for young Baine, a future where the Tauren’s noble traditions can thrive unthreatened. Their warriors are proud and strong, but there is much we could do to ease their burdens and strengthen our ties with them—whether through arms, supplies, or simply standing in solidarity against their foes\n\nIf this Horde is to last, we must not act as distant overlords. Instead, we must show that this is a coalition of equals, bound by honor and the shared desire to survive in a world that would see us undone. Aid must be given with care, prioritizing those in the gravest need but never forgetting the contributions and sacrifices of each people.\n\nFor now, we should consider…"
orgrimmar_classic.5.option.1:0 "Ambitions of State first"
orgrimmar_classic.5.option.2:0 "Send Veteran Commanders"
orgrimmar_classic.5.option.3:0 "Contribute Military Goods"
orgrimmar_classic.5.option.4:0 "Contribute to Civilian Interests"

orgrimmar_classic.6.t:0 "A Snake in our Midst."
orgrimmar_classic.6.d:0 "The depths of despair are rarely hidden from those standing on death’s doorstep. Neeru Fireblade knelt forcibly in front of the assembled audience in Grommash Hold, the weight of his crimes pressing down upon him. Disgust etched itself onto the faces of many as they recognized the warlock and his treachery.\n\n“Death is the penalty for the path you have chosen, Neeru Fireblade,” Thrall declared, his voice cutting through the murmurs in the room. “Your cowardly cabals and covens will cease to exist. The Horde will not be tainted further by insidious demons and their vile machinations.”\nSilence followed as Thrall’s words hung heavy in the air.Neeru raised his head, a sneer curling his lips. His voice, though hoarse, carried defiance.\n\n“I challenge Mak’gora.”\n\nThrall’s expression remained stoic as he answered, his tone laced with disdain. “You hold no honor, Neeru. But if it is Mak’gora you seek, then we will settle this outside in view of another demon’s failure. What rules do you seek - if any?”\nNeeru barked a mad laugh, his grin feral. “My magic against yours, Warchief. Let your people see the elements abandon you.”\nThrall nodded gravely, signaling the Kor’kron to escort Neeru outside. The warlock was handed a gnarled staff and left in his ragged clothing, the garb of a orc who had forsaken his kin. Across from him stood Thrall, Doomhammer in hand, his stance resolute.\nNeeru’s hands crackled with green fel fire as he muttered incantations under his breath. The staff in his grip withered and turned to ash as flames writhed from his fingers, coiling like serpents. With a flick of his hand, the fel fire surged toward Thrall in a torrent.\n\n“Storm, Earth, and Fire - heed my call!\n\nThrall’s voice carried the weight of the elements, and the ground answered. A barrier of stone erupted before him, absorbing the onslaught. From the heavens, a lance of lightning struck, battering Neeru to the ground. The fel fire in his hands faltered, shifting to a volatile orange hue that began to consume him, burning his flesh from within.\n\nNeeru’s screams filled the valley as Thrall advanced, Doomhammer gripped tightly in his hand. The warlock writhed, consumed by his own power, but his defiance remained etched in his gaze. “We will never be slaves to our blood again,” Thrall intoned, his voice steady. “May the ancestors pity your soul.” With a sickening crunch, the Doomhammer came down, shattering Neeru’s skull."
orgrimmar_classic.6.option.1:0 "The Snake's Head"

orgrimmar_classic.7.t:0 "Amidst the Woods"
orgrimmar_classic.7.d:0 "The verdant forests of Ashenvale, teeming with life and brimming with nature’s bounty, have long drawn the Horde’s gaze. The Warsong Lumber Camp, a reminder of that ambition, began as a simple gathering mission at Thrall’s behest. Yet what unfolded was a nightmare of bloodshed and sorrow, scarring the Warsong Clan and leaving behind a legacy of regret.\n\nNow, as the Horde expands beyond Durotar and the Barrens, we once again find ourselves at the edge of these shaded woods. The Battle of Mount Hyjal has granted us a tenuous reprieve; our presence in Ashenvale is tolerated—but only barely. The Night Elf Sentinels remain vigilant, rebuffing every attempt we make to gather resources. Our caravans are harried, our efforts met with arrows and steel. This fragile truce cannot endure much longer. A decision must be made.\n\nOutright war with the Sentinels would be a grave mistake. The Alliance watches us with suspicion, eager for any excuse to marshal their forces. Should we provoke the Night Elves, their cries for aid will summon the full might of the Alliance, plunging the Horde into a conflict we cannot afford. The scars of Hyjal are still fresh; our people are not yet ready to face such devastation again.\n\nOne alternative lies to the east, in Azshara. These untamed lands hold their own dangers, but their resources remain largely unclaimed. Perhaps we could relinquish Ashenvale to the Night Elves, seeking their blessing in exchange for their promise not to interfere with our efforts in Azshara. By respecting their glades and ceasing our incursions into their sacred forests, we may yet find a path to coexistence.\n\nPerhaps we may yet prevail in Ashenvale and fought them back from our current holdings. Encroach no further towards the town of Astranaar, but drive them from the woods surrounding Splintertree and the Warsong Lumber Camp. We could then state it is our original territory should the Alliance clamor about the aggression.\n\nWe barely survived the Legion’s onslaught at Hyjal. Why risk the desolation of our people once more? The Horde must tread carefully. Whether we fight, negotiate, or seek new lands, our choice will shape not only our survival but the future of all in the Horde."
orgrimmar_classic.7.option.1:0 "Pursue War in Ashenvale"
orgrimmar_classic.7.option.2:0 "Settle the Status Quo"
orgrimmar_classic.7.option.3:0 "Broker Peace for Alternate Claim"

orgrimmar_classic.8.t:0 "The Warsong Returns"
orgrimmar_classic.8.d:0 "After many days of council with his closest advisors and representatives from across the Horde, Thrall arrived at a grim but necessary conclusion: there could be no lasting peace if the Night Elves refused to recognize the Horde’s claim to Ashenvale. The scars of past conflicts ran too deep, the mistrust too entrenched, for their peoples to coexist in such contested lands. Every arrow loosed from the shadowed woods, every caravan harried on the winding paths, only reinforced the futility of reconciliation under the current terms.\n\nThrall’s generals presented a bold plan - a decisive strike to seize Ashenvale’s forests and secure its resources. The proposal was not without its cost or its risks, but it carried a clear objective: to establish the Horde’s dominion over Ashenvale while relocating any remaining Kaldorei to the borders of Darkshore. The Horde’s ambitions, they insisted, would not extend beyond the ancient boughs of Ashenvale.\n\nThe choice was now left to the Night Elves: they could withdraw peacefully and acknowledge the Horde’s rightful claim, or they could continue their resistance and face the might of a united Horde.\n\n“The Kaldorei may choose to leave in peace,” Thrall declared, his voice firm with resolve. “But our claim to these lands will not be ignored.”"
orgrimmar_classic.8.option.1:0 "Blood and Glory await us"
orgrimmar_classic.8.option.2:0 "Will we never escape our past?"

orgrimmar_classic.9.t:0 "The Boughs of Ashenvale"
orgrimmar_classic.9.d:0 "The story of Ashenvale’s exploitation began with the Warsong Clan, but it embodies the price of our people’s survival and prosperity. The lumber gathered from its ancient forests has become the lifeblood of our fledgling nation, providing the essential materials to construct our homes, fortify our defenses, and carve a future for generations yet to come.\n\nYet, this contested land remains rife with challenges. The Night Elf Sentinels continue to defy our presence, and the region harbors numerous other threats. To secure Ashenvale for the Horde, we must take decisive action.\n\nOur efforts will focus on driving back the Sentinels and asserting our claim over the land. In addition, we must confront the Satyr menace encroaching on our borders, clear out the hostile wildlife that endangers our settlers, and reclaim the sacred burial site of Grom Hellscream—restoring it as a place of honor befitting his sacrifice.\n\nThe future of the Horde depends on our ability to tame these wilds and ensure that Ashenvale serves as a foundation for our people’s enduring strength."
orgrimmar_classic.9.option.1:0 "Button 1"
orgrimmar_classic.9.option.2:0 "Button 2"

orgrimmar_classic.10.t:0 "Peace in our Time"
orgrimmar_classic.10.d:0 "Ashenvale stands as a place of tragedy in our shared history - a land where Grom Hellscream clashed with the Sentinels and the demigod Cenarius. These events sowed the seeds of the enmity between us and the Night Elves, leaving scars that linger to this day. Yet if there is to be a future where our peoples do not remain locked in endless border conflict, there must be peace.\n\nTrue peace is rarely achieved without compromise. No side leaves an agreement entirely satisfied, but it is a path we must pursue. To avoid the constant threat of bloodshed, we must consider alternatives. Moving our efforts to Azshara offers one option, while the unclaimed lands of Feralas to the southwest present another - provided the Night Elves agree to end hostilities and allow us to develop these regions without interference.\n\nLet us take the first step. An emissary should be sent to Darkshore to open discussions, seeking terms for a withdrawal from Ashenvale in exchange for a future unclouded by war. This will not be easy, but it is a chance to shape a path forward where both our peoples can endure and thrive."
orgrimmar_classic.10.option.1:0 "Seek interests in Azshara"
orgrimmar_classic.10.option.2:0 "Journey to Feralas through Desolace"

