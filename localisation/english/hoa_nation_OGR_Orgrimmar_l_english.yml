orgrimmar_classic.19.t:0 "Teachings of Doomhammer"
orgrimmar_classic.19.d:0 "  After Blackhand’s failure to conquer Stormwind during the First War, Orgrim Doomhammer seized control of the Old Horde, conquering Stormwind where his predecessor failed.\nUpon taking command, he enacted an outright ban on fel magic, striving to return the Horde to its former traditions and values. Under Doomhammer’s leadership, the Horde rallied and came close to overwhelming the Northern nations of the Eastern Kingdoms.\nHowever, their momentum was shattered when Gul'dan's betrayal cost them a significant portion of their army. The weakened Horde retreated to Blackrock Spire, where they faced the forces of Anduin Lothar in a decisive battle. Lothar fell to Doomhammer's mighty blow, but his death ignited a ferocious rally led by Turalyon. With newfound fury, the Alliance forces pushed the Horde to defeat.\n\n   The once-mighty orcs were captured and sent to internment camps, and Doomhammer himself became a captive, a curiosity in the court of Lordaeron. Twice he escaped his captors, only to live in exile as a hermit.\nYears later, through the shaman Drek’thar, Doomhammer met a young orc named Thrall, son of the deceased chieftain of the Frostwolves, Durotan. Together they reignited the hope of their people which they led in a campaign to free the orcish clans from their prisons.\nDuring one such battle, Doomhammer was struck down by a lance through his back. Mortally wounded, he passed leadership to Thrall.\n\nWith Doomhammer's passing, he entrusted the legendary weapon, the Doomhammer, to Thrall along with the future of their people."
orgrimmar_classic.19.option.1:0 "For Doomhammer!"

