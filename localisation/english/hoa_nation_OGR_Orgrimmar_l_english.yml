OGR_convert_valley_of_strength_desc:0 "Our blood slayed demi-gods while blessed. What else could we do?"

OGR_convert_valley_of_spirits:0 "Blind the Spirits"
OGR_convert_valley_of_spirits_desc:0 "Spirits speak of what they should not. Silence them so we are not revealed."

OGR_convert_valley_of_wisdom:0 "Subvert the Wise"
OGR_convert_valley_of_wisdom_desc:0 "Eyes watching Thrall could prove pivotal."

OGR_convert_valley_of_honor:0 "Honor is for the Living"
OGR_convert_valley_of_honor_desc:0 "Honor led our people to this shattered wasteland. We left a land ripe for conquest for this?!"

OGR_convert_dranoshar:0 "Schism the Gate Guard"
OGR_convert_dranoshar_desc:0 "Having influence with the guards could prove useful for secreting supplies in at night."

OGR_convert_rocktusk:0 "Convince Farmers"
OGR_convert_rocktusk_desc:0 "Imagine as many peons as you want, but they actually work. Speak to a warlock near you."

OGR_convert_bladefist:0 "Ambitions at Sea"
OGR_convert_bladefist_desc:0 "Bladefist Bay opens many doors to our coven. We can start bringing in our members from abroad."

OGR_convert_thunder_ridge:0 "Conclave in the Ridge"
OGR_convert_thunder_ridge_desc:0 "Fizzle Darkclaw already teaches from this ravine. Reach out to him."

OGR_convert_tiragarde:0 "Fortifications in Place"
OGR_convert_tiragarde_desc:0 "Tiragarde may be built by humans but it's fortifications could prove useful if our gambit is discovered."

OGR_convert_razorhill:0 "Coven in Razorhill"
OGR_convert_razorhill_desc:0 "Razorhill possesses a strategic location. They must join our flock."

OGR_convert_razorhill_outskirts:0 "Reach out to Settlers"
OGR_convert_razorhill_outskirts_desc:0 "Withering in this wasteland - they are but lambs to be brought back to the flock."

OGR_convert_margoz_camp:0 "Dispose of Margoz"
OGR_convert_margoz_camp_desc:0 "Margoz knows too much. Silence the worthless Shaman before he reveals the coven at Skull Rock"

OGR_convert_deadeye_shore:0 "Private Gatherings at the Shore"
OGR_convert_deadeye_shore_desc:0 "This stretch holds places secluded from sight. We could train here."

OGR_convert_morshan:0 "Divide Mor'shan"
OGR_convert_morshan_desc:0 "Gateway to Ashenvale - it would do well to convince some that this place wouldn't exist if we had succeeded in Ashenvale."

OGR_convert_sludge_fen:0 "Broken Earth"
OGR_convert_sludge_fen_desc:0 "Disaster at the hands of those goblins - Damn Thrall for working with them."

OGR_convert_boulder_lode:0 "Miner Difficulties"
OGR_convert_boulder_lode_desc:0 "Who wants to toil underneath the earth all day? Imps don't need pay or food."

OGR_convert_hoof_load:0 "Sacrificial Den"
OGR_convert_hoof_load_desc:0 "We could rally demons to this place for the battles to come."

