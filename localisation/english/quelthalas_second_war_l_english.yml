###############################
# Quel'Thalas Second War Focus Tree
###############################

QUE_sw_farstrider_legacy:0 "Farstrider Legacy"
QUE_sw_farstrider_legacy_desc:0 "The Farstriders are Quel'Thalas's finest rangers — master archers and scouts who have defended our borders since the Troll Wars. Their traditions have kept the realm safe for millennia. In these darkening times, we must renew our commitment to the Farstrider way and ensure the ranger corps is ready for whatever threat may come."

QUE_sw_queldanas_trade:0 "Quel'Danas Trade"
QUE_sw_queldanas_trade_desc:0 "The Isle of Quel'Danas is the crown jewel of elven commerce. Its harbors welcome ships from every corner of the Eastern Kingdoms, carrying goods, gold, and knowledge. By investing in trade infrastructure, we ensure prosperity flows into Silvermoon — prosperity we will need if war comes to our shores."

QUE_sw_anasterians_reticence:0 "Anasterian's Reticence"
QUE_sw_anasterians_reticence_desc:0 "King Anasterian Sunstrider has ruled Quel'Thalas for over three thousand years. His wisdom is unmatched, but age breeds caution. The old king views the Horde's war as a human affair — a distant trouble best met with distance. Many in the Convocation agree. Why bleed for kingdoms that mean nothing to the high elves?"

QUE_sw_silvermoons_isolation:0 "Silvermoon's Isolation"
QUE_sw_silvermoons_isolation_desc:0 "The high elves have always kept apart from the younger races. Our magic, our cities, our very way of life are beyond their comprehension — and beneath their notice. The Horde may ravage the human kingdoms, but Quel'Thalas is protected by the Runestones and the Ban'dinoriel. Why should we intervene in the squabbles of lesser beings?"

QUE_sw_monitoring_the_border:0 "Monitoring the Border"
QUE_sw_monitoring_the_border_desc:0 "The Amani trolls have been quiet since the Troll Wars, but silence from Zul'Aman is never peaceful — it is preparation. Farstrider patrols report increased troll activity near the borderlands. Hunting parties, war drums, strange rituals dedicated to the Loa. We must watch them closely, or risk being caught unaware as our ancestors were."

QUE_sw_old_oath_to_thoradin:0 "The Old Oath to Thoradin"
QUE_sw_old_oath_to_thoradin_desc:0 "Over two thousand years ago, King Thoradin of Arathor came to the aid of the high elves when the Amani threatened to annihilate us. In gratitude, we swore an oath — one that the Sunstrider dynasty has never formally revoked. Lordaeron is the successor to Thoradin's throne, and now the descendants of Arathor face annihilation once more. Honour demands we remember what we owe."

QUE_sw_council_of_silvermoon:0 "Council of Silvermoon"
QUE_sw_council_of_silvermoon_desc:0 "The Convocation of Silvermoon convenes in the Sunfury Spire to debate the crisis. Anasterian presides with cool detachment while the magisters argue in circles. Kael'thas Sunstrider, the prince, watches the proceedings with barely concealed frustration. The kingdom is divided between those who would honour the ancient oath and those who would retreat behind the Runestones. A decision must be reached."

QUE_sw_allerias_defiance:0 "Alleria's Defiance"
QUE_sw_allerias_defiance_desc:0 "Ranger-General Alleria Windrunner has heard enough of the Convocation's endless debates. While Anasterian dithers and the magisters scheme, orcs march toward the Thandol Span and the Amani sharpen their axes. Alleria will not wait for permission from a king who pretends the fire will not spread to his own roof. She gathers a company of her finest Farstrider volunteers and prepares to march south — with or without the Sunstrider's blessing."

QUE_sw_the_debt_of_arathor:0 "The Debt of Arathor"
QUE_sw_the_debt_of_arathor_desc:0 "The Convocation has spoken: Quel'Thalas will honour its ancient debt to the line of Thoradin. Envoys are dispatched to Lordaeron bearing the Crown of the Sun's pledge of friendship — warriors, arcanists, and the promise that the high elves stand with humanity as humanity once stood with them. History does not forget, and neither do the elves."

QUE_sw_kaelthas_pragmatism:0 "Kael'thas's Pragmatism"
QUE_sw_kaelthas_pragmatism_desc:0 "Prince Kael'thas Sunstrider occupies an impossible position. He respects his father's caution but cannot ignore the broader strategic reality — a Horde victory over the human kingdoms would leave Quel'Thalas encircled and alone. The prince begins to quietly build alliances with the more forward-thinking magisters, advocating for a position his father will not publicly endorse: modernise, arm, and prepare, even if we do not commit."

QUE_sw_detect_the_amani_threat:0 "Detect the Amani Threat"
QUE_sw_detect_the_amani_threat_desc:0 "Farstrider scouts return with grim news. The Amani are not merely preparing — they are allying. War drums echo from Zul'Aman, and troll emissaries have been seen travelling south toward the Horde encampments. Zul'jin has waited centuries for this moment. If the Amani join forces with the Horde, Quel'Thalas will face a war on two fronts — and we are not ready."

QUE_sw_windrunner_rangers:0 "The Windrunner Rangers"
QUE_sw_windrunner_rangers_desc:0 "Alleria Windrunner's defiance has galvanised the Farstrider corps. Young rangers flock to her banner, inspired by her courage and her refusal to watch from the shadows while the world burns. The Windrunner name has always carried weight in Quel'Thalas — now it carries an army. Trained by the finest ranger in elven history, these volunteers will become the tip of the spear."

QUE_sw_alliance_membership:0 "Alliance Membership"
QUE_sw_alliance_membership_desc:0 "The Alliance of Lordaeron extends an invitation that will test the very soul of Quel'Thalas. To join is to commit our armies, our mages, and our fate to a human-led coalition. To refuse is to stand alone before the Horde. The Convocation's vote will shape the destiny of our people for generations. There is no middle path — only the choice between trust and isolation."

QUE_sw_modernize_elven_army:0 "Modernize the Elven Army"
QUE_sw_modernize_elven_army_desc:0 "For three thousand years the elven military has relied on ranger patrols and magical superiority. The Horde's legions are not raiding parties — they are an industrialised war machine that has crushed Stormwind and threatens Ironforge itself. Our tactics, our equipment, our very conception of warfare must evolve. The age of the ranger alone is ending. The age of the elven army must begin."

QUE_sw_reinforce_the_runestones:0 "Reinforce the Runestones"
QUE_sw_reinforce_the_runestones_desc:0 "The Runestones that form the Ban'dinoriel — the great arcane barrier protecting Quel'Thalas — have stood for millennia, but they were built to repel troll warbands, not the disciplined armies of the Horde. Magisters across the realm are dispatched to reinforce the stones with fresh enchantments. Every glyph renewed, every ward strengthened, is another day that Silvermoon remains untouched."

QUE_sw_ranger_defense_network:0 "Ranger Defense Network"
QUE_sw_ranger_defense_network_desc:0 "Alleria's rangers establish a network of observation posts, hidden caches, and ambush positions throughout the southern forests. No Amani raiding party will slip through unseen; no Horde scout will return to their camp. The woods of Quel'Thalas, once merely beautiful, become a hunter's web — and every invader is prey."

QUE_sw_token_fleet:0 "A Token Fleet"
QUE_sw_token_fleet_desc:0 "Quel'Thalas has never been a naval power — our coast is small, our interests landbound. But the Convocation sees the political necessity of at least a symbolic maritime presence. A handful of elven destroyers, crewed by rangers seconded to the sea, will sail to join the Alliance fleet. It is a gesture, nothing more — but sometimes a gesture is all that politics requires."

QUE_sw_full_fleet_mobilization:0 "Full Fleet Mobilization"
QUE_sw_full_fleet_mobilization_desc:0 "The token approach is an insult to our allies and a danger to ourselves. If Quel'Thalas is to stand with the Alliance, we will do so with full commitment. The Crown commissions a proper elven battle fleet — warships built to elven specifications, crewed by the finest mariners our people can produce. The Sunstrider banner will fly at sea as proudly as on land."

QUE_sw_arcane_warfare_doctrine:0 "Arcane Warfare Doctrine"
QUE_sw_arcane_warfare_doctrine_desc:0 "The magisters of Silvermoon have spent millennia studying magic as an art. Now they must study it as a science of war. Arcane barriers to protect our troops, massed fireballs to break enemy formations, polymorph magic to neutralise enemy champions — every spell in the elven repository must be weaponised. Our mages will become the deadliest force on any battlefield."

QUE_sw_burning_of_the_borderlands:0 "Burning of the Borderlands"
QUE_sw_burning_of_the_borderlands_desc:0 "The drums of Zul'Aman have fallen silent — and that silence is more terrifying than any war cry. At dawn, the Amani horde emerges from the forests. Axes stained with Loa-blood, war cries that shake the very runestones, and the hatred of a people who have waited three thousand years for this moment. The southern borderlands of Quel'Thalas erupt in flame. The Second War has come to the elven homeland."

QUE_sw_lorthemar_secures_pass:0 "Lor'themar Secures the Pass"
QUE_sw_lorthemar_secures_pass_desc:0 "With Alleria gone south, command of the home defense falls to her trusted lieutenant, Lor'themar Theron. He identifies the narrow mountain passes as the key defensive choke point — if the Amani break through here, the road to Silvermoon lies open. Lor'themar fortifies the pass with haste, turning it into a killing ground that even the berserkers of Zul'Aman will find impassable."

QUE_sw_elves_on_the_front:0 "Elves on the Front"
QUE_sw_elves_on_the_front_desc:0 "The High Elves fight. Not from the shadows, not from behind runestones, but shoulder to shoulder with human footmen and dwarven riflemen on the blood-soaked fields of Lordaeron. Spells streak overhead while rangers pick off Horde officers from the treeline. The younger races stare in disbelief as the aloof elves of Quel'Thalas bleed in the mud alongside them. The Alliance is no longer an abstraction — it is a brotherhood forged in fire."

QUE_sw_spellbreaker_corps:0 "The Spellbreaker Corps"
QUE_sw_spellbreaker_corps_desc:0 "The Horde brings warlocks — twisted spellcasters wielding fel energies that corrupt and destroy. Conventional mages cannot counter such darkness alone. The Spellbreaker order, long relegated to ceremonial duties, is expanded into a full combat corps. Armed with glaives that disrupt magic and shields that absorb enemy spells, they are the antidote to the Horde's arcane corruption."

QUE_sw_repel_the_amani:0 "Repel the Amani"
QUE_sw_repel_the_amani_desc:0 "The Amani have burned our villages, desecrated our shrines, and dared to set foot on elven soil. No more. The full might of Quel'Thalas turns southward — rangers, magisters, and spellbreakers advancing in a coordinated offensive. Zul'jin's horde will be driven back across the border. And this time, the elves will not stop at the edge of the forest."

QUE_sw_hold_the_elrendar:0 "Hold the Elrendar"
QUE_sw_hold_the_elrendar_desc:0 "The Elrendar River marks the ancient boundary between Quel'Thalas and the Ghostlands. Its waters have long separated civilisation from wilderness — now they must separate life from death. Lor'themar establishes a fortified line along the riverbank. Every bridge is guarded, every ford is watched, and every troll who tries to cross will find an arrow waiting."

QUE_sw_shared_sacrifice:0 "Shared Sacrifice"
QUE_sw_shared_sacrifice_desc:0 "The war has cost Quel'Thalas dearly. Elven blood soaks foreign soil, elven families mourn their fallen, and elven cities have felt the shadow of war for the first time in living memory. But the humans mourn too, and the dwarves, and the gnomes. The shared grief of the Alliance has created something stronger than any treaty — a bond that will endure long after the last orc is driven back."

QUE_sw_sunwells_blessing:0 "The Sunwell's Blessing"
QUE_sw_sunwells_blessing_desc:0 "The Sunwell, heart of elven civilisation, has never been merely a source of power — it is the soul of our people. In this hour of need, the magisters perform the Rite of Illumination, channelling the Sunwell's radiant energy into every elf who fights for Quel'Thalas. Those touched by the blessing report heightened senses, faster reflexes, and a warmth that pushes back the darkness of doubt. The Sunwell protects its children."

QUE_sw_secure_quelthalas:0 "Secure Quel'Thalas"
QUE_sw_secure_quelthalas_desc:0 "The Amani are broken, their attacks repelled, their armies scattered. But the border can never again be left undefended. Permanent garrisons are established in the southern reaches, watchtowers are raised along every approach, and the rangers maintain a constant vigil. Quel'Thalas will never again be surprised by the trolls of Zul'Aman. Our vigilance is now eternal."

QUE_sw_farstriders_glory:0 "The Farstriders' Glory"
QUE_sw_farstriders_glory_desc:0 "The Farstriders have proven themselves the equal of any army on Azeroth. From the shadowed forests of Quel'Thalas to the burning fields of Lordaeron, from the mountain passes of Khaz Modan to the rescue of Stormwind's refugees, the rangers in green have become legends. Songs are sung of Alleria Windrunner's daring and Lor'themar Theron's steadfast defense. The Farstriders are no longer a mere patrol force — they are heroes of the Second War."

###############################
# Events
###############################

quelthalas_second_war.1.t:0 "Alleria Defies the Council"
quelthalas_second_war.1.d:0 "The Convocation of Silvermoon has debated the Horde threat for days — and reached no decision. Anasterian Sunstrider counsels caution to the last, but Alleria Windrunner can no longer abide the delay. She rises in the grand chamber, her voice cutting through the murmurs like an arrow through silk. 'I will not watch from the safety of the Runestones while the world burns. My rangers march south at dawn — with or without the Crown's blessing.' The chamber erupts in chaos as the Ranger-General strides out, her Farstriders falling into formation behind her. Anasterian does not give chase. But he does not stop her either."
quelthalas_second_war.1.option.1:0 "Let her go. Let her fight."

quelthalas_second_war.2.t:0 "The Amani Threat"
quelthalas_second_war.2.d:0 "The scouts' reports can no longer be dismissed. Amani war parties have been seen moving with discipline and purpose, not the chaotic raids of a disorganised tribe. Worse still, our agents report troll emissaries returning from Horde camps bearing gifts and promises. Zul'jin has allied with the orcs — the ancient enemy of Quel'Thalas now has the backing of the most dangerous military force Azeroth has ever seen. The Convocation's complacency evaporates. The elves are no longer debating whether to fear the Amani, but how to survive them."
quelthalas_second_war.2.option.1:0 "Prepare the defenses. The old enemy returns."

quelthalas_second_war.3.t:0 "The Fleet Debate"
quelthalas_second_war.3.d:0 "The Alliance has requested naval support from Quel'Thalas, and the Convocation is deeply divided. The traditionalists argue that Quel'Thalas has never been a seafaring nation — our strength lies on land, in the forests, behind the Runestones. The Alliance faction counters that Lordaeron expects a contribution from every member state, and that sending even a token naval force would demonstrate solidarity without overcommitting our limited maritime resources. In the end, the decision falls to the Crown."
quelthalas_second_war.3.option.1:0 "Dispatch a symbolic fleet. It costs us little and earns much goodwill."
quelthalas_second_war.3.option.2:0 "The sea is not our battlefield. Send nothing."

quelthalas_second_war.4.t:0 "The Council of Silvermoon"
quelthalas_second_war.4.d:0 "The Sunfury Spire blazes with magical light as the Convocation of Silvermoon convenes for what may be the most consequential session in elven history. Anasterian Sunstrider sits upon the Phoenix Throne, his ancient eyes betraying nothing. Prince Kael'thas stands to his right, barely able to contain his impatience. Grand Magister Belo'vir speaks for the isolationists — 'We survived the Troll Wars alone, we shall survive this.' But others are not so certain. The Amani ally with the orcs. Lordaeron calls for aid. The Runestones feel the tremors of war before the first axe falls. Silvermoon must decide: stand apart, or stand together."
quelthalas_second_war.4.option.1:0 "Quel'Thalas stands alone, as it always has."
quelthalas_second_war.4.option.2:0 "The world has changed. We must change with it."

quelthalas_second_war.5.t:0 "A Debt Honoured"
quelthalas_second_war.5.d:0 "A delegation of elven dignitaries arrives in Lordaeron's throne room bearing gifts of enchanted steel and arcane-crafted scrolls. They kneel before King Terenas Menethil and speak the ancient words — the same words spoken by the high elves to Thoradin of Arathor over two millennia ago. The oath of gratitude, passed from the hands of a dying human king into elven memory, is now being honoured by his spiritual descendants. Quel'Thalas will fight alongside Lordaeron, not as a subject but as an equal. Terenas's eyes glisten as he raises the elven envoy to their feet. 'The blood of Arathor remembers,' he says quietly. 'The blood of Sunstrider does not forget,' the envoy replies."
quelthalas_second_war.5.option.1:0 "The ancient alliance is reforged."

quelthalas_second_war.6.t:0 "The Borderlands Burn"
quelthalas_second_war.6.d:0 "It begins not with a declaration of war but with smoke on the horizon. Amani war parties pour across the Thalassian border, their axes wreathed in dark Loa magic, their war cries carrying names of vengeance three thousand years unfulfilled. Villages burn. Farstrider outposts are overrun before they can send word. The enchanted forests of southern Quel'Thalas, untouched by war since the Troll Wars, are turned to ash beneath Amani feet. Zul'jin's voice echoes across the land: 'The elves took our forests. We will take their heads.' Quel'Thalas is under attack. The Second War has reached the High Kingdom."
quelthalas_second_war.6.option.1:0 "Sound the alarm. Every elf to arms."
