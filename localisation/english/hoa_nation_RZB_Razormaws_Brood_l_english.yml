RZB_Aftermath_Of_Wyrmscar:0 "Remains of Loreth'Aran"
RZB_Aftermath_Of_Wyrmscar_desc:0 "After the Black Dragonflight force, led by Razormaw, destroyed the city of Loreth'Aran and all other life on Wyrmscar Isle. The ghostly Razormaw continues to haunt its scarred battlegrounds, killing all who come close." 
