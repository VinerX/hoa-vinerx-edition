RZB_razormaw:0 "Razormaw"
POLITICS_RAZORMAW_DESC:0 "Razormaw was sent to the Silvergale isle during the Dragon Wars at Deathwing’s behest to silence the Dragon Riders of Loreth’Aran. The Black Dragonflights' battle with the Green Dragonflight left the land burnt, sundered and aflame amidst the piles of Dragon corpses. Razormaw did not escape this battle alive, but the hatred that filled his life still haunts him in death as his spectral form circles the island endlessly."
