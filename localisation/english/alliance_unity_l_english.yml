l_english:
 # ----------------------------------------------------------
 # TIER 1: Disintegrating Coalition (0–19)
 # ----------------------------------------------------------
 alliance_unity_disintegrating:0 "Alliance Unity: Disintegrating Coalition"
 alliance_unity_disintegrating_desc:0 "The Alliance is barely holding together. Distrust, competing priorities, and a lack of coordination make collective action nearly impossible. Armies refuse to share intelligence, supply lines are contested, and no one is certain who will stand when the Horde strikes next."

 # ----------------------------------------------------------
 # TIER 2: Divided Alliance (20–39)
 # ----------------------------------------------------------
 alliance_unity_divided:0 "Alliance Unity: Divided Alliance"
 alliance_unity_divided_desc:0 "The member realms have agreed to cooperate in principle, but their commitments remain cautious and uneven. Joint planning is hampered by hesitation and political infighting, though outright collapse is not yet a threat."

 # ----------------------------------------------------------
 # TIER 3: Fragile Cooperation (40–59)
 # ----------------------------------------------------------
 alliance_unity_fragile:0 "Alliance Unity: Fragile Cooperation"
 alliance_unity_fragile_desc:0 "Shared danger and sustained diplomacy are gradually turning the Alliance into a functional coalition. The nations coordinate when necessary, but deep trust and seamless cooperation remain elusive."

 # ----------------------------------------------------------
 # TIER 4: United Alliance (60–79) — country-specific
 # ----------------------------------------------------------
 alliance_unity_united_lordaeron:0 "United Alliance: Lordaeron Leads"
 alliance_unity_united_lordaeron_desc:0 "With strong leadership and growing trust among its allies, Lordaeron has become the political and logistical heart of the Alliance. Planning is swift, supply lines are efficient, and the coalition responds as one."

 alliance_unity_united_kultiras:0 "United Alliance: Grand Fleet Coordinated"
 alliance_unity_united_kultiras_desc:0 "Kul Tiras has fully integrated its naval power into the Alliance war effort. The Grand Fleet escorts allied convoys, blockades Horde ports, and prepares amphibious landings with unprecedented coordination."

 alliance_unity_united_dalaran:0 "United Alliance: Kirin Tor Mobilized"
 alliance_unity_united_dalaran_desc:0 "The Kirin Tor shares arcane intelligence and magical expertise freely with Alliance commanders. Protective wards shield key territories, and Dalaran's research accelerates the coalition's technological edge."

 alliance_unity_united_stromgarde:0 "United Alliance: Stromgarde Holds"
 alliance_unity_united_stromgarde_desc:0 "Stromgarde's veteran armies fight with renewed resolve, their defensive expertise and rapid reinforcement capability becoming the shield of the northern front."

 alliance_unity_united_quelthalas:0 "United Alliance: Farstrider Network"
 alliance_unity_united_quelthalas_desc:0 "Quel'Thalas has committed its ranger corps to the Alliance. Farstrider reconnaissance provides unmatched intelligence, while elven troops defend the heartland with legendary skill."

 alliance_unity_united_gilneas:0 "United Alliance: Gilneas Committed"
 alliance_unity_united_gilneas_desc:0 "Gilneas has abandoned its isolation. Its industry churns out war materiel, and its stubborn defenders anchor the Alliance's western flank with grim determination."

 alliance_unity_united_stormwind:0 "United Alliance: Stormwind's Vengeance"
 alliance_unity_united_stormwind_desc:0 "The survivors of Stormwind fight with righteous fury. Their desire to reclaim their homeland has become a rallying cry that inspires the entire Alliance."

 alliance_unity_united_gnomeregan:0 "United Alliance: Gnomish Engineering Corps"
 alliance_unity_united_gnomeregan_desc:0 "Gnomeregan's brilliant engineers deploy advanced prototypes across the front. Their industry runs at full capacity, feeding the Alliance war machine with innovative weapons and vehicles."

 alliance_unity_united_ironforge:0 "United Alliance: Ironforge Industry"
 alliance_unity_united_ironforge_desc:0 "Ironforge's forges burn day and night. Dwarven steel and mountain-trained defenders form an unbreakable barrier, while their industrial output supplies the entire Alliance."

 alliance_unity_united_generic:0 "United Alliance"
 alliance_unity_united_generic_desc:0 "The nations of the Alliance coordinate their war efforts with growing trust and effectiveness."

 # ----------------------------------------------------------
 # TIER 5: Unbreakable Front (80–100) — country-specific
 # ----------------------------------------------------------
 alliance_unity_unbreakable_lordaeron:0 "Unbreakable Front: Lordaeron Commands"
 alliance_unity_unbreakable_lordaeron_desc:0 "The Alliance has become a true united front. Lordaeron wields coalition authority with confidence — every realm contributes its strength, every plan is coordinated, and the full might of the Alliance moves as a single fist."

 alliance_unity_unbreakable_kultiras:0 "Unbreakable Front: The Seas Are Ours"
 alliance_unity_unbreakable_kultiras_desc:0 "Kul Tiras dominates the waves. The Grand Fleet operates with perfect coordination, Horde shipping is strangled, and amphibious operations strike anywhere along the coast with devastating speed."

 alliance_unity_unbreakable_dalaran:0 "Unbreakable Front: Arcane Supremacy"
 alliance_unity_unbreakable_dalaran_desc:0 "The Kirin Tor has achieved full magical integration with Alliance forces. Arcane barriers shield entire fronts, intelligence flows instantly between commanders, and Dalaran's greatest minds have turned the tide of the war."

 alliance_unity_unbreakable_stromgarde:0 "Unbreakable Front: Stromgarde Unbroken"
 alliance_unity_unbreakable_stromgarde_desc:0 "Stromgarde has become the Alliance's immovable bulwark. Their warriors stand shoulder to shoulder with allies, their reinforcement network is flawless, and their battle plans set the standard for every allied army."

 alliance_unity_unbreakable_quelthalas:0 "Unbreakable Front: Elven Precision"
 alliance_unity_unbreakable_quelthalas_desc:0 "Quel'Thalas fights as an integral part of the Alliance. Elven rangers coordinate strikes with dwarven infantry and human cavalry in perfect harmony, their ancient skill complementing the coalition's raw power."

 alliance_unity_unbreakable_gilneas:0 "Unbreakable Front: Gilneas Unyielding"
 alliance_unity_unbreakable_gilneas_desc:0 "Gilneas has become a cornerstone of the Alliance. Its factories operate at peak efficiency, its soldiers refuse to yield ground, and its contribution to the war effort is second to none."

 alliance_unity_unbreakable_stormwind:0 "Unbreakable Front: Stormwind Rising"
 alliance_unity_unbreakable_stormwind_desc:0 "The spirit of Stormwind burns brighter than ever. Refugees have become soldiers, exiles have become liberators, and the determination to reclaim their kingdom inspires the entire Alliance to fight without rest."

 alliance_unity_unbreakable_gnomeregan:0 "Unbreakable Front: Gnomish Ingenuity Unleashed"
 alliance_unity_unbreakable_gnomeregan_desc:0 "Gnomeregan's engineers have been given full Alliance support to deploy their most ambitious projects. Prototype weapons roll off assembly lines, and gnomish technology has become a decisive advantage on every front."

 alliance_unity_unbreakable_ironforge:0 "Unbreakable Front: Khaz Modan Unbreakable"
 alliance_unity_unbreakable_ironforge_desc:0 "The mountain kingdom operates at full military-industrial capacity. Dwarven steel arms every Alliance soldier, and Ironforge's mountain passes have become impregnable strongpoints that anchor the entire coalition."

 alliance_unity_unbreakable_generic:0 "Unbreakable Front"
 alliance_unity_unbreakable_generic_desc:0 "The Alliance of Lordaeron fights as a single, unstoppable force. Every nation contributes its full strength, and the coalition has become greater than the sum of its parts."

 # ----------------------------------------------------------
 # Unity change events — titles and descriptions
 # ----------------------------------------------------------
 alliance_unity_events.1.t:0 "The Alliance Welcomes a New Member"
 alliance_unity_events.1.d:0 "A new realm has pledged its strength to the Alliance of Lordaeron. Every fresh commitment tightens the bonds between nations and brings the coalition closer to a truly united front."

 alliance_unity_events.2.t:0 "A Realm Turns Away"
 alliance_unity_events.2.d:0 "A nation that was counted on has refused to fully commit to the Alliance. The hesitation is felt across the coalition — if one member can waver, others may wonder whether their own sacrifices are worth it."

 alliance_unity_events.3.t:0 "Betrayal!"
 alliance_unity_events.3.d:0 "A trusted ally has turned against the Alliance, stabbing the coalition in the back at the worst possible moment. The shockwave of this betrayal threatens to tear apart the bonds that hold the Alliance together."

 alliance_unity_events.4.t:0 "Lothar Has Fallen"
 alliance_unity_events.4.d:0 "Anduin Lothar, the Lion of Stormwind and Supreme Commander of the Alliance, has fallen in battle. His death strikes the coalition like a hammer blow. Soldiers weep openly, generals doubt their plans, and the light of hope flickers. The Alliance has lost its greatest champion."

 alliance_unity_events.5.t:0 "Turalyon Rallies the Alliance"
 alliance_unity_events.5.d:0 "In the darkest hour, a new leader has risen. Turalyon, Lothar's most trusted lieutenant, has taken the fallen commander's broken sword and lifted it high. His words ignite a fire that spreads through every camp — grief transforms into righteous fury, and the Alliance remembers why it fights."

 alliance_unity_events.6.t:0 "The Horde Splinters"
 alliance_unity_events.6.d:0 "Gul'dan has abandoned the Horde, taking the Stormreaver and Twilight's Hammer clans with him. The Orcish war effort fractures as Doomhammer redirects forces to hunt the traitor. This is the moment of weakness the Alliance has been waiting for."

 alliance_unity_events.7.t:0 "Aiding a Besieged Ally"
 alliance_unity_events.7.d:0 "An Alliance realm is under heavy attack. The decision to send meaningful reinforcements — or to preserve reserves — will shape the coalition's future."

 alliance_unity_events.8.t:0 "An Ally Capitulates"
 alliance_unity_events.8.d:0 "An Alliance nation has been overwhelmed by the Horde. The remaining members of the coalition are shaken — if one can fall, who might be next?"

 # ----------------------------------------------------------
 # Unity event option texts
 # ----------------------------------------------------------
 alliance_unity_events.1.a:0 "Welcome to the Alliance."
 alliance_unity_events.2.a:0 "So be it. We will manage without them."
 alliance_unity_events.3.a:0 "This treachery will be remembered."
 alliance_unity_events.4.a:0 "The Lion... is dead."
 alliance_unity_events.5.a:0 "For Lothar! For the Alliance!"
 alliance_unity_events.6.a:0 "This is our chance. Press the advantage."
 alliance_unity_events.6.b:0 "We are too battered to exploit this."
 alliance_unity_events.7.a:0 "Send everything we can spare. ($COST$ PP)"
 alliance_unity_events.7.b:0 "We must preserve our strength."
 alliance_unity_events.8.a:0 "This is a dark day for the Alliance."

 # ----------------------------------------------------------
 # Timed ideas
 # ----------------------------------------------------------
 alliance_unity_turalyon_inspiration:0 "Turalyon's Rally"
 alliance_unity_turalyon_inspiration_desc:0 "The Paladin's words have transformed grief into fury. Soldiers who wept an hour ago now march with grim determination — for Lothar, for Stormwind, for the Alliance."

 alliance_unity_counteroffensive_window:0 "Window of Opportunity"
 alliance_unity_counteroffensive_window_desc:0 "The Horde has splintered. Gul'dan's betrayal has thrown the enemy into disarray — this is the moment the Alliance has been waiting for. Strike now, while the Orcs are divided."
