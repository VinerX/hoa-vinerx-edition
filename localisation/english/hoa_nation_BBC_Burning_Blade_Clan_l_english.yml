 BBC_cyclones_of_rage_desc:0 "The Blade Masters of the Burning Blade are known for their fanatic devotion to perfecting their mastery of war, These skilled swordsmen could focus their warrior energies to become living cyclones of rage, spinning their blades faster than the naked eye could see, or channel their potent powers in one focused strike to cause even greater damage."

