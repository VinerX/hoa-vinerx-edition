burning_blade.1.t:0 "Blackrock Taskmasters"
burning_blade.1.d:0 "Despite the ban of fel magic and the execution of many warlocks, many in our clan are still easily succumbed to the bloodrage and can lose control of themselves. While Dustbelcher ogres have done a good job of keeping these orcs in check, the Warchief believes he will need these legendary soldiers in order to defeat the alliance, and as such is taking more precautions."
burning_blade.1.option.1:0 "As he commands"

burning_blade_third_war.1.t:0 "Traitors"
burning_blade_third_war.1.d:0 "We have caught a number of warriors attempting to flee from our lands, they have attempted to sail west to join Thrall's 'New Horde'."
burning_blade_third_war.1.option.1:0 "Put them to the Blade"

